name: deploy-prod

on:
  push:
    tags: ["prod-*"]
  workflow_dispatch:

# podo-database-schema applies to prod on merge with no approval gate, because
# its review happens in the PR. Curriculum is different: a bad deck is visible to
# a learner mid-class and there is no equivalent of a lint that catches it. So
# prod is a deliberate tag, and the `prod` environment can carry reviewers.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    # The org enforces an IP allow list, so GitHub-hosted runners cannot even
    # check out. day1-runner-respeak is also inside the network, which is what
    # lets apply reach grape at *.podo.internal at all.
    runs-on: day1-runner-respeak
    timeout-minutes: 20
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: refuse a tag that is not on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not an ancestor of main — prod only ships reviewed content"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r tools/requirements.txt

      # validate.py refuses --contract without a key rather than letting an auth
      # rejection read as a clean pass, so decide here whether we can ask for it.
      # Every other layer runs either way.
      - name: validate
        run: |
          if [ -n "$PODO_LEMONBOARD_API_KEY" ]; then
            python3 tools/validate.py --contract --env prod
          else
            echo "::warning::PODO_LEMONBOARD_API_KEY_PROD is not set — running without the data-sync contract check"
            python3 tools/validate.py --env prod
          fi
        env:
          PODO_LEMONBOARD_API_KEY: ${{ secrets.PODO_LEMONBOARD_API_KEY_PROD }}

      - name: plan
        run: |
          echo '## Applying to prod' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/plan.py --env prod >> "$GITHUB_STEP_SUMMARY"

      # The sync endpoint does not exist yet (docs/sync-contract.md). Until the
      # token is configured, report the plan and stop cleanly rather than failing
      # every push against an endpoint nobody has built — a permanently red
      # pipeline is one people stop reading.
      - name: apply
        run: |
          if [ -z "$PODO_CURRICULUM_SYNC_TOKEN" ]; then
            echo "::notice::PODO_CURRICULUM_SYNC_TOKEN is not set — the grape sync endpoint is not live yet. Plan only."
            {
              echo '## Plan only — sync endpoint not configured'
              python3 tools/plan.py --env prod
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 tools/apply.py --env prod
        env:
          PODO_CURRICULUM_SYNC_TOKEN: ${{ secrets.PODO_CURRICULUM_SYNC_TOKEN }}

      - name: commit the state lock
        if: always()
        run: |
          if git diff --quiet -- state/; then
            echo "state unchanged"; exit 0
          fi
          git config user.name  "podo-curriculum[bot]"
          git config user.email "podo-curriculum@users.noreply.github.com"
          git add state/
          git commit -m "chore(state): record prod apply for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
