name: validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r tools/requirements.txt

      # --contract calls lemonboard's own validator. It fail-opens on network
      # trouble and 5xx, so an outage there cannot block a PR — only a real
      # data-sync violation does.
      - name: validate
        run: python3 tools/validate.py --contract --env stage
        env:
          PODO_LEMONBOARD_API_KEY: ${{ secrets.PODO_LEMONBOARD_API_KEY_STAGE }}

      - name: plan
        id: plan
        run: |
          {
            echo 'body<<PLAN_EOF'
            echo '### Curriculum plan — `stage`'
            echo
            python3 tools/plan.py --env stage
            echo
            echo '_Merging runs this against stage. Prod needs a `prod-*` tag._'
            echo 'PLAN_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: comment the plan
        uses: actions/github-script@v7
        with:
          script: |
            const body = process.env.PLAN_BODY;
            const marker = '### Curriculum plan';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            // Rewrite our own comment rather than stacking a new one per push.
            const mine = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body });
            }
        env:
          PLAN_BODY: ${{ steps.plan.outputs.body }}
