name: validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    # The org enforces an IP allow list, so GitHub-hosted runners cannot even
    # check out. day1-runner-respeak is also inside the network, which is what
    # lets apply reach grape at *.podo.internal at all.
    runs-on: day1-runner-respeak
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r tools/requirements.txt

      # --contract calls lemonboard's own validator, which fail-opens on network
      # trouble and 5xx — an outage there cannot block a PR, only a real
      # data-sync violation does. validate.py refuses --contract without a key
      # rather than letting an auth rejection read as a clean pass, so decide
      # here whether we can ask for it. Every other layer runs either way.
      - name: validate
        run: |
          if [ -n "$PODO_LEMONBOARD_API_KEY" ]; then
            python3 tools/validate.py --contract --env stage
          else
            echo "::warning::PODO_LEMONBOARD_API_KEY_STAGE is not set — running without the data-sync contract check"
            python3 tools/validate.py --env stage
          fi
        env:
          PODO_LEMONBOARD_API_KEY: ${{ secrets.PODO_LEMONBOARD_API_KEY_STAGE }}

      - name: plan
        id: plan
        run: |
          {
            echo 'body<<PLAN_EOF'
            echo '### Curriculum plan — `stage`'
            echo
            python3 tools/plan.py --env stage
            echo
            echo '_Merging runs this against stage. Prod needs a `prod-*` tag._'
            echo 'PLAN_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: comment the plan
        uses: actions/github-script@v7
        with:
          script: |
            const body = process.env.PLAN_BODY;
            const marker = '### Curriculum plan';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            // Rewrite our own comment rather than stacking a new one per push.
            const mine = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body });
            }
        env:
          PLAN_BODY: ${{ steps.plan.outputs.body }}
