name: deploy-stage

on:
  push:
    branches: [main]
    paths:
      - "courses/**"
      - "shared/**"
      - "curriculum.yaml"
      - "tools/**"
  workflow_dispatch:

# One deploy at a time. Two concurrent applies would race on the state lock and
# the loser's row ids would be lost — which means duplicate courses next run.
concurrency:
  group: deploy-stage
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    # The org enforces an IP allow list, so GitHub-hosted runners cannot even
    # check out. day1-runner-respeak is also inside the network, which is what
    # lets apply reach grape at *.podo.internal at all.
    runs-on: day1-runner-respeak
    timeout-minutes: 20
    environment: stage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r tools/requirements.txt

      # validate.py refuses --contract without a key rather than letting an auth
      # rejection read as a clean pass, so decide here whether we can ask for it.
      # Every other layer runs either way.
      - name: validate
        run: |
          if [ -n "$PODO_LEMONBOARD_API_KEY" ]; then
            python3 tools/validate.py --contract --env stage
          else
            echo "::warning::PODO_LEMONBOARD_API_KEY_STAGE is not set — running without the data-sync contract check"
            python3 tools/validate.py --env stage
          fi
        env:
          PODO_LEMONBOARD_API_KEY: ${{ secrets.PODO_LEMONBOARD_API_KEY_STAGE }}

      # The sync endpoint does not exist yet (docs/sync-contract.md). Until the
      # token is configured, report the plan and stop cleanly rather than failing
      # every push against an endpoint nobody has built — a permanently red
      # pipeline is one people stop reading.
      - name: apply
        run: |
          if [ -z "$PODO_CURRICULUM_SYNC_TOKEN" ]; then
            echo "::notice::PODO_CURRICULUM_SYNC_TOKEN is not set — the grape sync endpoint is not live yet. Plan only."
            {
              echo '## Plan only — sync endpoint not configured'
              python3 tools/plan.py --env stage
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 tools/apply.py --env stage
        env:
          PODO_CURRICULUM_SYNC_TOKEN: ${{ secrets.PODO_CURRICULUM_SYNC_TOKEN }}

      # The lock is the only record of which DB rows belong to which slug.
      # Losing it means the next apply creates duplicates, so commit it even
      # when apply partially failed.
      - name: commit the state lock
        if: always()
        run: |
          if git diff --quiet -- state/; then
            echo "state unchanged"; exit 0
          fi
          git config user.name  "podo-curriculum[bot]"
          git config user.email "podo-curriculum@users.noreply.github.com"
          git add state/
          git commit -m "chore(state): record stage apply for ${GITHUB_SHA::7}"
          git push
