<!DOCTYPE html>
<!-- VENDORED from tools/authoring/kr/gateway_template.html — byte-identical to it
     except for the edits listed here, so a change upstream re-applies as a diff.

     Upstream renders the whole authored curriculum from the track TOCs; this
     renders what actually deploys, from courses/. The page is the same page.

     Edits:
       1. Every string that names a language is read from DATA.page instead of
          being written in the markup, because one template now draws both
          korean-jp/index.html and english-jp/index.html.
       2. Track links drop the .html — this site is served at a custom domain where
          a language is a path (/korean-jp) and its catalog is that directory's
          index. Pages resolves /korean-jp/catalog/1-hangul to the same file
          upstream writes, so only the links moved, not the tree.
       3. The level ramp is keyed by position on the axis (--lv-1 … --lv-6 plus
          DATA.ramp) rather than by rung name, because English is graded in CEFR
          and a name-keyed lookup left those segments with no colour at all.

     Filled by tools/build-catalog.py — do not edit the built file by hand. -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#ffffff">
<title>커리큘럼 카탈로그 · PODO 한국어</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="../site.css">
<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

  /* ────────────────────────────────────────────────────────────────────
     이 페이지의 일은 하나다: 다섯 트랙이 있다는 것을 보여 주고, 하나를 고르게 하는 것.
     그래서 화면에서 제일 큰 물건은 트랙 카드 다섯 개이고, 그 밖의 모든 것 —
     설명, 숫자, 사다리 — 은 카드보다 작거나 옅다.

     색은 트랙의 이름표다. 다섯 트랙은 순서가 아니라 종류라서 범주 팔레트를 쓰고,
     그 색은 각 트랙의 상세 페이지까지 따라간다. 카탈로그에서 파란 카드를 눌렀으면
     들어간 페이지도 파랗다.
     ──────────────────────────────────────────────────────────────────── */
  :root {
    --ink: #16181a;
    --ink-2: #454a4f;
    --ink-3: #62686e;
    --ink-4: #7d848a;
    --line: #e6e8ea;
    --line-soft: #f1f2f3;
    --surface: #fafbfb;
    --radius: 4px;
    --radius-sm: 2px;

    /* 레벨 램프. 이름이 아니라 축 위의 자리로 매긴다 — 눈금 이름은 언어마다 다르지만
       (한국어 6단, 영어 CEFR) 옅은 것에서 짙은 것으로 오른다는 규칙은 같다. 어느 이름이
       몇 번을 쓰는지는 build-catalog.py 가 DATA.ramp 에 실어 보낸다. */
    --lv-1: #eef8de;
    --lv-2: #d7f0b4;
    --lv-3: #b1e07c;
    --lv-4: #7ac845;
    --lv-5: #3f7a1c;
    --lv-6: #2a5511;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #fff; color: var(--ink); line-height: 1.6;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 44px 28px 112px; }
  @media (max-width: 600px) { .wrap { padding: 36px 18px 72px; } }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: var(--radius-sm); }


  /* ---------- hero ---------- */
  .hero { position: relative; isolation: isolate; overflow: hidden; padding: 50px 32px; border: 1px solid var(--line);
    border-radius: 8px;
    background:
      radial-gradient(circle at 3% 12%, rgba(112,174,43,.12), transparent 28%),
      radial-gradient(circle at 98% 8%, rgba(45,100,224,.11), transparent 29%),
      radial-gradient(circle at 88% 100%, rgba(210,58,111,.09), transparent 30%),
      #fbfcfd;
    box-shadow: none; }
  .hero::after { content: ""; position: absolute; z-index: -1; width: 250px; height: 250px; right: -105px; top: -145px;
    border: 46px solid rgba(45,100,224,.055); border-radius: 50%; }
  .kicker { display: block; color: var(--ink-4); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  h1 { margin: 14px 0 0; font-size: 44px; font-weight: 820; line-height: 1.22; letter-spacing: -.04em; word-break: keep-all; }
  h1 b { font-weight: 800; font-variant-numeric: tabular-nums; }
  h1 .u { position: relative; white-space: nowrap; }
  .lead { max-width: 58ch; margin: 18px auto 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.75; word-break: keep-all; }

  .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 34px; margin-top: 27px; }
  .stat { padding: 0; background: none; box-shadow: none; }
  .stat b { font-size: 21px; font-weight: 750; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .stat span { margin-left: 5px; color: var(--ink-3); font-size: 12.5px; font-weight: 600; }

  /* ---------- 띠 제목 ----------
     본문 위에 얹는 한 줄짜리 구획. 여기부터 다른 것이 시작된다는 신호라
     페이지에서 이것과 트랙 카드만 바닥을 채운다. */
  .band { margin: 44px 0 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .band h2 { margin: 0; font-size: 20px; font-weight: 780; letter-spacing: -.025em; }
  .band p { margin: 0; color: var(--ink-3); font-size: 12px; font-weight: 600; }

  /* ---------- 트랙 카드 ---------- */
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 15px; }

  .card { position: relative; isolation: isolate; display: flex; flex-direction: column; min-height: 235px; padding: 22px;
    border: 1px solid color-mix(in srgb, var(--ac) 12%, var(--line)); border-radius: var(--radius); overflow: hidden;
    background: linear-gradient(145deg, color-mix(in srgb, var(--tint) 80%, white), #fff 58%);
    box-shadow: none; transition: border-color .16s, background .16s; }
  .card:hover { border-color: color-mix(in srgb, var(--ac) 55%, var(--line));
    background: linear-gradient(145deg, color-mix(in srgb, var(--tint) 92%, white), #fff 58%); }
  .card[data-status="plan"] { border: 2px dashed #9ba2a8;
    background: repeating-linear-gradient(135deg, #f3f4f5 0 9px, #fff 9px 18px); }
  .card[data-status="plan"]:hover { border-color: #69737d;
    background: repeating-linear-gradient(135deg, #eef0f1 0 9px, #fff 9px 18px); }
  .card-head { display: flex; align-items: center; gap: 13px; padding-right: 40px; }
  .glyph { display: grid; place-items: center; flex: 0 0 auto; width: 42px; height: 42px; border-radius: var(--radius-sm);
    background: var(--tint); color: var(--ac); font-size: 22px; font-weight: 800; }
  .card-no { position: absolute; top: 20px; right: 21px; color: var(--ac); font-size: 12px; font-weight: 800;
    font-variant-numeric: tabular-nums; opacity: .5; }
  .card-t { font-size: 18px; font-weight: 750; letter-spacing: -.03em; }
  .card-en { display: block; margin-top: 1px; color: var(--ink-3); font-size: 12px; font-weight: 500; }
  .card-state { display: inline-flex; margin-top: 5px; padding: 3px 7px; border-radius: 1px;
    background: #555d64; color: #fff; font-size: 10px; font-weight: 800; letter-spacing: -.01em; }
  .card-d { flex: 1 1 auto; display: -webkit-box; margin: 15px 0 0; overflow: hidden; color: var(--ink-2);
    font-size: 13px; line-height: 1.65; word-break: keep-all; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 17px; padding: 10px 11px; border-radius: var(--radius-sm); background: rgba(255,255,255,.76); }
  .card[data-status="plan"] .card-foot { box-shadow: inset 0 0 0 1px #d7dadd; }
  .card-figs { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .card-figs div { color: var(--ink-3); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .card-figs div b { margin-right: 3px; color: var(--ink); font-size: 12.5px; font-weight: 750;
    letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .card-lv { display: flex; flex: 0 0 auto; align-items: center; gap: 6px; color: var(--ink-3); font-size: 12px; font-weight: 600; }
  .card-lv i { width: 9px; height: 9px; border-radius: 1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
  .flag { position: absolute; top: 20px; right: 50px; color: var(--ink-4); font-size: 10.5px; font-weight: 650; }
  @media (max-width: 600px) {
    h1 { font-size: 34px; }
    .stats { gap: 7px 22px; }
    .hero { padding: 38px 20px; border-radius: 6px; }
    .band { margin-top: 38px; }
    .cards { grid-template-columns: 1fr; }
    .card { min-height: 0; }
    .card-foot { align-items: flex-start; flex-direction: column; }
  }

  /* ---------- 완성된 덱 ----------
     여기만 카탈로그 밖으로 나간다 — 목차가 아니라 실제 수업 화면으로. 그래서 새 탭에서
     열고, 생김새는 트랙 카드보다 한참 조용하게 둔다. 색은 트랙 이름표의 점 하나뿐이다. */
  .decks { display: grid; gap: 8px; margin-top: 14px; }
  .dtrack { display: grid; grid-template-columns: 148px minmax(0, 1fr); align-items: baseline; gap: 16px;
    padding: 14px 16px; border-radius: var(--radius-sm); background: var(--surface); }
  @media (max-width: 620px) { .dtrack { grid-template-columns: 1fr; gap: 9px; } }
  .dtrack-h { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 750; letter-spacing: -.01em; }
  .dtrack-h i { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 1px; }
  .dtrack-h em { font-style: normal; color: var(--ink-4); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .dlist { display: flex; flex-wrap: wrap; gap: 6px; }
  .dlist a { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 11px;
    border: 1px solid var(--line); border-radius: var(--radius-sm); background: #fff; box-shadow: none;
    color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
  .dlist a:hover { color: var(--ink); border-color: var(--ink-3); }
  .dlist a em { font-style: normal; color: var(--ink-4); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .dlist a .ext { color: var(--ink-4); font-size: 10px; }
  .dlist a:hover .ext { color: var(--ink-3); }
  .dnone { margin: 16px 0 0; color: var(--ink-3); font-size: 13px; }

  /* ---------- level ladder ---------- */
  .ladder { margin-top: 18px; overflow-x: auto; }
  .ladder-grid { min-width: 620px; }
  .lrow { display: grid; grid-template-columns: 128px 1fr; align-items: center; gap: 16px; }
  .lrow + .lrow { margin-top: 4px; }
  .lrow-head { display: flex; align-items: baseline; gap: 7px; justify-content: flex-end; text-align: right; font-size: 12.5px; font-weight: 700; }
  .lrow-head i { width: 8px; height: 8px; border-radius: 1px; }
  .lrow-head em { font-style: normal; color: var(--ink-4); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .lcols { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; height: 30px; }
  .lcols::before { content: ""; position: absolute; inset: 0; background:
      repeating-linear-gradient(to right, transparent 0, transparent calc(16.666% - 1px), var(--line-soft) calc(16.666% - 1px), var(--line-soft) 16.666%); }
  .lseg { display: grid; place-items: center; border-radius: 1px; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .lseg.dark { color: #fff; }
  .lseg.plan { background: repeating-linear-gradient(135deg, var(--surface) 0 6px, #fff 6px 12px);
    box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-3); grid-column: 1 / -1; font-weight: 600; }
  .laxis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
  .laxis span { text-align: center; color: var(--ink-4); font-size: 11px; font-weight: 600; }
  .lhead { display: grid; grid-template-columns: 128px 1fr; gap: 16px; margin-bottom: 9px; }
  .lfoot { margin: 14px 0 0; color: var(--ink-4); font-size: 11.5px; }

  footer { margin-top: 76px; padding: 18px 20px; border-radius: var(--radius-sm); background: var(--surface);
    color: var(--ink-4); font-size: 12px; line-height: 1.8; }
  footer code { color: var(--ink-3); font-size: 11.5px; }
  .loc { display: flex; gap: 2px; margin-left: auto; padding: 2px; border: 1px solid #e3e7ea;
    border-radius: 4px; background: #fff; }
  .loc button { padding: 4px 9px; border: 0; border-radius: 2px; background: transparent;
    color: #62686e; font: inherit; font-size: 12px; font-weight: 650; cursor: pointer; }
  .loc button:hover { color: #16181a; }
  .loc button[aria-pressed="true"] { background: #16181a; color: #fff; }
</style>
</head>

  <div class="band">

  <div class="cards" id="cards"></div>

  <div class="band">

    <p data-i18n="ui.ladderP">각 트랙이 어느 레벨 구간을 덮는지, 그 구간에 몇 과가 놓여 있는지.</p>

const I18N = DATA.i18n, LOCALES = ["ko", "ja", "en"], LS_KEY = "podo-catalog-locale";
const DEFAULT_LOCALE = "ja";
function initialLocale() {
  try { const v = localStorage.getItem(LS_KEY); if (LOCALES.includes(v)) return v; } catch (e) {}
  return DEFAULT_LOCALE;
}
let L = initialLocale();
const tr = (sec, key) => ((I18N[sec] || {})[key] || {})[L] || ((I18N[sec] || {})[key] || {}).ko || "";
const loc = o => !o ? "" : (typeof o === "string" ? o : (o[L] || o.ko || o.en || o.ja || ""));
/** 레벨 눈금 이름. 표에 없으면(영어 코스의 CEFR) 그대로 쓴다. */
const lvName = lv => ((I18N.level || {})[lv] || {})[L] || lv;
function paintI18n() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const [sec, key] = el.getAttribute("data-i18n").split(".");
    const v = tr(sec, key); if (v) el.textContent = v;
  });
  document.documentElement.lang = L;
}
function paintLocaleBar() {
  const bar = document.getElementById("loc"); if (!bar) return;
  bar.setAttribute("aria-label", tr("locale", "label"));
  bar.innerHTML = LOCALES.map(c =>
    `<button type="button" data-loc="${c}" aria-pressed="${c === L}">` +
    `${esc((I18N.locale[c] || {})[c] || c)}</button>`).join("");
}
function setLocale(next) {
  if (!LOCALES.includes(next) || next === L) return;
  L = next;
  try { localStorage.setItem(LS_KEY, L); } catch (e) {}
  paintI18n(); paintLocaleBar(); paintPage();
}

function paintCards() {
document.getElementById("cards").innerHTML = DATA.tracks.map(t => {
  const span = t.span.length ? (t.span.length === 1 ? lvName(t.span[0]) : `${lvName(t.span[0])} — ${lvName(t.span[t.span.length - 1])}`) : tr("ui","allLevels");
  const dot = t.span.length ? t.span[0] : "";
  const flag = t.status === "open" ? tr("ui","keepAdding") : "";
  return `<a class="card" data-status="${esc(t.status)}" href="catalog/${esc(t.id)}" style="--ac:${t.accent};--tint:${t.tint}">

    <div class="card-head">

        ${t.status === "plan" ? `<span class="card-state">${esc(tr("ui","planOnly"))}</span>` : ""}</div>
    </div>
    <p class="card-d">${esc(loc(t.desc))}</p>
    <div class="card-foot">
      <div class="card-figs">${t.stats.map(s => `<div><b>${esc(s.v)}</b>${esc(tr("ui", s.k))}</div>`).join("")}</div>
      <div class="card-lv">${dot ? `<i style="background:${lvColor(dot)}"></i>` : ""}${esc(span)}</div>

}).join("");
}
