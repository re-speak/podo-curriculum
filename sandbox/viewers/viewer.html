<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문서 — 한국어 커리큘럼</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

  :root {
    --ink: #1c1c1c;
    --lime: #b5fd4c;
    --green: #6abe36;
    --green-text: #3f7a1c;
    --green-100: #f2fcec;
    --green-200: #d8ecc6;
    --gray-100: #f5f5f5;
    --gray-200: #e8e8e8;
    --gray-400: #a5a5a5;
    --gray-500: #757575;
    --line: #e7e7e7;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: #fafafa;
    color: var(--ink);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 800px; margin: 0 auto; padding: 0 28px 100px; }
  @media (max-width: 600px) { .wrap { padding: 0 20px 80px; } }

  /* top bar — minimal, on white */
  .bar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    margin: 0;
    padding: 22px 0 16px;
    background: none;
    border-radius: 0;
    box-shadow: none;
    border-bottom: 1px solid var(--line);
  }
  .bar a.back { color: var(--gray-500); font-size: 13px; font-weight: 700; text-decoration: none; }
  .bar a.back:hover { color: var(--green-text); }
  .bar .pathchip {
    margin-left: auto;
    padding: 4px 10px;
    background: var(--gray-100);
    border-radius: 6px;
    color: var(--gray-500);
    font-size: 12px; font-weight: 600;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    word-break: break-all;
  }

  /* document — sits directly on white, no card */
  .doc {
    margin-top: 36px;
    padding: 0;
    background: none;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }

  /* ---------- markdown typography ---------- */
  .doc > :first-child { margin-top: 0; }
  .doc h1, .doc h2, .doc h3, .doc h4 { line-height: 1.2; font-weight: 850; letter-spacing: -.01em; word-break: keep-all; }
  .doc h1 { font-size: 30px; margin: 0 0 18px; padding-bottom: 16px; border-bottom: 3px solid var(--ink); }
  .doc h2 { font-size: 22px; margin: 40px 0 14px; }
  .doc h3 { font-size: 17px; margin: 28px 0 10px; }
  .doc h4 { font-size: 15px; margin: 22px 0 8px; color: var(--gray-500); }
  .doc p { margin: 0 0 14px; font-size: 15.5px; }
  .doc strong { font-weight: 800; }
  .doc a { color: var(--green-text); font-weight: 700; text-decoration: none; border-bottom: 1.5px solid var(--green-100); }
  .doc a:hover { border-bottom-color: var(--green); }

  .doc ul, .doc ol { margin: 0 0 16px; padding-left: 22px; }
  .doc li { margin: 5px 0; font-size: 15.5px; }
  .doc li::marker { color: var(--green); font-weight: 800; }

  .doc hr { margin: 32px 0; border: none; border-top: 1.5px solid var(--gray-200); }

  .doc blockquote {
    margin: 18px 0;
    padding: 14px 20px;
    background: var(--green-100);
    border-left: 4px solid var(--green);
    border-radius: 0 10px 10px 0;
  }
  .doc blockquote p { margin: 0; color: #2f5e16; font-weight: 600; }

  /* inline code + the grammar patterns read like chips */
  .doc code {
    padding: 2px 7px;
    background: var(--green-100);
    color: var(--green-text);
    border: 1px solid var(--green-200);
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .86em;
    font-weight: 600;
  }
  .doc pre {
    margin: 0 0 16px;
    padding: 18px 20px;
    background: var(--gray-100);
    border: 1px solid var(--gray-200);
    border-radius: 12px;
    overflow-x: auto;
  }
  .doc pre code { padding: 0; background: none; border: 0; color: #333; font-size: 13px; font-weight: 500; }

  /* tables — the heart of these TOC docs */
  .doc table { width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 14.5px; }
  .doc thead th {
    background: var(--green-text); color: #fff;
    text-align: left; font-weight: 800;
    padding: 11px 14px;
    border: 1.5px solid var(--green-text);
    word-break: keep-all;
  }
  .doc tbody td {
    padding: 11px 14px;
    border: 1.5px solid var(--gray-200);
    vertical-align: top;
    word-break: keep-all;
  }
  .doc tbody tr:nth-child(even) { background: var(--gray-100); }
  .doc tbody td code { font-size: .82em; }

  /* ---------- side table of contents ---------- */
  .doc h1, .doc h2, .doc h3 { scroll-margin-top: 24px; }
  .toc {
    display: none;
    position: fixed;
    top: 88px;
    left: calc(50% - 612px);
    width: 196px;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    padding-right: 8px;
  }
  @media (min-width: 1264px) { .toc.ready { display: block; } }
  .toc-label { margin: 0 0 8px 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--gray-400); font-weight: 700; }
  .toc ul { list-style: none; margin: 0; padding: 0; }
  .toc a {
    display: block; padding: 4px 10px; line-height: 1.35;
    border-left: 2px solid var(--line);
    color: var(--gray-500); font-size: 12.5px; font-weight: 500;
    text-decoration: none; word-break: keep-all;
  }
  .toc a:hover { color: var(--green-text); border-left-color: var(--green); background: var(--green-100); }
  .toc a.active { color: var(--green-text); border-left-color: var(--green); font-weight: 700; }
  .toc .lvl1 > a { color: var(--ink); font-weight: 800; font-size: 13px; margin-top: 6px; }
  .toc .lvl2 > a { padding-left: 18px; }

  /* states */
  .status { margin-top: 18px; padding: 40px; text-align: center; color: var(--gray-500); font-size: 15px; font-weight: 600; }
  .status.err { color: #b3261e; }
</style>
</head>
<body>
<nav class="toc" id="toc" aria-label="목차"></nav>
<div class="wrap">

  <div class="bar">
    <a class="back" href="index.html">← 한국어 홈</a>
    <span class="pathchip" id="pathchip"></span>
  </div>

  <div class="status" id="status">불러오는 중…</div>
  <article class="doc" id="doc" style="display:none"></article>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
  (function () {
    var statusEl = document.getElementById('status');
    var docEl = document.getElementById('doc');
    var chipEl = document.getElementById('pathchip');

    function fail(msg) {
      statusEl.className = 'status err';
      statusEl.textContent = msg;
      statusEl.style.display = '';
      docEl.style.display = 'none';
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    // build the side table of contents from the document's h1/h2 headings
    function buildToc(root) {
      var hs = root.querySelectorAll('h1, h2');
      if (hs.length < 2) return;
      var nav = document.getElementById('toc');
      var html = '<div class="toc-label">목차</div><ul>';
      var items = [];
      hs.forEach(function (h, i) {
        if (!h.id) h.id = 'sec-' + i;
        var lvl = h.tagName === 'H1' ? 'lvl1' : 'lvl2';
        html += '<li class="' + lvl + '"><a href="#' + h.id + '">' + escapeHtml(h.textContent.trim()) + '</a></li>';
        items.push(h);
      });
      nav.innerHTML = html + '</ul>';
      nav.classList.add('ready');

      // highlight the section currently near the top of the viewport
      if ('IntersectionObserver' in window) {
        var links = {};
        nav.querySelectorAll('a').forEach(function (a) { links[a.getAttribute('href').slice(1)] = a; });
        var obs = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (!e.isIntersecting) return;
            var a = links[e.target.id];
            if (!a) return;
            nav.querySelectorAll('a.active').forEach(function (x) { x.classList.remove('active'); });
            a.classList.add('active');
          });
        }, { rootMargin: '0px 0px -75% 0px', threshold: 0 });
        items.forEach(function (h) { obs.observe(h); });
      }
    }

    // read & validate ?doc= — relative .md paths on this site only
    var doc = new URLSearchParams(location.search).get('doc') || '';
    if (!doc) { fail('표시할 문서가 지정되지 않았습니다. (?doc=… 누락)'); return; }
    if (/^https?:|^\/\/|\.\./.test(doc) || !/\.md$/i.test(doc)) {
      fail('잘못된 문서 경로입니다: ' + doc); return;
    }
    chipEl.textContent = doc;

    fetch(doc)
      .then(function (r) {
        if (!r.ok) throw new Error(r.status === 404 ? '문서를 찾을 수 없습니다 (404).' : '불러오기 실패 (' + r.status + ').');
        return r.text();
      })
      .then(function (md) {
        docEl.innerHTML = marked.parse(md, { gfm: true, breaks: false });
        // set page title from the first heading
        var h1 = docEl.querySelector('h1, h2');
        if (h1) document.title = h1.textContent.trim() + ' — 한국어 커리큘럼';
        statusEl.style.display = 'none';
        docEl.style.display = '';
        buildToc(docEl);
      })
      .catch(function (e) { fail(e.message || '문서를 불러오지 못했습니다.'); });
  })();
</script>
</body>
</html>
