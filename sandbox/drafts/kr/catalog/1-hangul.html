  :root {

  * { box-sizing: border-box; }

  /* ---------- 3단 · 단원 카드 ---------- */
  .groups { margin-top: 18px; display: grid; gap: 12px; }
  .group { border: 1px solid #dfe3e6; border-radius: var(--radius); overflow: hidden; background: #fff;

  .group.open .caret::before { content: "\25BE"; }
  .gbody { display: none; padding: 6px 20px 20px; }

  .story { margin: 0; max-width: 70ch; color: var(--ink-2); font-size: 13.5px; line-height: 1.75; word-break: keep-all; }

  .gcan b { display: block; margin-bottom: 2px; color: var(--ac); }

  /* ---------- 4단 · 과 한 줄 ---------- */
  .lessons { margin-top: 16px; display: grid; gap: 6px; }

  .gbody > .lessons:first-child { margin-top: 0; }
  .lesson { border-radius: var(--radius-sm); background: var(--surface); }

  .lrow { display: flex; align-items: center; gap: 10px; }

  /* 덱이 나와 있는 과에만 붙는 문. 여기는 4단이라 트랙색을 쓰지 않는다 —

  .ltitle em { font-style: normal; color: var(--ink-3); font-weight: 450; letter-spacing: 0; }
  .first-tag { display: inline-block; margin-left: 8px; padding: 2px 6px; border: 1px solid color-mix(in srgb, var(--ac) 28%, var(--line));

  @media (max-width: 760px) { .lchips { display: none; } .lrow-btn { grid-template-columns: 46px minmax(0,1fr); } }

  /* ---------- 5단 · 펼친 과 ----------
     펼친 과는 얇은 외곽선과 옅은 바닥 하나로만 선택 상태를 만든다. 제목 → 할 수 있는
     것 → 예문 → 표현의 순서를 고정하고, 예문 둘은 넓은 화면에서 나란히 둔다. */
  .lesson.open { margin: 5px 0 10px; border: 1px solid color-mix(in srgb, var(--ac) 42%, #d7dce0);

  .lesson.open .lrow { padding-right: 16px; }

  .ldetail { display: none; padding: 0 20px 22px; }

  /* 펼친 과 안에서는 선 대신 여백·바닥색·작은 라벨로 의미를 나눈다. */
  .field + .field { margin-top: 20px; }

    font-size: 10.5px; letter-spacing: .045em; }
  .field-goal { position: relative; padding: 14px 16px 14px 46px; border-radius: var(--radius-sm); background: rgba(255,255,255,.74); }
  .field-goal::before { content: "\2713"; position: absolute; left: 17px; top: 17px; display: grid; place-items: center;

  .field-goal > .lbl { margin-bottom: 5px; padding: 0; background: none; }

  /* 이 과의 약속. 카드에서 제일 먼저 읽혀야 하는 줄이라 본문보다 크고 진하다. */
  .goal { margin: 0; max-width: 62ch; color: var(--ink); font-size: 15px; font-weight: 600; line-height: 1.65; word-break: keep-all; }

  .scene { margin: 0 0 16px; max-width: 62ch; color: var(--ink-3); font-size: 12.5px; line-height: 1.6; word-break: keep-all; }

  /* 한글 트랙에서는 단어가 결과 예시이고, 실제 학습 대상은 낱자와 조합 규칙이다.
     그래서 글자·규칙을 가장 큰 면에, 읽기 예시는 조용한 보조 줄에 둔다. */
  .hangul-focus { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .hangul-focus-item { min-height: 66px; display: flex; align-items: center; padding: 14px 16px;
    border-radius: var(--radius-sm); background: rgba(255,255,255,.9); color: var(--ink); font-size: 15px;
    font-weight: 700; line-height: 1.65; word-break: keep-all; }
  .hangul-focus-item .jamo { display: inline-block; margin: 0 2px; padding: 1px 5px;
    border-radius: var(--radius-sm); background: color-mix(in srgb, var(--ac) 12%, white); color: var(--ac);
    font-size: 21px; font-weight: 800; line-height: 1.35; letter-spacing: .035em; vertical-align: -1px; }
  .field-hangul-practice { margin-top: 16px; }
  .hangul-practice { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 0; max-width: 72ch; }
  .hangul-practice span { color: var(--ink-3); font-size: 13px; font-weight: 600; }
  .hangul-practice span:not(:last-child)::after { content: "\00B7"; margin: 0 9px; color: var(--ink-4); }

  /* 페이지에서 채운 색은 트랙색과 이 살구색뿐이고, 트랙색은 3단 위쪽에만 있다.
     그래서 과를 펼쳤을 때 그 안에서 유일하게 칠해진 것이 배우는 조각이 된다. */
  .pats { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .pcard { padding: 16px; border-radius: var(--radius-sm); background: rgba(255,255,255,.88); box-shadow: none; }
  .pcard .sent { margin: 0; font-size: 18.5px; font-weight: 700; line-height: 1.45; letter-spacing: -.025em; word-break: keep-all; }
  .pcard .sent mark { background: var(--pat-mark); color: var(--pat-ink); padding: 1px 3px; margin: 0 -1px; border-radius: var(--radius-sm); font-weight: 800;
    -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .pcard .reply { margin: 5px 0 0; color: var(--ink-3); font-size: 13px; font-weight: 500; word-break: keep-all; }
  .pcard .reply::before { content: "\21B3 "; color: var(--ink-4); }
  .pcard .pmeta { margin: 10px 0 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 9px; }
  .pcard .pname { color: var(--pat-ink); font-size: 12px; font-weight: 750; }
  .pcard .pgloss { color: var(--ink-4); font-size: 12px; word-break: keep-all; }

const usedLevels = LEVELS.filter(lv => T.dist[lv]);
document.getElementById("levelbar").hidden = usedLevels.length < 2;
document.getElementById("levelbar").innerHTML =
  `<span class="lbl" style="margin-right:4px">레벨</span>` +
  usedLevels.map(lv => `<button class="chip lv" type="button" data-lv="${lv}" aria-pressed="false">
    <span class="dot" style="background:${lvColor(lv)}"></span>${lv}</button>`).join("");

/* ---------- 3·4·5단 ---------- */
function chips(l) {
  const p = (l.chips || []).slice(0, 2).map(c =>
    `<span class="pat" title="${esc(c)}">${esc(c.replace(/\s+\(.*$/, "").trim() || c)}</span>`);
  if (l.refs && l.refs.length) p.push(`<span class="pat ref">핵심 ${l.refs[0]}</span>`);
  return p.join(`<span class="sep">·</span>`);
}

/** 문장을 그대로 쓰되, 배우는 조각에만 mark 를 씌운다. spans 는 빌드 때 계산된다. */
function marked(sentence, spans) {
  if (!spans || !spans.length) return esc(sentence);
  let out = "", last = 0;
  for (const [a, b] of spans) {
    out += esc(sentence.slice(last, a)) + "<mark>" + esc(sentence.slice(a, b)) + "</mark>";
    last = b;
  }
  return out + esc(sentence.slice(last));
}

/** 한글 학습 항목 안의 낱자 묶음만 크게 보여 준다. 설명은 그대로 두어 규칙의 맥락을 잃지 않는다. */
function markedJamo(text) {
  return esc(text).replace(/[ㄱ-ㅎㅏ-ㅣ](?:[\s＋/·–→]*[ㄱ-ㅎㅏ-ㅣ])*/g,
    chars => `<strong class="jamo">${chars}</strong>`);
}

/** 펼친 과는 라벨 붙은 칸 셋으로 이루어진다 — 무엇을 할 수 있게 되는가,
    무엇을 배우는가, 그리고 그것을 받쳐 주는 말. 트랙마다 칸의 이름만 달라진다. */
function detail(l) {
  const fields = [];
  const isHangul = T.id === "1-hangul";

  // 한글에서는 배울 글자·규칙이 본문이고, 읽을 수 있는 단어는 그 결과를 확인하는 예시다.
  if (isHangul && l.chips && l.chips.length) {
    fields.push({kind: "hangul-core", label: "이번에 배우는 것",
      body: `<div class="hangul-focus">${l.chips.map(c =>
        `<div class="hangul-focus-item"><span>${markedJamo(c)}</span></div>`).join("")}</div>`});
  }
  if (isHangul && l.can) {
    const words = l.can.split(" · ").map(w => w.trim()).filter(Boolean);
    fields.push({kind: "hangul-practice", label: "읽기 연습",
      body: `<div class="hangul-practice">${words.map(w => `<span>${esc(w)}</span>`).join("")}</div>`});
  }

  // ① 이 과의 약속
  if (l.can && !isHangul) {
    const words = l.can.split(" · ").map(w => w.trim()).filter(Boolean);
    const listy = words.length >= 3 && words.every(w => w.length <= 7);
    const goalLabel = l.canLabel === "읽을 수 있다" ? "읽기 목표"
      : l.canLabel === "이야기한다" ? "대화 목표"
      : l.canLabel === "일본어의 습관" ? "교정 포인트" : "이 과의 목표";
    fields.push({kind: "goal", label: goalLabel, body: listy
      ? `<div class="words">${words.map(w => `<span>${esc(w)}</span>`).join("")}</div>`
      : `<p class="goal">${esc(l.can)}</p>`});
  }

  // ② 배우는 것 — 패턴이 있으면 예문 안에서 짚어 주고, 없으면 이름만 늘어놓는다
  const ps = (l.pats || []).filter(p => p.ex || p.pat);
  if (ps.length) {
    fields.push({kind: "patterns", label: "핵심 패턴", body: `<div class="pats">` + ps.map(p => `<div class="pcard">
      ${p.ex ? `<p class="sent">${marked(p.ex, p.spans)}</p>` : ""}
      ${p.reply ? `<p class="reply">${esc(p.reply)}</p>` : ""}
      <div class="pmeta"><span class="pname">${esc(p.pat)}</span>
        ${p.gloss ? `<span class="pgloss">${esc(p.gloss)}</span>` : ""}</div></div>`).join("") + `</div>`});
  } else if (l.fix) {
    fields.push({kind: "goal", label: "고치는 법", body: `<p class="goal">${esc(l.fix)}</p>`});
  }
  if (l.chips && l.chips.length && !ps.length && !isHangul) {
    fields.push({kind: "items", label: l.fix ? "최소 대립쌍" : "배우는 것",
      body: `<div class="said">${l.chips.map(c => `<span>${esc(c)}</span>`).join("")}</div>`});
  }

  // ③ 받쳐 주는 말 — 통째로 외워 쓰는 표현과, 딱 한 줄짜리 규칙
  const said = (l.notes || []).find(n => n.k === "표현");
  const rule = (l.notes || []).find(n => n.k === "문법");
  if (said || rule) {
    // 트랙마다 구분자가 다르다: 핵심은 ·, 상황별은 쉼표. 쉼표로도 나누되 · 로 갈린
    // 뒤에는 건드리지 않는다 — "아, 그래요?" 처럼 쉼표를 품은 한 덩어리가 있다.
    let ws = [];
    if (said) {
      ws = said.v.split(/\s*·\s*/).filter(Boolean);
      if (ws.length === 1) ws = ws[0].split(/\s*,\s*/).filter(Boolean);
    }
    fields.push({kind: "support", label: said && rule ? "표현과 규칙" : said ? "바로 쓰는 표현" : "규칙",
      body: (ws.length ? `<div class="said">${ws.map(w => `<span>${esc(w)}</span>`).join("")}</div>` : "")
      + (rule ? `<p class="rule">${esc(rule.v)}</p>` : "")});
  }

  if (!fields.length) return `<p class="scene">이 과의 상세는 목차 원문에 있습니다.</p>`;
  return (l.scene ? `<p class="scene">${esc(l.scene)}</p>` : "")
    + fields.map(f => `<section class="field field-${f.kind}"><span class="lbl">${esc(f.label)}</span>${f.body}</section>`).join("");
}

function lessonRow(l, groupIndex, lessonIndex) {
  const c = chips(l);
  const firstLabel = `첫 ${T.lessonWord}`;
  const sub = l.sub === firstLabel ? "" : l.sub || (c ? "" : l.can);
  const firstTag = l.first ? `<span class="first-tag">${esc(firstLabel)}</span>` : "";
  const no = String(l.n).padStart(2, "0");
  // 덱이 있으면 그 과에서 곧장 수업 화면으로 나간다 — 카탈로그를 잃지 않도록 새 탭에서.
  const variants = l.decks || (l.deck ? [{href:l.deck, level:""}] : []);
  const showLevels = (l.levels || []).length > 1 || variants.length > 1;
  const deck = variants.length ? `<div class="deck-links">${variants.map(d =>
    `<a class="deck" href="../${esc(d.href)}" target="_blank" rel="noopener"
       title="${esc(l.title)}${d.level ? ` · ${esc(d.level)}` : ""} 덱을 새 탭에서 엽니다">${showLevels && d.level ? esc(d.level) : "덱 열기"} <span class="ext">↗</span></a>`
  ).join("")}</div>` : "";
  const detailId = `group-${groupIndex + 1}-lesson-${lessonIndex + 1}-detail`;
  return `<div class="lesson" data-text="${esc([l.title, l.sub, l.can, l.scene, (l.chips||[]).join(" "), (l.notes||[]).map(n=>n.v).join(" ")].join(" ").toLowerCase())}">
    <div class="lrow">
      <button class="lrow-btn" type="button" aria-expanded="false" aria-controls="${detailId}">
        <span class="lno">${esc(T.lessonWord)} ${no}</span>
        <span class="ltitle">${esc(l.title)}${sub ? ` <em>— ${esc(sub)}</em>` : ""}${firstTag}</span>
        <span class="lchips">${c}</span>
      </button>
      ${deck}
    </div>
    <div class="ldetail" id="${detailId}">${detail(l)}</div>
  </div>`;
}

function group(g, index) {
  // 단원 머리에는 "이 단원이 무엇인가"만 둔다.
  //   · 패턴 목록은 바로 아래 과 목록이 이미 한 줄씩 들고 있다 — 같은 것을 두 번 적는 셈이었다
  //   · 단원 설명문은 이 커리큘럼을 왜 이렇게 짰는지에 대한 메모라, 훑어보는 자리에 놓일 글이 아니다
  // 둘 다 지우면 남는 것은 이야기와 성과, 그리고 과 목록뿐이다.
  let head = "";
  if (g.work) {
    head += `<p class="story"><b>《${esc(g.work)}》</b> ${esc(g.story)}
      ${g.cast ? `<span class="cast">등장인물 — ${esc(g.cast)}</span>` : ""}</p>`;
  }
  if (g.blurb && (g.work || T.id === "3-contextual-korean")) {
    head += `<p class="gcan"><b class="lbl">끝내면 할 수 있는 것</b>${esc(g.blurb)}</p>`;
  }

  const bodyId = `group-${index + 1}-body`;
  const groupLevels = g.levels || (g.level ? [g.level] : []);
  const levelTags = groupLevels.map(lv =>
    `<span class="lv-tag"><i style="background:${lvColor(lv)}"></i>${esc(lv)}</span>`).join("");
  return `<div class="group" data-lv="${esc(groupLevels.join(" "))}">
    <button class="ghead" type="button" aria-expanded="false" aria-controls="${bodyId}">
      <span class="gnum">${esc(g.label)}</span>
      <span class="gtitle">${esc(g.title)}${g.subtitle ? `<em>${esc(g.subtitle)}</em>` : ""}</span>
      <span class="gmeta">${g.peak ? `<span>핵심 ${g.peak}과까지</span>` : ""}${g.form ? `<span>${esc(g.form)}</span>` : ""}
        ${levelTags}
        <span>${g.lessons.length}${esc(T.lessonWord)}</span><span class="caret"></span></span>
    </button>
    <div class="gbody" id="${bodyId}">
      ${head}
      <div class="lessons">${g.lessons.map((l, lessonIndex) => lessonRow(l, index, lessonIndex)).join("")}</div>
    </div>
  </div>`;
}

const $groups = document.getElementById("groups");
$groups.innerHTML = T.groups.map(group).join("");

/* ---------- 이전 · 다음 트랙 ---------- */
{
  const i = DATA.nav.findIndex(n => n.id === T.id);
  const prev = DATA.nav[i - 1], next = DATA.nav[i + 1];
  document.getElementById("nextrack").innerHTML =
    (prev ? `<a href="${esc(prev.id)}.html">← ${esc(prev.ko)}</a>` : `<a href="../catalog.html">← 카탈로그</a>`) +
    (next ? `<a href="${esc(next.id)}.html">${esc(next.ko)} →</a>` : `<a href="../catalog.html">카탈로그 →</a>`);
}

/* ---------- behaviour ---------- */
$groups.addEventListener("click", e => {
  if (e.target.closest(".deck")) return;          // 덱 링크는 펼치기가 아니라 나가기다
  const head = e.target.closest(".ghead");
  if (head) {
    const open = head.parentElement.classList.toggle("open");
    head.setAttribute("aria-expanded", open);
    return;
  }
  const row = e.target.closest(".lrow-btn");
  if (row) {
    const open = row.closest(".lesson").classList.toggle("open");
    row.setAttribute("aria-expanded", open);
  }
});

const $q = document.getElementById("q");
const $hits = document.getElementById("hits");
const $empty = document.getElementById("empty");
let activeLevels = new Set();

function apply() {
  const q = $q.value.trim().toLowerCase();
  let hits = 0, shown = 0;
  document.querySelectorAll(".group").forEach(g => {
    const groupLevels = new Set(g.dataset.lv.split(" ").filter(Boolean));
    const lvOk = !activeLevels.size || [...activeLevels].some(lv => groupLevels.has(lv));
    let inGroup = 0;
    g.querySelectorAll(".lesson").forEach(l => {
      const ok = lvOk && (!q || l.dataset.text.includes(q));
      l.classList.toggle("hide", !ok);
      if (ok) inGroup++;
    });
    g.classList.toggle("hide", inGroup === 0);
    if (inGroup) shown++;
    hits += inGroup;
    if (q) {
      g.classList.add("open");
      g.querySelector(".ghead")?.setAttribute("aria-expanded", "true");
    }
  });
  const filtering = q || activeLevels.size;
  $hits.textContent = filtering ? `${hits}${T.lessonWord} · ${shown}${T.unitWord}` : "";
  $empty.classList.toggle("hide", !(filtering && hits === 0));

  if (q) {
    document.querySelectorAll(".lesson:not(.hide) .ltitle").forEach(el => {
      const t = el.textContent, i = t.toLowerCase().indexOf(q);
      if (i < 0) return;
      el.innerHTML = esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length));
    });
  }
}

$q.addEventListener("input", () => {
  document.querySelectorAll(".ltitle mark").forEach(m => { const p = m.parentElement; p.innerHTML = p.textContent; });
  apply();
});

document.getElementById("levelbar").addEventListener("click", e => {
  const b = e.target.closest(".lv");
  if (!b) return;
  const lv = b.dataset.lv;
  activeLevels.has(lv) ? activeLevels.delete(lv) : activeLevels.add(lv);
  b.setAttribute("aria-pressed", activeLevels.has(lv));
  apply();
});

const $units = document.getElementById("expandUnits");
const $all = document.getElementById("expandAll");

function setOpen(units, lessons) {
  document.querySelectorAll(".group").forEach(g => {
    g.classList.toggle("open", units);
    g.querySelector(".ghead")?.setAttribute("aria-expanded", units);
  });
  document.querySelectorAll(".lesson").forEach(l => {
    l.classList.toggle("open", lessons);
    l.querySelector(".lrow-btn")?.setAttribute("aria-expanded", lessons);
  });
  $units.classList.toggle("on", units && !lessons);
  $all.classList.toggle("on", lessons);
  $units.textContent = units && !lessons ? `${T.unitWord} 모두 접기` : `${T.unitWord} 모두 펼치기`;
  $all.textContent = lessons ? `${T.lessonWord}까지 모두 접기` : `${T.lessonWord}까지 모두 펼치기`;
}
$units.addEventListener("click", () => setOpen(!$units.classList.contains("on"), false));
$all.addEventListener("click", () => { const on = !$all.classList.contains("on"); setOpen(on, on); });

// 들어오자마자 첫 단원은 열어 둔다 — 이 페이지는 이미 한 트랙으로 좁혀진 자리라,
// 무엇이 들어 있는지 한 번은 보여 주는 편이 낫다.
const firstGroup = document.querySelector(".group");
firstGroup?.classList.add("open");
firstGroup?.querySelector(".ghead")?.setAttribute("aria-expanded", "true");
</script>
</body>
