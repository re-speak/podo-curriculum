  :root {

  * { box-sizing: border-box; }

  /* ---------- 3단 · 단원 카드 ---------- */
  .groups { margin-top: 18px; display: grid; gap: 12px; }
  .group { border: 1px solid #dfe3e6; border-radius: var(--radius); overflow: hidden; background: #fff;

  .group.open .caret::before { content: "\25BE"; }
  .gbody { display: none; padding: 6px 20px 20px; }

  .story { margin: 0; max-width: 70ch; color: var(--ink-2); font-size: 13.5px; line-height: 1.75; word-break: keep-all; }

  .gcan b { display: block; margin-bottom: 2px; color: var(--ac); }

  /* ---------- 4단 · 과 한 줄 ---------- */
  .lessons { margin-top: 16px; display: grid; gap: 6px; }

  .gbody > .lessons:first-child { margin-top: 0; }
  .lesson { border-radius: var(--radius-sm); background: var(--surface); }

  .lrow { display: flex; align-items: center; gap: 10px; }

  /* 덱이 나와 있는 과에만 붙는 문. 여기는 4단이라 트랙색을 쓰지 않는다 —

  .ltitle em { font-style: normal; color: var(--ink-3); font-weight: 450; letter-spacing: 0; }
  .first-tag { display: inline-block; margin-left: 8px; padding: 2px 6px; border: 1px solid color-mix(in srgb, var(--ac) 28%, var(--line));

  @media (max-width: 760px) { .lchips { display: none; } .lrow-btn { grid-template-columns: 46px minmax(0,1fr); } }

  /* ---------- 5단 · 펼친 과 ----------
     펼친 과는 얇은 외곽선과 옅은 바닥 하나로만 선택 상태를 만든다. 제목 → 할 수 있는
     것 → 예문 → 표현의 순서를 고정하고, 예문 둘은 넓은 화면에서 나란히 둔다. */
  .lesson.open { margin: 5px 0 10px; border: 1px solid color-mix(in srgb, var(--ac) 42%, #d7dce0);

  .lesson.open .lrow { padding-right: 16px; }

  .ldetail { display: none; padding: 0 20px 22px; }

  /* 펼친 과 안에서는 선 대신 여백·바닥색·작은 라벨로 의미를 나눈다. */
  .field + .field { margin-top: 20px; }

    font-size: 10.5px; letter-spacing: .045em; }
  .field-goal { position: relative; padding: 14px 16px 14px 46px; border-radius: var(--radius-sm); background: rgba(255,255,255,.74); }
  .field-goal::before { content: "\2713"; position: absolute; left: 17px; top: 17px; display: grid; place-items: center;

  .field-goal > .lbl { margin-bottom: 5px; padding: 0; background: none; }

  /* 이 과의 약속. 카드에서 제일 먼저 읽혀야 하는 줄이라 본문보다 크고 진하다. */
  .goal { margin: 0; max-width: 62ch; color: var(--ink); font-size: 15px; font-weight: 600; line-height: 1.65; word-break: keep-all; }

  .scene { margin: 0 0 16px; max-width: 62ch; color: var(--ink-3); font-size: 12.5px; line-height: 1.6; word-break: keep-all; }

  /* 한글 트랙에서는 단어가 결과 예시이고, 실제 학습 대상은 낱자와 조합 규칙이다.
     그래서 글자·규칙을 가장 큰 면에, 읽기 예시는 조용한 보조 줄에 둔다. */
  .hangul-focus { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .hangul-focus-item { min-height: 66px; display: flex; align-items: center; padding: 14px 16px;
    border-radius: var(--radius-sm); background: rgba(255,255,255,.9); color: var(--ink); font-size: 15px;
    font-weight: 700; line-height: 1.65; word-break: keep-all; }
  .hangul-focus-item .jamo { display: inline-block; margin: 0 2px; padding: 1px 5px;
    border-radius: var(--radius-sm); background: color-mix(in srgb, var(--ac) 12%, white); color: var(--ac);
    font-size: 21px; font-weight: 800; line-height: 1.35; letter-spacing: .035em; vertical-align: -1px; }
  .field-hangul-practice { margin-top: 16px; }
  .hangul-practice { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 0; max-width: 72ch; }
  .hangul-practice span { color: var(--ink-3); font-size: 13px; font-weight: 600; }
  .hangul-practice span:not(:last-child)::after { content: "\00B7"; margin: 0 9px; color: var(--ink-4); }

  /* 페이지에서 채운 색은 트랙색과 이 살구색뿐이고, 트랙색은 3단 위쪽에만 있다.
     그래서 과를 펼쳤을 때 그 안에서 유일하게 칠해진 것이 배우는 조각이 된다. */
  .pats { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .pcard { padding: 16px; border-radius: var(--radius-sm); background: rgba(255,255,255,.88); box-shadow: none; }
  .pcard .sent { margin: 0; font-size: 18.5px; font-weight: 700; line-height: 1.45; letter-spacing: -.025em; word-break: keep-all; }
  .pcard .sent mark { background: var(--pat-mark); color: var(--pat-ink); padding: 1px 3px; margin: 0 -1px; border-radius: var(--radius-sm); font-weight: 800;
    -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .pcard .reply { margin: 5px 0 0; color: var(--ink-3); font-size: 13px; font-weight: 500; word-break: keep-all; }
  .pcard .reply::before { content: "\21B3 "; color: var(--ink-4); }
  .pcard .pmeta { margin: 10px 0 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 9px; }
  .pcard .pname { color: var(--pat-ink); font-size: 12px; font-weight: 750; }
  .pcard .pgloss { color: var(--ink-4); font-size: 12px; word-break: keep-all; }

 있어요?","gloss":"","spans":[[2,12]]}],"notes":[{"k":"표현","v":"저기요 · 혹시 · 잠깐만요 · 죄송한데요"},{"k":"문법","v":"있다는 존재(\"ある/いる\")와 소유(\"持っている\") 둘 다 씁니다 — 시간이 있어요 / 동생이 있어요."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-2/lessons/16-is-there-one/lesson.html","level":"초급"}]},{"n":17,"title":"책상 위에 있어요","sub":"어디 있는지 알려 주기","can":"물건이 어디 있는지 알려 주고, 만날 자리를 정한다.","canLabel":"할 수 있다","level":"초급","chips":["N 위·아래·옆·앞·뒤·안·밖에","N 앞에서 만나요"],"pats":[{"ex":"책상 위에 있어요.","pat":"N 위·아래·옆·앞·뒤·안·밖에","gloss":"위치 명사","spans":[[3,5]]},{"ex":"학교 앞에서 만나요.","pat":"N 앞에서 만나요","gloss":"만나는 자리","spans":[[3,10]]}],"notes":[{"k":"표현","v":"바로 · 근처에 · 사이에 · 건너편에"},{"k":"문법","v":"위치 명사도 있는 곳이면 에, 그 자리에서 뭘 하면 에서. 앞에 있어요 / 앞에서 만나요."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-2/lessons/17-where-it-is/lesson.html","level":"초급"}]},{"n":18,"title":"여기 앉으세요","sub":"지시 알아듣고 권하기","can":"교실과 가게에서 듣는 지시를 알아듣고, 상대에게 정중히 권한다.","canLabel":"할 수 있다","level":"초급","chips":["-(으)세요","-지 마세요"],"pats":[{"ex":"여기 앉으세요. / 잘 들으세요.","pat":"-(으)세요","gloss":"정중한 요청·권유","spans":[[15,17]]},{"ex":"여기서 사진 찍지 마세요.","pat":"-지 마세요","gloss":"부정 명령","spans":[[8,13]]}],"notes":[{"k":"표현","v":"네, 알겠어요 · 잠깐만요 · 어서 오세요 · 안녕히 가세요"},{"k":"문법","v":"받침 있으면 -으세요, 없으면 -세요. ㄷ 불규칙 — 듣다→들으세요. ㄹ 어간은 ㄹ이 빠집니다 — 살다→사세요. 이 -(으)세요는 높임의 -(으)시-와 같은 형태입니다(46과에서 정리)."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-2/lessons/18-please-sit/lesson.html","level":"초급"}]},{"n":19,"title":"물 좀 주세요","sub":"부탁하기","can":"물건을 달라고 하고, 어떤 행동을 해 달라고 부탁한다.","canLabel":"할 수 있다","level":"초급","chips":["N 좀 주세요","-아/어 주세요"],"pats":[{"ex":"물 좀 주세요.","pat":"N 좀 주세요","gloss":"물건 요청","spans":[[2,7]]},{"ex":"천천히 말해 주세요.","pat":"-아/어 주세요","gloss":"행동 요청","spans":[[7,10]]}],"notes":[{"k":"표현","v":"좀 · 감사합니다 · 괜찮아요 · 아니에요"},{"k":"문법","v":"좀은 \"조금\"이 아니라 부탁을 부드럽게 만드는 말입니다. 없으면 명령처럼 들립니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-2/lessons/19-asking-a-favour/lesson.html","level":"초급"}]}],"checkpoint":"수행: 카페에서 자리를 찾고, 화장실 위치를 묻고, 물을 부탁하고, 직원의 지시를 알아듣는다."},{"label":"Unit 5","title":"더 붙이기","subtitle":"조사와 격식","level":"초급","levelText":"초급","blurb":"2단원에서 미뤄 둔 조사와 접속, 그리고 격식체.","lessons":[{"n":20,"title":"친구하고 같이 봐요","sub":"누구와, 누구에게","can":"누구와 함께 하는지, 누구에게 하는지를 말한다.","canLabel":"할 수 있다","level":"초급","chips":["N하고","N한테 · N에게"],"pats":[{"ex":"친구하고 같이 영화를 봐요.","pat":"N하고","gloss":"동반 \"と\"","spans":[[2,4]]},{"ex":"엄마한테 매일 전화해요.","pat":"N한테 · N에게","gloss":"대상 \"に\"","spans":[[2,4]]}],"notes":[{"k":"표현","v":"같이 · 혼자 · 와/과 · (이)랑"},{"k":"문법","v":"하고 = 와/과 = (이)랑 — 뜻은 같고 말투만 다릅니다(랑=편하게, 와/과=글). 한테는 말, 에게는 글."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-3/lessons/20-with-and-to/lesson.html","level":"초급"}]},{"n":21,"title":"저도 커피 주세요","sub":"같은 걸로, 이것만","can":"앞사람과 같은 것을 고르거나, 그것만 달라고 한정한다.","canLabel":"할 수 있다","level":"초급","chips":["N도","N만"],"pats":[{"ex":"저도 커피 주세요.","pat":"N도","gloss":"첨가 \"も\"","spans":[[1,2]]},{"ex":"저는 물만 주세요.","pat":"N만","gloss":"한정 \"だけ\"","spans":[[4,5]]}],"notes":[{"k":"표현","v":"같은 걸로 · 그냥 · 저는 괜찮아요"},{"k":"문법","v":"도와 만은 은/는 · 이/가 · 을/를을 밀어내고 그 자리에 들어갑니다 — 저는→저도, 물을→물만. 동사에 붙이면 -기만 하다(게임만 해요)."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-3/lessons/21-too-and-only/lesson.html","level":"초급"}]},{"n":22,"title":"아침을 먹고 회사에 가요","sub":"잇고 고르기","can":"두 가지 일을 이어서 말하고, 둘 중 하나를 고르게 한다.","canLabel":"할 수 있다","level":"초급","chips":["-고","N(이)나 · -거나"],"pats":[{"ex":"아침을 먹고 회사에 가요.","pat":"-고","gloss":"나열 및 순차 연결","spans":[[5,6]]},{"ex":"커피나 차 주세요. / 영화를 보거나 책을 읽어요.","pat":"N(이)나 · -거나","gloss":"선택 \"か\"","spans":[[18,20]]}],"notes":[{"k":"표현","v":"그리고 · 아니면 · 또 · 그다음에"},{"k":"문법","v":"명사끼리는 (이)나, 동사끼리는 -거나. -고는 앞뒤 순서를 바꿔도 되는 나열, 순서가 중요하면 뒤에 배울 -고 나서(52과)."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-3/lessons/22-and-then/lesson.html","level":"초급"}]},{"n":23,"title":"커피보다 차가 좋아요","sub":"비교하고 고르기","can":"두 가지를 비교하고, 여럿 중에서 제일 좋은 것을 고른다.","canLabel":"할 수 요?","sub":"언제였는지 묻고 답하기","can":"언제 있었던 일인지 묻고, 시간 표현을 붙여 답한다.","canLabel":"할 수 있다","level":"초급","chips":["언제 ~았/었어요?","에"],"pats":[{"ex":"언제 한국에 갔어요?","pat":"언제 ~았/었어요?","gloss":"","spans":[[0,2],[8,10]]},{"ex":"저는 작년에 한국에 갔어요.","pat":"에","gloss":"작년·지난주·주말","spans":[[5,6]]}],"notes":[{"k":"표현","v":"어제 · 오늘 · 내일 · 아까 · 이따가 · 지난주 · 다음 주"},{"k":"문법","v":"어제 · 오늘 · 내일 · 지금에는 에를 붙이지 않습니다(어제에 ✗). 나머지 시간 명사에는 붙습니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-3/lessons/26-when-was-it/lesson.html","level":"초급"}]},{"n":27,"title":"왜 안 왔어요?","sub":"이유 묻고 답하기","can":"왜 그랬는지 묻고, 이유를 대며 답한다.","canLabel":"할 수 있다","level":"초급","chips":["왜 ~?","-아/어서"],"pats":[{"ex":"왜 안 왔어요?","pat":"왜 ~?","gloss":"","spans":[[0,1]]},{"ex":"배가 아파서 병원에 갔어요.","pat":"-아/어서","gloss":"원인 → 결과","spans":[[3,4]]}],"notes":[{"k":"표현","v":"그냥요 · 미안해요 · 죄송해요 · 괜찮아요"},{"k":"문법","v":"-아/어서 앞에는 과거 -았/었-을 붙이지 않습니다 — 아팠어서 ✗ / 아파서 ✓. 시제는 뒤 문장이 담당합니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-3/lessons/27-why-and-because/lesson.html","level":"초급"}]},{"n":28,"title":"어렵지만 재미있어요","sub":"좋은 점과 아쉬운 점","can":"한 가지에 대해 좋은 점과 아쉬운 점을 함께 말한다.","canLabel":"할 수 있다","level":"초급","chips":["-지만","그래서 · 그런데 · 그리고 · 그러니까"],"pats":[{"ex":"한국어는 어렵지만 재미있어요.","pat":"-지만","gloss":"대조","spans":[[7,9]]},{"ex":"어제 아팠어요. 그래서 집에 있었어요.","pat":"그래서 · 그런데 · 그리고 · 그러니까","gloss":"접속사","spans":[[9,12]]}],"notes":[{"k":"표현","v":"그렇지만 · 근데 · 조금 · 대신에"},{"k":"문법","v":"-지만은 한 문장 안에서, 접속사는 문장을 끊고 다음 문장 앞에서. 말할 때는 그런데를 근데로 줄입니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-3/lessons/28-but-and-still/lesson.html","level":"초급"}]},{"n":29,"title":"어떻게 가요?","sub":"가는 방법 묻기","can":"어떻게 가는지 묻고, 교통수단을 넣어 답한다.","canLabel":"할 수 있다","level":"초급","chips":["어떻게 ~?","N(으)로"],"pats":[{"ex":"거기 어떻게 가요?","pat":"어떻게 ~?","gloss":"","spans":[[3,6]]},{"ex":"저는 버스로 가요.","pat":"N(으)로","gloss":"수단 \"で\"","spans":[[5,6]]}],"notes":[{"k":"표현","v":"걸어서 · 갈아타요 · 지하철 · 택시"},{"k":"문법","v":"받침 없거 v":"-(으)ㄹ은 관형사형입니다(규칙은 50과). 지금은 갈 거예요 · 먹을 거예요를 덩어리로. 발음은 [꺼예요]."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-4/lessons/32-making-plans/lesson.html","level":"초급"}]},{"n":33,"title":"제가 전화할게요","sub":"약속하고 제안하기","can":"내가 하겠다고 약속하고, 같이 하자고 제안한다.","canLabel":"할 수 있다","level":"초급","chips":["-(으)ㄹ게요","-(으)ㄹ까요?"],"pats":[{"ex":"이따가 다시 전화할게요.","pat":"-(으)ㄹ게요","gloss":"말하는 이의 약속·의지","spans":[[10,12]]},{"ex":"우리 같이 점심 먹을까요?","pat":"-(으)ㄹ까요?","gloss":"제안","spans":[[11,13]]}],"notes":[{"k":"표현","v":"좋아요 · 그래요 · 그럼 · 저는 괜찮아요"},{"k":"문법","v":"-(으)ㄹ게요는 나만 주어(제가 할게요 ✓ / 친구가 할게요 ✗). -(으)ㄹ까요?는 우리 둘. 발음은 [께요]·[까요]."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-4/lessons/33-ill-do-it/lesson.html","level":"초급"}]},{"n":34,"title":"같이 밥 먹으러 가요","sub":"하러 가자고 하기","can":"무엇을 하러 가는지 말하고, 같이 하자고 권한다.","canLabel":"할 수 있다","level":"초급","chips":["-(으)러 가다 / 오다","같이 ~아/어요"],"pats":[{"ex":"같이 밥 먹으러 가요.","pat":"-(으)러 가다 / 오다","gloss":"이동의 목적","spans":[[6,10]]},{"ex":"우리 내일 같이 가요.","pat":"같이 ~아/어요","gloss":"해요체 청유","spans":[[6,8]]}],"notes":[{"k":"표현","v":"같이 · 우리 · 언제 시간 돼요? · 좋아요, 가요"},{"k":"문법","v":"-(으)러는 가다·오다·다니다 앞에서만 씁니다. 해요체는 평서·의문·청유·명령이 모두 같은 모양이라 억양으로 구별합니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-4/lessons/34-going-to-do/lesson.html","level":"초급"}]},{"n":35,"title":"김치 먹을 수 있어요?","sub":"할 수 있는 것 말하기","can":"함께 할 활동을 정하면서 상대가 할 수 있는지 묻고, 배운 적이 있어서 할 줄 안다고 답한다.","canLabel":"할 수 있다","level":"초급","chips":["-(으)ㄹ 수 있어요 / 없어요","-(으)ㄹ 줄 알아요 / 몰라요"],"pats":[{"ex":"저는 김치를 먹을 수 있어요.","pat":"-(으)ㄹ 수 있어요 / 없어요","gloss":"가능·불가능","spans":[[10,15]]},{"ex":"저는 운전할 줄 알아요.","pat":"-(으)ㄹ 줄 알아요 / 몰라요","gloss":"배워서 익힌 능력","spans":[[7,12]]}],"notes":[{"k":"표현","v":"조금은요 · 전혀 못해요 · 잘해요 · 한번 해 볼게요"},{"k":"문법","v":"상황이 되느냐는 -(으)ㄹ 수 있다, 기술을 익혔느냐는 -(으)ㄹ 줄 알다. 수영은 할 줄 아는데(기술) 오늘은 할 수 없어요(상황) — 둘이 같이 나옵니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-4/lessons/35-can-you/lesson.html","level":"초급"}]},{"n":36,"title":"한국어를 배우려고 해요","sub":"마음먹은 계획","can":"새해 계획이나 요즘 결심을 이야기하며, 아직 마음만 먹은 것과 이미 정해 버린 것을 함께 밝힌다.","canLabel":"할 수 있다","level":"초급","chips":["-(으)려고 하다","-기로 했어요"],"pats":[{"ex":"한국어를 배우려고 해요.","pat":"-(으)려고 하다","gloss":"의도","spans":[[7,9]]},{"ex":"매일 운동하기로 했어요.","pat":"-기로 했어요","gloss":"결정·다짐","spans":[[6,12]]}],"notes":[{"k":"표현","v":"사실은 · 그래서 · 잘됐네요 · 화이팅"},{"k":"문법","v":"세기 순서 — -(으)ㄹ까 하다(아직 안 굳음) < -(으)려고 하다(마음먹음) < -기로 하다(정함). 이유를 묻는 말에 답할 때는 -(으)려고요만 떼어 씁니다 — \"왜 오셨어요?\" \"책 좀 빌리려고요.\""}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-4/lessons/36-intending-to/lesson.html","level":"초급"}]}],"checkpoint":"수행: 주말 약속을 처음부터 끝까지 잡는다 — 하고 싶은 것을 꺼내고, 같이 가자고 제안하고, 상대가 할 수 있는지 확인하고, 내가 예약하겠다고 약속하고, 시간을 정한다."},{"label":"Unit 8","title":"해도 돼요?","subtitle":"조건, 허락, 의무","level":"초급","levelText":"초급","blurb":"조건을 먼저 세우고, 그 위에 허락·금지·의무를 올립니다.","lessons":[{"n":37,"title":"시간이 있으면 같이 가요","sub":"조건 걸기","can":"조건을 붙여 제안하고, 이루어졌으면 하는 일을 말한다.","canLabel":"할 수 있다","level":"초급","chips":["-(으)면","-았/었으면 좋겠어요"],"pats":[{"ex":"시간이 있으면 같이 가요.","pat":"-(으)면","gloss":"가정·조건","spans":[[5,7]]},{"ex":"빨리 나았으면 좋겠어요.","pat":"-았/었으면 좋겠어요","gloss":"바람","spans":[[4,12]]}],"notes":[{"k":"표현","v":"혹시 · 만약에 · 그러면 · 꼭이요"},{"k":"문법","v":"-(으)면은 이 단원 전체의 바탕입니다. -았/었으면 좋겠다는 과거형이지만 뜻은 지금의 바람입니다(-(으)면 좋겠다도 같은 뜻)."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-4/lessons/37-if-and-when/lesson.html","level":"초급"}]},{"n":38,"title":"여기 앉아도 돼요?","sub":"허락과 금지","can":"해도 되는지 묻고, 안 된다고 답한다.","canLabel":"할 수 있다","level":"초급","chips":["-아/어도 돼요?","-(으)면 안 돼요"],"pats":[{"ex":"여기 앉아도 돼요?","pat":"-아/어도 돼요?","gloss":"허락 구하기","spans":[[4,9]]},{"ex":"여기서 사진 찍으면 안 돼요.","pat":"-(으)면 안 돼요","gloss":"금지","spans":[[8,15]]}],"notes":[{"k":"표현","v":"그럼요 · 물론이죠 · 죄송하지만 · 잠깐이면 돼요"},{"k":"문법","v":"허락은 -아/어도, 금지는 -(으)면 위에 각각 되다 / 안 되다를 얹은 것입니다. 37과의 -(으)면을 알면 금지는 새로 외울 것이 없습니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-4/lessons/38-may-i/lesson.html","level":"초급"}]},{"n":39,"title":"이름만 쓰면 돼요","sub":"이만큼만 하면 됨","can":"무엇만 하면 되는지 알려 주고, 안 해도 되는 것을 빼 준다.","canLabel":"할 수 있다","level":"초급","chips":["-(으)면 되다","안 -아/어도 되다 / -지 않아도 되다"],"pats":[{"ex":"여기에 이름만 쓰면 돼요.","pat":"-(으)면 되다","gloss":"그렇게만 하면 충분함","spans":[[9,10]]},{"ex":"내일은 안 와도 돼요.","pat":"안 -아/어도 되다 / -지 않아도 되다","gloss":"의무 없음","spans":[[4,5]]}],"notes":[{"k":"표현","v":"그것만 하면 돼요 · 괜찮아요 · 신경 안 쓰셔도 돼요"},{"k":"문법","v":"세 개가 한 줄에 서 있습니다 — -(으)면 되다(이렇게 하면 충분) / -(으)면 안 되다(하면 안 됨) / 안 -아/어도 되다(안 해도 됨)."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-4/lessons/39-thats-all-you-need/lesson.html","level":"초급"}]},{"n":40,"title":"내일까지 끝내야 돼요","sub":"꼭 해야 하는 것","can":"처음 온 사람에게 마감이나 절차를 안내하며, 꼭 해야 할 일과 안 해도 되는 일을 정리해 준다.","canLabel":"할 수 있다","level":"초급","chips":["-아/어야 돼요 / 해요","-(으)ㄹ 필요 없다"],"pats":[{"ex":"내일까지 끝내야 돼요.","pat":"-아/어야 돼요 / 해요","gloss":"의무·필요","spans":[[7,11]]},{"ex":"지금 갈 필요 없어요.","pat":"-(으)ㄹ 필요 없다","gloss":"그럴 까닭이 없음","spans":[[5,9]]}],"notes":[{"k":"표현","v":"꼭 · 반드시 · 까지 · 늦으면 안 돼요"},{"k":"문법","v":"-아/어야 되다의 반대는 안 -아/어도 되다(39과)입니다. -아/어야 하다는 글, -아/어야 되다는 말에서 더 자주."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-4/lessons/40-i-have-to/lesson.html","level":"초급"}]},{"n":41,"title":"지금 밥 먹고 있어요","sub":"하는 중과 되어 있는 상태","can":"지금 하고 있는 일을 말하고, 무언가가 어떤 상태로 되어 있는지 알린다.","canLabel":"할 수 있다","level":"초급","chips":["-고 있어요","-아/어 있어요"],"pats":[{"ex":"지금 밥 먹고 있어요.","pat":"-고 있어요","gloss":"동작의 진행","spans":[[6,11]]},{"ex":"문이 열려 있어요.","pat":"-아/어 있어요","gloss":"결과 상태의 지속","spans":[[6,9]]}],"notes":[{"k":"표현","v":"지금 · 아직 · 벌써 · 잠깐만요"},{"k":"문법","v":"문을 열고 있어요(여는 중) vs 문이 열려 있어요(열린 채로 있음). 일본어의 ~ている가 둘로 갈라지는 지점이라 특히 헷갈립니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-beginner-4/lessons/41-in-progress/lesson.html","level":"초급"}]},{"n":42,"title":"한번 먹어 보세요","sub":"시도와 경험","can":"한번 해 보라고 권하고, 해 본 적이 있는지 주고받는다.","canLabel":"할 수 있다","level":"초급","chips":["-아/어 보다","-(으)ㄴ 적 있다 / 없다"],"pats s":[{"n":54,"title":"늦었으니까 택시 타요","sub":"이유 대고 권하기","can":"이유를 대면서 상대에게 무엇을 하자고 권한다.","canLabel":"할 수 있다","level":"초중급","chips":["-(으)니까","-는 게 어때요?"],"pats":[{"ex":"늦었으니까 택시 타요.","pat":"-(으)니까","gloss":"이유 → 제안·명령","spans":[[2,5]]},{"ex":"택시를 타는 게 어때요?","pat":"-는 게 어때요?","gloss":"제안","spans":[[5,12]]}],"notes":[{"k":"표현","v":"그러니까 · 그게 낫겠어요 · 좋은 생각이에요"},{"k":"문법","v":"27과의 -아/어서는 명령·청유와 못 씁니다(늦어서 택시 타세요 ✗). 뒤에 -(으)세요 · -(으)ㅂ시다 · -자가 오면 -(으)니까. 이게 둘의 결정적 차이입니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-upper-beginner-2/lessons/54-since-and-suggest/lesson.html","level":"초중급"}]},{"n":55,"title":"비 때문에, 감기로","sub":"무엇 때문에 못 했는지","can":"무엇 때문에 못 했는지 명사 하나로 짧게 설명하고 사과한다.","canLabel":"할 수 있다","level":"초중급","chips":["N 때문에","N(으)로"],"pats":[{"ex":"비 때문에 못 갔어요.","pat":"N 때문에","gloss":"원인","spans":[[2,5]]},{"ex":"감기로 결석했어요.","pat":"N(으)로","gloss":"원인","spans":[[2,3]]}],"notes":[{"k":"표현","v":"갑자기 · 어쩔 수 없이 · 죄송해요 · 다음에 꼭"},{"k":"문법","v":"때문에는 대체로 안 좋은 결과에 씁니다(좋은 결과에는 덕분에 — 77과). 29과의 수단 (으)로가 원인으로도 쓰입니다 — 버스로 가다(수단) / 감기로 쉬다(원인). 서술어 뒤에 붙이는 -기 때문에는 글·뉴스 쪽이라 말할 때는 -아/어서(27과)나 -(으)니까(54과)를 씁니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-upper-beginner-2/lessons/55-because-of/lesson.html","level":"초중급"}]},{"n":56,"title":"어제 영화 봤는데 재미있었어요","sub":"배경 깔고 말하기","can":"먼저 상황을 깔고 본론을 말하며, 말끝을 흐려 부드럽게 만든다.","canLabel":"할 수 있다","level":"초중급","chips":["-는데","-(으)ㄴ/는데요"],"pats":[{"ex":"어제 영화 봤는데 진짜 재미있었어요.","pat":"-는데","gloss":"배경 설명 / 부드러운 대조","spans":[[7,9]]},{"ex":"저, 좀 추운데요…","pat":"-(으)ㄴ/는데요","gloss":"여운을 남기는 종결","spans":[[7,9]]}],"notes":[{"k":"표현","v":"저기요 · 그런데요 · 아니 그게… · 혹시"},{"k":"문법","v":"-는데는 한국어 대화에서 가장 자주 나오는 연결 어미입니다. 형용사는 -(으)ㄴ데(추운데), 동사·과거는 -는데(먹는데 · 갔는데)."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-upper-beginner-2/lessons/56-setting-it-up/lesson.html","level":"초중급"}]},{"n":57,"title":"사진 좀 찍어 주시겠어요?","sub":"정중하게 부탁하기","can":"처음 보는 사람에게 부담을 주지 않고 부탁한다.","canLabel":"할 수 있다","level":"초중급","chips":["-아/어 주시겠어요?","-아/어 주실 수 있나요?"],"pats":[{"ex":"사진 좀 찍어 주시겠어요?","pat":"-아/어 주시겠어요?","gloss":"정중한 부탁","spans":[[6,13]]},{"ex":"포장 좀 해 주실 수 있나요?","pat":"-아/어 주실 수 있나요?","gloss":"한 단계 더 조심스러운 부탁","spans":[[7,15]]}],"notes":[{"k":"표현","v":"죄송한데요 · 실례지만 · 혹시 · 감사합니다"},{"k":"문법","v":"정중함 순서 — -아/어 줘(반말) < -아/어 주세요(19과) < -아/어 주시겠어요? < -아/어 주실 수 있나요?. 뒤로 갈수록 상대가 거절할 여지를 남겨 주기 때문에 정중해집니다. 여행·서비스 상황에서는 뒤의 두 형태가 기본값입니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-upper-beginner-2/lessons/57-polite-requests/lesson.html","level":"초중급"}]},{"n":58,"title":"우리 영화 볼래요?","sub":"의향 묻고 권하기","can":"상대의 의향을 가볍게 묻고, 부담 없이 권해 본다.","canLabel":"할 수 있다","level":"초중급","chips":["-(으)ㄹ래요?","-지 그래요?"],"pats":[{"ex":"우리 영화 볼래요?","pat":"-(으)ㄹ래요?","gloss":"가벼운 의향·제안","spans":[[7,9]]},{"ex":"한번 가 보지 그래요?","pat":"-지 그래요?","gloss":"가볍게 권하는 조언","spans":[[6,11]]}],"notes":[{"k":"표현","v":"어때요? · 그럴까요? · 아니면 · 싫으면 말고요"},{"k":"문법","v":"제안 세 형태 — -(으)ㄹ까요?(같이 할까?) · -(으)ㄹ래요?(너는 어때?) · -는 게 어때요?(이렇게 해 봐). -(으)ㄹ래요는 윗사람에게는 쓰지 않습니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-upper-beginner-2/lessons/58-suggesting/lesson.html","level":"초중급"}]},{"n":59,"title":"음악 들으면서 공부해요","sub":"같이 하다가 바꾸기","can":"공부하거나 일하는 습관을 이야기한다 — 무엇을 하면서 같이 하는지, 그러다 결국 무엇으로 새는지.","canLabel":"할 수 있다","level":"초중급","chips":["-(으)면서","-다가"],"pats":[{"ex":"음악을 들으면서 공부해요.","pat":"-(으)면서","gloss":"동시 진행","spans":[[5,8]]},{"ex":"공부하다가 잠들었어요.","pat":"-다가","gloss":"도중의 전환","spans":[[3,5]]}],"notes":[{"k":"표현","v":"동시에 · 갑자기 · 그러다가 · 계속"},{"k":"문법","v":"-(으)면서는 앞뒤 주어가 같아야 합니다. -다가는 하던 일이 중간에 끊기고 다른 일이 시작될 때."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-upper-beginner-2/lessons/59-while-and-midway/lesson.html","level":"초중급"}]}],"checkpoint":"수행: 길에서 모르는 사람에게 사진을 부탁하는 대화를 끝까지 한다 — 배경을 깔고, 정중히 부탁하고, 한 장 더 부탁할 이유를 대고, 근처 카페를 같이 가자고 권해 본다."},{"label":"Unit 13","title":"느낌과 짐작","subtitle":"대화를 굴리는 어미","level":"초중급","levelText":"초중급","blurb":"단정하지 않고 말하는 법, 확인하는 법, 그리고 대화의 윤활유가 되는 종결 어미.","lessons":[{"n":60,"title":"날씨가 따뜻해졌어요","sub":"달라진 것 말하기","can":"전에는 아니었는데 지금은 그렇게 된 변화를 말한다.","canLabel":"할 수 있다","level":"초중급","chips":["-아/어지다","-게 되다"],"pats":[{"ex":"날씨가 많이 따뜻해졌어요.","pat":"-아/어지다","gloss":"형용사: 상태가 변함","spans":[[11,12]]},{"ex":"한국어를 좋아하게 됐어요.","pat":"-게 되다","gloss":"동사: 어떤 상황·결과에 이르게 됨","spans":[[8,9]]}],"notes":[{"k":"표현","v":"점점 · 많이 · 예전보다 · 요즘은"},{"k":"문법","v":"형용사면 -아/어지다(예뻐지다·좋아지다), 동사면 -게 되다(알게 되다·살게 되다). -게 되다에는 내 의지가 아니었다는 뉘앙스가 붙습니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-upper-beginner-2/lessons/60-what-changed/lesson.html","level":"초중급"}]},{"n":61,"title":"맛있는 것 같아요","sub":"단정하지 않고 말하기","can":"확실하지 않은 것을 조심스럽게 말하고, 겉모습을 보고 짐작한다.","canLabel":"할 수 있다","level":"초중급","chips":["-(으)ㄴ/는 것 같다","-아/어 보이다"],"pats":[{"ex":"저 집 음식이 맛있는 것 같아요.","pat":"-(으)ㄴ/는 것 같다","gloss":"상황·논리에 기반한 짐작","spans":[[10,15]]},{"ex":"좀 피곤해 보여요.","pat":"-아/어 보이다","gloss":"겉모습에 기반한 짐작","spans":[[6,7]]}],"notes":[{"k":"표현","v":"아마 · 제 생각에는 · 잘 모르겠지만 · 그런 것 같아요"},{"k":"문법","v":"한국어는 자기 감정·판단도 단정하지 않는 일이 많습니다(좋은 것 같아요=좋아요). 관형사형이 그대로 들어갑니다 — 맛있는 것 같다 / 먹은 것 같다 / 갈 것 같다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-upper-beginner-2/lessons/61-seems-and-looks/lesson.html","level":"초중급"}]},{"n":62,"title":"어디 있는지 아세요?","sub":"아는지 묻기","can":"의문사가 든 질문을 문장 안에 넣어 정중하게 묻는다.","canLabel":"할 수 있다","level":"초중급","chips":["-(으)ㄴ/는지 알다 / 모르다","-(으)ㄹ지 모르겠어요"],"pats":[{"ex":"화장실이 어디에 있는지 아세요?","pat":"-(으)ㄴ/는지 알다 / 모르다","gloss":"","spans":[[10,12]]},{"ex":"갈 수 있을지 모르겠어요.","pat":"-(으)ㄹ지 모르겠어요","gloss":"아직 정해지지 않은 일","spans":[[6,13]]}],"notes":[{"k":"표현","v":"혹시 · 알려 주실 수 있어요? · 저도 잘 모르겠어요"},{"k":"문법","v":"\"어디예요?\"보다 \"어디인지 아세요?\"가 훨씬 부드럽습니다. 여행·길 묻기에서 이 형태가 기본이 됩니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-upper-beginner-2/lessons/62-do-you-know-whether/lesson.html","level":"초중급"}]},{"n":63,"title":"한국어 재미있죠?","sub":"확인하고 상기시키기","can":"상대의 동의를 구하고, 상대도 아는 사실을 다시 꺼낸다.","canLabel":"할 수 있다","level":"초중급","chips":["-죠? / -지요?","-잖아요"],"pats":[{"ex":"한국어 재미있죠?","pat":"-죠? / -지요?","gloss":"확인·동의 구하기","spans":[[7,8]]},{"ex":"제가 어제 말했잖아요.","pat":"-잖아요","gloss":"상대도 아는 사실 상기","spans":[[8,11]]}],"notes":[{"k":"표현","v":"그렇죠 · 맞아요 · 그러게요 · 아 맞다"},{"k":"문법","v":"-죠?는 \"그렇지?\"라고 확인하는 것이고, -잖아요는 \"알고 있잖아\"라고 되짚는 것입니다. -잖아요는 모르는 사람에게 쓰면 따지는 것처럼 들립니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-upper-beginner-2/lessons/63-checking-and-reminding/lesson.html","level":"초중급"}]},{"n":64,"title":"이제 슬슬 자야겠어요","sub":"그 자리에서 마음먹기","can":"상황을 보고 즉석에서 짐작하거나, 그 자리에서 마음을 정한다.","canLabel":"할 수 있다","level":"초중급","chips":["-겠-","-아/어야겠다"],"pats":[{"ex":"많이 피곤하겠어요. / 제가 하겠습니다.","pat":"-겠-","gloss":"즉석 추측 · 말하는 이의 의지","spans":[[6,7]]},{"ex":"이제 슬슬 자야겠어요.","pat":"-아/어야겠다","gloss":"그 자리에서 굳힌 결심","spans":[[9,10]]}],"notes":[{"k":"표현","v":"맛있겠다 · 힘들겠다 · 이제 · 슬슬"},{"k":"문법","v":"-겠-은 남의 상황을 보고 바로 하는 짐작(맛있겠다)과 내 의지(제가 하겠습니다) 둘 다 씁니다. 36과의 -기로 하다(미리 정함)와 달리 -아/어야겠다는 방금 정한 것입니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-upper-beginner-2/lessons/64-deciding-on-the-spot/lesson.html","level":"초중급"}]},{"n":65,"title":"덜 맵게 해 주세요","sub":"원하는 상태로 부탁하기","can":"어떤 상태가 되도록 해 달라고 구체적으로 부탁한다.","canLabel":"할 수 있다","level":"초중급","chips":["-게","-게 해 주세요"],"pats":[{"ex":"맛있게 드세요.","pat":"-게","gloss":"형용사를 동작의 방식으로: 부사화","spans":[[2,3]]},{"ex":"덜 맵게 해 주세요.","pat":"-게 해 주세요","gloss":"그 상태로 만들어 달라고 부탁","spans":[[3,10]]}],"notes":[{"k":"표현","v":"조심히 가세요 · 크게 말해 주세요 · 짧게 · 따뜻하게"},{"k":"문법","v":"형용사 + -게 = 어떻게 할지를 말하는 부사가 됩니다(맛있다→맛있게, 크다→크게). 식당·미용실·가게에서 매일 쓰는 형태입니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-upper-beginner-2/lessons/65-make-it-this-way/lesson.html","level":"초중급"}]}],"checkpoint":"수행: 처음 간 식당에서 메뉴를 짐작으로 고르고, 맵기를 조절해 주문하고, 같이 간 사람에게 동의를 구하고, 요즘 입맛이 어떻게 달라졌는지 말한다."},{"label":"Unit 14","title":"겪은 일과 들은 말 전하기","subtitle":"","level":"중급","levelText":"중급","blurb":"중급으로 가는 징검다리: 내가 겪은 것을 전하는 어미, 그리고 남의 말을 옮기는 간접 화법 전체.","lessons":[{"n":66,"title":"저 그 영화 봤거든요","sub":"이유 대기와 겪은 일 회상","can" "spans":[[8,10]]},{"ex":"친구가 밥 같이 먹자고 해요.","pat":"-자고 하다","gloss":"청유문 인용","spans":[[10,12]]}],"notes":[{"k":"표현","v":"그러라고 하세요 · 알았다고 해 · 싫다고 했어"},{"k":"문법","v":"명령 인용은 -(으)세요가 아니라 -(으)라고입니다(오세요 → 오라고). 부탁을 옮길 때는 -아/어 달라고를 씁니다(도와 달라고 했어요)."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-intermediate-1/lessons/69-reporting-commands/lesson.html","level":"중급"}]},{"n":70,"title":"어디 가냐고 물어봤어요","sub":"옮기기 ③ 의문과 금지","can":"누가 무엇을 물었는지, 하지 말라고 했는지 전한다.","canLabel":"할 수 있다","level":"중급","chips":["-냐고 하다 / 물어보다","-지 말라고 하다"],"pats":[{"ex":"어디 가냐고 물어봤어요.","pat":"-냐고 하다 / 물어보다","gloss":"의문문 인용","spans":[[4,9]]},{"ex":"늦지 말라고 했어요.","pat":"-지 말라고 하다","gloss":"금지 인용","spans":[[1,6]]}],"notes":[{"k":"표현","v":"왜 그러냐고 · 언제 오냐고 · 하지 말라고 했잖아"},{"k":"문법","v":"의문 인용은 -(느)냐고인데 말할 때는 거의 항상 -냐고로 통일됩니다. -지 말라고 했잖아 → 실제 대화에서는 -지 말랬잖아로 줄어듭니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-intermediate-1/lessons/70-reporting-questions/lesson.html","level":"중급"}]},{"n":71,"title":"친구가 내일 온대요","sub":"옮기기 ④ 축약형","can":"들은 말을 실제 대화에서 쓰는 짧은 형태로 전한다.","canLabel":"할 수 있다","level":"중급","chips":["-대요 · -래요 · -재요","-대 · -래 · -재"],"pats":[{"ex":"친구가 내일 온대요. / 엄마가 일찍 오래요.","pat":"-대요 · -래요 · -재요","gloss":"인용 축약","spans":[[8,10],[22,24]]},{"ex":"그 집 진짜 맛있대.","pat":"-대 · -래 · -재","gloss":"","spans":[[9,10]]}],"notes":[{"k":"표현","v":"그렇대요 · 아니래요 · 온대 · 가재"},{"k":"문법","v":"대응표 — -다고 해요→-대요 / -(으)라고 해요→-래요 / -자고 해요→-재요. 의문 인용 -냐고 해요도 -냬요로 접히지만 원어민이 잘 쓰지 않으므로, 말하기 목표에서 빼고 들으면 알아보는 정도로만 짚습니다(말할 때는 -냐고 해요). 실제 대화에서는 축약형이 압도적으로 많이 쓰이므로 여기까지가 진짜 목표입니다. -단 말이야(=-다는 말이야)도 이 자리에서 같이 봅니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-intermediate-1/lessons/71-short-forms/lesson.html","level":"중급"}]}],"checkpoint":"수행: 어제 친구에게 들은 이야기를 제3자에게 통째로 전한다 — 무엇을 말했는지, 무엇을 하라고 했는지, 무엇을 물었는지, 무엇은 하지 말라고 했는지. 축약형으로 한 번 더."},{"label":"Unit 15","title":"시간과 흐름","subtitle":"일이 이어지는 방식","level":"중급","levelText":"중급","blurb":"동작이 어떻게 이어지는지, 어느 틈에 일어났는지 구체적으로 묘사하기.","lessons":[{"n":72, :[{"href":"tracks/2-core-patterns/courses/core-intermediate-2/lessons/80-purpose-and-goal/lesson.html","level":"중급"}]},{"n":81,"title":"잘하려면 매일 연습하세요","sub":"그러려면 이게 있어야","can":"목표를 이루려면 무엇이 필요한지, 무엇이 있어야 되는지 말한다.","canLabel":"할 수 있다","level":"중급","chips":["-(으)려면","-아/어야(지)"],"pats":[{"ex":"한국어를 잘하려면 매일 연습하세요.","pat":"-(으)려면","gloss":"의도가 있는 조건","spans":[[7,9]]},{"ex":"표가 있어야 들어갈 수 있어요.","pat":"-아/어야(지)","gloss":"필수 전제 조건","spans":[[4,6]]}],"notes":[{"k":"표현","v":"그러려면 · 일단 · 적어도 · 없으면 안 돼요"},{"k":"문법","v":"-(으)려면 = -(으)려고 하면의 줄임입니다. -아/어야는 그것 없이는 안 된다는 뜻이라 뒤에 -(으)ㄹ 수 있다 / 되다가 자주 붙습니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-intermediate-2/lessons/81-if-you-want-to/lesson.html","level":"중급"}]},{"n":82,"title":"혼자 살기가 쉽지 않아요","sub":"하기 쉬운 일, 하기 싫은 일","can":"어떤 일이 하기 쉬운지 어려운지 평가하고, 하기 싫다고 말한다.","canLabel":"할 수 있다","level":"중급","chips":["-기(가) 쉽다 · 어렵다 · 힘들다 · 편하다","-기 싫다 / -기 좋다"],"pats":[{"ex":"혼자 살기가 쉽지 않아요.","pat":"-기(가) 쉽다 · 어렵다 · 힘들다 · 편하다","gloss":"","spans":[[4,8]]},{"ex":"됐어, 더 말하기 싫어.","pat":"-기 싫다 / -기 좋다","gloss":"","spans":[[8,11]]}],"notes":[{"k":"표현","v":"귀찮다 · 번거롭다 · 그냥 · 됐어"},{"k":"문법","v":"-기는 동사를 명사로 만듭니다(살다→살기). 평가하는 형용사가 뒤에 붙는 이 틀은 여행·쇼핑·감상 어디서나 쓰입니다 — 먹기 편하게, 들고 가기 좋게."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-intermediate-2/lessons/82-easy-and-hard/lesson.html","level":"중급"}]},{"n":83,"title":"한 번만 들어 보기만 하면 반해요","sub":"그것만 하면","can":"그것 하나만 충족되면 결과가 정해져 있다고 말한다.","canLabel":"할 수 있다","level":"중급","chips":["-기만 하면","-기만 해도"],"pats":[{"ex":"한 번 보기만 하면 무조건 빠지게 돼요.","pat":"-기만 하면","gloss":"그것만 하면 반드시","spans":[[5,10]]},{"ex":"듣기만 해도 기분이 좋아져요.","pat":"-기만 해도","gloss":"그것만으로도 충분히","spans":[[1,6]]}],"notes":[{"k":"표현","v":"무조건 · 분명히 · 속는 셈 치고 · 한 번만"},{"k":"문법","v":"17과의 만(한정)이 -기에 붙은 것입니다. -기만 하면은 뒤에 반드시 그렇게 된다는 단정이, -기만 해도는 그것만으로 충분하다는 감탄이 옵니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-intermediate-2/lessons/83-just-do-it-once/lesson.html","level":"중급"}]},{"n":84,"title":"배울수록 어려워요", /courses/core-intermediate-3/lessons/86-broken-and-left/lesson.html","level":"중급"}]},{"n":87,"title":"아이에게 옷을 입혀요","sub":"남을 하게 만들기","can":"다른 사람이 어떤 행동을 하게 만들었다고 말한다.","canLabel":"할 수 있다","level":"중급","chips":["이 · 히 · 리 · 기 · 우 · 구 · 추","-게 하다 / -게 만들다"],"pats":[{"ex":"엄마가 아이를 재웠어요.","pat":"이 · 히 · 리 · 기 · 우 · 구 · 추","gloss":"","spans":[[5,6]]},{"ex":"친구를 웃게 했어요.","pat":"-게 하다 / -게 만들다","gloss":"사동사가 없는 동사를 사동으로","spans":[[5,6]]}],"notes":[{"k":"표현","v":"억지로 · 시키다 · ~하게 만들다 · 매번 말하게 만들지 마"},{"k":"문법","v":"피동(이히리기)과 사동(이히리기우구추)은 접미사가 겹칩니다. 목적어가 있으면 사동(아이를 재우다), 없으면 피동(문이 열리다) — 이 기준으로 갈라 봅니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-intermediate-3/lessons/87-making-them-do-it/lesson.html","level":"중급"}]},{"n":88,"title":"부장님이 일을 시켰어요","sub":"명사로 만드는 피동·사동","can":"시킨 일과 당한 일을 명사에 붙여 간단히 말한다.","canLabel":"할 수 있다","level":"중급","chips":["N + 시키다","N + 당하다 / 되다"],"pats":[{"ex":"부장님이 일을 시켰어요.","pat":"N + 시키다","gloss":"명사를 사동 동사로","spans":[[8,9]]},{"ex":"사기꾼에게 사기를 당했어요.","pat":"N + 당하다 / 되다","gloss":"명사를 피동 동사로","spans":[[10,11]]}],"notes":[{"k":"표현","v":"스포 당하다 · 해고되다 · 취소되다 · 억울하다"},{"k":"문법","v":"N하다의 짝입니다 — 공부하다(내가) / 공부시키다(남에게) / 취소되다(당함). 당하다는 항상 나쁜 일에만 씁니다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-intermediate-3/lessons/88-noun-based-voice/lesson.html","level":"중급"}]},{"n":89,"title":"제가 들어 드릴게요","sub":"도와드리기","can":"어른이나 손님을 위해 무언가를 해 드리겠다고 나선다.","canLabel":"할 수 있다","level":"중급","chips":["-아/어 드릴게요","주다 / 받다"],"pats":[{"ex":"무거우시죠? 제가 들어 드릴게요.","pat":"-아/어 드릴게요","gloss":"겸양의 동작 제공","spans":[[11,17]]},{"ex":"친구가 저한테 선물을 줬어요.","pat":"주다 / 받다","gloss":"수수 동사","spans":[]}],"notes":[{"k":"표현","v":"제가 할게요 · 괜찮으세요? · 도와드릴까요? · 감사합니다"},{"k":"문법","v":"16과의 -아/어 주다를 높인 것이 -아/어 드리다입니다. 방향이 중요합니다 — 내가 남에게는 드리다, 남이 나에게는 주다."}],"np":2,"decks":[{"href":"tracks/2-core-patterns/courses/core-intermediate-3/lessons/89-let-me-help-you/lesson.html","level":"중급"}]}],"checkpoint":"수행: 고장 신고와 사고 보고를 한 번씩 한다 — 무엇이 저절로 그렇게 됐는지, 누가 무엇을 시켜서 그렇게 됐 function chips(l) {
  const p = (l.chips || []).slice(0, 2).map(c =>
    `<span class="pat" title="${esc(c)}">${esc(c.replace(/\s+\(.*$/, "").trim() || c)}</span>`);
  if (l.refs && l.refs.length) p.push(`<span class="pat ref">핵심 ${l.refs[0]}</span>`);
  return p.join(`<span class="sep">·</span>`);
}

/** 문장을 그대로 쓰되, 배우는 조각에만 mark 를 씌운다. spans 는 빌드 때 계산된다. */
function marked(sentence, spans) {
  if (!spans || !spans.length) return esc(sentence);
  let out = "", last = 0;
  for (const [a, b] of spans) {
    out += esc(sentence.slice(last, a)) + "<mark>" + esc(sentence.slice(a, b)) + "</mark>";
    last = b;
  }
  return out + esc(sentence.slice(last));
}

/** 한글 학습 항목 안의 낱자 묶음만 크게 보여 준다. 설명은 그대로 두어 규칙의 맥락을 잃지 않는다. */
function markedJamo(text) {
  return esc(text).replace(/[ㄱ-ㅎㅏ-ㅣ](?:[\s＋/·–→]*[ㄱ-ㅎㅏ-ㅣ])*/g,
    chars => `<strong class="jamo">${chars}</strong>`);
}

/** 펼친 과는 라벨 붙은 칸 셋으로 이루어진다 — 무엇을 할 수 있게 되는가,
    무엇을 배우는가, 그리고 그것을 받쳐 주는 말. 트랙마다 칸의 이름만 달라진다. */
function detail(l) {
  const fields = [];
  const isHangul = T.id === "1-hangul";

  // 한글에서는 배울 글자·규칙이 본문이고, 읽을 수 있는 단어는 그 결과를 확인하는 예시다.
  if (isHangul && l.chips && l.chips.length) {
    fields.push({kind: "hangul-core", label: "이번에 배우는 것",
      body: `<div class="hangul-focus">${l.chips.map(c =>
        `<div class="hangul-focus-item"><span>${markedJamo(c)}</span></div>`).join("")}</div>`});
  }
  if (isHangul && l.can) {
    const words = l.can.split(" · ").map(w => w.trim()).filter(Boolean);
    fields.push({kind: "hangul-practice", label: "읽기 연습",
      body: `<div class="hangul-practice">${words.map(w => `<span>${esc(w)}</span>`).join("")}</div>`});
  }

  // ① 이 과의 약속
  if (l.can && !isHangul) {
    const words = l.can.split(" · ").map(w => w.trim()).filter(Boolean);
    const listy = words.length >= 3 && words.every(w => w.length <= 7);
    const goalLabel = l.canLabel === "읽을 수 있다" ? "읽기 목표"
      : l.canLabel === "이야기한다" ? "대화 목표"
      : l.canLabel === "일본어의 습관" ? "교정 포인트" : "이 과의 목표";
    fields.push({kind: "goal", label: goalLabel, body: listy
      ? `<div class="words">${words.map(w => `<span>${esc(w)}</span>`).join("")}</div>`
      : `<p class="goal">${esc(l.can)}</p>`});
  }

  // ② 배우는 것 — 패턴이 있으면 예문 안에서 짚어 주고, 없으면 이름만 늘어놓는다
  const ps = (l.pats || []).filter(p => p.ex || p.pat);
  if (ps.length) {
    fields.push({kind: "patterns", label: "핵심 패턴", body: `<div class="pats">` + ps.map(p => `<div class="pcard">
      ${p.ex ? `<p class="sent">${marked(p.ex, p.spans)}</p>` : ""}
      ${p.reply ? `<p class="reply">${esc(p.reply)}</p>` : ""}
      <div class="pmeta"><span class="pname">${esc(p.pat)}</span>
        ${p.gloss ? `<span class="pgloss">${esc(p.gloss)}</span>` : ""}</div></div>`).join("") + `</div>`});
  } else if (l.fix) {
    fields.push({kind: "goal", label: "고치는 법", body: `<p class="goal">${esc(l.fix)}</p>`});
  }
  if (l.chips && l.chips.length && !ps.length && !isHangul) {
    fields.push({kind: "items", label: l.fix ? "최소 대립쌍" : "배우는 것",
      body: `<div class="said">${l.chips.map(c => `<span>${esc(c)}</span>`).join("")}</div>`});
  }

  // ③ 받쳐 주는 말 — 통째로 외워 쓰는 표현과, 딱 한 줄짜리 규칙
  const said = (l.notes || []).find(n => n.k === "표현");
  const rule = (l.notes || []).find(n => n.k === "문법");
  if (said || rule) {
    // 트랙마다 구분자가 다르다: 핵심은 ·, 상황별은 쉼표. 쉼표로도 나누되 · 로 갈린
    // 뒤에는 건드리지 않는다 — "아, 그래요?" 처럼 쉼표를 품은 한 덩어리가 있다.
    let ws = [];
    if (said) {
      ws = said.v.split(/\s*·\s*/).filter(Boolean);
      if (ws.length === 1) ws = ws[0].split(/\s*,\s*/).filter(Boolean);
    }
    fields.push({kind: "support", label: said && rule ? "표현과 규칙" : said ? "바로 쓰는 표현" : "규칙",
      body: (ws.length ? `<div class="said">${ws.map(w => `<span>${esc(w)}</span>`).join("")}</div>` : "")
      + (rule ? `<p class="rule">${esc(rule.v)}</p>` : "")});
  }

  if (!fields.length) return `<p class="scene">이 과의 상세는 목차 원문에 있습니다.</p>`;
  return (l.scene ? `<p class="scene">${esc(l.scene)}</p>` : "")
    + fields.map(f => `<section class="field field-${f.kind}"><span class="lbl">${esc(f.label)}</span>${f.body}</section>`).join("");
}

function lessonRow(l, groupIndex, lessonIndex) {
  const c = chips(l);
  const firstLabel = `첫 ${T.lessonWord}`;
  const sub = l.sub === firstLabel ? "" : l.sub || (c ? "" : l.can);
  const firstTag = l.first ? `<span class="first-tag">${esc(firstLabel)}</span>` : "";
  const no = String(l.n).padStart(2, "0");
  // 덱이 있으면 그 과에서 곧장 수업 화면으로 나간다 — 카탈로그를 잃지 않도록 새 탭에서.
  const variants = l.decks || (l.deck ? [{href:l.deck, level:""}] : []);
  const showLevels = (l.levels || []).length > 1 || variants.length > 1;
  const deck = variants.length ? `<div class="deck-links">${variants.map(d =>
    `<a class="deck" href="../${esc(d.href)}" target="_blank" rel="noopener"
       title="${esc(l.title)}${d.level ? ` · ${esc(d.level)}` : ""} 덱을 새 탭에서 엽니다">${showLevels && d.level ? esc(d.level) : "덱 열기"} <span class="ext">↗</span></a>`
  ).join("")}</div>` : "";
  const detailId = `group-${groupIndex + 1}-lesson-${lessonIndex + 1}-detail`;
  return `<div class="lesson" data-text="${esc([l.title, l.sub, l.can, l.scene, (l.chips||[]).join(" "), (l.notes||[]).map(n=>n.v).join(" ")].join(" ").toLowerCase())}">
    <div class="lrow">
      <button class="lrow-btn" type="button" aria-expanded="false" aria-controls="${detailId}">
        <span class="lno">${esc(T.lessonWord)} ${no}</span>
        <span class="ltitle">${esc(l.title)}${sub ? ` <em>— ${esc(sub)}</em>` : ""}${firstTag}</span>
        <span class="lchips">${c}</span>
      </button>
      ${deck}
    </div>
    <div class="ldetail" id="${detailId}">${detail(l)}</div>
  </div>`;
}

function group(g, index) {
  // 단원 머리에는 "이 단원이 무엇인가"만 둔다.
  //   · 패턴 목록은 바로 아래 과 목록이 이미 한 줄씩 들고 있다 — 같은 것을 두 번 적는 셈이었다
  //   · 단원 설명문은 이 커리큘럼을 왜 이렇게 짰는지에 대한 메모라, 훑어보는 자리에 놓일 글이 아니다
  // 둘 다 지우면 남는 것은 이야기와 성과, 그리고 과 목록뿐이다.
  let head = "";
  if (g.work) {
    head += `<p class="story"><b>《${esc(g.work)}》</b> ${esc(g.story)}
      ${g.cast ? `<span class="cast">등장인물 — ${esc(g.cast)}</span>` : ""}</p>`;
  }
  if (g.blurb && (g.work || T.id === "3-contextual-korean")) {
    head += `<p class="gcan"><b class="lbl">끝내면 할 수 있는 것</b>${esc(g.blurb)}</p>`;
  }

  const bodyId = `group-${index + 1}-body`;
  const groupLevels = g.levels || (g.level ? [g.level] : []);
  const levelTags = groupLevels.map(lv =>
    `<span class="lv-tag"><i style="background:${lvColor(lv)}"></i>${esc(lv)}</span>`).join("");
  return `<div class="group" data-lv="${esc(groupLevels.join(" "))}">
    <button class="ghead" type="button" aria-expanded="false" aria-controls="${bodyId}">
      <span class="gnum">${esc(g.label)}</span>
      <span class="gtitle">${esc(g.title)}${g.subtitle ? `<em>${esc(g.subtitle)}</em>` : ""}</span>
      <span class="gmeta">${g.peak ? `<span>핵심 ${g.peak}과까지</span>` : ""}${g.form ? `<span>${esc(g.form)}</span>` : ""}
        ${levelTags}
        <span>${g.lessons.length}${esc(T.lessonWord)}</span><span class="caret"></span></span>
    </button>
    <div class="gbody" id="${bodyId}">
      ${head}
      <div class="lessons">${g.lessons.map((l, lessonIndex) => lessonRow(l, index, lessonIndex)).join("")}</div>
    </div>
  </div>`;
}

const $groups = document.getElementById("groups");
$groups.innerHTML = T.groups.map(group).join("");

/* ---------- 이전 · 다음 트랙 ---------- */
{
  const i = DATA.nav.findIndex(n => n.id === T.id);
  const prev = DATA.nav[i - 1], next = DATA.nav[i + 1];
  document.getElementById("nextrack").innerHTML =
    (prev ? `<a href="${esc(prev.id)}.html">← ${esc(prev.ko)}</a>` : `<a href="../catalog.html">← 카탈로그</a>`) +
    (next ? `<a href="${esc(next.id)}.html">${esc(next.ko)} →</a>` : `<a href="../catalog.html">카탈로그 →</a>`);
}

/* ---------- behaviour ---------- */
$groups.addEventListener("click", e => {
  if (e.target.closest(".deck")) return;          // 덱 링크는 펼치기가 아니라 나가기다
  const head = e.target.closest(".ghead");
  if (head) {
    const open = head.parentElement.classList.toggle("open");
    head.setAttribute("aria-expanded", open);
    return;
  }
  const row = e.target.closest(".lrow-btn");
  if (row) {
    const open = row.closest(".lesson").classList.toggle("open");
    row.setAttribute("aria-expanded", open);
  }
});

const $q = document.getElementById("q");
const $hits = document.getElementById("hits");
const $empty = document.getElementById("empty");
let activeLevels = new Set();

function apply() {
  const q = $q.value.trim().toLowerCase();
  let hits = 0, shown = 0;
  document.querySelectorAll(".group").forEach(g => {
    const groupLevels = new Set(g.dataset.lv.split(" ").filter(Boolean));
    const lvOk = !activeLevels.size || [...activeLevels].some(lv => groupLevels.has(lv));
    let inGroup = 0;
    g.querySelectorAll(".lesson").forEach(l => {
      const ok = lvOk && (!q || l.dataset.text.includes(q));
      l.classList.toggle("hide", !ok);
      if (ok) inGroup++;
    });
    g.classList.toggle("hide", inGroup === 0);
    if (inGroup) shown++;
    hits += inGroup;
    if (q) {
      g.classList.add("open");
      g.querySelector(".ghead")?.setAttribute("aria-expanded", "true");
    }
  });
  const filtering = q || activeLevels.size;
  $hits.textContent = filtering ? `${hits}${T.lessonWord} · ${shown}${T.unitWord}` : "";
  $empty.classList.toggle("hide", !(filtering && hits === 0));

  if (q) {
    document.querySelectorAll(".lesson:not(.hide) .ltitle").forEach(el => {
      const t = el.textContent, i = t.toLowerCase().indexOf(q);
      if (i < 0) return;
      el.innerHTML = esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length));
    });
  }
}

$q.addEventListener("input", () => {
  document.querySelectorAll(".ltitle mark").forEach(m => { const p = m.parentElement; p.innerHTML = p.textContent; });
  apply();
});

document.getElementById("levelbar").addEventListener("click", e => {
  const b = e.target.closest(".lv");
  if (!b) return;
  const lv = b.dataset.lv;
  activeLevels.has(lv) ? activeLevels.delete(lv) : activeLevels.add(lv);
  b.setAttribute("aria-pressed", activeLevels.has(lv));
  apply();
});

const $units = document.getElementById("expandUnits");
const $all = document.getElementById("expandAll");

function setOpen(units, lessons) {
  document.querySelectorAll(".group").forEach(g => {
    g.classList.toggle("open", units);
    g.querySelector(".ghead")?.setAttribute("aria-expanded", units);
  });
  document.querySelectorAll(".lesson").forEach(l => {
    l.classList.toggle("open", lessons);
    l.querySelector(".lrow-btn")?.setAttribute("aria-expanded", lessons);
  });
  $units.classList.toggle("on", units && !lessons);
  $all.classList.toggle("on", lessons);
  $units.textContent = units && !lessons ? `${T.unitWord} 모두 접기` : `${T.unitWord} 모두 펼치기`;
  $all.textContent = lessons ? `${T.lessonWord}까지 모두 접기` : `${T.lessonWord}까지 모두 펼치기`;
}
$units.addEventListener("click", () => setOpen(!$units.classList.contains("on"), false));
$all.addEventListener("click", () => { const on = !$all.classList.contains("on"); setOpen(on, on); });

// 들어오자마자 첫 단원은 열어 둔다 — 이 페이지는 이미 한 트랙으로 좁혀진 자리라,
// 무엇이 들어 있는지 한 번은 보여 주는 편이 낫다.
const firstGroup = document.querySelector(".group");
firstGroup?.classList.add("open");
firstGroup?.querySelector(".ghead")?.setAttribute("aria-expanded", "true");
</script>
</body>
