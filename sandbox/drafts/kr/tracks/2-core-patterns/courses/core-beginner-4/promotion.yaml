  lessons:
    - source: 31-what-i-want/lesson.html
      slug: 31-what-i-want
      week: 1
      title:
        ko: "\ub5a1\ubcf6\uc774 \uba39\uace0 \uc2f6\uc5b4\uc694 \u00b7 \ud558\uace0 \uc2f6\uc740 \uac83"
        en: "I want tteokbokki \u2014 saying what you want"
        ja: "\u30c8\u30c3\u30dd\u30c3\u30ad\u304c\u98df\u3079\u305f\u3044\u3067\u3059 \u00b7 \u3057\u305f\u3044\u3053\u3068"
    - source: 32-making-plans/lesson.html
      slug: 32-making-plans
      week: 2
      title:
        ko: "\uce5c\uad6c\ub97c \ub9cc\ub0a0 \uac70\uc608\uc694 \u00b7 \uacc4\ud68d \ub9d0\ud558\uae30"
        en: "I'm going to meet a friend \u2014 future plans"
        ja: "\u53cb\u3060\u3061\u306b\u4f1a\u3046\u3064\u3082\u308a\u3067\u3059 \u00b7 \u8a08\u753b\u3092\u8a71\u3059"
    - source: 33-ill-do-it/lesson.html
      slug: 33-ill-do-it
      week: 3
      title:
        ko: "\uc81c\uac00 \uc804\ud654\ud560\uac8c\uc694 \u00b7 \uc57d\uc18d\ud558\uace0 \uc81c\uc548\ud558\uae30"
        en: "I'll call \u2014 promising and offering"
        ja: "\u79c1\u304c\u96fb\u8a71\u3057\u307e\u3059\u306d \u00b7 \u7d04\u675f\u3059\u308b\u3001\u7533\u3057\u51fa\u308b"
    - source: 34-going-to-do/lesson.html
      slug: 34-going-to-do
      week: 4
      title:
        ko: "\ubc25 \uba39\uc73c\ub7ec \uac00\uc694 \u00b7 \ud558\ub7ec \uac00\uc790\uace0 \ud558\uae30"
        en: "Let's go eat \u2014 going in order to do"
        ja: "\u3054\u306f\u3093\u3092\u98df\u3079\u306b\u884c\u304d\u307e\u3059 \u00b7 \u301c\u3057\u306b\u884c\u3053\u3046\u3068\u8a00\u3046"
    - source: 35-can-you/lesson.html
      slug: 35-can-you
      week: 5
      title:
        ko: "\uae40\uce58 \uba39\uc744 \uc218 \uc788\uc5b4\uc694? \u00b7 \ud560 \uc218 \uc788\ub294 \uac83"
        en: "Can you eat kimchi? \u2014 ability"
        ja: "\u30ad\u30e0\u30c1\u98df\u3079\u3089\u308c\u307e\u3059\u304b? \u00b7 \u3067\u304d\u308b\u3053\u3068"
    - source: 36-intending-to/lesson.html
      slug: 36-intending-to
      week: 6
      title:
        ko: "\ud55c\uad6d\uc5b4\ub97c \ubc30\uc6b0\ub824\uace0 \ud574\uc694 \u00b7 \ub9c8\uc74c\uba39\uc740 \uacc4\ud68d"
        en: "I intend to learn Korean \u2014 settled intentions"
        ja: "\u97d3\u56fd\u8a9e\u3092\u7fd2\u304a\u3046\u3068\u601d\u3063\u3066\u3044\u307e\u3059 \u00b7 \u5fc3\u306b\u6c7a\u3081\u305f\u8a08\u753b"
    - source: 37-if-and-when/lesson.html
      slug: 37-if-and-when
      week: 7
      title:
        ko: "\uc2dc\uac04\uc774 \uc788\uc73c\uba74 \uac19\uc774 \uac00\uc694 \u00b7 \uc870\uac74 \uac78\uae30"
        en: "If you have time \u2014 conditions"
        ja: "\u6642\u9593\u304c\u3042\u308c\u3070\u4e00\u7dd2\u306b\u884c\u304d\u307e\u3057\u3087\u3046 \u00b7 \u6761\u4ef6\u3092\u3064\u3051\u308b"
    - source: 38-may-i/lesson.html
      slug: 38-may-i
      week: 8
      title:
        ko: "\uc5ec\uae30 \uc549\uc544\ub3c4 \ub3fc\uc694? \u00b7 \ud5c8\ub77d\uacfc \uae08\uc9c0"
        en: "May I sit here? \u2014 permission and prohibition"
        ja: "\u3053\u3053\u306b\u5ea7\u3063\u3066\u3082\u3044\u3044\u3067\u3059\u304b? \u00b7 \u8a31\u53ef\u3068\u7981\u6b62"
    - source: 39-thats-all-you-need/lesson.html
      slug: 39-thats-all-you-need
      week: 9
      title:
        ko: "\uc774\ub984\ub9cc \uc4f0\uba74 \ub3fc\uc694 \u00b7 \uc774\ub9cc\ud07c\ub9cc \ud558\uba74 \ub428"
        en: "Just write your name \u2014 that's all it takes"
        ja: "\u540d\u524d\u3060\u3051\u66f8\u3051\u3070\u5927\u4e08\u592b\u3067\u3059 \u00b7 \u3053\u308c\u3060\u3051\u3067\u6e08\u3080"
    - source: 40-i-have-to/lesson.html
      slug: 40-i-have-to
      week: 10
      title:
        ko: "\ub0b4\uc77c\uae4c\uc9c0 \ub05d\ub0b4\uc57c \ub3fc\uc694 \u00b7 \uaf2d \ud574\uc57c \ud558\ub294 \uac83"
        en: "I have to finish by tomorrow \u2014 obligation"
        ja: "\u660e\u65e5\u307e\u3067\u306b\u7d42\u308f\u3089\u305b\u306a\u3044\u3068\u3044\u3051\u307e\u305b\u3093 \u00b7 \u5fc5\u305a\u3059\u308b\u3053\u3068"
    - source: 41-in-progress/lesson.html
      slug: 41-in-progress
      week: 11
      title:
        ko: "\uc9c0\uae08 \ubc25 \uba39\uace0 \uc788\uc5b4\uc694 \u00b7 \ud558\ub294 \uc911\uacfc \ub418\uc5b4 \uc788\ub294 \uc0c1\ud0dc"
        en: "I'm eating now \u2014 in progress and in a state"
        ja: "\u4eca\u3054\u306f\u3093\u3092\u98df\u3079\u3066\u3044\u307e\u3059 \u00b7 \u9032\u884c\u4e2d\u3068\u3001\u306a\u3063\u3066\u3044\u308b\u72b6\u614b"
    - source: 42-give-it-a-try/lesson.html
      slug: 42-give-it-a-try
      week: 12
      title:
        ko: "\ud55c\ubc88 \uba39\uc5b4 \ubcf4\uc138\uc694 \u00b7 \uc2dc\ub3c4\uc640 \uacbd\ud5d8"
        en: "Give it a try \u2014 attempts and experience"
        ja: "\u4e00\u5ea6\u98df\u3079\u3066\u307f\u3066\u304f\u3060\u3055\u3044 \u00b7 \u8a66\u3059\u3053\u3068\u3001\u7d4c\u9a13"
    - source: 43-banmal-basics/lesson.html
      slug: 43-banmal-basics
      week: 13
      title:
        ko: "\ub108 \uc9c0\uae08 \ubb50 \ud574? \u00b7 \ubc18\ub9d0 \u2460 \uae30\ucd08"
        en: "What are you doing? \u2014 casual speech 1"
        ja: "\u4eca\u4f55\u3057\u3066\u308b? \u00b7 \u30bf\u30e1\u53e3 \u2460 \u57fa\u672c"
    - source: 44-banmal-past-future/lesson.html
      slug: 44-banmal-past-future
      week: 14
      title:
        ko: "\uc5b4\uc81c \uc601\ud654 \ubd24\uc5b4 \u00b7 \ubc18\ub9d0 \u2461 \uacfc\uac70\uc640 \ubbf8\ub798"
        en: "I saw a movie \u2014 casual speech 2"
        ja: "\u6628\u65e5\u6620\u753b\u898b\u305f \u00b7 \u30bf\u30e1\u53e3 \u2461 \u904e\u53bb\u3068\u672a\u6765"
    - source: 45-banmal-lets-go/lesson.html
      slug: 45-banmal-lets-go
      week: 15
      title:
        ko: "\uac19\uc774 \uac00\uc790 \u00b7 \ubc18\ub9d0 \u2462 \uac19\uc774 \ud558\uae30\uc640 \uc2dc\ud0a4\uae30"
        en: "Let's go \u2014 casual speech 3"
        ja: "\u4e00\u7dd2\u306b\u884c\u3053\u3046 \u00b7 \u30bf\u30e1\u53e3 \u2462 \u8a98\u3046\u3001\u983c\u3080"

