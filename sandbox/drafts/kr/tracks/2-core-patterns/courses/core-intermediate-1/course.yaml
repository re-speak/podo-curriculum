#    66  ✓ 66-because-and-recalling저 그 영화 봤거든요 — 이유 대기와 겪은 일 회상
#    67  ✓ 67-telling-and-conceding그 집 좋던데요 — 전하며 반응 기다리기
#    68  ✓ 68-reporting-statements친구가 내일 온다고 했어요 — 들은 말 옮기기 ① 평서문
#    69  ✓ 69-reporting-commands엄마가 일찍 오라고 했어 — 옮기기 ② 명령과 청유
#    70  ✓ 70-reporting-questions어디 가냐고 물어봤어요 — 옮기기 ③ 의문과 금지
#    71  ✓ 71-short-forms친구가 내일 온대요 — 옮기기 ④ 축약형
#    72  ✓ 72-on-the-way가는 길에, 오자마자 — 오가는 길의 하루
