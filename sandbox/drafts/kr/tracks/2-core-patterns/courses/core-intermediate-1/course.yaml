  description:
    ko: 겪은 일을 꺼내고 들은 말을 옮기며, 그 일이 언제 어떤 상태에서 있었는지 말한다.
    en: Bring up what you went through, report what you were told, and place it in time.
    ja: 自分の経験を切り出し、聞いた話を伝え、それがいつ・どんな状態で起きたかを話す。

  tutorGroups:
    allowRandom: []
    assignedOnly: []

