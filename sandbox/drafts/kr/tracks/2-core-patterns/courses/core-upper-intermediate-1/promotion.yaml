  lessons:
    - source: 90-surely-cold-outside/lesson.html
      slug: 90-surely-cold-outside
      week: 1
      title:
        ko: "\ubc16\uc5d0 \ucd94\uc6b8 \ud150\ub370 \u00b7 \uadf8\ub7f4 \ud14c\ub2c8\uae4c"
        en: "It must be cold outside"
        ja: "\u5916\u306f\u5bd2\u3044\u3067\u3057\u3087\u3046\u304b\u3089\u30fb\u305d\u3046\u3059\u308b\u304b\u3089"
    - source: 91-i-tried-it-and/lesson.html
      slug: 91-i-tried-it-and
      week: 2
      title:
        ko: "\uba39\uc5c8\ub354\ub2c8 \uc880 \ub0ab\ub124\uc694 \u00b7 \uc544\ud508\uac00 \ubd10\uc694"
        en: "I tried it and found out"
        ja: "\u98f2\u3093\u3060\u3089\u697d\u306b\u306a\u308a\u307e\u3057\u305f\u30fb\u75db\u3044\u307f\u305f\u3044\u3067\u3059"
    - source: 92-no-way-and-maybe/lesson.html
      slug: 92-no-way-and-maybe
      week: 3
      title:
        ko: "\ubc94\uc778\uc77c \ub9ac\uac00 \uc5c6\uc5b4\uc694 \u00b7 \uac70\uc9d3\ub9d0\uc77c\uc9c0\ub3c4 \ubab0\ub77c\uc694"
        en: "No way, or maybe"
        ja: "\u72af\u4eba\u306e\u306f\u305a\u304c\u3042\u308a\u307e\u305b\u3093\u30fb\u3046\u305d\u304b\u3082\u3057\u308c\u307e\u305b\u3093"
    - source: 93-i-thought-it-was/lesson.html
      slug: 93-i-thought-it-was
      week: 4
      title:
        ko: "\uc624\ub298 \uc26c\ub294 \uc904 \uc54c\uc558\uc5b4\uc694 \u00b7 \uadf8\ub7f4 \uc904 \uc54c\uc558\uc5b4"
        en: "I thought it was"
        ja: "\u4eca\u65e5\u4f11\u307f\u3060\u3068\u601d\u3063\u3066\u3044\u307e\u3057\u305f\u30fb\u305d\u3046\u306a\u308b\u3068\u601d\u3063\u3066\u305f"
    - source: 94-almost-and-completely/lesson.html
      slug: 94-almost-and-completely
      week: 5
      title:
        ko: "\ub118\uc5b4\uc9c8 \ubed4\ud588\uc5b4\uc694 \u00b7 \ub2e4 \uba39\uc5b4 \ubc84\ub838\uc5b4\uc694"
        en: "Almost, and completely"
        ja: "\u8ee2\u3076\u3068\u3053\u308d\u3067\u3057\u305f\u30fb\u5168\u90e8\u98df\u3079\u3066\u3057\u307e\u3044\u307e\u3057\u305f"
    - source: 95-as-you-know/lesson.html
      slug: 95-as-you-know
      week: 6
      title:
        ko: "\uc544\uc2dc\ub2e4\uc2dc\ud53c \u00b7 \uc624\ub824\ub098 \ubd10\uc694"
        en: "As you know"
        ja: "\u3054\u5b58\u3058\u306e\u3068\u304a\u308a\u30fb\u964d\u308a\u305d\u3046\u3067\u3059"
    - source: 96-if-and-just-in-case/lesson.html
      slug: 96-if-and-just-in-case
      week: 7
      title:
        ko: "\ubd80\uc790\ub77c\uba74 \u00b7 \ub9c9\ud790\uae4c \ubd10"
        en: "If, and just in case"
        ja: "\u91d1\u6301\u3061\u306a\u3089\u30fb\u6df7\u3080\u304b\u3068\u601d\u3063\u3066"
    - source: 97-no-matter-what/lesson.html
      slug: 97-no-matter-what
      week: 8
      title:
        ko: "\uc544\ubb34\ub9ac \uadf8\ub798\ub3c4 \u00b7 \ubb58 \uace8\ub77c\ub3c4"
        en: "No matter what"
        ja: "\u3044\u304f\u3089\u305d\u3046\u3067\u3082\u30fb\u4f55\u3092\u9078\u3093\u3067\u3082"
    - source: 98-no-use-trying/lesson.html
      slug: 98-no-use-trying
      week: 9
      title:
        ko: "\uac00\ub098 \ub9c8\ub098 \u00b7 \ud574 \ubd24\uc790"
        en: "No use trying"
        ja: "\u884c\u3063\u3066\u3082\u884c\u304b\u306a\u304f\u3066\u3082\u30fb\u3084\u3063\u305f\u3063\u3066"
    - source: 99-for-what-it-is/lesson.html
      slug: 99-for-what-it-is
      week: 10
      title:
        ko: "\uaca8\uc6b8\uce58\uace0\ub294 \u00b7 \uc11c\uc6b8 \uc0ac\ub78c\uce58\uace0"
        en: "For what it is"
        ja: "\u51ac\u306b\u3057\u3066\u306f\u30fb\u30bd\u30a6\u30eb\u306e\u4eba\u3067"
    - source: 100-far-from-it/lesson.html
      slug: 100-far-from-it
      week: 11
      title:
        ko: "\ub3c4\uc640\uc8fc\uae30\ub294\ucee4\ub155 \u00b7 \ubb3c\uc870\ucc28"
        en: "Far from it"
        ja: "\u624b\u4f1d\u3046\u3069\u3053\u308d\u304b\u30fb\u6c34\u3055\u3048"
    - source: 101-yeah-right/lesson.html
      slug: 101-yeah-right
      week: 12
      title:
        ko: "\uc77c\uc5b4\ub098\uae30\ub294 \ubb34\uc2a8 \u00b7 \uac04\ub2e4\ub2c8\uae4c"
        en: "Yeah right"
        ja: "\u8d77\u304d\u308b\u3060\u306a\u3093\u3066\u30fb\u884c\u304f\u3063\u3066\u3070"

