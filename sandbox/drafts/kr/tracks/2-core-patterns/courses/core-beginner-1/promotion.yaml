  lessons:
    - source: 01-introducing-yourself/lesson.html
      slug: 01-introducing-yourself
      week: 1
      title:
        ko: "\uc800\ub294 \ub2e4\ub098\uce74\uc608\uc694 \u00b7 \uc774\ub984 \uc8fc\uace0\ubc1b\uae30"
        en: "I'm Tanaka \u2014 exchanging names"
        ja: "\u7530\u4e2d\u3067\u3059 \u00b7 \u540d\u524d\u3092\u3084\u308a\u3068\u308a\u3059\u308b"
    - source: 02-not-that-one/lesson.html
      slug: 02-not-that-one
      week: 2
      title:
        ko: "\ud559\uc0dd\uc774 \uc544\ub2c8\uc5d0\uc694 \u00b7 \uc544\ub2c8\ub77c\uace0 \ubc14\ub85c\uc7a1\uae30"
        en: "I'm not a student \u2014 correcting a wrong guess"
        ja: "\u5b66\u751f\u3058\u3083\u3042\u308a\u307e\u305b\u3093 \u00b7 \u9055\u3046\u3068\u8a00\u3044\u76f4\u3059"
    - source: 03-what-is-this/lesson.html
      slug: 03-what-is-this
      week: 3
      title:
        ko: "\uc774\uac74 \ubb50\uc608\uc694? \u00b7 \ub208\uc55e\uc758 \uc0ac\ubb3c"
        en: "What's this? \u2014 asking about things in front of you"
        ja: "\u3053\u308c\u306f\u4f55\u3067\u3059\u304b? \u00b7 \u76ee\u306e\u524d\u306e\u3082\u306e"
    - source: 04-who-and-where/lesson.html
      slug: 04-who-and-where
      week: 4
      title:
        ko: "\uc774\ubd84\uc740 \ub204\uad6c\uc608\uc694? \u00b7 \uc0ac\ub78c\uacfc \uc7a5\uc18c"
        en: "Who's this? \u2014 asking about people and places"
        ja: "\u3053\u306e\u65b9\u306f\u3069\u306a\u305f\u3067\u3059\u304b? \u00b7 \u4eba\u3068\u5834\u6240"
    - source: 05-whose-is-it/lesson.html
      slug: 05-whose-is-it
      week: 5
      title:
        ko: "\uc774\uac74 \uc81c \uac70\uc608\uc694 \u00b7 \ub204\uad6c \uac83\uc778\uc9c0"
        en: "It's mine \u2014 saying whose it is"
        ja: "\u3053\u308c\u306f\u79c1\u306e\u3067\u3059 \u00b7 \u8ab0\u306e\u3082\u306e\u304b"
    - source: 06-where-are-you-from/lesson.html
      slug: 06-where-are-you-from
      week: 6
      title:
        ko: "\uc5b4\ub290 \ub098\ub77c \uc0ac\ub78c\uc774\uc5d0\uc694? \u00b7 \ucd9c\uc2e0\uacfc \uc885\ub958"
        en: "Where are you from? \u2014 origins and kinds"
        ja: "\u3069\u3053\u306e\u56fd\u306e\u65b9\u3067\u3059\u304b? \u00b7 \u51fa\u8eab\u3068\u7a2e\u985e"
    - source: 07-daily-routine/lesson.html
      slug: 07-daily-routine
      week: 7
      title:
        ko: "\ub9e4\uc77c \uc6b4\ub3d9\ud574\uc694 \u00b7 \ud558\ub8e8 \uc77c\uacfc"
        en: "I exercise every day \u2014 talking about your routine"
        ja: "\u6bce\u65e5\u904b\u52d5\u3057\u307e\u3059 \u00b7 \u4e00\u65e5\u306e\u904e\u3054\u3057\u65b9"
    - source: 08-place-particles/lesson.html
      slug: 08-place-particles
      week: 8
      title:
        ko: "\ud559\uad50\uc5d0 \uac00\uc694 \u00b7 \uc5b4\ub514\uc5d0\uc11c \ubb34\uc5c7\uc744"
        en: "I go to school \u2014 where you go and where you do it"
        ja: "\u5b66\u6821\u306b\u884c\u304d\u307e\u3059 \u00b7 \u3069\u3053\u3067\u4f55\u3092\u3059\u308b\u304b"
    - source: 09-how-it-feels/lesson.html
      slug: 09-how-it-feels
      week: 9
      title:
        ko: "\uc9c4\uc9dc \ub9db\uc788\ub124\uc694! \u00b7 \ub290\ub08c \ubc14\ub85c \ub9d0\ud558\uae30"
        en: "That's really good! \u2014 reacting on the spot"
        ja: "\u672c\u5f53\u306b\u304a\u3044\u3057\u3044\u3067\u3059\u306d! \u00b7 \u611f\u3058\u305f\u3053\u3068\u3092\u3059\u3050\u8a00\u3046"
    - source: 10-not-and-cannot/lesson.html
      slug: 10-not-and-cannot
      week: 10
      title:
        ko: "\uc220\uc744 \uc548 \ub9c8\uc154\uc694 \u00b7 \uc548 \ud558\ub294 \uac83\uacfc \ubabb \ud558\ub294 \uac83"
        en: "I don't drink \u2014 won't versus can't"
        ja: "\u304a\u9152\u306f\u98f2\u307f\u307e\u305b\u3093 \u00b7 \u3057\u306a\u3044\u3053\u3068\u3068\u3001\u3067\u304d\u306a\u3044\u3053\u3068"

