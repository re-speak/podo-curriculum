kind: Course
metadata:
  # podo-curriculum-public 2-core-patterns · 9과.
  # tools/plan_courses.py 가 목차에서 끊었다.
  #
  # podo:level: 중급
  # 이 코스의 덱이 <meta name="podo:level"> 에 적을 값이다. 스키마가 metadata 에
  # 새 필드를 막아서 주석으로 둔다 — tools/new_lesson.py 가 이 줄을 읽는다.
  # 발음 표기(.yomi)를 다는지가 이 값으로 갈리므로 덱마다 손으로 넣게 두면 안 된다.
  slug: core-intermediate-2

spec:
  curriculumType: BASIC
  countryCode: JP
  # 자연키의 일부다 — 바꾸면 같은 코스의 수정이 아니라 다른 코스가 된다.
  classLevel: "200.080"
  lessonTime: 25
  # 검수 전까지는 false. true 로 바꾸는 순간 apply 가 학습자에게 노출시킨다.
  enabled: false
  difficulty: INTERMEDIATE

  title:
    ko: 핵심 문법 패턴 · 중급 · 2
    en: Core grammar patterns · Intermediate · 2
    ja: コア文法パターン · 中級 · 2

  # 학습자가 카탈로그에서 읽는 문장이다. 앱이 로케일로 고르므로 JP 마켓 코스는
  # ja 가 화면에 뜬다 — 여기 세 언어는 tools/course-copy.json 이 원본이고,
  # ko 만 목차의 '끝내면 할 수 있는 것' 을 그대로 쓴다.
  description:
    ko: 이유와 핑계를 대고, 목적과 조건을 걸어 무엇이 있어야 되는지 설명한다.
    en: Give reasons and excuses, and set out a purpose and the conditions it needs.
    ja: 理由や言い訳を述べ、目的と条件を立てて何が必要かを説明する。

  tutorGroups:
    allowRandom: []
    assignedOnly: []

