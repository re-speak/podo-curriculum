# 슬러그는 스키마가 NN-english-words 를 요구하므로 덱을 쓸 때 정해진다.
#    76  ✓ 76-making-excuses게임하느라고 숙제를 못 했어요 — 핑계 대기
#    77  ✓ 77-thanks-to-you선생님 덕분에요 — 좋은 원인과 짐작되는 원인
#    78  ✓ 78-since-i-saw날씨가 춥길래 코트를 입었어요 — 보고 나서 그래서
#    79  ✓ 79-as-you-keep-at-it공부하다 보니 알게 됐어요 — 계속하다 보니, 계속하다 보면
#    80  ✓ 80-purpose-and-goal건강을 위해, 안 걸리도록 — 목적과 목표
#    81  ✓ 81-if-you-want-to잘하려면 매일 연습하세요 — 그러려면 이게 있어야
#    82  ✓ 82-easy-and-hard혼자 살기가 쉽지 않아요 — 하기 쉬운 일, 하기 싫은 일
#    83  ✓ 83-just-do-it-once한 번만 들어 보기만 하면 반해요 — 그것만 하면
