#   105  ✓ 105-nothing-but기다릴 수밖에 없어요 — 그 방법밖에 없음
#   106  ✓ 106-rather-and-barely잘 먹는 편이에요 — 단정하지 않고 대충 그쪽
#   107  ✓ 107-should-have가져올 걸 그랬어요 — 그때 그랬어야 했는데
#   108  ✓ 108-tend-to-and-bound-to자꾸 잃어버리곤 해요 — 나쁜 버릇과 위로
