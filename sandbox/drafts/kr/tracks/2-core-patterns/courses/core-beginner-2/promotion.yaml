  lessons:
    - source: 11-how-much/lesson.html
      slug: 11-how-much
      week: 1
      title:
        ko: "\uc774\uac70 \uc5bc\ub9c8\uc608\uc694? \u00b7 \uac00\uaca9 \ubb3b\uae30"
        en: "How much is this? \u2014 asking prices"
        ja: "\u3053\u308c\u3044\u304f\u3089\u3067\u3059\u304b? \u00b7 \u5024\u6bb5\u3092\u805e\u304f"
    - source: 12-counting-things/lesson.html
      slug: 12-counting-things
      week: 2
      title:
        ko: "\uc0ac\uacfc \uc138 \uac1c \uc8fc\uc138\uc694 \u00b7 \uac1c\uc218\ub85c \uc8fc\ubb38\ud558\uae30"
        en: "Three apples, please \u2014 ordering by count"
        ja: "\u308a\u3093\u3054\u4e09\u3064\u304f\u3060\u3055\u3044 \u00b7 \u500b\u6570\u3067\u6ce8\u6587\u3059\u308b"
    - source: 13-telling-time/lesson.html
      slug: 13-telling-time
      week: 3
      title:
        ko: "\uc9c0\uae08 \uba87 \uc2dc\uc608\uc694? \u00b7 \uc2dc\uac04 \ubb3b\uae30"
        en: "What time is it? \u2014 asking the time"
        ja: "\u4eca\u4f55\u6642\u3067\u3059\u304b? \u00b7 \u6642\u9593\u3092\u805e\u304f"
    - source: 14-dates-and-days/lesson.html
      slug: 14-dates-and-days
      week: 4
      title:
        ko: "\uba87 \uc6d4 \uba70\uce60\uc774\uc5d0\uc694? \u00b7 \ub0a0\uc9dc \ubb3b\uae30"
        en: "What's the date? \u2014 months, days and weekdays"
        ja: "\u4f55\u6708\u4f55\u65e5\u3067\u3059\u304b? \u00b7 \u65e5\u4ed8\u3092\u805e\u304f"
    - source: 15-from-and-until/lesson.html
      slug: 15-from-and-until
      week: 5
      title:
        ko: "\uc544\ud649 \uc2dc\ubd80\ud130 \uc5ec\uc12f \uc2dc\uae4c\uc9c0 \u00b7 \uc5b4\ub514\ubd80\ud130 \uc5b4\ub514\uae4c\uc9c0"
        en: "From nine to six \u2014 spans of time and place"
        ja: "\u4e5d\u6642\u304b\u3089\u516d\u6642\u307e\u3067 \u00b7 \u3069\u3053\u304b\u3089\u3069\u3053\u307e\u3067"
    - source: 16-is-there-one/lesson.html
      slug: 16-is-there-one
      week: 6
      title:
        ko: "\uc5ec\uae30 \ud654\uc7a5\uc2e4 \uc788\uc5b4\uc694? \u00b7 \uc788\ub294\uc9c0 \ubb3b\uae30"
        en: "Is there a restroom? \u2014 asking what exists"
        ja: "\u3053\u3053\u306b\u30c8\u30a4\u30ec\u3042\u308a\u307e\u3059\u304b? \u00b7 \u3042\u308b\u304b\u3069\u3046\u304b\u805e\u304f"
    - source: 17-where-it-is/lesson.html
      slug: 17-where-it-is
      week: 7
      title:
        ko: "\ucc45\uc0c1 \uc704\uc5d0 \uc788\uc5b4\uc694 \u00b7 \uc5b4\ub514 \uc788\ub294\uc9c0"
        en: "It's on the desk \u2014 saying where things are"
        ja: "\u673a\u306e\u4e0a\u306b\u3042\u308a\u307e\u3059 \u00b7 \u3069\u3053\u306b\u3042\u308b\u304b"
    - source: 18-please-sit/lesson.html
      slug: 18-please-sit
      week: 8
      title:
        ko: "\uc5ec\uae30 \uc549\uc73c\uc138\uc694 \u00b7 \uc9c0\uc2dc \uc54c\uc544\ub4e3\uace0 \uad8c\ud558\uae30"
        en: "Have a seat \u2014 understanding and offering"
        ja: "\u3053\u3053\u306b\u5ea7\u3063\u3066\u304f\u3060\u3055\u3044 \u00b7 \u6307\u793a\u3092\u805e\u304d\u53d6\u3063\u3066\u52e7\u3081\u308b"
    - source: 19-asking-a-favour/lesson.html
      slug: 19-asking-a-favour
      week: 9
      title:
        ko: "\ubb3c \uc880 \uc8fc\uc138\uc694 \u00b7 \ubd80\ud0c1\ud558\uae30"
        en: "Some water, please \u2014 making requests"
        ja: "\u304a\u6c34\u304f\u3060\u3055\u3044 \u00b7 \u304a\u9858\u3044\u3059\u308b"

