    ko: 가격·개수·시간·날짜를 묻고, 무엇이 어디에 있는지 확인하고, 필요한 것을 부탁한다.
    en: Ask prices, counts, times and dates, find out where something is, and make a request.
    ja: 値段・個数・時間・日付をたずね、何がどこにあるかを確かめ、必要なものを頼む。

  tutorGroups:
    allowRandom: []
    assignedOnly: []

