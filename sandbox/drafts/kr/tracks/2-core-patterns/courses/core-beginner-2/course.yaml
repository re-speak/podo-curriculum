#    14  ✓ 14-dates-and-days오늘 몇 월 며칠이에요? — 날짜 묻기
#    15  ✓ 15-from-and-until아홉 시부터 여섯 시까지 — 어디부터 어디까지
#    16  ✓ 16-is-there-one여기 화장실 있어요? — 있는지 묻기
