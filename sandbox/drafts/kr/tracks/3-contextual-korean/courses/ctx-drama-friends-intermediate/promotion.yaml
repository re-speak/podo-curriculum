apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/kr/ctx-drama-friends-intermediate

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/kr/tracks/3-contextual-korean/courses/ctx-drama-friends-intermediate/lessons

  lessons:
    - source: 01-first-meeting/lesson.html
      slug: 01-first-meeting
      week: 1
      title:
        ko: "첫 만남"
        en: "First meeting"
        ja: "初対面"
    - source: 02-again/lesson.html
      slug: 02-again
      week: 2
      title:
        ko: "또 만났네"
        en: "Meeting again"
        ja: "また会ったね"
    - source: 03-tastes-match/lesson.html
      slug: 03-tastes-match
      week: 3
      title:
        ko: "취향이 같네"
        en: "Our tastes match"
        ja: "趣味が合うね"
    - source: 04-go-together/lesson.html
      slug: 04-go-together
      week: 4
      title:
        ko: "같이 갈래?"
        en: "Want to go together?"
        ja: "一緒に行く？"
    - source: 05-late/lesson.html
      slug: 05-late
      week: 5
      title:
        ko: "늦었다고?"
        en: "You're late?"
        ja: "遅れたって？"
    - source: 06-on-your-side/lesson.html
      slug: 06-on-your-side
      week: 6
      title:
        ko: "네 편이야"
        en: "I'm on your side"
        ja: "あなたの味方だよ"
    - source: 07-one-favor/lesson.html
      slug: 07-one-favor
      week: 7
      title:
        ko: "부탁 하나만"
        en: "One favor"
        ja: "お願いが1つ"
    - source: 08-my-treat/lesson.html
      slug: 08-my-treat
      week: 8
      title:
        ko: "오늘은 내가 살게"
        en: "My treat today"
        ja: "今日は私がおごる"
    - source: 09-just-between-us/lesson.html
      slug: 09-just-between-us
      week: 9
      title:
        ko: "너한테만 말하는데"
        en: "Just between us"
        ja: "あなただけに言うけど"
    - source: 10-friends-for-long/lesson.html
      slug: 10-friends-for-long
      week: 10
      title:
        ko: "오래 볼 사이"
        en: "Friends for the long run"
        ja: "ずっと会う仲"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/kr/tracks/3-contextual-korean/courses/ctx-drama-friends-intermediate/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
