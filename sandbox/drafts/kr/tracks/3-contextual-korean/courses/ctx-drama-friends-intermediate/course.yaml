    ko: 처음 본 사람에게 말을 걸어 친구가 되고, 편들고 부탁하고 털어놓는 말을 반말로 할 수 있다.
    en: Talk your way from a stranger into a close friend — take sides, ask favours, pick up the bill and share what you tell nobody else.
    ja: 初対面から親友になるまでを話しきる。味方になり、気軽に頼み、おごり、誰にも言えない話を打ち明ける。

