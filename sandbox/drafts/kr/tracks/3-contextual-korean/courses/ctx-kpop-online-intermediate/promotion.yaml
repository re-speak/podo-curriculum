      title:
        ko: "팬 리액션 쓰기"
        en: "Writing fan reactions"
        ja: "ファンの反応を書く"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/kr/tracks/3-contextual-korean/courses/ctx-kpop-online-intermediate/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
