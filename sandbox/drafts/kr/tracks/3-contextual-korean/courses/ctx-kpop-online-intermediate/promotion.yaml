apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/kr/ctx-kpop-online-intermediate

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/kr/tracks/3-contextual-korean/courses/ctx-kpop-online-intermediate/lessons

  lessons:
    - source: 01-trending/lesson.html
      slug: 01-trending
      week: 1
      title:
        ko: "실트"
        en: "Trending"
        ja: "トレンド"
    - source: 02-new-content/lesson.html
      slug: 02-new-content
      week: 2
      title:
        ko: "떡밥"
        en: "New content"
        ja: "新しい供給"
    - source: 03-comment-reactions/lesson.html
      slug: 03-comment-reactions
      week: 3
      title:
        ko: "댓글 반응"
        en: "Comment reactions"
        ja: "コメントの反応"
    - source: 04-memes-and-gifs/lesson.html
      slug: 04-memes-and-gifs
      week: 4
      title:
        ko: "짤 & 움짤"
        en: "Memes and GIFs"
        ja: "画像とGIF"
    - source: 05-mutual-follow/lesson.html
      slug: 05-mutual-follow
      week: 5
      title:
        ko: "맞팔"
        en: "Mutual follows"
        ja: "相互フォロー"
    - source: 06-online-debate/lesson.html
      slug: 06-online-debate
      week: 6
      title:
