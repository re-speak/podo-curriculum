        ja: "推し自慢"
    - source: 08-empathy-reactions/lesson.html
      slug: 08-empathy-reactions
      week: 8
      title:
        ko: "공감 리액션"
        en: "Empathy reactions"
        ja: "共感リアクション"
    - source: 09-promotional-post/lesson.html
      slug: 09-promotional-post
      week: 9
      title:
