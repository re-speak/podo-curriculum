apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/kr/ctx-drama-dating-intermediate

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/kr/tracks/3-contextual-korean/courses/ctx-drama-dating-intermediate/lessons

  lessons:
    - source: 01-first-day/lesson.html
      slug: 01-first-day
      week: 1
      title:
        ko: "1일"
        en: "Day One"
        ja: "つきあって1日目"
    - source: 02-pet-name/lesson.html
      slug: 02-pet-name
      week: 2
      title:
        ko: "뭐라고 부를까"
        en: "What Should We Call Each Other?"
        ja: "何て呼ぼう"
    - source: 03-hundred-days/lesson.html
      slug: 03-hundred-days
      week: 3
      title:
        ko: "100일"
        en: "One Hundred Days"
        ja: "100日"
    - source: 04-little-habit/lesson.html
      slug: 04-little-habit
      week: 4
      title:
        ko: "그 버릇"
        en: "That Little Habit"
        ja: "その癖"
    - source: 05-my-friends/lesson.html
      slug: 05-my-friends
      week: 5
      title:
        ko: "내 친구들"
        en: "My Friends"
        ja: "私の友だち"
    - source: 06-where-to-go/lesson.html
      slug: 06-where-to-go
      week: 6
      title:
        ko: "어디 갈까"
        en: "Where Should We Go?"
        ja: "どこへ行こう"
    - source: 07-when-sick/lesson.html
      slug: 07-when-sick
      week: 7
      title:
        ko: "아플 때"
        en: "When You Are Sick"
        ja: "具合が悪いとき"
    - source: 08-hurt-feelings/lesson.html
      slug: 08-hurt-feelings
      week: 8
      title:
        ko: "서운했어"
        en: "I Felt Hurt"
        ja: "寂しかった"
    - source: 09-live-together/lesson.html
      slug: 09-live-together
      week: 9
      title:
        ko: "같이 살까"
        en: "Shall We Live Together?"
        ja: "一緒に暮らす？"
    - source: 10-our-future/lesson.html
      slug: 10-our-future
      week: 10
      title:
        ko: "우리 앞으로"
        en: "Our Future"
        ja: "これからの私たち"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/kr/tracks/3-contextual-korean/courses/ctx-drama-dating-intermediate/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
