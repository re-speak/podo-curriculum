        en: "Something Feels Different"
        ja: "最近ちょっと変"
    - source: 02-keeps-crossing-my-mind/lesson.html
      slug: 02-keeps-crossing-my-mind
      week: 2
      title:
        ko: "자꾸 생각나"
        en: "I keep thinking about you"
        ja: "何度も思い出してしまう"
    - source: 03-push-and-pull/lesson.html
      slug: 03-push-and-pull
      week: 3
      title:
        ko: "밀당"
        en: "Playing hard to get"
        ja: "駆け引き"
    - source: 04-first-date/lesson.html
      slug: 04-first-date
      week: 4
      title:
        ko: "첫 데이트"
        en: "First Date"
        ja: "初デート"
    - source: 05-butterflies/lesson.html
      slug: 05-butterflies
      week: 5
      title:
        ko: "설렘"
