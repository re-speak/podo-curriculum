apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/kr/ctx-drama-long-distance-intermediate

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/kr/tracks/3-contextual-korean/courses/ctx-drama-long-distance-intermediate/lessons

  lessons:
    - source: 01-have-to-go/lesson.html
      slug: 01-have-to-go
      week: 1
      title:
        ko: "가야 해"
        en: "I Have to Go"
        ja: "行かなきゃ"
    - source: 02-airport/lesson.html
      slug: 02-airport
      week: 2
      title:
        ko: "공항"
        en: "At the Airport"
        ja: "空港"
    - source: 03-time-difference/lesson.html
      slug: 03-time-difference
      week: 3
      title:
        ko: "시차"
        en: "The Time Difference"
        ja: "時差"
    - source: 04-video-call/lesson.html
      slug: 04-video-call
      week: 4
      title:
        ko: "영상통화"
        en: "Video Call"
        ja: "ビデオ通話"
    - source: 05-miss-you/lesson.html
      slug: 05-miss-you
      week: 5
      title:
        ko: "보고 싶다"
        en: "I Miss You"
        ja: "会いたい"
    - source: 06-one-photo/lesson.html
      slug: 06-one-photo
      week: 6
      title:
        ko: "사진 한 장"
        en: "One Photo"
        ja: "一枚の写真"
    - source: 07-without-telling/lesson.html
      slug: 07-without-telling
      week: 7
      title:
        ko: "말 안 하고"
        en: "Without Telling You"
        ja: "言わないまま"
    - source: 08-reunion/lesson.html
      slug: 08-reunion
      week: 8
      title:
        ko: "재회"
        en: "The Reunion"
        ja: "再会"
    - source: 09-not-apart-anymore/lesson.html
      slug: 09-not-apart-anymore
      week: 9
      title:
        ko: "이제 안 떨어질래"
        en: "I Won't Be Apart Anymore"
        ja: "もう離れない"
    - source: 10-proposal/lesson.html
      slug: 10-proposal
      week: 10
      title:
        ko: "프러포즈"
        en: "The Proposal"
        ja: "プロポーズ"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/kr/tracks/3-contextual-korean/courses/ctx-drama-long-distance-intermediate/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
