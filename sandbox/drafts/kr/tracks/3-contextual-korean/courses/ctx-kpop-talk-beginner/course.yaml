    ko: 최애와 그룹을 소개하고, 왜 좋아하는지 이유를 말하고, 상대에게 곡을 영업하고, 상대의 최애를 물어보며 존댓말로 팬 대화를 이어 갈 수 있다.
    en: Introduce your bias and their group, say why, sell a song, ask who theirs is, and keep a fan conversation going politely.
    ja: 推しとグループを紹介し、好きな理由を語り、曲をすすめ、相手の推しをたずねながら、敬語でファントークを続けられる。

