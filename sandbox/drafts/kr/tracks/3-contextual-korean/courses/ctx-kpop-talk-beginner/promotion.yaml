    - source: 10-fan-experience-and-hopes/lesson.html
      slug: 10-fan-experience-and-hopes
      week: 10
      title:
        ko: "덕질 경험과 소망"
        en: "Fan experiences and hopes"
        ja: "推し活の経験と願い"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/kr/tracks/3-contextual-korean/courses/ctx-kpop-talk-beginner/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
