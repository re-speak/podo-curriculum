apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/kr/ctx-kpop-talk-beginner

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/kr/tracks/3-contextual-korean/courses/ctx-kpop-talk-beginner/lessons

  lessons:
    - source: 01-favorite-member/lesson.html
      slug: 01-favorite-member
      week: 1
      title:
        ko: "최애 소개"
        en: "Introducing your favorite member"
        ja: "推し紹介"
    - source: 02-member-count/lesson.html
      slug: 02-member-count
      week: 2
      title:
        ko: "몇 명이에요?"
        en: "How many members?"
        ja: "何人ですか？"
    - source: 03-member-roles/lesson.html
      slug: 03-member-roles
      week: 3
      title:
        ko: "포지션 소개"
        en: "Introducing member roles"
        ja: "ポジション紹介"
    - source: 04-becoming-a-fan/lesson.html
      slug: 04-becoming-a-fan
      week: 4
      title:
        ko: "입덕 계기"
        en: "How I became a fan"
        ja: "ファンになったきっかけ"
    - source: 05-why-this-member/lesson.html
      slug: 05-why-this-member
      week: 5
      title:
        ko: "왜 이 사람인가"
        en: "Why this member"
        ja: "なぜこの人？"
    - source: 06-comparing-songs/lesson.html
      slug: 06-comparing-songs
      week: 6
      title:
        ko: "비교"
        en: "Comparing songs"
        ja: "比較"
