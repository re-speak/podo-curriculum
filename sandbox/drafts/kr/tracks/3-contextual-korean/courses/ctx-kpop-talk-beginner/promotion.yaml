      slug: 07-describing-charm
      week: 7
      title:
        ko: "묘사"
        en: "Describing their charm"
        ja: "魅力を描写する"
    - source: 08-recommending-a-song/lesson.html
      slug: 08-recommending-a-song
      week: 8
      title:
        ko: "영업"
        en: "Recommending a song"
        ja: "おすすめする"
    - source: 09-asking-about-favorites/lesson.html
      slug: 09-asking-about-favorites
