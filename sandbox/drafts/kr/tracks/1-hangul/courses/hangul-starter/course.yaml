# 이 코스가 담을 과 — 덱을 쓰면 lessons/ 밑에 디렉터리가 생긴다.
# 슬러그는 스키마가 NN-english-words 를 요구하므로 덱을 쓸 때 정해진다.
#     1  ✓ 01-letter-blocks-and-first-sounds글자 블록과 첫 소리
#     2  ✓ 02-six-plain-consonants평음 여섯 개
#     3  ✓ 03-review-and-speed복습과 속도
#     4  ✓ 04-add-a-stroke-add-air획을 더하면 바람이 더해진다
#     5  ✓ 05-double-is-strong겹쳐 쓰면 세진다
#     6  ✓ 06-the-whole-consonant-chart자음표 전체
#     7  ✓ 07-y-vowels-and-e-vowelsy 모음과 e 모음
#     8  ✓ 08-combined-w-vowels합쳐진 모음 (w 모음)
#     9  ✓ 09-review-no-batchim복습 — 모든 글자, 받침만 빼고
#    10  ✓ 10-batchim-sonorants받침 ① 울리는 소리
#    11  ✓ 11-batchim-stops받침 ② 막는 소리
#    12  ✓ 12-double-batchim겹받침 입문 — 글자 둘, 자리 하나
#    13  ✓ 13-reading-like-a-native한국 사람처럼 읽기
#    14  ✓ 14-capstone-read-anything마무리 — 낯선 단어도 읽는다
