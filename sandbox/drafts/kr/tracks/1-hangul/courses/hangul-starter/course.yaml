  difficulty: BEGINNER

  title:
    ko: 한글 떼기 · 왕초급
    en: Hangul reading · Starter
    ja: ハングル入門 · 超入門

  # 학습자가 카탈로그에서 읽는 문장이다. 앱이 로케일로 고르므로 JP 마켓 코스는
