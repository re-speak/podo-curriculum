        ko: "친구 백 명, 가까운 친구 세 명?"
        en: "A hundred friends or three close ones?"
        ja: "友人百人、それとも親しい友人三人？"
    - source: 109-endless-summer-or-endless-winter/lesson.html
      slug: 109-endless-summer-or-endless-winter
      week: 3
      title:
        ko: "끝없는 여름, 끝없는 겨울?"
        en: "Endless summer or endless winter?"
        ja: "終わらない夏、それとも冬？"
    - source: 110-morning-person-or-night-owl/lesson.html
      slug: 110-morning-person-or-night-owl
      week: 4
      title:
