        ja: "ネットなしの夏、それともエアコンなし？"
    - source: 115-better-work-life-balance-or-a-higher-salary/lesson.html
      slug: 115-better-work-life-balance-or-a-higher-salary
      week: 9
      title:
        ko: "더 나은 워라밸, 더 높은 급여?"
