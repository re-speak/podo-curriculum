      week: 1
      title:
        ko: "직접 하기, 돈 내고 맡기기?"
        en: "Do it yourself or pay someone?"
        ja: "自分でやる？お金を払って頼む？"
    - source: 108-a-hundred-friends-or-three-close-ones/lesson.html
      slug: 108-a-hundred-friends-or-three-close-ones
