      week: 6
      title:
        ko: "혼자 여행, 함께 여행?"
        en: "Travelling alone or with other people?"
        ja: "一人旅、それとも誰かと一緒？"
    - source: 113-life-in-the-city-or-the-countryside/lesson.html
      slug: 113-life-in-the-city-or-the-countryside
      week: 7
      title:
        ko: "도시 생활, 시골 생활?"
        en: "Life in the city or the countryside?"
        ja: "都会暮らし、それとも田舎暮らし？"
    - source: 114-a-summer-without-internet-or-air-conditioning/lesson.html
      slug: 114-a-summer-without-internet-or-air-conditioning
      week: 8
      title:
        ko: "인터넷 없는 여름, 에어컨 없는 여름?"
