        ja: "よりよい生活との両立、それとも高い給料？"
    - source: 116-working-from-home-or-going-into-the-office/lesson.html
      slug: 116-working-from-home-or-going-into-the-office
      week: 10
      title:
        ko: "재택근무, 사무실 출근?"
        en: "Working from home or going into the office?"
        ja: "在宅勤務、それとも出社？"
    - source: 117-studying-in-a-cafe-or-at-home/lesson.html
      slug: 117-studying-in-a-cafe-or-at-home
      week: 11
      title:
        ko: "독학하기, 수업 듣기?"
        en: "Learn on your own or take a class?"
        ja: "独学する？教室で学ぶ？"
    - source: 118-shopping-online-or-in-a-shop/lesson.html
      slug: 118-shopping-online-or-in-a-shop
      week: 12
      title:
        ko: "온라인 쇼핑, 매장 쇼핑?"
        en: "Shopping online or in a shop?"
        ja: "オンライン、それとも店で買い物？"
    - source: 119-remembering-everything-or-forgetting-bad-memories/lesson.html
      slug: 119-remembering-everything-or-forgetting-bad-memories
      week: 13
      title:
        ko: "모두 기억하기, 나쁜 기억 잊기?"
        en: "Remembering everything or forgetting bad memories?"
        ja: "すべて覚える、それとも嫌な記憶を忘れる？"
    - source: 120-being-rich-and-anonymous-or-respected-on-an-ordinary-income/lesson.html
      slug: 120-being-rich-and-anonymous-or-respected-on-an-ordinary-income
      week: 14
      title:
        ko: "한 사람의 칭찬, 많은 사람의 인정?"
        en: "Praise from one person or recognition from many?"
        ja: "一人からの言葉？多くの人からの評価？"
    - source: 121-being-great-at-one-thing-or-good-at-many/lesson.html
      slug: 121-being-great-at-one-thing-or-good-at-many
      week: 15
      title:
        ko: "한 가지에 뛰어나기, 여러 가지를 잘하기?"
        en: "Being great at one thing or good at many?"
        ja: "一つに秀でる、それとも多くをこなす？"

