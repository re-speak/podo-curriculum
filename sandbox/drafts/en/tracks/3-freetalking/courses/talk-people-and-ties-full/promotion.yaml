        ko: "MBTI, 잘 맞아요?"
        en: "How accurate is your MBTI?"
        ja: "MBTI、当たってる？"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/3-freetalking/courses/talk-people-and-ties-full/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
