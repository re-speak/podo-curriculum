apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/en/core-experience-and-ideas

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/en/tracks/1-core-patterns/courses/core-experience-and-ideas/lessons

  lessons:
    - source: 48-have-you-ever-been-to-kyoto/lesson.html
      slug: 48-have-you-ever-been-to-kyoto
      week: 1
      title:
        ko: "교토에 가 본 적 있어요?"
        en: "Have you ever been to Kyoto?"
        ja: "京都に行ったことはありますか？"
    - source: 49-ive-already-finished/lesson.html
      slug: 49-ive-already-finished
      week: 2
      title:
        ko: "벌써 끝냈어요"
        en: "I've already finished"
        ja: "もう終わりました"
    - source: 50-i-went-there-last-year/lesson.html
      slug: 50-i-went-there-last-year
      week: 3
      title:
        ko: "작년에 거기에 갔어요"
        en: "I went there last year"
        ja: "去年そこへ行きました"
    - source: 51-how-long-have-you-been-here/lesson.html
      slug: 51-how-long-have-you-been-here
      week: 4
      title:
        ko: "여기에 얼마나 있었어요?"
        en: "How long have you been here?"
        ja: "ここにどのくらいいますか？"
    - source: 52-ive-been-working-all-morning/lesson.html
      slug: 52-ive-been-working-all-morning
      week: 5
      title:
        ko: "아침 내내 일하고 있어요"
        en: "I've been working all morning"
        ja: "午前中ずっと働いています"
    - source: 53-weve-done-three-of-the-five/lesson.html
      slug: 53-weve-done-three-of-the-five
      week: 6
      title:
        ko: "다섯 개 중 세 개를 끝냈어요"
        en: "We've done three of the five"
        ja: "5つのうち3つ終わりました"
    - source: 54-i-stayed-home-because-i-was-sick/lesson.html
      slug: 54-i-stayed-home-because-i-was-sick
      week: 7
      title:
        ko: "아파서 집에 있었어요"
        en: "I stayed home because I was sick"
        ja: "病気だったので家にいました"
    - source: 55-shes-the-one-who-called/lesson.html
      slug: 55-shes-the-one-who-called
      week: 8
      title:
        ko: "전화한 사람이 그분이에요"
        en: "She's the one who called"
        ja: "彼女が電話をくれた人です"
    - source: 56-i-like-it-but-its-expensive/lesson.html
      slug: 56-i-like-it-but-its-expensive
      week: 9
      title:
        ko: "좋긴 한데 비싸요"
        en: "I like it, but it's expensive"
        ja: "気に入っていますが、高いです"
    - source: 57-if-it-rains-ill-stay-in/lesson.html
      slug: 57-if-it-rains-ill-stay-in
      week: 10
      title:
        ko: "비가 오면 집에 있을게요"
        en: "If it rains, I'll stay in"
        ja: "雨が降ったら、家にいます"
    - source: 58-ill-call-you-when-i-get-there/lesson.html
      slug: 58-ill-call-you-when-i-get-there
      week: 11
      title:
        ko: "도착하면 전화할게요"
        en: "I'll call you when I get there"
        ja: "着いたら電話します"
    - source: 59-i-went-there-to-see-a-client/lesson.html
      slug: 59-i-went-there-to-see-a-client
      week: 12
      title:
        ko: "고객을 만나러 거기에 갔어요"
        en: "I went there to see a client"
        ja: "顧客に会うためにそこへ行きました"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/1-core-patterns/courses/core-experience-and-ideas/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
