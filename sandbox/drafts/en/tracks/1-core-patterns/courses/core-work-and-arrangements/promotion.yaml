apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/en/core-work-and-arrangements

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/en/tracks/1-core-patterns/courses/core-work-and-arrangements/lessons

  lessons:
    - source: 71-i-should-have-called-earlier/lesson.html
      slug: 71-i-should-have-called-earlier
      week: 1
      title:
        ko: "더 일찍 전화했어야 했어요"
        en: "I should have called earlier"
        ja: "もっと早く電話すればよかった"
    - source: 72-i-might-have-left-it-at-home/lesson.html
      slug: 72-i-might-have-left-it-at-home
      week: 2
      title:
        ko: "집에 두고 왔을지도 몰라요"
        en: "I might have left it at home"
        ja: "家に置いてきたのかもしれません"
    - source: 73-the-train-had-already-left/lesson.html
      slug: 73-the-train-had-already-left
      week: 3
      title:
        ko: "기차는 이미 떠난 뒤였어요"
        en: "The train had already left"
        ja: "電車はもう出たあとでした"
    - source: 74-i-was-going-to-call-but/lesson.html
      slug: 74-i-was-going-to-call-but
      week: 4
      title:
        ko: "전화하려고 했는데"
        en: "I was going to call, but"
        ja: "電話するつもりでしたが"
    - source: 75-i-used-to-walk-to-school/lesson.html
      slug: 75-i-used-to-walk-to-school
      week: 5
      title:
        ko: "예전에는 걸어서 학교에 다녔어요"
        en: "I used to walk to school"
        ja: "以前は歩いて学校に通っていました"
    - source: 76-i-had-my-phone-repaired/lesson.html
      slug: 76-i-had-my-phone-repaired
      week: 6
      title:
        ko: "휴대폰을 수리 맡겼어요"
        en: "I had my phone repaired"
        ja: "携帯を修理してもらいました"
    - source: 77-it-was-supposed-to-be-ready/lesson.html
      slug: 77-it-was-supposed-to-be-ready
      week: 7
      title:
        ko: "준비되어 있어야 했어요"
        en: "It was supposed to be ready"
        ja: "出来上がっているはずでした"
    - source: 78-this-time-tomorrow-ill-be-flying/lesson.html
      slug: 78-this-time-tomorrow-ill-be-flying
      week: 8
      title:
        ko: "내일 이 시간에는 비행 중일 거예요"
        en: "This time tomorrow I'll be flying"
        ja: "明日の今ごろは飛行機で移動中です"
    - source: 79-i-should-have-it-ready-by-friday/lesson.html
      slug: 79-i-should-have-it-ready-by-friday
      week: 9
      title:
        ko: "금요일까지 준비할 수 있을 것 같아요"
        en: "I should have it ready by Friday"
        ja: "金曜日までには用意できる見込みです"
    - source: 80-let-me-know-once-its-ready/lesson.html
      slug: 80-let-me-know-once-its-ready
      week: 10
      title:
        ko: "준비되면 알려 주세요"
        en: "Let me know once it's ready"
        ja: "準備できたら知らせてください"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/1-core-patterns/courses/core-work-and-arrangements/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
