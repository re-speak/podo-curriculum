    en: English Core · Getting things done · B1+
    ja: 英語コアパターン · 段取りをつける · B1+

  description:
    ko: 지난 일을 돌아보고, 누가 언제까지 무엇을 할지 정한다.
    en: Look back on what was done, and arrange who does what by when.
    ja: 済んだことを振り返り、誰がいつまでに何をするかを決める。

  tutorGroups:
    allowRandom: []
    assignedOnly: []

