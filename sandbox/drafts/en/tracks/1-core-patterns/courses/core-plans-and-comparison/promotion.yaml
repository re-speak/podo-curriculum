apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/en/core-plans-and-comparison

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/en/tracks/1-core-patterns/courses/core-plans-and-comparison/lessons

  lessons:
    - source: 45-this-ones-cheaper/lesson.html
      slug: 45-this-ones-cheaper
      week: 1
      title:
        ko: "이게 더 싸요"
        en: "This one's cheaper"
        ja: "こっちのほうが安いです"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/1-core-patterns/courses/core-plans-and-comparison/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
