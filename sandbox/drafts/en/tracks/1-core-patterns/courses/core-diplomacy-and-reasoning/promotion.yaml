apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/en/core-diplomacy-and-reasoning

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/en/tracks/1-core-patterns/courses/core-diplomacy-and-reasoning/lessons

  lessons:
    - source: 92-im-not-entirely-convinced/lesson.html
      slug: 92-im-not-entirely-convinced
      week: 1
      title:
        ko: "완전히 납득되지는 않아요"
        en: "I'm not entirely convinced"
        ja: "完全には納得していません"
    - source: 93-to-be-fair/lesson.html
      slug: 93-to-be-fair
      week: 2
      title:
        ko: "공정하게 말하면"
        en: "To be fair,"
        ja: "公平に言えば"
    - source: 94-wouldnt-it-be-better-if/lesson.html
      slug: 94-wouldnt-it-be-better-if
      week: 3
      title:
        ko: "차라리 ~하는 게 낫지 않을까요"
        en: "Wouldn't it be better if"
        ja: "むしろ〜したほうがよくないですか"
    - source: 95-where-id-push-back-is-on-the-cost/lesson.html
      slug: 95-where-id-push-back-is-on-the-cost
      week: 4
      title:
        ko: "제가 이의를 제기하고 싶은 건 비용이에요"
        en: "Where I'd push back is on the cost"
        ja: "私が異議を唱えたいのは費用です"
    - source: 96-i-meant-next-friday-not-this-friday/lesson.html
      slug: 96-i-meant-next-friday-not-this-friday
      week: 5
      title:
        ko: "이번 주 금요일이 아니라 다음 주 금요일을 말한 거예요"
        en: "I meant next Friday, not this Friday"
        ja: "今週の金曜日ではなく、来週の金曜日という意味でした"
    - source: 97-id-rather-not-if-thats-ok/lesson.html
      slug: 97-id-rather-not-if-thats-ok
      week: 6
      title:
        ko: "괜찮다면 안 하고 싶어요"
        en: "I'd rather not, if that's OK"
        ja: "よければ、遠慮したいです"
    - source: 98-thats-mostly-because-of/lesson.html
      slug: 98-thats-mostly-because-of
      week: 7
      title:
        ko: "그건 주로 ~ 때문이에요"
        en: "That's mostly because of"
        ja: "それは主に〜が原因です"
    - source: 99-that-suggests-that/lesson.html
      slug: 99-that-suggests-that
      week: 8
      title:
        ko: "그건 ~라는 뜻일 수 있어요"
        en: "That suggests that"
        ja: "それは〜を示していると考えられます"
    - source: 100-as-a-result-we-had-to-reschedule/lesson.html
      slug: 100-as-a-result-we-had-to-reschedule
      week: 9
      title:
        ko: "그 결과 일정을 다시 잡아야 했어요"
        en: "As a result, we had to reschedule"
        ja: "その結果、日程を変更しなければなりませんでした"
    - source: 101-it-depends-on-whether/lesson.html
      slug: 101-it-depends-on-whether
      week: 10
      title:
        ko: "~인지에 따라 달라요"
        en: "It depends on whether"
        ja: "〜かどうかによります"
    - source: 102-otherwise-wed-have-to-start-again/lesson.html
      slug: 102-otherwise-wed-have-to-start-again
      week: 11
      title:
        ko: "그렇지 않으면 다시 시작해야 해요"
        en: "Otherwise, we'd have to start again"
        ja: "そうでなければ、また最初から始めなければなりません"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/1-core-patterns/courses/core-diplomacy-and-reasoning/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
