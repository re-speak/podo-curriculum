apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/en/core-first-exchanges-1

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/en/tracks/1-core-patterns/courses/core-first-exchanges-1/lessons

  lessons:
    - source: 01-introduce-yourself/lesson.html
      slug: 01-introduce-yourself
      week: 1
      title:
        ko: "저는 미나예요"
        en: "I'm Mina"
        ja: "私はミナです"
    - source: 02-say-where-people-are-from-and-live/lesson.html
      slug: 02-say-where-people-are-from-and-live
      week: 2
      title:
        ko: "저는 오사카 출신이에요"
        en: "I'm from Osaka"
        ja: "大阪出身です"
    - source: 03-check-things-and-people/lesson.html
      slug: 03-check-things-and-people
      week: 3
      title:
        ko: "이거 당신 거예요?"
        en: "Is this yours?"
        ja: "これはあなたのものですか？"
    - source: 07-theres-a-cafe-near-here/lesson.html
      slug: 07-theres-a-cafe-near-here
      week: 4
      title:
        ko: "근처에 카페가 있어요"
        en: "There's a café near here"
        ja: "この近くにカフェがあります"
    - source: 08-its-cold-today/lesson.html
      slug: 08-its-cold-today
      week: 5
      title:
        ko: "오늘은 추워요"
        en: "It's cold today"
        ja: "今日は寒いです"
    - source: 09-two-coffees-please/lesson.html
      slug: 09-two-coffees-please
      week: 6
      title:
        ko: "커피 두 잔 주세요"
        en: "Two coffees, please"
        ja: "コーヒーを二つお願いします"
    - source: 10-the-cafe-on-the-corner/lesson.html
      slug: 10-the-cafe-on-the-corner
      week: 7
      title:
        ko: "모퉁이에 있는 그 카페"
        en: "The café on the corner"
        ja: "角にあるそのカフェ"
    - source: 11-wheres-the-station/lesson.html
      slug: 11-wheres-the-station
      week: 8
      title:
        ko: "역이 어디예요?"
        en: "Where's the station?"
        ja: "駅はどこですか？"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/1-core-patterns/courses/core-first-exchanges-1/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
