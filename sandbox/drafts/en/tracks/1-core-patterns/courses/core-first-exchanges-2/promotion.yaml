apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/en/core-first-exchanges-2

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/en/tracks/1-core-patterns/courses/core-first-exchanges-2/lessons

  lessons:
    - source: 12-i-start-work-at-nine/lesson.html
      slug: 12-i-start-work-at-nine
      week: 1
      title:
        ko: "아홉 시에 일을 시작해요"
        en: "I start work at nine"
        ja: "9時に仕事を始めます"
    - source: 13-do-you-drink-coffee/lesson.html
      slug: 13-do-you-drink-coffee
      week: 2
      title:
        ko: "커피를 마셔요?"
        en: "Do you drink coffee?"
        ja: "コーヒーを飲みますか？"
    - source: 14-i-dont-drive-to-work/lesson.html
      slug: 14-i-dont-drive-to-work
      week: 3
      title:
        ko: "차로 출근하지 않아요"
        en: "I don't drive to work"
        ja: "車で通勤しません"
    - source: 15-she-works-downtown/lesson.html
      slug: 15-she-works-downtown
      week: 4
      title:
        ko: "그녀는 시내에서 일해요"
        en: "She works downtown"
        ja: "彼女は中心街で働いています"
    - source: 16-what-time-do-you-get-up/lesson.html
      slug: 16-what-time-do-you-get-up
      week: 5
      title:
        ko: "몇 시에 일어나요?"
        en: "What time do you get up?"
        ja: "何時に起きますか？"
    - source: 17-how-often-do-you-exercise/lesson.html
      slug: 17-how-often-do-you-exercise
      week: 6
      title:
        ko: "얼마나 자주 운동해요?"
        en: "How often do you exercise?"
        ja: "どのくらい運動しますか？"
    - source: 18-can-you-drive/lesson.html
      slug: 18-can-you-drive
      week: 7
      title:
        ko: "운전할 수 있어요?"
        en: "Can you drive?"
        ja: "運転できますか？"
    - source: 19-how-much-is-this/lesson.html
      slug: 19-how-much-is-this
      week: 8
      title:
        ko: "이거 얼마예요?"
        en: "How much is this?"
        ja: "これはいくらですか？"
    - source: 20-asking-for-help/lesson.html
      slug: 20-asking-for-help
      week: 9
      title:
        ko: "이것 좀 도와주시겠어요?"
        en: "Could you help me with this?"
        ja: "これ、手伝ってもらえますか？"
    - source: 21-can-i-try-this-on/lesson.html
      slug: 21-can-i-try-this-on
      week: 10
      title:
        ko: "이거 입어 봐도 돼요?"
        en: "Can I try this on?"
        ja: "これを試着してもいいですか？"
    - source: 22-id-like-the-chicken-please/lesson.html
      slug: 22-id-like-the-chicken-please
      week: 11
      title:
        ko: "치킨으로 주세요"
        en: "I'd like the chicken, please"
        ja: "チキンをお願いします"
    - source: 23-two-cups-of-coffee/lesson.html
      slug: 23-two-cups-of-coffee
      week: 12
      title:
        ko: "커피 두 잔"
        en: "Two cups of coffee"
        ja: "コーヒーを2杯"
    - source: 24-sorry-can-you-say-that-again/lesson.html
      slug: 24-sorry-can-you-say-that-again
      week: 13
      title:
        ko: "죄송하지만 다시 말해 주시겠어요?"
        en: "Sorry, can you say that again?"
        ja: "すみません、もう一度言ってもらえますか？"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/1-core-patterns/courses/core-first-exchanges-2/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
