apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/en/core-nuance-at-work

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/en/tracks/1-core-patterns/courses/core-nuance-at-work/lessons

  lessons:
    - source: 82-were-on-track-but/lesson.html
      slug: 82-were-on-track-but
      week: 1
      title:
        ko: "일정대로예요, 그런데"
        en: "We're on track, but"
        ja: "順調ですが、ただ"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/1-core-patterns/courses/core-nuance-at-work/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
