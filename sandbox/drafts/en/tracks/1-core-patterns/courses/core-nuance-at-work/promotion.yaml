        ja: "おっしゃることは分かりますが"
    - source: 86-let-me-get-back-to-you/lesson.html
      slug: 86-let-me-get-back-to-you
      week: 6
      title:
        ko: "확인하고 다시 말씀드릴게요"
        en: "Let me get back to you"
        ja: "確認して、改めてお返事します"
    - source: 87-its-slightly-more-expensive/lesson.html
      slug: 87-its-slightly-more-expensive
      week: 7
      title:
        ko: "조금 더 비싸요"
        en: "It's slightly more expensive"
        ja: "少しだけ高いです"
    - source: 88-hardly-anyone-came/lesson.html
      slug: 88-hardly-anyone-came
      week: 8
      title:
        ko: "거의 아무도 오지 않았어요"
        en: "Hardly anyone came"
        ja: "ほとんど誰も来ませんでした"
    - source: 89-its-not-so-much-a-problem-as-a-delay/lesson.html
      slug: 89-its-not-so-much-a-problem-as-a-delay
      week: 9
      title:
        ko: "문제라기보다 지연이에요"
        en: "It's not so much a problem as a delay"
        ja: "問題というより遅れです"
    - source: 90-the-vast-majority-of-people/lesson.html
      slug: 90-the-vast-majority-of-people
      week: 10
      title:
        ko: "대다수의 사람들"
        en: "The vast majority of people"
        ja: "大多数の人々"
    - source: 91-theres-barely-enough-to-go-around/lesson.html
      slug: 91-theres-barely-enough-to-go-around
      week: 11
      title:
        ko: "겨우 모두에게 돌아갈 만큼 있어요"
        en: "There's barely enough to go around"
        ja: "全員に行き渡るぎりぎりの量です"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/1-core-patterns/courses/core-nuance-at-work/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
