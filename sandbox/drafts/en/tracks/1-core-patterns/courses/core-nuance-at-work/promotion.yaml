apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/en/core-nuance-at-work

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/en/tracks/1-core-patterns/courses/core-nuance-at-work/lessons

  lessons:
    - source: 81-im-responsible-for-customer-support/lesson.html
      slug: 81-im-responsible-for-customer-support
      week: 1
      title:
        ko: "고객 지원을 담당하고 있어요"
        en: "I'm responsible for customer support"
        ja: "カスタマーサポートを担当しています"
    - source: 82-were-on-track-but/lesson.html
      slug: 82-were-on-track-but
      week: 2
      title:
        ko: "일정대로예요, 그런데"
        en: "We're on track, but"
        ja: "順調ですが、ただ"
    - source: 83-so-what-youre-saying-is/lesson.html
      slug: 83-so-what-youre-saying-is
      week: 3
      title:
