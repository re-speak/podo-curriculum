apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/en/core-careful-interaction

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/en/tracks/1-core-patterns/courses/core-careful-interaction/lessons

  lessons:
    - source: 60-would-you-mind-opening-the-window/lesson.html
      slug: 60-would-you-mind-opening-the-window
      week: 1
      title:
        ko: "창문을 열어 주시겠어요?"
        en: "Would you mind opening the window?"
        ja: "窓を開けていただけますか？"
    - source: 61-do-you-mind-if-i-sit-here/lesson.html
      slug: 61-do-you-mind-if-i-sit-here
      week: 2
      title:
        ko: "여기 앉아도 괜찮으세요?"
        en: "Do you mind if I sit here?"
        ja: "ここに座ってもよろしいですか？"
    - source: 62-do-you-know-where-it-is/lesson.html
      slug: 62-do-you-know-where-it-is
      week: 3
      title:
        ko: "어디 있는지 아세요?"
        en: "Do you know where it is?"
        ja: "どこにあるか分かりますか？"
    - source: 63-i-generally-prefer-coffee/lesson.html
      slug: 63-i-generally-prefer-coffee
      week: 4
      title:
        ko: "저는 대체로 커피를 더 좋아해요"
        en: "I generally prefer coffee"
        ja: "私はたいていコーヒーのほうが好きです"
    - source: 64-it-wont-turn-on/lesson.html
      slug: 64-it-wont-turn-on
      week: 5
      title:
        ko: "전원이 안 켜져요"
        en: "It won't turn on"
        ja: "電源が入りません"
    - source: 65-my-wallet-was-stolen/lesson.html
      slug: 65-my-wallet-was-stolen
      week: 6
      title:
        ko: "지갑을 도난당했어요"
        en: "My wallet was stolen"
        ja: "財布を盗まれました"
    - source: 66-if-i-had-more-time-id-travel/lesson.html
      slug: 66-if-i-had-more-time-id-travel
      week: 7
      title:
        ko: "시간이 더 있다면 여행할 텐데요"
        en: "If I had more time, I'd travel"
        ja: "もっと時間があれば、旅行するのですが"
    - source: 67-i-wish-i-could-drive/lesson.html
      slug: 67-i-wish-i-could-drive
      week: 8
      title:
        ko: "운전할 수 있으면 좋겠어요"
        en: "I wish I could drive"
        ja: "運転できたらいいのにと思います"
    - source: 68-he-must-be-busy/lesson.html
      slug: 68-he-must-be-busy
      week: 9
      title:
        ko: "그는 분명 바쁜가 봐요"
        en: "He must be busy"
        ja: "彼はきっと忙しいのでしょう"
    - source: 69-she-said-she-was-busy/lesson.html
      slug: 69-she-said-she-was-busy
      week: 10
      title:
        ko: "그녀는 바쁘다고 말했어요"
        en: "She said she was busy"
        ja: "彼女は忙しいと言っていました"
    - source: 70-she-told-me-to-wait/lesson.html
      slug: 70-she-told-me-to-wait
      week: 11
      title:
        ko: "그녀가 기다리라고 했어요"
        en: "She told me to wait"
        ja: "彼女に待つよう言われました"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/1-core-patterns/courses/core-careful-interaction/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
