    ja: 英語コアパターン · 論証と含み · C1

  description:
    ko: 추상적으로 논증하고, 말한 것이 아니라 뜻한 것을 알아듣는다.
    en: Argue in the abstract, and hear what is meant rather than what is said.
    ja: 抽象的に論じ、言われたことではなく含意を聞き取る。

  tutorGroups:
    allowRandom: []
