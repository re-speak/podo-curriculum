apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/en/core-advanced-stance

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/en/tracks/1-core-patterns/courses/core-advanced-stance/lessons

  lessons:
    - source: 113-the-underlying-issue-is/lesson.html
      slug: 113-the-underlying-issue-is
      week: 1
      title:
        ko: "근본적인 문제는"
        en: "The underlying issue is"
        ja: "根本的な問題は"
    - source: 114-that-may-be-true-for-some-people/lesson.html
      slug: 114-that-may-be-true-for-some-people
      week: 2
      title:
        ko: "어떤 사람들에게는 그럴 수 있어요"
        en: "That may be true for some people"
        ja: "一部の人には当てはまるかもしれません"
    - source: 115-thats-true-but-it-doesnt-account-for/lesson.html
      slug: 115-thats-true-but-it-doesnt-account-for
      week: 3
      title:
        ko: "맞지만, 그 점은 고려하지 않았어요"
        en: "That's true, but it doesn't account for"
        ja: "それは事実ですが、〜が考慮されていません"
    - source: 116-if-anything-its-got-worse/lesson.html
      slug: 116-if-anything-its-got-worse
      week: 4
      title:
        ko: "오히려 더 나빠졌어요"
        en: "If anything, it's got worse"
        ja: "むしろ悪化しています"
    - source: 117-overall-id-say/lesson.html
      slug: 117-overall-id-say
      week: 5
      title:
        ko: "전반적으로 보면, 제 생각에는"
        en: "Overall, I'd say"
        ja: "総合的に見ると、私としては"
    - source: 118-you-could-see-it-that-way/lesson.html
      slug: 118-you-could-see-it-that-way
      week: 6
      title:
        ko: "그렇게 볼 수도 있겠지만"
        en: "You could see it that way"
        ja: "そう見ることもできますが"
    - source: 119-lets-just-say-it-didnt-go-well/lesson.html
      slug: 119-lets-just-say-it-didnt-go-well
      week: 7
      title:
        ko: "그냥 잘 안 됐다고만 해 두죠"
        en: "Let's just say it didn't go well"
        ja: "うまくいかなかった、とだけ言っておきます"
    - source: 120-you-might-want-to-check-that/lesson.html
      slug: 120-you-might-want-to-check-that
      week: 8
      title:
        ko: "그건 확인해 보는 게 좋겠어요"
        en: "You might want to check that"
        ja: "それは確認したほうがよさそうです"
    - source: 121-id-rather-not-go-into-it/lesson.html
      slug: 121-id-rather-not-go-into-it
      week: 9
      title:
        ko: "그 얘기는 자세히 하지 않을게요"
        en: "I'd rather not go into it"
        ja: "そのことは詳しく話さないでおきます"
    - source: 122-its-not-that-simple/lesson.html
      slug: 122-its-not-that-simple
      week: 10
      title:
        ko: "그렇게 단순한 문제는 아니에요"
        en: "It's not that simple"
        ja: "それほど単純ではありません"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/1-core-patterns/courses/core-advanced-stance/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
