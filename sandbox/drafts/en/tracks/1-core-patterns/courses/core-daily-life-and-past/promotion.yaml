apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/en/core-daily-life-and-past

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/en/tracks/1-core-patterns/courses/core-daily-life-and-past/lessons

  lessons:
    - source: 25-im-working-from-home-today/lesson.html
      slug: 25-im-working-from-home-today
      week: 1
      title:
        ko: "오늘은 재택근무 중이에요"
        en: "I'm working from home today"
        ja: "今日は在宅勤務をしています"
    - source: 26-i-usually-drive-but-today-im-walking/lesson.html
      slug: 26-i-usually-drive-but-today-im-walking
      week: 2
      title:
        ko: "보통 운전하지만 오늘은 걸어요"
        en: "I usually drive, but today I'm walking"
        ja: "普段は車ですが、今日は歩いています"
    - source: 27-i-like-cooking/lesson.html
      slug: 27-i-like-cooking
      week: 3
      title:
        ko: "요리하는 걸 좋아해요"
        en: "I like cooking"
        ja: "料理が好きです"
    - source: 28-are-you-free-on-friday/lesson.html
      slug: 28-are-you-free-on-friday
      week: 4
      title:
        ko: "금요일에 시간 있어요?"
        en: "Are you free on Friday?"
        ja: "金曜日は空いていますか？"
    - source: 29-im-meeting-sam-at-six/lesson.html
      slug: 29-im-meeting-sam-at-six
      week: 5
      title:
        ko: "6시에 샘을 만나요"
        en: "I'm meeting Sam at six"
        ja: "6時にサムと会います"
    - source: 30-i-was-really-tired-yesterday/lesson.html
      slug: 30-i-was-really-tired-yesterday
      week: 6
      title:
        ko: "어제 정말 피곤했어요"
        en: "I was really tired yesterday"
        ja: "昨日は本当に疲れていました"
    - source: 31-i-went-out-last-night/lesson.html
      slug: 31-i-went-out-last-night
      week: 7
      title:
        ko: "어젯밤에 나갔어요"
        en: "I went out last night"
        ja: "昨夜は出かけました"
    - source: 32-we-went-out-for-dinner/lesson.html
      slug: 32-we-went-out-for-dinner
      week: 8
      title:
        ko: "저녁 먹으러 나갔어요"
        en: "We went out for dinner"
        ja: "夕食に出かけました"
    - source: 33-did-you-have-a-good-time/lesson.html
      slug: 33-did-you-have-a-good-time
      week: 9
      title:
        ko: "즐거운 시간 보냈어요?"
        en: "Did you have a good time?"
        ja: "楽しかったですか？"
    - source: 34-i-didnt-sleep-well/lesson.html
      slug: 34-i-didnt-sleep-well
      week: 10
      title:
        ko: "잠을 잘 못 잤어요"
        en: "I didn't sleep well"
        ja: "よく眠れませんでした"
    - source: 35-first-we-ate-then-we-walked-around/lesson.html
      slug: 35-first-we-ate-then-we-walked-around
      week: 11
      title:
        ko: "먼저 먹고, 그다음 걸어 다녔어요"
        en: "First we ate, then we walked around"
        ja: "まず食べて、それから歩き回りました"
    - source: 36-i-was-cooking-when-you-called/lesson.html
      slug: 36-i-was-cooking-when-you-called
      week: 12
      title:
        ko: "전화했을 때 요리 중이었어요"
        en: "I was cooking when you called"
        ja: "電話をくれたとき、料理中でした"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/1-core-patterns/courses/core-daily-life-and-past/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
