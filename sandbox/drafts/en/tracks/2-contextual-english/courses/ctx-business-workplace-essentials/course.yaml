apiVersion: podo.curriculum/v1
kind: Course
metadata:
  # Generated from the approved 2-contextual-english course cut.
  # LANG_TYPE is not stored here: podo-curriculum derives EN from courses/en/.
  slug: ctx-business-workplace-essentials

spec:
  curriculumType: BASIC
  countryCode: JP
  # classLevel and countryCode are natural-key fields. Changing either creates
  # a different course identity rather than updating the deployed row.
  classLevel: "200.060"
  lessonTime: 25
  # English remains pre-production; generation must never enable a course.
  enabled: false
  difficulty: INTERMEDIATE

  # Three name columns, three descriptions: the app picks by locale, so `ja` is
  # what this Japanese-market track puts on screen and `ko` is grape's admin
  # label. Both come from tools/course-copy.json, never from the TOC — a
  # generated title was English in all three slots and 72 characters long.
  title:
    ko: 비즈니스 영어 · 사무실 기본 · A2–B1
    en: Business English · At the office · A2–B1
    ja: ビジネス英語 · 職場の基本 · A2–B1

  description:
    ko: 맡은 역할을 소개하고, 통화 문제를 해결하고, 시차를 넘어 일정을 잡고, 전달되는 진행 보고를 한다.
    en: Introduce your role, repair a bad call, schedule across time zones, and give a progress update that lands.
    ja: 自分の役割を伝え、通話の不具合を直し、時差をまたいで日程を決め、伝わる進捗報告をする。

  tutorGroups:
    allowRandom: []
    assignedOnly: []

# Planned lessons only. Prestudy is deferred, so this generator intentionally
# does not create lesson.yaml or represent any English lesson as deployable.
#    31  ·  CTX-31 · Introduce your role on a new project
#    32  ·  CTX-32 · Repair a bad connection during a call
#    33  ·  CTX-33 · Schedule across time zones
#    34  ·  CTX-34 · Request the correct file and explain why
#    35  ·  CTX-35 · Give a concise progress update
#    36  ·  CTX-36 · Report a technical blocker usefully
