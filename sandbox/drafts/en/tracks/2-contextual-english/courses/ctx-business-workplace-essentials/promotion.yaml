apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/en/ctx-business-workplace-essentials

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/en/tracks/2-contextual-english/courses/ctx-business-workplace-essentials/lessons

  lessons:
    - source: 31-introduce-your-role-on-a-new-project/lesson.html
      slug: 31-introduce-your-role-on-a-new-project
      week: 1
      title:
        ko: "새 프로젝트에서 역할 소개하기"
        en: "Introduce your role on a new project"
        ja: "新しいプロジェクトで役割を紹介する"
    - source: 32-repair-a-bad-connection-during-a-call/lesson.html
      slug: 32-repair-a-bad-connection-during-a-call
      week: 2
      title:
        ko: "통화 연결 문제 해결하기"
        en: "Repair a bad connection during a call"
        ja: "通話の接続不良を立て直す"
    - source: 33-schedule-across-time-zones/lesson.html
      slug: 33-schedule-across-time-zones
      week: 3
      title:
        ko: "시차를 고려해 일정 잡기"
        en: "Schedule across time zones"
        ja: "時差をまたいで日程を決める"
    - source: 34-request-the-correct-file-and-explain-why/lesson.html
      slug: 34-request-the-correct-file-and-explain-why
      week: 4
      title:
        ko: "올바른 파일을 요청하고 이유 설명하기"
        en: "Request the correct file and explain why"
        ja: "正しいファイルを依頼して理由を伝える"
    - source: 35-give-a-concise-progress-update/lesson.html
      slug: 35-give-a-concise-progress-update
      week: 5
      title:
        ko: "간결하게 진행 상황 보고하기"
        en: "Give a concise progress update"
        ja: "簡潔に進捗を報告する"
    - source: 36-report-a-technical-blocker-usefully/lesson.html
      slug: 36-report-a-technical-blocker-usefully
      week: 6
      title:
        ko: "기술적 장애 요인을 유용하게 보고하기"
        en: "Report a technical blocker usefully"
        ja: "技術的なブロッカーを具体的に報告する"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/2-contextual-english/courses/ctx-business-workplace-essentials/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
