apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/en/ctx-travel-independent-social

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/en/tracks/2-contextual-english/courses/ctx-travel-independent-social/lessons

  lessons:
    - source: 19-get-a-recommendation-that-fits-your-priorities/lesson.html
      slug: 19-get-a-recommendation-that-fits-your-priorities
      week: 1
      title:
        ko: "우선순위에 맞는 추천 받기"
        en: "Get a recommendation that fits your priorities"
        ja: "希望に合うおすすめを聞く"
    - source: 20-join-a-group-activity-confidently/lesson.html
      slug: 20-join-a-group-activity-confidently
      week: 2
      title:
        ko: "그룹 활동에 자연스럽게 참여하기"
        en: "Join a group activity confidently"
        ja: "グループ活動に自然に加わる"
    - source: 21-make-a-plan-with-people-you-just-met/lesson.html
      slug: 21-make-a-plan-with-people-you-just-met
      week: 3
      title:
        ko: "처음 만난 사람들과 약속 잡기"
        en: "Make a plan with people you just met"
        ja: "初対面の人たちと予定を立てる"
    - source: 22-resolve-an-itinerary-disagreement/lesson.html
      slug: 22-resolve-an-itinerary-disagreement
      week: 4
      title:
        ko: "여행 일정 의견 차이 조율하기"
        en: "Resolve an itinerary disagreement"
        ja: "旅程の意見の違いをまとめる"
    - source: 23-clear-up-a-cultural-misunderstanding/lesson.html
      slug: 23-clear-up-a-cultural-misunderstanding
      week: 5
      title:
        ko: "문화적 오해 풀기"
        en: "Clear up a cultural misunderstanding"
        ja: "文化的な誤解を解く"
    - source: 24-complain-firmly-without-becoming-hostile/lesson.html
      slug: 24-complain-firmly-without-becoming-hostile
      week: 6
      title:
        ko: "적대적이지 않게 단호히 항의하기"
        en: "Complain firmly without becoming hostile"
        ja: "攻撃的にならずにしっかり苦情を伝える"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/2-contextual-english/courses/ctx-travel-independent-social/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
