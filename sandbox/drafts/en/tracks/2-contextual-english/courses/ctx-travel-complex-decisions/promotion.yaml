apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/en/ctx-travel-complex-decisions

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/en/tracks/2-contextual-english/courses/ctx-travel-complex-decisions/lessons

  lessons:
    - source: 25-escalate-a-cancellation-with-clear-priorities/lesson.html
      slug: 25-escalate-a-cancellation-with-clear-priorities
      week: 1
      title:
        ko: "취소 상황에서 우선순위를 분명히 말하기"
        en: "Escalate a cancellation with clear priorities"
        ja: "欠航時に優先事項を明確に伝える"
    - source: 26-document-an-incident-for-insurance/lesson.html
      slug: 26-document-an-incident-for-insurance
      week: 2
      title:
        ko: "보험을 위해 사건을 기록하기"
        en: "Document an incident for insurance"
        ja: "保険申請のために事故を記録する"
    - source: 27-advocate-for-an-accessibility-requirement/lesson.html
      slug: 27-advocate-for-an-accessibility-requirement
      week: 3
      title:
        ko: "접근성 요구 사항을 분명히 요청하기"
        en: "Advocate for an accessibility requirement"
        ja: "アクセシビリティ要件を明確に求める"
    - source: 28-resolve-conflicting-booking-information/lesson.html
      slug: 28-resolve-conflicting-booking-information
      week: 4
      title:
        ko: "상충하는 예약 정보를 해결하기"
        en: "Resolve conflicting booking information"
        ja: "食い違う予約情報を解決する"
    - source: 29-make-a-safety-decision-with-incomplete-information/lesson.html
      slug: 29-make-a-safety-decision-with-incomplete-information
      week: 5
      title:
        ko: "불완전한 정보로 안전 결정을 내리기"
        en: "Make a safety decision with incomplete information"
        ja: "不完全な情報で安全な判断をする"
    - source: 30-give-useful-advice-after-a-complicated-trip/lesson.html
      slug: 30-give-useful-advice-after-a-complicated-trip
      week: 6
      title:
        ko: "복잡한 여행 후 유용한 조언하기"
        en: "Give useful advice after a complicated trip"
        ja: "複雑な旅行のあとで役立つ助言をする"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/2-contextual-english/courses/ctx-travel-complex-decisions/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
