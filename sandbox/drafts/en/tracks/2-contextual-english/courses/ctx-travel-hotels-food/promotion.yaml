apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/en/ctx-travel-hotels-food

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/en/tracks/2-contextual-english/courses/ctx-travel-hotels-food/lessons

  lessons:
    - source: 07-check-in-when-your-room-is-not-ready/lesson.html
      slug: 07-check-in-when-your-room-is-not-ready
      week: 1
      title:
        ko: "객실 준비 전 체크인하기"
        en: "Check in when your room is not ready"
        ja: "部屋の準備前にチェックインする"
    - source: 08-get-a-hotel-problem-fixed/lesson.html
      slug: 08-get-a-hotel-problem-fixed
      week: 2
      title:
        ko: "호텔 문제 해결 요청하기"
        en: "Get a hotel problem fixed"
        ja: "ホテルの問題を直してもらう"
    - source: 09-order-with-a-dietary-restriction/lesson.html
      slug: 09-order-with-a-dietary-restriction
      week: 3
      title:
        ko: "식이 제한을 알리고 주문하기"
        en: "Order with a dietary restriction"
        ja: "食事制限を伝えて注文する"
    - source: 10-correct-an-order-politely/lesson.html
      slug: 10-correct-an-order-politely
      week: 4
      title:
        ko: "주문 오류 정중하게 바로잡기"
        en: "Correct an order politely"
        ja: "注文の間違いを丁寧に直す"
    - source: 11-return-something-that-does-not-work/lesson.html
      slug: 11-return-something-that-does-not-work
      week: 5
      title:
        ko: "고장 난 물건 반품하기"
        en: "Return something that does not work"
        ja: "動かない商品を返品する"
    - source: 12-change-a-booking-without-losing-it/lesson.html
      slug: 12-change-a-booking-without-losing-it
      week: 6
      title:
        ko: "예약을 유지하며 시간 변경하기"
        en: "Change a booking without losing it"
        ja: "予約を残したまま時間を変更する"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/2-contextual-english/courses/ctx-travel-hotels-food/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
