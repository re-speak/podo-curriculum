apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/en/ctx-business-projects-deadlines

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/en/tracks/2-contextual-english/courses/ctx-business-projects-deadlines/lessons

  lessons:
    - source: 37-confirm-priorities-when-everything-seems-urgent/lesson.html
      slug: 37-confirm-priorities-when-everything-seems-urgent
      week: 1
      title:
        ko: "모든 일이 급할 때 우선순위 확인하기"
        en: "Confirm priorities when everything seems urgent"
        ja: "すべて急ぎに見えるとき優先順位を確認する"
    - source: 38-clarify-who-owns-an-action/lesson.html
      slug: 38-clarify-who-owns-an-action
      week: 2
      title:
        ko: "업무 담당자 확인하기"
        en: "Clarify who owns an action"
        ja: "作業の担当者を確認する"
    - source: 39-raise-a-project-risk-early/lesson.html
      slug: 39-raise-a-project-risk-early
      week: 3
      title:
        ko: "프로젝트 위험을 일찍 알리기"
        en: "Raise a project risk early"
        ja: "プロジェクトのリスクを早めに伝える"
    - source: 40-negotiate-a-realistic-deadline/lesson.html
      slug: 40-negotiate-a-realistic-deadline
      week: 4
      title:
        ko: "현실적인 마감 협의하기"
        en: "Negotiate a realistic deadline"
        ja: "現実的な締め切りを交渉する"
    - source: 41-deliver-bad-news-with-a-next-step/lesson.html
      slug: 41-deliver-bad-news-with-a-next-step
      week: 5
      title:
        ko: "다음 단계와 함께 나쁜 소식 전하기"
        en: "Deliver bad news with a next step"
        ja: "次の一手とともに悪い知らせを伝える"
    - source: 42-close-a-project-discussion-with-actions/lesson.html
      slug: 42-close-a-project-discussion-with-actions
      week: 6
      title:
        ko: "실행 항목으로 프로젝트 논의 마무리하기"
        en: "Close a project discussion with actions"
        ja: "実行項目を確認して案件の話し合いを終える"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/2-contextual-english/courses/ctx-business-projects-deadlines/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
