apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/en/ctx-business-negotiation-diplomacy

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/en/tracks/2-contextual-english/courses/ctx-business-negotiation-diplomacy/lessons

  lessons:
    - source: 49-reframe-a-problem-more-accurately/lesson.html
      slug: 49-reframe-a-problem-more-accurately
      week: 1
      title:
        ko: "문제를 더 정확하게 다시 규정하기"
        en: "Reframe a problem more accurately"
        ja: "問題をより正確に捉え直す"
    - source: 50-make-a-conditional-proposal/lesson.html
      slug: 50-make-a-conditional-proposal
      week: 2
      title:
        ko: "조건부 제안하기"
        en: "Make a conditional proposal"
        ja: "条件つきの提案をする"
    - source: 51-avoid-committing-too-early/lesson.html
      slug: 51-avoid-committing-too-early
      week: 3
      title:
        ko: "너무 일찍 확약하지 않기"
        en: "Push back on an unsafe commitment"
        ja: "早すぎる確約を避ける"
    - source: 52-explain-a-trade-off/lesson.html
      slug: 52-explain-a-trade-off
      week: 4
      title:
        ko: "트레이드오프 설명하기"
        en: "Explain a trade-off without oversimplifying it"
        ja: "トレードオフを説明する"
    - source: 53-acknowledge-then-push-back/lesson.html
      slug: 53-acknowledge-then-push-back
      week: 5
      title:
        ko: "인정한 뒤 반론하기"
        en: "Acknowledge a point without giving up your position"
        ja: "認めてから反論する"
    - source: 54-find-common-ground/lesson.html
      slug: 54-find-common-ground
      week: 6
      title:
        ko: "공통점 찾기"
        en: "Break a negotiation deadlock"
        ja: "共通点を見つける"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/2-contextual-english/courses/ctx-business-negotiation-diplomacy/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
