apiVersion: podo.curriculum/v1
kind: Promotion
metadata:
  target: courses/en/ctx-travel-arrivals-transport

spec:
  # One lesson owns one directory — lesson.html, and the lesson.yaml promote.py
  # generates beside it. So source is lessons/, and each deck is a path under it.
  source: sandbox/drafts/en/tracks/2-contextual-english/courses/ctx-travel-arrivals-transport/lessons

  lessons:
    - source: 01-check-in-and-request-a-seat/lesson.html
      slug: 01-check-in-and-request-a-seat
      week: 1
      title:
        ko: "체크인하고 좌석 요청하기"
        en: "Check in and request a seat"
        ja: "チェックインして席を頼む"
    - source: 02-answer-immigration-questions-clearly/lesson.html
      slug: 02-answer-immigration-questions-clearly
      week: 2
      title:
        ko: "입국 심사 질문에 분명하게 답하기"
        en: "Answer immigration questions clearly"
        ja: "入国審査の質問にはっきり答える"
    - source: 03-confirm-a-number-you-did-not-hear/lesson.html
      slug: 03-confirm-a-number-you-did-not-hear
      week: 3
      title:
        ko: "못 들은 숫자 확인하기"
        en: "Confirm a number you did not hear"
        ja: "聞き取れなかった数字を確認する"
    - source: 04-choose-the-right-transport-ticket/lesson.html
      slug: 04-choose-the-right-transport-ticket
      week: 4
      title:
        ko: "알맞은 교통권 고르기"
        en: "Choose the right transport ticket"
        ja: "目的に合う交通チケットを選ぶ"
    - source: 05-ask-for-directions-and-confirm-the-route/lesson.html
      slug: 05-ask-for-directions-and-confirm-the-route
      week: 5
      title:
        ko: "길을 묻고 경로 확인하기"
        en: "Ask for directions and confirm the route"
        ja: "道をたずねて行き方を確認する"
    - source: 06-arrange-transport-to-your-accommodation/lesson.html
      slug: 06-arrange-transport-to-your-accommodation
      week: 6
      title:
        ko: "숙소까지 교통편 마련하기"
        en: "Arrange transport to your accommodation"
        ja: "宿泊先までの移動を手配する"

# Generated by tools/make-promotion.py from the decks under sandbox/drafts/en/tracks/2-contextual-english/courses/ctx-travel-arrivals-transport/lessons.
# Add a deck and re-run with --force; the week is its position in the list.
# The three titles are read from each deck's <meta name="podo:title-*"> — to
# change one, edit the deck and regenerate, never this file.
