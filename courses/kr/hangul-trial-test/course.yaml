apiVersion: podo.curriculum/v1
kind: Course
metadata:
  # 출처는 beginner-curriculum 의 korean/trial/lessons — 레벨별 체험 덱 네 장
  # (超入門 / 初級 / 中級 / 上級). 저쪽은 runtime/ 을 공유하는 오소링 트리라
  # 그대로는 배포되지 않는다: 각 덱을 자기 폴더 안에서 완결되게 평탄화하고,
  # 런타임에 승격되던 입력칸을 마크업에 직접 적어 넣은 것이 이 코스다.
  slug: hangul-trial-test

spec:
  curriculumType: TRIAL
  # 자연키의 일부다 — 바꾸면 같은 코스의 수정이 아니라 다른 코스가 된다.
  # test-taiken-trial 이 999.100 이라, 같은 (KR, TRIAL, 25) 안에서 겹치지 않게 999.200 을 쓴다.
  # 999.x 는 실제 상품 레벨이 아니라 테스트 대역이다.
  classLevel: "999.200"
  lessonTime: 25
  # 검수 전까지는 false. true 로 바꾸는 순간 apply 가 학습자에게 노출시킨다.
  enabled: false
  difficulty: BEGINNER

  title:
    ko: 체험 레슨 (레벨별)
    en: Trial lessons by level
    ja: 体験レッスン（レベル別）

  description:
    ko: 일본어 화자를 위한 레벨별 체험 레슨 네 과. 초입문 한글, 초급 자기소개, 중급 상황 회화, 고급 프리토킹.
    ja: 日本語話者のためのレベル別体験レッスン4課。超入門のハングル、初級の自己紹介、中級の場面会話、上級のフリートーキング。

  tutorGroups:
    allowRandom: []
    assignedOnly: []
