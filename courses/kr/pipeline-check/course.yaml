apiVersion: podo.curriculum/v1
kind: Course
metadata:
  # 배포 경로 자체를 확인하기 위한 코스다. 학습 콘텐츠가 아니라 파이프라인의 테스트 대상이며,
  # 새 환경(qa·dev)을 붙인 뒤 "머지 한 번이 네 환경을 실제로 채우는가"를 눈으로 보려고 만들었다.
  #
  # 덱을 일부러 얇게 뒀다 — 로컬 이미지가 없고 페이지가 셋뿐이다. 무거운 덱으로 확인하면
  # 실패했을 때 그것이 파이프라인 문제인지 자산 문제인지 가려내는 데 시간이 든다.
  # 여기서 보고 싶은 것은 GT_CLASS_COURSE 행·GCS 오브젝트·레몬보드 룸 셋이 환경마다
  # 제대로 생기는가 하나뿐이다.
  slug: pipeline-check

spec:
  curriculumType: TRIAL
  countryCode: KR
  # 자연키의 일부다. 같은 (KR, TRIAL, 25) 안에서 taiken-trial 이 999.100,
  # hangul-trial-test 가 999.200, report-test 가 999.300 이라 999.400 을 쓴다.
  # 999.x 는 실제 상품 레벨이 아니라 테스트 대역이고, qa·dev 에도 이 대역은 비어 있다.
  classLevel: "999.400"
  lessonTime: 25
  # 켜지 않는다. 이 코스는 배포 경로를 확인하는 것이 목적이라 학습자에게 보일 이유가 없다.
  enabled: false
  difficulty: BEGINNER

  title:
    ko: 배포 점검
    en: Pipeline check
    ja: デプロイ確認

  description:
    ko: 배포 경로 점검용 덱. 세 장짜리이며 학습 콘텐츠가 아니다.
    ja: デプロイ経路の確認用デッキ。3ページのみで、学習コンテンツではありません。

  tutorGroups:
    allowRandom: []
    assignedOnly: []
