apiVersion: podo.curriculum/v1
kind: Course
metadata:
  # 출처는 이 레포의 sandbox/trial/reports/trial-1-report.html — 상담용 리포트 덱 한 장이다.
  # sandbox 는 tools/model.py 가 아예 걷지 않으므로 거기 있는 동안은 배포될 수 없다.
  # 이 코스가 그 덱의 배포 가능한 형태다: 옆으로 뻗던 참조(../../../shared, ../assets)를
  # 덱 폴더 안에서 완결되게 평탄화하고, 원격 아바타 둘을 번들로 내렸다.
  slug: test-report

spec:
  curriculumType: TRIAL
  # 자연키의 일부다 — 바꾸면 같은 코스의 수정이 아니라 다른 코스가 된다.
  # 같은 (KR, TRIAL, 25) 안에서 test-taiken-trial 이 999.100, hangul-trial-test 가 999.200 이라
  # 겹치지 않게 999.300 을 쓴다. 999.x 는 실제 상품 레벨이 아니라 테스트 대역이다.
  classLevel: "999.300"
  lessonTime: 25
  # 검수 전까지는 false. true 로 바꾸는 순간 apply 가 학습자에게 노출시킨다.
  # 이 덱은 특히 리포트 저장 웹훅이 아직 자리만 잡아 둔 상태라(webhook.example.invalid,
  # 덱의 podo:report-endpoint) 백엔드가 붙기 전에는 켤 수 없다.
  enabled: false
  difficulty: BEGINNER

  title:
    ko: 리포트 테스트
    en: Report test
    ja: レポートテスト

  description:
    ko: 체험 레슨 상담용 리포트 덱 한 장. 니즈 파악(동기·목표·페이스)에서 레벨 진단과 추천 코스까지 한 흐름으로 이어진다.
    ja: 体験レッスンの相談用レポートデッキ1本。ニーズ把握（きっかけ・ゴール・ペース）からレベル診断とおすすめコースまで一つの流れでつながる。

  tutorGroups:
    allowRandom: []
    assignedOnly: []
