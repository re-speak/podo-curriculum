apiVersion: podo.curriculum/v1
kind: Course
metadata:
  # podo:level: 초급
  # 이 코스의 덱이 <meta name="podo:level"> 에 적을 값이다. 스키마가 metadata 에
  # 새 필드를 막아서 주석으로 둔다 — tools/new_lesson.py 와 tools/build-catalog.py
  # 가 이 줄을 읽는다. difficulty 로는 대신할 수 없다: BEGINNER 하나가 왕초급과
  # 초급을 함께 덮어서, 사다리에 어느 칸인지 말해 주지 못한다.
  slug: trial-lv2-patterns

spec:
  curriculumType: TRIAL
  # 일본 거주 학습자에게 보이는 한국어 체험이다. COUNTRY_CODE=JP 인 행만 그 탭이 조회한다.
  countryCode: JP

  # 자연키의 일부다 — 바꾸면 같은 코스의 수정이 아니라 다른 코스가 된다.
  #
  # 11~14 는 라이브 체험 코스(1·2·4·8)를 피해서 잡은 대역이다. 그쪽은 아직 PDF+오디오
  # 교재이고 BOOK_TYPE 에 튜터 매칭 등급(A/B/C/D)을 싣고 있어, 같은 레벨을 쓰면 apply 가
  # 그 행을 덮어써 체험 튜터 매칭이 끊긴다. 이 네 코스는 그 위에 따로 선다.
  classLevel: "12"

  # 한국어 체험 수업은 55분이다. 주차로 쪼개지 않는 한 번짜리 수업이라 레슨도 하나다.
  lessonTime: 55

  # 라이브 체험 네 개(레벨 1·2·4·8, PDF+오디오)와 나란히 선다 — 목록에는 체험이
  # 여덟 개로 보인다. 레거시 네 개를 어떻게 할지는 따로 결정할 일이고, 그때까지는
  # 이쪽이 HTML 체험이라는 것만 제목으로 구분된다.
  enabled: true

  # UPPER_BEGINNER 이지 BEGINNER 가 아니다 — podo:level 이 초급인데도.
  #
  # 사다리는 여섯 칸(왕초급·초급·초중급·중급·중고급·고급)인데 앱의 레벨 필터는
  # 다섯 개다 — 왕초급 칩이 없다(podo-app subscribeList.filters.level.*). 그래서
  # trial-lv1-hangul(왕초급)과 이 코스(초급)가 둘 다 BEGINNER 로 내려앉고,
  # 제목마저 "(초급) 체험 레슨" 으로 같아 difficulty 로 체험을 고르는 쪽에서는
  # 한 칸에 두 행이 앉아 서로를 가린다. 2026-08 에 개발팀이 prod DB 에서 이 두
  # 행(GT_CLASS_COURSE.ID 12102·12103)의 DIFFICULTY 를 UPPER_BEGINNER 로 직접
  # 고쳤다. 여기를 BEGINNER 로 되돌리면 다음 apply 가 그 수정을 덮어써 같은
  # 장애가 다시 난다 — 실제로 199b502f02 가 그렇게 되돌렸고, 그래서 고쳐졌다.
  #
  # 카드에 적히는 말은 그대로 초급이다. 이 코스가 초급 문형을 가르치기 때문이고,
  # 그 예외는 tools/authoring/course_naming.py 의 DISPLAY_LEVEL 이 선언한다.
  # 즉 여기 difficulty 는 레벨 주장이 아니라 필터 칸의 자리표다. 사다리에서
  # 어디인지는 위의 podo:level(초급) 이 말한다.
  difficulty: UPPER_BEGINNER

  title:
    ko: (초급) 체험 레슨
    en: (Beginner) Trial lesson
    ja: (初級) 体験レッスン

  description:
    ko: 기본 문형으로 자기소개와 일상 표현을 말해 보는 55분 체험 레슨.
    ja: 基本の文型で自己紹介や日常表現を話してみる55分の体験レッスン。

  thumbnail: assets/cover.png

  tutorGroups:
    allowRandom: []
    assignedOnly: []
