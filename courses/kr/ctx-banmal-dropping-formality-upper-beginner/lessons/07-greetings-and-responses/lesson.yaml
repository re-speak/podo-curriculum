    en: "Switching greetings and responses"
    ja: "挨拶と返事を切り替える"

  decks:
    lecture:  { entry: lecture/index.html }
    prestudy: { entry: prestudy/index.html }

  # 초안 lesson.yaml 의 teaches 를 그대로 옮긴다 — plan_courses.py 가 목차에서 적어
