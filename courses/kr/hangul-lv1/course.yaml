apiVersion: podo.curriculum/v1
kind: Course
metadata:
  # How a human finds this course. grape matches the DB row by natural key
  # (classLevel / lessonTime / curriculumType …), not by this slug — but keep it
  # stable anyway: it is the name every PR, plan and build log refers to.
  slug: hangul-lv1

spec:
  curriculumType: BASIC        # BASIC | SMART_TALK | TRIAL
  countryCode: KR              # GT_CLASS_COURSE.COUNTRY_CODE; natural-key scope
  classLevel: "1"              # → CLASS_LEVEL (grape truncates past 3 decimals)
  lessonTime: 25               # → LESSON_TIME; 15 or 25
  enabled: false               # → USE_YN. false until every lesson has both decks.
  difficulty: BEGINNER

  # → BOOK_TITLE (json). ko/en/ja also fan out to BOOK_NAME / EN_BOOK_NAME / JP_BOOK_NAME
  # on both the COVER row and every MAIN row, the way class_course_ps.php does it.
  title:
    ko: 한글 떼기
    en: Hangul Basics
    ja: ハングル入門

  # → DESCRIPTION (json)
  description:
    ko: 한글을 한 번도 본 적 없는 일본어 화자가 어떤 한국어 음절이든 소리 내어 읽을 수 있게 되는 11과.
    ja: ハングルを見たことのない日本語話者が、どんな韓国語の音節でも声に出して読めるようになる全11課。

  # → BOOK_THUMBNAIL(COVER 행). 코스 목록에 나가는 432×540 표지다. 키를 지우면 컬럼을
  # 비우는 게 아니라 손대지 않는다 — 지우는 것은 어드민에서 할 일이다.
  thumbnail: assets/cover.png

  # → le_tutor_curriculum rows, curriculum_type = PODO_KR_BASIC
  # allowRandom: random matching + direct assignment. assignedOnly: direct only, and wins on overlap.
  tutorGroups:
    allowRandom: []
    assignedOnly: []
