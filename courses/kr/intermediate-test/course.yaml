apiVersion: podo.curriculum/v1
kind: Course
metadata:
  # hangul-trial-test 의 03-trial-first-meeting(중급 체험 덱)을 그대로 복사해 세운
  # 한 과짜리 중급 점검용 코스다. 덱은 손대지 않았다 — 바뀐 것은 이 코스를 감싸는
  # 자연키뿐이다.
  slug: intermediate-test

spec:
  # BASIC 이어야 레슨 탭에 뜬다. 이 탭의 목록은 백엔드가 섹션을 고정 배열로 짜고
  # 커리큘럼 타입을 문자열 리터럴로 박아 넣는다(LectureQueryServiceImpl.getLectureCourseList) —
  # RECENT · TRIAL · BASIC 셋뿐이라 SMART_TALK 는 어느 섹션에서도 조회되지 않는다.
  # SMART_TALK 은 이 코드베이스에서 캐릭터챗(AI chat)이고 별도 탭이 담당하는데,
  # 그쪽 langType 은 z.enum(['EN','JP','ENJP']) 라 KR 을 아예 받지 않는다.
  # 즉 KR + SMART_TALK 은 어느 화면에도 도달하지 못한다.
  curriculumType: BASIC

  # 일본 거주 학습자의 한국어 탭은 COUNTRY_CODE=JP 인 행만 조회한다.
  # 이 값을 생략하거나 KR 로 두면 배포는 성공해도 그 탭에는 코스가 나타나지 않는다.
  countryCode: JP

  # 자연키의 일부다 — 바꾸면 같은 코스의 수정이 아니라 다른 코스가 된다.
  # 999.x 는 실제 상품 레벨이 아니라 테스트 대역이고, 같은 대역에서 taiken-trial 이
  # 999.100, hangul-trial-test 가 999.200, report-test 가 999.300,
  # pipeline-check 가 999.400 을 쓰고 있어 999.500 을 쓴다.
  #
  # BASIC 에서 이 숫자는 섹션까지 정한다 — 1000 미만이 스탠다드,
  # 1000~1999 가 브레이킹 뉴스, 2000~2999 가 비즈니스, 3000~3999 가 가벼운 프리토킹이다.
  # 스탠다드 안에서는 ORDER BY CLASS_LEVEL 이라 999.500 은 맨 뒤에 붙는다.
  # 실제 KR 콘텐츠는 1.000(hangul-lv1)부터 위로 자라므로 부딪칠 일이 없고,
  # 낮은 값을 쓰면 점검용 코스가 목록 맨 앞에 올라온다.
  classLevel: "999.500"

  # 원본 체험 덱이 25 분짜리였고, 여기서도 그대로 25 분이다.
  # 15 분으로 두면 스탠다드(15분) 섹션에 들어가는데 그 섹션은 15분 BASIC 수강권
  # 보유자에게만 렌더된다(isBasicPurchased15). 25 분 섹션은 조건 없이 뜬다.
  lessonTime: 25

  enabled: true

  # BASIC 의 DIFFICULTY 는 숙련도다 — BEGINNER · UPPER_BEGINNER · INTERMEDIATE ·
  # UPPER_INTERMEDIATE · ADVANCED 다섯이 실제로 쓰인다. 중급 덱이라 INTERMEDIATE 다.
  # (ROLE_PLAYING 같은 값은 SMART_TALK 어휘라 여기서는 쓰지 않는다.)
  # KR 은 getLectureCourseDifficulties 가 빈 목록을 돌려줘 레벨 필터 바가 꺼져 있으므로
  # 이 값으로 걸러지지는 않는다. 자연키에도 들어가지 않는다.
  difficulty: INTERMEDIATE

  title:
    ko: 중급 테스트
    en: Intermediate test
    ja: 中級テスト

  description:
    ko: 중급 점검용 한 과. 처음 만난 사이의 인사와 되묻기를 다룬다. hangul-trial-test 의 중급 체험 덱을 옮겨 온 것이다.
    ja: 中級確認用の1課。初対面のあいさつと聞き返しを扱います。hangul-trial-test の中級体験デッキを移したものです。

  tutorGroups:
    allowRandom: []
    assignedOnly: []
