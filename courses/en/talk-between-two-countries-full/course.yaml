apiVersion: podo.curriculum/v1
kind: Course
metadata:
  # Generated from the approved 3-freetalking course cut.
  # LANG_TYPE is not stored here: podo-curriculum derives EN from courses/en/.
  # podo:level: B2-C1
  # The CEFR band this course's decks carry in <meta name="podo:level">. The
  # schema forbids extra metadata fields, so it lives as a comment — the same
  # line tools/new_lesson.py reads, and what tools/build-catalog.py puts on the
  # level ladder. `difficulty` cannot stand in for it: one BEGINNER covers both
  # A1 and A2.
  slug: talk-between-two-countries-full

spec:
  curriculumType: BASIC
  countryCode: JP
  # classLevel and countryCode are natural-key fields. Changing either creates
  # a different course identity rather than updating the deployed row.
  classLevel: "3100.010"
  lessonTime: 25
  # Promotion is a human-reviewed act; the authoring draft remains disabled.
  enabled: true
  difficulty: ADVANCED

  # Three name columns, three descriptions: the app picks by locale, so `ja` is
  # what this Japanese-market track puts on screen and `ko` is grape's admin
  # label. Both come from tools/course-copy.json, never from the TOC — a
  # generated title was English in all three slots and 72 characters long.
  title:
    ko: 프리토킹 · 두 나라 사이 · B2–C1
    en: Free talking · Two countries · B2–C1
    ja: フリートーキング · ふたつの国 · B2–C1

  description:
    ko: 다른 나라에서 놀란 점을 설명하고, 일본에 온 사람은 무엇에 놀랄지 말한다.
    en: Explain what surprised you about another country, and what would surprise a visitor to Japan.
    ja: 他の国について驚いたことを説明し、日本に来た人が何に驚くかを話す。

  thumbnail: assets/cover.png

  tutorGroups:
    allowRandom: []
    assignedOnly: []

# Promoted lessons. tools/promote.py generates lesson.yaml and both deck slots
# from the approved promotion manifest beside the authoring draft.
#     1  ·  FT-1 · Something that surprised you about another culture
#     2  ·  FT-2 · What people often get wrong about Japan
#     3  ·  FT-3 · A Japanese food everyone should try
#     4  ·  FT-4 · A table manner that differs between countries
#     5  ·  FT-5 · A place you would show a visitor
#     6  ·  FT-6 · A word that doesn't translate neatly
#     7  ·  FT-7 · Something Japan does especially well
#     8  ·  FT-8 · How you spend New Year's Day
# Course list originally generated by tools/authoring/en/plan_courses.py.
