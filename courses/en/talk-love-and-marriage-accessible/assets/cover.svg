<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="864" height="1080" viewBox="0 0 864 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="430" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A0254B"/>
      <stop offset=".46" stop-color="#A0254B"/>
      <stop offset="1" stop-color="#8D2142"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="518" gradientUnits="userSpaceOnUse">
      <stop stop-color="#000000" stop-opacity=".26"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="864" height="1080" rx="48"/></clipPath>
    <style>
      text { font-family: Pretendard, "Hiragino Sans", sans-serif; }
      .pill { fill: #fff; font-weight: 700; letter-spacing: -.2px; }
      .title { fill: #fff; font-weight: 700; letter-spacing: -3px; }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="864" height="1080" fill="url(#bg)"/>
    <circle cx="468" cy="690" r="516" fill="none" stroke="#FFFFFF" stroke-opacity=".075" stroke-width="84"/>
    <rect width="864" height="518" fill="url(#scrim)"/>

    <image x="96" y="456" width="744" height="576" preserveAspectRatio="xMidYMax meet" href="../../../../tools/authoring/course_covers/motifs/romance.png" xlink:href="../../../../tools/authoring/course_covers/motifs/romance.png"/>

    <rect x="72" y="66" width="598" height="111" rx="55" fill="#000000" fill-opacity=".42"/>
    <text x="120" y="142" class="pill" font-size="60">フリートーク · 中級</text>
    <text x="72" y="289" class="title" font-size="102">Love and</text>
    <text x="72" y="407" class="title" font-size="102">marriage</text>
  </g>
</svg>
