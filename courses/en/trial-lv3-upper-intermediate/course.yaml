apiVersion: podo.curriculum/v1
kind: Course
metadata:
  # podo:level: B2
  # 이 코스의 덱이 <meta name="podo:level"> 에 적는 값이다. 스키마가 metadata 에
  # 새 필드를 막아서 주석으로 둔다. difficulty 로는 대신할 수 없다 — 다섯 칸이
  # 사다리의 어느 칸인지까지 말해 주지는 못한다.
  slug: trial-lv3-upper-intermediate

spec:
  curriculumType: TRIAL
  # 일본 거주 학습자에게 보이는 영어 체험이다. COUNTRY_CODE=JP 인 행만 그 탭이 조회한다.
  # 한국 시장의 영어(COUNTRY_CODE=KR)와는 다른 제품이고, 자연키가 갈라 준다.
  countryCode: JP

  # 자연키의 일부다 — 바꾸면 같은 코스의 수정이 아니라 다른 코스가 된다.
  #
  # 11~14 는 라이브 영어 체험(레벨 3·4·5·7)을 피해서 잡은 대역이다. 그쪽은 아직
  # PDF+오디오 교재이고 BOOK_TYPE 에 튜터 매칭 등급(A/B/C/D)을 싣고 있어, 같은
  # 레벨을 쓰면 apply 가 그 행을 덮어써 체험 튜터 매칭이 끊긴다. 확인한 값이다:
  # EN/JP/TRIAL/25분에 쓰이는 CLASS_LEVEL 은 3·4·5·7 뿐이다.
  classLevel: "13"

  # 영어 체험 수업은 25분이다. 주차로 쪼개지 않는 한 번짜리 수업이라 레슨도 하나다.
  lessonTime: 25

  enabled: true
  difficulty: UPPER_INTERMEDIATE

  title:
    ko: (중고급) 체험 레슨
    en: (Upper Intermediate) Trial lesson
    ja: (中上級) 体験レッスン

  description:
    ko: 도시와 시골의 생활을 비교하며 대화를 이어 가는 25분 체험 레슨.
    ja: 都会と田舎の暮らしを比べながら会話を続ける25分の体験レッスン。

  thumbnail: assets/cover.png

  tutorGroups:
    allowRandom: []
    assignedOnly: []
