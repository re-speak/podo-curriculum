apiVersion: podo.curriculum/v1
kind: Course
metadata:
  # Generated from the approved 1-core-patterns course cut.
  # LANG_TYPE is not stored here: podo-curriculum derives EN from courses/en/.
  # podo:level: A1
  # The CEFR band this course's decks carry in <meta name="podo:level">. The
  # schema forbids extra metadata fields, so it lives as a comment — the same
  # line tools/new_lesson.py reads, and what tools/build-catalog.py puts on the
  # level ladder. `difficulty` cannot stand in for it: one BEGINNER covers both
  # A1 and A2.
  slug: core-first-exchanges-2

spec:
  curriculumType: BASIC
  countryCode: JP
  # classLevel and countryCode are natural-key fields. Changing either creates
  # a different course identity rather than updating the deployed row.
  classLevel: "100.020"
  lessonTime: 25
  # Promotion is a human-reviewed act; the authoring draft remains disabled.
  enabled: true
  difficulty: BEGINNER

  # Three name columns, three descriptions: the app picks by locale, so `ja` is
  # what this Japanese-market track puts on screen and `ko` is grape's admin
  # label. Both come from tools/course-copy.json, never from the TOC — a
  # generated title was English in all three slots and 72 characters long.
  title:
    ko: (초급) 핵심 패턴 · 하기와 부탁
    en: (Beginner) Core · Doing and asking
    ja: (初級) コアパターン · 動作と依頼

  description:
    ko: 하는 일과 안 하는 일을 말하고, 필요한 것을 부탁한다.
    en: Say what you do and what you don't, and ask for what you need.
    ja: することとしないことを言い、必要なものを頼む。

  thumbnail: assets/cover.png

  tutorGroups:
    allowRandom: []
    assignedOnly: []

