 part of doing that activity alone?", "ja": "その活動を一人でするとしたら、いちばん難しいのはどの部分ですか？", "f": ["Is the problem safety, confidence, or enjoyment?", "Which moment would feel hardest?"]}, {"n": "QUESTION 1", "t": "Which solo plan would you try first: a restaurant meal, a movie, or a day trip?", "ja": "最初に一人で試すなら、レストランでの食事、映画、日帰り旅行のどれですか？", "f": ["Which moment would feel hardest?", "What could make it enjoyable?"]}, {"n": "QUESTION 2", "t": "What would be the best part of doing it alone?", "ja": "それを一人でするなら、いちばんよい点は何ですか？", "f": ["Which decision would become easier?", "What would you miss sharing with someone?"]}, {"n": "QUESTION 3", "t": "What helps some people feel comfortable doing more things alone?", "ja": "一人でもより自信を持って行動できる人がいるのはなぜですか？", "f": ["What skill makes going alone easier?", "How can one good experience build confidence?"]}, {"n": "QUESTION 4", "t": "How can a person's comfort with doing things alone change over time?", "ja": "一人で行動することへの気楽さは、時間とともにどう変わりますか？", "f": ["What experience could make going alone easier?", "What could make it feel harder again?"]}, {"n": "QUESTION 5", "t": "What small activity can prepare someone to do more things alone?", "ja": "一人でできることを増やすために、どんな小さな活動が準備になりますか？", "f": ["How could they make it feel safer?", "What would show they are ready for more?"]}, {"n": "QUESTION 6", "t": "Would you actually like to get comfortable doing it alone?", "ja": "実際に、それを一人でも平気でできるようになりたいですか？", "f": ["What would be the first small step?", "When would company still be better?"]}]}, {"n": 5, "title": "낯선 사람과 대화 시작하기", "sub": "知らない人との会話の始め方", "titles": {"ko": "낯선 사람과 대화 시작하기", "en": "Starting a conversation with a stranger", "ja": "知らない人との会話の始め方"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-people-and-ties-accessible/51-starting-a-conversation-with-a-stranger/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-accessible/51-starting-a-conversation-with-a-stranger/lecture/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/51-starting-a-conversation-with-a-stranger/lecture/index.html"}, {"href": "view/talk-people-and-ties-accessible/51-starting-a-conversation-with-a-stranger/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-accessible/51-starting-a-conversation-with-a-stranger/prestudy/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/51-starting-a-conversation-with-a-stranger/prestudy/index.html"}], "goal": {"t": "Let's build a natural opening and a graceful way out when it fails. Please read the title aloud.", "ja": "自然な会話の始め方と、続かないときの終え方について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "You're seated beside someone you've never met. How would you open the conversation?", "ja": "会ったことのない人の隣に座っています。どのように会話を始めますか？", "f": ["Which shared detail would you use?", "How would you keep the opening low-pressure?"]}, {"n": "WARM-UP 2", "t": "Where would a simple opening with a stranger feel most natural?", "ja": "知らない人への簡単な声のかけ方が、最も自然に感じるのはどこですか？", "f": ["What can both people notice in that moment?", "Where would it feel intrusive?"]}, {"n": "QUESTION 1", "t": "Which topics would you avoid with a stranger?", "ja": "知らない人との会話では、どのような話題を避けますか？", "f": ["Why might the topic feel intrusive?", "Could a different setting make it appropriate?"]}, {"n": "QUESTION 2", "t": "What makes a small talk question easy to answer?", "ja": "どんな雑談の質問なら答えやすいですか？", "f": ["Should it be general or specific?", "How can the other person give a short answer?"]}, {"n": "QUESTION 3", "t": "Which kind of opening makes a conversation die quickly?", "ja": "どのような最初の一言だと、会話がすぐ止まりますか？", "f": ["Is the problem the topic or the way it was said?", "What simple question might save the conversation?"]}, {"n": "QUESTION 4", "t": "How can you tell that a stranger wants to keep talking?", "ja": "どのような反応から、相手が本当に会話を続けたいと分かりますか？", "f": ["What can a brief answer mean?", "Which sign suggests it is time to end the conversation politely?"]}, {"n": "QUESTION 5", "t": "What can you do when a conversation starter gets no response?", "ja": "会話のきっかけに反応がなかったら、何ができますか？", "f": ["Would you try one more question?", "How would you end politely?"]}, {"n": "QUESTION 6", "t": "Which conversation starter could you actually use this week?", "ja": "今週、実際に使えそうな会話のきっかけは何ですか？", "f": ["Where could you use it?", "Which reply would give you a natural next question?"]}]}, {"n": 6, "title": "다툰 뒤 화해하는 방법", "sub": "けんかのあとの仲直りのしかた", "titles": {"ko": "다툰 뒤 화해하는 방법", "en": "How you make up after an argument", "ja": "けんかのあとの仲直りのしかた"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-people-and-ties-accessible/52-how-you-make-up-after-an-argument/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-accessible/52-how-you-make-up-after-an-argument/lecture/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/52-how-you-make-up-after-an-argument/lecture/index.html"}, {"href": "view/talk-people-and-ties-accessible/52-how-you-make-up-after-an-argument/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-accessible/52-how-you-make-up-after-an-argument/prestudy/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/52-how-you-make-up-after-an-argument/prestudy/index.html"}], "goal": {"t": "Let's talk about what fair repair after an argument requires. Please read the title aloud.", "ja": "けんかのあとに関係を公平に修復するために必要なことを話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "After an ordinary argument, who should reach out and make contact?", "ja": "普通のけんかのあと、どちらが先に連絡を始めるべきですか？", "f": ["Does reaching out first mean taking all the blame?", "What makes the first move emotionally difficult?"]}, {"n": "WARM-UP 2", "t": "How much time apart helps people talk calmly after an argument?", "ja": "対立のあと、落ち着いた会話をするためにどのくらい距離を置くとよいですか？", "f": ["How should the pause be used?", "When does distance begin to deepen the problem?"]}, {"n": "QUESTION 1", "t": "What would make a first message after an argument helpful?", "ja": "けんかのあとの最初の連絡は、どのような言葉で伝えるとよいですか？", "f": ["Should it mention the argument right away?", "How can the tone avoid sounding defensive?"]}, {"n": "QUESTION 2", "t": "What larger problem can hide behind a small argument?", "ja": "小さな口論の裏に、どんなより大きな問題が隠れていることがありますか？", "f": ["Could it be about respect, time, or responsibility?", "How could the two people talk about the real problem?"]}, {"n": "QUESTION 3", "t": "Which matters more in an apology: the words or what happens next?", "ja": "謝罪では、言葉とその後の行動のどちらが大切ですか？", "f": ["What should the apology say clearly?", "What action should follow?"]}, {"n": "QUESTION 4", "t": "Can people stay close even when one disagreement is never fully solved?", "ja": "解決しない意見の違いがあっても、関係を壊さずにいられますか？", "f": ["Which differences can people accept?", "When would they need a new rule?"]}, {"n": "QUESTION 5", "t": "When is repairing the relationship not the right goal?", "ja": "仲直りを目標にすることが適切ではないのは、どのようなときですか？", "f": ["What would need to change first?", "How can someone end contact respectfully?"]}, {"n": "QUESTION 6", "t": "What is a fair way to make up after an ordinary argument?", "ja": "普通のけんかのあと、公平に仲直りするにはどのような方法がありますか？", "f": ["Who should speak first?", "How would they know things were better?"]}]}, {"n": 7, "title": "함께 있으면 마음이 편한 사람", "sub": "一緒にいると心からくつろげる人", "titles": {"ko": "함께 있으면 마음이 편한 사람", "en": "Someone you can completely relax around", "ja": "一緒にいると心からくつろげる人"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-people-and-ties-accessible/53-why-some-friendships-fade/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-accessible/53-why-some-friendships-fade/lecture/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/53-why-some-friendships-fade/lecture/index.html"}, {"href": "view/talk-people-and-ties-accessible/53-why-some-friendships-fade/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-accessible/53-why-some-friendships-fade/prestudy/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/53-why-some-friendships-fade/prestudy/index.html"}], "goal": {"t": "Let's talk about what makes it easy to relax and be yourself around someone. Please read the title aloud.", "ja": "誰かと一緒にいるとき、気を張らずに自分らしくいられる理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Who makes it easiest for you to relax and be yourself?", "ja": "誰といると、いちばん気を張らずに自分らしくいられますか？", "f": ["What do you usually do together?", "If no one comes to mind, who makes conversation feel least tiring?"]}, {"n": "WARM-UP 2", "t": "What's something you can do around them that you wouldn't do with everyone?", "ja": "その人の前ではできても、誰の前でもできるわけではないことは何ですか？", "f": ["Can you be quiet, silly, or completely honest?", "When did you first notice that?"]}, {"n": "QUESTION 1", "t": "What makes you feel safe around them?", "ja": "その人といると安心できるのはなぜですか？", "f": ["Do they listen without judging?", "What small action shows it?"]}, {"n": "QUESTION 2", "t": "Do you need to talk, or is comfortable silence enough?", "ja": "会話が必要ですか、それとも気まずくない沈黙だけで十分ですか？", "f": ["What does a comfortable silence feel like?", "When do you still need to talk?"]}, {"n": "QUESTION 3", "t": "Has this person changed the way you see yourself?", "ja": "その人によって、自分の見方が変わったことはありますか？", "f": ["Which quality did they notice in you?", "Did that change your confidence?"]}, {"n": "QUESTION 4", "t": "Can the same person make you feel relaxed in every situation?", "ja": "同じ人でも、どんな場面でも自分をくつろがせてくれますか？", "f": ["When might the feeling change?", "How much does the setting matter?"]}, {"n": "QUESTION 5", "t": "What side of you do they bring out most?", "ja": "その人といると、自分のどんな面がいちばん出ますか？", "f": ["Is it your playful, honest, calm, or ambitious side?", "Do they see it the same way?"]}, {"n": "QUESTION 6", "t": "Now the opposite: what kind of person makes you watch every word?", "ja": "では逆に、どんな人の前では一言一言に気をつかいますか？", "f": ["What behavior makes you cautious?", "How would you end that conversation politely?"]}]}, {"n": 8, "title": "가장 많이 이야기하는 사람", "sub": "いちばんよく話す人", "titles": {"ko": "가장 많이 이야기하는 사람", "en": "The person you talk to most", "ja": "いちばんよく話す人"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-people-and-ties-accessible/54-the-person-you-talk-to-most/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-accessible/54-the-person-you-talk-to-most/lecture/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/54-the-person-you-talk-to-most/lecture/index.html"}, {"href": "view/talk-people-and-ties-accessible/54-the-person-you-talk-to-most/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-accessible/54-the-person-you-talk-to-most/prestudy/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/54-the-person-you-talk-to-most/prestudy/index.html"}], "goal": {"t": "Let's talk about how contact patterns shape our relationships. Please read the title aloud.", "ja": "連絡のしかたが人間関係に与える影響について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Who do you talk to most these days?", "ja": "最近、いちばんよく話す相手は誰ですか？", "f": ["Do you mostly talk in person or by message?", "Is it a family member, friend, coworker, or someone else?"]}, {"n": "WARM-UP 2", "t": "What do you usually talk about with them?", "ja": "その人とは、普段どんなことを話しますか？", "f": ["Is it mostly everyday updates or bigger problems?", "Which subject do you avoid?"]}, {"n": "QUESTION 1", "t": "Do you mostly exchange short messages or have long conversations?", "ja": "短いメッセージをやり取りすることと、長く話すことでは、どちらが多いですか？", "f": ["Which one keeps you closer?", "When does frequent contact feel like pressure?"]}, {"n": "QUESTION 2", "t": "What kinds of conversation make people feel closer over time?", "ja": "どのような会話が、時間をかけて関係を深めますか？", "f": ["Do deeper conversations always require personal details?", "How can ordinary daily talk build trust?"]}, {"n": "QUESTION 3", "t": "Why is one subject easy to discuss with one person but hard with another?", "ja": "同じ話題でも、相手によって話しやすさが変わるのはなぜですか？", "f": ["What topics need more trust?", "When can timing matter more than the topic?"]}, {"n": "QUESTION 4", "t": "Have they always been the person you talk to most?", "ja": "その人は、以前からいちばんよく話す相手でしたか？", "f": ["When did the pattern change?", "What brought you closer?"]}, {"n": "QUESTION 5", "t": "Who did you talk to most five years ago?", "ja": "5年前、いちばんよく話していた相手は誰ですか？", "f": ["Why did that person matter then?", "Do you still keep in touch?"]}, {"n": "QUESTION 6", "t": "If you couldn't talk often, what would help you stay close?", "ja": "あまり話せなくなったら、親しさを保つために何が役立ちますか？", "f": ["What kind of contact would matter most?", "How long could the silence last without feeling awkward?"]}]}, {"n": 9, "title": "마음에 남은 조언", "sub": "心に残っている助言", "titles": {"ko": "마음에 남은 조언", "en": "Advice that stayed with you", "ja": "心に残っている助言"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-people-and-ties-accessible/55-advice-that-stayed-with-you/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-accessible/55-advice-that-stayed-with-you/lecture/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/55-advice-that-stayed-with-you/lecture/index.html"}, {"href": "view/talk-people-and-ties-accessible/55-advice-that-stayed-with-you/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-accessible/55-advice-that-stayed-with-you/prestudy/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/55-advice-that-stayed-with-you/prestudy/index.html"}], "goal": {"t": "Let's talk about why some advice stays with people and deserves to be shared. Please read the title aloud.", "ja": "心に残る助言と、それを人に伝える価値について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one piece of advice you still remember?", "ja": "今でも覚えている助言を一つ挙げるとしたら、何ですか？", "f": ["Was it about work, school, relationships, or daily life?", "If none comes to mind, what common advice have you heard often?"]}, {"n": "WARM-UP 2", "t": "What exact words do you remember?", "ja": "どんな言葉だったか、具体的に覚えていますか？", "f": ["If not, what was the main idea?", "Why was the wording easy to remember?"]}, {"n": "QUESTION 1", "t": "Who gave you that advice?", "ja": "その助言は、誰からもらいましたか？", "f": ["Why did you trust that person?", "Would the same advice feel different from someone else?"]}, {"n": "QUESTION 2", "t": "When did the advice start to make sense?", "ja": "その助言が納得できるようになったのは、いつですか？", "f": ["Did it arrive before you were ready?", "What changed later?"]}, {"n": "QUESTION 3", "t": "Would you still follow that advice today?", "ja": "今でも、その助言に従いますか？", "f": ["Which part still fits?", "What has changed?"]}, {"n": "QUESTION 4", "t": "When might that advice stop being useful?", "ja": "その助言が役に立たなくなるのは、どんなときですか？", "f": ["Which situation would not fit it?", "Could the advice be adjusted?"]}, {"n": "QUESTION 5", "t": "Would you pass it on to someone else?", "ja": "その助言を、ほかの人にも伝えたいですか？", "f": ["Who might benefit from it?", "How could you share it without sounding controlling?"]}, {"n": "QUESTION 6", "t": "Now the opposite: what's a common piece of advice you don't agree with?", "ja": "では逆に、よく聞くけれど賛成できない助言は何ですか？", "f": ["Why does it not work for everyone?", "Could it still help in one situation?"]}]}, {"n": 10, "title": "위급할 때 전화할 사람", "sub": "緊急時に電話する人", "titles": {"ko": "위급할 때 전화할 사람", "en": "The person you would call in an emergency", "ja": "緊急時に電話する人"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-people-and-ties-accessible/56-the-person-you-would-call-in-an-emergency/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-accessible/56-the-person-you-would-call-in-an-emergency/lecture/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/56-the-person-you-would-call-in-an-emergency/lecture/index.html"}, {"href": "view/talk-people-and-ties-accessible/56-the-person-you-would-call-in-an-emergency/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-accessible/56-the-person-you-would-call-in-an-emergency/prestudy/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/56-the-person-you-would-call-in-an-emergency/prestudy/index.html"}], "goal": {"t": "Let's talk about practical support and a reliable emergency network. Please read the title aloud.", "ja": "実際に役立つ支えと、信頼できる緊急時の支援体制について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Away from home, if you lost your phone and wallet, who would you contact first?", "ja": "外出先で携帯電話と財布をなくしたら、まず誰に連絡しようとしますか？", "f": ["How could you reach them without your phone?", "When would you contact a professional service first?"]}, {"n": "WARM-UP 2", "t": "Why would you choose that person?", "ja": "なぜ、その人を選びますか？", "f": ["Are they calm, practical, nearby, or something else?", "What could they do first?"]}, {"n": "QUESTION 1", "t": "What would you say first once you reached them?", "ja": "連絡がついたら、最初に何を伝えますか？", "f": ["Which location detail would matter?", "How briefly could you explain the problem?"]}, {"n": "QUESTION 2", "t": "What kind of emergency would make you call someone else?", "ja": "どんな緊急事態なら、別の人に連絡しますか？", "f": ["Would you call a professional service or another trusted person?", "What different help would you need?"]}, {"n": "QUESTION 3", "t": "When should you call emergency services before someone you know?", "ja": "知り合いより先に、緊急サービスへ連絡すべきなのはどんなときですか？", "f": ["What is one clear example?", "Who would you contact after help was on the way?"]}, {"n": "QUESTION 4", "t": "Has your first-choice contact changed over time?", "ja": "最初に連絡したい相手は、以前と変わりましたか？", "f": ["Who would you have called before?", "What caused the change?"]}, {"n": "QUESTION 5", "t": "Would you still call them if they lived far away?", "ja": "その人が遠くに住んでいても、連絡しますか？", "f": ["What help could they give from a distance?", "Who could help nearby?"]}, {"n": "QUESTION 6", "t": "Does that person know you'd call them in an emergency?", "ja": "その人は、緊急時に自分が連絡するつもりだと知っていますか？", "f": ["Should you tell them?", "Who would be your backup contact?"]}]}]}, {"no": 10, "label": "10코스", "title": "사람과 관계", "titles": {"ko": "사람과 관계", "en": "People and ties", "ja": "人と関係"}, "subtitle": "(上級) 人と関係", "desc": {"ko": "실제 관계 경험을 꺼내고 그 경험에서 생긴 의견을 설명한다.", "en": "Bring up real experiences with people, and the opinions those experiences left you with.", "ja": "実際の人間関係の経験を出し、そこから生まれた考えを説明する。"}, "cover": "covers/talk-people-and-ties-full.webp", "levels": ["C1"], "level": "C1", "slug": "talk-people-and-ties-full", "lessons": [{"n": 1, "title": "오래가는 우정의 조건", "sub": "友情が長く続く理由", "titles": {"ko": "오래가는 우정의 조건", "en": "What makes a friendship last", "ja": "友情が長く続く理由"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-people-and-ties-full/47-what-makes-a-friendship-last/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-full/47-what-makes-a-friendship-last/lecture/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/47-what-makes-a-friendship-last/lecture/index.html"}, {"href": "view/talk-people-and-ties-full/47-what-makes-a-friendship-last/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-full/47-what-makes-a-friendship-last/prestudy/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/47-what-makes-a-friendship-last/prestudy/index.html"}], "goal": {"t": "Let's talk about what helps friendships last as life changes. Please read the title aloud.", "ja": "生活が変わっても友情が続く理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What helps a friendship to last as both lives change?", "ja": "お互いの生活が変わっても友情が続くために、何が必要ですか？", "f": ["Which life change tests a friendship most?", "What can friends do to stay close?"]}, {"n": "WARM-UP 2", "t": "What kind of ordinary meeting can grow into a strong friendship?", "ja": "どんな普通の出会いが、強い友情に育つことがありますか？", "f": ["What gives the two people something to talk about?", "When do they start feeling like close friends?"]}, {"n": "QUESTION 1", "t": "How can a friendship change without losing its strength?", "ja": "友情は、強さを失わずにどのように変化していけますか？", "f": ["Which changes can be healthy?", "What should still feel familiar?"]}, {"n": "QUESTION 2", "t": "When friends are busy, what kind of contact keeps them close without creating pressure?", "ja": "友人同士が忙しいとき、プレッシャーを生まずに親しさを保つのは、どんな連絡ですか？", "f": ["How much contact keeps closeness?", "What shows care without feeling like a duty?"]}, {"n": "QUESTION 3", "t": "Which behaviour hurts a friendship?", "ja": "友情に最も大きな損害を与えるのは、どのような行動ですか？", "f": ["Why does it hurt the friendship?", "What would the person need to do next?"]}, {"n": "QUESTION 4", "t": "Why do some friendships fade even when neither person is at fault?", "ja": "どちらも悪くなくても、友情が薄れていくのはなぜですか？", "f": ["Which life change most quickly reduces contact?", "When is growing apart simply a normal change?"]}, {"n": "QUESTION 5", "t": "When is a friendship worth trying to revive?", "ja": "友情をもう一度よみがえらせる価値があるのは、どのようなときですか？", "f": ["What could reopen contact naturally?", "How can renewed contact avoid creating pressure?"]}, {"n": "QUESTION 6", "t": "What do you bring to a strong friendship?", "ja": "強い友情に、自分は何を与えていますか？", "f": ["How would close friends describe what you bring to the relationship?", "What would you still like to improve?"]}]}, {"n": 2, "title": "완전히 틀렸던 첫인상", "sub": "まったく違っていた第一印象", "titles": {"ko": "완전히 틀렸던 첫인상", "en": "A first impression that was completely wrong", "ja": "まったく違っていた第一印象"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-people-and-ties-full/48-a-first-impression-that-was-completely-wrong/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-full/48-a-first-impression-that-was-completely-wrong/lecture/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/48-a-first-impression-that-was-completely-wrong/lecture/index.html"}, {"href": "view/talk-people-and-ties-full/48-a-first-impression-that-was-completely-wrong/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-full/48-a-first-impression-that-was-completely-wrong/prestudy/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/48-a-first-impression-that-was-completely-wrong/prestudy/index.html"}], "goal": {"t": "Let's talk about why first impressions change. Please read the title aloud.", "ja": "第一印象が変わる理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Has anyone ever made a completely wrong first impression on you?", "ja": "誰かに対する第一印象が、まったく間違っていたことはありますか？", "f": ["What did you think at first?", "If not, which is easier to misread: a quiet person or a talkative person?"]}, {"n": "WARM-UP 2", "t": "What small detail shaped that first impression?", "ja": "どんな小さな点が、その第一印象を作りましたか？", "f": ["Was it their voice, expression, clothes, or something else?", "Why did you notice it?"]}, {"n": "QUESTION 1", "t": "What happened that changed your mind?", "ja": "何があって、その人への考えが変わりましたか？", "f": ["Was one action enough, or did it take time?", "If you have no example, what would make you change a first impression?"]}, {"n": "QUESTION 2", "t": "Why do some first impressions change quickly while others stick?", "ja": "すぐ見直される第一印象と、なかなか変わらない第一印象があるのはなぜですか？", "f": ["Why might someone ignore new information?", "What could help the impression change?"]}, {"n": "QUESTION 3", "t": "What could explain someone's bad first impression?", "ja": "誰かの悪い第一印象は、何が原因かもしれませんか？", "f": ["Could tiredness or nervousness explain the behaviour?", "What would you want to know before judging?"]}, {"n": "QUESTION 4", "t": "What warning sign can completely reverse a good first impression?", "ja": "どんな危険信号が、よい第一印象を完全に変えることがありますか？", "f": ["Which warning sign is commonly overlooked?", "How much new information would make the change fair?"]}, {"n": "QUESTION 5", "t": "When can a quick first impression be useful?", "ja": "すぐに持つ第一印象が役立つのは、どのようなときですか？", "f": ["When can a quick impression become unfair?", "What should make us wait before judging?"]}, {"n": "QUESTION 6", "t": "What do people often misread about you at first?", "ja": "初対面で、自分のどんなところを誤解されやすいですか？", "f": ["What do they assume instead?", "How long does it usually take them to notice?"]}]}, {"n": 3, "title": "MBTI, 잘 맞아요?", "sub": "MBTI、当たってる？", "titles": {"ko": "MBTI, 잘 맞아요?", "en": "How accurate is your MBTI?", "ja": "MBTI、当たってる？"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-people-and-ties-full/49-how-accurate-is-your-mbti/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-full/49-how-accurate-is-your-mbti/lecture/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/49-how-accurate-is-your-mbti/lecture/index.html"}, {"href": "view/talk-people-and-ties-full/49-how-accurate-is-your-mbti/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-full/49-how-accurate-is-your-mbti/prestudy/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/49-how-accurate-is-your-mbti/prestudy/index.html"}], "goal": {"t": "Let's examine what MBTI can reveal—and what a personality label may overlook. Please read the title aloud.", "ja": "MBTIから分かることと、性格のラベルが見落とすことについて考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What does your MBTI type get right about you?", "ja": "自分のMBTIタイプは、自分のどんなところを正しく表していますか？", "f": ["Which example shows it best?", "If you do not know your type, would you want to take the test?"]}, {"n": "WARM-UP 2", "t": "When do you act most like that type?", "ja": "どんなときに、そのタイプらしく行動しますか？", "f": ["Is it more visible at home, at work, or with friends?", "When do you act completely differently?"]}, {"n": "QUESTION 1", "t": "Why do you think that part fits you?", "ja": "その部分は、なぜ自分に当てはまると思いますか？", "f": ["Has it always been true?", "What habit makes it visible?"]}, {"n": "QUESTION 2", "t": "Who sees a personality more clearly: the person or a close friend?", "ja": "性格をより正確に見ているのは、本人と親しい友人のどちらだと思いますか？", "f": ["Which patterns might an observer recognize?", "Why might people see themselves differently from how others see them?"]}, {"n": "QUESTION 3", "t": "What is one part of you that an MBTI result might miss?", "ja": "MBTIの結果では表しきれない自分の一面は何ですか？", "f": ["In which situation does that side appear?", "Would a close friend agree?"]}, {"n": "QUESTION 4", "t": "Is MBTI a good topic for starting a conversation?", "ja": "MBTIは会話を始めるのによい話題ですか？", "f": ["When can it open a worthwhile discussion?", "What quick judgments should people avoid?"]}, {"n": "QUESTION 5", "t": "Why might someone's MBTI result change over time?", "ja": "人のMBTI結果が時間とともに変わるのはなぜですか？", "f": ["How might experience change the meaning of a question?", "Which parts of a personality may stay fairly stable?"]}, {"n": "QUESTION 6", "t": "What can go wrong when people rely too much on someone's MBTI?", "ja": "人のMBTIを頼りすぎると、どんな問題が起こることがありますか？", "f": ["Which wrong expectation could affect how the person is treated?", "What question would help you see the individual?"]}]}, {"n": 4, "title": "혼자서는 절대 하지 않을 일", "sub": "一人では絶対にしないこと", "titles": {"ko": "혼자서는 절대 하지 않을 일", "en": "Something you would never do alone", "ja": "一人では絶対にしないこと"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-people-and-ties-full/50-something-you-would-never-do-alone/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-full/50-something-you-would-never-do-alone/lecture/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/50-something-you-would-never-do-alone/lecture/index.html"}, {"href": "view/talk-people-and-ties-full/50-something-you-would-never-do-alone/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-full/50-something-you-would-never-do-alone/prestudy/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/50-something-you-would-never-do-alone/prestudy/index.html"}], "goal": {"t": "Let's find where being alone stops feeling comfortable and why. Please read the title aloud.", "ja": "一人でできることの境界と、その理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which activity would feel hardest for you to do alone?", "ja": "一人でするとき、どの活動が自分の安心できる範囲から最も遠く感じますか？", "f": ["What makes it different from ordinary solo activities?", "Is the main barrier safety, confidence, or enjoyment?"]}, {"n": "WARM-UP 2", "t": "What's the hardest part of doing that activity alone?", "ja": "その活動を一人でするとしたら、いちばん難しいのはどの部分ですか？", "f": ["Is the problem safety, confidence, or enjoyment?", "Which moment would feel hardest?"]}, {"n": "QUESTION 1", "t": "Which solo plan would you try first: a restaurant meal, a movie, or a day trip?", "ja": "最初に一人で試すなら、レストランでの食事、映画、日帰り旅行のどれですか？", "f": ["Which moment would feel hardest?", "What could make it enjoyable?"]}, {"n": "QUESTION 2", "t": "What would be the best part of doing it alone?", "ja": "それを一人でするなら、いちばんよい点は何ですか？", "f": ["Which decision would become easier?", "What would you miss sharing with someone?"]}, {"n": "QUESTION 3", "t": "What helps some people feel comfortable doing more things alone?", "ja": "一人でもより自信を持って行動できる人がいるのはなぜですか？", "f": ["What skill makes going alone easier?", "How can one good experience build confidence?"]}, {"n": "QUESTION 4", "t": "How can a person's comfort with doing things alone change over time?", "ja": "一人で行動することへの気楽さは、時間とともにどう変わりますか？", "f": ["What experience could make going alone easier?", "What could make it feel harder again?"]}, {"n": "QUESTION 5", "t": "What small activity can prepare someone to do more things alone?", "ja": "一人でできることを増やすために、どんな小さな活動が準備になりますか？", "f": ["How could they make it feel safer?", "What would show they are ready for more?"]}, {"n": "QUESTION 6", "t": "Would you actually like to get comfortable doing it alone?", "ja": "実際に、それを一人でも平気でできるようになりたいですか？", "f": ["What would be the first small step?", "When would company still be better?"]}]}, {"n": 5, "title": "낯선 사람과 대화 시작하기", "sub": "知らない人との会話の始め方", "titles": {"ko": "낯선 사람과 대화 시작하기", "en": "Starting a conversation with a stranger", "ja": "知らない人との会話の始め方"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-people-and-ties-full/51-starting-a-conversation-with-a-stranger/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-full/51-starting-a-conversation-with-a-stranger/lecture/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/51-starting-a-conversation-with-a-stranger/lecture/index.html"}, {"href": "view/talk-people-and-ties-full/51-starting-a-conversation-with-a-stranger/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-full/51-starting-a-conversation-with-a-stranger/prestudy/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/51-starting-a-conversation-with-a-stranger/prestudy/index.html"}], "goal": {"t": "Let's build a natural opening and a graceful way out when it fails. Please read the title aloud.", "ja": "自然な会話の始め方と、続かないときの終え方について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "You're seated beside someone you've never met. How would you open the conversation?", "ja": "会ったことのない人の隣に座っています。どのように会話を始めますか？", "f": ["Which shared detail would you use?", "How would you keep the opening low-pressure?"]}, {"n": "WARM-UP 2", "t": "Where would a simple opening with a stranger feel most natural?", "ja": "知らない人への簡単な声のかけ方が、最も自然に感じるのはどこですか？", "f": ["What can both people notice in that moment?", "Where would it feel intrusive?"]}, {"n": "QUESTION 1", "t": "Which topics would you avoid with a stranger?", "ja": "知らない人との会話では、どのような話題を避けますか？", "f": ["Why might the topic feel intrusive?", "Could a different setting make it appropriate?"]}, {"n": "QUESTION 2", "t": "What makes a small talk question easy to answer?", "ja": "どんな雑談の質問なら答えやすいですか？", "f": ["Should it be general or specific?", "How can the other person give a short answer?"]}, {"n": "QUESTION 3", "t": "Which kind of opening makes a conversation die quickly?", "ja": "どのような最初の一言だと、会話がすぐ止まりますか？", "f": ["Is the problem the topic or the way it was said?", "What simple question might save the conversation?"]}, {"n": "QUESTION 4", "t": "How can you tell that a stranger wants to keep talking?", "ja": "どのような反応から、相手が本当に会話を続けたいと分かりますか？", "f": ["What can a brief answer mean?", "Which sign suggests it is time to end the conversation politely?"]}, {"n": "QUESTION 5", "t": "What can you do when a conversation starter gets no response?", "ja": "会話のきっかけに反応がなかったら、何ができますか？", "f": ["Would you try one more question?", "How would you end politely?"]}, {"n": "QUESTION 6", "t": "Which conversation starter could you actually use this week?", "ja": "今週、実際に使えそうな会話のきっかけは何ですか？", "f": ["Where could you use it?", "Which reply would give you a natural next question?"]}]}, {"n": 6, "title": "다툰 뒤 화해하는 방법", "sub": "けんかのあとの仲直りのしかた", "titles": {"ko": "다툰 뒤 화해하는 방법", "en": "How you make up after an argument", "ja": "けんかのあとの仲直りのしかた"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-people-and-ties-full/52-how-you-make-up-after-an-argument/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-full/52-how-you-make-up-after-an-argument/lecture/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/52-how-you-make-up-after-an-argument/lecture/index.html"}, {"href": "view/talk-people-and-ties-full/52-how-you-make-up-after-an-argument/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-full/52-how-you-make-up-after-an-argument/prestudy/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/52-how-you-make-up-after-an-argument/prestudy/index.html"}], "goal": {"t": "Let's talk about what fair repair after an argument requires. Please read the title aloud.", "ja": "けんかのあとに関係を公平に修復するために必要なことを話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "After an ordinary argument, who should reach out and make contact?", "ja": "普通のけんかのあと、どちらが先に連絡を始めるべきですか？", "f": ["Does reaching out first mean taking all the blame?", "What makes the first move emotionally difficult?"]}, {"n": "WARM-UP 2", "t": "How much time apart helps people talk calmly after an argument?", "ja": "対立のあと、落ち着いた会話をするためにどのくらい距離を置くとよいですか？", "f": ["How should the pause be used?", "When does distance begin to deepen the problem?"]}, {"n": "QUESTION 1", "t": "What would make a first message after an argument helpful?", "ja": "けんかのあとの最初の連絡は、どのような言葉で伝えるとよいですか？", "f": ["Should it mention the argument right away?", "How can the tone avoid sounding defensive?"]}, {"n": "QUESTION 2", "t": "What larger problem can hide behind a small argument?", "ja": "小さな口論の裏に、どんなより大きな問題が隠れていることがありますか？", "f": ["Could it be about respect, time, or responsibility?", "How could the two people talk about the real problem?"]}, {"n": "QUESTION 3", "t": "Which matters more in an apology: the words or what happens next?", "ja": "謝罪では、言葉とその後の行動のどちらが大切ですか？", "f": ["What should the apology say clearly?", "What action should follow?"]}, {"n": "QUESTION 4", "t": "Can people stay close even when one disagreement is never fully solved?", "ja": "解決しない意見の違いがあっても、関係を壊さずにいられますか？", "f": ["Which differences can people accept?", "When would they need a new rule?"]}, {"n": "QUESTION 5", "t": "When is repairing the relationship not the right goal?", "ja": "仲直りを目標にすることが適切ではないのは、どのようなときですか？", "f": ["What would need to change first?", "How can someone end contact respectfully?"]}, {"n": "QUESTION 6", "t": "What is a fair way to make up after an ordinary argument?", "ja": "普通のけんかのあと、公平に仲直りするにはどのような方法がありますか？", "f": ["Who should speak first?", "How would they know things were better?"]}]}, {"n": 7, "title": "함께 있으면 마음이 편한 사람", "sub": "一緒にいると心からくつろげる人", "titles": {"ko": "함께 있으면 마음이 편한 사람", "en": "Someone you can completely relax around", "ja": "一緒にいると心からくつろげる人"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-people-and-ties-full/53-why-some-friendships-fade/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-full/53-why-some-friendships-fade/lecture/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/53-why-some-friendships-fade/lecture/index.html"}, {"href": "view/talk-people-and-ties-full/53-why-some-friendships-fade/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-full/53-why-some-friendships-fade/prestudy/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/53-why-some-friendships-fade/prestudy/index.html"}], "goal": {"t": "Let's talk about what makes it easy to relax and be yourself around someone. Please read the title aloud.", "ja": "誰かと一緒にいるとき、気を張らずに自分らしくいられる理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Who makes it easiest for you to relax and be yourself?", "ja": "誰といると、いちばん気を張らずに自分らしくいられますか？", "f": ["What do you usually do together?", "If no one comes to mind, who makes conversation feel least tiring?"]}, {"n": "WARM-UP 2", "t": "What's something you can do around them that you wouldn't do with everyone?", "ja": "その人の前ではできても、誰の前でもできるわけではないことは何ですか？", "f": ["Can you be quiet, silly, or completely honest?", "When did you first notice that?"]}, {"n": "QUESTION 1", "t": "What makes you feel safe around them?", "ja": "その人といると安心できるのはなぜですか？", "f": ["Do they listen without judging?", "What small action shows it?"]}, {"n": "QUESTION 2", "t": "Do you need to talk, or is comfortable silence enough?", "ja": "会話が必要ですか、それとも気まずくない沈黙だけで十分ですか？", "f": ["What does a comfortable silence feel like?", "When do you still need to talk?"]}, {"n": "QUESTION 3", "t": "Has this person changed the way you see yourself?", "ja": "その人によって、自分の見方が変わったことはありますか？", "f": ["Which quality did they notice in you?", "Did that change your confidence?"]}, {"n": "QUESTION 4", "t": "Can the same person make you feel relaxed in every situation?", "ja": "同じ人でも、どんな場面でも自分をくつろがせてくれますか？", "f": ["When might the feeling change?", "How much does the setting matter?"]}, {"n": "QUESTION 5", "t": "What side of you do they bring out most?", "ja": "その人といると、自分のどんな面がいちばん出ますか？", "f": ["Is it your playful, honest, calm, or ambitious side?", "Do they see it the same way?"]}, {"n": "QUESTION 6", "t": "Now the opposite: what kind of person makes you watch every word?", "ja": "では逆に、どんな人の前では一言一言に気をつかいますか？", "f": ["What behavior makes you cautious?", "How would you end that conversation politely?"]}]}, {"n": 8, "title": "가장 많이 이야기하는 사람", "sub": "いちばんよく話す人", "titles": {"ko": "가장 많이 이야기하는 사람", "en": "The person you talk to most", "ja": "いちばんよく話す人"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-people-and-ties-full/54-the-person-you-talk-to-most/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-full/54-the-person-you-talk-to-most/lecture/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/54-the-person-you-talk-to-most/lecture/index.html"}, {"href": "view/talk-people-and-ties-full/54-the-person-you-talk-to-most/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-full/54-the-person-you-talk-to-most/prestudy/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/54-the-person-you-talk-to-most/prestudy/index.html"}], "goal": {"t": "Let's talk about how contact patterns shape our relationships. Please read the title aloud.", "ja": "連絡のしかたが人間関係に与える影響について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Who do you talk to most these days?", "ja": "最近、いちばんよく話す相手は誰ですか？", "f": ["Do you mostly talk in person or by message?", "Is it a family member, friend, coworker, or someone else?"]}, {"n": "WARM-UP 2", "t": "What do you usually talk about with them?", "ja": "その人とは、普段どんなことを話しますか？", "f": ["Is it mostly everyday updates or bigger problems?", "Which subject do you avoid?"]}, {"n": "QUESTION 1", "t": "Do you mostly exchange short messages or have long conversations?", "ja": "短いメッセージをやり取りすることと、長く話すことでは、どちらが多いですか？", "f": ["Which one keeps you closer?", "When does frequent contact feel like pressure?"]}, {"n": "QUESTION 2", "t": "What kinds of conversation make people feel closer over time?", "ja": "どのような会話が、時間をかけて関係を深めますか？", "f": ["Do deeper conversations always require personal details?", "How can ordinary daily talk build trust?"]}, {"n": "QUESTION 3", "t": "Why is one subject easy to discuss with one person but hard with another?", "ja": "同じ話題でも、相手によって話しやすさが変わるのはなぜですか？", "f": ["What topics need more trust?", "When can timing matter more than the topic?"]}, {"n": "QUESTION 4", "t": "Have they always been the person you talk to most?", "ja": "その人は、以前からいちばんよく話す相手でしたか？", "f": ["When did the pattern change?", "What brought you closer?"]}, {"n": "QUESTION 5", "t": "Who did you talk to most five years ago?", "ja": "5年前、いちばんよく話していた相手は誰ですか？", "f": ["Why did that person matter then?", "Do you still keep in touch?"]}, {"n": "QUESTION 6", "t": "If you couldn't talk often, what would help you stay close?", "ja": "あまり話せなくなったら、親しさを保つために何が役立ちますか？", "f": ["What kind of contact would matter most?", "How long could the silence last without feeling awkward?"]}]}, {"n": 9, "title": "마음에 남은 조언", "sub": "心に残っている助言", "titles": {"ko": "마음에 남은 조언", "en": "Advice that stayed with you", "ja": "心に残っている助言"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-people-and-ties-full/55-advice-that-stayed-with-you/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-full/55-advice-that-stayed-with-you/lecture/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/55-advice-that-stayed-with-you/lecture/index.html"}, {"href": "view/talk-people-and-ties-full/55-advice-that-stayed-with-you/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-full/55-advice-that-stayed-with-you/prestudy/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/55-advice-that-stayed-with-you/prestudy/index.html"}], "goal": {"t": "Let's talk about why some advice stays with people and deserves to be shared. Please read the title aloud.", "ja": "心に残る助言と、それを人に伝える価値について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one piece of advice you still remember?", "ja": "今でも覚えている助言を一つ挙げるとしたら、何ですか？", "f": ["Was it about work, school, relationships, or daily life?", "If none comes to mind, what common advice have you heard often?"]}, {"n": "WARM-UP 2", "t": "What exact words do you remember?", "ja": "どんな言葉だったか、具体的に覚えていますか？", "f": ["If not, what was the main idea?", "Why was the wording easy to remember?"]}, {"n": "QUESTION 1", "t": "Who gave you that advice?", "ja": "その助言は、誰からもらいましたか？", "f": ["Why did you trust that person?", "Would the same advice feel different from someone else?"]}, {"n": "QUESTION 2", "t": "When did the advice start to make sense?", "ja": "その助言が納得できるようになったのは、いつですか？", "f": ["Did it arrive before you were ready?", "What changed later?"]}, {"n": "QUESTION 3", "t": "Would you still follow that advice today?", "ja": "今でも、その助言に従いますか？", "f": ["Which part still fits?", "What has changed?"]}, {"n": "QUESTION 4", "t": "When might that advice stop being useful?", "ja": "その助言が役に立たなくなるのは、どんなときですか？", "f": ["Which situation would not fit it?", "Could the advice be adjusted?"]}, {"n": "QUESTION 5", "t": "Would you pass it on to someone else?", "ja": "その助言を、ほかの人にも伝えたいですか？", "f": ["Who might benefit from it?", "How could you share it without sounding controlling?"]}, {"n": "QUESTION 6", "t": "Now the opposite: what's a common piece of advice you don't agree with?", "ja": "では逆に、よく聞くけれど賛成できない助言は何ですか？", "f": ["Why does it not work for everyone?", "Could it still help in one situation?"]}]}, {"n": 10, "title": "위급할 때 전화할 사람", "sub": "緊急時に電話する人", "titles": {"ko": "위급할 때 전화할 사람", "en": "The person you would call in an emergency", "ja": "緊急時に電話する人"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-people-and-ties-full/56-the-person-you-would-call-in-an-emergency/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-full/56-the-person-you-would-call-in-an-emergency/lecture/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/56-the-person-you-would-call-in-an-emergency/lecture/index.html"}, {"href": "view/talk-people-and-ties-full/56-the-person-you-would-call-in-an-emergency/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-full/56-the-person-you-would-call-in-an-emergency/prestudy/index.html", "source": "courses/en/talk-people-and-ties-full/lessons/56-the-person-you-would-call-in-an-emergency/prestudy/index.html"}], "goal": {"t": "Let's talk about practical support and a reliable emergency network. Please read the title aloud.", "ja": "実際に役立つ支えと、信頼できる緊急時の支援体制について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Away from home, if you lost your phone and wallet, who would you contact first?", "ja": "外出先で携帯電話と財布をなくしたら、まず誰に連絡しようとしますか？", "f": ["How could you reach them without your phone?", "When would you contact a professional service first?"]}, {"n": "WARM-UP 2", "t": "Why would you choose that person?", "ja": "なぜ、その人を選びますか？", "f": ["Are they calm, practical, nearby, or something else?", "What could they do first?"]}, {"n": "QUESTION 1", "t": "What would you say first once you reached them?", "ja": "連絡がついたら、最初に何を伝えますか？", "f": ["Which location detail would matter?", "How briefly could you explain the problem?"]}, {"n": "QUESTION 2", "t": "What kind of emergency would make you call someone else?", "ja": "どんな緊急事態なら、別の人に連絡しますか？", "f": ["Would you call a professional service or another trusted person?", "What different help would you need?"]}, {"n": "QUESTION 3", "t": "When should you call emergency services before someone you know?", "ja": "知り合いより先に、緊急サービスへ連絡すべきなのはどんなときですか？", "f": ["What is one clear example?", "Who would you contact after help was on the way?"]}, {"n": "QUESTION 4", "t": "Has your first-choice contact changed over time?", "ja": "最初に連絡したい相手は、以前と変わりましたか？", "f": ["Who would you have called before?", "What caused the change?"]}, {"n": "QUESTION 5", "t": "Would you still call them if they lived far away?", "ja": "その人が遠くに住んでいても、連絡しますか？", "f": ["What help could they give from a distance?", "Who could help nearby?"]}, {"n": "QUESTION 6", "t": "Does that person know you'd call them in an emergency?", "ja": "その人は、緊急時に自分が連絡するつもりだと知っていますか？", "f": ["Should you tell them?", "Who would be your backup contact?"]}]}]}, {"no": 11, "label": "11코스", "title": "연애와 결혼", "titles": {"ko": "연애와 결혼", "en": "Love and marriage", "ja": "恋愛と結婚"}, "subtitle": "(中級) 恋愛と結婚", "desc": {"ko": "민감도를 조절하며 연애와 결혼 경험·생각을 말한다.", "en": "Talk about love and marriage — what you have lived and what you think — dialling the sensitivity as you go.", "ja": "踏み込む深さを調節しながら、恋愛と結婚の経験や考えを話す。"}, "cover": "covers/talk-love-and-marriage-accessible.webp", "levels": ["B1"], "level": "B1", "slug": "talk-love-and-marriage-accessible", "lessons": [{"n": 1, "title": "누군가를 좋아하게 만드는 작은 것", "sub": "人を好きになる小さなきっかけ", "titles": {"ko": "누군가를 좋아하게 만드는 작은 것", "en": "A little thing that makes you like someone", "ja": "人を好きになる小さなきっかけ"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-love-and-marriage-accessible/57-a-little-thing-that-makes-you-like-someone/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-love-and-marriage-accessible/57-a-little-thing-that-makes-you-like-someone/lecture/index.html", "source": "courses/en/talk-love-and-marriage-accessible/lessons/57-a-little-thing-that-makes-you-like-someone/lecture/index.html"}, {"href": "view/talk-love-and-marriage-accessible/57-a-little-thing-that-makes-you-like-someone/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-love-and-marriage-accessible/57-a-little-thing-that-makes-you-like-someone/prestudy/index.html", "source": "courses/en/talk-love-and-marriage-accessible/lessons/57-a-little-thing-that-makes-you-like-someone/prestudy/index.html"}], "goal": {"t": "Let's talk about a small quality or gesture that can make someone appealing. Please read the title aloud.", "ja": "人を魅力的に感じる小さな特徴や行動について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What small gesture or quality makes someone more attractive to you?", "ja": "どんな小さな行動や特徴が、その人をより魅力的に感じさせますか？", "f": ["When do you notice it most?", "Why do you like it?"]}, {"n": "WARM-UP 2", "t": "What can a small kind gesture suggest about a person?", "ja": "小さな親切から、その人のどんな人柄が感じられますか？", "f": ["Which quality could it show?", "What else would you want to see before judging?"]}, {"n": "QUESTION 1", "t": "Would you tell someone about a small quality you quietly find attractive?", "ja": "その人のさりげない特徴に魅力を感じると、本人に伝えますか？", "f": ["What would make the compliment feel genuine?", "Which situation could make it uncomfortable?"]}, {"n": "QUESTION 2", "t": "Where does kindness show most clearly: at home, at work, or with strangers?", "ja": "親切が最もはっきり表れるのは、家、職場、知らない人との場面のどこですか？", "f": ["Which action would show kindness there?", "Who would notice the benefit first?"]}, {"n": "QUESTION 3", "t": "After you get to know someone, which matters more: looks or everyday behavior?", "ja": "相手を知ってからは、見た目と日頃の行動のどちらが大切ですか？", "f": ["Which one matters more at first?", "What habit could change your opinion?"]}, {"n": "QUESTION 4", "t": "When can a charming habit start to feel annoying?", "ja": "魅力的な癖が、うっとうしく感じ始めるのはどんなときですか？", "f": ["Would a good intention change how the habit feels?", "What repeated behaviour could make it irritating?"]}, {"n": "QUESTION 5", "t": "How have age and experience changed which small qualities you value?", "ja": "年齢や経験によって、大切に感じるさりげない特徴はどう変わりましたか？", "f": ["What matters more to you now?", "Which preference has stayed the same?"]}, {"n": "QUESTION 6", "t": "Which small quality would you be glad to have someone notice in you?", "ja": "自分のどんなさりげない特徴に気づいてもらえたら、うれしいですか？", "f": ["How would people notice it in daily life?", "Would you want them to mention it?"]}]}, {"n": 2, "title": "관계를 끝내게 하는 한마디", "sub": "関係を終わらせる決定的な一言", "titles": {"ko": "관계를 끝내게 하는 한마디", "en": "A relationship deal-breaker", "ja": "関係を終わらせる決定的な一言"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-love-and-marriage-accessible/58-a-relationship-deal-breaker/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-love-and-marriage-accessible/58-a-relationship-deal-breaker/lecture/index.html", "source": "courses/en/talk-love-and-marriage-accessible/lessons/58-a-relationship-deal-breaker/lecture/index.html"}, {"href": "view/talk-love-and-marriage-accessible/58-a-relationship-deal-breaker/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-love-and-marriage-accessible/58-a-relationship-deal-breaker/prestudy/index.html", "source": "courses/en/talk-love-and-marriage-accessible/lessons/58-a-relationship-deal-breaker/prestudy/index.html"}], "goal": {"t": "Let's talk about words that can cross a serious relationship boundary. Please read the title aloud.", "ja": "人間関係の重大な境界線を越える言葉について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which does more damage to trust: a lie, a cruel comment, or a broken promise?", "ja": "うそ、ひどい発言、破られた約束の中で、信頼を最も傷つけるのはどれですか？", "f": ["Why does that one carry the most weight?", "Could the context change your answer?"]}, {"n": "WARM-UP 2", "t": "Can one terrible comment be a deal-breaker, or does a repeated pattern matter more?", "ja": "一度のひどい発言が関係を終わらせる決定打になりますか、それとも、繰り返される行動のほうが重要ですか？", "f": ["What could make one comment impossible to ignore?", "When does a pattern become clearer than a single moment?"]}, {"n": "QUESTION 1", "t": "What makes an apology feel genuine?", "ja": "謝罪が本心からのものだと感じられるのは、どんなときですか？", "f": ["How much do the exact words matter?", "What change would need to follow?"]}, {"n": "QUESTION 2", "t": "When is taking a break from an argument healthier than continuing it?", "ja": "口論を続けるより、いったん離れるほうが健全なのはどんなときですか？", "f": ["What signs show that the conversation is no longer useful?", "How can the break avoid feeling like punishment?"]}, {"n": "QUESTION 3", "t": "What should never be used as a weapon in an argument?", "ja": "口論の中で、決して攻撃の材料にしてはいけないことは何ですか？", "f": ["Why would using it cause lasting harm?", "How could the same concern be raised fairly?"]}, {"n": "QUESTION 4", "t": "What would real repair look like after someone crosses a serious line?", "ja": "重大な一線を越えた後、本当の関係修復とはどのようなものですか？", "f": ["Which action would matter more than another promise?", "How would both people know that trust is returning?"]}, {"n": "QUESTION 5", "t": "How can someone set a firm boundary without making a threat?", "ja": "脅しにせず、はっきりと境界線を示すにはどうすればよいですか？", "f": ["What wording keeps the focus on the boundary?", "Which choice should the other person still have?"]}, {"n": "QUESTION 6", "t": "What's one green flag that tells you a relationship is safe?", "ja": "人間関係が安心できると分かるよいサインを一つ挙げるとしたら何ですか？", "f": ["Which everyday action makes the sign visible?", "How does it help both people handle conflict?"]}]}, {"n": 3, "title": "내가 정말 즐길 수 있는 데이트", "sub": "自分が本当に楽しめるデート", "titles": {"ko": "내가 정말 즐길 수 있는 데이트", "en": "A date you would actually enjoy", "ja": "自分が本当に楽しめるデート"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-love-and-marriage-accessible/59-something-you-could-never-compromise-on-in-a-partner/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-love-and-marriage-accessible/59-something-you-could-never-compromise-on-in-a-partner/lecture/index.html", "source": "courses/en/talk-love-and-marriage-accessible/lessons/59-something-you-could-never-compromise-on-in-a-partner/lecture/index.html"}, {"href": "view/talk-love-and-marriage-accessible/59-something-you-could-never-compromise-on-in-a-partner/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-love-and-marriage-accessible/59-something-you-could-never-compromise-on-in-a-partner/prestudy/index.html", "source": "courses/en/talk-love-and-marriage-accessible/lessons/59-something-you-could-never-compromise-on-in-a-partner/prestudy/index.html"}], "goal": {"t": "Let's design a date that would feel enjoyable, relaxed, and right for you. Please read the title aloud.", "ja": "自分にとって楽しく、気楽に過ごせるデートについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which sounds better for a first date: coffee, a meal, a walk, or an activity?", "ja": "初デートなら、コーヒー、食事、散歩、何かの体験のどれがよいですか？", "f": ["Why does that one suit you?", "Which option would you least enjoy?"]}, {"n": "WARM-UP 2", "t": "What would make that date feel relaxed rather than awkward?", "ja": "そのデートが気まずくならず、くつろげるものになるには何が必要ですか？", "f": ["How much do the place and noise level matter?", "What would help in the first ten minutes?"]}, {"n": "QUESTION 1", "t": "Would you rather talk the whole time or have an activity to focus on?", "ja": "ずっと話すのと、何かの活動をしながら過ごすのでは、どちらがよいですか？", "f": ["Which activity would make conversation easier?", "Why might constant conversation feel tiring?"]}, {"n": "QUESTION 2", "t": "Would you want the other person to plan everything, or decide together?", "ja": "相手に全部計画してほしいですか、それとも一緒に決めたいですか？", "f": ["Which part would you happily leave to them?", "Which choice would you want to make yourself?"]}, {"n": "QUESTION 3", "t": "What's one small detail that could make the date memorable?", "ja": "デートを心に残るものにする小さな工夫は何ですか？", "f": ["Could it be inexpensive?", "How could it show that the person paid attention?"]}, {"n": "QUESTION 4", "t": "What would make you want to end the date early?", "ja": "何があったら、デートを早く切り上げたくなりますか？", "f": ["Is there a difference between a red flag and no chemistry?", "How would you leave politely?"]}, {"n": "QUESTION 5", "t": "Does a good date need romance, or can it simply be fun?", "ja": "よいデートにはロマンチックさが必要ですか、それとも楽しいだけでもよいですか？", "f": ["What feels romantic to you?", "When is having fun enough?"]}, {"n": "QUESTION 6", "t": "Now the opposite: what popular date idea would be terrible for you?", "ja": "では逆に、人気はあっても自分には最悪だと思うデート案は何ですか？", "f": ["Would crowds, cost, or the activity be the problem?", "What would you choose instead?"]}]}, {"n": 4, "title": "고쳐야 한다고 아는 연애 습관", "sub": "直したほうがよいと分かっている恋愛の癖", "titles": {"ko": "고쳐야 한다고 아는 연애 습관", "en": "A relationship habit you know you should change", "ja": "直したほうがよいと分かっている恋愛の癖"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-love-and-marriage-accessible/60-a-relationship-habit-you-know-you-should-change/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-love-and-marriage-accessible/60-a-relationship-habit-you-know-you-should-change/lecture/index.html", "source": "courses/en/talk-love-and-marriage-accessible/lessons/60-a-relationship-habit-you-know-you-should-change/lecture/index.html"}, {"href": "view/talk-love-and-marriage-accessible/60-a-relationship-habit-you-know-you-should-change/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-love-and-marriage-accessible/60-a-relationship-habit-you-know-you-should-change/prestudy/index.html", "source": "courses/en/talk-love-and-marriage-accessible/lessons/60-a-relationship-habit-you-know-you-should-change/prestudy/index.html"}], "goal": {"t": "Let's talk about relationship habits and how people can change them. Please read the title aloud.", "ja": "人間関係の癖と、それを変える方法について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one relationship habit you'd like to get better at?", "ja": "人間関係で、もっと改善したい自分の癖は何ですか？", "f": ["Is it avoiding hard talks, overthinking messages, interrupting, or something else?", "Why would you like to change it?"]}, {"n": "WARM-UP 2", "t": "When does that habit show up most often?", "ja": "その癖が最も出やすいのは、どんなときですか？", "f": ["Does stress, conflict, or messaging bring it out?", "What is the first sign?"]}, {"n": "QUESTION 1", "t": "How could someone point it out without making you defensive?", "ja": "自分が身構えずに受け止められるように、その癖をどう指摘してもらいたいですか？", "f": ["Which exact behavior should they mention?", "When would the conversation go best?"]}, {"n": "QUESTION 2", "t": "What could you do instead?", "ja": "代わりに、どんな行動ができますか？", "f": ["What is the smallest realistic response?", "What could remind you in the moment?"]}, {"n": "QUESTION 3", "t": "How might that habit affect the other person?", "ja": "その癖は、相手にどんな影響を与えるかもしれませんか？", "f": ["What might they assume?", "What might they need from you instead?"]}, {"n": "QUESTION 4", "t": "When does explaining the habit start to sound like an excuse?", "ja": "その癖の説明が、言い訳に聞こえ始めるのはどんなときですか？", "f": ["What responsibility still belongs to you?", "What action would make the explanation believable?"]}, {"n": "QUESTION 5", "t": "What might make you fall back into the habit?", "ja": "何があると、その癖に戻ってしまいそうですか？", "f": ["Does stress or tiredness make it harder?", "How could you notice it earlier?"]}, {"n": "QUESTION 6", "t": "Now the opposite: what's one healthy habit you already bring to relationships?", "ja": "では逆に、人間関係ですでにできているよい習慣は何ですか？", "f": ["How does it appear in daily life?", "Why might other people overlook it?"]}]}, {"n": 5, "title": "내 결혼식에 꼭 있어야 할 한 가지", "sub": "自分の結婚式に欠かせない一つのこと", "titles": {"ko": "내 결혼식에 꼭 있어야 할 한 가지", "en": "One thing your wedding would have to include", "ja": "自分の結婚式に欠かせない一つのこと"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-love-and-marriage-accessible/61-one-thing-your-wedding-would-have-to-include/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-love-and-marriage-accessible/61-one-thing-your-wedding-would-have-to-include/lecture/index.html", "source": "courses/en/talk-love-and-marriage-accessible/lessons/61-one-thing-your-wedding-would-have-to-include/lecture/index.html"}, {"href": "view/talk-love-and-marriage-accessible/61-one-thing-your-wedding-would-have-to-include/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-love-and-marriage-accessible/61-one-thing-your-wedding-would-have-to-include/prestudy/index.html", "source": "courses/en/talk-love-and-marriage-accessible/lessons/61-one-thing-your-wedding-would-have-to-include/prestudy/index.html"}], "goal": {"t": "Let's talk about what can make a wedding meaningful. Please read the title aloud.", "ja": "結婚式を意味のあるものにする要素について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "If you had a wedding tomorrow, what one thing would have to be there?", "ja": "もし明日結婚式を開くなら、どの一つの要素が必須ですか？", "f": ["How would guests notice that element?", "Which family member might value it too?"]}, {"n": "WARM-UP 2", "t": "Which wedding tradition would you definitely keep?", "ja": "結婚式の習慣の中で、絶対に残したいものはどれですか？", "f": ["Why does it matter to you?", "How would you make it fit the couple?"]}, {"n": "QUESTION 1", "t": "If one common wedding tradition had to go, which would you choose?", "ja": "よくある結婚式の習慣を一つなくすなら、どれを選びますか？", "f": ["Which source of stress would disappear?", "Would the couple, family, or guests miss it most?"]}, {"n": "QUESTION 2", "t": "How should a couple and their families share wedding decisions?", "ja": "結婚式の決定権は、二人と家族の間でどう分けるべきですか？", "f": ["Which decision could legitimately involve family?", "Which choice should remain private to the couple?"]}, {"n": "QUESTION 3", "t": "What makes one wedding detail truly memorable?", "ja": "結婚式の一つの演出を本当に心に残るものにするのは、どんな特徴ですか？", "f": ["Could the element feel special without costing much?", "How would it work with only a few guests?"]}, {"n": "QUESTION 4", "t": "What part of a wedding creates the most unnecessary stress?", "ja": "結婚式で、いちばん余計なストレスを生むのはどの部分ですか？", "f": ["Who carries most of that stress?", "Which one change would lower it fastest?"]}, {"n": "QUESTION 5", "t": "Can a private ceremony feel more personal than a large public celebration?", "ja": "私的な式のほうが、大規模な公の祝いより個人的に感じられますか？", "f": ["What would become easier at a private ceremony?", "Which part of a large celebration would be hardest to give up?"]}, {"n": "QUESTION 6", "t": "What should be the main purpose of a wedding?", "ja": "結婚式を開く人たちにとって、どんな中心的な目的が式を導くべきですか？", "f": ["Should the couple, the families, or the guests come first?", "Which wedding decision would make that priority visible?"]}]}, {"n": 6, "title": "극복하기 힘들었던 이별", "sub": "立ち直るのが難しかった別れ", "titles": {"ko": "극복하기 힘들었던 이별", "en": "A breakup that was hard to get over", "ja": "立ち直るのが難しかった別れ"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-love-and-marriage-accessible/62-a-breakup-that-was-hard-to-get-over/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-love-and-marriage-accessible/62-a-breakup-that-was-hard-to-get-over/lecture/index.html", "source": "courses/en/talk-love-and-marriage-accessible/lessons/62-a-breakup-that-was-hard-to-get-over/lecture/index.html"}, {"href": "view/talk-love-and-marriage-accessible/62-a-breakup-that-was-hard-to-get-over/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-love-and-marriage-accessible/62-a-breakup-that-was-hard-to-get-over/prestudy/index.html", "source": "courses/en/talk-love-and-marriage-accessible/lessons/62-a-breakup-that-was-hard-to-get-over/prestudy/index.html"}], "goal": {"t": "Let's talk about why breakups can be difficult and what helps people recover. Please read the title aloud.", "ja": "別れが難しい理由と、立ち直るために役立つことを話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Why can some breakups be especially hard to get over?", "ja": "なぜ、立ち直るのが特に難しい別れがあるのでしょうか？", "f": ["Which shared plan, place, or routine also disappears?", "What part of the changed future may take longest to accept?"]}, {"n": "WARM-UP 2", "t": "What change after a breakup can be hardest to get used to?", "ja": "別れのあと、どの変化に慣れるのが最も難しいですか？", "f": ["What is the first everyday habit that usually changes?", "Which practical change can catch people by surprise?"]}, {"n": "QUESTION 1", "t": "What affects how quickly someone recovers after a breakup?", "ja": "関係が終わった後、回復の速さを左右するのはどんな要因ですか？", "f": ["Does the way the relationship ended affect recovery?", "Which everyday sign would show that life is moving forward?"]}, {"n": "QUESTION 2", "t": "After a breakup, which moments call for time alone and which call for company?", "ja": "別れのあと、どんなときは一人の時間が必要で、どんなときは誰かといるほうがよいですか？", "f": ["What can time alone provide?", "What kind of company would help?"]}, {"n": "QUESTION 3", "t": "What genuinely helps someone start recovering after a breakup?", "ja": "難しい別れから本当の意味で回復し始めるには、何が役立ちますか？", "f": ["Is useful support mainly emotional or practical?", "Which familiar response can make recovery harder?"]}, {"n": "QUESTION 4", "t": "What can someone understand about a breakup only much later?", "ja": "別れから十分に距離を置いて初めて見える事実は何ですか？", "f": ["Which part of the relationship becomes easier to understand later?", "Can time make someone blame one person too much?"]}, {"n": "QUESTION 5", "t": "What kind-sounding breakup advice can actually feel uncaring?", "ja": "善意からの別れへの反応の中で、支えより軽視と感じられるのは何ですか？", "f": ["Why might that advice sound uncaring?", "Which kinder sentence could replace it?"]}, {"n": "QUESTION 6", "t": "What is one sign that someone is moving forward after a breakup?", "ja": "別れのあと、前に進んでいると分かるサインは一つ何ですか？", "f": ["Would close friends notice the sign before the person did?", "Which difficulty could reasonably remain?"]}]}, {"n": 7, "title": "결혼이나 출산을 선택하지 않는 것", "sub": "結婚や子どもを持たない選択", "titles": {"ko": "결혼이나 출산을 선택하지 않는 것", "en": "Choosing not to marry or have children", "ja": "結婚や子どもを持たない選択"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-love-and-marriage-accessible/63-choosing-not-to-marry-or-have-children/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-love-and-marriage-accessible/63-choosing-not-to-marry-or-have-children/lecture/index.html", "source": "courses/en/talk-love-and-marriage-accessible/lessons/63-choosing-not-to-marry-or-have-children/lecture/index.html"}, {"href": "view/talk-love-and-marriage-accessible/63-choosing-not-to-marry-or-have-children/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-love-and-marriage-accessible/63-choosing-not-to-marry-or-have-children/prestudy/index.html", "source": "courses/en/talk-love-and-marriage-accessible/lessons/63-choosing-not-to-marry-or-have-children/prestudy/index.html"}], "goal": {"t": "Let's talk about different choices around marriage and children. Please read the title aloud.", "ja": "結婚や子どもについてのさまざまな選択を話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which feels like the bigger life decision: marriage or having children?", "ja": "結婚と子どもを持つことでは、どちらのほうが大きな人生の決断だと思いますか？", "f": ["Why does that choice feel bigger?", "When should the two decisions be considered separately?"]}, {"n": "WARM-UP 2", "t": "What feels biggest about that decision: daily life, money, freedom, or responsibility?", "ja": "その決断でいちばん大きいのは、日々の暮らし、お金、自由、責任のどれですか？", "f": ["Which part is easiest to imagine?", "Which part do people underestimate?"]}, {"n": "QUESTION 1", "t": "What might make someone want marriage but not children?", "ja": "結婚はしたいけれど、子どもは望まない人には、どんな理由がありそうですか？", "f": ["Could freedom, health, or responsibility matter?", "How might a partner's wishes affect the choice?"]}, {"n": "QUESTION 2", "t": "What might make someone want children but not marriage?", "ja": "子どもは望むけれど、結婚は望まない人には、どんな理由がありそうですか？", "f": ["What kind of support would they need?", "How would daily life differ?"]}, {"n": "QUESTION 3", "t": "How much should family opinions matter in these decisions?", "ja": "こうした決断に、家族の意見はどのくらい影響してよいと思いますか？", "f": ["When does concern become pressure?", "Which question should relatives avoid?"]}, {"n": "QUESTION 4", "t": "Which should matter more: what you want now or what you might want later?", "ja": "今の希望と、将来気が変わる可能性では、どちらを大切にすべきですか？", "f": ["Is \"I haven't decided\" a complete answer?", "What information could help someone decide?"]}, {"n": "QUESTION 5", "t": "What could make someone change their mind about marriage or children?", "ja": "結婚や子どもについて、人の考えが変わるきっかけは何だと思いますか？", "f": ["Could money, health, or a relationship change it?", "Is changing one's mind a problem?"]}, {"n": "QUESTION 6", "t": "Imagine your ideal life ten years from now. Who is part of it?", "ja": "10年後の理想の暮らしを想像してください。そこには誰がいますか？", "f": ["What does an ordinary day look like?", "Which part of that life matters most?"]}]}]}, {"no": 12, "label": "12코스", "title": "연애와 결혼", "titles": {"ko": "연애와 결혼", "en": "Love and marriage", "ja": "恋愛と結婚"}, "subtitle": "(上級) 恋愛と結婚", "desc": {"ko": "민감도를 조절하며 연애와 결혼 경험·생각을 말한다.", "en": "Talk about love and marriage — what you have lived and what you think — dialling the sensitivity as you go.", "ja": "踏み込む深さを調節しながら、恋愛と結婚の経験や考えを話す。"}, "cover": "covers/talk-love-and-marriage-full.webp", "levels": ["C1"], "level": "C1", "slug": "talk-love-and-marriage-full", "lessons": [{"n": 1, "title": "누군가를 좋아하게 만드는 작은 것", "sub": "人を好きになる小さなきっかけ", "titles": {"ko": "누군가를 좋아하게 만드는 작은 것", "en": "A little thing that makes you like someone", "ja": "人を好きになる小さなきっかけ"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-love-and-marriage-full/57-a-little-thing-that-makes-you-like-someone/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-love-and-marriage-full/57-a-little-thing-that-makes-you-like-someone/lecture/index.html", "source": "courses/en/talk-love-and-marriage-full/lessons/57-a-little-thing-that-makes-you-like-someone/lecture/index.html"}, {"href": "view/talk-love-and-marriage-full/57-a-little-thing-that-makes-you-like-someone/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-love-and-marriage-full/57-a-little-thing-that-makes-you-like-someone/prestudy/index.html", "source": "courses/en/talk-love-and-marriage-full/lessons/57-a-little-thing-that-makes-you-like-someone/prestudy/index.html"}], "goal": {"t": "Let's talk about a small quality or gesture that can make someone appealing. Please read the title aloud.", "ja": "人を魅力的に感じる小さな特徴や行動について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What small gesture or quality makes someone more attractive to you?", "ja": "どんな小さな行動や特徴が、その人をより魅力的に感じさせますか？", "f": ["When do you notice it most?", "Why do you like it?"]}, {"n": "WARM-UP 2", "t": "What can a small kind gesture suggest about a person?", "ja": "小さな親切から、その人のどんな人柄が感じられますか？", "f": ["Which quality could it show?", "What else would you want to see before judging?"]}, {"n": "QUESTION 1", "t": "Would you tell someone about a small quality you quietly find attractive?", "ja": "その人のさりげない特徴に魅力を感じると、本人に伝えますか？", "f": ["What would make the compliment feel genuine?", "Which situation could make it uncomfortable?"]}, {"n": "QUESTION 2", "t": "Where does kindness show most clearly: at home, at work, or with strangers?", "ja": "親切が最もはっきり表れるのは、家、職場、知らない人との場面のどこですか？", "f": ["Which action would show kindness there?", "Who would notice the benefit first?"]}, {"n": "QUESTION 3", "t": "After you get to know someone, which matters more: looks or everyday behavior?", "ja": "相手を知ってからは、見た目と日頃の行動のどちらが大切ですか？", "f": ["Which one matters more at first?", "What habit could change your opinion?"]}, {"n": "QUESTION 4", "t": "When can a charming habit start to feel annoying?", "ja": "魅力的な癖が、うっとうしく感じ始めるのはどんなときですか？", "f": ["Would a good intention change how the habit feels?", "What repeated behaviour could make it irritating?"]}, {"n": "QUESTION 5", "t": "How have age and experience changed which small qualities you value?", "ja": "年齢や経験によって、大切に感じるさりげない特徴はどう変わりましたか？", "f": ["What matters more to you now?", "Which preference has stayed the same?"]}, {"n": "QUESTION 6", "t": "Which small quality would you be glad to have someone notice in you?", "ja": "自分のどんなさりげない特徴に気づいてもらえたら、うれしいですか？", "f": ["How would people notice it in daily life?", "Would you want them to mention it?"]}]}, {"n": 2, "title": "관계를 끝내게 하는 한마디", "sub": "関係を終わらせる決定的な一言", "titles": {"ko": "관계를 끝내게 하는 한마디", "en": "A relationship deal-breaker", "ja": "関係を終わらせる決定的な一言"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-love-and-marriage-full/58-a-relationship-deal-breaker/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-love-and-marriage-full/58-a-relationship-deal-breaker/lecture/index.html", "source": "courses/en/talk-love-and-marriage-full/lessons/58-a-relationship-deal-breaker/lecture/index.html"}, {"href": "view/talk-love-and-marriage-full/58-a-relationship-deal-breaker/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-love-and-marriage-full/58-a-relationship-deal-breaker/prestudy/index.html", "source": "courses/en/talk-love-and-marriage-full/lessons/58-a-relationship-deal-breaker/prestudy/index.html"}], "goal": {"t": "Let's talk about words that can cross a serious relationship boundary. Please read the title aloud.", "ja": "人間関係の重大な境界線を越える言葉について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which does more damage to trust: a lie, a cruel comment, or a broken promise?", "ja": "うそ、ひどい発言、破られた約束の中で、信頼を最も傷つけるのはどれですか？", "f": ["Why does that one carry the most weight?", "Could the context change your answer?"]}, {"n": "WARM-UP 2", "t": "Can one terrible comment be a deal-breaker, or does a repeated pattern matter more?", "ja": "一度のひどい発言が関係を終わらせる決定打になりますか、それとも、繰り返される行動のほうが重要ですか？", "f": ["What could make one comment impossible to ignore?", "When does a pattern become clearer than a single moment?"]}, {"n": "QUESTION 1", "t": "What makes an apology feel genuine?", "ja": "謝罪が本心からのものだと感じられるのは、どんなときですか？", "f": ["How much do the exact words matter?", "What change would need to follow?"]}, {"n": "QUESTION 2", "t": "When is taking a break from an argument healthier than continuing it?", "ja": "口論を続けるより、いったん離れるほうが健全なのはどんなときですか？", "f": ["What signs show that the conversation is no longer useful?", "How can the break avoid feeling like punishment?"]}, {"n": "QUESTION 3", "t": "What should never be used as a weapon in an argument?", "ja": "口論の中で、決して攻撃の材料にしてはいけないことは何ですか？", "f": ["Why would using it cause lasting harm?", "How could the same concern be raised fairly?"]}, {"n": "QUESTION 4", "t": "What would real repair look like after someone crosses a serious line?", "ja": "重大な一線を越えた後、本当の関係修復とはどのようなものですか？", "f": ["Which action would matter more than another promise?", "How would both people know that trust is returning?"]}, {"n": "QUESTION 5", "t": "How can someone set a firm boundary without making a threat?", "ja": "脅しにせず、はっきりと境界線を示すにはどうすればよいですか？", "f": ["What wording keeps the focus on the boundary?", "Which choice should the other person still have?"]}, {"n": "QUESTION 6", "t": "What's one green flag that tells you a relationship is safe?", "ja": "人間関係が安心できると分かるよいサインを一つ挙げるとしたら何ですか？", "f": ["Which everyday action makes the sign visible?", "How does it help both people handle conflict?"]}]}, {"n": 3, "title": "내가 정말 즐길 수 있는 데이트", "sub": "自分が本当に楽しめるデート", "titles": {"ko": "내가 정말 즐길 수 있는 데이트", "en": "A date you would actually enjoy", "ja": "自分が本当に楽しめるデート"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-love-and-marriage-full/59-something-you-could-never-compromise-on-in-a-partner/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-love-and-marriage-full/59-something-you-could-never-compromise-on-in-a-partner/lecture/index.html", "source": "courses/en/talk-love-and-marriage-full/lessons/59-something-you-could-never-compromise-on-in-a-partner/lecture/index.html"}, {"href": "view/talk-love-and-marriage-full/59-something-you-could-never-compromise-on-in-a-partner/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-love-and-marriage-full/59-something-you-could-never-compromise-on-in-a-partner/prestudy/index.html", "source": "courses/en/talk-love-and-marriage-full/lessons/59-something-you-could-never-compromise-on-in-a-partner/prestudy/index.html"}], "goal": {"t": "Let's design a date that would feel enjoyable, relaxed, and right for you. Please read the title aloud.", "ja": "自分にとって楽しく、気楽に過ごせるデートについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which sounds better for a first date: coffee, a meal, a walk, or an activity?", "ja": "初デートなら、コーヒー、食事、散歩、何かの体験のどれがよいですか？", "f": ["Why does that one suit you?", "Which option would you least enjoy?"]}, {"n": "WARM-UP 2", "t": "What would make that date feel relaxed rather than awkward?", "ja": "そのデートが気まずくならず、くつろげるものになるには何が必要ですか？", "f": ["How much do the place and noise level matter?", "What would help in the first ten minutes?"]}, {"n": "QUESTION 1", "t": "Would you rather talk the whole time or have an activity to focus on?", "ja": "ずっと話すのと、何かの活動をしながら過ごすのでは、どちらがよいですか？", "f": ["Which activity would make conversation easier?", "Why might constant conversation feel tiring?"]}, {"n": "QUESTION 2", "t": "Would you want the other person to plan everything, or decide together?", "ja": "相手に全部計画してほしいですか、それとも一緒に決めたいですか？", "f": ["Which part would you happily leave to them?", "Which choice would you want to make yourself?"]}, {"n": "QUESTION 3", "t": "What's one small detail that could make the date memorable?", "ja": "デートを心に残るものにする小さな工夫は何ですか？", "f": ["Could it be inexpensive?", "How could it show that the person paid attention?"]}, {"n": "QUESTION 4", "t": "What would make you want to end the date early?", "ja": "何があったら、デートを早く切り上げたくなりますか？", "f": ["Is there a difference between a red flag and no chemistry?", "How would you leave politely?"]}, {"n": "QUESTION 5", "t": "Does a good date need romance, or can it simply be fun?", "ja": "よいデートにはロマンチックさが必要ですか、それとも楽しいだけでもよいですか？", "f": ["What feels romantic to you?", "When is having fun enough?"]}, {"n": "QUESTION 6", "t": "Now the opposite: what popular date idea would be terrible for you?", "ja": "では逆に、人気はあっても自分には最悪だと思うデート案は何ですか？", "f": ["Would crowds, cost, or the activity be the problem?", "What would you choose instead?"]}]}, {"n": 4, "title": "고쳐야 한다고 아는 연애 습관", "sub": "直したほうがよいと分かっている恋愛の癖", "titles": {"ko": "고쳐야 한다고 아는 연애 습관", "en": "A relationship habit you know you should change", "ja": "直したほうがよいと分かっている恋愛の癖"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-love-and-marriage-full/60-a-relationship-habit-you-know-you-should-change/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-love-and-marriage-full/60-a-relationship-habit-you-know-you-should-change/lecture/index.html", "source": "courses/en/talk-love-and-marriage-full/lessons/60-a-relationship-habit-you-know-you-should-change/lecture/index.html"}, {"href": "view/talk-love-and-marriage-full/60-a-relationship-habit-you-know-you-should-change/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-love-and-marriage-full/60-a-relationship-habit-you-know-you-should-change/prestudy/index.html", "source": "courses/en/talk-love-and-marriage-full/lessons/60-a-relationship-habit-you-know-you-should-change/prestudy/index.html"}], "goal": {"t": "Let's talk about relationship habits and how people can change them. Please read the title aloud.", "ja": "人間関係の癖と、それを変える方法について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one relationship habit you'd like to get better at?", "ja": "人間関係で、もっと改善したい自分の癖は何ですか？", "f": ["Is it avoiding hard talks, overthinking messages, interrupting, or something else?", "Why would you like to change it?"]}, {"n": "WARM-UP 2", "t": "When does that habit show up most often?", "ja": "その癖が最も出やすいのは、どんなときですか？", "f": ["Does stress, conflict, or messaging bring it out?", "What is the first sign?"]}, {"n": "QUESTION 1", "t": "How could someone point it out without making you defensive?", "ja": "自分が身構えずに受け止められるように、その癖をどう指摘してもらいたいですか？", "f": ["Which exact behavior should they mention?", "When would the conversation go best?"]}, {"n": "QUESTION 2", "t": "What could you do instead?", "ja": "代わりに、どんな行動ができますか？", "f": ["What is the smallest realistic response?", "What could remind you in the moment?"]}, {"n": "QUESTION 3", "t": "How might that habit affect
