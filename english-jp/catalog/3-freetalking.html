ated-as-a-child-but-love-now/lecture/index.html"}, {"href": "view/talk-what-came-before-accessible/79-something-you-hated-as-a-child-but-love-now/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-accessible/79-something-you-hated-as-a-child-but-love-now/prestudy/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/79-something-you-hated-as-a-child-but-love-now/prestudy/index.html"}], "goal": {"t": "Let's explore how food preferences change as people grow. Please read the title aloud.", "ja": "成長とともに食べ物の好みがどう変わるか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which childhood food dislike often turns into real enjoyment later?", "ja": "子どもの頃は嫌いでも、後で本当に好きになることの多い食べ物は何ですか？", "f": ["Is the taste, smell, or texture hard for children?", "Why do children's tastes change as they grow?"]}, {"n": "WARM-UP 2", "t": "Which part of a food—taste, smell, texture, or appearance—is hardest to get past?", "ja": "食べ物の味、匂い、食感、見た目のうち、最も慣れにくいものは何ですか？", "f": ["Which food shows that best?", "Can one bad meal create a lasting dislike?"]}, {"n": "QUESTION 1", "t": "What experience can completely change someone's opinion of a food?", "ja": "どんな経験が、食べ物への考えを完全に変えることがありますか？", "f": ["What can help the taste seem different?", "Does age or preparation matter more?"]}, {"n": "QUESTION 2", "t": "How much can the cook or setting change the way a food tastes?", "ja": "作る人や食べる場所によって、食べ物の味わいはどのくらい変わりますか？", "f": ["Which change in preparation matters most?", "Can company or setting change the taste too?"]}, {"n": "QUESTION 3", "t": "Which food dislike is hardest to change?", "ja": "最も変わりにくい食べ物の苦手意識は何ですか？", "f": ["Why do some dislikes stay strong?", "Would bitter food or food with a strong smell be a good example?"]}, {"n": "QUESTION 4", "t": "Which adult food preference would surprise a child most?", "ja": "大人の食べ物の好みで、子どもが最も驚きそうなものは何ですか？", "f": ["What part seems strange to children?", "What might make it appealing later?"]}, {"n": "QUESTION 5", "t": "When does friendly encouragement to try food become pressure?", "ja": "食べ物を試すよう親切に勧めることが、プレッシャーになるのはいつですか？", "f": ["What kind of encouragement is okay?", "What sign means the person wants you to stop?"]}, {"n": "QUESTION 6", "t": "Which of your current food dislikes has the best chance of changing?", "ja": "今苦手な食べ物のうち、最も好きになりそうなものは何ですか？", "f": ["Could a new recipe change your mind?", "Which strong taste do people often learn to enjoy?"]}]}, {"n": 5, "title": "사람들이 아직도 꺼내는 실수", "sub": "今でも話題にされる失敗", "titles": {"ko": "사람들이 아직도 꺼내는 실수", "en": "A mistake people still remind you about", "ja": "今でも話題にされる失敗"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-came-before-accessible/80-a-mistake-people-still-remind-you-about/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-accessible/80-a-mistake-people-still-remind-you-about/lecture/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/80-a-mistake-people-still-remind-you-about/lecture/index.html"}, {"href": "view/talk-what-came-before-accessible/80-a-mistake-people-still-remind-you-about/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-accessible/80-a-mistake-people-still-remind-you-about/prestudy/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/80-a-mistake-people-still-remind-you-about/prestudy/index.html"}], "goal": {"t": "Let's examine why some old mistakes become lasting stories. Please read the title aloud.", "ja": "昔の失敗がなぜ長く語られる話になるのか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What makes one old mistake turn into a story that never disappears?", "ja": "一つの昔の失敗が、いつまでも消えない話になるのはなぜですか？", "f": ["Why do people keep telling that kind of story?", "Would a cooking mistake or a wrong message be a good example?"]}, {"n": "WARM-UP 2", "t": "Why can a harmless mistake become funnier as time passes?", "ja": "害のない失敗が、時間がたつほど面白くなるのはなぜですか？", "f": ["What changes after time passes?", "When does it stay uncomfortable?"]}, {"n": "QUESTION 1", "t": "Why can a group remember one person's mistake differently from the person who made it?", "ja": "グループが覚える失敗と、失敗した本人の記憶が違うことがあるのはなぜですか？", "f": ["Why does the group keep telling it?", "Which changes more over time: the facts or the feelings?"]}, {"n": "QUESTION 2", "t": "What helps someone recover well from an embarrassing mistake?", "ja": "恥ずかしい失敗からうまく立ち直るには、何が役立ちますか？", "f": ["When is an apology useful?", "What can make the situation worse?"]}, {"n": "QUESTION 3", "t": "What reaction helps someone move on after a mistake?", "ja": "失敗の後、どんな反応が立ち直る助けになりますか？", "f": ["What should a friend say first?", "Would a quiet joke help, or make things worse?"]}, {"n": "QUESTION 4", "t": "What can turn a funny old story into an uncomfortable one?", "ja": "昔の面白い話が、気まずい話に変わるのはどんなときですか？", "f": ["Who is allowed to tell it?", "Would the person rather retire it?"]}, {"n": "QUESTION 5", "t": "Which lesson from a mistake is worth keeping after the embarrassment fades?", "ja": "恥ずかしさが消えた後も残す価値のある、失敗からの学びは何ですか？", "f": ["How could that habit prevent another problem?", "Would checking a message before sending it be a good example?"]}, {"n": "QUESTION 6", "t": "Whose permission matters before an old mistake becomes a shared story?", "ja": "昔の失敗をみんなの話にする前に、誰の許可が大切ですか？", "f": ["What could make the person uncomfortable?", "When should the story stay private?"]}]}, {"n": 6, "title": "잘못되어 버린 여행", "sub": "うまくいかなかった旅行", "titles": {"ko": "잘못되어 버린 여행", "en": "A trip that went wrong", "ja": "うまくいかなかった旅行"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-came-before-accessible/81-a-trip-that-went-wrong/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-accessible/81-a-trip-that-went-wrong/lecture/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/81-a-trip-that-went-wrong/lecture/index.html"}, {"href": "view/talk-what-came-before-accessible/81-a-trip-that-went-wrong/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-accessible/81-a-trip-that-went-wrong/prestudy/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/81-a-trip-that-went-wrong/prestudy/index.html"}], "goal": {"t": "Let's tell a travel story shaped by an unexpected problem. Please read the title aloud.", "ja": "思いがけないトラブルで変わった旅行の話をしましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which travel problem is stressful at the time but funny later?", "ja": "そのときは大変でも、後で面白くなる旅行トラブルは何ですか？", "f": ["Why can it become funny later?", "Would getting lost or missing a train make a good story?"]}, {"n": "WARM-UP 2", "t": "Which part of a trip is most likely to fall apart first?", "ja": "旅行のどの部分が、最初にうまくいかなくなりやすいですか？", "f": ["Do transport, weather, or bookings fail most often?", "What simple backup could help?"]}, {"n": "QUESTION 1", "t": "Which travel problem becomes hardest when no help is available?", "ja": "助けがないと、どんな旅行トラブルが最も解決しにくくなりますか？", "f": ["Why is that problem hard to solve alone?", "Would losing a phone or passport be harder?"]}, {"n": "QUESTION 2", "t": "What first decision matters most when a trip suddenly goes wrong?", "ja": "旅行が突然うまくいかなくなったとき、最も大切な最初の決断は何ですか？", "f": ["What information should they check first?", "What action could prevent a second problem?"]}, {"n": "QUESTION 3", "t": "How does travelling alone or with someone change the way a problem gets solved?", "ja": "一人旅か誰かとの旅行かによって、問題の解決方法はどう変わりますか？", "f": ["What is easier with another person?", "What can become more complicated?"]}, {"n": "QUESTION 4", "t": "What makes a disappointing trip worth remembering anyway?", "ja": "残念な旅行でも、覚えておく価値のあるものにするのは何ですか？", "f": ["Does the ending matter most?", "Which detail becomes funny later?"]}, {"n": "QUESTION 5", "t": "Which travel problem can stay painful even when others think it is funny?", "ja": "周りの人が面白いと思っても、つらさが残る旅行トラブルは何ですか？", "f": ["Who might still feel uncomfortable?", "How can people tell whether joking is okay?"]}, {"n": "QUESTION 6", "t": "After a bad trip, what would need to change before the place felt worth another visit?", "ja": "悪い旅行の後、その場所をもう一度訪れる価値があると思うには何が変わる必要がありますか？", "f": ["Would better weather or better planning be enough?", "What could make you choose a different place instead?"]}]}, {"n": 7, "title": "기꺼이 다시 가고 싶은 곳", "sub": "また喜んで訪れたい場所", "titles": {"ko": "기꺼이 다시 가고 싶은 곳", "en": "A place you would happily visit again", "ja": "また喜んで訪れたい場所"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-came-before-accessible/82-a-place-you-would-happily-visit-again/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-accessible/82-a-place-you-would-happily-visit-again/lecture/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/82-a-place-you-would-happily-visit-again/lecture/index.html"}, {"href": "view/talk-what-came-before-accessible/82-a-place-you-would-happily-visit-again/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-accessible/82-a-place-you-would-happily-visit-again/prestudy/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/82-a-place-you-would-happily-visit-again/prestudy/index.html"}], "goal": {"t": "Let's explain what makes a place worth visiting again. Please read the title aloud.", "ja": "もう一度訪れる価値のある場所について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which place would you happily return to, even if the second visit felt different?", "ja": "二回目の訪問で感じ方が違っても、喜んで戻りたい場所はどこですか？", "f": ["Would you choose a restaurant, park, or city?", "What would you do first there?"]}, {"n": "WARM-UP 2", "t": "What can a second visit reveal that the first visit misses?", "ja": "最初の訪問では気づかない、二回目だから分かることは何ですか？", "f": ["Does the place need to change?", "Would a favourite restaurant or park be worth a quick return?"]}, {"n": "QUESTION 1", "t": "When you miss a place, do you miss the place itself or who you were then?", "ja": "ある場所が恋しいとき、恋しいのはその場所ですか、それともそこにいた頃の自分ですか？", "f": ["What detail brings back the old feeling?", "Would it feel the same if you returned now?"]}, {"n": "QUESTION 2", "t": "For a return visit, would you rather go alone or share it with someone?", "ja": "再訪するなら、一人で行くのと誰かと一緒に行くのと、どちらがよいですか？", "f": ["What would you want to do first on the return visit?", "Would you rather revisit a restaurant or a park?"]}, {"n": "QUESTION 3", "t": "What might change more on a return visit: the place or the visitor?", "ja": "再訪でより大きく変わっているのは、場所と訪れる人のどちらでしょうか？", "f": ["Which change matters most?", "Would the place feel more different after one year or ten years?"]}, {"n": "QUESTION 4", "t": "What is worth repeating on a return visit?", "ja": "再訪したとき、もう一度する価値があることは何ですか？", "f": ["Would you repeat a meal, walk, or photo?", "What might feel different the second time?"]}, {"n": "QUESTION 5", "t": "How can you enjoy a return visit when the place has changed?", "ja": "場所が変わっていても、どうすれば再訪を楽しめますか？", "f": ["What expectation could ruin the visit?", "Would trying one new thing help?"]}, {"n": "QUESTION 6", "t": "What part of a favourite place would improve your ordinary week?", "ja": "お気に入りの場所のどんな部分が、普段の一週間をよりよくしてくれますか？", "f": ["Would you bring home its food, pace, or atmosphere?", "How could you add a small part of it at home?"]}]}, {"n": 8, "title": "어릴 때 되고 싶었던 것", "sub": "子どもの頃になりたかったもの", "titles": {"ko": "어릴 때 되고 싶었던 것", "en": "What you wanted to be as a child", "ja": "子どもの頃になりたかったもの"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-came-before-accessible/83-what-you-wanted-to-be-as-a-child/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-accessible/83-what-you-wanted-to-be-as-a-child/lecture/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/83-what-you-wanted-to-be-as-a-child/lecture/index.html"}, {"href": "view/talk-what-came-before-accessible/83-what-you-wanted-to-be-as-a-child/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-accessible/83-what-you-wanted-to-be-as-a-child/prestudy/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/83-what-you-wanted-to-be-as-a-child/prestudy/index.html"}], "goal": {"t": "Let's explore what childhood dream jobs reveal about people. Please read the title aloud.", "ja": "子どもの頃の夢の仕事から何が分かるか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which childhood dream job sounds most fun to you now?", "ja": "今聞いて最も楽しそうな子どもの頃の夢の仕事は何ですか？", "f": ["Would astronaut, chef, or athlete sound fun now?", "Which part might be less fun in real life?"]}, {"n": "WARM-UP 2", "t": "What part of a dream job does a child usually see first?", "ja": "子どもは夢の仕事のどんな部分を最初に見ますか？", "f": ["Why does that part look exciting to a child?", "What difficulty do children often miss?"]}, {"n": "QUESTION 1", "t": "Who or what has the strongest influence on a child's dream job?", "ja": "子どもの夢の仕事に最も強く影響する人やものは何ですか？", "f": ["How might that influence shape the dream?", "Can a film make a difficult job look easy?"]}, {"n": "QUESTION 2", "t": "What new knowledge most often changes a childhood career dream?", "ja": "どんな新しい知識が、子どもの頃の仕事の夢を変えやすいですか？", "f": ["Which part of the dream might still survive?", "Could the child find a related job instead?"]}, {"n": "QUESTION 3", "t": "What skill might a child pick up while chasing a dream job?", "ja": "子どもが夢の仕事を目指す中で、どんなスキルを身につけることがありますか？", "f": ["Could it be drawing, building, or performing?", "Where could that skill help later?"]}, {"n": "QUESTION 4", "t": "How can an abandoned childhood dream still shape an adult's choices?", "ja": "諦めた子どもの頃の夢は、大人の選択にどう影響し続けますか？", "f": ["Could the old dream become a hobby?", "Where might it appear in adult life?"]}, {"n": "QUESTION 5", "t": "Which hidden part of a dream job becomes clear only with adult experience?", "ja": "夢の仕事のどんな見えない部分が、大人の経験を通して初めて分かりますか？", "f": ["Which part was missing from the childhood picture?", "Would you still try it for one day?"]}, {"n": "QUESTION 6", "t": "What part of your childhood dream would still suit you today?", "ja": "子どもの頃の夢のどんな部分なら、今の自分にも合いそうですか？", "f": ["What no longer suits you?", "Would you still try it for one day?"]}]}, {"n": 9, "title": "돌아가고 싶은 하루", "sub": "戻ってみたい一日", "titles": {"ko": "돌아가고 싶은 하루", "en": "One day you would go back to", "ja": "戻ってみたい一日"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-came-before-accessible/84-one-day-you-would-go-back-to/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-accessible/84-one-day-you-would-go-back-to/lecture/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/84-one-day-you-would-go-back-to/lecture/index.html"}, {"href": "view/talk-what-came-before-accessible/84-one-day-you-would-go-back-to/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-accessible/84-one-day-you-would-go-back-to/prestudy/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/84-one-day-you-would-go-back-to/prestudy/index.html"}], "goal": {"t": "Let's imagine one meaningful visit to the past. Please read the title aloud.", "ja": "意味のある過去への一日旅行を想像しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "If you could witness one day in the past, which day would be worth seeing?", "ja": "過去の一日を目撃できるなら、どの日を見る価値がありますか？", "f": ["Would you choose a personal day or a famous event?", "Where would you arrive?"]}, {"n": "WARM-UP 2", "t": "Would an ordinary day or a famous day reveal more about the past?", "ja": "普通の一日と有名な日のどちらが、過去についてより多くを教えてくれますか？", "f": ["Would an ordinary family day or a famous event be more interesting?", "What would you watch first?"]}, {"n": "QUESTION 1", "t": "What mystery could one day in the past help solve?", "ja": "過去の一日を見ることで、どんな謎を解けそうですか？", "f": ["Would you want to understand a person or an event?", "What might a visitor still get wrong?"]}, {"n": "QUESTION 2", "t": "If a visit to the past allowed one action, would you observe or step in?", "ja": "過去への訪問で一つ行動できるなら、見るだけにしますか、それとも関わりますか？", "f": ["What could change if the visitor stepped in?", "What could they learn by only watching?"]}, {"n": "QUESTION 3", "t": "Who from the past would you most like to spend one ordinary day with?", "ja": "過去の誰と、普通の一日を一緒に過ごしたいですか？", "f": ["What would you want to notice?", "Would you choose a relative or a public figure?"]}, {"n": "QUESTION 4", "t": "What would you ask someone from the past?", "ja": "過去の人に何を聞きたいですか？", "f": ["Would you ask about daily life or an important event?", "What answer might surprise you?"]}, {"n": "QUESTION 5", "t": "What part of the present might feel different after seeing the past directly?", "ja": "過去を直接見た後、現在のどんな部分が違って感じられるでしょうか？", "f": ["Would the present seem easier or harder?", "Could seeing an ordinary past day change your view?"]}, {"n": "QUESTION 6", "t": "What is one day in the past you would rather leave alone?", "ja": "過去の一日で、あえて見ないままにしておきたい日はありますか？", "f": ["Would it be personal or historical?", "Why might not seeing it be better?"]}]}, {"n": 10, "title": "자라면서 달라진 가족의 전통", "sub": "成長とともに変わった家族の習慣", "titles": {"ko": "자라면서 달라진 가족의 전통", "en": "A family tradition that changed as you grew up", "ja": "成長とともに変わった家族の習慣"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-came-before-accessible/85-a-turning-point-in-your-life/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-accessible/85-a-turning-point-in-your-life/lecture/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/85-a-turning-point-in-your-life/lecture/index.html"}, {"href": "view/talk-what-came-before-accessible/85-a-turning-point-in-your-life/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-accessible/85-a-turning-point-in-your-life/prestudy/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/85-a-turning-point-in-your-life/prestudy/index.html"}], "goal": {"t": "Let's describe a family tradition, how it changed, and which parts are worth carrying forward. Please read the title aloud.", "ja": "家族の習慣とその変化、これからも残したい部分について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which family tradition do you remember most clearly?", "ja": "最もはっきり覚えている家族の習慣は何ですか？", "f": ["When did it happen?", "Would birthdays or holiday meals count?"]}, {"n": "WARM-UP 2", "t": "What small detail made that tradition feel special?", "ja": "その習慣を特別にしていた小さなことは何ですか？", "f": ["Was it a food, place, or phrase?", "Who noticed that detail most?"]}, {"n": "QUESTION 1", "t": "Who kept the tradition going?", "ja": "その習慣を続けていたのは誰ですか？", "f": ["What did that person do?", "Did anyone else take over later?"]}, {"n": "QUESTION 2", "t": "How did the tradition change as people got older or moved away?", "ja": "家族が年を重ねたり離れて暮らしたりする中で、その習慣はどう変わりましたか？", "f": ["What became harder?", "What stayed the same?"]}, {"n": "QUESTION 3", "t": "Which part of an old family tradition is worth keeping?", "ja": "昔からの家族の習慣で、残す価値があるのはどの部分ですか？", "f": ["Why does it still matter?", "Could it work in a smaller form?"]}, {"n": "QUESTION 4", "t": "What part would you happily change or stop?", "ja": "喜んで変えたり、やめたりしたい部分は何ですか？", "f": ["Why no longer keep it?", "Who might disagree?"]}, {"n": "QUESTION 5", "t": "Can a new family tradition become meaningful quickly?", "ja": "新しい家族の習慣でも、すぐに大切なものになれますか？", "f": ["What would help it last?", "Does it need to happen every year?"]}, {"n": "QUESTION 6", "t": "What tradition would you like to start for the future?", "ja": "これから始めたい習慣は何ですか？", "f": ["Who would you include?", "What would make it easy to continue?"]}]}, {"n": 11, "title": "어릴 때의 나", "sub": "子どもの頃の自分", "titles": {"ko": "어릴 때의 나", "en": "What you were like as a child", "ja": "子どもの頃の自分"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-came-before-accessible/86-what-you-were-like-as-a-child/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-accessible/86-what-you-were-like-as-a-child/lecture/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/86-what-you-were-like-as-a-child/lecture/index.html"}, {"href": "view/talk-what-came-before-accessible/86-what-you-were-like-as-a-child/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-accessible/86-what-you-were-like-as-a-child/prestudy/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/86-what-you-were-like-as-a-child/prestudy/index.html"}], "goal": {"t": "Let's compare different views of the same childhood self. Please read the title aloud.", "ja": "同じ子どもの頃の姿を、違う視点から比べてみましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What part of your childhood personality is easiest to recognize now?", "ja": "子どもの頃の性格のどんな部分が、今も最も分かりやすく残っていますか？", "f": ["What story shows that?", "What do adults usually notice first about a child?"]}, {"n": "WARM-UP 2", "t": "Which childhood trait can grow into a strength in adulthood?", "ja": "子どもの頃のどんな特徴が、大人になると強みになり得ますか？", "f": ["How might that trait help an adult?", "When might it still cause difficulty?"]}, {"n": "QUESTION 1", "t": "Why can two people remember the same child differently?", "ja": "二人の人が同じ子どもを違って覚えていることがあるのはなぜですか？", "f": ["Which setting could explain the difference?", "What might both memories get right?"]}, {"n": "QUESTION 2", "t": "Which ordinary childhood moment can reveal more than a simple label?", "ja": "どんな普通の子どもの頃の瞬間が、単純な呼び方より多くを表しますか？", "f": ["Could sharing, arguing, or helping show someone's character?", "Who might remember the moment differently?"]}, {"n": "QUESTION 3", "t": "How much can a child's behaviour change with the people and setting?", "ja": "一緒にいる人や場所によって、子どもの行動はどのくらい変わりますか？", "f": ["Which person or setting changes the child's behaviour most?", "Can both quiet and talkative behaviour be genuine?"]}, {"n": "QUESTION 4", "t": "Which good childhood quality do adults often lose?", "ja": "大人が失いがちな、子どもの頃のよい性質は何ですか？", "f": ["Would curiosity or playfulness be a good example?", "Why is it hard for adults to keep?"]}, {"n": "QUESTION 5", "t": "What might a label like 'shy' or 'difficult' fail to show about a child?", "ja": "「恥ずかしがり屋」や「難しい子」という呼び方では、子どものどんな部分が見えなくなりますか？", "f": ["What might people miss about the child's situation?", "How could the label be fairer?"]}, {"n": "QUESTION 6", "t": "What might your childhood self find strange about you now?", "ja": "子どもの頃の自分は、今の自分の何を不思議に思いそうですか？", "f": ["Would your work, home, or phone surprise your childhood self?", "What would still feel familiar?"]}]}, {"n": 12, "title": "이제는 사라진 어린 시절의 장소", "sub": "もう存在しない子どもの頃の場所", "titles": {"ko": "이제는 사라진 어린 시절의 장소", "en": "A childhood place that no longer exists", "ja": "もう存在しない子どもの頃の場所"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-came-before-accessible/87-a-childhood-place-that-no-longer-exists/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-accessible/87-a-childhood-place-that-no-longer-exists/lecture/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/87-a-childhood-place-that-no-longer-exists/lecture/index.html"}, {"href": "view/talk-what-came-before-accessible/87-a-childhood-place-that-no-longer-exists/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-accessible/87-a-childhood-place-that-no-longer-exists/prestudy/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/87-a-childhood-place-that-no-longer-exists/prestudy/index.html"}], "goal": {"t": "Let's remember a place that disappeared and what it meant. Please read the title aloud.", "ja": "なくなった場所と、そこにあった意味を振り返りましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which lost place would be most valuable to bring back for one day?", "ja": "失われた場所のうち、一日だけ戻す価値が最も高い場所はどこですか？", "f": ["Would you choose a shop, school, park, or famous building?", "Who would enjoy seeing it again?"]}, {"n": "WARM-UP 2", "t": "Which sound, smell, or small feature can bring a lost place back to mind?", "ja": "どんな音、匂い、小さな特徴が、失われた場所を心によみがえらせますか？", "f": ["Why does that detail stay in memory?", "Would a photo capture it?"]}, {"n": "QUESTION 1", "t": "What can make an ordinary shop, park, or street feel irreplaceable?", "ja": "普通の店、公園、通りが、かけがえのないものに感じられるのはなぜですか？", "f": ["Which ordinary routine gives the place meaning?", "Who might remember the place differently?"]}, {"n": "QUESTION 2", "t": "Which kinds of change are hardest for small local places to survive?", "ja": "小さな地元の場所が生き残りにくいのは、どんな変化ですか？", "f": ["Is money or changing habits usually the bigger problem?", "What could help a local place survive?"]}, {"n": "QUESTION 3", "t": "What would you do if you knew a favourite place was about to disappear?", "ja": "お気に入りの場所がもうすぐなくなると分かったら、何をしますか？", "f": ["Would you take a photo, buy something, or talk to the owner?", "What do people usually want before a favourite shop closes?"]}, {"n": "QUESTION 4", "t": "Can a new place respect what people valued about the old one?", "ja": "新しい場所は、古い場所で人々が大切にしたものを尊重できますか？", "f": ["Should it keep the old name, use, or atmosphere?", "When is a completely new place better?"]}, {"n": "QUESTION 5", "t": "How can a change be practical and still feel sad?", "ja": "変化が実用的でも悲しく感じられるのはなぜですか？", "f": ["What feels most clearly lost?", "What makes the change understandable?"]}, {"n": "QUESTION 6", "t": "How should a community remember a place that no longer exists?", "ja": "もう存在しない場所を、地域はどのように記憶に残すべきですか？", "f": ["Would you preserve a sign, photo, or recipe?", "Who would value it?"]}]}, {"n": 13, "title": "완전히 잘못 알고 있던 것", "sub": "完全に間違っていたこと", "titles": {"ko": "완전히 잘못 알고 있던 것", "en": "Something you were completely wrong about", "ja": "完全に間違っていたこと"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-came-before-accessible/88-something-you-were-completely-wrong-about/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-accessible/88-something-you-were-completely-wrong-about/lecture/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/88-something-you-were-completely-wrong-about/lecture/index.html"}, {"href": "view/talk-what-came-before-accessible/88-something-you-were-completely-wrong-about/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-accessible/88-something-you-were-completely-wrong-about/prestudy/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/88-something-you-were-completely-wrong-about/prestudy/index.html"}], "goal": {"t": "Let's examine how a confident belief can turn out to be wrong. Please read the title aloud.", "ja": "確信していた考えが、どう間違いだと分かるのか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's something people used to believe that surprises you now?", "ja": "昔の人が信じていたことで、今のあなたが驚くものは何ですか？", "f": ["Why did it sound true?", "What did people once believe about health or science?"]}, {"n": "WARM-UP 2", "t": "Which small misconception is surprisingly hard to correct?", "ja": "意外に訂正しにくい小さな思い違いは何ですか？", "f": ["Why does the wrong answer sound right?", "Would a myth about food or animals be a good example?"]}, {"n": "QUESTION 1", "t": "What lets a wrong belief survive even when better information is available?", "ja": "よりよい情報があっても、間違った考えが残るのはなぜですか？", "f": ["Why do people keep repeating it?", "What might finally weaken it?"]}, {"n": "QUESTION 2", "t": "Why can the source of a wrong idea still seem trustworthy?", "ja": "間違った考えの情報源でも、信頼できそうに見えるのはなぜですか？", "f": ["Which sources seem believable?", "How can someone check the original claim?"]}, {"n": "QUESTION 3", "t": "What makes a correction easier to accept?", "ja": "訂正を受け入れやすくするものは何ですか？", "f": ["Would a clear example or a trusted source help more?", "When might a person still refuse to change their mind?"]}, {"n": "QUESTION 4", "t": "How can embarrassment keep a person defending an idea they doubt?", "ja": "恥ずかしさによって、疑っている考えを守り続けてしまうのはなぜですか？", "f": ["What makes admitting it feel personal?", "How can someone correct the idea without embarrassing the person?"]}, {"n": "QUESTION 5", "t": "What checking habit can someone learn from being confidently wrong?", "ja": "自信を持って間違えた経験から、どんな確認の習慣を学べますか？", "f": ["Would checking a second source help?", "When is that habit most useful?"]}, {"n": "QUESTION 6", "t": "How confident should you sound when you are not sure a claim is true?", "ja": "ある主張が本当か確信がないとき、どのくらい自信を持って話すべきですか？", "f": ["Would you say 'maybe' or give a percentage?", "How certain are you about tomorrow's weather?"]}]}]}, {"no": 16, "label": "16코스", "title": "지나온 것", "titles": {"ko": "지나온 것", "en": "What came before", "ja": "過ぎてきたもの"}, "subtitle": "(上級) 過ぎてきたもの", "desc": {"ko": "이미 겪은 기억을 시간 순서와 디테일로 이야기한다.", "en": "Tell what you already lived through, in order and in detail.", "ja": "すでに経験した記憶を、時間の順とディテールで語る。"}, "cover": "covers/talk-what-came-before-full.webp", "levels": ["C1"], "level": "C1", "slug": "talk-what-came-before-full", "lessons": [{"n": 1, "title": "어릴 때 계속 들었던 조언", "sub": "子どもの頃に何度も聞いた助言", "titles": {"ko": "어릴 때 계속 들었던 조언", "en": "Advice you kept hearing as a child", "ja": "子どもの頃に何度も聞いた助言"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-came-before-full/76-advice-you-kept-hearing-as-a-child/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-full/76-advice-you-kept-hearing-as-a-child/lecture/index.html", "source": "courses/en/talk-what-came-before-full/lessons/76-advice-you-kept-hearing-as-a-child/lecture/index.html"}, {"href": "view/talk-what-came-before-full/76-advice-you-kept-hearing-as-a-child/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-full/76-advice-you-kept-hearing-as-a-child/prestudy/index.html", "source": "courses/en/talk-what-came-before-full/lessons/76-advice-you-kept-hearing-as-a-child/prestudy/index.html"}], "goal": {"t": "Let's talk about childhood advice that stays with people. Please read the title aloud.", "ja": "心に残る子どもの頃の助言について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What advice did you hear again and again as a child?", "ja": "子どもの頃、何度も聞いた助言は何ですか？", "f": ["Who usually said it?", "Did you follow it or ignore it?"]}, {"n": "WARM-UP 2", "t": "What's a piece of advice whose exact words have stayed with you?", "ja": "正確な言い方が今も心に残っている助言は何ですか？", "f": ["Did anyone explain what it meant?", "Do lines like 'be kind' or 'work hard' come to mind?"]}, {"n": "QUESTION 1", "t": "Which childhood warning do people often understand only after ignoring it?", "ja": "無視した後になって初めて意味が分かることの多い子どもの頃の忠告は何ですか？", "f": ["Why do people ignore it?", "Which is easier for children to ignore: advice about money or health?"]}, {"n": "QUESTION 2", "t": "Which childhood rule is still worth passing on?", "ja": "今も伝える価値がある子ども時代のルールは何ですか？", "f": ["Why is it still useful?", "Would 'tell the truth' or 'clean up after yourself' be a good example?"]}, {"n": "QUESTION 3", "t": "Which childhood advice becomes more convincing with age?", "ja": "年齢を重ねるほど納得できるようになる子どもの頃の助言は何ですか？", "f": ["Why can the advice make more sense later?", "Would advice about money or health be a good example?"]}, {"n": "QUESTION 4", "t": "Which childhood advice would you rewrite before passing it on?", "ja": "子どもの頃の助言で、次の人に伝える前に言い換えたいものは何ですか？", "f": ["What part would you keep?", "Would you change advice about school, manners, or safety?"]}, {"n": "QUESTION 5", "t": "How can adults give reminders without sounding like they are nagging?", "ja": "大人は、どうすれば小言に聞こえずに注意できますか？", "f": ["Would a calm voice or a short message help more?", "When should the adult stop repeating it?"]}, {"n": "QUESTION 6", "t": "What advice do adults ignore even though they know it is true?", "ja": "本当だと分かっていても、大人が無視しがちな助言は何ですか？", "f": ["Would adults benefit more from advice about rest, money, or kindness?", "Why might they ignore it?"]}]}, {"n": 2, "title": "아직도 기억나는 선생님", "sub": "今も覚えている先生", "titles": {"ko": "아직도 기억나는 선생님", "en": "A teacher you still remember", "ja": "今も覚えている先生"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-came-before-full/77-a-teacher-you-still-remember/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-full/77-a-teacher-you-still-remember/lecture/index.html", "source": "courses/en/talk-what-came-before-full/lessons/77-a-teacher-you-still-remember/lecture/index.html"}, {"href": "view/talk-what-came-before-full/77-a-teacher-you-still-remember/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-full/77-a-teacher-you-still-remember/prestudy/index.html", "source": "courses/en/talk-what-came-before-full/lessons/77-a-teacher-you-still-remember/prestudy/index.html"}], "goal": {"t": "Let's talk about what makes a teacher unforgettable. Please read the title aloud.", "ja": "先生が忘れられない存在になる理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which real or fictional teacher has stayed in your mind?", "ja": "実在でも作品の中でも、今も心に残っている先生は誰ですか？", "f": ["What did that teacher do?", "Which teacher from a film or book would be another good choice?"]}, {"n": "WARM-UP 2", "t": "What does a good teacher do when a student makes a mistake?", "ja": "よい先生は、生徒が間違えたときに何をしますか？", "f": ["How can the teacher keep the student interested?", "Would you prefer a hint or a clear correction?"]}, {"n": "QUESTION 1", "t": "What small act from a teacher can matter to a student years later?", "ja": "何年後にも生徒にとって大切に思える、先生の小さな行動は何ですか？", "f": ["Why can a small act stay in a student's memory?", "Would remembering a name or giving encouragement be a good example?"]}, {"n": "QUESTION 2", "t": "When does a strict teacher go too far?", "ja": "厳しい先生が行き過ぎるのはどんなときですか？", "f": ["What effect does it have on students?", "Which is worse: shouting at students or giving too much homework?"]}, {"n": "QUESTION 3", "t": "What's an important lesson a teacher can leave beyond the subject itself?", "ja": "先生が教科そのものを超えて残せる大切な学びは何ですか？", "f": ["How could that lesson help later?", "Could a teacher show kindness or confidence without teaching it directly?"]}, {"n": "QUESTION 4", "t": "Why can a teacher's choices make more sense years after the class ends?", "ja": "授業が終わって何年かしてから、先生の選択に納得できることがあるのはなぜですか？", "f": ["What can people understand later?", "Can you think of a rule that seemed unfair at school?"]}, {"n": "QUESTION 5", "t": "What would you like to tell a former teacher?", "ja": "昔の先生に何を伝えたいですか？", "f": ["Would it be thanks, a question, or criticism?", "What should teachers hear from former students?"]}, {"n": "QUESTION 6", "t": "How can a student keep learning when a teacher's style does not work for them?", "ja": "先生の教え方が自分に合わなくても、生徒はどう学び続けられますか？", "f": ["What could the student try first?", "Could another teacher, classmate, or online lesson help?"]}]}, {"n": 3, "title": "학교에서 불리던 별명", "sub": "学校で呼ばれていたあだ名", "titles": {"ko": "학교에서 불리던 별명", "en": "A nickname you had at school", "ja": "学校で呼ばれていたあだ名"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-came-before-full/78-a-nickname-you-had-at-school/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-full/78-a-nickname-you-had-at-school/lecture/index.html", "source": "courses/en/talk-what-came-before-full/lessons/78-a-nickname-you-had-at-school/lecture/index.html"}, {"href": "view/talk-what-came-before-full/78-a-nickname-you-had-at-school/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-full/78-a-nickname-you-had-at-school/prestudy/index.html", "source": "courses/en/talk-what-came-before-full/lessons/78-a-nickname-you-had-at-school/prestudy/index.html"}], "goal": {"t": "Let's explore how school nicknames begin and affect people. Please read the title aloud.", "ja": "学校のあだ名がどう生まれ、人にどう影響するか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which school nickname has the best story behind it?", "ja": "最も面白い由来を持つ学校のあだ名は何ですか？", "f": ["What made it memorable?", "What makes any nickname easy to remember?"]}, {"n": "WARM-UP 2", "t": "What makes a nickname spread from one person to a whole group?", "ja": "一人が使い始めたあだ名が、グループ全体に広がるのはなぜですか？", "f": ["Does a joke, habit, or appearance usually start it?", "Who helps the nickname spread?"]}, {"n": "QUESTION 1", "t": "What makes the same nickname feel warm to one person and hurtful to another?", "ja": "同じあだ名でも、ある人には温かく、別の人には傷つくものに感じられるのはなぜですか？", "f": ["Whose feelings decide whether it is friendly?", "Can the same nickname change over time?"]}, {"n": "QUESTION 2", "t": "What can a nickname get wrong about a person?", "ja": "あだ名は、その人について何を間違って伝えることがありますか？", "f": ["Could a nickname hide a quiet or serious side?", "Why might other people believe it?"]}, {"n": "QUESTION 3", "t": "Why can an old nickname bring back a whole relationship or time in life?", "ja": "昔のあだ名が、人間関係や人生のある時期を丸ごと思い出させるのはなぜですか？", "f": ["Who usually keeps using an old nickname?", "Would it feel strange if a new friend used it?"]}, {"n": "QUESTION 4", "t": "How can nicknames help a group feel close?", "ja": "あだ名は、グループの親しさをどう深めますか？", "f": ["Does a nickname create closeness or show closeness?", "Why might someone prefer their real name?"]}, {"n": "QUESTION 5", "t": "When should people stop using a nickname?", "ja": "人はどんなときに、あだ名を使うのをやめるべきですか？", "f": ["Whose feelings matter most?", "Could the nickname ever feel friendly again?"]}, {"n": "QUESTION 6", "t": "What part of your present self would you want a new nickname to capture?", "ja": "新しいあだ名に、今の自分のどんな部分を表してほしいですか？", "f": ["Would it describe your personality, a skill, or a habit?", "Would you choose it yourself?"]}]}, {"n": 4, "title": "어릴 때는 싫어했지만 지금은 좋아하는 음식", "sub": "子どもの頃は嫌いだったけれど、今は好きな食べ物", "titles": {"ko": "어릴 때는 싫어했지만 지금은 좋아하는 음식", "en": "A food you hated as a child but like now", "ja": "子どもの頃は嫌いだったけれど、今は好きな食べ物"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-came-before-full/79-something-you-hated-as-a-child-but-love-now/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-full/79-something-you-hated-as-a-child-but-love-now/lecture/index.html", "source": "courses/en/talk-what-came-before-full/lessons/79-something-you-hated-as-a-child-but-love-now/lecture/index.html"}, {"href": "view/talk-what-came-before-full/79-something-you-hated-as-a-child-but-love-now/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-full/79-something-you-hated-as-a-child-but-love-now/prestudy/index.html", "source": "courses/en/talk-what-came-before-full/lessons/79-something-you-hated-as-a-child-but-love-now/prestudy/index.html"}], "goal": {"t": "Let's explore how food preferences change as people grow. Please read the title aloud.", "ja": "成長とともに食べ物の好みがどう変わるか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which childhood food dislike often turns into real enjoyment later?", "ja": "子どもの頃は嫌いでも、後で本当に好きになることの多い食べ物は何ですか？", "f": ["Is the taste, smell, or texture hard for children?", "Why do children's tastes change as they grow?"]}, {"n": "WARM-UP 2", "t": "Which part of a food—taste, smell, texture, or appearance—is hardest to get past?", "ja": "食べ物の味、匂い、食感、見た目のうち、最も慣れにくいものは何ですか？", "f": ["Which food shows that best?", "Can one bad meal create a lasting dislike?"]}, {"n": "QUESTION 1", "t": "What experience can completely change someone's opinion of a food?", "ja": "どんな経験が、食べ物への考えを完全に変えることがありますか？", "f": ["What can help the taste seem different?", "Does age or preparation matter more?"]}, {"n": "QUESTION 2", "t": "How much can the cook or setting change the way a food tastes?", "ja": "作る人や食べる場所によって、食べ物の味わいはどのくらい変わりますか？", "f": ["Which change in preparation matters most?", "Can company or setting change the taste too?"]}, {"n": "QUESTION 3", "t": "Which food dislike is hardest to change?", "ja": "最も変わりにくい食べ物の苦手意識は何ですか？", "f": ["Why do some dislikes stay strong?", "Would bitter food or food with a strong smell be a good example?"]}, {"n": "QUESTION 4", "t": "Which adult food preference would surprise a child most?", "ja": "大人の食べ物の好みで、子どもが最も驚きそうなものは何ですか？", "f": ["What part seems strange to children?", "What might make it appealing later?"]}, {"n": "QUESTION 5", "t": "When does friendly encouragement to try food become pressure?", "ja": "食べ物を試すよう親切に勧めることが、プレッシャーになるのはいつですか？", "f": ["What kind of encouragement is okay?", "What sign means the person wants you to stop?"]}, {"n": "QUESTION 6", "t": "Which of your current food dislikes has the best chance of changing?", "ja": "今苦手な食べ物のうち、最も好きになりそうなものは何ですか？", "f": ["Could a new recipe change your mind?", "Which strong taste do people often learn to enjoy?"]}]}, {"n": 5, "title": "사람들이 아직도 꺼내는 실수", "sub": "今でも話題にされる失敗", "titles": {"ko": "사람들이 아직도 꺼내는 실수", "en": "A mistake people still remind you about", "ja": "今でも話題にされる失敗"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-came-before-full/80-a-mistake-people-still-remind-you-about/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-full/80-a-mistake-people-still-remind-you-about/lecture/index.html", "source": "courses/en/talk-what-came-before-full/lessons/80-a-mistake-people-still-remind-you-about/lecture/index.html"}, {"href": "view/talk-what-came-before-full/80-a-mistake-people-still-remind-you-about/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-full/80-a-mistake-people-still-remind-you-about/prestudy/index.html", "source": "courses/en/talk-what-came-before-full/lessons/80-a-mistake-people-still-remind-you-about/prestudy/index.html"}], "goal": {"t": "Let's examine why some old mistakes become lasting stories. Please read the title aloud.", "ja": "昔の失敗がなぜ長く語られる話になるのか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What makes one old mistake turn into a story that never disappears?", "ja": "一つの昔の失敗が、いつまでも消えない話になるのはなぜですか？", "f": ["Why do people keep telling that kind of story?", "Would a cooking mistake or a wrong message be a good example?"]}, {"n": "WARM-UP 2", "t": "Why can a harmless mistake become funnier as time passes?", "ja": "害のない失敗が、時間がたつほど面白くなるのはなぜですか？", "f": ["What changes after time passes?", "When does it stay uncomfortable?"]}, {"n": "QUESTION 1", "t": "Why can a group remember one person's mistake differently from the person who made it?", "ja": "グループが覚える失敗と、失敗した本人の記憶が違うことがあるのはなぜですか？", "f": ["Why does the group keep telling it?", "Which changes more over time: the facts or the feelings?"]}, {"n": "QUESTION 2", "t": "What helps someone recover well from an embarrassing mistake?", "ja": "恥ずかしい失敗からうまく立ち直るには、何が役立ちますか？", "f": ["When is an apology useful?", "What can make the situation worse?"]}, {"n": "QUESTION 3", "t": "What reaction helps someone move on after a mistake?", "ja": "失敗の後、どんな反応が立ち直る助けになりますか？", "f": ["What should a friend say first?", "Would a quiet joke help, or make things worse?"]}, {"n": "QUESTION 4", "t": "What can turn a funny old story into an uncomfortable one?", "ja": "昔の面白い話が、気まずい話に変わるのはどんなときですか？", "f": ["Who is allowed to tell it?", "Would the person rather retire it?"]}, {"n": "QUESTION 5", "t": "Which lesson from a mistake is worth keeping after the embarrassment fades?", "ja": "恥ずかしさが消えた後も残す価値のある、失敗からの学びは何ですか？", "f": ["How could that habit prevent another problem?", "Would checking a message before sending it be a good example?"]}, {"n": "QUESTION 6", "t": "Whose permission matters before an old mistake becomes a shared story?", "ja": "昔の失敗をみんなの話にする前に、誰の許可が大切ですか？", "f": ["What could make the person uncomfortable?", "When should the story stay private?"]}]}, {"n": 6, "title": "잘못되어 버린 여행", "sub": "うまくいかなかった旅行", "titles": {"ko": "잘못되어 버린 여행", "en": "A trip that went wrong", "ja": "うまくいかなかった旅行"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-came-before-full/81-a-trip-that-went-wrong/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-full/81-a-trip-that-went-wrong/lecture/index.html", "source": "courses/en/talk-what-came-before-full/lessons/81-a-trip-that-went-wrong/lecture/index.html"}, {"href": "view/talk-what-came-before-full/81-a-trip-that-went-wrong/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-full/81-a-trip-that-went-wrong/prestudy/index.html", "source": "courses/en/talk-what-came-before-full/lessons/81-a-trip-that-went-wrong/prestudy/index.html"}], "goal": {"t": "Let's tell a travel story shaped by an unexpected problem. Please read the title aloud.", "ja": "思いがけないトラブルで変わった旅行の話をしましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which travel problem is stressful at the time but funny later?", "ja": "そのときは大変でも、後で面白くなる旅行トラブルは何ですか？", "f": ["Why can it become funny later?", "Would getting lost or missing a train make a good story?"]}, {"n": "WARM-UP 2", "t": "Which part of a trip is most likely to fall apart first?", "ja": "旅行のどの部分が、最初にうまくいかなくなりやすいですか？", "f": ["Do transport, weather, or bookings fail most often?", "What simple backup could help?"]}, {"n": "QUESTION 1", "t": "Which travel problem becomes hardest when no help is available?", "ja": "助けがないと、どんな旅行トラブルが最も解決しにくくなりますか？", "f": ["Why is that problem hard to solve alone?", "Would losing a phone or passport be harder?"]}, {"n": "QUESTION 2", "t": "What first decision matters most when a trip suddenly goes wrong?", "ja": "旅行が突然うまくいかなくなったとき、最も大切な最初の決断は何ですか？", "f": ["What information should they check first?", "What action could prevent a second problem?"]}, {"n": "QUESTION 3", "t": "How does travelling alone or with someone change the way a problem gets solved?", "ja": "一人旅か誰かとの旅行かによって、問題の解決方法はどう変わりますか？", "f": ["What is easier with another person?", "What can become more complicated?"]}, {"n": "QUESTION 4", "t": "What makes a disappointing trip worth remembering anyway?", "ja": "残念な旅行でも、覚えておく価値のあるものにするのは何ですか？", "f": ["Does the ending matter most?", "Which detail becomes funny later?"]}, {"n": "QUESTION 5", "t": "Which travel problem can stay painful even when others think it is funny?", "ja": "周りの人が面白いと思っても、つらさが残る旅行トラブルは何ですか？", "f": ["Who might still feel uncomfortable?", "How can people tell whether joking is okay?"]}, {"n": "QUESTION 6", "t": "After a bad trip, what would need to change before the place felt worth another visit?", "ja": "悪い旅行の後、その場所をもう一度訪れる価値があると思うには何が変わる必要がありますか？", "f": ["Would better weather or better planning be enough?", "What could make you choose a different place instead?"]}]}, {"n": 7, "title": "기꺼이 다시 가고 싶은 곳", "sub": "また喜んで訪れたい場所", "titles": {"ko": "기꺼이 다시 가고 싶은 곳", "en": "A place you would happily visit again", "ja": "また喜んで訪れたい場所"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-came-before-full/82-a-place-you-would-happily-visit-again/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-full/82-a-place-you-would-happily-visit-again/lecture/index.html", "source": "courses/en/talk-what-came-before-full/lessons/82-a-place-you-would-happily-visit-again/lecture/index.html"}, {"href": "view/talk-what-came-before-full/82-a-place-you-would-happily-visit-again/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-full/82-a-place-you-would-happily-visit-again/prestudy/index.html", "source": "courses/en/talk-what-came-before-full/lessons/82-a-place-you-would-happily-visit-again/prestudy/index.html"}], "goal": {"t": "Let's explain what makes a place worth visiting again. Please read the title aloud.", "ja": "もう一度訪れる価値のある場所について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which place would you happily return to, even if the second visit felt different?", "ja": "二回目の訪問で感じ方が違っても、喜んで戻りたい場所はどこですか？", "f": ["Would you choose a restaurant, park, or city?", "What would you do first there?"]}, {"n": "WARM-UP 2", "t": "What can a second visit reveal that the first visit misses?", "ja": "最初の訪問では気づかない、二回目だから分かることは何ですか？", "f": ["Does the place need to change?", "Would a favourite restaurant or park be worth a quick return?"]}, {"n": "QUESTION 1", "t": "When you miss a place, do you miss the place itself or who you were then?", "ja": "ある場所が恋しいとき、恋しいのはその場所ですか、それともそこにいた頃の自分ですか？", "f": ["What detail brings back the old feeling?", "Would it feel the same if you returned now?"]}, {"n": "QUESTION 2", "t": "For a return visit, would you rather go alone or share it with someone?", "ja": "再訪するなら、一人で行くのと誰かと一緒に行くのと、どちらがよいですか？", "f": ["What would you want to do first on the return visit?", "Would you rather revisit a restaurant or a park?"]}, {"n": "QUESTION 3", "t": "What might change more on a return visit: the place or the visitor?", "ja": "再訪でより大きく変わっているのは、場所と訪れる人のどちらでしょうか？", "f": ["Which change matters most?", "Would the place feel more different after one year or ten years?"]}, {"n": "QUESTION 4", "t": "What is worth repeating on a return visit?", "ja": "再訪したとき、もう一度する価値があることは何ですか？", "f": ["Would you repeat a meal, walk, or photo?", "What might feel different the second time?"]}, {"n": "QUESTION 5", "t": "How can you enjoy a return visit when the place has changed?", "ja": "場所が変わっていても、どうすれば再訪を楽しめますか？", "f": ["What expectation could ruin the visit?", "Would trying one new thing help?"]}, {"n": "QUESTION 6", "t": "What part of a favourite place would improve your ordinary week?", "ja": "お気に入りの場所のどんな部分が、普段の一週間をよりよくしてくれますか？", "f": ["Would you bring home its food, pace, or atmosphere?", "How could you add a small part of it at home?"]}]}, {"n": 8, "title": "어릴 때 되고 싶었던 것", "sub": "子どもの頃になりたかったもの", "titles": {"ko": "어릴 때 되고 싶었던 것", "en": "What you wanted to be as a child", "ja": "子どもの頃になりたかったもの"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-came-before-full/83-what-you-wanted-to-be-as-a-child/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-full/83-what-you-wanted-to-be-as-a-child/lecture/index.html", "source": "courses/en/talk-what-came-before-full/lessons/83-what-you-wanted-to-be-as-a-child/lecture/index.html"}, {"href": "view/talk-what-came-before-full/83-what-you-wanted-to-be-as-a-child/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-full/83-what-you-wanted-to-be-as-a-child/prestudy/index.html", "source": "courses/en/talk-what-came-before-full/lessons/83-what-you-wanted-to-be-as-a-child/prestudy/index.html"}], "goal": {"t": "Let's explore what childhood dream jobs reveal about people. Please read the title aloud.", "ja": "子どもの頃の夢の仕事から何が分かるか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which childhood dream job sounds most fun to you now?", "ja": "今聞いて最も楽しそうな子どもの頃の夢の仕事は何ですか？", "f": ["Would astronaut, chef, or athlete sound fun now?", "Which part might be less fun in real life?"]}, {"n": "WARM-UP 2", "t": "What part of a dream job does a child usually see first?", "ja": "子どもは夢の仕事のどんな部分を最初に見ますか？", "f": ["Why does that part look exciting to a child?", "What difficulty do children often miss?"]}, {"n": "QUESTION 1", "t": "Who or what has the strongest influence on a child's dream job?", "ja": "子どもの夢の仕事に最も強く影響する人やものは何ですか？", "f": ["How might that influence shape the dream?", "Can a film make a difficult job look easy?"]}, {"n": "QUESTION 2", "t": "What new knowledge most often changes a childhood career dream?", "ja": "どんな新しい知識が、子どもの頃の仕事の夢を変えやすいですか？", "f": ["Which part of the dream might still survive?", "Could the child find a related job instead?"]}, {"n": "QUESTION 3", "t": "What skill might a child pick up while chasing a dream job?", "ja": "子どもが夢の仕事を目指す中で、どんなスキルを身につけることがありますか？", "f": ["Could it be drawing, building, or performing?", "Where could that skill help later?"]}, {"n": "QUESTION 4", "t": "How can an abandoned childhood dream still shape an adult's choices?", "ja": "諦めた子どもの頃の夢は、大人の選択にどう影響し続けますか？", "f": ["Could the old dream become a hobby?", "Where might it appear in adult life?"]}, {"n": "QUESTION 5", "t": "Which hidden part of a dream job becomes clear only with adult experience?", "ja": "夢の仕事のどんな見えない部分が、大人の経験を通して初めて分かりますか？", "f": ["Which part was missing from the childhood picture?", "Would you still try it for one day?"]}, {"n": "QUESTION 6", "t": "What part of your childhood dream would still suit you today?", "ja": "子どもの頃の夢のどんな部分なら、今の自分にも合いそうですか？", "f": ["What no longer suits you?", "Would you still try it for one day?"]}]}, {"n": 9, "title": "돌아가고 싶은 하루", "sub": "戻ってみたい一日", "titles": {"ko": "돌아가고 싶은 하루", "en": "One day you would go back to", "ja": "戻ってみたい一日"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-came-before-full/84-one-day-you-would-go-back-to/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-full/84-one-day-you-would-go-back-to/lecture/index.html", "source": "courses/en/talk-what-came-before-full/lessons/84-one-day-you-would-go-back-to/lecture/index.html"}, {"href": "view/talk-what-came-before-full/84-one-day-you-would-go-back-to/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-full/84-one-day-you-would-go-back-to/prestudy/index.html", "source": "courses/en/talk-what-came-before-full/lessons/84-one-day-you-would-go-back-to/prestudy/index.html"}], "goal": {"t": "Let's imagine one meaningful visit to the past. Please read the title aloud.", "ja": "意味のある過去への一日旅行を想像しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "If you could witness one day in the past, which day would be worth seeing?", "ja": "過去の一日を目撃できるなら、どの日を見る価値がありますか？", "f": ["Would you choose a personal day or a famous event?", "Where would you arrive?"]}, {"n": "WARM-UP 2", "t": "Would an ordinary day or a famous day reveal more about the past?", "ja": "普通の一日と有名な日のどちらが、過去についてより多くを教えてくれますか？", "f": ["Would an ordinary family day or a famous event be more interesting?", "What would you watch first?"]}, {"n": "QUESTION 1", "t": "What mystery could one day in the past help solve?", "ja": "過去の一日を見ることで、どんな謎を解けそうですか？", "f": ["Would you want to understand a person or an event?", "What might a visitor still get wrong?"]}, {"n": "QUESTION 2", "t": "If a visit to the past allowed one action, would you observe or step in?", "ja": "過去への訪問で一つ行動できるなら、見るだけにしますか、それとも関わりますか？", "f": ["What could change if the visitor stepped in?", "What could they learn by only watching?"]}, {"n": "QUESTION 3", "t": "Who from the past would you most like to spend one ordinary day with?", "ja": "過去の誰と、普通の一日を一緒に過ごしたいですか？", "f": ["What would you want to notice?", "Would you choose a relative or a public figure?"]}, {"n": "QUESTION 4", "t": "What would you ask someone from the past?", "ja": "過去の人に何を聞きたいですか？", "f": ["Would you ask about daily life or an important event?", "What answer might surprise you?"]}, {"n": "QUESTION 5", "t": "What part of the present might feel different after seeing the past directly?", "ja": "過去を直接見た後、現在のどんな部分が違って感じられるでしょうか？", "f": ["Would the present seem easier or harder?", "Could seeing an ordinary past day change your view?"]}, {"n": "QUESTION 6", "t": "What is one day in the past you would rather leave alone?", "ja": "過去の一日で、あえて見ないままにしておきたい日はありますか？", "f": ["Would it be personal or historical?", "Why might not seeing it be better?"]}]}, {"n": 10, "title": "자라면서 달라진 가족의 전통", "sub": "成長とともに変わった家族の習慣", "titles": {"ko": "자라면서 달라진 가족의 전통", "en": "A family tradition that changed as you grew up", "ja": "成長とともに変わった家族の習慣"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-came-before-full/85-a-turning-point-in-your-life/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-full/85-a-turning-point-in-your-life/lecture/index.html", "source": "courses/en/talk-what-came-before-full/lessons/85-a-turning-point-in-your-life/lecture/index.html"}, {"href": "view/talk-what-came-before-full/85-a-turning-point-in-your-life/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-full/85-a-turning-point-in-your-life/prestudy/index.html", "source": "courses/en/talk-what-came-before-full/lessons/85-a-turning-point-in-your-life/prestudy/index.html"}], "goal": {"t": "Let's describe a family tradition, how it changed, and which parts are worth carrying forward. Please read the title aloud.", "ja": "家族の習慣とその変化、これからも残したい部分について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which family tradition do you remember most clearly?", "ja": "最もはっきり覚えている家族の習慣は何ですか？", "f": ["When did it happen?", "Would birthdays or holiday meals count?"]}, {"n": "WARM-UP 2", "t": "What small detail made that tradition feel special?", "ja": "その習慣を特別にしていた小さなことは何ですか？", "f": ["Was it a food, place, or phrase?", "Who noticed that detail most?"]}, {"n": "QUESTION 1", "t": "Who kept the tradition going?", "ja": "その習慣を続けていたのは誰ですか？", "f": ["What did that person do?", "Did anyone else take over later?"]}, {"n": "QUESTION 2", "t": "How did the tradition change as people got older or moved away?", "ja": "家族が年を重ねたり離れて暮らしたりする中で、その習慣はどう変わりましたか？", "f": ["What became harder?", "What stayed the same?"]}, {"n": "QUESTION 3", "t": "Which part of an old family tradition is worth keeping?", "ja": "昔からの家族の習慣で、残す価値があるのはどの部分ですか？", "f": ["Why does it still matter?", "Could it work in a smaller form?"]}, {"n": "QUESTION 4", "t": "What part would you happily change or stop?", "ja": "喜んで変えたり、やめたりしたい部分は何ですか？", "f": ["Why no longer keep it?", "Who might disagree?"]}, {"n": "QUESTION 5", "t": "Can a new family tradition become meaningful quickly?", "ja": "新しい家族の習慣でも、すぐに大切なものになれますか？", "f": ["What would help it last?", "Does it need to happen every year?"]}, {"n": "QUESTION 6", "t": "What tradition would you like to start for the future?", "ja": "これから始めたい習慣は何ですか？", "f": ["Who would you include?", "What would make it easy to continue?"]}]}, {"n": 11, "title": "어릴 때의 나", "sub": "子どもの頃の自分", "titles": {"ko": "어릴 때의 나", "en": "What you were like as a child", "ja": "子どもの頃の自分"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-came-before-full/86-what-you-were-like-as-a-child/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-full/86-what-you-were-like-as-a-child/lecture/index.html", "source": "courses/en/talk-what-came-before-full/lessons/86-what-you-were-like-as-a-child/lecture/index.html"}, {"href": "view/talk-what-came-before-full/86-what-you-were-like-as-a-child/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-full/86-what-you-were-like-as-a-child/prestudy/index.html", "source": "courses/en/talk-what-came-before-full/lessons/86-what-you-were-like-as-a-child/prestudy/index.html"}], "goal": {"t": "Let's compare different views of the same childhood self. Please read the title aloud.", "ja": "同じ子どもの頃の姿を、違う視点から比べてみましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What part of your childhood personality is easiest to recognize now?", "ja": "子どもの頃の性格のどんな部分が、今も最も分かりやすく残っていますか？", "f": ["What story shows that?", "What do adults usually notice first about a child?"]}, {"n": "WARM-UP 2", "t": "Which childhood trait can grow into a strength in adulthood?", "ja": "子どもの頃のどんな特徴が、大人になると強みになり得ますか？", "f": ["How might that trait help an adult?", "When might it still cause difficulty?"]}, {"n": "QUESTION 1", "t": "Why can two people remember the same child differently?", "ja": "二人の人が同じ子どもを違って覚えていることがあるのはなぜですか？", "f": ["Which setting could explain the difference?", "What might both memories get right?"]}, {"n": "QUESTION 2", "t": "Which ordinary childhood moment can reveal more than a simple label?", "ja": "どんな普通の子どもの頃の瞬間が、単純な呼び方より多くを表しますか？", "f": ["Could sharing, arguing, or helping show someone's character?", "Who might remember the moment differently?"]}, {"n": "QUESTION 3", "t": "How much can a child's behaviour change with the people and setting?", "ja": "一緒にいる人や場所によって、子どもの行動はどのくらい変わりますか？", "f": ["Which person or setting changes the child's behaviour most?", "Can both quiet and talkative behaviour be genuine?"]}, {"n": "QUESTION 4", "t": "Which good childhood quality do adults often lose?", "ja": "大人が失いがちな、子どもの頃のよい性質は何ですか？", "f": ["Would curiosity or playfulness be a good example?", "Why is it hard for adults to keep?"]}, {"n": "QUESTION 5", "t": "What might a label like 'shy' or 'difficult' fail to show about a child?", "ja": "「恥ずかしがり屋」や「難しい子」という呼び方では、子どものどんな部分が見えなくなりますか？", "f": ["What might people miss about the child's situation?", "How could the label be fairer?"]}, {"n": "QUESTION 6", "t": "What might your childhood self find strange about you now?", "ja": "子どもの頃の自分は、今の自分の何を不思議に思いそうですか？", "f": ["Would your work, home, or phone surprise your childhood self?", "What would still feel familiar?"]}]}, {"n": 12, "title": "이제는 사라진 어린 시절의 장소", "sub": "もう存在しない子どもの頃の場所", "titles": {"ko": "이제는 사라진 어린 시절의 장소", "en": "A childhood place that no longer exists", "ja": "もう存在しない子どもの頃の場所"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-came-before-full/87-a-childhood-place-that-no-longer-exists/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-full/87-a-childhood-place-that-no-longer-exists/lecture/index.html", "source": "courses/en/talk-what-came-before-full/lessons/87-a-childhood-place-that-no-longer-exists/lecture/index.html"}, {"href": "view/talk-what-came-before-full/87-a-childhood-place-that-no-longer-exists/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-full/87-a-childhood-place-that-no-longer-exists/prestudy/index.html", "source": "courses/en/talk-what-came-before-full/lessons/87-a-childhood-place-that-no-longer-exists/prestudy/index.html"}], "goal": {"t": "Let's remember a place that disappeared and what it meant. Please read the title aloud.", "ja": "なくなった場所と、そこにあった意味を振り返りましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which lost place would be most valuable to bring back for one day?", "ja": "失われた場所のうち、一日だけ戻す価値が最も高い場所はどこですか？", "f": ["Would you choose a shop, school, park, or famous building?", "Who would enjoy seeing it again?"]}, {"n": "WARM-UP 2", "t": "Which sound, smell, or small feature can bring a lost place back to mind?", "ja": "どんな音、匂い、小さな特徴が、失われた場所を心によみがえらせますか？", "f": ["Why does that detail stay in memory?", "Would a photo capture it?"]}, {"n": "QUESTION 1", "t": "What can make an ordinary shop, park, or street feel irreplaceable?", "ja": "普通の店、公園、通りが、かけがえのないものに感じられるのはなぜですか？", "f": ["Which ordinary routine gives the place meaning?", "Who might remember the place differently?"]}, {"n": "QUESTION 2", "t": "Which kinds of change are hardest for small local places to survive?", "ja": "小さな地元の場所が生き残りにくいのは、どんな変化ですか？", "f": ["Is money or changing habits usually the bigger problem?", "What could help a local place survive?"]}, {"n": "QUESTION 3", "t": "What would you do if you knew a favourite place was about to disappear?", "ja": "お気に入りの場所がもうすぐなくなると分かったら、何をしますか？", "f": ["Would you take a photo, buy something, or talk to the owner?", "What do people usually want before a favourite shop closes?"]}, {"n": "QUESTION 4", "t": "Can a new place respect what people valued about the old one?", "ja": "新しい場所は、古い場所で人々が大切にしたものを尊重できますか？", "f": ["Should it keep the old name, use, or atmosphere?", "When is a completely new place better?"]}, {"n": "QUESTION 5", "t": "How can a change be practical and still feel sad?", "ja": "変化が実用的でも悲しく感じられるのはなぜですか？", "f": ["What feels most clearly lost?", "What makes the change understandable?"]}, {"n": "QUESTION 6", "t": "How should a community remember a place that no longer exists?", "ja": "もう存在しない場所を、地域はどのように記憶に残すべきですか？", "f": ["Would you preserve a sign, photo, or recipe?", "Who would value it?"]}]}, {"n": 13, "title": "완전히 잘못 알고 있던 것", "sub": "完全に間違っていたこと", "titles": {"ko": "완전히 잘못 알고 있던 것", "en": "Something you were completely wrong about", "ja": "完全に間違っていたこと"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-came-before-full/88-something-you-were-completely-wrong-about/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-full/88-something-you-were-completely-wrong-about/lecture/index.html", "source": "courses/en/talk-what-came-before-full/lessons/88-something-you-were-completely-wrong-about/lecture/index.html"}, {"href": "view/talk-what-came-before-full/88-something-you-were-completely-wrong-about/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-full/88-something-you-were-completely-wrong-about/prestudy/index.html", "source": "courses/en/talk-what-came-before-full/lessons/88-something-you-were-completely-wrong-about/prestudy/index.html"}], "goal": {"t": "Let's examine how a confident belief can turn out to be wrong. Please read the title aloud.", "ja": "確信していた考えが、どう間違いだと分かるのか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's something people used to believe that surprises you now?", "ja": "昔の人が信じていたことで、今のあなたが驚くものは何ですか？", "f": ["Why did it sound true?", "What did people once believe about health or science?"]}, {"n": "WARM-UP 2", "t": "Which small misconception is surprisingly hard to correct?", "ja": "意外に訂正しにくい小さな思い違いは何ですか？", "f": ["Why does the wrong answer sound right?", "Would a myth about food or animals be a good example?"]}, {"n": "QUESTION 1", "t": "What lets a wrong belief survive even when better information is available?", "ja": "よりよい情報があっても、間違った考えが残るのはなぜですか？", "f": ["Why do people keep repeating it?", "What might finally weaken it?"]}, {"n": "QUESTION 2", "t": "Why can the source of a wrong idea still seem trustworthy?", "ja": "間違った考えの情報源でも、信頼できそうに見えるのはなぜですか？", "f": ["Which sources seem believable?", "How can someone check the original claim?"]}, {"n": "QUESTION 3", "t": "What makes a correction easier to accept?", "ja": "訂正を受け入れやすくするものは何ですか？", "f": ["Would a clear example or a trusted source help more?", "When might a person still refuse to change their mind?"]}, {"n": "QUESTION 4", "t": "How can embarrassment keep a person defending an idea they doubt?", "ja": "恥ずかしさによって、疑っている考えを守り続けてしまうのはなぜですか？", "f": ["What makes admitting it feel personal?", "How can someone correct the idea without embarrassing the person?"]}, {"n": "QUESTION 5", "t": "What checking habit can someone learn from being confidently wrong?", "ja": "自信を持って間違えた経験から、どんな確認の習慣を学べますか？", "f": ["Would checking a second source help?", "When is that habit most useful?"]}, {"n": "QUESTION 6", "t": "How confident should you sound when you are not sure a claim is true?", "ja": "ある主張が本当か確信がないとき、どのくらい自信を持って話すべきですか？", "f": ["Would you say 'maybe' or give a percentage?", "How certain are you about tomorrow's weather?"]}]}]}, {"no": 17, "label": "17코스", "title": "만약에", "titles": {"ko": "만약에", "en": "What if", "ja": "もしも"}, "subtitle": "(中級) もしも", "desc": {"ko": "가상의 선택을 빠르게 고르고 이유와 결과를 확장해서 말한다.", "en": "Pick fast in a hypothetical, then open out the reason and what would follow.", "ja": "仮の選択を素早く決め、理由と結果を広げて話す。"}, "cover": "covers/talk-what-if-accessible.webp", "levels": ["B1"], "level": "B1", "slug": "talk-what-if-accessible", "lessons": [{"n": 1, "title": "복권에 당첨되면 실제로 할 일", "sub": "宝くじに当たったら本当にすること", "titles": {"ko": "복권에 당첨되면 실제로 할 일", "en": "What you would really do if you won the lottery", "ja": "宝くじに当たったら本当にすること"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-if-accessible/89-what-you-would-really-do-if-you-won-the-lottery/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-accessible/89-what-you-would-really-do-if-you-won-the-lottery/lecture/index.html", "source": "courses/en/talk-what-if-accessible/lessons/89-what-you-would-really-do-if-you-won-the-lottery/lecture/index.html"}, {"href": "view/talk-what-if-accessible/89-what-you-would-really-do-if-you-won-the-lottery/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-accessible/89-what-you-would-really-do-if-you-won-the-lottery/prestudy/index.html", "source": "courses/en/talk-what-if-accessible/lessons/89-what-you-would-really-do-if-you-won-the-lottery/prestudy/index.html"}], "goal": {"t": "Let's imagine how a large lottery win could change everyday life. Please read the title aloud.", "ja": "宝くじで大当たりしたら、日常がどう変わるか想像しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Imagine you win a large lottery prize tomorrow. What would you do first?", "ja": "明日、宝くじで大当たりしたと想像してください。最初に何をしますか？", "f": ["Would you call someone, make a plan, or do nothing for a day?", "What would you avoid doing immediately?"]}, {"n": "WARM-UP 2", "t": "Whose advice, if anyone, would you want before making a big decision?", "ja": "大きな決断をする前に、相談したい相手はいますか？", "f": ["What could that person help you notice?", "If you asked no one, how would you slow the decision down?"]}, {"n": "QUESTION 1", "t": "Who, if anyone, would need to know about the win?", "ja": "当選について、知らせる必要がある人がいるとすれば誰ですか？", "f": ["Who would have a practical reason to know?", "What benefit could privacy provide?"]}, {"n": "QUESTION 2", "t": "What part of your life would you want to keep exactly the same?", "ja": "当選しても、今の生活のどんな部分をまったく変えずに残したいですか？", "f": ["Would you keep your home, routine, or hobbies?", "What might money change anyway?"]}, {"n": "QUESTION 3", "t": "What's the first thing you would buy for someone else?", "ja": "ほかの人のために最初に買うものは何ですか？", "f": ["Would you choose a gift, a trip, or practical help?", "If you bought nothing, how else could you share the money?"]}, {"n": "QUESTION 4", "t": "What’s the easiest mistake for a lottery winner to make?", "ja": "宝くじに当たった人が、最もしやすい失敗は何ですか？", "f": ["Spending too fast or trusting the wrong person?", "What would help someone avoid it?"]}, {"n": "QUESTION 5", "t": "What would you want to keep normal after becoming rich?", "ja": "お金持ちになっても、何を普通のままにしておきたいですか？", "f": ["Why is that part worth protecting?", "Would sudden wealth make ordinary friendships harder?"]}, {"n": "QUESTION 6", "t": "What’s one problem that money could make easier but not solve?", "ja": "お金で楽にはできても、解決はできない問題を一つ挙げるとしたら何ですか？", "f": ["Would loneliness or poor health be a good example?", "What else would help?"]}]}, {"n": 2, "title": "무인도에 가져갈 세 가지", "sub": "無人島に持っていく三つの物", "titles": {"ko": "무인도에 가져갈 세 가지", "en": "Three things you would take to a desert island", "ja": "無人島に持っていく三つの物"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-if-accessible/90-three-things-you-would-take-to-a-desert-island/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-accessible/90-three-things-you-would-take-to-a-desert-island/lecture/index.html", "source": "courses/en/talk-what-if-accessible/lessons/90-three-things-you-would-take-to-a-desert-island/lecture/index.html"}, {"href": "view/talk-what-if-accessible/90-three-things-you-would-take-to-a-desert-island/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-accessible/90-three-things-you-would-take-to-a-desert-island/prestudy/index.html", "source": "courses/en/talk-what-if-accessible/lessons/90-three-things-you-would-take-to-a-desert-island/prestudy/index.html"}], "goal": {"t": "Let's choose what would matter most on a desert island. Please read the title aloud.", "ja": "無人島で最も大切になるものを選びましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which problem would be hardest to face on your first day on a desert island?", "ja": "無人島での最初の一日に、どの問題に向き合うのが最も大変ですか？", "f": ["Would water, shelter, or being alone worry you most?", "What could make the first day easier?"]}, {"n": "WARM-UP 2", "t": "If you could take only three things, what would you choose?", "ja": "三つだけ持って行けるなら、何を選びますか？", "f": ["Which one would help you survive first?", "Which one would make you feel less alone?"]}, {"n": "QUESTION 1", "t": "What ordinary object could solve two different problems on the island?", "ja": "島で二つの問題を解決できそうな普通の物は何ですか？", "f": ["Would a pot, rope, or mirror work?", "What two problems would it solve?"]}, {"n": "QUESTION 2", "t": "Would one comfort item be worth taking to a desert island?", "ja": "無人島に、気持ちを楽にする物を一つ持って行く価値はありますか？", "f": ["Would you choose music, a book, or a favourite snack?", "If you took none, what practical item would replace it?"]}, {"n": "QUESTION 3", "t": "What would you regret not bringing after the first night?", "ja": "最初の夜の後、持ってこなかったことを後悔しそうな物は何ですか？", "f": ["Would you miss a light, blanket, or tool most?", "What could replace it?"]}, {"n": "QUESTION 4", "t": "Would you choose different island supplies in cold weather?", "ja": "寒い天気の島なら、違う道具を選びますか？", "f": ["Would warm clothing or a fire tool come first?", "Which tropical item would be less useful?"]}, {"n": "QUESTION 5", "t": "What could one good companion provide that no object could?", "ja": "よい仲間一人は、どんな物にもできない何を与えてくれますか？", "f": ["What would you share responsibility for?", "What would be easier alone?"]}, {"n": "QUESTION 6", "t": "After a week, which of your three choices might you regret?", "ja": "一週間後、選んだ三つのうち、どれを後悔しそうですか？", "f": ["What would you wish you had brought instead?", "Which choice would still feel right?"]}]}, {"n": 3, "title": "하루 동안 인생을 바꿔 보고 싶은 사람", "sub": "一日だけ人生を入れ替えたい人", "titles": {"ko": "하루 동안 인생을 바꿔 보고 싶은 사람", "en": "Someone you would trade lives with for a day", "ja": "一日だけ人生を入れ替えたい人"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-if-accessible/91-someone-you-would-trade-lives-with-for-a-day/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-accessible/91-someone-you-would-trade-lives-with-for-a-day/lecture/index.html", "source": "courses/en/talk-what-if-accessible/lessons/91-someone-you-would-trade-lives-with-for-a-day/lecture/index.html"}, {"href": "view/talk-what-if-accessible/91-someone-you-would-trade-lives-with-for-a-day/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-accessible/91-someone-you-would-trade-lives-with-for-a-day/prestudy/index.html", "source": "courses/en/talk-what-if-accessible/lessons/91-someone-you-would-trade-lives-with-for-a-day/prestudy/index.html"}], "goal": {"t": "Let's explore what one day in another life could teach us. Please read the title aloud.", "ja": "別の人生を一日体験すると何が分かるか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Whose daily life would you be curious to experience for one day?", "ja": "誰の日常生活を一日体験してみたいですか？", "f": ["Would you choose a famous person, a doctor, or someone from another country?", "Which part of their day would you want to see?"]}, {"n": "WARM-UP 2", "t": "Would you choose someone famous or someone with a very different ordinary life?", "ja": "有名な人と、全く違う普通の生活をする人のどちらを選びますか？", "f": ["What would fame let you experience?", "What could an ordinary life teach instead?"]}, {"n": "QUESTION 1", "t": "What would you do in the first hour of another person's life?", "ja": "別の人の人生を体験する最初の一時間に何をしますか？", "f": ["Would you explore their home, work, or neighbourhood?", "What would you avoid doing?"]}, {"n": "QUESTION 2", "t": "What would you want to learn that an interview couldn't tell you?", "ja": "インタビューでは分からない何を知りたいですか？", "f": ["What could one day show you?", "What would still be impossible to know?"]}, {"n": "QUESTION 3", "t": "Which attractive life might be much harder in private?", "ja": "魅力的に見えても、実際にはずっと大変そうな生活は何ですか？", "f": ["Would a celebrity's life or a luxury lifestyle be a good example?", "What hidden responsibility might appear?"]}, {"n": "QUESTION 4", "t": "What would be unfair to look at or learn during the life swap?", "ja": "人生を交換している間でも、見たり知ったりするのは不公平だと思うものは何ですか？", "f": ["Would private messages be off-limits?", "Would you want the same rule for your own life?"]}, {"n": "QUESTION 5", "t": "Which part of your own life might you appreciate more afterward?", "ja": "その後、自分の生活のどんな部分をもっと大切に感じそうですか？", "f": ["Would you appreciate your home, free time, or relationships more?", "What might you miss from the other life?"]}, {"n": "QUESTION 6", "t": "What might another person misunderstand after one day in your life?", "ja": "あなたの生活を一日体験した人は、何を誤解しそうですか？", "f": ["Which routine might surprise them?", "What would take longer than one day to understand?"]}]}, {"n": 4, "title": "고르고 싶은 초능력", "sub": "選びたい超能力", "titles": {"ko": "고르고 싶은 초능력", "en": "The superpower you would choose", "ja": "選びたい超能力"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-if-accessible/92-the-superpower-you-would-choose/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-accessible/92-the-superpower-you-would-choose/lecture/index.html", "source": "courses/en/talk-what-if-accessible/lessons/92-the-superpower-you-would-choose/lecture/index.html"}, {"href": "view/talk-what-if-accessible/92-the-superpower-you-would-choose/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-accessible/92-the-superpower-you-would-choose/prestudy/index.html", "source": "courses/en/talk-what-if-accessible/lessons/92-the-superpower-you-would-choose/prestudy/index.html"}], "goal": {"t": "Let's choose a superpower and examine its real consequences. Please read the title aloud.", "ja": "超能力を一つ選び、実際にどんな結果が生まれるか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which superpower would make ordinary life most interesting?", "ja": "どの超能力が普通の生活を最も面白くしますか？", "f": ["Would flying, stopping time, or reading minds improve daily life most?", "What problem could that power create?"]}, {"n": "WARM-UP 2", "t": "If you got a superpower, how would you test it safely?", "ja": "超能力を得たら、どうやって安全に試しますか？", "f": ["Would you test it alone or with someone nearby?", "What could go wrong?"]}, {"n": "QUESTION 1", "t": "Would you tell someone close to you about a superpower?", "ja": "親しい人に超能力のことを話しますか？", "f": ["Would telling one person make the power safer?", "What could secrecy protect?"]}, {"n": "QUESTION 2", "t": "Which useful superpower would be hardest to keep secret?", "ja": "役に立つ超能力のうち、最も秘密にしにくいものは何ですか？", "f": ["Why would people notice?", "Could you use it without being seen?"]}, {"n": "QUESTION 3", "t": "Which useful-looking superpower would you refuse?", "ja": "役立ちそうでも断りたい超能力は何ですか？", "f": ["Would reading minds or never sleeping be too costly?", "Could a safe limit change your answer?"]}, {"n": "QUESTION 4", "t": "Which superpower would cause the most trouble if everyone had it?", "ja": "全員が持つと最も大きな問題を起こす超能力は何ですか？", "f": ["Why would that power become dangerous on a large scale?", "Would stopping time or reading minds cause more trouble?"]}, {"n": "QUESTION 5", "t": "What one rule would you set for using a superpower?", "ja": "超能力を使うために、どんなルールを一つ決めますか？", "f": ["What temptation would the rule control?", "Should a superpower ever be used without permission?"]}, {"n": "QUESTION 6", "t": "What ordinary skill is better than a superpower in real life?", "ja": "現実では、どんな普通の能力が超能力より役立ちますか？", "f": ["Would patience, clear communication, or first aid be a good example?", "How can someone improve that skill?"]}]}, {"n": 5, "title": "평생 먹을 수 있는 한 가지 음식", "sub": "一生食べ続けられる一つの食べ物", "titles": {"ko": "평생 먹을 수 있는 한 가지 음식", "en": "The one food you could eat forever", "ja": "一生食べ続けられる一つの食べ物"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-if-accessible/93-the-one-food-you-could-eat-forever/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-accessible/93-the-one-food-you-could-eat-forever/lecture/index.html", "source": "courses/en/talk-what-if-accessible/lessons/93-the-one-food-you-could-eat-forever/lecture/index.html"}, {"href": "view/talk-what-if-accessible/93-the-one-food-you-could-eat-forever/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-accessible/93-the-one-food-you-could-eat-forever/prestudy/index.html", "source": "courses/en/talk-what-if-accessible/lessons/93-the-one-food-you-could-eat-forever/prestudy/index.html"}], "goal": {"t": "Let's test what makes one food enjoyable over time. Please read the title aloud.", "ja": "一つの食べ物を長く楽しめる条件について話しましょう。タイト
