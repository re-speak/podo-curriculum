the other person?", "ja": "その癖は、相手にどんな影響を与えるかもしれませんか？", "f": ["What might they assume?", "What might they need from you instead?"]}, {"n": "QUESTION 4", "t": "When does explaining the habit start to sound like an excuse?", "ja": "その癖の説明が、言い訳に聞こえ始めるのはどんなときですか？", "f": ["What responsibility still belongs to you?", "What action would make the explanation believable?"]}, {"n": "QUESTION 5", "t": "What might make you fall back into the habit?", "ja": "何があると、その癖に戻ってしまいそうですか？", "f": ["Does stress or tiredness make it harder?", "How could you notice it earlier?"]}, {"n": "QUESTION 6", "t": "Now the opposite: what's one healthy habit you already bring to relationships?", "ja": "では逆に、人間関係ですでにできているよい習慣は何ですか？", "f": ["How does it appear in daily life?", "Why might other people overlook it?"]}]}, {"n": 5, "title": "내 결혼식에 꼭 있어야 할 한 가지", "sub": "自分の結婚式に欠かせない一つのこと", "titles": {"ko": "내 결혼식에 꼭 있어야 할 한 가지", "en": "One thing your wedding would have to include", "ja": "自分の結婚式に欠かせない一つのこと"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-love-and-marriage-full/61-one-thing-your-wedding-would-have-to-include/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-love-and-marriage-full/61-one-thing-your-wedding-would-have-to-include/lecture/index.html", "source": "courses/en/talk-love-and-marriage-full/lessons/61-one-thing-your-wedding-would-have-to-include/lecture/index.html"}, {"href": "view/talk-love-and-marriage-full/61-one-thing-your-wedding-would-have-to-include/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-love-and-marriage-full/61-one-thing-your-wedding-would-have-to-include/prestudy/index.html", "source": "courses/en/talk-love-and-marriage-full/lessons/61-one-thing-your-wedding-would-have-to-include/prestudy/index.html"}], "goal": {"t": "Let's talk about what can make a wedding meaningful. Please read the title aloud.", "ja": "結婚式を意味のあるものにする要素について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "If you had a wedding tomorrow, what one thing would have to be there?", "ja": "もし明日結婚式を開くなら、どの一つの要素が必須ですか？", "f": ["How would guests notice that element?", "Which family member might value it too?"]}, {"n": "WARM-UP 2", "t": "Which wedding tradition would you definitely keep?", "ja": "結婚式の習慣の中で、絶対に残したいものはどれですか？", "f": ["Why does it matter to you?", "How would you make it fit the couple?"]}, {"n": "QUESTION 1", "t": "If one common wedding tradition had to go, which would you choose?", "ja": "よくある結婚式の習慣を一つなくすなら、どれを選びますか？", "f": ["Which source of stress would disappear?", "Would the couple, family, or guests miss it most?"]}, {"n": "QUESTION 2", "t": "How should a couple and their families share wedding decisions?", "ja": "結婚式の決定権は、二人と家族の間でどう分けるべきですか？", "f": ["Which decision could legitimately involve family?", "Which choice should remain private to the couple?"]}, {"n": "QUESTION 3", "t": "What makes one wedding detail truly memorable?", "ja": "結婚式の一つの演出を本当に心に残るものにするのは、どんな特徴ですか？", "f": ["Could the element feel special without costing much?", "How would it work with only a few guests?"]}, {"n": "QUESTION 4", "t": "What part of a wedding creates the most unnecessary stress?", "ja": "結婚式で、いちばん余計なストレスを生むのはどの部分ですか？", "f": ["Who carries most of that stress?", "Which one change would lower it fastest?"]}, {"n": "QUESTION 5", "t": "Can a private ceremony feel more personal than a large public celebration?", "ja": "私的な式のほうが、大規模な公の祝いより個人的に感じられますか？", "f": ["What would become easier at a private ceremony?", "Which part of a large celebration would be hardest to give up?"]}, {"n": "QUESTION 6", "t": "What should be the main purpose of a wedding?", "ja": "結婚式を開く人たちにとって、どんな中心的な目的が式を導くべきですか？", "f": ["Should the couple, the families, or the guests come first?", "Which wedding decision would make that priority visible?"]}]}, {"n": 6, "title": "극복하기 힘들었던 이별", "sub": "立ち直るのが難しかった別れ", "titles": {"ko": "극복하기 힘들었던 이별", "en": "A breakup that was hard to get over", "ja": "立ち直るのが難しかった別れ"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-love-and-marriage-full/62-a-breakup-that-was-hard-to-get-over/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-love-and-marriage-full/62-a-breakup-that-was-hard-to-get-over/lecture/index.html", "source": "courses/en/talk-love-and-marriage-full/lessons/62-a-breakup-that-was-hard-to-get-over/lecture/index.html"}, {"href": "view/talk-love-and-marriage-full/62-a-breakup-that-was-hard-to-get-over/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-love-and-marriage-full/62-a-breakup-that-was-hard-to-get-over/prestudy/index.html", "source": "courses/en/talk-love-and-marriage-full/lessons/62-a-breakup-that-was-hard-to-get-over/prestudy/index.html"}], "goal": {"t": "Let's talk about why breakups can be difficult and what helps people recover. Please read the title aloud.", "ja": "別れが難しい理由と、立ち直るために役立つことを話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Why can some breakups be especially hard to get over?", "ja": "なぜ、立ち直るのが特に難しい別れがあるのでしょうか？", "f": ["Which shared plan, place, or routine also disappears?", "What part of the changed future may take longest to accept?"]}, {"n": "WARM-UP 2", "t": "What change after a breakup can be hardest to get used to?", "ja": "別れのあと、どの変化に慣れるのが最も難しいですか？", "f": ["What is the first everyday habit that usually changes?", "Which practical change can catch people by surprise?"]}, {"n": "QUESTION 1", "t": "What affects how quickly someone recovers after a breakup?", "ja": "関係が終わった後、回復の速さを左右するのはどんな要因ですか？", "f": ["Does the way the relationship ended affect recovery?", "Which everyday sign would show that life is moving forward?"]}, {"n": "QUESTION 2", "t": "After a breakup, which moments call for time alone and which call for company?", "ja": "別れのあと、どんなときは一人の時間が必要で、どんなときは誰かといるほうがよいですか？", "f": ["What can time alone provide?", "What kind of company would help?"]}, {"n": "QUESTION 3", "t": "What genuinely helps someone start recovering after a breakup?", "ja": "難しい別れから本当の意味で回復し始めるには、何が役立ちますか？", "f": ["Is useful support mainly emotional or practical?", "Which familiar response can make recovery harder?"]}, {"n": "QUESTION 4", "t": "What can someone understand about a breakup only much later?", "ja": "別れから十分に距離を置いて初めて見える事実は何ですか？", "f": ["Which part of the relationship becomes easier to understand later?", "Can time make someone blame one person too much?"]}, {"n": "QUESTION 5", "t": "What kind-sounding breakup advice can actually feel uncaring?", "ja": "善意からの別れへの反応の中で、支えより軽視と感じられるのは何ですか？", "f": ["Why might that advice sound uncaring?", "Which kinder sentence could replace it?"]}, {"n": "QUESTION 6", "t": "What is one sign that someone is moving forward after a breakup?", "ja": "別れのあと、前に進んでいると分かるサインは一つ何ですか？", "f": ["Would close friends notice the sign before the person did?", "Which difficulty could reasonably remain?"]}]}, {"n": 7, "title": "결혼이나 출산을 선택하지 않는 것", "sub": "結婚や子どもを持たない選択", "titles": {"ko": "결혼이나 출산을 선택하지 않는 것", "en": "Choosing not to marry or have children", "ja": "結婚や子どもを持たない選択"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-love-and-marriage-full/63-choosing-not-to-marry-or-have-children/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-love-and-marriage-full/63-choosing-not-to-marry-or-have-children/lecture/index.html", "source": "courses/en/talk-love-and-marriage-full/lessons/63-choosing-not-to-marry-or-have-children/lecture/index.html"}, {"href": "view/talk-love-and-marriage-full/63-choosing-not-to-marry-or-have-children/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-love-and-marriage-full/63-choosing-not-to-marry-or-have-children/prestudy/index.html", "source": "courses/en/talk-love-and-marriage-full/lessons/63-choosing-not-to-marry-or-have-children/prestudy/index.html"}], "goal": {"t": "Let's talk about different choices around marriage and children. Please read the title aloud.", "ja": "結婚や子どもについてのさまざまな選択を話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which feels like the bigger life decision: marriage or having children?", "ja": "結婚と子どもを持つことでは、どちらのほうが大きな人生の決断だと思いますか？", "f": ["Why does that choice feel bigger?", "When should the two decisions be considered separately?"]}, {"n": "WARM-UP 2", "t": "What feels biggest about that decision: daily life, money, freedom, or responsibility?", "ja": "その決断でいちばん大きいのは、日々の暮らし、お金、自由、責任のどれですか？", "f": ["Which part is easiest to imagine?", "Which part do people underestimate?"]}, {"n": "QUESTION 1", "t": "What might make someone want marriage but not children?", "ja": "結婚はしたいけれど、子どもは望まない人には、どんな理由がありそうですか？", "f": ["Could freedom, health, or responsibility matter?", "How might a partner's wishes affect the choice?"]}, {"n": "QUESTION 2", "t": "What might make someone want children but not marriage?", "ja": "子どもは望むけれど、結婚は望まない人には、どんな理由がありそうですか？", "f": ["What kind of support would they need?", "How would daily life differ?"]}, {"n": "QUESTION 3", "t": "How much should family opinions matter in these decisions?", "ja": "こうした決断に、家族の意見はどのくらい影響してよいと思いますか？", "f": ["When does concern become pressure?", "Which question should relatives avoid?"]}, {"n": "QUESTION 4", "t": "Which should matter more: what you want now or what you might want later?", "ja": "今の希望と、将来気が変わる可能性では、どちらを大切にすべきですか？", "f": ["Is \"I haven't decided\" a complete answer?", "What information could help someone decide?"]}, {"n": "QUESTION 5", "t": "What could make someone change their mind about marriage or children?", "ja": "結婚や子どもについて、人の考えが変わるきっかけは何だと思いますか？", "f": ["Could money, health, or a relationship change it?", "Is changing one's mind a problem?"]}, {"n": "QUESTION 6", "t": "Imagine your ideal life ten years from now. Who is part of it?", "ja": "10年後の理想の暮らしを想像してください。そこには誰がいますか？", "f": ["What does an ordinary day look like?", "Which part of that life matters most?"]}]}]}, {"no": 13, "label": "13코스", "title": "일과 돈", "titles": {"ko": "일과 돈", "en": "Work and money", "ja": "仕事とお金"}, "subtitle": "(中級) 仕事とお金", "desc": {"ko": "숫자와 장면이 있는 일·돈 경험을 말한다.", "en": "Talk about work and money with real numbers and a real scene attached.", "ja": "数字と場面のある仕事とお金の経験を話す。"}, "cover": "covers/talk-work-and-money-accessible.webp", "levels": ["B1"], "level": "B1", "slug": "talk-work-and-money-accessible", "lessons": [{"n": 1, "title": "첫 월급으로 한 일", "sub": "初めての給料で何をしたか", "titles": {"ko": "첫 월급으로 한 일", "en": "What you did with your first paycheck", "ja": "初めての給料で何をしたか"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-work-and-money-accessible/64-what-you-did-with-your-first-paycheck/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-accessible/64-what-you-did-with-your-first-paycheck/lecture/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/64-what-you-did-with-your-first-paycheck/lecture/index.html"}, {"href": "view/talk-work-and-money-accessible/64-what-you-did-with-your-first-paycheck/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-accessible/64-what-you-did-with-your-first-paycheck/prestudy/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/64-what-you-did-with-your-first-paycheck/prestudy/index.html"}], "goal": {"t": "Let's talk about why first earnings can be memorable. Please read the title aloud.", "ja": "初めての収入が記憶に残る理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What was the first thing you ever got paid to do?", "ja": "初めてお金をもらったのは、どんなことをしたときですか？", "f": ["How old were you?", "If you've never been paid, what small job would you try?"]}, {"n": "WARM-UP 2", "t": "What did you do—or what would you like to do—with your first paycheck?", "ja": "初めての給料で、実際にしたこと、またはしてみたいことは何ですか？", "f": ["What would you buy first?", "Would you save any of it?"]}, {"n": "QUESTION 1", "t": "Would you spend your first paycheck on yourself or someone else?", "ja": "初めての給料は、自分のためと誰かのためのどちらに使いたいですか？", "f": ["What would you choose?", "Why that person?"]}, {"n": "QUESTION 2", "t": "What would you want to save part of your first paycheck for?", "ja": "初めての給料の一部を、何のために取っておきたいですか？", "f": ["How much would you keep?", "When would you use it?"]}, {"n": "QUESTION 3", "t": "Who would you tell first about your first paycheck?", "ja": "初めて給料をもらったら、最初に誰に話したいですか？", "f": ["How would they react?", "Why might someone keep it private?"]}, {"n": "QUESTION 4", "t": "Would a very small first paycheck still feel special?", "ja": "初めての給料なら、金額がとても少なくても特別に感じますか？", "f": ["What would make it special?", "When would the amount matter?"]}, {"n": "QUESTION 5", "t": "What changes when you start earning your own money?", "ja": "自分でお金を稼ぎ始めると、何が変わりますか？", "f": ["Do prices feel different?", "What new choice becomes possible?"]}, {"n": "QUESTION 6", "t": "What advice would you give someone about their first paycheck?", "ja": "初めて給料をもらう人に、どんな助言をしますか？", "f": ["What advice should they ignore?", "Would you follow your own advice?"]}]}, {"n": 2, "title": "끝내고 자랑스러웠던 일", "sub": "終えて誇らしかったこと", "titles": {"ko": "끝내고 자랑스러웠던 일", "en": "Something you were proud to finish", "ja": "終えて誇らしかったこと"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-work-and-money-accessible/65-something-you-were-proud-to-finish/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-accessible/65-something-you-were-proud-to-finish/lecture/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/65-something-you-were-proud-to-finish/lecture/index.html"}, {"href": "view/talk-work-and-money-accessible/65-something-you-were-proud-to-finish/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-accessible/65-something-you-were-proud-to-finish/prestudy/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/65-something-you-were-proud-to-finish/prestudy/index.html"}], "goal": {"t": "Let's talk about what makes finishing something feel meaningful. Please read the title aloud.", "ja": "何かをやり終えることが意味を持つ理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which feels more satisfying: completing a long project or finally fixing a small annoyance?", "ja": "長い仕事を終えることと、小さな困りごとをやっと直すことでは、どちらがより満足できますか？", "f": ["What is the clearest sign that the work is complete?", "Who benefits from the finished result?"]}, {"n": "WARM-UP 2", "t": "What's something you finished that took longer than you expected?", "ja": "思ったより時間がかかったけれど、最後まで終えたことは何ですか？", "f": ["What slowed you down?", "What almost made you stop?"]}, {"n": "QUESTION 1", "t": "Would you still feel proud if nobody noticed?", "ja": "誰にも気づかれなくても、誇らしく感じますか？", "f": ["What would still make it worthwhile?", "Whose praise would matter most?"]}, {"n": "QUESTION 2", "t": "Why can saying \"I'm proud of this\" feel uncomfortable?", "ja": "「これを誇りに思う」と言うことが、気まずく感じられるのはなぜですか？", "f": ["Are people afraid of sounding boastful?", "How else can they show pride?"]}, {"n": "QUESTION 3", "t": "Why can one finished task matter much more than another?", "ja": "一つの完了した努力が、別の努力より大きな意味を持つのは何ですか？", "f": ["Which mattered most: the effort, the result, or keeping a promise?", "What personal quality does finishing the work show?"]}, {"n": "QUESTION 4", "t": "What can someone finish without feeling proud of it?", "ja": "完了しても誇りにつながらない結果には、どんなものがありますか？", "f": ["What might be disappointing about the result?", "Could the effort still deserve praise?"]}, {"n": "QUESTION 5", "t": "What kind of finished work would you want people to remember you for?", "ja": "どんな完成した仕事や貢献と、自分の名前を結びつけたいですか？", "f": ["What quality should people notice?", "Would the size of the project matter?"]}, {"n": "QUESTION 6", "t": "How can we praise real effort without sounding empty?", "ja": "曖昧なお世辞ではなく、努力に基づく誇りを支えるにはどうすればよいですか？", "f": ["Which part of the effort deserves attention?", "What question would help the person talk about the work?"]}]}, {"n": 3, "title": "은근히 즐기는 단순한 일", "sub": "実は嫌いではない地味な作業", "titles": {"ko": "은근히 즐기는 단순한 일", "en": "A boring task you secretly enjoy", "ja": "実は嫌いではない地味な作業"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-work-and-money-accessible/66-a-moment-when-you-felt-successful/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-accessible/66-a-moment-when-you-felt-successful/lecture/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/66-a-moment-when-you-felt-successful/lecture/index.html"}, {"href": "view/talk-work-and-money-accessible/66-a-moment-when-you-felt-successful/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-accessible/66-a-moment-when-you-felt-successful/prestudy/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/66-a-moment-when-you-felt-successful/prestudy/index.html"}], "goal": {"t": "Let's talk about repetitive tasks, what makes them satisfying, and when making them easier is worth it. Please read the title aloud.", "ja": "繰り返し作業の楽しさや満足感、楽にする価値があるときを話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which boring task do you mind least: cleaning, sorting, or waiting?", "ja": "掃除、整理、待つことのうち、いちばん苦にならないのはどれですか？", "f": ["What makes it manageable?", "When do you usually do it?"]}, {"n": "WARM-UP 2", "t": "What's a repetitive task you sometimes enjoy?", "ja": "繰り返し作業でも、ときどき楽しいと感じるものは何ですか？", "f": ["What feels satisfying about it?", "Would folding laundry or organizing files count?"]}, {"n": "QUESTION 1", "t": "What can make a boring task feel satisfying?", "ja": "退屈な作業でも、満足感が生まれるのはどんなときですか？", "f": ["Does a clear finish help?", "Do you like seeing the result?"]}, {"n": "QUESTION 2", "t": "Do you prefer doing repetitive tasks alone or with someone?", "ja": "繰り返し作業は、一人でするのと誰かとするのと、どちらが好きですか？", "f": ["Does talking help?", "Which way feels faster?"]}, {"n": "QUESTION 3", "t": "What do you listen to while doing repetitive work?", "ja": "繰り返し作業をするとき、何を聞きますか？", "f": ["Music, a podcast, or silence?", "Does it help you focus?"]}, {"n": "QUESTION 4", "t": "Which boring task do you always put off?", "ja": "いつも後回しにしてしまう退屈な作業は何ですか？", "f": ["What makes it hard to start?", "Would doing five minutes help?"]}, {"n": "QUESTION 5", "t": "When is it worth paying someone else to do a boring task?", "ja": "退屈な作業を誰かに頼んでお金を払う価値があるのは、どんなときですか？", "f": ["Is time or difficulty more important?", "Which task would you never pay for?"]}, {"n": "QUESTION 6", "t": "What small change would make your least favorite task easier?", "ja": "いちばん嫌いな作業を楽にする小さな工夫は何ですか？", "f": ["Would a tool or routine help?", "What would make starting easier?"]}]}, {"n": 4, "title": "더 잘하고 싶은 것", "sub": "もっと上達したいこと", "titles": {"ko": "더 잘하고 싶은 것", "en": "Something you're trying to get better at", "ja": "もっと上達したいこと"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-work-and-money-accessible/67-something-youre-trying-to-get-better-at/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-accessible/67-something-youre-trying-to-get-better-at/lecture/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/67-something-youre-trying-to-get-better-at/lecture/index.html"}, {"href": "view/talk-work-and-money-accessible/67-something-youre-trying-to-get-better-at/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-accessible/67-something-youre-trying-to-get-better-at/prestudy/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/67-something-youre-trying-to-get-better-at/prestudy/index.html"}], "goal": {"t": "Let's talk about practical ways to improve a skill. Please read the title aloud.", "ja": "スキルを伸ばすための実践的な方法について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which skill would make the biggest difference if you improved it?", "ja": "どのスキルを上達させることが、自分にとって最も価値がありますか？", "f": ["Which part of the skill needs the most work?", "What would get easier if the skill improved?"]}, {"n": "WARM-UP 2", "t": "When learning a skill, what helps most: practice, a teacher, a video, or a book?", "ja": "技能を始めるとき、最初に最も役立つのは、練習、先生、動画、本のどれですか？", "f": ["How long would you test that way of learning?", "Could it fit into a normal week?"]}, {"n": "QUESTION 1", "t": "What usually gets in the way when someone is trying to improve a skill?", "ja": "技能を上達させようとするとき、通常は何が妨げになりますか？", "f": ["Is time, money, feedback, or confidence the main problem?", "What is one part the learner can control?"]}, {"n": "QUESTION 2", "t": "What kind of feedback makes the next attempt better?", "ja": "次の取り組みをより効果的にするのは、どんなフィードバックですか？", "f": ["Would feedback from a teacher, friend, or customer help most?", "What is one change the feedback should name?"]}, {"n": "QUESTION 3", "t": "What is the clearest small sign that practice is working?", "ja": "練習が役立っていると分かる、いちばん明確な小さなサインは何ですか？", "f": ["Would the learner or another person notice first?", "What could show progress without a test or score?"]}, {"n": "QUESTION 4", "t": "When is a skill no longer worth the time it takes?", "ja": "どんなときに、学習者はそのスキルから努力を別の方向に向けるべきですか？", "f": ["What benefit would make it worth continuing?", "What change would make stopping sensible?"]}, {"n": "QUESTION 5", "t": "Which small action would help someone improve a skill this week?", "ja": "今週、誰かの技能上達に役立つ小さな行動はどれですか？", "f": ["When could it fit into the week?", "What would make it easy to start?"]}, {"n": "QUESTION 6", "t": "If you introduced a skill to a beginner, what would you teach first?", "ja": "初心者に技能を紹介するなら、最初に何を教えますか？", "f": ["Why should that part come first?", "Which early mistake should be treated as normal?"]}]}, {"n": 5, "title": "쓰지 않은 돈으로 하는 일", "sub": "使わなかったお金でしていること", "titles": {"ko": "쓰지 않은 돈으로 하는 일", "en": "What you do with money you don't spend", "ja": "使わなかったお金でしていること"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-work-and-money-accessible/68-what-you-do-with-money-you-dont-spend/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-accessible/68-what-you-do-with-money-you-dont-spend/lecture/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/68-what-you-do-with-money-you-dont-spend/lecture/index.html"}, {"href": "view/talk-work-and-money-accessible/68-what-you-do-with-money-you-dont-spend/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-accessible/68-what-you-do-with-money-you-dont-spend/prestudy/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/68-what-you-do-with-money-you-dont-spend/prestudy/index.html"}], "goal": {"t": "Let's talk about what money can do besides pay for things. Please read the title aloud.", "ja": "物を買う以外に、お金にできることについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "If you had a little money left this month, what would you do with it?", "ja": "今月少しお金が残ったら、何に使いますか？", "f": ["Would you spend it or save it?", "What current need would come first?"]}, {"n": "WARM-UP 2", "t": "What do you most like saving for: emergencies, a goal, or something fun?", "ja": "緊急時、目標、楽しいことのうち、何のために貯金したいですか？", "f": ["Why does that come first?", "If you do not save now, what would make you start?"]}, {"n": "QUESTION 1", "t": "What helps someone start setting money aside?", "ja": "お金を取っておくことを現実的にする条件は何ですか？", "f": ["Would a bill, a goal, or extra income start the new habit?", "What would help the habit survive a difficult month?"]}, {"n": "QUESTION 2", "t": "What makes a saving or investment plan easy to continue?", "ja": "貯蓄や投資の計画を続けやすくするのは何ですか？", "f": ["Could automation make the plan easier?", "Which change in income or expenses could break the plan?"]}, {"n": "QUESTION 3", "t": "What has the strongest influence on how people save or invest?", "ja": "人の貯蓄や投資のしかたに、最も強く影響するのは何ですか？", "f": ["Which matters more: family, advice, or past experience?", "How might the strongest influence change later in life?"]}, {"n": "QUESTION 4", "t": "What money habit can help one person but create trouble for another?", "ja": "ある人には役立っても、別の人には問題を起こすお金の習慣は何ですか？", "f": ["What kind of person could benefit from that habit?", "Which situation could make the habit risky?"]}, {"n": "QUESTION 5", "t": "Where should people be more careful: borrowing money or making an investment?", "ja": "人がより注意すべきなのは、お金を借りるときと投資するときのどちらですか？", "f": ["Who else could be affected by the choice?", "What would you want to check before deciding?"]}, {"n": "QUESTION 6", "t": "When is it worth spending money now instead of saving it?", "ja": "貯金するより、今お金を使う価値があるのはどんなときですか？", "f": ["What opportunity might disappear?", "What purchase would you regret delaying?"]}]}, {"n": 6, "title": "선택했을 수도 있는 다른 진로", "sub": "選んでいたかもしれない別のキャリア", "titles": {"ko": "선택했을 수도 있는 다른 진로", "en": "A different career you might have chosen", "ja": "選んでいたかもしれない別のキャリア"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-work-and-money-accessible/69-a-different-career-you-might-have-chosen/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-accessible/69-a-different-career-you-might-have-chosen/lecture/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/69-a-different-career-you-might-have-chosen/lecture/index.html"}, {"href": "view/talk-work-and-money-accessible/69-a-different-career-you-might-have-chosen/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-accessible/69-a-different-career-you-might-have-chosen/prestudy/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/69-a-different-career-you-might-have-chosen/prestudy/index.html"}], "goal": {"t": "Let's explore what makes another career interesting. Please read the title aloud.", "ja": "別のキャリアが興味深く感じられる理由を考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which alternative career would be most interesting to try for one year?", "ja": "どの別のキャリアを一年間試すと最も面白そうですか？", "f": ["What first drew your attention to the career?", "If no career comes to mind, which sounds better: creative, practical, or people-focused work?"]}, {"n": "WARM-UP 2", "t": "What would a normal day in a job you'd like to try actually look like?", "ja": "試してみたい仕事の普通の一日は、実際にはどんな一日ですか？", "f": ["Which task would take the most time?", "Which part might be less enjoyable?"]}, {"n": "QUESTION 1", "t": "What might disappoint you about a career that looks exciting?", "ja": "面白そうに見える仕事でも、どんな点にはがっかりしそうですか？", "f": ["Which daily task could become tiring?", "Would you still try it for a year?"]}, {"n": "QUESTION 2", "t": "What would make a different career possible to try?", "ja": "別のキャリアを試せるようにするには、何が必要ですか？", "f": ["Would time, money, training, location, or family duties be hardest?", "What small test could happen before a full career change?"]}, {"n": "QUESTION 3", "t": "Which skill from your current life would help in a different career?", "ja": "今の生活で身につけたどんなスキルが、別の仕事でも役立ちますか？", "f": ["Where did you learn it?", "What new skill would you still need?"]}, {"n": "QUESTION 4", "t": "How might someone feel about a career they never chose?", "ja": "実現しなかったキャリアは、時間とともにどんな感情を生み得ますか？", "f": ["Would you feel curious, regretful, relieved, or none of these?", "What could make that reaction different later?"]}, {"n": "QUESTION 5", "t": "Which part of another career could fit into life as a hobby or side project?", "ja": "別のキャリアのどの部分なら、趣味や小さなプロジェクトとして生活に取り入れられますか？", "f": ["Could a course, volunteer role, or weekend project test it?", "What would remain impossible without changing careers?"]}, {"n": "QUESTION 6", "t": "What should a young person ask before choosing a career?", "ja": "若い人は、キャリアを選ぶ前に何を質問すべきですか？", "f": ["Which attractive promise should they check carefully?", "Who could tell them about the difficult parts?"]}]}, {"n": 7, "title": "AI가 일을 바꾼 방식", "sub": "AIが仕事を変えたこと", "titles": {"ko": "AI가 일을 바꾼 방식", "en": "How AI has changed your work", "ja": "AIが仕事を変えたこと"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-work-and-money-accessible/70-how-ai-has-changed-your-work/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-accessible/70-how-ai-has-changed-your-work/lecture/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/70-how-ai-has-changed-your-work/lecture/index.html"}, {"href": "view/talk-work-and-money-accessible/70-how-ai-has-changed-your-work/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-accessible/70-how-ai-has-changed-your-work/prestudy/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/70-how-ai-has-changed-your-work/prestudy/index.html"}], "goal": {"t": "Let's talk about how AI changes tasks and responsibility. Please read the title aloud.", "ja": "AIが作業と責任をどう変えるかについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one task AI has changed—or could change—in your daily life?", "ja": "AIによって変わった、または変わりそうな日常の作業を一つ挙げるとしたら何ですか？", "f": ["What part would change first?", "If none comes to mind, would planning or writing be easier to imagine?"]}, {"n": "WARM-UP 2", "t": "Think of one task people now do with AI. How did they do it before?", "ja": "今はAIを使う作業を一つ考えてください。以前はどうしていましたか？", "f": ["Which step became shorter?", "What still takes the same effort?"]}, {"n": "QUESTION 1", "t": "For a task you know, is AI more useful for speed or quality?", "ja": "知っている作業では、AIは速さと質のどちらに役立ちますか？", "f": ["What result shows that?", "What if it improves neither?"]}, {"n": "QUESTION 2", "t": "What new checking or correction work can AI create?", "ja": "AIはどんな検証や修正の作業を生み出すことがありますか？", "f": ["Who is responsible for checking or fixing the output?", "When would using AI create more checking than it saves?"]}, {"n": "QUESTION 3", "t": "What task, decision, or information should never be handed to AI?", "ja": "この状況で、どの作業、判断、情報をAIの利用範囲外にすべきですか？", "f": ["What makes that task too risky for AI?", "Which is most sensitive: a password, a medical record, or a hiring decision?"]}, {"n": "QUESTION 4", "t": "Who should be responsible for checking AI-assisted work?", "ja": "AIを使った仕事の確認責任は、誰が持ち続けるべきですか？", "f": ["Which claim in the result needs checking first?", "Which final choice should a person make?"]}, {"n": "QUESTION 5", "t": "Which human skill is most at risk when people rely heavily on AI?", "ja": "AIに大きく頼るとき、どの人間の力が最も失われやすいですか？", "f": ["What would people lose if the skill weakened?", "How could schools or workplaces protect it?"]}, {"n": "QUESTION 6", "t": "What's one small, low-risk way to test an AI tool?", "ja": "AIツールを試す、小さくてリスクの低い方法は何ですか？", "f": ["What clear result would count as success?", "Which personal or company information must stay out?"]}]}, {"n": 8, "title": "실제로 쓰고 싶은 복지 혜택", "sub": "実際に使いたい仕事の福利厚生", "titles": {"ko": "실제로 쓰고 싶은 복지 혜택", "en": "A job benefit you would actually use", "ja": "実際に使いたい仕事の福利厚生"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-work-and-money-accessible/71-a-time-you-seriously-considered-changing-careers/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-accessible/71-a-time-you-seriously-considered-changing-careers/lecture/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/71-a-time-you-seriously-considered-changing-careers/lecture/index.html"}, {"href": "view/talk-work-and-money-accessible/71-a-time-you-seriously-considered-changing-careers/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-accessible/71-a-time-you-seriously-considered-changing-careers/prestudy/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/71-a-time-you-seriously-considered-changing-careers/prestudy/index.html"}], "goal": {"t": "Let's compare job benefits and decide which ones would improve your real working life. Please read the title aloud.", "ja": "仕事の福利厚生を比べ、実際の働き方をよくするものを考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which would you choose: more paid vacation, flexible hours, or free lunch?", "ja": "有給休暇の増加、柔軟な勤務時間、無料の昼食なら、どれを選びますか？", "f": ["Why that one?", "Which would you use most often?"]}, {"n": "WARM-UP 2", "t": "Which job benefit would improve your ordinary week most?", "ja": "普段の一週間を最もよくしてくれる福利厚生は何ですか？", "f": ["What would change on a normal day?", "Would it save time or money?"]}, {"n": "QUESTION 1", "t": "Which job benefit sounds good but you probably wouldn't use?", "ja": "よさそうでも、実際にはあまり使わなそうな福利厚生は何ですか？", "f": ["Why would it go unused?", "Who might value it more?"]}, {"n": "QUESTION 2", "t": "Would you accept slightly lower pay for a four-day workweek?", "ja": "週休三日のためなら、少し給料が下がっても受け入れますか？", "f": ["How much lower would be too much?", "What would you do with the extra day?"]}, {"n": "QUESTION 3", "t": "Which matters more: flexible hours or a predictable schedule?", "ja": "柔軟な勤務時間と予測しやすい予定では、どちらが大切ですか？", "f": ["Which fits your life now?", "Who might choose differently?"]}, {"n": "QUESTION 4", "t": "What is one benefit every job should offer?", "ja": "どんな仕事にもあるべき福利厚生を一つ挙げるとしたら何ですか？", "f": ["Why should it be standard?", "Who would pay for it?"]}, {"n": "QUESTION 5", "t": "Can a good job benefit ever be a sign of a bad workplace?", "ja": "よい福利厚生が、悪い職場のサインになることはありますか？", "f": ["How?", "What problem would make the benefit meaningless?"]}, {"n": "QUESTION 6", "t": "Besides pay, what would make you stay at a job longer?", "ja": "給料以外で、仕事を長く続けたいと思わせるものは何ですか？", "f": ["Would people or flexibility matter more?", "What would still make you leave?"]}]}, {"n": 9, "title": "많이 배운 사람", "sub": "多くを学んだ人", "titles": {"ko": "많이 배운 사람", "en": "Someone you learned a lot from", "ja": "多くを学んだ人"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-work-and-money-accessible/72-someone-you-learned-a-lot-from/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-accessible/72-someone-you-learned-a-lot-from/lecture/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/72-someone-you-learned-a-lot-from/lecture/index.html"}, {"href": "view/talk-work-and-money-accessible/72-someone-you-learned-a-lot-from/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-accessible/72-someone-you-learned-a-lot-from/prestudy/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/72-someone-you-learned-a-lot-from/prestudy/index.html"}], "goal": {"t": "Let's talk about what makes guidance useful. Please read the title aloud.", "ja": "役立つ指導とは何かについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Who have you learned a lot from, at work, at school, or elsewhere?", "ja": "仕事、学校、それ以外で、多くを学んだ人は誰ですか？", "f": ["What did you learn?", "If no one person stands out, which type of person helps you learn?"]}, {"n": "WARM-UP 2", "t": "What does a good teacher, manager, or coach actually do?", "ja": "よい先生、上司、コーチは実際に何をしますか？", "f": ["Did the person show, explain, or let you practise?", "Which part of the experience proves the guidance worked?"]}, {"n": "QUESTION 1", "t": "How should a good guide turn a mistake into a useful next step?", "ja": "よい指導者は、間違いを役立つ次の一歩にどう変えますか？", "f": ["What made the response helpful or harmful?", "Did it give the learner a clear next step?"]}, {"n": "QUESTION 2", "t": "What can a person in charge do to make questions feel safe?", "ja": "責任のある立場の人は、質問しやすくするために何ができますか？", "f": ["What reaction should they avoid?", "How should they respond to \"I don't know\"?"]}, {"n": "QUESTION 3", "t": "What lesson from a good guide tends to stay useful for years?", "ja": "効果的な指導から得た原則の中で、時間がたっても役立ちやすいのは何ですか？", "f": ["Which current problem could the old lesson help with?", "What would need to change before using it in a new setting?"]}, {"n": "QUESTION 4", "t": "When someone's advice helps you, do you usually tell them?", "ja": "誰かの助言が役に立ったとき、その人に伝えることが多いですか？", "f": ["Why or why not?", "Is it ever too late to thank them?"]}, {"n": "QUESTION 5", "t": "How can a good guide help someone become more independent?", "ja": "よい指導者は、学ぶ人がもっと自分で判断できるようにどう助けられますか？", "f": ["What is the first choice the learner could make alone?", "Which support should remain available afterward?"]}, {"n": "QUESTION 6", "t": "What quality would you want people to remember about your guidance?", "ja": "自分の指導がどんな性質で知られてほしいですか？", "f": ["What action would show that quality?", "How would you know the guidance helped?"]}]}, {"n": 10, "title": "내가 사는 곳의 진짜 점심시간", "sub": "住んでいる場所のリアルな昼休み", "titles": {"ko": "내가 사는 곳의 진짜 점심시간", "en": "What a real lunch break looks like where you live", "ja": "住んでいる場所のリアルな昼休み"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-work-and-money-accessible/73-what-a-normal-work-or-school-day-looks-like-where-you-live/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-accessible/73-what-a-normal-work-or-school-day-looks-like-where-you-live/lecture/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/73-what-a-normal-work-or-school-day-looks-like-where-you-live/lecture/index.html"}, {"href": "view/talk-work-and-money-accessible/73-what-a-normal-work-or-school-day-looks-like-where-you-live/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-accessible/73-what-a-normal-work-or-school-day-looks-like-where-you-live/prestudy/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/73-what-a-normal-work-or-school-day-looks-like-where-you-live/prestudy/index.html"}], "goal": {"t": "Let's describe real lunch-break habits and discuss what makes the break useful and fair. Please read the title aloud.", "ja": "実際の昼休みの習慣を説明し、役立つ公平な休憩について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What do people usually eat for lunch on a work or school day where you live?", "ja": "住んでいる場所では、仕事や学校のある日に何を食べることが多いですか？", "f": ["Do they bring food or buy it?", "What is a quick lunch there?"]}, {"n": "WARM-UP 2", "t": "How long does a real lunch break usually last?", "ja": "実際の昼休みは、普通どのくらいありますか？", "f": ["Is that enough time?", "How much of it is spent getting food?"]}, {"n": "QUESTION 1", "t": "Do people usually eat alone or with coworkers or classmates?", "ja": "一人で食べることと、同僚やクラスメートと食べることでは、どちらが多いですか？", "f": ["Which do you prefer?", "When is eating alone useful?"]}, {"n": "QUESTION 2", "t": "What makes a lunch break feel like a real break?", "ja": "昼休みが本当の休憩に感じられるのは、どんなときですか？", "f": ["Does leaving the building help?", "What ruins the break?"]}, {"n": "QUESTION 3", "t": "When do people skip lunch or eat at their desk?", "ja": "人が昼食を抜いたり、机で食べたりするのはどんなときですか？", "f": ["Is it usually a choice?", "How does it affect the afternoon?"]}, {"n": "QUESTION 4", "t": "What lunch habit from another country would you like to try?", "ja": "別の国の昼食習慣で、試してみたいものは何ですか？", "f": ["A longer lunch or eating outside?", "What might not work where you live?"]}, {"n": "QUESTION 5", "t": "Should people be expected to answer work messages during lunch?", "ja": "昼休みに仕事のメッセージへ返信することを求められるべきですか？", "f": ["What if it is urgent?", "Who decides what counts as urgent?"]}, {"n": "QUESTION 6", "t": "What one change would improve lunch breaks where you live?", "ja": "住んでいる場所の昼休みをよくする変更を一つ挙げるとしたら何ですか？", "f": ["Who would benefit most?", "What would make the change difficult?"]}]}, {"n": 11, "title": "실제 하루 일과", "sub": "実際の仕事の一日", "titles": {"ko": "실제 하루 일과", "en": "What your workday actually looks like", "ja": "実際の仕事の一日"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-work-and-money-accessible/74-what-your-workday-actually-looks-like/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-accessible/74-what-your-workday-actually-looks-like/lecture/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/74-what-your-workday-actually-looks-like/lecture/index.html"}, {"href": "view/talk-work-and-money-accessible/74-what-your-workday-actually-looks-like/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-accessible/74-what-your-workday-actually-looks-like/prestudy/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/74-what-your-workday-actually-looks-like/prestudy/index.html"}], "goal": {"t": "Let's uncover the visible and hidden work in a daily routine. Please read the title aloud.", "ja": "日々の中で見える仕事と見えない仕事について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Think about a recent two-hour stretch. What filled the time?", "ja": "最近の二時間を思い出してください。その時間を何に使いましたか？", "f": ["Which activity would have been visible to an observer?", "What made that period typical or unusual?"]}, {"n": "WARM-UP 2", "t": "Which part of your day takes more time than other people might expect?", "ja": "一日の中で、ほかの人が思うより時間のかかることは何ですか？", "f": ["Which activity usually sets the order of everything else?", "Which interruption usually changes that order?"]}, {"n": "QUESTION 1", "t": "Which part of your routine feels most satisfying?", "ja": "日課の中で、最も満足感があることは何ですか？", "f": ["What makes that part rewarding?", "Would it still feel satisfying if you did more of it?"]}, {"n": "QUESTION 2", "t": "Which part of the day takes the most energy out of you?", "ja": "一日の中で、最もエネルギーを使うことは何ですか？", "f": ["Is the strain physical, mental, or social?", "What change would make it easier?"]}, {"n": "QUESTION 3", "t": "What's one small task that creates a surprising amount of extra work?", "ja": "小さな作業なのに、驚くほど多くの追加の仕事を生むものは何ですか？", "f": ["Why do other people not notice the work?", "Which problem does that hidden work prevent?"]}, {"n": "QUESTION 4", "t": "If you could remove or shorten one task, which would you choose?", "ja": "一つの作業をなくすか短くできるなら、どれを選びますか？", "f": ["What would become easier in your routine if you removed or shortened it?", "Who else might notice the change?"]}, {"n": "QUESTION 5", "t": "What preparation helps the rest of a busy day run better?", "ja": "どんな準備をすると、忙しい一日の残りがうまく進みますか？", "f": ["When does the preparation happen?", "Which problem does it prevent?"]}, {"n": "QUESTION 6", "t": "What would surprise someone who swapped routines with you for a day?", "ja": "あなたと一日だけ日課を交換した人は、何に驚くと思いますか？", "f": ["Which part would challenge them most?", "What might they understand better afterward?"]}]}, {"n": 12, "title": "일이나 학교에서 바꾸고 싶은 한 가지", "sub": "仕事や学校で変えたい一つのこと", "titles": {"ko": "일이나 학교에서 바꾸고 싶은 한 가지", "en": "One thing you would change about your work or school", "ja": "仕事や学校で変えたい一つのこと"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-work-and-money-accessible/75-one-thing-you-would-change-about-your-work-or-school/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-accessible/75-one-thing-you-would-change-about-your-work-or-school/lecture/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/75-one-thing-you-would-change-about-your-work-or-school/lecture/index.html"}, {"href": "view/talk-work-and-money-accessible/75-one-thing-you-would-change-about-your-work-or-school/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-accessible/75-one-thing-you-would-change-about-your-work-or-school/prestudy/index.html", "source": "courses/en/talk-work-and-money-accessible/lessons/75-one-thing-you-would-change-about-your-work-or-school/prestudy/index.html"}], "goal": {"t": "Let's describe a problem and propose a realistic change. Please read the title aloud.", "ja": "問題を説明し、現実的な変更を提案しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which change would most improve a place where people work or study?", "ja": "人が働いたり学んだりする場所を最も改善する変更は何ですか？", "f": ["Which daily problem would disappear first?", "Would students, workers, or managers notice first?"]}, {"n": "WARM-UP 2", "t": "What's a problem at work or school that everyone notices but nobody fixes?", "ja": "職場や学校で、みんな気づいているのに誰も直さない問題は何ですか？", "f": ["Why does it remain?", "If none comes to mind, would noise, meetings, or scheduling be a likely example?"]}, {"n": "QUESTION 1", "t": "Why might someone oppose a useful change at work or school?", "ja": "職場や学校で役立つ変化に、誰かが反対するのはなぜですか？", "f": ["Would cost, fairness, or extra work worry them most?", "What evidence could reduce that worry?"]}, {"n": "QUESTION 2", "t": "What new problem could a useful change create?", "ja": "役立つ変更でも、どんな新しい問題を生む可能性がありますか？", "f": ["Who might be inconvenienced?", "Could a small test reveal the problem?"]}, {"n": "QUESTION 3", "t": "What's a safe way to raise a problem at work or school?", "ja": "不必要なリスクを最も抑えて、職場や学校の問題を提起できるのはどの経路ですか？", "f": ["Would a direct talk, a private talk, or a report be safest?", "What protection would make speaking up easier?"]}, {"n": "QUESTION 4", "t": "After someone reports a problem, what response would feel fair?", "ja": "誰かが問題を伝えた後、どんな対応なら公平だと感じますか？", "f": ["How quickly should someone reply?", "What clear next step should they give?"]}, {"n": "QUESTION 5", "t": "When is a small test better than making a big change at once?", "ja": "大きな変化を一度に行うより、小さく試すほうがよいのはどんなときですか？", "f": ["Which result would prove the test helped?", "What warning sign should end the test?"]}, {"n": "QUESTION 6", "t": "How can you say no to a suggestion without shutting the person down?", "ja": "相手の意見を封じずに、提案を断るにはどうすればよいですか？", "f": ["What useful part could you recognize?", "What alternative could you offer?"]}]}]}, {"no": 14, "label": "14코스", "title": "일과 돈", "titles": {"ko": "일과 돈", "en": "Work and money", "ja": "仕事とお金"}, "subtitle": "(上級) 仕事とお金", "desc": {"ko": "숫자와 장면이 있는 일·돈 경험을 말한다.", "en": "Talk about work and money with real numbers and a real scene attached.", "ja": "数字と場面のある仕事とお金の経験を話す。"}, "cover": "covers/talk-work-and-money-full.webp", "levels": ["C1"], "level": "C1", "slug": "talk-work-and-money-full", "lessons": [{"n": 1, "title": "첫 월급으로 한 일", "sub": "初めての給料で何をしたか", "titles": {"ko": "첫 월급으로 한 일", "en": "What you did with your first paycheck", "ja": "初めての給料で何をしたか"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-work-and-money-full/64-what-you-did-with-your-first-paycheck/lecture", "level": "수업용", "s : "自分でお金を稼ぎ始めると、何が変わりますか？", "f": ["Do prices feel different?", "What new choice becomes possible?"]}, {"n": "QUESTION 6", "t": "What advice would you give someone about their first paycheck?", "ja": "初めて給料をもらう人に、どんな助言をしますか？", "f": ["What advice should they ignore?", "Would you follow your own advice?"]}]}, {"n": 2, "title": "끝내고 자랑스러웠던 일", "sub": "終えて誇らしかったこと", "titles": {"ko": "끝내고 자랑스러웠던 일", "en": "Something you were proud to finish", "ja": "終えて誇らしかったこと"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-work-and-money-full/65-something-you-were-proud-to-finish/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-full/65-something-you-were-proud-to-finish/lecture/index.html", "source": "courses/en/talk-work-and-money-full/lessons/65-something-you-were-proud-to-finish/lecture/index.html"}, {"href": "view/talk-work-and-money-full/65-something-you-were-proud-to-finish/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-full/65-something-you-were-proud-to-finish/prestudy/index.html", "source": "courses/en/talk-work-and-money-full/lessons/65-something-you-were-proud-to-finish/prestudy/index.html"}], "goal": {"t": "Let's talk about what makes finishing something feel meaningful. Please read the title aloud.", "ja": "何かをやり終えることが意味を持つ理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which feels more satisfying: completing a long project or finally fixing a small annoyance?", "ja": "長い仕事を終えることと、小さな困りごとをやっと直すことでは、どちらがより満足できますか？", "f": ["What is the clearest sign that the work is complete?", "Who benefits from the finished result?"]}, {"n": "WARM-UP 2", "t": "What's something you finished that took longer than you expected?", "ja": "思ったより時間がかかったけれど、最後まで終えたことは何ですか？", "f": ["What slowed you down?", "What almost made you stop?"]}, {"n": "QUESTION 1", "t": "Would you still feel proud if nobody noticed?", "ja": "誰にも気づかれなくても、誇らしく感じますか？", "f": ["What would still make it worthwhile?", "Whose praise would matter most?"]}, {"n": "QUESTION 2", "t": "Why can saying \"I'm proud of this\" feel uncomfortable?", "ja": "「これを誇りに思う」と言うことが、気まずく感じられるのはなぜですか？", "f": ["Are people afraid of sounding boastful?", "How else can they show pride?"]}, {"n": "QUESTION 3", "t": "Why can one finished task matter much more than another?", "ja": "一つの完了した努力が、別の努力より大きな意味を持つのは何ですか？", "f": ["Which mattered most: the effort, the result, or keeping a promise?", "What personal quality does finishing the work show?"]}, {"n": "QUESTION 4", "t": "What can someone finish without feeling proud of it?", "ja": "完了しても誇りにつながらない結果には、どんなものがありますか？", "f": ["What might be disappointing about the result?", "Could the effort still deserve praise?"]}, {"n": "QUESTION 5", "t": "What kind of finished work would you want people to remember you for?", "ja": "どんな完成した仕事や貢献と、自分の名前を結びつけたいですか？", "f": ["What quality should people notice?", "Would the size of the project matter?"]}, {"n": "QUESTION 6", "t": "How can we praise real effort without sounding empty?", "ja": "曖昧なお世辞ではなく、努力に基づく誇りを支えるにはどうすればよいですか？", "f": ["Which part of the effort deserves attention?", "What question would help the person talk about the work?"]}]}, {"n": 3, "title": "은근히 즐기는 단순한 일", "sub": "実は嫌いではない地味な作業", "titles": {"ko": "은근히 즐기는 단순한 일", "en": "A boring task you secretly enjoy", "ja": "実は嫌いではない地味な作業"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-work-and-money-full/66-a-moment-when-you-felt-successful/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-full/66-a-moment-when-you-felt-successful/lecture/index.html", "source": "courses/en/talk-work-and-money-full/lessons/66-a-moment-when-you-felt-successful/lecture/index.html"}, {"href": "view/talk-work-and-money-full/66-a-moment-when-you-felt-successful/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-full/66-a-moment-when-you-felt-successful/prestudy/index.html", "source": "courses/en/talk-work-and-money-full/lessons/66-a-moment-when-you-felt-successful/prestudy/index.html"}], "goal": {"t": "Let's talk about repetitive tasks, what makes them satisfying, and when making them easier is worth it. Please read the title aloud.", "ja": "繰り返し作業の楽しさや満足感、楽にする価値があるときを話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which boring task do you mind least: cleaning, sorting, or waiting?", "ja": "掃除、整理、待つことのうち、いちばん苦にならないのはどれですか？", "f": ["What makes it manageable?", "When do you usually do it?"]}, {"n": "WARM-UP 2", "t": "What's a repetitive task you sometimes enjoy?", "ja": "繰り返し作業でも、ときどき楽しいと感じるものは何ですか？", "f": ["What feels satisfying about it?", "Would folding laundry or organizing files count?"]}, {"n": "QUESTION 1", "t": "What can make a boring task feel satisfying?", "ja": "退屈な作業でも、満足感が生まれるのはどんなときですか？", "f": ["Does a clear finish help?", "Do you like seeing the result?"]}, {"n": "QUESTION 2", "t": "Do you prefer doing repetitive tasks alone or with someone?", "ja": "繰り返し作業は、一人でするのと誰かとするのと、どちらが好きですか？", "f": ["Does talking help?", "Which way feels faster?"]}, {"n": "QUESTION 3", "t": "What do you listen to while doing repetitive work?", "ja": "繰り返し作業をするとき、何を聞きますか？", "f": ["Music, a podcast, or silence?", "Does it help you focus?"]}, {"n": "QUESTION 4", "t": "Which boring task do you always put off?", "ja": "いつも後回しにしてしまう退屈な作業は何ですか？", "f": ["What makes it hard to start?", "Would doing five minutes help?"]}, {"n": "QUESTION 5", "t": "When is it worth paying someone else to do a boring task?", "ja": "退屈な作業を誰かに頼んでお金を払う価値があるのは、どんなときですか？", "f": ["Is time or difficulty more important?", "Which task would you never pay for?"]}, {"n": "QUESTION 6", "t": "What small change would make your least favorite task easier?", "ja": "いちばん嫌いな作業を楽にする小さな工夫は何ですか？", "f": ["Would a tool or routine help?", "What would make starting easier?"]}]}, {"n": 4, "title": "더 잘하고 싶은 것", "sub": "もっと上達したいこと", "titles": {"ko": "더 잘하고 싶은 것", "en": "Something you're trying to get better at", "j is working?", "ja": "練習が役立っていると分かる、いちばん明確な小さなサインは何ですか？", "f": ["Would the learner or another person notice first?", "What could show progress without a test or score?"]}, {"n": "QUESTION 4", "t": "When is a skill no longer worth the time it takes?", "ja": "どんなときに、学習者はそのスキルから努力を別の方向に向けるべきですか？", "f": ["What benefit would make it worth continuing?", "What change would make stopping sensible?"]}, {"n": "QUESTION 5", "t": "Which small action would help someone improve a skill this week?", "ja": "今週、誰かの技能上達に役立つ小さな行動はどれですか？", "f": ["When could it fit into the week?", "What would make it easy to start?"]}, {"n": "QUESTION 6", "t": "If you introduced a skill to a beginner, what would you teach first?", "ja": "初心者に技能を紹介するなら、最初に何を教えますか？", "f": ["Why should that part come first?", "Which early mistake should be treated as normal?"]}]}, {"n": 5, "title": "쓰지 않은 돈으로 하는 일", "sub": "使わなかったお金でしていること", "titles": {"ko": "쓰지 않은 돈으로 하는 일", "en": "What you do with money you don't spend", "ja": "使わなかったお金でしていること"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-work-and-money-full/68-what-you-do-with-money-you-dont-spend/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-full/68-what-you-do-with-money-you-dont-spend/lecture/index.html", "source": "courses/en/talk-work-and-money-full/lessons/68-what-you-do-with-money-you-dont-spend/lecture/index.html"}, {"href": "view/talk-work-and-money-full/68-what-you-do-with-money-you-dont-spend/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-full/68-what-you-do-with-money-you-dont-spend/prestudy/index.html", "source": "courses/en/talk-work-and-money-full/lessons/68-what-you-do-with-money-you-dont-spend/prestudy/index.html"}], "goal": {"t": "Let's talk about what money can do besides pay for things. Please read the title aloud.", "ja": "物を買う以外に、お金にできることについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "If you had a little money left this month, what mo": false, "level": "C1", "decks": [{"href": "view/talk-work-and-money-full/69-a-different-career-you-might-have-chosen/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-full/69-a-different-career-you-might-have-chosen/lecture/index.html", "source": "courses/en/talk-work-and-money-full/lessons/69-a-different-career-you-might-have-chosen/lecture/index.html"}, {"href": "view/talk-work-and-money-full/69-a-different-career-you-might-have-chosen/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-full/69-a-different-career-you-might-have-chosen/prestudy/index.html", "source": "courses/en/talk-work-and-money-full/lessons/69-a-different-career-you-might-have-chosen/prestudy/index.html"}], "goal": {"t": "Let's explore what makes another career interesting. Please read the title aloud.", "ja": "別のキャリアが興味深く感じられる理由を考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which alternative career would be most interesting to try for one year?", "ja": "どの別のキャリアを一年間試すと最も面白そうですか？", "f": ["What first drew your attention to the career?", "If no career comes to mind, which sounds better: creative, practical, or people-focused work?"]}, {"n": "WARM-UP 2", "t": "What would a normal day in a job you'd like to try actually look like?", "ja": "試してみたい仕事の普通の一日は、実際にはどんな一日ですか？", "f": ["Which task would take the most time?", "Which part might be less enjoyable?"]}, {"n": "QUESTION 1", "t": "What might disappoint you about a career that looks exciting?", "ja": "面白そうに見える仕事でも、どんな点にはがっかりしそうですか？", "f": ["Which daily task could become tiring?", "Would you still try it for a year?"]}, {"n": "QUESTION 2", "t": "What would make a different career possible to try?", "ja": "別のキャリアを試せるようにするには、何が必要ですか？", "f": ["Would time, money, training, location, or family duties be hardest?", "What small test could happen before a full career change?"]}, {"n": "QUESTION 3", "t": "Which skill from your current life would help in a different career?", "ja": "今の生活で身につけたどんなスキルが、別の仕事でも役立ちますか？", "f": ["Where did you learn it?", "What new skill would you still need?"]}, {"n": "QUESTION 4", "t": "How might someone feel about a career they never chose?", "ja": "実現しなかったキャリアは、時間とともにどんな感情を生み得ますか？", "f": ["Would you feel curious, regretful, relieved, or none of these?", "What could make that reaction different later?"]}, {"n": "QUESTION 5", "t": "Which part of another career could fit into life as a hobby or side project?", "ja": "別のキャリアのどの部分なら、趣味や小さなプロジェクトとして生活に取り入れられますか？", "f": ["Could a course, volunteer role, or weekend project test it?", "What would remain impossible without changing careers?"]}, {"n": "QUESTION 6", "t": "What should a young person ask before choosing a career?", "ja": "若い人は、キャリアを選ぶ前に何を質問すべきですか？", "f": ["Which attractive promise should they check carefully?", "Who could tell them about the difficult parts?"]}]}, {"n": 7, "title": "AI가 일을 바꾼 방식", "sub": "AIが仕事を変えたこと", "titles": {"ko": "AI가 일을 바꾼 방식", "en": "How AI has changed your work", "ja": "AIが仕事を変えたこと"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-work-and-money-full/70-how-ai-has-changed-your-work/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-full/70-how-ai-has-changed-your-work/lecture/index.html", "source": "courses/en/talk-work-and-money-full/lessons/70-how-ai-has-changed-your-work/lecture/index.html"}, {"href": "view/talk-work-and-money-full/70-how-ai-has-changed-your-work/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-full/70-how-ai-has-changed-your-work/prestudy/index.html", "source": "courses/en/talk-work-and-money-full/lessons/70-how-ai-has-changed-your-work/prestudy/index.html"}], "goal": {"t": "Let's talk about how AI changes tasks and responsibility. Please read the title aloud.", "ja": "AIが作業と責任をどう変えるかについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one task AI has changed—or could change—in your daily life?", "ja": "AIによって変わった、または変わりそうな日常の作業を一つ挙げるとしたら何ですか？", "f": ["What part would change first?", "If none comes to mind, would planning or writing be easier to imagine?"]}, {"n": "WARM-UP 2", "t": "Think of one task people now do with AI. How did they do it before?", "ja": "今はAIを使う作業を一つ考えてください。以前はどうしていましたか？", "f": ["Which step became shorter?", "What still takes the same effort?"]}, {"n": "QUESTION 1", "t": "For a task you know, is AI more useful for speed or quality?", "ja": "知っている作業では、AIは速さと質のどちらに役立ちますか？", "f": ["What result shows that?", "What if it improves neither?"]}, {"n": "QUESTION 2", "t": "What new checking or correction work can AI create?", "ja": "AIはどんな検証や修正の作業を生み出すことがありますか？", "f": ["Who is responsible for checking or fixing the output?", "When would using AI create more checking than it saves?"]}, {"n": "QUESTION 3", "t": "What task, decision, or information should never be handed to AI?", "ja": "この状況で、どの作業、判断、情報をAIの利用範囲外にすべきですか？", "f": ["What makes that task too risky for AI?", "Which is most sensitive: a password, a medical record, or a hiring decision?"]}, {"n": "QUESTION 4", "t": "Who should be responsible for checking AI-assisted work?", "ja": "AIを使った仕事の確認責任は、誰が持ち続けるべきですか？", "f": ["Which claim in the result needs checking first?", "Which final choice should a person make?"]}, {"n": "QUESTION 5", "t": "Which human skill is most at risk when people rely heavily on AI?", "ja": "AIに大きく頼るとき、どの人間の力が最も失われやすいですか？", "f": ["What would people lose if the skill weakened?", "How could schools or workplaces protect it?"]}, {"n": "QUESTION 6", "t": "What's one small, low-risk way to test an AI tool?", "ja": "AIツールを試す、小さくてリスクの低い方法は何ですか？", "f": ["What clear result would count as success?", "Which personal or company information must stay out?"]}]}, {"n": 8, "title": "실제로 쓰고 싶은 복지 혜택", "sub": "実際に使いたい仕事の福利厚生", "titles": {"ko": "실제로 쓰고 싶은 복지 혜택", "en": "A job benefit you would actually use", "ja": "実際に使いたい仕事の福利厚生"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-work-and-money-full/71-a-time-you-seriously-considered-changing-careers/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-full/71-a-time-you-seriously-considered-changing-careers/lecture/index.html", "source": "courses/en/talk-work-and-money-full/lessons/71-a-time-you-seriously-considered-changing-careers/lecture/index.html"}, {"href": "view/talk-work-and-money-full/71-a-time-you-seriously-considered-changing-careers/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-full/71-a-time-you-seriously-considered-changing-careers/prestudy/index.html", "source": "courses/en/talk-work-and-money-full/lessons/71-a-time-you-seriously-considered-changing-careers/prestudy/index.html"}], "goal": {"t": "Let's compare job benefits and decide which ones would improve your real working life. Please read the title aloud.", "ja": "仕事の福利厚生を比べ、実際の働き方をよくするものを考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which would you choose: more paid vacation, flexible hours, or free lunch?", "ja": "有給休暇の増加、柔軟な勤務時間、無料の昼食なら、どれを選びますか？", "f": ["Why that one?", "Which would you use most often?"]}, {"n": "WARM-UP 2", "t": "Which job benefit would improve your ordinary week most?", "ja": "普段の一週間を最もよくしてくれる福利厚生は何ですか？", "f": ["What would change on a normal day?", "Would it save time or money?"]}, {"n": "QUESTION 1", "t": "Which job benefit sounds good but you probably wouldn't use?", "ja": "よさそうでも、実際にはあまり使わなそうな福利厚生は何ですか？", "f": ["Why would it go unused?", "Who might value it more?"]}, {"n": "QUESTION 2", "t": "Would you accept slightly lower pay for a four-day workweek?", "ja": "週休三日のためなら、少し給料が下がっても受け入れますか？", "f": ["How much lower would be too much?", "What would you do with the extra day?"]}, {"n": "QUESTION 3", "t": "Which matters more: flexible hours or a predictable schedule?", "ja": "柔軟な勤務時間と予測しやすい予定では、どちらが大切ですか？", "f": ["Which fits your life now?", "Who might choose differently?"]}, {"n": "QUESTION 4", "t": "What is one benefit every job should offer?", "ja": "どんな仕事にもあるべき福利厚生を一つ挙げるとしたら何ですか？", "f": ["Why should it be standard?", "Who would pay for it?"]}, {"n": "QUESTION 5", "t": "Can a good job benefit ever be a sign of a bad workplace?", "ja": "よい福利厚生が、悪い職場のサインになることはありますか？", "f": ["How?", "What problem would make the benefit meaningless?"]}, {"n": "QUESTION 6", "t": "Besides pay, what would make you stay at a job longer?", "ja": "給料以外で、仕事を長く続けたいと思わせるものは何ですか？", "f": ["Would people or flexibility matter more?", "What would still make you leave?"]}]}, {"n": 9, "title": "많이 배운 사람", "sub": "多くを学んだ人", "titles": {"ko": "많이 배운 사람", "en": "Someone you learned a lot from", "ja": "多くを学んだ人"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-work-and-money-full/72-someone-you-learned-a-lot-from/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-full/72-someone-you-learned-a-lot-from/lecture/index.html", "source": "courses/en/talk-work-and-money-full/lessons/72-someone-you-learned-a-lot-from/lecture/index.html"}, {"href": "view/talk-work-and-money-full/72-someone-you-learned-a-lot-from/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-full/72-someone-you-learned-a-lot-from/prestudy/index.html", "source": "courses/en/talk-work-and-money-full/lessons/72-someone-you-learned-a-lot-from/prestudy/index.html"}], "goal": {"t": "Let's talk about what makes guidance useful. Please read the title aloud.", "ja": "役立つ指導とは何かについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Who have you learned a lot from, at work, at school, or elsewhere?", "ja": "仕事、学校、それ以外で、多くを学んだ人は誰ですか？", "f": ["What did you learn?", "If no one person stands out, which type of person helps you learn?"]}, {"n": "WARM-UP 2", "t": "What does a good teacher, manager, or coach actually do?", "ja": "よい先生、上司、コーチは実際に何をしますか？", "f": ["Did the person show, explain, or let you practise?", "Which part of the experience proves the guidance worked?"]}, {"n": "QUESTION 1", "t": "How should a good guide turn a mistake into a useful next step?", "ja": "よい指導者は、間違いを役立つ次の一歩にどう変えますか？", "f": ["What made the response helpful or harmful?", "Did it give the learner a clear next step?"]}, {"n": "QUESTION 2", "t": "What can a person in charge do to make questions feel safe?", "ja": "責任のある立場の人は、質問しやすくするために何ができますか？", "f": ["What reaction should they avoid?", "How should they respond to \"I don't know\"?"]}, {"n": "QUESTION 3", "t": "What lesson from a good guide tends to stay useful for years?", "ja": "効果的な指導から得た原則の中で、時間がたっても役立ちやすいのは何ですか？", "f": ["Which current problem could the old lesson help with?", "What would need to change before using it in a new setting?"]}, {"n": "QUESTION 4", "t": "When someone's advice helps you, do you usually tell them?", "ja": "誰かの助言が役に立ったとき、その人に伝えることが多いですか？", "f": ["Why or why not?", "Is it ever too late to thank them?"]}, {"n": "QUESTION 5", "t": "How can a good guide help someone become more independent?", "ja": "よい指導者は、学ぶ人がもっと自分で判断できるようにどう助けられますか？", "f": ["What is the first choice the learner could make alone?", "Which support should remain available afterward?"]}, {"n": "QUESTION 6", "t": "What quality would you want people to remember about your guidance?", "ja": "自分の指導がどんな性質で知られてほしいですか？", "f": ["What action would show that quality?", "How would you know the guidance helped?"]}]}, {"n": 10, "title": "내가 사는 곳의 진짜 점심시간", "sub": "住んでいる場所のリアルな昼休み", "titles": {"ko": "내가 사는 곳의 진짜 점심시간", "en": "What a real lunch break looks like where you live", "ja": "住んでいる場所のリアルな昼休み"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-work-and-money-full/73-what-a-normal-work-or-school-day-looks-like-where-you-live/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-full/73-what-a-normal-work-or-school-day-looks-like-where-you-live/lecture/index.html", "source": "courses/en/talk-work-and-money-full/lessons/73-what-a-normal-work-or-school-day-looks-like-where-you-live/lecture/index.html"}, {"href": "view/talk-work-and-money-full/73-what-a-normal-work-or-school-day-looks-like-where-you-live/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-full/73-what-a-normal-work-or-school-day-looks-like-where-you-live/prestudy/index.html", "source": "courses/en/talk-work-and-money-full/lessons/73-what-a-normal-work-or-school-day-looks-like-where-you-live/prestudy/index.html"}], "goal": {"t": "Let's describe real lunch-break habits and discuss what makes the break useful and fair. Please read the title aloud.", "ja": "実際の昼休みの習慣を説明し、役立つ公平な休憩について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What do people usually eat for lunch on a work or school day where you live?", "ja": "住んでいる場所では、仕事や学校のある日に何を食べることが多いですか？", "f": ["Do they bring food or buy it?", "What is a quick lunch there?"]}, {"n": "WARM-UP 2", "t": "How long does a real lunch break usually last?", "ja": "実際の昼休みは、普通どのくらいありますか？", "f": ["Is that enough time?", "How much of it is spent getting food?"]}, {"n": "QUESTION 1", "t": "Do people usually eat alone or with coworkers or classmates?", "ja": "一人で食べることと、同僚やクラスメートと食べることでは、どちらが多いですか？", "f": ["Which do you prefer?", "When is eating alone useful?"]}, {"n": "QUESTION 2", "t": "What makes a lunch break feel like a real break?", "ja": "昼休みが本当の休憩に感じられるのは、どんなときですか？", "f": ["Does leaving the building help?", "What ruins the break?"]}, {"n": "QUESTION 3", "t": "When do people skip lunch or eat at their desk?", "ja": "人が昼食を抜いたり、机で食べたりするのはどんなときですか？", "f": ["Is it usually a choice?", "How does it affect the afternoon?"]}, {"n": "QUESTION 4", "t": "What lunch habit from another country would you like to try?", "ja": "別の国の昼食習慣で、試してみたいものは何ですか？", "f": ["A longer lunch or eating outside?", "What might not work where you live?"]}, {"n": "QUESTION 5", "t": "Should people be expected to answer work messages during lunch?", "ja": "昼休みに仕事のメッセージへ返信することを求められるべきですか？", "f": ["What if it is urgent?", "Who decides what counts as urgent?"]}, {"n": "QUESTION 6", "t": "What one change would improve lunch breaks where you live?", "ja": "住んでいる場所の昼休みをよくする変更を一つ挙げるとしたら何ですか？", "f": ["Who would benefit most?", "What would make the change difficult?"]}]}, {"n": 11, "title": "실제 하루 일과", "sub": "実際の仕事の一日", "titles": {"ko": "실제 하루 일과", "en": "What your workday actually looks like", "ja": "実際の仕事の一日"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-work-and-money-full/74-what-your-workday-actually-looks-like/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-work-and-money-full/74-what-your-workday-actually-looks-like/lecture/index.html", "source": "courses/en/talk-work-and-money-full/lessons/74-what-your-workday-actually-looks-like/lecture/index.html"}, {"href": "view/talk-work-and-money-full/74-what-your-workday-actually-looks-like/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-work-and-money-full/74-what-your-workday-actually-looks-like/prestudy/index.html", "source": "courses/en/talk-work-and-money-full/lessons/74-what-your-workday-actually-looks-like/prestudy/index.html"}], "goal": {"t": "Let's uncover the visible and hidden work in a daily routine. Please read the title aloud.", "ja": "日々の中で見える仕事と見えない仕事について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Think about a recent two-hour stretch. What filled the time?", "ja": "最近の二時間を思い出してください。その時間を何に使いましたか？", "f": ["Which activity would have been visible to an observer?", "What made that period typical or unusual?"]}, {"n": "WARM-UP 2", "t": "Which part of your day takes more time than other people might expect?", "ja": "一日の中で、ほかの人が思うより時間のかかることは何ですか？", "f": ["Which activity usually sets the order of everything else?", "Which interruption usually changes that order?"]}, {"n": "QUESTION 1", "t": "Which part of your routine feels most satisfying?", "ja": "日課の中で、最も満足感があることは何ですか？", "f": ["What makes that part rewarding?", "Would it still feel satisfying if you did more of ge-about-your-work-or-school/prestudy/index.html", "source": "courses/en/talk-work-and-money-full/lessons/75-one-thing-you-would-change-about-your-work-or-school/prestudy/index.html"}], "goal": {"t": "Let's describe a problem and propose a realistic change. Please read the title aloud.", "ja": "問題を説明し、現実的な変更を提案しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which change would most improve a place where people work or study?", "ja": "人が働いたり学んだりする場所を最も改善する変更は何ですか？", "f": ["Which daily problem would disappear first?", "Would students, workers, or managers notice first?"]}, {"n": "WARM-UP 2", "t": "What's a problem at work or school that everyone notices but nobody fixes?", "ja": "職場や学校で、みんな気づいているのに誰も直さない問題は何ですか？", "f": ["Why does it remain?", "If none comes to mind, would noise, meetings, or scheduling be a likely example?"]}, {"n": "QUESTION 1", "t": "Why might someone oppose a useful change at work or school?", "ja": "職場や学校で役立つ変化に、誰かが反対するのはなぜですか？", "f": ["Would cost, fairness, or extra work worry them most?", "What evidence could reduce that worry?"]}, {"n": "QUESTION 2", "t": "What new problem could a useful change create?", "ja": "役立つ変更でも、どんな新しい問題を生む可能性がありますか？", "f": ["Who might be inconvenienced?", "Could a small test reveal the problem?"]}, {"n": "QUESTION 3", "t": "What's a safe way to raise a problem at work or school?", "ja": "不必要なリスクを最も抑えて、職場や学校の問題を提起できるのはどの経路ですか？", "f": ["Would a direct talk, a private talk, or a report be safest?", "What protection would make speaking up easier?"]}, {"n": "QUESTION 4", "t": "After someone reports a problem, what response would feel fair?", "ja": "誰かが問題を伝えた後、どんな対応なら公平だと感じますか？", "f": ["How quickly should someone reply?", "What clear next step should they give?"]}, {"n": "QUESTION 5", "t": "When is a small test better than making a big change at once?", "ja": "大きな変化を一度に行うより、小さく試すほうがよいのはどんなときですか？", "f": ["Which result would prove the test helped?", "What warning sign should end the test?"]}, {"n": "QUESTION 6", "t": "How can you say no to a suggestion without shutting the person down?", "ja": "相手の意見を封じずに、提案を断るにはどうすればよいですか？", "f": ["What useful part could you recognize?", "What alternative could you offer?"]}]}]}, {"no": 15, "label": "15코스", "title": "지나온 것", "titles": {"ko": "지나온 것", "en": "What came before", "ja": "過ぎてきたもの"}, "subtitle": "(中級) 過ぎてきたもの", "desc": {"ko": "이미 겪은 기억을 시간 순서와 디테일로 이야기한다.", "en": "Tell what you already lived through, in order and in detail.", "ja": "すでに経験した記憶を、時間の順とディテールで語る。"}, "cover": "covers/talk-what-came-before-accessible.webp", "levels": ["B1"], "level": "B1", "slug": "talk-what-came-before-accessible", "lessons": [{"n": 1, "title": "어릴 때 계속 들었던 조언", "sub": "子どもの頃に何度も聞いた助言", "titles": {"ko": "어릴 때 계속 들었던 조언", "en": "Advice you kept hearing as a child", "ja": "子どもの頃に何度も聞いた助言"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-came-before-accessible/76-advice-you-kept-hearing-as-a-child/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-accessible/76-advice-you-kept-hearing-as-a-child/lecture/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/76-advice-you-kept-hearing-as-a-child/lecture/index.html"}, {"href": "view/talk-what-came-before-accessible/76-advice-you-kept-hearing-as-a-child/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-accessible/76-advice-you-kept-hearing-as-a-child/prestudy/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/76-advice-you-kept-hearing-as-a-child/prestudy/index.html"}], "goal": {"t": "Let's talk about childhood advice that stays with people. Please read the title aloud.", "ja": "心に残る子どもの頃の助言について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What advice did you hear again and again as a child?", "ja": "子どもの頃、何度も聞いた助言は何ですか？", "f": ["Who usually said it?", "Did you follow it or ignore it?"]}, {"n": "WARM-UP 2", "t": "What's a piece of advice whose exact words dex.html", "source": "courses/en/talk-what-came-before-accessible/lessons/77-a-teacher-you-still-remember/lecture/index.html"}, {"href": "view/talk-what-came-before-accessible/77-a-teacher-you-still-remember/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-accessible/77-a-teacher-you-still-remember/prestudy/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/77-a-teacher-you-still-remember/prestudy/index.html"}], "goal": {"t": "Let's talk about what makes a teacher unforgettable. Please read the title aloud.", "ja": "先生が忘れられない存在になる理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which real or fictional teacher has stayed in your mind?", "ja": "実在でも作品の中でも、今も心に残っている先生は誰ですか？", "f": ["What did that teacher do?", "Which teacher from a film or book would be another good choice?"]}, {"n": "WARM-UP 2", "t": "What does a good teacher do when a student makes a mistake?", "ja": "よい先生は、生徒が間違えたときに何をしますか？", "f": ["How can the teacher keep the student interested?", "Would you prefer a hint or a clear correction?"]}, {"n": "QUESTION 1", "t": "What small act from a teacher can matter to a student years later?", "ja": "何年後にも生徒にとって大切に思える、先生の小さな行動は何ですか？", "f": ["Why can a small act stay in a student's memory?", "Would remembering a name or giving encouragement be a good example?"]}, {"n": "QUESTION 2", "t": "When does a strict teacher go too far?", "ja": "厳しい先生が行き過ぎるのはどんなときですか？", "f": ["What effect does it have on students?", "Which is worse: shouting at students or giving too much homework?"]}, {"n": "QUESTION 3", "t": "What's an important lesson a teacher can leave beyond the subject itself?", "ja": "先生が教科そのものを超えて残せる大切な学びは何ですか？", "f": ["How could that lesson help later?", "Could a teacher show kindness or confidence without teaching it directly?"]}, {"n": "QUESTION 4", "t": "Why can a teacher's choices make more sense years after the class ends?", "ja": "授業が終わって何年かしてから、先生の選択に納得できることがあるのはなぜですか？", "f": ["What can people understand later?", "Can you think of a rule that seemed unfair at school?"]}, {"n": "QUESTION 5", "t": "What would you like to tell a former teacher?", "ja": "昔の先生に何を伝えたいですか？", "f": ["Would it be thanks, a question, or criticism?", "What should teachers hear from former students?"]}, {"n": "QUESTION 6", "t": "How can a student keep learning when a teacher's style does not work for them?", "ja": "先生の教え方が自分に合わなくても、生徒はどう学び続けられますか？", "f": ["What could the student try first?", "Could another teacher, classmate, or online lesson help?"]}]}, {"n": 3, "title": "학교에서 불리던 별명", "sub": "学校で呼ばれていたあだ名", "titles": {"ko": "학교에서 불리던 별명", "en": "A nickname you had at school", "ja": "学校で呼ばれていたあだ名"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-came-before-accessible/78-a-nickname-you-had-at-school/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-accessible/78-a-nickname-you-had-at-school/lecture/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/78-a-nickname-you-had-at-school/lecture/index.html"}, {"href": "view/talk-what-came-before-accessible/78-a-nickname-you-had-at-school/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-came-before-accessible/78-a-nickname-you-had-at-school/prestudy/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/78-a-nickname-you-had-at-school/prestudy/index.html"}], "goal": {"t": "Let's explore how school nicknames begin and affect people. Please read the title aloud.", "ja": "学校のあだ名がどう生まれ、人にどう影響するか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which school nickname has the best story behind it?", "ja": "最も面白い由来を持つ学校のあだ名は何ですか？", "f": ["What made it memorable?", "What makes any nickname easy to remember?"]}, {"n": "WARM-UP 2", "t": "What makes a nickname spread from one person to a whole group?", "ja": "一人が使い始めたあだ名が、グループ全体に広がるのはなぜですか？", "f": ["Does a joke, habit, or appearance usually start it?", "Who helps the nickname spread?"]}, {"n": "QUESTION 1", "t": "What makes the same nickname feel warm to one person and hurtful to another?", "ja": "同じあだ名でも、ある人には温かく、別の人には傷つくものに感じられるのはなぜですか？", "f": ["Whose feelings decide whether it is friendly?", "Can the same nickname change over time?"]}, {"n": "QUESTION 2", "t": "What can a nickname get wrong about a person?", "ja": "あだ名は、その人について何を間違って伝えることがありますか？", "f": ["Could a nickname hide a quiet or serious side?", "Why might other people believe it?"]}, {"n": "QUESTION 3", "t": "Why can an old nickname bring back a whole relationship or time in life?", "ja": "昔のあだ名が、人間関係や人生のある時期を丸ごと思い出させるのはなぜですか？", "f": ["Who usually keeps using an old nickname?", "Would it feel strange if a new friend used it?"]}, {"n": "QUESTION 4", "t": "How can nicknames help a group feel close?", "ja": "あだ名は、グループの親しさをどう深めますか？", "f": ["Does a nickname create closeness or show closeness?", "Why might someone prefer their real name?"]}, {"n": "QUESTION 5", "t": "When should people stop using a nickname?", "ja": "人はどんなときに、あだ名を使うのをやめるべきですか？", "f": ["Whose feelings matter most?", "Could the nickname ever feel friendly again?"]}, {"n": "QUESTION 6", "t": "What part of your present self would you want a new nickname to capture?", "ja": "新しいあだ名に、今の自分のどんな部分を表してほしいですか？", "f": ["Would it describe your personality, a skill, or a habit?", "Would you choose it yourself?"]}]}, {"n": 4, "title": "어릴 때는 싫어했지만 지금은 좋아하는 음식", "sub": "子どもの頃は嫌いだったけれど、今は好きな食べ物", "titles": {"ko": "어릴 때는 싫어했지만 지금은 좋아하는 음식", "en": "A food you hated as a child but like now", "ja": "子どもの頃は嫌いだったけれど、今は好きな食べ物"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-came-before-accessible/79-something-you-hated-as-a-child-but-love-now/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-came-before-accessible/79-something-you-hated-as-a-child-but-love-now/lecture/index.html", "source": "courses/en/talk-what-came-before-accessible/lessons/79-something-you-h
