<!DOCTYPE html>
<!-- VENDORED from tools/authoring/kr/track_template.html — byte-identical to it
     except for the edits listed here, so a change upstream re-applies as a diff.

     A track upstream is a track here too: the courses in a family are its units,
     and their lessons are its lessons. That is what the unit shell was built for,
     so nothing here had to be collapsed.

     Edits:
       1. The language tabs come from DATA.page, since one template draws both
          korean/ and english/ track pages.
       2. The level ramp is keyed by position (see gateway.html).
       3. A course prints its own `spec.description` at the head of the body it
          opens into. Upstream draws the authored track TOC, where a course is a
          heading with prose under it; here a course is a row in courses/, and
          that sentence is the only thing on the page that says what the course
          is for. Nothing else in this file moved.
       4. Links drop the .html and the catalog is ../ rather than ../catalog.html,
          because this site is served at a custom domain where a language is a
          path (/korean-jp) and its catalog is that directory's index. GitHub
          Pages resolves the extensionless links to the same files upstream
          writes, so only the links moved, not the tree.

     Filled by tools/build-catalog.py — do not edit the built file by hand. -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#ffffff">
<title id="ttl">커리큘럼 · PODO 한국어</title>
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="../../site.css">
<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

  /* ────────────────────────────────────────────────────────────────────
     읽는 순서를 선이 아니라 면과 밀도로 만든다.

       1. 트랙 개요          — 트랙색을 품은 큰 면. 이름·설명·규모가 한 덩어리다.
       2. 찾아보기           — 중립색 도구 면. 검색과 필터만 둔다.
       3. 단원               — 흰 카드와 트랙색 번호칩으로 훑는다.
       4. 과                 — 옅은 타일. 제목만 남겨 빠르게 고른다.
       5. 선택한 과          — 트랙색 바닥과 예문 블록이 선택 상태를 만든다.

     예문의 배우는 조각은 살구색으로 고정해 트랙색과 역할이 겹치지 않게 한다.
     ──────────────────────────────────────────────────────────────────── */
  :root {
    --ink: #16181a;
    --ink-2: #454a4f;
    --ink-3: #62686e;
    --ink-4: #7d848a;
    --line: #e6e8ea;
    --line-soft: #f1f2f3;
    --surface: #fafbfb;
    --lime: #b5fd4c;
    --radius: 4px;
    --radius-sm: 2px;

    /* 덱의 --ending-* 그대로. "이 과가 가르치는 조각"이라는 뜻이 레슨과 같다. */
    --pat-mark: #ffdfc7;
    --pat-ink:  #a4501a;

    /* 레벨 램프. 이름이 아니라 축 위의 자리로 매긴다 — 눈금 이름은 언어마다 다르지만
       (한국어 6단, 영어 CEFR) 옅은 것에서 짙은 것으로 오른다는 규칙은 같다. 어느 이름이
       몇 번을 쓰는지는 build-catalog.py 가 DATA.ramp 에 실어 보낸다. */
    --lv-1: #eef8de;
    --lv-2: #d7f0b4;
    --lv-3: #b1e07c;
    --lv-4: #7ac845;
    --lv-5: #3f7a1c;
    --lv-6: #2a5511;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #fff; color: var(--ink); line-height: 1.6;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px 130px; }
  @media (max-width: 600px) { .wrap { padding: 0 18px 80px; } }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: var(--radius-sm); }
  .lbl { color: var(--ink-3); font-size: 11px; font-weight: 700; letter-spacing: .07em; }

  /* ---------- 트랙 탭 ---------- */
  .tabs { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.94); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); }
  .tabs-in { max-width: 1040px; margin: 0 auto; padding: 0 28px; display: flex; gap: 2px; overflow-x: auto; }
  @media (max-width: 600px) { .tabs-in { padding: 0 18px; } }
  .tabs-in::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; padding: 13px 14px 11px; border-bottom: 2px solid transparent;
    color: var(--ink-3); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .tab:hover { color: var(--ink); }
  .tab em { font-style: normal; margin-right: 7px; color: var(--ink-4); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tab.on { color: var(--ac); border-bottom-color: var(--ac); font-weight: 750; }
  .tab.on em { color: var(--ac); opacity: .6; }
  .tab.home { padding-left: 0; padding-right: 16px; color: var(--ink-4); }
  .tab.home:hover { color: var(--ink); }

  /* ---------- 1단 · 트랙 머리 ---------- */
  .hero { padding: 32px 0 0; }
  .hero-card { position: relative; isolation: isolate; overflow: hidden; display: grid;
    grid-template-columns: minmax(0,1.35fr) minmax(290px,.65fr); gap: 44px; align-items: end;
    padding: 40px 42px; border: 1px solid color-mix(in srgb, var(--ac) 12%, var(--line)); border-radius: 8px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--tint) 86%, white), #fff 72%);
    box-shadow: none; }
  .hero-card::after { content: ""; position: absolute; z-index: -1; width: 260px; height: 260px;
    right: -100px; top: -130px; border: 46px solid color-mix(in srgb, var(--ac) 10%, transparent);
    border-radius: 50%; }
  .plan-track .hero-card { border: 2px dashed #9ba2a8;
    background: repeating-linear-gradient(135deg, #f3f4f5 0 12px, #fff 12px 24px); }
  .plan-banner[hidden] { display: none; }
  .plan-banner { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 13px 15px;
    border: 1px solid #aeb4b9; border-radius: var(--radius); background: #f1f3f4;
    color: #394047; font-size: 13px; font-weight: 650; }
  .plan-banner strong { flex: 0 0 auto; padding: 3px 7px; background: #555d64; color: #fff;
    font-size: 10px; font-weight: 800; letter-spacing: -.01em; }
  .hero-no { display: inline-flex; align-items: center; gap: 8px; color: var(--ac); font-size: 12px;
    font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  .hero-no::before { content: ""; width: 8px; height: 8px; background: var(--ac); }
  h1 { margin: 11px 0 0; font-size: 44px; font-weight: 820; line-height: 1.08; letter-spacing: -.045em; word-break: keep-all; }
  h1 span { display: block; margin: 7px 0 0; color: var(--ink-3); font-size: 14px; font-weight: 550; letter-spacing: 0; }
  .hero-d { max-width: 52ch; margin: 19px 0 0; color: var(--ink-2); font-size: 15px; line-height: 1.72; word-break: keep-all; }

  .panel { min-width: 0; padding: 20px; border: 1px solid rgba(22,24,26,.08); border-radius: var(--radius);
    background: rgba(255,255,255,.82); box-shadow: none; }
  .overview-label { display: block; margin-bottom: 13px; color: var(--ink-3); font-size: 12px;
    font-weight: 750; letter-spacing: .08em; }
  .figs { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; }
  .figs div { min-width: 0; }
  .figs div b { display: block; color: var(--ac); font-size: 24px; font-weight: 780;
    letter-spacing: -.04em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .figs div span { display: block; margin-top: 3px; color: var(--ink-3); font-size: 12px; font-weight: 650; }
  #distwrap:not([hidden]) { margin-top: 20px; }
  .dist { display: flex; gap: 2px; height: 10px; }
  .dist i { border-radius: 1px; }
  .dist-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 10px 0 0; color: var(--ink-2); font-size: 12px; }
  .dist-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dist-legend i { width: 8px; height: 8px; border-radius: 1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .dist-legend b { font-weight: 750; font-variant-numeric: tabular-nums; }

  /* ---------- 2단 · 찾아보기 ---------- */
  .curriculum-head { margin: 34px 0 0; padding: 20px; border-radius: var(--radius); background: #f4f6f8; }
  .band { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 0 0 14px; }
  .band h2 { margin: 0; color: var(--ink); font-size: 20px; font-weight: 780; letter-spacing: -.025em; }
  .band p { margin: 0; color: var(--ink-3); font-size: 12px; font-weight: 650; }

  /* ---------- controls ---------- */
  .controls { padding: 0; }
  .crow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .crow[hidden] { display: none; }
  .crow + .crow { margin-top: 12px; }
  .search { flex: 1 1 240px; min-width: 190px; padding: 11px 15px; border: 1px solid #d7dce0;
    border-radius: var(--radius-sm); background: #fff; box-shadow: none; font: inherit; font-size: 13.5px; }
  .search::placeholder { color: var(--ink-4); }
  .search:focus { outline: none; box-shadow: inset 0 0 0 2px var(--ac); }
  /* 표시 언어 선택기. 브랜드 옆 작은 세 칸 — 헤더의 무게중심을 바꾸지 않는다. */
  .loc { display: flex; gap: 2px; margin-left: auto; padding: 2px; border: 1px solid #e3e7ea;
    border-radius: var(--radius-sm); background: #fff; }
  .loc button { padding: 4px 9px; border: 0; border-radius: 2px; background: transparent;
    color: var(--ink-3); font: inherit; font-size: 12px; font-weight: 650; cursor: pointer; }
  .loc button:hover { color: var(--ink); }
  .loc button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  /* 프리토킹 과의 질문 여덟 개. 번호는 덱이 부르는 이름 그대로(몸풀기·질문)이고,
     이어지는 질문은 한 단 들여 본 질문에 붙어 있음을 보인다. */
  .qs { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .qitem { padding: 11px 13px; border: 1px solid var(--gray-200, #e6e8ea); border-radius: var(--radius-sm);
    background: #fff; }
  .qn { display: inline-block; margin-bottom: 5px; padding: 2px 7px; border-radius: 2px;
    background: var(--tint); color: var(--ac); font-size: 11px; font-weight: 800; }
  .qt { margin: 0; font-size: 14px; font-weight: 650; line-height: 1.5; }
  .qja { margin: 3px 0 0; color: var(--ink-3); font-size: 12.5px; line-height: 1.5; }
  .qf { margin: 7px 0 0; padding-left: 15px; display: grid; gap: 2px;
    color: var(--ink-4); font-size: 12.5px; }
  .qf li { line-height: 1.45; }
  .goal-ja { margin: 3px 0 0; color: var(--ink-3); font-size: 12.5px; line-height: 1.55; }

  .chip { padding: 6px 10px; border: 1px solid #dfe3e6; border-radius: var(--radius-sm); background: #fff; color: var(--ink-3); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .chip:hover { color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .chip .dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); vertical-align: 1px; }
  /* 이 페이지에서 실제로 누르는 것은 이 둘뿐이라 버튼처럼 보이게 둔다 */
  .btn { padding: 10px 12px; border: 1px solid #dfe3e6; border-radius: var(--radius-sm); background: #fff;
    color: var(--ink-2); font: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: color-mix(in srgb, var(--tint) 64%, white); color: var(--ink); }
  .btn.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.deep { color: var(--ac); }
  .btn.deep:hover { background: var(--tint); }
  .btn.deep.on { background: var(--ac); border-color: var(--ac); color: #fff; }
  .hits { margin-left: auto; color: var(--ink-3); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- 3단 · 단원 카드 ---------- */
  .groups { margin-top: 18px; display: grid; gap: 12px; }
  .group { border: 1px solid #dfe3e6; border-radius: var(--radius); overflow: hidden; background: #fff;
    box-shadow: none; transition: border-color .16s, background .16s; }
  .group:hover { border-color: #bdc4ca; }
  .group.open { border-color: #c8ced3; }
  .group.hide { display: none; }
  /* 표지. 닫힌 줄에서는 36px 표시이고, 펼치면 자리에서 빠져나와 본문의 118px 표지가
     된다 — 그림 하나가 두 크기를 갖는 것이지 같은 그림이 두 장 있는 것이 아니다.
     자리는 접힌 채로 남지 않는다: 표시가 나가면 번호칩과 제목이 그 자리로 미끄러진다. */
  .gmark { flex: 0 0 auto; width: 36px; height: 45px; overflow: hidden;
    transition: width .28s cubic-bezier(.2,.7,.3,1), margin-left .28s cubic-bezier(.2,.7,.3,1); }
  .group.open .gmark { width: 0; margin-left: -16px; }
  .cov { display: block; width: 36px; height: 45px; border-radius: var(--radius-sm);
    background-size: cover; background-position: center; box-shadow: 0 1px 2px rgba(16,24,32,.14); }
  .plate { display: flex; align-items: center; gap: 20px; }
  .plate-copy { min-width: 0; flex: 1 1 auto; }
  .plate-copy > :first-child { margin-top: 0; }
  .cov-slot { flex: 0 0 auto; width: 118px; height: 148px; }
  .cov-slot .cov { width: 118px; height: 148px; border-radius: var(--radius); }
  /* 나는 동안의 표지. 흐름 밖에 있어서 지나가는 자리가 다시 배치되지 않는다. */
  .cov-flying { position: fixed; z-index: 40; margin: 0; pointer-events: none;
    background-size: cover; background-position: center;
    box-shadow: 0 6px 22px rgba(16,24,32,.22); }
  @media (max-width: 600px) { .plate { gap: 14px; } .cov-slot, .cov-slot .cov { width: 96px; height: 120px; } }

  .ghead { display: flex; align-items: center; gap: 16px;
    width: 100%; padding: 16px 18px; border: 0; background: #fff; font: inherit; text-align: left; cursor: pointer; }
  .group.open .ghead { background: linear-gradient(90deg, color-mix(in srgb, var(--tint) 76%, white), #fff 72%); }
  .gnum { flex: 0 0 auto; display: grid; place-items: center; min-width: 40px; height: 34px; padding: 0 9px; border-radius: var(--radius-sm);
    background: var(--ac); color: #fff; font-size: 12px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; box-shadow: none; }
  .gtitle { flex: 1 1 auto; min-width: 0; font-size: 18px; font-weight: 750; letter-spacing: -.03em; word-break: keep-all; }
  .gtitle em { display: block; margin-top: 2px; color: var(--ink-3); font-style: normal; font-size: 12.5px; font-weight: 500; letter-spacing: 0; }
  .gmeta { display: flex; align-items: center; gap: 14px; color: var(--ink-3); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .gmeta > * { flex: 0 0 auto; }
  .lv-tag { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
  .lv-tag i { width: 9px; height: 9px; border-radius: 1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
  .caret { display: inline-block; width: 10px; color: var(--ink-4); font-size: 9px; }
  .caret::before { content: "\25B8"; }
  .group.open .caret { color: var(--ac); }
  .group.open .caret::before { content: "\25BE"; }
  .gbody { display: none; padding: 12px 20px 20px; }
  .group.open .gbody { display: block; }

  .story { margin: 0; max-width: 70ch; color: var(--ink-2); font-size: 13.5px; line-height: 1.75; word-break: keep-all; }
  .story b { color: var(--ink); font-weight: 750; }
  .story .cast { display: block; margin-top: 5px; color: var(--ink-4); font-size: 12px; }
  .gcan { margin: 12px 0 0; max-width: 70ch; padding: 12px 14px; border-radius: var(--radius-sm);
    background: color-mix(in srgb, var(--tint) 58%, white); color: var(--ink); font-size: 13.5px; line-height: 1.7; word-break: keep-all; }
  .gcan b { display: block; margin-bottom: 2px; color: var(--ac); }

  /* ---------- 4단 · 과 한 줄 ---------- */
  .lessons { margin-top: 16px; display: grid; gap: 6px; }
  /* 머리글이 없는 단원(핵심·한글)에서는 목록이 곧바로 시작한다 */
  .gbody > .lessons:first-child { margin-top: 0; }
  .lesson { border-radius: var(--radius-sm); background: var(--surface); }
  .lesson.hide { display: none; }
  .lrow { display: flex; align-items: center; gap: 10px; }
  .lrow-btn { flex: 1 1 auto; min-width: 0;
    display: grid; grid-template-columns: 58px minmax(0,1fr) minmax(0,auto); align-items: baseline; gap: 16px;
    width: 100%; padding: 12px 13px; border: 0; border-radius: var(--radius-sm); background: none; font: inherit; text-align: left; cursor: pointer; }
  /* 덱이 나와 있는 과에만 붙는 문. 여기는 4단이라 트랙색을 쓰지 않는다 —
     색을 여기까지 내리면 펼친 과 안의 살구색 mark 가 묻힌다. */
  .deck-links { flex: 0 0 auto; display: flex; gap: 5px; margin-right: 13px; }
  .deck { flex: 0 0 auto; padding: 5px 11px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: #fff;
    color: var(--ink-2); font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .deck:hover { border-color: var(--ink); color: var(--ink); }
  .deck .ext { color: var(--ink-4); font-size: 10px; }
  .deck:hover .ext { color: var(--ink-3); }
  .lrow-btn:hover { background: color-mix(in srgb, var(--tint) 50%, white); }
  .lrow-btn:hover .ltitle { color: var(--ink); }
  .lno { color: var(--ac); font-size: 12px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .ltitle { min-width: 0; font-size: 14.5px; font-weight: 650; letter-spacing: -.015em; word-break: keep-all; transition: color .12s; }
  .ltitle em { font-style: normal; color: var(--ink-3); font-weight: 450; letter-spacing: 0; }
  .first-tag { display: inline-block; margin-left: 8px; padding: 2px 6px; border: 1px solid color-mix(in srgb, var(--ac) 28%, var(--line));
    border-radius: var(--radius-sm); color: var(--ac); font-size: 10px; font-weight: 750; letter-spacing: .02em; vertical-align: 1px; }
  .ltitle mark { background: var(--lime); color: var(--ink); border-radius: var(--radius-sm); padding: 0 2px; }
  .lchips { display: none; }
  .lchips .pat { max-width: 26ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .lchips .sep, .lchips .pat.ref { color: var(--ink-4); }
  @media (max-width: 760px) { .lchips { display: none; } .lrow-btn { grid-template-columns: 46px minmax(0,1fr); } }

  /* ---------- 5단 · 펼친 과 ----------
     펼친 과는 얇은 외곽선과 옅은 바닥 하나로만 선택 상태를 만든다. 제목 → 할 수 있는
     것 → 예문 → 표현의 순서를 고정하고, 예문 둘은 넓은 화면에서 나란히 둔다. */
  .lesson.open { margin: 5px 0 10px; border: 1px solid color-mix(in srgb, var(--ac) 42%, #d7dce0);
    background: color-mix(in srgb, var(--tint) 58%, white); border-radius: var(--radius); box-shadow: none; }
  .lesson.open .lrow { padding-right: 16px; }
  .lesson.open .lrow-btn { grid-template-columns: auto minmax(0,1fr); gap: 12px; padding: 17px 18px 12px; }
  .lesson.open .deck-links { margin-right: 0; }
  .lesson.open .lrow-btn:hover { background: transparent; }
  .lesson.open .lno { padding: 3px 8px; border-radius: var(--radius-sm); background: var(--ac); color: #fff; font-weight: 750; }
  .lesson.open .ltitle { font-size: 16px; font-weight: 750; letter-spacing: -.02em; }
  .lesson.open .ltitle em { font-size: 13.5px; }
  .lesson.open .lchips { display: none; }       /* 블록 안에서 패턴 이름이 다시 나온다 */

  .ldetail { display: none; padding: 0 20px 22px; }
  .lesson.open .ldetail { display: block; }
  @media (max-width: 760px) { .ldetail { padding: 0 16px 16px; } }

  /* 펼친 과 안에서는 선 대신 여백·바닥색·작은 라벨로 의미를 나눈다. */
  .field + .field { margin-top: 20px; }
  .field > .lbl { display: inline-flex; align-items: center; margin-bottom: 10px; padding: 4px 7px;
    border-radius: var(--radius-sm); background: color-mix(in srgb, var(--ac) 10%, white); color: var(--ac);
    font-size: 10.5px; letter-spacing: .045em; }
  .field-goal { position: relative; padding: 14px 16px 14px 46px; border-radius: var(--radius-sm); background: rgba(255,255,255,.74); }
  .field-goal::before { content: "\2713"; position: absolute; left: 17px; top: 17px; display: grid; place-items: center;
    width: 22px; height: 22px; border-radius: var(--radius-sm); background: var(--ac); color: #fff; font-size: 13px; font-weight: 800; }
  .field-goal > .lbl { margin-bottom: 5px; padding: 0; background: none; }

  /* 이 과의 약속. 카드에서 제일 먼저 읽혀야 하는 줄이라 본문보다 크고 진하다. */
  .goal { margin: 0; max-width: 62ch; color: var(--ink); font-size: 15px; font-weight: 600; line-height: 1.65; word-break: keep-all; }
  .words { display: flex; flex-wrap: wrap; gap: 6px; }
  .words span { padding: 5px 10px; background: color-mix(in srgb, var(--tint) 55%, white); border-radius: var(--radius-sm); font-size: 16px; font-weight: 700; }
  .scene { margin: 0 0 16px; max-width: 62ch; color: var(--ink-3); font-size: 12.5px; line-height: 1.6; word-break: keep-all; }

  /* 한글 트랙에서는 단어가 결과 예시이고, 실제 학습 대상은 낱자와 조합 규칙이다.
     그래서 글자·규칙을 가장 큰 면에, 읽기 예시는 조용한 보조 줄에 둔다. */
  .hangul-focus { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .hangul-focus-item { min-height: 66px; display: flex; align-items: center; padding: 14px 16px;
    border-radius: var(--radius-sm); background: rgba(255,255,255,.9); color: var(--ink); font-size: 15px;
    font-weight: 700; line-height: 1.65; word-break: keep-all; }
  .hangul-focus-item .jamo { display: inline-block; margin: 0 2px; padding: 1px 5px;

  .field-hangul-practice { margin-top: 16px; }

  .hangul-practice span { color: var(--ink-3); font-size: 13px; font-weight: 600; }
  .hangul-practice span:not(:last-child)::after { content: "\00B7"; margin: 0 9px; color: var(--ink-4); }

  /* 페이지에서 채운 색은 트랙색과 이 살구색뿐이고, 트랙색은 3단 위쪽에만 있다.
     그래서 과를 펼쳤을 때 그 안에서 유일하게 칠해진 것이 배우는 조각이 된다. */
  .pats { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .pcard { padding: 16px; border-radius: var(--radius-sm); background: rgba(255,255,255,.88); box-shadow: none; }

    -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .pcard .reply { margin: 5px 0 0; color: var(--ink-3); font-size: 13px; font-weight: 500; word-break: keep-all; }
  .pcard .reply::before { content: "\21B3 "; color: var(--ink-4); }
  .pcard .pmeta { margin: 10px 0 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 9px; }
  .pcard .pname { color: var(--pat-ink); font-size: 12px; font-weight: 750; }
  .pcard .pgloss { color: var(--ink-4); font-size: 12px; word-break: keep-all; }

  /* 표현 — 훑을 때 눈에 걸리도록 글줄이 아니라 낱개로 앉힌다 */
  .said { display: flex; flex-wrap: wrap; gap: 6px; }
  .said span { padding: 5px 10px; background: rgba(255,255,255,.88); border-radius: var(--radius-sm);
    color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
  .rule { margin: 11px 0 0; max-width: 66ch; color: var(--ink-2); font-size: 12.5px; line-height: 1.7; word-break: keep-all; }
