longer: a tool, furniture, or clothing?"]}]}, {"n": 13, "title": "예의상 먹는 음식", "sub": "礼儀のためだけに食べるもの", "titles": {"ko": "예의상 먹는 음식", "en": "A food you only eat to be polite", "ja": "礼儀のためだけに食べるもの"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-things-i-like-full/33-a-food-you-only-eat-to-be-polite/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-full/33-a-food-you-only-eat-to-be-polite/lecture/index.html", "source": "courses/en/talk-things-i-like-full/lessons/33-a-food-you-only-eat-to-be-polite/lecture/index.html"}, {"href": "view/talk-things-i-like-full/33-a-food-you-only-eat-to-be-polite/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-full/33-a-food-you-only-eat-to-be-polite/prestudy/index.html", "source": "courses/en/talk-things-i-like-full/lessons/33-a-food-you-only-eat-to-be-polite/prestudy/index.html"}], "goal": {"t": "Let's talk about food, honesty, and politeness at the table. Please read the title aloud.", "ja": "食卓での好み、正直さ、礼儀について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "When might someone eat a food just to be polite?", "ja": "礼儀のために、食べ物を食べることがあるのはどんなときですか？", "f": ["Which situation creates the most pressure?", "When is it still reasonable to refuse?"]}, {"n": "WARM-UP 2", "t": "Which is harder to refuse: a friend's homemade dish or an expensive restaurant dish?", "ja": "友人の手料理とレストランの高価な料理では、どちらが断りにくいですか？", "f": ["Why does that one create pressure?", "When would refusal be easier?"]}, {"n": "QUESTION 1", "t": "What taste or texture is hardest to hide your reaction to?", "ja": "反応を隠すのがいちばん難しい味や食感は何ですか？", "f": ["Why does the reaction happen so quickly?", "How could a host notice without words?"]}, {"n": "QUESTION 2", "t": "Where is it hardest to refuse food: someone's home, work, or a restaurant?", "ja": "食べ物を断りにくいのは、誰かの家、職場、レストランのどこですか？", "f": ["What kind of pressure appears there?", "When is refusing still reasonable?"]}, {"n": "QUESTION 3", "t": "How can a host tell that a guest doesn't like a dish?", "ja": "客が料理を好きではないと、ホストはどうすれば分かりますか？", "f": ["What might the host misunderstand?", "How can they make refusal feel safe?"]}, {"n": "QUESTION 4", "t": "How would you kindly say that you didn't like a dish?", "ja": "料理が好みではなかったと、どのように優しく伝えますか？", "f": ["How can you be honest without judging the cooking?", "What useful detail could you add?"]}, {"n": "QUESTION 5", "t": "Why do some popular foods divide opinion?", "ja": "人気があっても好き嫌いが分かれる食べ物があるのはなぜですか？", "f": ["Is taste, texture, or expectation usually the reason?", "Which food is a good example?"]}, {"n": "QUESTION 6", "t": "Which matters more at dinner: honesty or protecting the host's feelings?", "ja": "食事の場では、正直さとホストの気持ちを守ることのどちらが大切ですか？", "f": ["What harm can polite dishonesty cause?", "When does being polite become dishonest?"]}]}]}, {"no": 7, "label": "7코스", "title": "사소한 것들", "titles": {"ko": "사소한 것들", "en": "Small things", "ja": "ささいなこと"}, "subtitle": "(中級) ささいなこと", "desc": {"ko": "사소하고 웃긴 경험을 구체적으로 풀어 말한다.", "en": "Unpack the small, funny things that happen to you, in detail.", "ja": "ささいで笑える経験を、具体的にほどいて話す。"}, "cover": "covers/talk-small-things-accessible.webp", "levels": ["B1"], "level": "B1", "slug": "talk-small-things-accessible", "lessons": [{"n": 1, "title": "늘 신경 쓰이는 사소한 것", "sub": "いつも気になるささいなこと", "titles": {"ko": "늘 신경 쓰이는 사소한 것", "en": "A tiny thing that always annoys you", "ja": "いつも気になるささいなこと"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-small-things-accessible/34-a-tiny-thing-that-always-annoys-you/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-accessible/34-a-tiny-thing-that-always-annoys-you/lecture/index.html", "source": "courses/en/talk-small-things-accessible/lessons/34-a-tiny-thing-that-always-annoys-you/lecture/index.html"}, {"href": "view/talk-small-things-accessible/34-a-tiny-thing-that-always-annoys-you/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-accessible/34-a-tiny-thing-that-always-annoys-you/prestudy/index.html", "source": "courses/en/talk-small-things-accessible/lessons/34-a-tiny-thing-that-always-annoys-you/prestudy/index.html"}], "goal": {"t": "Let's talk about why tiny things can become surprisingly annoying. Please read the title aloud.", "ja": "ささいなことが意外なほど気になる理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one tiny thing that can become surprisingly annoying?", "ja": "意外なほど気になることがある、ささいなことは何ですか？", "f": ["When is it most annoying?", "Which is worse: a repeated sound, a small mess, or waiting?"]}, {"n": "WARM-UP 2", "t": "Where do tiny everyday annoyances happen most often?", "ja": "ささいな日常の不満は、どこで最も起きやすいですか？", "f": ["Do shared spaces or private spaces cause more small annoyances?", "Who usually notices first?"]}, {"n": "QUESTION 1", "t": "What makes your tiny annoyance so hard to ignore?", "ja": "あなたが気にしているささいなことは、なぜ無視しにくいのですか？", "f": ["Is it the repetition, the sound, the mess, or something else?", "Does it bother other people too?"]}, {"n": "QUESTION 2", "t": "How can someone bring up a small annoyance without making it sound huge?", "ja": "ささいな不満を大げさに聞こえないように伝えるには、どのような言い方がよいですか？", "f": ["Would humour help or make the request less clear?", "What exact request could solve the problem?"]}, {"n": "QUESTION 3", "t": "When is a small complaint worth speaking up about?", "ja": "ささいな不満でも、どのようなときは伝える価値がありますか？", "f": ["What could happen if nobody mentions it?", "Where would you draw the line?"]}, {"n": "QUESTION 4", "t": "Now the opposite: what small habit of yours might annoy someone else?", "ja": "では逆に、自分のどんな小さな癖が誰かをイライラさせているかもしれませんか？", "f": ["Has anyone ever mentioned it?", "What would make you change it?"]}, {"n": "QUESTION 5", "t": "Why do small annoyances grow when people are stressed or tired?", "ja": "ストレスや疲れがあると、なぜささいなことがもっと気になるのでしょうか？", "f": ["Which annoyances become easier to ignore after a rest?", "How can someone reset before reacting?"]}, {"n": "QUESTION 6", "t": "Would you try to fix your annoyance, or learn to ignore it?", "ja": "その不満は直そうとしますか、それとも気にしないようにしますか？", "f": ["What is the smallest useful fix?", "When would ignoring it be easier?"]}]}, {"n": 2, "title": "나에 관한 쓸모없는 사실", "sub": "自分についての役に立たない事実", "titles": {"ko": "나에 관한 쓸모없는 사실", "en": "A useless fact about you", "ja": "自分についての役に立たない事実"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-small-things-accessible/35-a-useless-fact-about-you/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-accessible/35-a-useless-fact-about-you/lecture/index.html", "source": "courses/en/talk-small-things-accessible/lessons/35-a-useless-fact-about-you/lecture/index.html"}, {"href": "view/talk-small-things-accessible/35-a-useless-fact-about-you/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-accessible/35-a-useless-fact-about-you/prestudy/index.html", "source": "courses/en/talk-small-things-accessible/lessons/35-a-useless-fact-about-you/prestudy/index.html"}], "goal": {"t": "Let's talk about facts that are interesting even when they aren't useful. Please read the title aloud.", "ja": "役に立たなくても面白い事実について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one fact about you that's interesting but not useful?", "ja": "自分について、面白いけれど役には立たない事実は何ですか？", "f": ["How did you discover it?", "Which is more interesting: a food fact, a habit, or a small skill?"]}, {"n": "WARM-UP 2", "t": "How long has that been true about you?", "ja": "それはいつごろから自分に当てはまっていますか？", "f": ["When did you first notice it?", "Has it ever changed?"]}, {"n": "QUESTION 1", "t": "Who would be most surprised to learn that about you?", "ja": "そのことを知ったら、誰がいちばん驚きそうですか？", "f": ["What would they guess instead?", "Why haven't they noticed it?"]}, {"n": "QUESTION 2", "t": "Why is that fact completely useless?", "ja": "その事実は、なぜまったく役に立たないのですか？", "f": ["Could it ever become useful?", "Why is it still fun to share?"]}, {"n": "QUESTION 3", "t": "How did it become true?", "ja": "どうしてそうなったのですか？", "f": ["Were you born with it, or did you learn or develop it?", "When did you first realize it?"]}, {"n": "QUESTION 4", "t": "What's one genuinely useful fact about you?", "ja": "自分について、本当に役に立つ事実は何ですか？", "f": ["When does it become useful?", "Which is more useful to know: someone's schedule, food allergy, or practical skill?"]}, {"n": "QUESTION 5", "t": "Which would start a better conversation: your useless fact or a useful one?", "ja": "会話のきっかけになるのは、役に立たない事実と役に立つ事実のどちらですか？", "f": ["Who would enjoy hearing it?", "What would you ask next?"]}, {"n": "QUESTION 6", "t": "What unusual fact would you include in a playful introduction?", "ja": "楽しい自己紹介に、どんな少し変わった事実を入れますか？", "f": ["What exact sentence would you say?", "Would a strange habit or a surprising preference be easier to introduce?"]}]}, {"n": 3, "title": "집에서만 하는 습관", "sub": "家でだけする習慣", "titles": {"ko": "집에서만 하는 습관", "en": "A habit you only have at home", "ja": "家でだけする習慣"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-small-things-accessible/36-a-habit-you-only-have-at-home/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-accessible/36-a-habit-you-only-have-at-home/lecture/index.html", "source": "courses/en/talk-small-things-accessible/lessons/36-a-habit-you-only-have-at-home/lecture/index.html"}, {"href": "view/talk-small-things-accessible/36-a-habit-you-only-have-at-home/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-accessible/36-a-habit-you-only-have-at-home/prestudy/index.html", "source": "courses/en/talk-small-things-accessible/lessons/36-a-habit-you-only-have-at-home/prestudy/index.html"}], "goal": {"t": "Let's talk about the habits people keep for home. Please read the title aloud.", "ja": "家でだけする習慣について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one habit you only have at home?", "ja": "家でだけする習慣を一つ挙げるとしたら、何ですか？", "f": ["Do you talk to yourself, eat from the pan, wear old clothes, or do something else?", "Why do you only do it at home?"]}, {"n": "WARM-UP 2", "t": "What does a typical moment with that habit look like?", "ja": "その習慣が出るのは、普段どんな場面ですか？", "f": ["When does it usually happen?", "What would another person notice first?"]}, {"n": "QUESTION 1", "t": "How can a home-only habit begin?", "ja": "家でだけする習慣は、どのように始まるのでしょうか？", "f": ["What need might it meet?", "What could make it last for years?"]}, {"n": "QUESTION 2", "t": "How might a visitor react to an unusual home habit?", "ja": "家での変わった習慣を見たら、訪問者はどう反応しそうですか？", "f": ["What could make the reaction kind instead of judgmental?", "What would be worth explaining?"]}, {"n": "QUESTION 3", "t": "Why do people living together develop unusual routines?", "ja": "一緒に暮らす人たちは、なぜ独特の習慣を作るのでしょうか？", "f": ["What problem might a routine solve?", "How can it become invisible to the people doing it?"]}, {"n": "QUESTION 4", "t": "What's a household habit that could seem unusual somewhere else?", "ja": "別の家庭では変わって見えそうな、家の習慣は何ですか？", "f": ["What situation would make it understandable?", "Which differs more across homes: eating, cleaning, or sleeping habits?"]}, {"n": "QUESTION 5", "t": "What home habit might disappear if someone moved?", "ja": "引っ越したら、どんな家での習慣がなくなりそうですか？", "f": ["Would living with someone new change it?", "Which changes fastest after a move: eating, cleaning, or sleeping habits?"]}, {"n": "QUESTION 6", "t": "When is it reasonable to keep a harmless private habit to yourself?", "ja": "害のない私的な習慣を人に見せないほうがよいのは、どのようなときですか？", "f": ["Would you tell a visitor about the habit?", "When could the habit affect someone else?"]}]}, {"n": 4, "title": "비 오는 날 하는 일", "sub": "雨の日にすること", "titles": {"ko": "비 오는 날 하는 일", "en": "What you do on a rainy day", "ja": "雨の日にすること"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-small-things-accessible/37-what-you-do-on-a-rainy-day/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-accessible/37-what-you-do-on-a-rainy-day/lecture/index.html", "source": "courses/en/talk-small-things-accessible/lessons/37-what-you-do-on-a-rainy-day/lecture/index.html"}, {"href": "view/talk-small-things-accessible/37-what-you-do-on-a-rainy-day/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-accessible/37-what-you-do-on-a-rainy-day/prestudy/index.html", "source": "courses/en/talk-small-things-accessible/lessons/37-what-you-do-on-a-rainy-day/prestudy/index.html"}], "goal": {"t": "Let's build a rainy day from the first drop to the perfect ending. Please read the title aloud.", "ja": "雨の降り始めから理想の終わりまで、雨の日を組み立てて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "It's raining and you have no plans. What happens?", "ja": "雨が降っていて、予定はありません。どう過ごしますか？", "f": ["What do you do first?", "What would make you leave home anyway?"]}, {"n": "WARM-UP 2", "t": "On a rainy day, which sets the mood most: the sound, smell, or view?", "ja": "雨の日の雰囲気を最も作るのは、音、匂い、景色のどれですか？", "f": ["Which detail feels most relaxing?", "Which one could become annoying?"]}, {"n": "QUESTION 1", "t": "What do you enjoy—or dislike—about rainy days?", "ja": "雨の日のどのようなところが好き、または苦手ですか？", "f": ["How does the feeling change when you have to travel?", "Which kind of rain affects your mood most?"]}, {"n": "QUESTION 2", "t": "What's the best food for a rainy day?", "ja": "雨の日にいちばん合う食べ物は何ですか？", "f": ["What makes it fit the weather?", "Would you cook it or get it elsewhere?"]}, {"n": "QUESTION 3", "t": "What kind of plan would you cancel because of rain?", "ja": "雨なら、どのような予定を中止しますか？", "f": ["What amount of rain would change your decision?", "Could the plan move indoors instead?"]}, {"n": "QUESTION 4", "t": "Which rainy-day problem would be hardest to deal with?", "ja": "雨の日のどのような状況が、いちばん大変そうですか？", "f": ["What would make it manageable?", "Which detail would stay in your memory?"]}, {"n": "QUESTION 5", "t": "How can rain improve an ordinary day?", "ja": "雨は、普通の一日をどのようによくすることがありますか？", "f": ["Which plan might become better indoors?", "Who might enjoy the change most?"]}, {"n": "QUESTION 6", "t": "What would your ideal rainy day look like?", "ja": "理想の雨の日は、どのような一日ですか？", "f": ["How much company would fit the day?", "What one thing would ruin it?"]}]}, {"n": 5, "title": "완전히 지쳤을 때 도움이 되는 것", "sub": "くたくたのときに助けになるもの", "titles": {"ko": "완전히 지쳤을 때 도움이 되는 것", "en": "What helps when you're exhausted", "ja": "くたくたのときに助けになるもの"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-small-things-accessible/38-what-helps-when-youre-exhausted/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-accessible/38-what-helps-when-youre-exhausted/lecture/index.html", "source": "courses/en/talk-small-things-accessible/lessons/38-what-helps-when-youre-exhausted/lecture/index.html"}, {"href": "view/talk-small-things-accessible/38-what-helps-when-youre-exhausted/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-accessible/38-what-helps-when-youre-exhausted/prestudy/index.html", "source": "courses/en/talk-small-things-accessible/lessons/38-what-helps-when-youre-exhausted/prestudy/index.html"}], "goal": {"t": "Let's talk about what actually helps when your energy is gone. Please read the title aloud.", "ja": "気力がなくなったとき、本当に助けになることについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "When you're completely exhausted, what helps most?", "ja": "すっかり疲れたとき、何がいちばん助けになりますか？", "f": ["How soon can you tell it is working?", "If rest does not help, what do you try next?"]}, {"n": "WARM-UP 2", "t": "What do you usually need first: rest, food, quiet, or company?", "ja": "普段、最初に必要なのは休息、食事、静けさ、それとも人と過ごすことですか？", "f": ["What gets better first?", "When might a different choice work better?"]}, {"n": "QUESTION 1", "t": "How can you tell that rest is helping?", "ja": "休むことが役立っていると、どう分かりますか？", "f": ["What changes first in your body or mood?", "What if you still feel tired afterward?"]}, {"n": "QUESTION 2", "t": "What kind of help feels welcome when someone is exhausted?", "ja": "誰かが疲れ切っているとき、どのような助けならうれしく感じますか？", "f": ["What kind of help can feel like more work?", "How should someone offer it?"]}, {"n": "QUESTION 3", "t": "What makes exhaustion worse for you?", "ja": "何があると、疲れがもっとひどくなりますか？", "f": ["Which part can you control?", "What do other people often misunderstand about it?"]}, {"n": "QUESTION 4", "t": "What usually uses up your energy fastest?", "ja": "普段、何をするといちばん早く気力を使い切りますか？", "f": ["What early sign appears?", "What helps you preserve some energy?"]}, {"n": "QUESTION 5", "t": "What gives you quick energy but doesn't help for long?", "ja": "すぐ元気は出ても、長くは続かないものは何ですか？", "f": ["Is it coffee, sugar, your phone, or something else?", "How do you feel an hour later?"]}, {"n": "QUESTION 6", "t": "What would you say to someone who felt completely exhausted?", "ja": "完全に疲れ切っている人に、何と伝えますか？", "f": ["What would you ask before giving advice?", "Which common suggestion would you avoid?"]}]}, {"n": 6, "title": "스트레스를 받을 때 실제로 하는 일", "sub": "ストレスがあるとき実際にすること", "titles": {"ko": "스트레스를 받을 때 실제로 하는 일", "en": "What you really do when you're stressed", "ja": "ストレスがあるとき実際にすること"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-small-things-accessible/39-what-you-really-do-when-youre-stressed/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-accessible/39-what-you-really-do-when-youre-stressed/lecture/index.html", "source": "courses/en/talk-small-things-accessible/lessons/39-what-you-really-do-when-youre-stressed/lecture/index.html"}, {"href": "view/talk-small-things-accessible/39-what-you-really-do-when-youre-stressed/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-accessible/39-what-you-really-do-when-youre-stressed/prestudy/index.html", "source": "courses/en/talk-small-things-accessible/lessons/39-what-you-really-do-when-youre-stressed/prestudy/index.html"}], "goal": {"t": "Let's compare what you really do with what you wish you did. Please read the title aloud.", "ja": "ストレスがあるとき実際にすることと、理想の対処を比べましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What do you really do when you're stressed—not what you should do?", "ja": "ストレスがあるとき、するべきことではなく、実際には何をしますか？", "f": ["What appears first in your behaviour?", "What helps you stay steady?"]}, {"n": "WARM-UP 2", "t": "When do unhelpful stress habits show up most often?", "ja": "ストレスへのよくない習慣は、どんなときに最も出やすいですか？", "f": ["What level of stress brings the habit out?", "Does it happen more at work, at home, or while travelling?"]}, {"n": "QUESTION 1", "t": "What's one stress habit that helps briefly but causes problems later?", "ja": "一時的には楽になっても、あとで問題になるストレス時の習慣は何ですか？", "f": ["How long does the relief last?", "What cost appears later?"]}, {"n": "QUESTION 2", "t": "Do you ever hide what you do when you're stressed?", "ja": "ストレスがあるときにすることを、人に隠すことはありますか？", "f": ["Who would you be least likely to tell?", "Which stress habit do people often hide?"]}, {"n": "QUESTION 3", "t": "How has the way you handle stress changed over the past five years?", "ja": "ここ5年で、ストレスへの対処法はどう変わりましたか？", "f": ["Which part has improved?", "Which part has stayed stubborn?"]}, {"n": "QUESTION 4", "t": "When does your usual stress response make things worse?", "ja": "いつものストレス反応が、かえって状況を悪くするのはどんなときですか？", "f": ["Which task or relationship becomes harder?", "What would help instead?"]}, {"n": "QUESTION 5", "t": "When you feel stressed, what would you rather do?", "ja": "ストレスを感じたとき、本当は何をしたいですか？", "f": ["Would five minutes of quiet help?", "What would make the better choice easier?"]}, {"n": "QUESTION 6", "t": "What signal could help you recognize stress sooner?", "ja": "どのようなサインがあれば、もっと早くストレスに気づけますか？", "f": ["What could you do at that first sign?", "Which sign is easiest to ignore?"]}]}, {"n": 7, "title": "믿지는 않아도 따르는 미신", "sub": "信じていなくても従う迷信", "titles": {"ko": "믿지는 않아도 따르는 미신", "en": "A superstition you follow anyway", "ja": "信じていなくても従う迷信"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-small-things-accessible/40-a-superstition-you-follow-anyway/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-accessible/40-a-superstition-you-follow-anyway/lecture/index.html", "source": "courses/en/talk-small-things-accessible/lessons/40-a-superstition-you-follow-anyway/lecture/index.html"}, {"href": "view/talk-small-things-accessible/40-a-superstition-you-follow-anyway/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-accessible/40-a-superstition-you-follow-anyway/prestudy/index.html", "source": "courses/en/talk-small-things-accessible/lessons/40-a-superstition-you-follow-anyway/prestudy/index.html"}], "goal": {"t": "Let's talk about why superstitions survive even when people doubt them. Please read the title aloud.", "ja": "人が疑っていても迷信が残る理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which superstition do you know best, whether or not you follow it?", "ja": "従っているかどうかに関係なく、いちばんよく知っている迷信は何ですか？", "f": ["What action or sign is involved?", "Which do you know better: the number 13, breaking a mirror, or a lucky charm?"]}, {"n": "WARM-UP 2", "t": "What good or bad thing is a superstition supposed to cause?", "ja": "迷信は、どんなよいことや悪いことを起こすと言われていますか？", "f": ["Which result sounds most dramatic?", "Who usually teaches people the superstition?"]}, {"n": "QUESTION 1", "t": "Why do people keep following a superstition they doubt?", "ja": "人は、疑っている迷信にもなぜ従い続けるのでしょうか？", "f": ["What feeling makes the habit hard to drop?", "How can family or tradition matter?"]}, {"n": "QUESTION 2", "t": "Has a coincidence ever made a superstition feel true?", "ja": "偶然の出来事で、迷信が本当に思えたことはありますか？", "f": ["If not, what kind of coincidence might do that?", "Would you still call it chance?"]}, {"n": "QUESTION 3", "t": "What would make you break a superstition on purpose?", "ja": "どのような理由があれば、迷信をわざと破りますか？", "f": ["Would any uneasy feeling remain?", "What new information would change your mind?"]}, {"n": "QUESTION 4", "t": "What's a Japanese superstition an outsider might not know?", "ja": "外国の人が知らなさそうな日本の迷信は何ですか？", "f": ["Where might an outsider see it?", "Which is harder to explain: avoiding four, hiding your thumbs, or not cutting nails at night?"]}, {"n": "QUESTION 5", "t": "What's the strangest superstition you've heard of?", "ja": "知っている中で、いちばん不思議な迷信は何ですか？", "f": ["Which detail makes it memorable?", "Which sounds strangest: a broken mirror, an itchy palm, or a black cat?"]}, {"n": "QUESTION 6", "t": "Which superstition is worth keeping as a tradition?", "ja": "どの迷信は、伝統として残す価値がありますか？", "f": ["How could children learn about it?", "Which could be a harmless tradition: a lucky charm, a lucky food, or a lucky number?"]}]}, {"n": 8, "title": "아무 일정 없는 토요일", "sub": "予定のない土曜日", "titles": {"ko": "아무 일정 없는 토요일", "en": "What a free Saturday looks like", "ja": "予定のない土曜日"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-small-things-accessible/41-what-a-free-saturday-looks-like/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-accessible/41-what-a-free-saturday-looks-like/lecture/index.html", "source": "courses/en/talk-small-things-accessible/lessons/41-what-a-free-saturday-looks-like/lecture/index.html"}, {"href": "view/talk-small-things-accessible/41-what-a-free-saturday-looks-like/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-accessible/41-what-a-free-saturday-looks-like/prestudy/index.html", "source": "courses/en/talk-small-things-accessible/lessons/41-what-a-free-saturday-looks-like/prestudy/index.html"}], "goal": {"t": "Let's talk about what makes a free Saturday feel satisfying. Please read the title aloud.", "ja": "予定のない土曜日を満足できる一日にするものについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Imagine a Saturday with no plans. How would it begin?", "ja": "予定のない土曜日を想像してください。どのように始めますか？", "f": ["What time would the day really start?", "Which part would you refuse to rush?"]}, {"n": "WARM-UP 2", "t": "What would you definitely not do on a free Saturday morning?", "ja": "予定のない土曜の朝に、絶対したくないことは何ですか？", "f": ["Why would it spoil the morning?", "Which would be worse: an alarm, errands, or an early appointment?"]}, {"n": "QUESTION 1", "t": "What routine keeps a free day from feeling wasted?", "ja": "自由な一日を無駄に感じさせない習慣は何ですか？", "f": ["What happens if you skip it?", "Could breakfast, exercise, or a walk do the job?"]}, {"n": "QUESTION 2", "t": "What can ruin an otherwise free Saturday?", "ja": "何も予定のない土曜日を台なしにするものは何ですか？", "f": ["Could you recover the day afterward?", "Which interruption would be acceptable?"]}, {"n": "QUESTION 3", "t": "Why can a free Sunday feel different from a free Saturday?", "ja": "予定のない日曜日は、なぜ土曜日と違って感じるのでしょうか？", "f": ["When does Monday enter your thoughts?", "Which day is easier to enjoy fully?"]}, {"n": "QUESTION 4", "t": "How would your ideal free weekend differ from one five years ago?", "ja": "理想の予定のない週末は、5年前とどう違いますか？", "f": ["What would change most?", "Which older part would you bring back?"]}, {"n": "QUESTION 5", "t": "Would you spend a free day alone or with someone?", "ja": "自由な一日は、一人で過ごしますか、それとも誰かと過ごしますか？", "f": ["Why would that feel better?", "When would you choose the other option?"]}, {"n": "QUESTION 6", "t": "How many plans are enough for a good weekend?", "ja": "よい週末には、予定はいくつあれば十分ですか？", "f": ["When does planning become too much?", "How much empty time feels good?"]}]}, {"n": 9, "title": "우리 집에서만 통했던 규칙", "sub": "自分の家でだけ通じた決まり", "titles": {"ko": "우리 집에서만 통했던 규칙", "en": "A rule that only made sense in your family", "ja": "自分の家でだけ通じた決まり"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-small-things-accessible/42-a-rule-that-only-made-sense-in-your-family/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-accessible/42-a-rule-that-only-made-sense-in-your-family/lecture/index.html", "source": "courses/en/talk-small-things-accessible/lessons/42-a-rule-that-only-made-sense-in-your-family/lecture/index.html"}, {"href": "view/talk-small-things-accessible/42-a-rule-that-only-made-sense-in-your-family/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-accessible/42-a-rule-that-only-made-sense-in-your-family/prestudy/index.html", "source": "courses/en/talk-small-things-accessible/lessons/42-a-rule-that-only-made-sense-in-your-family/prestudy/index.html"}], "goal": {"t": "Let's talk about why household rules make sense in one home and seem strange in another. Please read the title aloud.", "ja": "家庭の決まりが、ある家では自然で別の家では不思議に見える理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Did your family have any rules that seemed strange to other people?", "ja": "自分の家には、ほかの人には変わって見えるルールがありましたか？", "f": ["Was it about meals, cleaning, noise, privacy, or something else?", "Who cared about it most?"]}, {"n": "WARM-UP 2", "t": "Pick one rule. What exactly did everyone have to do?", "ja": "一つ選んでください。みんなは具体的に何をしなければなりませんでしたか？", "f": ["What happened when someone forgot?", "Did guests have to follow it too?"]}, {"n": "QUESTION 1", "t": "When did you first realize other families had different rules?", "ja": "ほかの家庭には違うルールがあると、いつ初めて気づきましたか？", "f": ["Did it happen at a friend's house?", "What surprised you most?"]}, {"n": "QUESTION 2", "t": "Why did the rule make sense in your family?", "ja": "そのルールは、なぜ自分の家では納得できるものだったのですか？", "f": ["What problem did it solve?", "What value did it protect?"]}, {"n": "QUESTION 3", "t": "Would you keep that rule in your own home now?", "ja": "今、自分の家でもそのルールを残したいですか？", "f": ["Why or why not?", "How would you update it?"]}, {"n": "QUESTION 4", "t": "What rule in someone else's home surprised you?", "ja": "ほかの人の家で、驚いたルールは何ですか？", "f": ["If none comes to mind, which would surprise you most: a rule about meals, noise, or bedtime?", "Did the rule make sense after it was explained?"]}, {"n": "QUESTION 5", "t": "How would you explain your family's rule to a guest?", "ja": "自分の家のルールを、来客にどう説明しますか？", "f": ["Which part needs advance warning?", "Where could the family be flexible?"]}, {"n": "QUESTION 6", "t": "Now the opposite: which family rule would you happily get rid of?", "ja": "では逆に、喜んでなくしたい家のルールはどれですか？", "f": ["Why did it last so long?", "What would you replace it with?"]}]}, {"n": 10, "title": "밤이면 떠오르는 창피한 기억", "sub": "夜になると思い出す恥ずかしい記憶", "titles": {"ko": "밤이면 떠오르는 창피한 기억", "en": "An embarrassing memory that comes back at night", "ja": "夜になると思い出す恥ずかしい記憶"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-small-things-accessible/43-an-embarrassing-memory-that-comes-back-at-night/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-accessible/43-an-embarrassing-memory-that-comes-back-at-night/lecture/index.html", "source": "courses/en/talk-small-things-accessible/lessons/43-an-embarrassing-memory-that-comes-back-at-night/lecture/index.html"}, {"href": "view/talk-small-things-accessible/43-an-embarrassing-memory-that-comes-back-at-night/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-accessible/43-an-embarrassing-memory-that-comes-back-at-night/prestudy/index.html", "source": "courses/en/talk-small-things-accessible/lessons/43-an-embarrassing-memory-that-comes-back-at-night/prestudy/index.html"}], "goal": {"t": "Let's talk about why harmless embarrassing memories can stay with us. Please read the title aloud.", "ja": "害のない恥ずかしい記憶が残り続ける理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which is more embarrassing: saying the wrong name or messaging the wrong person?", "ja": "名前を間違えることと、違う人にメッセージを送ることでは、どちらがより恥ずかしいですか？", "f": ["What kind of moment tends to stick?", "Why can night make it feel louder?"]}, {"n": "WARM-UP 2", "t": "What's one harmless awkward moment that people often replay?", "ja": "人が何度も思い出しやすい、害のない気まずい場面を一つ挙げてください。", "f": ["What exactly makes the moment awkward?", "Why can a small mistake stay in memory?"]}, {"n": "QUESTION 1", "t": "How might age change the way an embarrassing memory feels?", "ja": "年齢によって、恥ずかしい記憶の感じ方はどう変わりそうですか？", "f": ["What does experience help someone understand?", "Which moments feel bigger when people are young?"]}, {"n": "QUESTION 2", "t": "Why can an embarrassing moment feel intense even when nobody notices?", "ja": "誰も気づかなくても、なぜ恥ずかしい出来事を強く感じるのでしょうか？", "f": ["Would you worry more about looking rude, foolish, or careless?", "What reaction might you imagine?"]}, {"n": "QUESTION 3", "t": "What would another person probably remember from an embarrassing moment?", "ja": "恥ずかしい出来事について、ほかの人は何を覚えていそうですか？", "f": ["How might their view differ?", "Which detail would they probably forget?"]}, {"n": "QUESTION 4", "t": "What can suddenly bring back an old embarrassing memory?", "ja": "何がきっかけで、昔の恥ずかしい記憶が突然よみがえりますか？", "f": ["Could a place, sound, or situation bring it back?", "Why can it return when nothing else is happening?"]}, {"n": "QUESTION 5", "t": "What would you say to someone replaying an old mistake?", "ja": "昔の失敗を何度も思い出している人に、何と伝えますか？", "f": ["What might they be taking too seriously?", "Which lesson would actually help?"]}, {"n": "QUESTION 6", "t": "When can an embarrassing memory become funny?", "ja": "恥ずかしい記憶は、どのようなときに笑えるものになりますか？", "f": ["What can make the memory feel lighter?", "What makes it safe to laugh about later?"]}]}, {"n": 11, "title": "소리 내어 웃게 한 것", "sub": "声を出して笑ったこと", "titles": {"ko": "소리 내어 웃게 한 것", "en": "Something that made you laugh out loud", "ja": "声を出して笑ったこと"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-small-things-accessible/44-something-that-made-you-laugh-out-loud/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-accessible/44-something-that-made-you-laugh-out-loud/lecture/index.html", "source": "courses/en/talk-small-things-accessible/lessons/44-something-that-made-you-laugh-out-loud/lecture/index.html"}, {"href": "view/talk-small-things-accessible/44-something-that-made-you-laugh-out-loud/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-accessible/44-something-that-made-you-laugh-out-loud/prestudy/index.html", "source": "courses/en/talk-small-things-accessible/lessons/44-something-that-made-you-laugh-out-loud/prestudy/index.html"}], "goal": {"t": "Let's talk about what makes real laughter happen. Please read the title aloud.", "ja": "本当に笑うのはどのようなときか、話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What kind of moment makes you laugh out loud?", "ja": "どのような瞬間に、声を出して笑いますか？", "f": ["What usually catches you off guard?", "How is a real laugh different from a polite laugh?"]}, {"n": "WARM-UP 2", "t": "Why does a joke sometimes need background information?", "ja": "冗談に背景説明が必要なことがあるのはなぜですか？", "f": ["What happens if the listener misses it?", "Can a facial expression or tone make the joke clear?"]}, {"n": "QUESTION 1", "t": "How can another person's reaction make something funnier?", "ja": "ほかの人の反応で、どうしてさらに面白くなるのでしょうか？", "f": ["When does laughter become contagious?", "Can a reaction be funnier than the original joke?"]}, {"n": "QUESTION 2", "t": "Which matters most to you in humour: timing, words, or the situation?", "ja": "笑いでは、タイミング、言葉、状況のどれが自分にとっていちばん大切ですか？", "f": ["What example shows that best?", "Would everyone understand the humour?"]}, {"n": "QUESTION 3", "t": "What kind of humour works reliably on you?", "ja": "どのような笑いなら、普段から自分に合いますか？", "f": ["What example fits your taste?", "When can the same style fail?"]}, {"n": "QUESTION 4", "t": "Which kind of humour is hardest for you to enjoy?", "ja": "どのような笑いが、自分にはいちばん楽しみにくいですか？", "f": ["What makes it uncomfortable or dull?", "Could the right person make it work better?"]}, {"n": "QUESTION 5", "t": "What keeps a funny story funny when someone retells it?", "ja": "面白い話が、語り直しても面白さを保つのはなぜですか？", "f": ["Which detail is essential?", "Which background detail should be cut?"]}, {"n": "QUESTION 6", "t": "What quality makes someone genuinely funny?", "ja": "どのような特徴があると、その人は本当に面白いと感じますか？", "f": ["What details do funny people notice?", "When does trying too hard stop working?"]}]}, {"n": 12, "title": "실제로 잠드는 시간", "sub": "実際に寝る時間", "titles": {"ko": "실제로 잠드는 시간", "en": "Your real bedtime", "ja": "実際に寝る時間"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-small-things-accessible/45-your-real-bedtime/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-accessible/45-your-real-bedtime/lecture/index.html", "source": "courses/en/talk-small-things-accessible/lessons/45-your-real-bedtime/lecture/index.html"}, {"href": "view/talk-small-things-accessible/45-your-real-bedtime/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-accessible/45-your-real-bedtime/prestudy/index.html", "source": "courses/en/talk-small-things-accessible/lessons/45-your-real-bedtime/prestudy/index.html"}], "goal": {"t": "Let's talk about what shapes your real bedtime and the rest you get. Please read the title aloud.", "ja": "実際に眠る時間と、取れる休息を左右するものについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What time did you go to bed last night?", "ja": "昨夜は何時に寝ましたか？", "f": ["What time did you want to sleep?", "What decided what actually happened?"]}, {"n": "WARM-UP 2", "t": "How did you spend the last hour before trying to sleep?", "ja": "眠ろうとする前の最後の一時間を、どのように過ごしましたか？", "f": ["Did the activity have a clear stopping point?", "Why was it easy or hard to stop?"]}, {"n": "QUESTION 1", "t": "How predictable is your bedtime from day to day?", "ja": "毎日の就寝時間は、どのくらい予測できますか？", "f": ["What causes the biggest variation?", "Which part stays fairly stable?"]}, {"n": "QUESTION 2", "t": "How does going to bed late affect the next day?", "ja": "遅く寝ると、次の日にどんな影響がありますか？", "f": ["Which part of the day changes first?", "When does a late night matter less?"]}, {"n": "QUESTION 3", "t": "Have you always gone to bed around this time?", "ja": "以前から、だいたいこの時間に寝ていましたか？", "f": ["What was different five years ago?", "What changed your bedtime?"]}, {"n": "QUESTION 4", "t": "What most often delays or shifts your sleep?", "ja": "何が原因で、眠る時間が遅れたりずれたりしますか？", "f": ["Is it a task, a habit, or needed private time?", "Which part could happen at a different time?"]}, {"n": "QUESTION 5", "t": "Which small change seems most likely to improve your rest?", "ja": "どの小さな変化が、休息をいちばん改善できそうですか？", "f": ["Why does it seem realistic?", "What obstacle would it need to overcome?"]}, {"n": "QUESTION 6", "t": "What's a bedtime routine you could actually stick to?", "ja": "実際に続けられそうな、寝る前の習慣はどんなものですか？", "f": ["When would you start winding down?", "What would you stop doing before bed?"]}]}, {"n": 13, "title": "절대 어기지 않는 개인 원칙", "sub": "絶対に破らない自分のルール", "titles": {"ko": "절대 어기지 않는 개인 원칙", "en": "A personal rule you never break", "ja": "絶対に破らない自分のルール"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-small-things-accessible/46-a-personal-rule-you-never-break/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-accessible/46-a-personal-rule-you-never-break/lecture/index.html", "source": "courses/en/talk-small-things-accessible/lessons/46-a-personal-rule-you-never-break/lecture/index.html"}, {"href": "view/talk-small-things-accessible/46-a-personal-rule-you-never-break/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-accessible/46-a-personal-rule-you-never-break/prestudy/index.html", "source": "courses/en/talk-small-things-accessible/lessons/46-a-personal-rule-you-never-break/prestudy/index.html"}], "goal": {"t": "Let's talk about how personal rules can make repeated decisions easier. Please read the title aloud.", "ja": "自分のルールが、繰り返す判断をどのように楽にするか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one personal rule you try never to break?", "ja": "できるだけ破らないようにしている自分のルールは何ですか？", "f": ["Is it about money, time, health, or other people?", "When did you start following it?"]}, {"n": "WARM-UP 2", "t": "How strict are you about that rule?", "ja": "そのルールを、どのくらい厳しく守っていますか？", "f": ["What exception would be reasonable?", "When did you last break it?"]}, {"n": "QUESTION 1", "t": "What made you turn it into a rule?", "ja": "何がきっかけで、それをルールにしたのですか？", "f": ["Was it one event or a repeated problem?", "What does the rule prevent?"]}, {"n": "QUESTION 2", "t": "When is breaking a personal rule reasonable?", "ja": "どのようなときは、自分のルールを破ってもよいですか？", "f": ["How can you tell if it is an honest exception or just an excuse?", "What should happen afterward?"]}, {"n": "QUESTION 3", "t": "Would your rule seem strange to anyone else?", "ja": "そのルールを変わっていると思う人はいますか？", "f": ["Who might misunderstand it?", "What missing detail would explain it?"]}, {"n": "QUESTION 4", "t": "If a personal rule affects someone else, how much should you explain?", "ja": "自分のルールがほかの人に影響するなら、どこまで理由を説明すべきですか？", "f": ["What do they genuinely need to know?", "Which detail can remain private?"]}, {"n": "QUESTION 5", "t": "How can you tell whether the rule still helps you?", "ja": "そのルールが今も役立っていると、どう判断できますか？", "f": ["What problem does it solve now?", "What would show that it is no longer useful?"]}, {"n": "QUESTION 6", "t": "Now the opposite: what personal rule have you stopped following?", "ja": "では逆に、守るのをやめた自分のルールは何ですか？", "f": ["Why did you stop?", "If none comes to mind, which common rule would you never follow?"]}]}]}, {"no": 8, "label": "8코스", "title": "사소한 것들", "titles": {"ko": "사소한 것들", "en": "Small things", "ja": "ささいなこと"}, "subtitle": "(上級) ささいなこと", "desc": {"ko": "사소하고 웃긴 경험을 구체적으로 풀어 말한다.", "en": "Unpack the small, funny things that happen to you, in detail.", "ja": "ささいで笑える経験を、具体的にほどいて話す。"}, "cover": "covers/talk-small-things-full.webp", "levels": ["C1"], "level": "C1", "slug": "talk-small-things-full", "lessons": [{"n": 1, "title": "늘 신경 쓰이는 사소한 것", "sub": "いつも気になるささいなこと", "titles": {"ko": "늘 신경 쓰이는 사소한 것", "en": "A tiny thing that always annoys you", "ja": "いつも気になるささいなこと"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-small-things-full/34-a-tiny-thing-that-always-annoys-you/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-full/34-a-tiny-thing-that-always-annoys-you/lecture/index.html", "source": "courses/en/talk-small-things-full/lessons/34-a-tiny-thing-that-always-annoys-you/lecture/index.html"}, {"href": "view/talk-small-things-full/34-a-tiny-thing-that-always-annoys-you/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-full/34-a-tiny-thing-that-always-annoys-you/prestudy/index.html", "source": "courses/en/talk-small-things-full/lessons/34-a-tiny-thing-that-always-annoys-you/prestudy/index.html"}], "goal": {"t": "Let's talk about why tiny things can become surprisingly annoying. Please read the title aloud.", "ja": "ささいなことが意外なほど気になる理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one tiny thing that can become surprisingly annoying?", "ja": "意外なほど気になることがある、ささいなことは何ですか？", "f": ["When is it most annoying?", "Which is worse: a repeated sound, a small mess, or waiting?"]}, {"n": "WARM-UP 2", "t": "Where do tiny everyday annoyances happen most often?", "ja": "ささいな日常の不満は、どこで最も起きやすいですか？", "f": ["Do shared spaces or private spaces cause more small annoyances?", "Who usually notices first?"]}, {"n": "QUESTION 1", "t": "What makes your tiny annoyance so hard to ignore?", "ja": "あなたが気にしているささいなことは、なぜ無視しにくいのですか？", "f": ["Is it the repetition, the sound, the mess, or something else?", "Does it bother other people too?"]}, {"n": "QUESTION 2", "t": "How can someone bring up a small annoyance without making it sound huge?", "ja": "ささいな不満を大げさに聞こえないように伝えるには、どのような言い方がよいですか？", "f": ["Would humour help or make the request less clear?", "What exact request could solve the problem?"]}, {"n": "QUESTION 3", "t": "When is a small complaint worth speaking up about?", "ja": "ささいな不満でも、どのようなときは伝える価値がありますか？", "f": ["What could happen if nobody mentions it?", "Where would you draw the line?"]}, {"n": "QUESTION 4", "t": "Now the opposite: what small habit of yours might annoy someone else?", "ja": "では逆に、自分のどんな小さな癖が誰かをイライラさせているかもしれませんか？", "f": ["Has anyone ever mentioned it?", "What would make you change it?"]}, {"n": "QUESTION 5", "t": "Why do small annoyances grow when people are stressed or tired?", "ja": "ストレスや疲れがあると、なぜささいなことがもっと気になるのでしょうか？", "f": ["Which annoyances become easier to ignore after a rest?", "How can someone reset before reacting?"]}, {"n": "QUESTION 6", "t": "Would you try to fix your annoyance, or learn to ignore it?", "ja": "その不満は直そうとしますか、それとも気にしないようにしますか？", "f": ["What is the smallest useful fix?", "When would ignoring it be easier?"]}]}, {"n": 2, "title": "나에 관한 쓸모없는 사실", "sub": "自分についての役に立たない事実", "titles": {"ko": "나에 관한 쓸모없는 사실", "en": "A useless fact about you", "ja": "自分についての役に立たない事実"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-small-things-full/35-a-useless-fact-about-you/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-full/35-a-useless-fact-about-you/lecture/index.html", "source": "courses/en/talk-small-things-full/lessons/35-a-useless-fact-about-you/lecture/index.html"}, {"href": "view/talk-small-things-full/35-a-useless-fact-about-you/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-full/35-a-useless-fact-about-you/prestudy/index.html", "source": "courses/en/talk-small-things-full/lessons/35-a-useless-fact-about-you/prestudy/index.html"}], "goal": {"t": "Let's talk about facts that are interesting even when they aren't useful. Please read the title aloud.", "ja": "役に立たなくても面白い事実について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one fact about you that's interesting but not useful?", "ja": "自分について、面白いけれど役には立たない事実は何ですか？", "f": ["How did you discover it?", "Which is more interesting: a food fact, a habit, or a small skill?"]}, {"n": "WARM-UP 2", "t": "How long has that been true about you?", "ja": "それはいつごろから自分に当てはまっていますか？", "f": ["When did you first notice it?", "Has it ever changed?"]}, {"n": "QUESTION 1", "t": "Who would be most surprised to learn that about you?", "ja": "そのことを知ったら、誰がいちばん驚きそうですか？", "f": ["What would they guess instead?", "Why haven't they noticed it?"]}, {"n": "QUESTION 2", "t": "Why is that fact completely useless?", "ja": "その事実は、なぜまったく役に立たないのですか？", "f": ["Could it ever become useful?", "Why is it still fun to share?"]}, {"n": "QUESTION 3", "t": "How did it become true?", "ja": "どうしてそうなったのですか？", "f": ["Were you born with it, or did you learn or develop it?", "When did you first realize it?"]}, {"n": "QUESTION 4", "t": "What's one genuinely useful fact about you?", "ja": "自分について、本当に役に立つ事実は何ですか？", "f": ["When does it become useful?", "Which is more useful to know: someone's schedule, food allergy, or practical skill?"]}, {"n": "QUESTION 5", "t": "Which would start a better conversation: your useless fact or a useful one?", "ja": "会話のきっかけになるのは、役に立たない事実と役に立つ事実のどちらですか？", "f": ["Who would enjoy hearing it?", "What would you ask next?"]}, {"n": "QUESTION 6", "t": "What unusual fact would you include in a playful introduction?", "ja": "楽しい自己紹介に、どんな少し変わった事実を入れますか？", "f": ["What exact sentence would you say?", "Would a strange habit or a surprising preference be easier to introduce?"]}]}, {"n": 3, "title": "집에서만 하는 습관", "sub": "家でだけする習慣", "titles": {"ko": "집에서만 하는 습관", "en": "A habit you only have at home", "ja": "家でだけする習慣"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-small-things-full/36-a-habit-you-only-have-at-home/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-full/36-a-habit-you-only-have-at-home/lecture/index.html", "source": "courses/en/talk-small-things-full/lessons/36-a-habit-you-only-have-at-home/lecture/index.html"}, {"href": "view/talk-small-things-full/36-a-habit-you-only-have-at-home/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-full/36-a-habit-you-only-have-at-home/prestudy/index.html", "source": "courses/en/talk-small-things-full/lessons/36-a-habit-you-only-have-at-home/prestudy/index.html"}], "goal": {"t": "Let's talk about the habits people keep for home. Please read the title aloud.", "ja": "家でだけする習慣について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one habit you only have at home?", "ja": "家でだけする習慣を一つ挙げるとしたら、何ですか？", "f": ["Do you talk to yourself, eat from the pan, wear old clothes, or do something else?", "Why do you only do it at home?"]}, {"n": "WARM-UP 2", "t": "What does a typical moment with that habit look like?", "ja": "その習慣が出るのは、普段どんな場面ですか？", "f": ["When does it usually happen?", "What would another person notice first?"]}, {"n": "QUESTION 1", "t": "How can a home-only habit begin?", "ja": "家でだけする習慣は、どのように始まるのでしょうか？", "f": ["What need might it meet?", "What could make it last for years?"]}, {"n": "QUESTION 2", "t": "How might a visitor react to an unusual home habit?", "ja": "家での変わった習慣を見たら、訪問者はどう反応しそうですか？", "f": ["What could make the reaction kind instead of judgmental?", "What would be worth explaining?"]}, {"n": "QUESTION 3", "t": "Why do people living together develop unusual routines?", "ja": "一緒に暮らす人たちは、なぜ独特の習慣を作るのでしょうか？", "f": ["What problem might a routine solve?", "How can it become invisible to the people doing it?"]}, {"n": "QUESTION 4", "t": "What's a household habit that could seem unusual somewhere else?", "ja": "別の家庭では変わって見えそうな、家の習慣は何ですか？", "f": ["What situation would make it understandable?", "Which differs more across homes: eating, cleaning, or sleeping habits?"]}, {"n": "QUESTION 5", "t": "What home habit might disappear if someone moved?", "ja": "引っ越したら、どんな家での習慣がなくなりそうですか？", "f": ["Would living with someone new change it?", "Which changes fastest after a move: eating, cleaning, or sleeping habits?"]}, {"n": "QUESTION 6", "t": "When is it reasonable to keep a harmless private habit to yourself?", "ja": "害のない私的な習慣を人に見せないほうがよいのは、どのようなときですか？", "f": ["Would you tell a visitor about the habit?", "When could the habit affect someone else?"]}]}, {"n": 4, "title": "비 오는 날 하는 일", "sub": "雨の日にすること", "titles": {"ko": "비 오는 날 하는 일", "en": "What you do on a rainy day", "ja": "雨の日にすること"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-small-things-full/37-what-you-do-on-a-rainy-day/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-full/37-what-you-do-on-a-rainy-day/lecture/index.html", "source": "courses/en/talk-small-things-full/lessons/37-what-you-do-on-a-rainy-day/lecture/index.html"}, {"href": "view/talk-small-things-full/37-what-you-do-on-a-rainy-day/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-full/37-what-you-do-on-a-rainy-day/prestudy/index.html", "source": "courses/en/talk-small-things-full/lessons/37-what-you-do-on-a-rainy-day/prestudy/index.html"}], "goal": {"t": "Let's build a rainy day from the first drop to the perfect ending. Please read the title aloud.", "ja": "雨の降り始めから理想の終わりまで、雨の日を組み立てて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "It's raining and you have no plans. What happens?", "ja": "雨が降っていて、予定はありません。どう過ごしますか？", "f": ["What do you do first?", "What would make you leave home anyway?"]}, {"n": "WARM-UP 2", "t": "On a rainy day, which sets the mood most: the sound, smell, or view?", "ja": "雨の日の雰囲気を最も作るのは、音、匂い、景色のどれですか？", "f": ["Which detail feels most relaxing?", "Which one could become annoying?"]}, {"n": "QUESTION 1", "t": "What do you enjoy—or dislike—about rainy days?", "ja": "雨の日のどのようなところが好き、または苦手ですか？", "f": ["How does the feeling change when you have to travel?", "Which kind of rain affects your mood most?"]}, {"n": "QUESTION 2", "t": "What's the best food for a rainy day?", "ja": "雨の日にいちばん合う食べ物は何ですか？", "f": ["What makes it fit the weather?", "Would you cook it or get it elsewhere?"]}, {"n": "QUESTION 3", "t": "What kind of plan would you cancel because of rain?", "ja": "雨なら、どのような予定を中止し "QUESTION 6", "t": "What signal could help you recognize stress sooner?", "ja": "どのようなサインがあれば、もっと早くストレスに気づけますか？", "f": ["What could you do at that first sign?", "Which sign is easiest to ignore?"]}]}, {"n": 7, "title": "믿지는 않아도 따르는 미신", "sub": "信じていなくても従う迷信", "titles": {"ko": "믿지는 않아도 따르는 미신", "en": "A superstition you follow anyway", "ja": "信じていなくても従う迷信"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-small-things-full/40-a-superstition-you-follow-anyway/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-full/40-a-superstition-you-follow-anyway/lecture/index.html", "source": "courses/en/talk-small-things-full/lessons/40-a-superstition-you-follow-anyway/lecture/index.html"}, {"href": "view/talk-small-things-full/40-a-superstition-you-follow-anyway/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-full/40-a-superstition-you-follow-anyway/prestudy/index.html", "source": "courses/en/talk-small-things-full/lessons/40-a-superstition-you-follow-anyway/prestudy/index.html"}], "goal": {"t": "Let's talk about why superstitions survive even when people doubt them. Please read the title aloud.", "ja": "人が疑っていても迷信が残る理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which superstition do you know best, whether or not you follow it?", "ja": "従っているかどうかに関係なく、いちばんよく知っている迷信は何ですか？", "f": ["What action or sign is involved?", "Which do you know better: the number 13, breaking a mirror, or a lucky charm?"]}, {"n": "WARM-UP 2", "t": "What good or bad thing is a superstition supposed to cause?", "ja": "迷信は、どんなよいことや悪いことを起こすと言われていますか？", "f": ["Which result sounds most dramatic?", "Who usually teaches people the superstition?"]}, {"n": "QUESTION 1", "t": "Why do people keep following a superstition they doubt?", "ja": "人は、疑っている迷信にもなぜ従い続けるのでしょうか？", "f": ["What feeling makes the habit hard to drop?", "How can family or tradition matter?"]}, {"n": "QUESTION 2", "t": "Has a coincidence ever made a superstition feel true?", "ja": "偶然の出来事で、迷信が本当に思えたことはありますか？", "f": ["If not, what kind of coincidence might do that?", "Would you still call it chance?"]}, {"n": "QUESTION 3", "t": "What would make you break a superstition on purpose?", "ja": "どのような理由があれば、迷信をわざと破りますか？", "f": ["Would any uneasy feeling remain?", "What new information would change your mind?"]}, {"n": "QUESTION 4", "t": "What's a Japanese superstition an outsider might not know?", "ja": "外国の人が知らなさそうな日本の迷信は何ですか？", "f": ["Where might an outsider see it?", "Which is harder to explain: avoiding four, hiding your thumbs, or not cutting nails at night?"]}, {"n": "QUESTION 5", "t": "What's the strangest superstition you've heard of?", "ja": "知っている中で、いちばん不思議な迷信は何ですか？", "f": ["Which detail makes it memorable?", "Which sounds strangest: a broken mirror, an itchy palm, or a black cat?"]}, {"n": "QUESTION 6", "t": "Which superstition is worth keeping as a tradition?", "ja": "どの迷信は、伝統として残す価値がありますか？", "f": ["How could children learn about it?", "Which could be a harmless tradition: a lucky charm, a lucky food, or a lucky number?"]}]}, {"n": 8, "title": "아무 일정 없는 토요일", "sub": "予定のない土曜日", "titles": {"ko": "아무 일정 없는 토요일", "en": "What a free Saturday looks like", "ja": "予定のない土曜日"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-small-things-full/41-what-a-free-saturday-looks-like/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-full/41-what-a-free-saturday-looks-like/lecture/index.html", "source": "courses/en/talk-small-things-full/lessons/41-what-a-free-saturday-looks-like/lecture/index.html"}, {"href": "view/talk-small-things-full/41-what-a-free-saturday-looks-like/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-full/41-what-a-free-saturday-looks-like/prestudy/index.html", "source": "courses/en/talk-small-things-full/lessons/41-what-a-free-saturday-looks-like/prestudy/index.html"}], "goal": {"t": "Let's talk about what makes a free Saturday feel satisfying. Please read the title aloud.", "ja": "予定のない土曜日を満足できる一日にするものについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Imagine a Saturday with no plans. How would it begin?", "ja": "予定のない土曜日を想像してください。どのように始めますか？", "f": ["What time would the day really start?", "Which part would you refuse to rush?"]}, {"n": "WARM-UP 2", "t": "What would you definitely not do on a free Saturday morning?", "ja": "予定のない土曜の朝に、絶対したくないことは何ですか？", "f": ["Why would it spoil the morning?", "Which would be worse: an alarm, errands, or an early appointment?"]}, {"n": "QUESTION 1", "t": "What routine keeps a free day from feeling wasted?", "ja": "自由な一日を無駄に感じさせない習慣は何ですか？", "f": ["What happens if you skip it?", "Could breakfast, exercise, or a walk do the job?"]}, {"n": "QUESTION 2", "t": "What can ruin an otherwise free Saturday?", "ja": "何も予定のない土曜日を台なしにするものは何ですか？", "f": ["Could you recover the day afterward?", "Which interruption would be acceptable?"]}, {"n": "QUESTION 3", "t": "Why can a free Sunday feel different from a free Saturday?", "ja": "予定のない日曜日は、なぜ土曜日と違って感じるのでしょうか？", "f": ["When does Monday enter your thoughts?", "Which day is easier to enjoy fully?"]}, {"n": "QUESTION 4", "t": "How would your ideal free weekend differ from one five years ago?", "ja": "理想の予定のない週末は、5年前とどう違いますか？", "f": ["What would change most?", "Which older part would you bring back?"]}, {"n": "QUESTION 5", "t": "Would you spend a free day alone or with someone?", "ja": "自由な一日は、一人で過ごしますか、それとも誰かと過ごしますか？", "f": ["Why would that feel better?", "When would you choose the other option?"]}, {"n": "QUESTION 6", "t": "How many plans are enough for a good weekend?", "ja": "よい週末には、予定はいくつあれば十分ですか？", "f": ["When does planning become too much?", "How much empty time feels good?"]}]}, {"n": 9, "title": "우리 집에서만 통했던 규칙", "sub": "自分の家でだけ通じた決まり", "titles": {"ko": "우리 집에서만 통했던 규칙", "en": "A rule that only made sense in your family", "ja": "自分の家でだけ通じた決まり"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-small-things-full/42-a-rule-that-only-made-sense-in-your-family/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-full/42-a-rule-that-only-made-sense-in-your-family/lecture/index.html", "source": "courses/en/talk-small-things-full/lessons/42-a-rule-that-only-made-sense-in-your-family/lecture/index.html"}, {"href": "view/talk-small-things-full/42-a-rule-that-only-made-sense-in-your-family/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-full/42-a-rule-that-only-made-sense-in-your-family/prestudy/index.html", "source": "courses/en/talk-small-things-full/lessons/42-a-rule-that-only-made-sense-in-your-family/prestudy/index.html"}], "goal": {"t": "Let's talk about why household rules make sense in one home and seem strange in another. Please read the title aloud.", "ja": "家庭の決まりが、ある家では自然で別の家では不思議に見える理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Did your family have any rules that seemed strange to other people?", "ja": "自分の家には、ほかの人には変わって見えるルールがありましたか？", "f": ["Was it about meals, cleaning, noise, privacy, or something else?", "Who cared about it most?"]}, {"n": "WARM-UP 2", "t": "Pick one rule. What exactly did everyone have to do?", "ja": "一つ選んでください。みんなは具体的に何をしなければなりませんでしたか？", "f": ["What happened when someone forgot?", "Did guests have to follow it too?"]}, {"n": "QUESTION 1", "t": "When did you first realize other families had different rules?", "ja": "ほかの家庭には違うルールがあると、いつ初めて気づきましたか？", "f": ["Did it happen at a friend's house?", "What surprised you most?"]}, {"n": "QUESTION 2", "t": "Why did the rule make sense in your family?", "ja": "そのルールは、なぜ自分の家では納得できるものだったのですか？", "f": ["What problem did it solve?", "What value did it protect?"]}, {"n": "QUESTION 3", "t": "Would you keep that rule in your own home now?", "ja": "今、自分の家でもそのルールを残したいですか？", "f": ["Why or why not?", "How would you update it?"]}, {"n": "QUESTION 4", "t": "What rule in someone else's home surprised you?", "ja": "ほかの人の家で、驚いたルールは何ですか？", "f": ["If none comes to mind, which would surprise you most: a rule about meals, noise, or bedtime?", "Did the rule make sense after it was explained?"]}, {"n": "QUESTION 5", "t": "How would you explain your family's rule to a guest?", "ja": "自分の家のルールを、来客にどう説明しますか？", "f": ["Which part needs advance warning?", "Where could the family be flexible?"]}, {"n": "QUESTION 6", "t": "Now the opposite: which family rule would you happily get rid of?", "ja": "では逆に、喜んでなくしたい家のルールはどれですか？", "f": ["Why did it last so long?", "What would you replace it with?"]}]}, {"n": 10, "title": "밤이면 떠오르는 창피한 기억", "sub": "夜になると思い出す恥ずかしい記憶", "titles": {"ko": "밤이면 떠오르는 창피한 기억", "en": "An embarrassing memory that comes back at night", "ja": "夜になると思い出す恥ずかしい記憶"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-small-things-full/43-an-embarrassing-memory-that-comes-back-at-night/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-full/43-an-embarrassing-memory-that-comes-back-at-night/lecture/index.html", "source": "courses/en/talk-small-things-full/lessons/43-an-embarrassing-memory-that-comes-back-at-night/lecture/index.html"}, {"href": "view/talk-small-things-full/43-an-embarrassing-memory-that-comes-back-at-night/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-full/43-an-embarrassing-memory-that-comes-back-at-night/prestudy/index.html", "source": "courses/en/talk-small-things-full/lessons/43-an-embarrassing-memory-that-comes-back-at-night/prestudy/index.html"}], "goal": {"t": "Let's talk about why harmless embarrassing memories can stay with us. Please read the title aloud.", "ja": "害のない恥ずかしい記憶が残り続ける理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which is more embarrassing: saying the wrong name or messaging the wrong person?", "ja": "名前を間違えることと、違う人にメッセージを送ることでは、どちらがより恥ずかしいですか？", "f": ["What kind of moment tends to stick?", "Why can night make it feel louder?"]}, {"n": "WARM-UP 2", "t": "What's one harmless awkward moment that people often replay?", "ja": "人が何度も思い出しやすい、害のない気まずい場面を一つ挙げてください。", "f": ["What exactly makes the moment awkward?", "Why can a small mistake stay in memory?"]}, {"n": "QUESTION 1", "t": "How might age change the way an embarrassing memory feels?", "ja": "年齢によって、恥ずかしい記憶の感じ方はどう変わりそうですか？", "f": ["What does experience help someone understand?", "Which moments feel bigger when people are young?"]}, {"n": "QUESTION 2", "t": "Why can an embarrassing moment feel intense even when nobody notices?", "ja": "誰も気づかなくても、なぜ恥ずかしい出来事を強く感じるのでしょうか？", "f": ["Would you worry more about looking rude, foolish, or careless?", "What reaction might you imagine?"]}, {"n": "QUESTION 3", "t": "What would another person probably remember from an embarrassing moment?", "ja": "恥ずかしい出来事について、ほかの人は何を覚えていそうですか？", "f": ["How might their view differ?", "Which detail would they probably forget?"]}, {"n": "QUESTION 4", "t": "What can suddenly bring back an old embarrassing memory?", "ja": "何がきっかけで、昔の恥ずかしい記憶が突然よみがえりますか？", "f": ["Could a place, sound, or situation bring it back?", "Why can it return when nothing else is happening?"]}, {"n": "QUESTION 5", "t": "What would you say to someone replaying an old mistake?", "ja": "昔の失敗を何度も思い出している人に、何と伝えますか？", "f": ["What might they be taking too seriously?", "Which lesson would actually help?"]}, {"n": "QUESTION 6", "t": "When can an embarrassing memory become funny?", "ja": "恥ずかしい記憶は、どのようなときに笑えるものになりますか？", "f": ["What can make the memory feel lighter?", "What makes it safe to laugh about later?"]}]}, {"n": 11, "title": "소리 내어 웃게 한 것", "sub": "声を出して笑ったこと", "titles": {"ko": "소리 내어 웃게 한 것", "en": "Something that made you laugh out loud", "ja": "声を出して笑ったこと"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-small-things-full/44-something-that-made-you-laugh-out-loud/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-full/44-something-that-made-you-laugh-out-loud/lecture/index.html", "source": "courses/en/talk-small-things-full/lessons/44-something-that-made-you-laugh-out-loud/lecture/index.html"}, {"href": "view/talk-small-things-full/44-something-that-made-you-laugh-out-loud/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-full/44-something-that-made-you-laugh-out-loud/prestudy/index.html", "source": "courses/en/talk-small-things-full/lessons/44-something-that-made-you-laugh-out-loud/prestudy/index.html"}], "goal": {"t": "Let's talk about what makes real laughter happen. Please read the title aloud.", "ja": "本当に笑うのはどのようなときか、話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What kind of moment makes you laugh out loud?", "ja": "どのような瞬間に、声を出して笑いますか？", "f": ["What usually catches you off guard?", "How is a real laugh different from a polite laugh?"]}, {"n": "WARM-UP 2", "t": "Why does a joke sometimes need background information?", "ja": "冗談に背景説明が必要なことがあるのはなぜですか？", "f": ["What happens if the listener misses it?", "Can a facial expression or tone make the joke clear?"]}, {"n": "QUESTION 1", "t": "How can another person's reaction make something funnier?", "ja": "ほかの人の反応で、どうしてさらに面白くなるのでしょうか？", "f": ["When does laughter become contagious?", "Can a reaction be funnier than the original joke?"]}, {"n": "QUESTION 2", "t": "Which matters most to you in humour: timing, words, or the situation?", "ja": "笑いでは、タイミング、言葉、状況のどれが自分にとっていちばん大切ですか？", "f": ["What example shows that best?", "Would everyone understand the humour?"]}, {"n": "QUESTION 3", "t": "What kind of humour works reliably on you?", "ja": "どのような笑いなら、普段から自分に合いますか？", "f": ["What example fits your taste?", "When can the same style fail?"]}, {"n": "QUESTION 4", "t": "Which kind of humour is hardest for you to enjoy?", "ja": "どのような笑いが、自分にはいちばん楽しみにくいですか？", "f": ["What makes it uncomfortable or dull?", "Could the right person make it work better?"]}, {"n": "QUESTION 5", "t": "What keeps a funny story funny when someone retells it?", "ja": "面白い話が、語り直しても面白さを保つのはなぜですか？", "f": ["Which detail is essential?", "Which background detail should be cut?"]}, {"n": "QUESTION 6", "t": "What quality makes someone genuinely funny?", "ja": "どのような特徴があると、その人は本当に面白いと感じますか？", "f": ["What details do funny people notice?", "When does trying too hard stop working?"]}]}, {"n": 12, "title": "실제로 잠드는 시간", "sub": "実際に寝る時間", "titles": {"ko": "실제로 잠드는 시간", "en": "Your real bedtime", "ja": "実際に寝る時間"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-small-things-full/45-your-real-bedtime/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-full/45-your-real-bedtime/lecture/index.html", "source": "courses/en/talk-small-things-full/lessons/45-your-real-bedtime/lecture/index.html"}, {"href": "view/talk-small-things-full/45-your-real-bedtime/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-full/45-your-real-bedtime/prestudy/index.html", "source": "courses/en/talk-small-things-full/lessons/45-your-real-bedtime/prestudy/index.html"}], "goal": {"t": "Let's talk about what shapes your real bedtime and the rest you get. Please read the title aloud.", "ja": "実際に眠る時間と、取れる休息を左右するものについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What time did you go to bed last night?", "ja": "昨夜は何時に寝ましたか？", "f": ["What time did you want to sleep?", "What decided what actually happened?"]}, {"n": "WARM-UP 2", "t": "How did you spend the last hour before trying to sleep?", "ja": "眠ろうとする前の最後の一時間を、どのように過ごしましたか？", "f": ["Did the activity have a clear stopping point?", "Why was it easy or hard to stop?"]}, {"n": "QUESTION 1", "t": "How predictable is your bedtime from day to day?", "ja": "毎日の就寝時間は、どのくらい予測できますか？", "f": ["What causes the biggest variation?", "Which part stays fairly stable?"]}, {"n": "QUESTION 2", "t": "How does going to bed late affect the next day?", "ja": "遅く寝ると、次の日にどんな影響がありますか？", "f": ["Which part of the day changes first?", "When does a late night matter less?"]}, {"n": "QUESTION 3", "t": "Have you always gone to bed around this time?", "ja": "以前から、だいたいこの時間に寝ていましたか？", "f": ["What was different five years ago?", "What changed your bedtime?"]}, {"n": "QUESTION 4", "t": "What most often delays or shifts your sleep?", "ja": "何が原因で、眠る時間が遅れたりずれたりしますか？", "f": ["Is it a task, a habit, or needed private time?", "Which part could happen at a different time?"]}, {"n": "QUESTION 5", "t": "Which small change seems most likely to improve your rest?", "ja": "どの小さな変化が、休息をいちばん改善できそうですか？", "f": ["Why does it seem realistic?", "What obstacle would it need to overcome?"]}, {"n": "QUESTION 6", "t": "What's a bedtime routine you could actually stick to?", "ja": "実際に続けられそうな、寝る前の習慣はどんなものですか？", "f": ["When would you start winding down?", "What would you stop doing before bed?"]}]}, {"n": 13, "title": "절대 어기지 않는 개인 원칙", "sub": "絶対に破らない自分のルール", "titles": {"ko": "절대 어기지 않는 개인 원칙", "en": "A personal rule you never break", "ja": "絶対に破らない自分のルール"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-small-things-full/46-a-personal-rule-you-never-break/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-small-things-full/46-a-personal-rule-you-never-break/lecture/index.html", "source": "courses/en/talk-small-things-full/lessons/46-a-personal-rule-you-never-break/lecture/index.html"}, {"href": "view/talk-small-things-full/46-a-personal-rule-you-never-break/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-small-things-full/46-a-personal-rule-you-never-break/prestudy/index.html", "source": "courses/en/talk-small-things-full/lessons/46-a-personal-rule-you-never-break/prestudy/index.html"}], "goal": {"t": "Let's talk about how personal rules can make repeated decisions easier. Please read the title aloud.", "ja": "自分のルールが、繰り返す判断をどのように楽にするか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one personal rule you try never to break?", "ja": "できるだけ破らないようにしている自分のルールは何ですか？", "f": ["Is it about money, time, health, or other people?", "When did you start following it?"]}, {"n": "WARM-UP 2", "t": "How strict are you about that rule?", "ja": "そのルールを、どのくらい厳しく守っていますか？", "f": ["What exception would be reasonable?", "When did you last break it?"]}, {"n": "QUESTION 1", "t": "What made you turn it into a rule?", "ja": "何がきっかけで、それをルールにしたのですか？", "f": ["Was it one event or a repeated problem?", "What does the rule prevent?"]}, {"n": "QUESTION 2", "t": "When is breaking a personal rule reasonable?", "ja": "どのようなときは、自分のルールを破ってもよいですか？", "f": ["How can you tell if it is an honest exception or just an excuse?", "What should happen afterward?"]}, {"n": "QUESTION 3", "t": "Would your rule seem strange to anyone else?", "ja": "そのルールを変わっていると思う人はいますか？", "f": ["Who might misunderstand it?", "What missing detail would explain it?"]}, {"n": "QUESTION 4", "t": "If a personal rule affects someone else, how much should you explain?", "ja": "自分のルールがほかの人に影響するなら、どこまで理由を説明すべきですか？", "f": ["What do they genuinely need to know?", "Which detail can remain private?"]}, {"n": "QUESTION 5", "t": "How can you tell whether the rule still helps you?", "ja": "そのルールが今も役立っていると、どう判断できますか？", "f": ["What problem does it solve now?", "What would show that it is no longer useful?"]}, {"n": "QUESTION 6", "t": "Now the opposite: what personal rule have you stopped following?", "ja": "では逆に、守るのをやめた自分のルールは何ですか？", "f": ["Why did you stop?", "If none comes to mind, which common rule would you never follow?"]}]}]}, {"no": 9, "label": "9코스", "title": "사람과 관계", "titles": {"ko": "사람과 관계", "en": "People and ties", "ja": "人と関係"}, "subtitle": "(中級) 人と関係", "desc": {"ko": "실제 관계 경험을 꺼내고 그 경험에서 생긴 의견을 설명한다.", "en": "Bring up real experiences with people, and the opinions those experiences left you with.", "ja": "実際の人間関係の経験を出し、そこから生まれた考えを説明する。"}, "cover": "covers/talk-people-and-ties-accessible.webp", "levels": ["B1"], "level": "B1", "slug": "talk-people-and-ties-accessible", "lessons": [{"n": 1, "title": "오래가는 우정의 조건", "sub": "友情が長く続く理由", "titles": {"ko": "오래가는 우정의 조건", "en": "What makes a friendship last", "ja": "友情が長く続く理由"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-people-and-ties-accessible/47-what-makes-a-friendship-last/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-accessible/47-what-makes-a-friendship-last/lecture/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/47-what-makes-a-friendship-last/lecture/index.html"}, {"href": "view/talk-people-and-ties-accessible/47-what-makes-a-friendship-last/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-accessible/47-what-makes-a-friendship-last/prestudy/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/47-what-makes-a-friendship-last/prestudy/index.html"}], "goal": {"t": "Let's talk about what helps friendships last as life changes. Please read the title aloud.", "ja": "生活が変わっても友情が続く理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What helps a friendship to last as both lives change?", "ja": "お互いの生活が変わっても友情が続くために、何が必要ですか？", "f": ["Which life change tests a friendship most?", "What can friends do to stay close?"]}, {"n": "WARM-UP 2", "t": "What kind of ordinary meeting can grow into a strong friendship?", "ja": "どんな普通の出会いが、強い友情に育つことがありますか？", "f": ["What gives the two people something to talk about?", "When do they start feeling like close friends?"]}, {"n": "QUESTION 1", "t": "How can a friendship change without losing its strength?", "ja": "友情は、強さを失わずにどのように変化していけますか？", "f": ["Which changes can be healthy?", "What should still feel familiar?"]}, {"n": "QUESTION 2", "t": "When friends are busy, what kind of contact keeps them close without creating pressure?", "ja": "友人同士が忙しいとき、プレッシャーを生まずに親しさを保つのは、どんな連絡ですか？", "f": ["How much contact keeps closeness?", "What shows care without feeling like a duty?"]}, {"n": "QUESTION 3", "t": "Which behaviour hurts a friendship?", "ja": "友情に最も大きな損害を与えるのは、どのような行動ですか？", "f": ["Why does it hurt the friendship?", "What would the person need to do next?"]}, {"n": "QUESTION 4", "t": "Why do some friendships fade even when neither person is at fault?", "ja": "どちらも悪くなくても、友情が薄れていくのはなぜですか？", "f": ["Which life change most quickly reduces contact?", "When is growing apart simply a normal change?"]}, {"n": "QUESTION 5", "t": "When is a friendship worth trying to revive?", "ja": "友情をもう一度よみがえらせる価値があるのは、どのようなときですか？", "f": ["What could reopen contact naturally?", "How can renewed contact avoid creating pressure?"]}, {"n": "QUESTION 6", "t": "What do you bring to a strong friendship?", "ja": "強い友情に、自分は何を与えていますか？", "f": ["How would close friends describe what you bring to the relationship?", "What would you still like to improve?"]}]}, {"n": 2, "title": "완전히 틀렸던 첫인상", "sub": "まったく違っていた第一印象", "titles": {"ko": "완전히 틀렸던 첫인상", "en": "A first impression that was completely wrong", "ja": "まったく違っていた第一印象"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-people-and-ties-accessible/48-a-first-impression-that-was-completely-wrong/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-accessible/48-a-first-impression-that-was-completely-wrong/lecture/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/48-a-first-impression-that-was-completely-wrong/lecture/index.html"}, {"href": "view/talk-people-and-ties-accessible/48-a-first-impression-that-was-completely-wrong/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-accessible/48-a-first-impression-that-was-completely-wrong/prestudy/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/48-a-first-impression-that-was-completely-wrong/prestudy/index.html"}], "goal": {"t": "Let's talk about why first impressions change. Please read the title aloud.", "ja": "第一印象が変わる理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Has anyone ever made a completely wrong first impression on you?", "ja": "誰かに対する第一印象が、まったく間違っていたことはありますか？", "f": ["What did you think at first?", "If not, which is easier to misread: a quiet person or a talkative person?"]}, {"n": "WARM-UP 2", "t": "What small detail shaped that first impression?", "ja": "どんな小さな点が、その第一印象を作りましたか？", "f": ["Was it their voice, expression, clothes, or something else?", "Why did you notice it?"]}, {"n": "QUESTION 1", "t": "What happened that changed your mind?", "ja": "何があって、その人への考えが変わりましたか？", "f": ["Was one action enough, or did it take time?", "If you have no example, what would make you change a first impression?"]}, {"n": "QUESTION 2", "t": "Why do some first impressions change quickly while others stick?", "ja": "すぐ見直される第一印象と、なかなか変わらない第一印象があるのはなぜですか？", "f": ["Why might someone ignore new information?", "What could help the impression change?"]}, {"n": "QUESTION 3", "t": "What could explain someone's bad first impression?", "ja": "誰かの悪い第一印象は、何が原因かもしれませんか？", "f": ["Could tiredness or nervousness explain the behaviour?", "What would you want to know before judging?"]}, {"n": "QUESTION 4", "t": "What warning sign can completely reverse a good first impression?", "ja": "どんな危険信号が、よい第一印象を完全に変えることがありますか？", "f": ["Which warning sign is commonly overlooked?", "How much new information would make the change fair?"]}, {"n": "QUESTION 5", "t": "When can a quick first impression be useful?", "ja": "すぐに持つ第一印象が役立つのは、どのようなときですか？", "f": ["When can a quick impression become unfair?", "What should make us wait before judging?"]}, {"n": "QUESTION 6", "t": "What do people often misread about you at first?", "ja": "初対面で、自分のどんなところを誤解されやすいですか？", "f": ["What do they assume instead?", "How long does it usually take them to notice?"]}]}, {"n": 3, "title": "MBTI, 잘 맞아요?", "sub": "MBTI、当たってる？", "titles": {"ko": "MBTI, 잘 맞아요?", "en": "How accurate is your MBTI?", "ja": "MBTI、当たってる？"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-people-and-ties-accessible/49-how-accurate-is-your-mbti/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-accessible/49-how-accurate-is-your-mbti/lecture/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/49-how-accurate-is-your-mbti/lecture/index.html"}, {"href": "view/talk-people-and-ties-accessible/49-how-accurate-is-your-mbti/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-accessible/49-how-accurate-is-your-mbti/prestudy/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/49-how-accurate-is-your-mbti/prestudy/index.html"}], "goal": {"t": "Let's talk about what MBTI can—and cannot—tell us about people. Please read the title aloud.", "ja": "MBTIから人について分かることと、分からないことについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What does your MBTI type get right about you?", "ja": "自分のMBTIタイプは、自分のどんなところを正しく表していますか？", "f": ["Which example shows it best?", "If you do not know your type, would you want to take the test?"]}, {"n": "WARM-UP 2", "t": "When do you act most like that type?", "ja": "どんなときに、そのタイプらしく行動しますか？", "f": ["Is it more visible at home, at work, or with friends?", "When do you act completely differently?"]}, {"n": "QUESTION 1", "t": "Why do you think that part fits you?", "ja": "その部分は、なぜ自分に当てはまると思いますか？", "f": ["Has it always been true?", "What habit makes it visible?"]}, {"n": "QUESTION 2", "t": "Who sees a personality more clearly: the person or a close friend?", "ja": "性格をより正確に見ているのは、本人と親しい友人のどちらだと思いますか？", "f": ["Which patterns might an observer recognize?", "Why might people see themselves differently from how others see them?"]}, {"n": "QUESTION 3", "t": "What is one part of you that an MBTI result might miss?", "ja": "MBTIの結果では表しきれない自分の一面は何ですか？", "f": ["In which situation does that side appear?", "Would a close friend agree?"]}, {"n": "QUESTION 4", "t": "Is MBTI a good topic for starting a conversation?", "ja": "MBTIは会話を始めるのによい話題ですか？", "f": ["When can it open a worthwhile discussion?", "What quick judgments should people avoid?"]}, {"n": "QUESTION 5", "t": "Why might someone's MBTI result change over time?", "ja": "人のMBTI結果が時間とともに変わるのはなぜですか？", "f": ["How might experience change the meaning of a question?", "Which parts of a personality may stay fairly stable?"]}, {"n": "QUESTION 6", "t": "What can go wrong when people rely too much on someone's MBTI?", "ja": "人のMBTIを頼りすぎると、どんな問題が起こることがありますか？", "f": ["Which wrong expectation could affect how the person is treated?", "What question would help you see the individual?"]}]}, {"n": 4, "title": "혼자서는 절대 하지 않을 일", "sub": "一人では絶対にしないこと", "titles": {"ko": "혼자서는 절대 하지 않을 일", "en": "Something you would never do alone", "ja": "一人では絶対にしないこと"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-people-and-ties-accessible/50-something-you-would-never-do-alone/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-people-and-ties-accessible/50-something-you-would-never-do-alone/lecture/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/50-something-you-would-never-do-alone/lecture/index.html"}, {"href": "view/talk-people-and-ties-accessible/50-something-you-would-never-do-alone/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-people-and-ties-accessible/50-something-you-would-never-do-alone/prestudy/index.html", "source": "courses/en/talk-people-and-ties-accessible/lessons/50-something-you-would-never-do-alone/prestudy/index.html"}], "goal": {"t": "Let's find where being alone stops feeling comfortable and why. Please read the title aloud.", "ja": "一人でできることの境界と、その理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which activity would feel hardest for you to do alone?", "ja": "一人でするとき、どの活動が自分の安心できる範囲から最も遠く感じますか？", "f": ["What makes it different from ordinary solo activities?", "Is the main barrier safety, confidence, or enjoyment?"]}, {"n": "WARM-UP 2", "t": "What's the hardest
