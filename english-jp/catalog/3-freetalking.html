ルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which food would be hardest for you to get tired of?", "ja": "どの食べ物なら、最も飽きにくいですか？", "f": ["Would rice, noodles, or bread be hard to get tired of?", "How could you serve it in different ways?"]}, {"n": "WARM-UP 2", "t": "How many days would it take for a favourite food to get boring?", "ja": "好きな食べ物でも、何日で飽きると思いますか？", "f": ["Would the taste or repetition become boring first?", "If you have no favourite food, which everyday food could you eat for a week?"]}, {"n": "QUESTION 1", "t": "Which two foods would be hardest to choose between?", "ja": "どの二つの食べ物なら、選ぶのが最も難しいですか？", "f": ["Would you compare taste, price, or health?", "Would you choose pizza or noodles?"]}, {"n": "QUESTION 2", "t": "What would you miss most if you ate the same food every day?", "ja": "毎日同じ食べ物を食べたら、何が一番恋しくなりますか？", "f": ["Would you miss something sweet, spicy, or crunchy?", "When would you notice it most?"]}, {"n": "QUESTION 3", "t": "What food could you happily never eat again?", "ja": "もう二度と食べなくても平気な食べ物は何ですか？", "f": ["Would a strong-smelling food be a good example?", "Could a different recipe change your answer?"]}, {"n": "QUESTION 4", "t": "Would you choose a healthy everyday food or an exciting food that's bad for you?", "ja": "健康的な日常の食べ物と、体によくなくてもわくわくする食べ物のどちらを選びますか？", "f": ["Which choice would be easier to continue?", "What would you miss about the other food?"]}, {"n": "QUESTION 5", "t": "What small change can keep a favourite food interesting?", "ja": "好きな食べ物に飽きないための小さな変化は何ですか？", "f": ["Would a new sauce be enough?", "How often would you need a bigger change?"]}, {"n": "QUESTION 6", "t": "Would you still call it your favourite after eating it every day for a year?", "ja": "一年間毎日食べても、まだそれを一番好きな食べ物と呼べますか？", "f": ["What might change your answer?", "How often would you need a different meal?"]}]}, {"n": 6, "title": "평생 무료로 만들고 싶은 한 가지", "sub": "一生無料にしたい一つのもの", "titles": {"ko": "평생 무료로 만들고 싶은 한 가지", "en": "One thing you would make free forever", "ja": "一生無料にしたい一つのもの"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-if-accessible/94-one-thing-you-would-make-free-forever/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-accessible/94-one-thing-you-would-make-free-forever/lecture/index.html", "source": "courses/en/talk-what-if-accessible/lessons/94-one-thing-you-would-make-free-forever/lecture/index.html"}, {"href": "view/talk-what-if-accessible/94-one-thing-you-would-make-free-forever/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-accessible/94-one-thing-you-would-make-free-forever/prestudy/index.html", "source": "courses/en/talk-what-if-accessible/lessons/94-one-thing-you-would-make-free-forever/prestudy/index.html"}], "goal": {"t": "Let's choose one free service and explore how life would change. Please read the title aloud.", "ja": "一つのサービスを無料にして、生活がどう変わるか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "If one everyday service were free for life, which would you choose?", "ja": "日常のサービスを一つ一生無料にできるなら、何を選びますか？", "f": ["Would you choose transport, delivery, or cleaning?", "How often would you use it?"]}, {"n": "WARM-UP 2", "t": "Which everyday service would help people most if it cost less?", "ja": "どの日常サービスが安くなれば、人々の役に最も立ちますか？", "f": ["Would cheaper transport or childcare help more people?", "What could make the lower price difficult?"]}, {"n": "QUESTION 1", "t": "How would one free everyday service change an ordinary week?", "ja": "日常サービスが一つ無料になったら、普通の一週間はどう変わりますか？", "f": ["Which routine would change most?", "Would free transport change your week?"]}, {"n": "QUESTION 2", "t": "Which free service could help a whole family or group?", "ja": "どんな無料サービスなら、家族やグループ全体の役に立ちますか？", "f": ["Who else would benefit?", "Would free childcare or free public transport help more people?"]}, {"n": "QUESTION 3", "t": "Which boring service would save the most money over a lifetime?", "ja": "地味でも、一生で最もお金を節約できるサービスは何ですか？", "f": ["Would cleaning, internet, or insurance save more over time?", "Would you still prefer a more enjoyable service?"]}, {"n": "QUESTION 4", "t": "Should someone be allowed to give their free service to another person?", "ja": "無料サービスをほかの人に譲ってもよいですか？", "f": ["When would giving it away be generous?", "What rule could prevent unfair resale?"]}, {"n": "QUESTION 5", "t": "What problem would make you stop using it, even though it was free?", "ja": "無料でも、どんな問題があれば使うのをやめますか？", "f": ["Would a long wait be enough?", "What would make you pay instead?"]}, {"n": "QUESTION 6", "t": "Now the opposite: what’s one service you would rather pay for?", "ja": "では反対に、お金を払ってでも使いたいサービスは何ですか？", "f": ["What would the paid version need to do better?", "How much more would feel reasonable?"]}]}, {"n": 7, "title": "일주일 동안 휴대전화 없이 지내기", "sub": "一週間、携帯電話なしで過ごすこと", "titles": {"ko": "일주일 동안 휴대전화 없이 지내기", "en": "Going a week without your phone", "ja": "一週間、携帯電話なしで過ごすこと"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-if-accessible/95-going-a-week-without-your-phone/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-accessible/95-going-a-week-without-your-phone/lecture/index.html", "source": "courses/en/talk-what-if-accessible/lessons/95-going-a-week-without-your-phone/lecture/index.html"}, {"href": "view/talk-what-if-accessible/95-going-a-week-without-your-phone/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-accessible/95-going-a-week-without-your-phone/prestudy/index.html", "source": "courses/en/talk-what-if-accessible/lessons/95-going-a-week-without-your-phone/prestudy/index.html"}], "goal": {"t": "Let's explore what a week with less phone use would change. Please read the title aloud.", "ja": "携帯電話を減らす一週間で何が変わるか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which phone feature would you miss most for one week?", "ja": "一週間、携帯電話のどの機能が最も恋しくなりますか？", "f": ["Would you miss maps, messages, or payments most?", "What could you use instead?"]}, {"n": "WARM-UP 2", "t": "What do you usually use your phone for first?", "ja": "普段、最初にスマートフォンを何に使いますか？", "f": ["Could that first task be done another way?", "What happens on a day when you do not use it?"]}, {"n": "QUESTION 1", "t": "Which useful phone feature could you give up with the least trouble?", "ja": "便利なスマートフォンの機能のうち、最も困らずに手放せるものは何ですか？", "f": ["What would you use instead?", "Why is another feature harder to lose?"]}, {"n": "QUESTION 2", "t": "What might improve, if anything, after three days with less phone use?", "ja": "スマホをあまり使わずに三日過ごしたら、何かよくなりそうですか？", "f": ["Would sleep, focus, or free time change?", "What could become harder with less phone use?"]}, {"n": "QUESTION 3", "t": "When is it easiest to leave your phone in another room?", "ja": "携帯電話を別の部屋に置きやすいのは、どんなときですか？", "f": ["Would meals, exercise, or bedtime be easiest?", "What makes a phone hard to leave?"]}, {"n": "QUESTION 4", "t": "How could you stay reachable in an emergency while using your phone less?", "ja": "携帯電話を減らしながら、緊急時に連絡を受けられるようにするにはどうしますか？", "f": ["Who would need another way to contact you?", "Which emergency feature would stay available?"]}, {"n": "QUESTION 5", "t": "Which parts of your phone would you still use during the break?", "ja": "スマホを休む間でも、どの機能は使い続けますか？", "f": ["Would you keep calls, maps, or payments?", "Which use would you limit first?"]}, {"n": "QUESTION 6", "t": "Which phone habit would you most like to change?", "ja": "どの携帯電話の習慣を最も変えたいですか？", "f": ["Would you change late-night use or constant checking?", "Which phone habit is worth keeping?"]}]}, {"n": 8, "title": "AI가 내 일을 한다면 할 일", "sub": "AIが自分の仕事をしたらすること", "titles": {"ko": "AI가 내 일을 한다면 할 일", "en": "What you would do if AI did your job", "ja": "AIが自分の仕事をしたらすること"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-if-accessible/96-what-you-would-do-if-ai-did-your-job/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-accessible/96-what-you-would-do-if-ai-did-your-job/lecture/index.html", "source": "courses/en/talk-what-if-accessible/lessons/96-what-you-would-do-if-ai-did-your-job/lecture/index.html"}, {"href": "view/talk-what-if-accessible/96-what-you-would-do-if-ai-did-your-job/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-accessible/96-what-you-would-do-if-ai-did-your-job/prestudy/index.html", "source": "courses/en/talk-what-if-accessible/lessons/96-what-you-would-do-if-ai-did-your-job/prestudy/index.html"}], "goal": {"t": "Let's imagine how we would use our time if AI handled routine tasks. Please read the title aloud.", "ja": "AIが日常の作業をしたら、時間をどう使うか想像しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "If AI did your usual tasks for a week, how would you use the extra time?", "ja": "AIが普段の作業を一週間してくれたら、空いた時間をどう使いますか？", "f": ["Would you rest, see people, or start a project?", "Would the extra time feel relaxing or strange at first?"]}, {"n": "WARM-UP 2", "t": "How would you give a free week some structure without filling it with work?", "ja": "仕事で埋めずに、自由な一週間をどう組み立てますか？", "f": ["Would you make a plan or decide each morning?", "What would you leave unplanned?"]}, {"n": "QUESTION 1", "t": "Who deserves to know when AI produced most of a result?", "ja": "AIが結果の大部分を作ったとき、誰に知らせる必要がありますか？", "f": ["Would a customer, teacher, or teammate need to know?", "When would saying nothing be unfair?"]}, {"n": "QUESTION 2", "t": "Which part of work, study, care, or daily routine would you miss?", "ja": "仕事、勉強、ケア、日課のどの部分が恋しくなりますか？", "f": ["Would you miss the people, the routine, or finishing something?", "What would you happily stop doing?"]}, {"n": "QUESTION 3", "t": "What project would you start with a month of free time?", "ja": "一か月の自由な時間があれば、どんなプロジェクトを始めますか？", "f": ["Would you learn something, make something, or travel?", "How would you use the first free week?"]}, {"n": "QUESTION 4", "t": "Which daily task can make a person feel useful?", "ja": "どんな日々の作業が、その人自身を役立っていると感じさせますか？", "f": ["Could cooking, caring for someone, or fixing something do that?", "Could AI help without taking over?"]}, {"n": "QUESTION 5", "t": "What task would you still choose to do yourself if AI could do it?", "ja": "AIにできても、自分で続けたい作業は何ですか？", "f": ["Would you still cook, write, or make important decisions yourself?", "When could AI still help?"]}, {"n": "QUESTION 6", "t": "What should never be handed over completely to AI?", "ja": "AIに完全には任せるべきでないことは何ですか？", "f": ["Medical decisions, legal decisions, or something else?", "How could AI still help?"]}]}, {"n": 9, "title": "친구들이 나에게 골라 줄 동물", "sub": "自分を知る人が選びそうな動物", "titles": {"ko": "친구들이 나에게 골라 줄 동물", "en": "The animal your friends would choose for you", "ja": "自分を知る人が選びそうな動物"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-if-accessible/97-the-animal-your-friends-would-choose-for-you/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-accessible/97-the-animal-your-friends-would-choose-for-you/lecture/index.html", "source": "courses/en/talk-what-if-accessible/lessons/97-the-animal-your-friends-would-choose-for-you/lecture/index.html"}, {"href": "view/talk-what-if-accessible/97-the-animal-your-friends-would-choose-for-you/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-accessible/97-the-animal-your-friends-would-choose-for-you/prestudy/index.html", "source": "courses/en/talk-what-if-accessible/lessons/97-the-animal-your-friends-would-choose-for-you/prestudy/index.html"}], "goal": {"t": "Let's use animal comparisons to explore personality. Please read the title aloud.", "ja": "動物の比較を使って、性格について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which animal best represents your personality?", "ja": "どの動物があなたの性格を最もよく表しますか？", "f": ["Would you choose a dog, cat, fox, or bird?", "Where does the comparison stop working?"]}, {"n": "WARM-UP 2", "t": "Which animal would your friends choose for you?", "ja": "友達はあなたにどの動物を選ぶと思いますか？", "f": ["Would they choose a dog, cat, or bird?", "How is a dog's personality different from a cat's?"]}, {"n": "QUESTION 1", "t": "Which animal quality would you like to have more of?", "ja": "どんな動物の性質を、もっと自分にも持ちたいですか？", "f": ["A dog’s loyalty, a cat’s independence, or a bird’s freedom?", "When would that quality help?"]}, {"n": "QUESTION 2", "t": "What do you do that might make your friends choose that animal?", "ja": "あなたのどんな行動を見て、友達はその動物を選びそうですか？", "f": ["Is it something you do often?", "Would your family choose the same animal?"]}, {"n": "QUESTION 3", "t": "Which animal is least like you?", "ja": "あなたに最も似ていない動物は何ですか？", "f": ["Would a loud, slow, or highly social animal feel least like you?", "Could one trait still fit?"]}, {"n": "QUESTION 4", "t": "Which animal fits you on a busy day?", "ja": "忙しい日の自分には、どの動物が合いますか？", "f": ["Which trait does that animal show?", "On a busy day, do you move quickly or slowly?"]}, {"n": "QUESTION 5", "t": "I'll share three real traits about myself. Which animal fits them?", "ja": "私が自分の本当の特徴を三つ話します。どの動物が合いますか？", "f": ["Which trait has the strongest influence on your choice?", "What does the animal comparison fail to capture?"]}, {"n": "QUESTION 6", "t": "What part of your personality doesn’t fit that animal at all?", "ja": "自分の性格のどんな部分は、その動物にまったく合いませんか？", "f": ["Would a second animal fit that side better?", "Which animal would show it?"]}]}, {"n": 10, "title": "다른 나라에서 자랐다면", "sub": "別の国で育っていたら", "titles": {"ko": "다른 나라에서 자랐다면", "en": "Growing up in another country", "ja": "別の国で育っていたら"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-if-accessible/98-growing-up-in-another-country/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-accessible/98-growing-up-in-another-country/lecture/index.html", "source": "courses/en/talk-what-if-accessible/lessons/98-growing-up-in-another-country/lecture/index.html"}, {"href": "view/talk-what-if-accessible/98-growing-up-in-another-country/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-accessible/98-growing-up-in-another-country/prestudy/index.html", "source": "courses/en/talk-what-if-accessible/lessons/98-growing-up-in-another-country/prestudy/index.html"}], "goal": {"t": "Let's imagine how a different upbringing could shape a person. Please read the title aloud.", "ja": "別の環境で育つと、人がどう変わるか想像しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "If you had grown up in another country, which one would you choose?", "ja": "別の国で育っていたとしたら、どの国を選びますか？", "f": ["Would you choose a country for its schools, nature, or daily life?", "What would you want to learn before choosing?"]}, {"n": "WARM-UP 2", "t": "Which part of everyday childhood changes most across countries?", "ja": "国によって、子どもの日常生活のどの部分が最も変わりますか？", "f": ["Would school, home, or free time change most?", "Which difference would a child notice first?"]}, {"n": "QUESTION 1", "t": "In that country, what might school have been like for you?", "ja": "その国で育っていたら、学校生活はどんなものだったと思いますか？", "f": ["Would classes feel stricter or more relaxed?", "What might surprise you on the first day?"]}, {"n": "QUESTION 2", "t": "Which food or family custom would you miss from your actual childhood?", "ja": "実際の子ども時代の食べ物や家族の習慣で、何が恋しくなりそうですか？", "f": ["Would you miss a food, holiday, or family routine?", "What do people often miss from childhood?"]}, {"n": "QUESTION 3", "t": "What part of your actual upbringing would you be happy to leave behind?", "ja": "実際に育った環境のどんな部分なら、なくてもよいと思いますか？", "f": ["Would you change school pressure, rules, or expectations?", "If you would change nothing, what would you keep?"]}, {"n": "QUESTION 4", "t": "What changes about you when you speak another language?", "ja": "別の言語を話すとき、自分のどんなところが変わりますか？", "f": ["Are you quieter, funnier, or more direct?", "Does that change feel good?"]}, {"n": "QUESTION 5", "t": "What would be easier to learn as a child than after moving there as an adult?", "ja": "子どもの頃に学ぶほうが、大人になって移住してからより簡単なことは何ですか？", "f": ["The language or local manners?", "What might an adult notice more clearly?"]}, {"n": "QUESTION 6", "t": "What part of your personality would probably stay the same anywhere?", "ja": "どこで育っても、自分の性格のどんな部分は同じだと思いますか？", "f": ["Why does that feel less shaped by place?", "Could another environment still change how it appears?"]}]}, {"n": 11, "title": "10년 뒤 상상하는 내 모습", "sub": "十年後に想像する自分", "titles": {"ko": "10년 뒤 상상하는 내 모습", "en": "Where you imagine yourself in ten years", "ja": "十年後に想像する自分"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-if-accessible/99-where-you-imagine-yourself-in-ten-years/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-accessible/99-where-you-imagine-yourself-in-ten-years/lecture/index.html", "source": "courses/en/talk-what-if-accessible/lessons/99-where-you-imagine-yourself-in-ten-years/lecture/index.html"}, {"href": "view/talk-what-if-accessible/99-where-you-imagine-yourself-in-ten-years/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-accessible/99-where-you-imagine-yourself-in-ten-years/prestudy/index.html", "source": "courses/en/talk-what-if-accessible/lessons/99-where-you-imagine-yourself-in-ten-years/prestudy/index.html"}], "goal": {"t": "Let's imagine an ordinary day ten years from now. Please read the title aloud.", "ja": "十年後の普通の一日を想像しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What would an ideal ordinary day look like ten years from now?", "ja": "十年後の理想的な普通の一日は、どんな一日ですか？", "f": ["Would it begin in a quiet home, a busy city, or somewhere new?", "What would make the day feel good?"]}, {"n": "WARM-UP 2", "t": "Where would you like to wake up on an ordinary morning ten years from now?", "ja": "十年後の普通の朝、どこで目を覚ましたいですか？", "f": ["What would you want nearby?", "Would the place be busy or quiet?"]}, {"n": "QUESTION 1", "t": "In that future life, who would you see on a normal day?", "ja": "その未来の生活では、普通の日に誰と会いますか？", "f": ["How much time would you want alone?", "Who would you want nearby?"]}, {"n": "QUESTION 2", "t": "What current habit would you like to still have in ten years?", "ja": "今のどんな習慣を、十年後も続けたいですか？", "f": ["Would you keep exercise, reading, or time with friends?", "What could make the habit hard to keep?"]}, {"n": "QUESTION 3", "t": "What would you hope not to spend time doing in ten years?", "ja": "十年後、何に時間を使わずにすむことを望みますか？", "f": ["What would you rather spend that time on?", "Would you rather spend less time commuting or doing housework?"]}, {"n": "QUESTION 4", "t": "Would you rather have a clear plan for those ten years or leave room to change?", "ja": "その十年間について、明確な計画を立てたいですか、それとも変えられる余地を残したいですか？", "f": ["What would you plan now?", "What would you keep flexible?"]}, {"n": "QUESTION 5", "t": "What small action this year could make your future direction clearer?", "ja": "今年どんな小さな行動をすると、将来の方向がより明確になりますか？", "f": ["What could you try this month?", "Would trying one new class or hobby make the future clearer?"]}, {"n": "QUESTION 6", "t": "What surprise would make you happily change that plan?", "ja": "どんな予想外の出来事なら、その計画を喜んで変えますか？", "f": ["A new relationship, place, or dream?", "What part of the old plan would you keep?"]}]}, {"n": 12, "title": "불이 났을 때 구할 한 가지", "sub": "火事で持ち出す一つのもの", "titles": {"ko": "불이 났을 때 구할 한 가지", "en": "The one thing you would save in a fire", "ja": "火事で持ち出す一つのもの"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-what-if-accessible/100-the-one-thing-you-would-save-in-a-fire/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-accessible/100-the-one-thing-you-would-save-in-a-fire/lecture/index.html", "source": "courses/en/talk-what-if-accessible/lessons/100-the-one-thing-you-would-save-in-a-fire/lecture/index.html"}, {"href": "view/talk-what-if-accessible/100-the-one-thing-you-would-save-in-a-fire/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-accessible/100-the-one-thing-you-would-save-in-a-fire/prestudy/index.html", "source": "courses/en/talk-what-if-accessible/lessons/100-the-one-thing-you-would-save-in-a-fire/prestudy/index.html"}], "goal": {"t": "Let's talk about possessions, memory, and safe preparation. Please read the title aloud.", "ja": "持ち物、記憶、安全な備えについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Once everyone is safe, which possession would be hardest to lose?", "ja": "全員が安全になった後、失うのが最もつらい持ち物は何ですか？", "f": ["Would you choose photos, a gift, or something you use every day?", "Could a photo or copy protect part of it?"]}, {"n": "WARM-UP 2", "t": "What makes one old object impossible to replace?", "ja": "一つの古い物が、代えられないものになるのはなぜですか？", "f": ["Do you still use it, or does it hold a memory?", "Would a photo or copy keep what matters?"]}, {"n": "QUESTION 1", "t": "What memory does that object bring back?", "ja": "その物を見ると、どんな思い出がよみがえりますか？", "f": ["Who is part of that memory?", "When did you last look at or use it?"]}, {"n": "QUESTION 2", "t": "Would you save photos, letters, or one practical item?", "ja": "写真、手紙、実用的な物一つのどれを持ち出しますか？", "f": ["Which of those would be hardest to replace?", "What would you save instead of those three?"]}, {"n": "QUESTION 3", "t": "Can a digital copy preserve what matters about an old object?", "ja": "デジタルのコピーで、古い物の大切なところを残せますか？", "f": ["What can a copy keep?", "What disappears without the original object?"]}, {"n": "QUESTION 4", "t": "Who would understand why that object matters to you?", "ja": "その物がなぜ大切なのか、誰なら分かってくれそうですか？", "f": ["Would you need to explain it?", "Would it mean the same thing to them?"]}, {"n": "QUESTION 5", "t": "What important object could you back up or photograph now?", "ja": "今、バックアップしたり写真に撮ったりできる大切な物は何ですか？", "f": ["Would photos, documents, or messages need a backup?", "Where would you keep the backup?"]}, {"n": "QUESTION 6", "t": "Now the opposite: what would be easiest to replace?", "ja": "では反対に、最も簡単に買い替えられる物は何ですか？", "f": ["Why doesn’t it carry the same meaning?", "Would you replace it straight away?"]}]}]}, {"no": 18, "label": "18코스", "title": "만약에", "titles": {"ko": "만약에", "en": "What if", "ja": "もしも"}, "subtitle": "(上級) もしも", "desc": {"ko": "가상의 선택을 빠르게 고르고 이유와 결과를 확장해서 말한다.", "en": "Pick fast in a hypothetical, then open out the reason and what would follow.", "ja": "仮の選択を素早く決め、理由と結果を広げて話す。"}, "cover": "covers/talk-what-if-full.webp", "levels": ["C1"], "level": "C1", "slug": "talk-what-if-full", "lessons": [{"n": 1, "title": "복권에 당첨되면 실제로 할 일", "sub": "宝くじに当たったら本当にすること", "titles": {"ko": "복권에 당첨되면 실제로 할 일", "en": "What you would really do if you won the lottery", "ja": "宝くじに当たったら本当にすること"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-if-full/89-what-you-would-really-do-if-you-won-the-lottery/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-full/89-what-you-would-really-do-if-you-won-the-lottery/lecture/index.html", "source": "courses/en/talk-what-if-full/lessons/89-what-you-would-really-do-if-you-won-the-lottery/lecture/index.html"}, {"href": "view/talk-what-if-full/89-what-you-would-really-do-if-you-won-the-lottery/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-full/89-what-you-would-really-do-if-you-won-the-lottery/prestudy/index.html", "source": "courses/en/talk-what-if-full/lessons/89-what-you-would-really-do-if-you-won-the-lottery/prestudy/index.html"}], "goal": {"t": "Let's imagine how a large lottery win could change everyday life. Please read the title aloud.", "ja": "宝くじで大当たりしたら、日常がどう変わるか想像しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Imagine you win a large lottery prize tomorrow. What would you do first?", "ja": "明日、宝くじで大当たりしたと想像してください。最初に何をしますか？", "f": ["Would you call someone, make a plan, or do nothing for a day?", "What would you avoid doing immediately?"]}, {"n": "WARM-UP 2", "t": "Whose advice, if anyone, would you want before making a big decision?", "ja": "大きな決断をする前に、相談したい相手はいますか？", "f": ["What could that person help you notice?", "If you asked no one, how would you slow the decision down?"]}, {"n": "QUESTION 1", "t": "Who, if anyone, would need to know about the win?", "ja": "当選について、知らせる必要がある人がいるとすれば誰ですか？", "f": ["Who would have a practical reason to know?", "What benefit could privacy provide?"]}, {"n": "QUESTION 2", "t": "What part of your life would you want to keep exactly the same?", "ja": "当選しても、今の生活のどんな部分をまったく変えずに残したいですか？", "f": ["Would you keep your home, routine, or hobbies?", "What might money change anyway?"]}, {"n": "QUESTION 3", "t": "What's the first thing you would buy for someone else?", "ja": "ほかの人のために最初に買うものは何ですか？", "f": ["Would you choose a gift, a trip, or practical help?", "If you bought nothing, how else could you share the money?"]}, {"n": "QUESTION 4", "t": "What’s the easiest mistake for a lottery winner to make?", "ja": "宝くじに当たった人が、最もしやすい失敗は何ですか？", "f": ["Spending too fast or trusting the wrong person?", "What would help someone avoid it?"]}, {"n": "QUESTION 5", "t": "What would you want to keep normal after becoming rich?", "ja": "お金持ちになっても、何を普通のままにしておきたいですか？", "f": ["Why is that part worth protecting?", "Would sudden wealth make ordinary friendships harder?"]}, {"n": "QUESTION 6", "t": "What’s one problem that money could make easier but not solve?", "ja": "お金で楽にはできても、解決はできない問題を一つ挙げるとしたら何ですか？", "f": ["Would loneliness or poor health be a good example?", "What else would help?"]}]}, {"n": 2, "title": "무인도에 가져갈 세 가지", "sub": "無人島に持っていく三つの物", "titles": {"ko": "무인도에 가져갈 세 가지", "en": "Three things you would take to a desert island", "ja": "無人島に持っていく三つの物"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-if-full/90-three-things-you-would-take-to-a-desert-island/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-full/90-three-things-you-would-take-to-a-desert-island/lecture/index.html", "source": "courses/en/talk-what-if-full/lessons/90-three-things-you-would-take-to-a-desert-island/lecture/index.html"}, {"href": "view/talk-what-if-full/90-three-things-you-would-take-to-a-desert-island/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-full/90-three-things-you-would-take-to-a-desert-island/prestudy/index.html", "source": "courses/en/talk-what-if-full/lessons/90-three-things-you-would-take-to-a-desert-island/prestudy/index.html"}], "goal": {"t": "Let's choose what would matter most on a desert island. Please read the title aloud.", "ja": "無人島で最も大切になるものを選びましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which problem would be hardest to face on your first day on a desert island?", "ja": "無人島での最初の一日に、どの問題に向き合うのが最も大変ですか？", "f": ["Would water, shelter, or being alone worry you most?", "What could make the first day easier?"]}, {"n": "WARM-UP 2", "t": "If you could take only three things, what would you choose?", "ja": "三つだけ持って行けるなら、何を選びますか？", "f": ["Which one would help you survive first?", "Which one would make you feel less alone?"]}, {"n": "QUESTION 1", "t": "What ordinary object could solve two different problems on the island?", "ja": "島で二つの問題を解決できそうな普通の物は何ですか？", "f": ["Would a pot, rope, or mirror work?", "What two problems would it solve?"]}, {"n": "QUESTION 2", "t": "Would one comfort item be worth taking to a desert island?", "ja": "無人島に、気持ちを楽にする物を一つ持って行く価値はありますか？", "f": ["Would you choose music, a book, or a favourite snack?", "If you took none, what practical item would replace it?"]}, {"n": "QUESTION 3", "t": "What would you regret not bringing after the first night?", "ja": "最初の夜の後、持ってこなかったことを後悔しそうな物は何ですか？", "f": ["Would you miss a light, blanket, or tool most?", "What could replace it?"]}, {"n": "QUESTION 4", "t": "Would you choose different island supplies in cold weather?", "ja": "寒い天気の島なら、違う道具を選びますか？", "f": ["Would warm clothing or a fire tool come first?", "Which tropical item would be less useful?"]}, {"n": "QUESTION 5", "t": "What could one good companion provide that no object could?", "ja": "よい仲間一人は、どんな物にもできない何を与えてくれますか？", "f": ["What would you share responsibility for?", "What would be easier alone?"]}, {"n": "QUESTION 6", "t": "After a week, which of your three choices might you regret?", "ja": "一週間後、選んだ三つのうち、どれを後悔しそうですか？", "f": ["What would you wish you had brought instead?", "Which choice would still feel right?"]}]}, {"n": 3, "title": "하루 동안 인생을 바꿔 보고 싶은 사람", "sub": "一日だけ人生を入れ替えたい人", "titles": {"ko": "하루 동안 인생을 바꿔 보고 싶은 사람", "en": "Someone you would trade lives with for a day", "ja": "一日だけ人生を入れ替えたい人"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-if-full/91-someone-you-would-trade-lives-with-for-a-day/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-full/91-someone-you-would-trade-lives-with-for-a-day/lecture/index.html", "source": "courses/en/talk-what-if-full/lessons/91-someone-you-would-trade-lives-with-for-a-day/lecture/index.html"}, {"href": "view/talk-what-if-full/91-someone-you-would-trade-lives-with-for-a-day/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-full/91-someone-you-would-trade-lives-with-for-a-day/prestudy/index.html", "source": "courses/en/talk-what-if-full/lessons/91-someone-you-would-trade-lives-with-for-a-day/prestudy/index.html"}], "goal": {"t": "Let's explore what one day in another life could teach us. Please read the title aloud.", "ja": "別の人生を一日体験すると何が分かるか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Whose daily life would you be curious to experience for one day?", "ja": "誰の日常生活を一日体験してみたいですか？", "f": ["Would you choose a famous person, a doctor, or someone from another country?", "Which part of their day would you want to see?"]}, {"n": "WARM-UP 2", "t": "Would you choose someone famous or someone with a very different ordinary life?", "ja": "有名な人と、全く違う普通の生活をする人のどちらを選びますか？", "f": ["What would fame let you experience?", "What could an ordinary life teach instead?"]}, {"n": "QUESTION 1", "t": "What would you do in the first hour of another person's life?", "ja": "別の人の人生を体験する最初の一時間に何をしますか？", "f": ["Would you explore their home, work, or neighbourhood?", "What would you avoid doing?"]}, {"n": "QUESTION 2", "t": "What would you want to learn that an interview couldn't tell you?", "ja": "インタビューでは分からない何を知りたいですか？", "f": ["What could one day show you?", "What would still be impossible to know?"]}, {"n": "QUESTION 3", "t": "Which attractive life might be much harder in private?", "ja": "魅力的に見えても、実際にはずっと大変そうな生活は何ですか？", "f": ["Would a celebrity's life or a luxury lifestyle be a good example?", "What hidden responsibility might appear?"]}, {"n": "QUESTION 4", "t": "What would be unfair to look at or learn during the life swap?", "ja": "人生を交換している間でも、見たり知ったりするのは不公平だと思うものは何ですか？", "f": ["Would private messages be off-limits?", "Would you want the same rule for your own life?"]}, {"n": "QUESTION 5", "t": "Which part of your own life might you appreciate more afterward?", "ja": "その後、自分の生活のどんな部分をもっと大切に感じそうですか？", "f": ["Would you appreciate your home, free time, or relationships more?", "What might you miss from the other life?"]}, {"n": "QUESTION 6", "t": "What might another person misunderstand after one day in your life?", "ja": "あなたの生活を一日体験した人は、何を誤解しそうですか？", "f": ["Which routine might surprise them?", "What would take longer than one day to understand?"]}]}, {"n": 4, "title": "고르고 싶은 초능력", "sub": "選びたい超能力", "titles": {"ko": "고르고 싶은 초능력", "en": "The superpower you would choose", "ja": "選びたい超能力"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-if-full/92-the-superpower-you-would-choose/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-full/92-the-superpower-you-would-choose/lecture/index.html", "source": "courses/en/talk-what-if-full/lessons/92-the-superpower-you-would-choose/lecture/index.html"}, {"href": "view/talk-what-if-full/92-the-superpower-you-would-choose/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-full/92-the-superpower-you-would-choose/prestudy/index.html", "source": "courses/en/talk-what-if-full/lessons/92-the-superpower-you-would-choose/prestudy/index.html"}], "goal": {"t": "Let's choose a superpower and examine its real consequences. Please read the title aloud.", "ja": "超能力を一つ選び、実際にどんな結果が生まれるか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which superpower would make ordinary life most interesting?", "ja": "どの超能力が普通の生活を最も面白くしますか？", "f": ["Would flying, stopping time, or reading minds improve daily life most?", "What problem could that power create?"]}, {"n": "WARM-UP 2", "t": "If you got a superpower, how would you test it safely?", "ja": "超能力を得たら、どうやって安全に試しますか？", "f": ["Would you test it alone or with someone nearby?", "What could go wrong?"]}, {"n": "QUESTION 1", "t": "Would you tell someone close to you about a superpower?", "ja": "親しい人に超能力のことを話しますか？", "f": ["Would telling one person make the power safer?", "What could secrecy protect?"]}, {"n": "QUESTION 2", "t": "Which useful superpower would be hardest to keep secret?", "ja": "役に立つ超能力のうち、最も秘密にしにくいものは何ですか？", "f": ["Why would people notice?", "Could you use it without being seen?"]}, {"n": "QUESTION 3", "t": "Which useful-looking superpower would you refuse?", "ja": "役立ちそうでも断りたい超能力は何ですか？", "f": ["Would reading minds or never sleeping be too costly?", "Could a safe limit change your answer?"]}, {"n": "QUESTION 4", "t": "Which superpower would cause the most trouble if everyone had it?", "ja": "全員が持つと最も大きな問題を起こす超能力は何ですか？", "f": ["Why would that power become dangerous on a large scale?", "Would stopping time or reading minds cause more trouble?"]}, {"n": "QUESTION 5", "t": "What one rule would you set for using a superpower?", "ja": "超能力を使うために、どんなルールを一つ決めますか？", "f": ["What temptation would the rule control?", "Should a superpower ever be used without permission?"]}, {"n": "QUESTION 6", "t": "What ordinary skill is better than a superpower in real life?", "ja": "現実では、どんな普通の能力が超能力より役立ちますか？", "f": ["Would patience, clear communication, or first aid be a good example?", "How can someone improve that skill?"]}]}, {"n": 5, "title": "평생 먹을 수 있는 한 가지 음식", "sub": "一生食べ続けられる一つの食べ物", "titles": {"ko": "평생 먹을 수 있는 한 가지 음식", "en": "The one food you could eat forever", "ja": "一生食べ続けられる一つの食べ物"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-if-full/93-the-one-food-you-could-eat-forever/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-full/93-the-one-food-you-could-eat-forever/lecture/index.html", "source": "courses/en/talk-what-if-full/lessons/93-the-one-food-you-could-eat-forever/lecture/index.html"}, {"href": "view/talk-what-if-full/93-the-one-food-you-could-eat-forever/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-full/93-the-one-food-you-could-eat-forever/prestudy/index.html", "source": "courses/en/talk-what-if-full/lessons/93-the-one-food-you-could-eat-forever/prestudy/index.html"}], "goal": {"t": "Let's test what makes one food enjoyable over time. Please read the title aloud.", "ja": "一つの食べ物を長く楽しめる条件について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which food would be hardest for you to get tired of?", "ja": "どの食べ物なら、最も飽きにくいですか？", "f": ["Would rice, noodles, or bread be hard to get tired of?", "How could you serve it in different ways?"]}, {"n": "WARM-UP 2", "t": "How many days would it take for a favourite food to get boring?", "ja": "好きな食べ物でも、何日で飽きると思いますか？", "f": ["Would the taste or repetition become boring first?", "If you have no favourite food, which everyday food could you eat for a week?"]}, {"n": "QUESTION 1", "t": "Which two foods would be hardest to choose between?", "ja": "どの二つの食べ物なら、選ぶのが最も難しいですか？", "f": ["Would you compare taste, price, or health?", "Would you choose pizza or noodles?"]}, {"n": "QUESTION 2", "t": "What would you miss most if you ate the same food every day?", "ja": "毎日同じ食べ物を食べたら、何が一番恋しくなりますか？", "f": ["Would you miss something sweet, spicy, or crunchy?", "When would you notice it most?"]}, {"n": "QUESTION 3", "t": "What food could you happily never eat again?", "ja": "もう二度と食べなくても平気な食べ物は何ですか？", "f": ["Would a strong-smelling food be a good example?", "Could a different recipe change your answer?"]}, {"n": "QUESTION 4", "t": "Would you choose a healthy everyday food or an exciting food that's bad for you?", "ja": "健康的な日常の食べ物と、体によくなくてもわくわくする食べ物のどちらを選びますか？", "f": ["Which choice would be easier to continue?", "What would you miss about the other food?"]}, {"n": "QUESTION 5", "t": "What small change can keep a favourite food interesting?", "ja": "好きな食べ物に飽きないための小さな変化は何ですか？", "f": ["Would a new sauce be enough?", "How often would you need a bigger change?"]}, {"n": "QUESTION 6", "t": "Would you still call it your favourite after eating it every day for a year?", "ja": "一年間毎日食べても、まだそれを一番好きな食べ物と呼べますか？", "f": ["What might change your answer?", "How often would you need a different meal?"]}]}, {"n": 6, "title": "평생 무료로 만들고 싶은 한 가지", "sub": "一生無料にしたい一つのもの", "titles": {"ko": "평생 무료로 만들고 싶은 한 가지", "en": "One thing you would make free forever", "ja": "一生無料にしたい一つのもの"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-if-full/94-one-thing-you-would-make-free-forever/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-full/94-one-thing-you-would-make-free-forever/lecture/index.html", "source": "courses/en/talk-what-if-full/lessons/94-one-thing-you-would-make-free-forever/lecture/index.html"}, {"href": "view/talk-what-if-full/94-one-thing-you-would-make-free-forever/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-full/94-one-thing-you-would-make-free-forever/prestudy/index.html", "source": "courses/en/talk-what-if-full/lessons/94-one-thing-you-would-make-free-forever/prestudy/index.html"}], "goal": {"t": "Let's choose one free service and explore how life would change. Please read the title aloud.", "ja": "一つのサービスを無料にして、生活がどう変わるか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "If one everyday service were free for life, which would you choose?", "ja": "日常のサービスを一つ一生無料にできるなら、何を選びますか？", "f": ["Would you choose transport, delivery, or cleaning?", "How often would you use it?"]}, {"n": "WARM-UP 2", "t": "Which everyday service would help people most if it cost less?", "ja": "どの日常サービスが安くなれば、人々の役に最も立ちますか？", "f": ["Would cheaper transport or childcare help more people?", "What could make the lower price difficult?"]}, {"n": "QUESTION 1", "t": "How would one free everyday service change an ordinary week?", "ja": "日常サービスが一つ無料になったら、普通の一週間はどう変わりますか？", "f": ["Which routine would change most?", "Would free transport change your week?"]}, {"n": "QUESTION 2", "t": "Which free service could help a whole family or group?", "ja": "どんな無料サービスなら、家族やグループ全体の役に立ちますか？", "f": ["Who else would benefit?", "Would free childcare or free public transport help more people?"]}, {"n": "QUESTION 3", "t": "Which boring service would save the most money over a lifetime?", "ja": "地味でも、一生で最もお金を節約できるサービスは何ですか？", "f": ["Would cleaning, internet, or insurance save more over time?", "Would you still prefer a more enjoyable service?"]}, {"n": "QUESTION 4", "t": "Should someone be allowed to give their free service to another person?", "ja": "無料サービスをほかの人に譲ってもよいですか？", "f": ["When would giving it away be generous?", "What rule could prevent unfair resale?"]}, {"n": "QUESTION 5", "t": "What problem would make you stop using it, even though it was free?", "ja": "無料でも、どんな問題があれば使うのをやめますか？", "f": ["Would a long wait be enough?", "What would make you pay instead?"]}, {"n": "QUESTION 6", "t": "Now the opposite: what’s one service you would rather pay for?", "ja": "では反対に、お金を払ってでも使いたいサービスは何ですか？", "f": ["What would the paid version need to do better?", "How much more would feel reasonable?"]}]}, {"n": 7, "title": "일주일 동안 휴대전화 없이 지내기", "sub": "一週間、携帯電話なしで過ごすこと", "titles": {"ko": "일주일 동안 휴대전화 없이 지내기", "en": "Going a week without your phone", "ja": "一週間、携帯電話なしで過ごすこと"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-if-full/95-going-a-week-without-your-phone/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-full/95-going-a-week-without-your-phone/lecture/index.html", "source": "courses/en/talk-what-if-full/lessons/95-going-a-week-without-your-phone/lecture/index.html"}, {"href": "view/talk-what-if-full/95-going-a-week-without-your-phone/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-full/95-going-a-week-without-your-phone/prestudy/index.html", "source": "courses/en/talk-what-if-full/lessons/95-going-a-week-without-your-phone/prestudy/index.html"}], "goal": {"t": "Let's explore what a week with less phone use would change. Please read the title aloud.", "ja": "携帯電話を減らす一週間で何が変わるか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which phone feature would you miss most for one week?", "ja": "一週間、携帯電話のどの機能が最も恋しくなりますか？", "f": ["Would you miss maps, messages, or payments most?", "What could you use instead?"]}, {"n": "WARM-UP 2", "t": "What do you usually use your phone for first?", "ja": "普段、最初にスマートフォンを何に使いますか？", "f": ["Could that first task be done another way?", "What happens on a day when you do not use it?"]}, {"n": "QUESTION 1", "t": "Which useful phone feature could you give up with the least trouble?", "ja": "便利なスマートフォンの機能のうち、最も困らずに手放せるものは何ですか？", "f": ["What would you use instead?", "Why is another feature harder to lose?"]}, {"n": "QUESTION 2", "t": "What might improve, if anything, after three days with less phone use?", "ja": "スマホをあまり使わずに三日過ごしたら、何かよくなりそうですか？", "f": ["Would sleep, focus, or free time change?", "What could become harder with less phone use?"]}, {"n": "QUESTION 3", "t": "When is it easiest to leave your phone in another room?", "ja": "携帯電話を別の部屋に置きやすいのは、どんなときですか？", "f": ["Would meals, exercise, or bedtime be easiest?", "What makes a phone hard to leave?"]}, {"n": "QUESTION 4", "t": "How could you stay reachable in an emergency while using your phone less?", "ja": "携帯電話を減らしながら、緊急時に連絡を受けられるようにするにはどうしますか？", "f": ["Who would need another way to contact you?", "Which emergency feature would stay available?"]}, {"n": "QUESTION 5", "t": "Which parts of your phone would you still use during the break?", "ja": "スマホを休む間でも、どの機能は使い続けますか？", "f": ["Would you keep calls, maps, or payments?", "Which use would you limit first?"]}, {"n": "QUESTION 6", "t": "Which phone habit would you most like to change?", "ja": "どの携帯電話の習慣を最も変えたいですか？", "f": ["Would you change late-night use or constant checking?", "Which phone habit is worth keeping?"]}]}, {"n": 8, "title": "AI가 내 일을 한다면 할 일", "sub": "AIが自分の仕事をしたらすること", "titles": {"ko": "AI가 내 일을 한다면 할 일", "en": "What you would do if AI did your job", "ja": "AIが自分の仕事をしたらすること"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-if-full/96-what-you-would-do-if-ai-did-your-job/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-full/96-what-you-would-do-if-ai-did-your-job/lecture/index.html", "source": "courses/en/talk-what-if-full/lessons/96-what-you-would-do-if-ai-did-your-job/lecture/index.html"}, {"href": "view/talk-what-if-full/96-what-you-would-do-if-ai-did-your-job/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-full/96-what-you-would-do-if-ai-did-your-job/prestudy/index.html", "source": "courses/en/talk-what-if-full/lessons/96-what-you-would-do-if-ai-did-your-job/prestudy/index.html"}], "goal": {"t": "Let's imagine how we would use our time if AI handled routine tasks. Please read the title aloud.", "ja": "AIが日常の作業をしたら、時間をどう使うか想像しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "If AI did your usual tasks for a week, how would you use the extra time?", "ja": "AIが普段の作業を一週間してくれたら、空いた時間をどう使いますか？", "f": ["Would you rest, see people, or start a project?", "Would the extra time feel relaxing or strange at first?"]}, {"n": "WARM-UP 2", "t": "How would you give a free week some structure without filling it with work?", "ja": "仕事で埋めずに、自由な一週間をどう組み立てますか？", "f": ["Would you make a plan or decide each morning?", "What would you leave unplanned?"]}, {"n": "QUESTION 1", "t": "Who deserves to know when AI produced most of a result?", "ja": "AIが結果の大部分を作ったとき、誰に知らせる必要がありますか？", "f": ["Would a customer, teacher, or teammate need to know?", "When would saying nothing be unfair?"]}, {"n": "QUESTION 2", "t": "Which part of work, study, care, or daily routine would you miss?", "ja": "仕事、勉強、ケア、日課のどの部分が恋しくなりますか？", "f": ["Would you miss the people, the routine, or finishing something?", "What would you happily stop doing?"]}, {"n": "QUESTION 3", "t": "What project would you start with a month of free time?", "ja": "一か月の自由な時間があれば、どんなプロジェクトを始めますか？", "f": ["Would you learn something, make something, or travel?", "How would you use the first free week?"]}, {"n": "QUESTION 4", "t": "Which daily task can make a person feel useful?", "ja": "どんな日々の作業が、その人自身を役立っていると感じさせますか？", "f": ["Could cooking, caring for someone, or fixing something do that?", "Could AI help without taking over?"]}, {"n": "QUESTION 5", "t": "What task would you still choose to do yourself if AI could do it?", "ja": "AIにできても、自分で続けたい作業は何ですか？", "f": ["Would you still cook, write, or make important decisions yourself?", "When could AI still help?"]}, {"n": "QUESTION 6", "t": "What should never be handed over completely to AI?", "ja": "AIに完全には任せるべきでないことは何ですか？", "f": ["Medical decisions, legal decisions, or something else?", "How could AI still help?"]}]}, {"n": 9, "title": "친구들이 나에게 골라 줄 동물", "sub": "自分を知る人が選びそうな動物", "titles": {"ko": "친구들이 나에게 골라 줄 동물", "en": "The animal your friends would choose for you", "ja": "自分を知る人が選びそうな動物"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-if-full/97-the-animal-your-friends-would-choose-for-you/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-full/97-the-animal-your-friends-would-choose-for-you/lecture/index.html", "source": "courses/en/talk-what-if-full/lessons/97-the-animal-your-friends-would-choose-for-you/lecture/index.html"}, {"href": "view/talk-what-if-full/97-the-animal-your-friends-would-choose-for-you/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-full/97-the-animal-your-friends-would-choose-for-you/prestudy/index.html", "source": "courses/en/talk-what-if-full/lessons/97-the-animal-your-friends-would-choose-for-you/prestudy/index.html"}], "goal": {"t": "Let's use animal comparisons to explore personality. Please read the title aloud.", "ja": "動物の比較を使って、性格について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which animal best represents your personality?", "ja": "どの動物があなたの性格を最もよく表しますか？", "f": ["Would you choose a dog, cat, fox, or bird?", "Where does the comparison stop working?"]}, {"n": "WARM-UP 2", "t": "Which animal would your friends choose for you?", "ja": "友達はあなたにどの動物を選ぶと思いますか？", "f": ["Would they choose a dog, cat, or bird?", "How is a dog's personality different from a cat's?"]}, {"n": "QUESTION 1", "t": "Which animal quality would you like to have more of?", "ja": "どんな動物の性質を、もっと自分にも持ちたいですか？", "f": ["A dog’s loyalty, a cat’s independence, or a bird’s freedom?", "When would that quality help?"]}, {"n": "QUESTION 2", "t": "What do you do that might make your friends choose that animal?", "ja": "あなたのどんな行動を見て、友達はその動物を選びそうですか？", "f": ["Is it something you do often?", "Would your family choose the same animal?"]}, {"n": "QUESTION 3", "t": "Which animal is least like you?", "ja": "あなたに最も似ていない動物は何ですか？", "f": ["Would a loud, slow, or highly social animal feel least like you?", "Could one trait still fit?"]}, {"n": "QUESTION 4", "t": "Which animal fits you on a busy day?", "ja": "忙しい日の自分には、どの動物が合いますか？", "f": ["Which trait does that animal show?", "On a busy day, do you move quickly or slowly?"]}, {"n": "QUESTION 5", "t": "I'll share three real traits about myself. Which animal fits them?", "ja": "私が自分の本当の特徴を三つ話します。どの動物が合いますか？", "f": ["Which trait has the strongest influence on your choice?", "What does the animal comparison fail to capture?"]}, {"n": "QUESTION 6", "t": "What part of your personality doesn’t fit that animal at all?", "ja": "自分の性格のどんな部分は、その動物にまったく合いませんか？", "f": ["Would a second animal fit that side better?", "Which animal would show it?"]}]}, {"n": 10, "title": "다른 나라에서 자랐다면", "sub": "別の国で育っていたら", "titles": {"ko": "다른 나라에서 자랐다면", "en": "Growing up in another country", "ja": "別の国で育っていたら"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-if-full/98-growing-up-in-another-country/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-full/98-growing-up-in-another-country/lecture/index.html", "source": "courses/en/talk-what-if-full/lessons/98-growing-up-in-another-country/lecture/index.html"}, {"href": "view/talk-what-if-full/98-growing-up-in-another-country/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-full/98-growing-up-in-another-country/prestudy/index.html", "source": "courses/en/talk-what-if-full/lessons/98-growing-up-in-another-country/prestudy/index.html"}], "goal": {"t": "Let's imagine how a different upbringing could shape a person. Please read the title aloud.", "ja": "別の環境で育つと、人がどう変わるか想像しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "If you had grown up in another country, which one would you choose?", "ja": "別の国で育っていたとしたら、どの国を選びますか？", "f": ["Would you choose a country for its schools, nature, or daily life?", "What would you want to learn before choosing?"]}, {"n": "WARM-UP 2", "t": "Which part of everyday childhood changes most across countries?", "ja": "国によって、子どもの日常生活のどの部分が最も変わりますか？", "f": ["Would school, home, or free time change most?", "Which difference would a child notice first?"]}, {"n": "QUESTION 1", "t": "In that country, what might school have been like for you?", "ja": "その国で育っていたら、学校生活はどんなものだったと思いますか？", "f": ["Would classes feel stricter or more relaxed?", "What might surprise you on the first day?"]}, {"n": "QUESTION 2", "t": "Which food or family custom would you miss from your actual childhood?", "ja": "実際の子ども時代の食べ物や家族の習慣で、何が恋しくなりそうですか？", "f": ["Would you miss a food, holiday, or family routine?", "What do people often miss from childhood?"]}, {"n": "QUESTION 3", "t": "What part of your actual upbringing would you be happy to leave behind?", "ja": "実際に育った環境のどんな部分なら、なくてもよいと思いますか？", "f": ["Would you change school pressure, rules, or expectations?", "If you would change nothing, what would you keep?"]}, {"n": "QUESTION 4", "t": "What changes about you when you speak another language?", "ja": "別の言語を話すとき、自分のどんなところが変わりますか？", "f": ["Are you quieter, funnier, or more direct?", "Does that change feel good?"]}, {"n": "QUESTION 5", "t": "What would be easier to learn as a child than after moving there as an adult?", "ja": "子どもの頃に学ぶほうが、大人になって移住してからより簡単なことは何ですか？", "f": ["The language or local manners?", "What might an adult notice more clearly?"]}, {"n": "QUESTION 6", "t": "What part of your personality would probably stay the same anywhere?", "ja": "どこで育っても、自分の性格のどんな部分は同じだと思いますか？", "f": ["Why does that feel less shaped by place?", "Could another environment still change how it appears?"]}]}, {"n": 11, "title": "10년 뒤 상상하는 내 모습", "sub": "十年後に想像する自分", "titles": {"ko": "10년 뒤 상상하는 내 모습", "en": "Where you imagine yourself in ten years", "ja": "十年後に想像する自分"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-if-full/99-where-you-imagine-yourself-in-ten-years/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-full/99-where-you-imagine-yourself-in-ten-years/lecture/index.html", "source": "courses/en/talk-what-if-full/lessons/99-where-you-imagine-yourself-in-ten-years/lecture/index.html"}, {"href": "view/talk-what-if-full/99-where-you-imagine-yourself-in-ten-years/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-full/99-where-you-imagine-yourself-in-ten-years/prestudy/index.html", "source": "courses/en/talk-what-if-full/lessons/99-where-you-imagine-yourself-in-ten-years/prestudy/index.html"}], "goal": {"t": "Let's imagine an ordinary day ten years from now. Please read the title aloud.", "ja": "十年後の普通の一日を想像しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What would an ideal ordinary day look like ten years from now?", "ja": "十年後の理想的な普通の一日は、どんな一日ですか？", "f": ["Would it begin in a quiet home, a busy city, or somewhere new?", "What would make the day feel good?"]}, {"n": "WARM-UP 2", "t": "Where would you like to wake up on an ordinary morning ten years from now?", "ja": "十年後の普通の朝、どこで目を覚ましたいですか？", "f": ["What would you want nearby?", "Would the place be busy or quiet?"]}, {"n": "QUESTION 1", "t": "In that future life, who would you see on a normal day?", "ja": "その未来の生活では、普通の日に誰と会いますか？", "f": ["How much time would you want alone?", "Who would you want nearby?"]}, {"n": "QUESTION 2", "t": "What current habit would you like to still have in ten years?", "ja": "今のどんな習慣を、十年後も続けたいですか？", "f": ["Would you keep exercise, reading, or time with friends?", "What could make the habit hard to keep?"]}, {"n": "QUESTION 3", "t": "What would you hope not to spend time doing in ten years?", "ja": "十年後、何に時間を使わずにすむことを望みますか？", "f": ["What would you rather spend that time on?", "Would you rather spend less time commuting or doing housework?"]}, {"n": "QUESTION 4", "t": "Would you rather have a clear plan for those ten years or leave room to change?", "ja": "その十年間について、明確な計画を立てたいですか、それとも変えられる余地を残したいですか？", "f": ["What would you plan now?", "What would you keep flexible?"]}, {"n": "QUESTION 5", "t": "What small action this year could make your future direction clearer?", "ja": "今年どんな小さな行動をすると、将来の方向がより明確になりますか？", "f": ["What could you try this month?", "Would trying one new class or hobby make the future clearer?"]}, {"n": "QUESTION 6", "t": "What surprise would make you happily change that plan?", "ja": "どんな予想外の出来事なら、その計画を喜んで変えますか？", "f": ["A new relationship, place, or dream?", "What part of the old plan would you keep?"]}]}, {"n": 12, "title": "불이 났을 때 구할 한 가지", "sub": "火事で持ち出す一つのもの", "titles": {"ko": "불이 났을 때 구할 한 가지", "en": "The one thing you would save in a fire", "ja": "火事で持ち出す一つのもの"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-what-if-full/100-the-one-thing-you-would-save-in-a-fire/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-what-if-full/100-the-one-thing-you-would-save-in-a-fire/lecture/index.html", "source": "courses/en/talk-what-if-full/lessons/100-the-one-thing-you-would-save-in-a-fire/lecture/index.html"}, {"href": "view/talk-what-if-full/100-the-one-thing-you-would-save-in-a-fire/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-what-if-full/100-the-one-thing-you-would-save-in-a-fire/prestudy/index.html", "source": "courses/en/talk-what-if-full/lessons/100-the-one-thing-you-would-save-in-a-fire/prestudy/index.html"}], "goal": {"t": "Let's talk about possessions, memory, and safe preparation. Please read the title aloud.", "ja": "持ち物、記憶、安全な備えについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Once everyone is safe, which possession would be hardest to lose?", "ja": "全員が安全になった後、失うのが最もつらい持ち物は何ですか？", "f": ["Would you choose photos, a gift, or something you use every day?", "Could a photo or copy protect part of it?"]}, {"n": "WARM-UP 2", "t": "What makes one old object impossible to replace?", "ja": "一つの古い物が、代えられないものになるのはなぜですか？", "f": ["Do you still use it, or does it hold a memory?", "Would a photo or copy keep what matters?"]}, {"n": "QUESTION 1", "t": "What memory does that object bring back?", "ja": "その物を見ると、どんな思い出がよみがえりますか？", "f": ["Who is part of that memory?", "When did you last look at or use it?"]}, {"n": "QUESTION 2", "t": "Would you save photos, letters, or one practical item?", "ja": "写真、手紙、実用的な物一つのどれを持ち出しますか？", "f": ["Which of those would be hardest to replace?", "What would you save instead of those three?"]}, {"n": "QUESTION 3", "t": "Can a digital copy preserve what matters about an old object?", "ja": "デジタルのコピーで、古い物の大切なところを残せますか？", "f": ["What can a copy keep?", "What disappears without the original object?"]}, {"n": "QUESTION 4", "t": "Who would understand why that object matters to you?", "ja": "その物がなぜ大切なのか、誰なら分かってくれそうですか？", "f": ["Would you need to explain it?", "Would it mean the same thing to them?"]}, {"n": "QUESTION 5", "t": "What important object could you back up or photograph now?", "ja": "今、バックアップしたり写真に撮ったりできる大切な物は何ですか？", "f": ["Would photos, documents, or messages need a backup?", "Where would you keep the backup?"]}, {"n": "QUESTION 6", "t": "Now the opposite: what would be easiest to replace?", "ja": "では反対に、最も簡単に買い替えられる物は何ですか？", "f": ["Why doesn’t it carry the same meaning?", "Would you replace it straight away?"]}]}]}, {"no": 19, "label": "19코스", "title": "생각해 볼 것", "titles": {"ko": "생각해 볼 것", "en": "Worth a thought", "ja": "考えたいこと"}, "subtitle": "(中級) 考えたいこと", "desc": {"ko": "일상에서 답할 수 있는 근거로 의견을 말하고 반대 입장까지 검토한다.", "en": "Argue from evidence you can reach from ordinary life, and weigh the other side too.", "ja": "日常から答えられる根拠で意見を述べ、反対の立場まで検討する。"}, "cover": "covers/talk-worth-thinking-about-accessible.webp", "levels": ["B1"], "level": "B1", "slug": "talk-worth-thinking-about-accessible", "lessons": [{"n": 1, "title": "SNS 휴식 기간", "sub": "SNSを休む期間", "titles": {"ko": "SNS 휴식 기간", "en": "How long should a social-media break last?", "ja": "SNSを休む期間"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-worth-thinking-about-accessible/101-how-long-should-a-social-media-break-last/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-worth-thinking-about-accessible/101-how-long-should-a-social-media-break-last/lecture/index.html", "source": "courses/en/talk-worth-thinking-about-accessible/lessons/101-how-long-should-a-social-media-break-last/lecture/index.html"}, {"href": "view/talk-worth-thinking-about-accessible/101-how-long-should-a-social-media-break-last/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-worth-thinking-about-accessible/101-how-long-should-a-social-media-break-last/prestudy/index.html", "source": "courses/en/talk-worth-thinking-about-accessible/lessons/101-how-long-should-a-social-media-break-last/prestudy/index.html"}], "goal": {"t": "Let's examine what a meaningful break from social media would change. Please read the title aloud.", "ja": "SNSを意味のある期間休むと何が変わるか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Would three days away from social media feel too short, too long, or about right?", "ja": "SNSから三日間離れるのは、短すぎますか、長すぎますか、それともちょうどよいですか？", "f": ["What would make three days feel useful?", "Which app would be easiest to leave for three days?"]}, {"n": "WARM-UP 2", "t": "What change would you notice first during three days away from social media?", "ja": "SNSから三日間離れている間、最初にどんな変化に気づきますか？", "f": ["Would you miss messages, news, or entertainment first?", "Which of those do you check most now?"]}, {"n": "QUESTION 1", "t": "What would you do instead of checking social media?", "ja": "SNSを確認する代わりに、何をしますか？", "f": ["What would fill the first few minutes instead?", "When do you check social media most: morning, breaks, or evening?"]}, {"n": "QUESTION 2", "t": "Which useful thing on social media is hardest to replace?", "ja": "SNSの役立つもののうち、最も代えにくいものは何ですか？", "f": ["Why would you miss it?", "Which would you miss most: messages, news, or videos?"]}, {"n": "QUESTION 3", "t": "How can you tell when useful scrolling has turned into wasted time?", "ja": "役立つスクロールが時間の無駄に変わったと、どう見分けられますか？", "f": ["How do you feel after that kind of scrolling?", "Do you ever open an app without a clear reason?"]}, {"n": "QUESTION 4", "t": "Which simple rule keeps social media useful without letting it take over?", "ja": "SNSに時間を奪われず、役立つものに保つ簡単なルールは何ですか？", "f": ["When would that rule be hardest to follow?", "Which is easier: turning off notifications or setting a time limit?"]}, {"n": "QUESTION 5", "t": "Which matters more on social media: reaching more people or keeping more privacy?", "ja": "SNSでは、より多くの人に届くことと、プライバシーを守ることのどちらが大切ですか？", "f": ["When would a public account be useful?", "What should always stay private?"]}, {"n": "QUESTION 6", "t": "Which part of social media would you be happiest to lose?", "ja": "SNSのどんな部分なら、なくなってもうれしいですか？", "f": ["Why would life be better without it?", "Would social media feel calmer with no public comments?"]}]}, {"n": 2, "title": "없어도 살 수 있는 편리한 것", "sub": "なくても暮らせる便利なもの", "titles": {"ko": "없어도 살 수 있는 편리한 것", "en": "A convenience you could live without", "ja": "なくても暮らせる便利なもの"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-worth-thinking-about-accessible/102-what-ai-gets-wrong-about-human-work/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-worth-thinking-about-accessible/102-what-ai-gets-wrong-about-human-work/lecture/index.html", "source": "courses/en/talk-worth-thinking-about-accessible/lessons/102-what-ai-gets-wrong-about-human-work/lecture/index.html"}, {"href": "view/talk-worth-thinking-about-accessible/102-what-ai-gets-wrong-about-human-work/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-worth-thinking-about-accessible/102-what-ai-gets-wrong-about-human-work/prestudy/index.html", "source": "courses/en/talk-worth-thinking-about-accessible/lessons/102-what-ai-gets-wrong-about-human-work/prestudy/index.html"}], "goal": {"t": "Let's discuss which conveniences help, what they cost, and when a slower choice is better. Please read the title aloud.", "ja": "便利なサービスのよさや代償、遅い選択のほうがよいときについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which could you give up for a week: delivery, streaming, or same-day shipping?", "ja": "配達、動画配信、当日配送なら、一週間どれをやめられますか？", "f": ["Which would you miss first?", "What would you do instead?"]}, {"n": "WARM-UP 2", "t": "Which everyday convenience saves you the most time?", "ja": "日常の便利なサービスで、最も時間を節約してくれるものは何ですか？", "f": ["How much time does it save?", "What did people do before it?"]}, {"n": "QUESTION 1", "t": "Which convenience sometimes makes things less enjoyable?", "ja": "ときどき物事を楽しくなくする便利なものは何ですか？", "f": ["Could faster travel make you miss something?", "Which slow activity do you enjoy?"]}, {"n": "QUESTION 2", "t": "What can people forget how to do because an app or service does it for them?", "ja": "アプリやサービスが代わりにすることで、人がやり方を忘れてしまうのは何ですか？", "f": ["Does that skill still matter?", "When might people need it again?"]}, {"n": "QUESTION 3", "t": "Which convenience creates the most unnecessary waste?", "ja": "どの便利なサービスが、最も不要なごみを生んでいますか？", "f": ["What gets thrown away?", "What less convenient option creates less waste?"]}, {"n": "QUESTION 4", "t": "When can faster service put too much pressure on workers?", "ja": "速いサービスが働く人に負担をかけすぎるのは、どんなときですか？", "f": ["What deadline seems unreasonable?", "Would you accept slower service?"]}, {"n": "QUESTION 5", "t": "Which convenience would you avoid if it needed too much personal data?", "ja": "個人情報を多く求められるなら、使わない便利なサービスは何ですか？", "f": ["What information would you refuse to share?", "What benefit might still tempt you?"]}, {"n": "QUESTION 6", "t": "When would you choose the slower option even if both cost the same?", "ja": "値段が同じでも、遅いほうを選ぶのはどんなときですか？", "f": ["Would quality or enjoyment matter more?", "Which choice would you make in a hurry?"]}]}, {"n": 3, "title": "얼마면 충분한가", "sub": "いくらあれば十分か", "titles": {"ko": "얼마면 충분한가", "en": "How much money is enough?", "ja": "いくらあれば十分か"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-worth-thinking-about-accessible/103-how-much-money-is-enough/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-worth-thinking-about-accessible/103-how-much-money-is-enough/lecture/index.html", "source": "courses/en/talk-worth-thinking-about-accessible/lessons/103-how-much-money-is-enough/lecture/index.html"}, {"href": "view/talk-worth-thinking-about-accessible/103-how-much-money-is-enough/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-worth-thinking-about-accessible/103-how-much-money-is-enough/prestudy/index.html", "source": "courses/en/talk-worth-thinking-about-accessible/lessons/103-how-much-money-is-enough/prestudy/index.html"}], "goal": {"t": "Let's discuss what financial security needs to make possible. Please read the title aloud.", "ja": "経済的な安心によって何が可能になる必要があるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "When someone says, ‘I have enough money,’ what do you imagine they can afford?", "ja": "誰かが「十分なお金がある」と言うとき、何を無理なく払えると想像しますか？", "f": ["Which cost matters most?", "Would a home and emergency savings count as enough?"]}, {"n": "WARM-UP 2", "t": "Which money worry would you remove first?", "ja": "お金の心配を一つなくせるなら、最初にどれをなくしますか？", "f": ["How would removing that worry change daily life?", "Which is more stressful: an unexpected bill or rising monthly costs?"]}, {"n": "QUESTION 1", "t": "What's something important that more money can't fix?", "ja": "お金が増えても解決できない大切なことは何ですか？", "f": ["Could money still help indirectly?", "Can money buy trust?"]}, {"n": "QUESTION 2", "t": "What can make the same income feel comfortable for one person and stressful for another?", "ja": "同じ収入でも、一人には余裕があり、別の人には苦しく感じられるのはなぜですか？", "f": ["Which cost varies most?", "Who usually needs more money: one person or a family of four?"]}, {"n": "QUESTION 3", "t": "When does extra money make the biggest difference?", "ja": "お金が増えることが最も大きな違いを生むのは、どんなときですか？", "f": ["Which need is being met?", "Does extra money matter more for rent or entertainment?"]}, {"n": "QUESTION 4", "t": "If money worries took less of your attention, what would you focus on instead?", "ja": "お金の心配に注意を取られなくなったら、代わりに何に集中したいですか？", "f": ["Why would that deserve more attention?", "Would you use the extra focus for rest, family, or learning?"]}, {"n": "QUESTION 5", "t": "Which creates a stronger feeling of security: savings or reliable monthly income?", "ja": "貯金と毎月の安定した収入のどちらが、より強い安心を生みますか？", "f": ["Why does your choice feel safer?", "What's one bill people need to plan for every month?"]}, {"n": "QUESTION 6", "t": "What kind of security matters most besides money?", "ja": "お金以外では、どんな安心が最も重要ですか？", "f": ["How can that kind of security help?", "Which gives more security: good health or people you can rely on?"]}]}, {"n": 4, "title": "가장 좋은 나이가 있을까?", "sub": "いちばんいい年齢はある？", "titles": {"ko": "가장 좋은 나이가 있을까?", "en": "Is there a best age to be?", "ja": "いちばんいい年齢はある？"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-worth-thinking-about-accessible/104-is-there-a-best-age-to-be/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-worth-thinking-about-accessible/104-is-there-a-best-age-to-be/lecture/index.html", "source": "courses/en/talk-worth-thinking-about-accessible/lessons/104-is-there-a-best-age-to-be/lecture/index.html"}, {"href": "view/talk-worth-thinking-about-accessible/104-is-there-a-best-age-to-be/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-worth-thinking-about-accessible/104-is-there-a-best-age-to-be/prestudy/index.html", "source": "courses/en/talk-worth-thinking-about-accessible/lessons/104-is-there-a-best-age-to-be/prestudy/index.html"}], "goal": {"t": "Let's compare the strengths and costs of different life stages. Please read the title aloud.", "ja": "さまざまな人生の段階の強みと代償を比べましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "If you could stay one age for ten years, which age would you choose?", "ja": "一つの年齢のまま十年間過ごせるなら、何歳を選びますか？", "f": ["What makes that age attractive?", "Would you rather keep youthful energy or later-life experience?"]}, {"n": "WARM-UP 2", "t": "Which age gives the best mix of energy and freedom?", "ja": "どの年齢が、元気さと自由の最もよい組み合わせを持っていますか？", "f": ["Which freedom matters most?", "Which age seems most independent: twenty, forty, or sixty?"]}, {"n": "QUESTION 1", "t": "What hidden difficulty comes with an age people often call the best?", "ja": "多くの人が最高だと言う年齢には、どんな見えにくい大変さがありますか？", "f": ["Why is that part difficult?", "Which seems harder: being twenty or being sixty?"]}, {"n": "QUESTION 2", "t": "What's one good thing about your age now?", "ja": "今の年齢のよいところを一つ挙げるとしたら何ですか？", "f": ["Why is that good thing easy to overlook?", "What's easier for you now than when you were younger?"]}, {"n": "QUESTION 3", "t": "What is one experience you hope to have when you're older?", "ja": "年を重ねたときに、どんな経験をしてみたいですか？", "f": ["Why would that experience matter?", "Would you rather see the future or relive the past?"]}, {"n": "QUESTION 4", "t": "How do health or money change which age seems best?", "ja": "健康やお金によって、どの年齢が最高に見えるかはどう変わりますか？", "f": ["Which matters more for your answer: health or money?", "Would good health make almost any age feel better?"]}, {"n": "QUESTION 5", "t": "Why can the same age feel freeing for one person and limiting for another?", "ja": "同じ年齢でも、一人には自由に、別の人には制約が多く感じられるのはなぜですか？", "f": ["Which life detail creates that difference?", "Could age thirty feel different with and without children?"]}, {"n": "QUESTION 6", "t": "What's one good thing about getting older that people don't talk about enough?", "ja": "年を重ねることのよさで、あまり話されないものは何ですか？", "f": ["What has become clearer with age?", "Which improves more: confidence or patience?"]}]}, {"n": 5, "title": "약속을 취소해도 괜찮을 때", "sub": "予定をキャンセルしてもよいとき", "titles": {"ko": "약속을 취소해도 괜찮을 때", "en": "When it's okay to cancel plans", "ja": "予定をキャンセルしてもよいとき"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-worth-thinking-about-accessible/105-a-decision-worth-revisiting/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-worth-thinking-about-accessible/105-a-decision-worth-revisiting/lecture/index.html", "source": "courses/en/talk-worth-thinking-about-accessible/lessons/105-a-decision-worth-revisiting/lecture/index.html"}, {"href": "view/talk-worth-thinking-about-accessible/105-a-decision-worth-revisiting/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-worth-thinking-about-accessible/105-a-decision-worth-revisiting/prestudy/index.html", "source": "courses/en/talk-worth-thinking-about-accessible/lessons/105-a-decision-worth-revisiting/prestudy/index.html"}], "goal": {"t": "Let's discuss fair reasons, considerate messages, and how cancelling affects trust. Please read the title aloud.", "ja": "公平な理由や思いやりのある伝え方、キャンセルが信頼に与える影響について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What is a good reason to cancel plans at the last minute?", "ja": "直前に予定をキャンセルしてもよい理由は何ですか？", "f": ["Would illness or bad weather count?", "Which reasons would not feel fair?"]}, {"n": "WARM-UP 2", "t": "How much notice feels fair when someone cancels?", "ja": "キャンセルするとき、どのくらい前に知らせるのが公平ですか？", "f": ["Does the type of plan matter?", "What if they only know an hour before?"]}, {"n": "QUESTION 1", "t": "Is a text message enough, or should the person call?", "ja": "メッセージだけで十分ですか、それとも電話するべきですか？", "f": ["When would a call matter?", "Which would you prefer to receive?"]}, {"n": "QUESTION 2", "t": "When should someone offer to pay for a cost caused by cancelling?", "ja": "キャンセルで費用が発生した場合、どんなときに支払いを申し出るべきですか？", "f": ["What if a ticket cannot be refunded?", "Should friends split the cost?"]}, {"n": "QUESTION 3", "t": "How many cancellations would make you stop inviting someone?", "ja": "何回キャンセルされたら、その人を誘わなくなりますか？", "f": ["Does the reason matter?", "What could rebuild trust?"]}, {"n": "QUESTION 4", "t": "Can being exhausted be a good enough reason to cancel?", "ja": "疲れ切っていることは、キャンセルする十分な理由になりますか？", "f": ["Does it depend on the plan?", "What could they suggest instead?"]}, {"n": "QUESTION 5", "t": "What makes an apology for cancelling feel sincere?", "ja": "キャンセルへの謝罪が誠実に感じられるのは、どんなときですか？", "f": ["Are words enough?", "Should the person suggest a new date?"]}, {"n": "QUESTION 6", "t": "Which plan would you almost never cancel?", "ja": "ほとんど絶対にキャンセルしない予定は何ですか？", "f": ["Why is it important?", "What emergency could still change your mind?"]}]}, {"n": 6, "title": "영어로 말하며 알게 된 점", "sub": "英語を話して気づいたこと", "titles": {"ko": "영어로 말하며 알게 된 점", "en": "What speaking English has made you notice", "ja": "英語を話して気づいたこと"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-worth-thinking-about-accessible/106-what-speaking-english-has-made-you-notice/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-worth-thinking-about-accessible/106-what-speaking-english-has-made-you-notice/lecture/index.html", "source": "courses/en/talk-worth-thinking-about-accessible/lessons/106-what-speaking-english-has-made-you-notice/lecture/index.html"}, {"href": "view/talk-worth-thinking-about-accessible/106-what-speaking-english-has-made-you-notice/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-worth-thinking-about-accessible/106-what-speaking-english-has-made-you-notice/prestudy/index.html", "source": "courses/en/talk-worth-thinking-about-accessible/lessons/106-what-speaking-english-has-made-you-notice/prestudy/index.html"}], "goal": {"t": "Let's reflect on what speaking English makes us notice about language. Please read the title aloud.", "ja": "英語を話すことで言語について何に気づくか振り返りましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one difference between English and Japanese you've noticed while speaking?", "ja": "英語を話す中で気づいた、英語と日本語の違いを一つ挙げるとしたら何ですか？", "f": ["Which conversation made it clear?", "Which language feels more direct?"]}, {"n": "WARM-UP 2", "t": "Which is harder to translate naturally: an English joke or an apology?", "ja": "自然に訳すのが難しいのは、英語の冗談と謝罪のどちらですか？", "f": ["Does the tone change in Japanese?", "Which matters more in translation: the exact words or the feeling?"]}, {"n": "QUESTION 1", "t": "Which is easier to say directly in English: a request, an opinion, or a refusal?", "ja": "英語で直接言いやすいのは、お願い、意見、断りのどれですか？", "f": ["How would you say it differently in Japanese?", "Can a direct answer sound rude?"]}, {"n": "QUESTION 2", "t": "What kind of conversation becomes possible because of English?", "ja": "英語があることで、どんな会話ができるようになりますか？", "f": ["Who might have that conversation?", "Would English help more while travelling or working online?"]}, {"n": "QUESTION 3", "t": "Which part of speaking English still takes the most effort?", "ja": "英語を話すとき、今も最も努力が必要な部分は何ですか？", "f": ["What support actually helps?", "Which is harder: speaking quickly or finding the right word?"]}, {"n": "QUESTION 4", "t": "What has surprised you most about speaking English?", "ja": "英語を話してみて、最も驚いたことは何ですか？", "f": ["Was it easier or harder than expected?", "What happened in one real conversation or lesson?"]}, {"n": "QUESTION 5", "t": "Do you feel different when you speak English?", "ja": "英語を話すとき、いつもと違う自分を感じますか？", "f": ["Are you more direct, friendly, or quiet?", "Which is easier in English: making jokes or sharing opinions?"]}, {"n": "QUESTION 6", "t": "What would you practise first if you started learning English again?", "ja": "もう一度英語学習を始めるなら、最初に何を練習しますか？", "f": ["Why would you start there?", "Would you start with listening or speaking?"]}]}]}, {"no": 20, "label": "20코스", "title": "생각해 볼 것", "titles": {"ko": "생각해 볼 것", "en": "Worth a thought", "ja": "考えたいこと"}, "subtitle": "(上級) 考えたいこと", "desc": {"ko": "일상에서 답할 수 있는 근거로 의견을 말하고 반대 입장까지 검토한다.", "en": "Argue from evidence you can reach from ordinary life, and weigh the other side too.", "ja": "日常から答えられる根拠で意見を述べ、反対の立場まで検討する。"}, "cover": "covers/talk-worth-thinking-about-full.webp", "levels": ["C1"], "level": "C1", "slug": "talk-worth-thinking-about-full", "lessons": [{"n": 1, "title": "SNS 휴식 기간", "sub": "SNSを休む期間", "titles": {"ko": "SNS 휴식 기간", "en": "How long should a social-media break last?", "ja": "SNSを休む期間"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-worth-thinking-about-full/101-how-long-should-a-social-media-break-last/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-worth-thinking-about-full/101-how-long-should-a-social-media-break-last/lecture/index.html", "source": "courses/en/talk-worth-thinking-about-full/lessons/101-how-long-should-a-social-media-break-last/lecture/index.html"}, {"href": "view/talk-worth-thinking-about-full/101-how-long-should-a-social-media-break-last/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-worth-thinking-about-full/101-how-long-should-a-social-media-break-last/prestudy/index.html", "source": "courses/en/talk-worth-thinking-about-full/lessons/101-how-long-should-a-social-media-break-last/prestudy/index.html"}], "goal": {"t": "Let's examine what a meaningful break from social media would change. Please read the title aloud.", "ja": "SNSを意味のある期間休むと何が変わるか考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Would three days away from social media feel too short, too long, or about right?", "ja": "SNSから三日間離れるのは、短すぎますか、長すぎますか、それともちょうどよいですか？", "f": ["What would make three days feel useful?", "Which app would be easiest to leave for three days?"]}, {"n": "WARM-UP 2", "t": "What change would you notice first during three days away from social media?", "ja": "SNSから三日間離れている間、最初にどんな変化に気づきますか？", "f": ["Would you miss messages, news, or entertainment first?", "Which of those do you check most now?"]}, {"n": "QUESTION 1", "t": "What would you do instead of checking social media?", "ja": "SNSを確認する代わりに、何をしますか？", "f": ["What would fill the first few minutes instead?", "When do you check social media most: morning, breaks, or evening?"]}, {"n": "QUESTION 2", "t": "Which useful thing on social media is hardest to replace?", "ja": "SNSの役立つもののうち、最も代えにくいものは何ですか？", "f": ["Why would you miss it?", "Which would you miss most: messages, news, or videos?"]}, {"n": "QUESTION 3", "t": "How can you tell when useful scrolling has turned into wasted time?", "ja": "役立つスクロールが時間の無駄に変わったと、どう見分けられますか？", "f": ["How do you feel after that kind of scrolling?", "Do you ever open an app without a clear reason?"]}, {"n": "QUESTION 4", "t": "Which simple rule keeps social media useful without letting it take over?", "ja": "SNSに時間を奪われず、役立つものに保つ簡単なルールは何ですか？", "f": ["When would that rule be hardest to follow?", "Which is easier: turning off notifications or setting a time limit?"]}, {"n": "QUESTION 5", "t": "Which matters more on social media: reaching more people or keeping more privacy?", "ja": "SNSでは、より多くの人に届くことと、プライバシーを守ることのどちらが大切ですか？", "f": ["When would a public account be useful?", "What should always stay private?"]}, {"n": "QUESTION 6", "t": "Which part of social media would you be happiest to lose?", "ja": "SNSのどんな部分なら、なくなってもうれしいですか？", "f": ["Why would life be better without it?", "Would social media feel calmer with no public comments?"]}]}, {"n": 2, "title": "없어도 살 수 있는 편리한 것", "sub": "なくても暮らせる便利なもの", "titles": {"ko": "없어도 살 수 있는 편리한 것", "en": "A convenience you could live without", "ja": "なくても暮らせる便利なもの"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-worth-thinking-about-full/102-what-ai-gets-wrong-about-human-work/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-worth-thinking-about-full/102-what-ai-gets-wrong-about-human-work/lecture/index.html", "source": "courses/en/talk-worth-thinking-about-full/lessons/102-what-ai-gets-wrong-about-human-work/lecture/index.html"}, {"href": "view/talk-worth-thinking-about-full/102-what-ai-gets-wrong-about-human-work/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-worth-thinking-about-full/102-what-ai-gets-wrong-about-human-work/prestudy/index.html", "source": "courses/en/talk-worth-thinking-about-full/lessons/102-what-ai-gets-wrong-about-human-work/prestudy/index.html"}], "goal": {"t": "Let's discuss which conveniences help, what they cost, and when a slower choice is better. Please read the title aloud.", "ja": "便利なサービスのよさや代償、遅い選択のほうがよいときについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which could you give up for a week: delivery, streaming, or same-day shipping?", "ja": "配達、動画配信、当日配送なら、一週間どれをやめられますか？", "f": ["Which would you miss first?",
