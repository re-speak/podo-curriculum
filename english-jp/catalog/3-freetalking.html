"What would you do instead?"]}, {"n": "WARM-UP 2", "t": "Which everyday convenience saves you the most time?", "ja": "日常の便利なサービスで、最も時間を節約してくれるものは何ですか？", "f": ["How much time does it save?", "What did people do before it?"]}, {"n": "QUESTION 1", "t": "Which convenience sometimes makes things less enjoyable?", "ja": "ときどき物事を楽しくなくする便利なものは何ですか？", "f": ["Could faster travel make you miss something?", "Which slow activity do you enjoy?"]}, {"n": "QUESTION 2", "t": "What can people forget how to do because an app or service does it for them?", "ja": "アプリやサービスが代わりにすることで、人がやり方を忘れてしまうのは何ですか？", "f": ["Does that skill still matter?", "When might people need it again?"]}, {"n": "QUESTION 3", "t": "Which convenience creates the most unnecessary waste?", "ja": "どの便利なサービスが、最も不要なごみを生んでいますか？", "f": ["What gets thrown away?", "What less convenient option creates less waste?"]}, {"n": "QUESTION 4", "t": "When can faster service put too much pressure on workers?", "ja": "速いサービスが働く人に負担をかけすぎるのは、どんなときですか？", "f": ["What deadline seems unreasonable?", "Would you accept slower service?"]}, {"n": "QUESTION 5", "t": "Which convenience would you avoid if it needed too much personal data?", "ja": "個人情報を多く求められるなら、使わない便利なサービスは何ですか？", "f": ["What information would you refuse to share?", "What benefit might still tempt you?"]}, {"n": "QUESTION 6", "t": "When would you choose the slower option even if both cost the same?", "ja": "値段が同じでも、遅いほうを選ぶのはどんなときですか？", "f": ["Would quality or enjoyment matter more?", "Which choice would you make in a hurry?"]}]}, {"n": 3, "title": "얼마면 충분한가", "sub": "いくらあれば十分か", "titles": {"ko": "얼마면 충분한가", "en": "How much money is enough?", "ja": "いくらあれば十分か"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-worth-thinking-about-full/103-how-much-money-is-enough/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-worth-thinking-about-full/103-how-much-money-is-enough/lecture/index.html", "source": "courses/en/talk-worth-thinking-about-full/lessons/103-how-much-money-is-enough/lecture/index.html"}, {"href": "view/talk-worth-thinking-about-full/103-how-much-money-is-enough/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-worth-thinking-about-full/103-how-much-money-is-enough/prestudy/index.html", "source": "courses/en/talk-worth-thinking-about-full/lessons/103-how-much-money-is-enough/prestudy/index.html"}], "goal": {"t": "Let's discuss what financial security needs to make possible. Please read the title aloud.", "ja": "経済的な安心によって何が可能になる必要があるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "When someone says, ‘I have enough money,’ what do you imagine they can afford?", "ja": "誰かが「十分なお金がある」と言うとき、何を無理なく払えると想像しますか？", "f": ["Which cost matters most?", "Would a home and emergency savings count as enough?"]}, {"n": "WARM-UP 2", "t": "Which money worry would you remove first?", "ja": "お金の心配を一つなくせるなら、最初にどれをなくしますか？", "f": ["How would removing that worry change daily life?", "Which is more stressful: an unexpected bill or rising monthly costs?"]}, {"n": "QUESTION 1", "t": "What's something important that more money can't fix?", "ja": "お金が増えても解決できない大切なことは何ですか？", "f": ["Could money still help indirectly?", "Can money buy trust?"]}, {"n": "QUESTION 2", "t": "What can make the same income feel comfortable for one person and stressful for another?", "ja": "同じ収入でも、一人には余裕があり、別の人には苦しく感じられるのはなぜですか？", "f": ["Which cost varies most?", "Who usually needs more money: one person or a family of four?"]}, {"n": "QUESTION 3", "t": "When does extra money make the biggest difference?", "ja": "お金が増えることが最も大きな違いを生むのは、どんなときですか？", "f": ["Which need is being met?", "Does extra money matter more for rent or entertainment?"]}, {"n": "QUESTION 4", "t": "If money worries took less of your attention, what would you focus on instead?", "ja": "お金の心配に注意を取られなくなったら、代わりに何に集中したいですか？", "f": ["Why would that deserve more attention?", "Would you use the extra focus for rest, family, or learning?"]}, {"n": "QUESTION 5", "t": "Which creates a stronger feeling of security: savings or reliable monthly income?", "ja": "貯金と毎月の安定した収入のどちらが、より強い安心を生みますか？", "f": ["Why does your choice feel safer?", "What's one bill people need to plan for every month?"]}, {"n": "QUESTION 6", "t": "What kind of security matters most besides money?", "ja": "お金以外では、どんな安心が最も重要ですか？", "f": ["How can that kind of security help?", "Which gives more security: good health or people you can rely on?"]}]}, {"n": 4, "title": "가장 좋은 나이가 있을까?", "sub": "いちばんいい年齢はある？", "titles": {"ko": "가장 좋은 나이가 있을까?", "en": "Is there a best age to be?", "ja": "いちばんいい年齢はある？"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-worth-thinking-about-full/104-is-there-a-best-age-to-be/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-worth-thinking-about-full/104-is-there-a-best-age-to-be/lecture/index.html", "source": "courses/en/talk-worth-thinking-about-full/lessons/104-is-there-a-best-age-to-be/lecture/index.html"}, {"href": "view/talk-worth-thinking-about-full/104-is-there-a-best-age-to-be/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-worth-thinking-about-full/104-is-there-a-best-age-to-be/prestudy/index.html", "source": "courses/en/talk-worth-thinking-about-full/lessons/104-is-there-a-best-age-to-be/prestudy/index.html"}], "goal": {"t": "Let's compare the strengths and costs of different life stages. Please read the title aloud.", "ja": "さまざまな人生の段階の強みと代償を比べましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "If you could stay one age for ten years, which age would you choose?", "ja": "一つの年齢のまま十年間過ごせるなら、何歳を選びますか？", "f": ["What makes that age attractive?", "Would you rather keep youthful energy or later-life experience?"]}, {"n": "WARM-UP 2", "t": "Which age gives the best mix of energy and freedom?", "ja": "どの年齢が、元気さと自由の最もよい組み合わせを持っていますか？", "f": ["Which freedom matters most?", "Which age seems most independent: twenty, forty, or sixty?"]}, {"n": "QUESTION 1", "t": "What hidden difficulty comes with an age people often call the best?", "ja": "多くの人が最高だと言う年齢には、どんな見えにくい大変さがありますか？", "f": ["Why is that part difficult?", "Which seems harder: being twenty or being sixty?"]}, {"n": "QUESTION 2", "t": "What's one good thing about your age now?", "ja": "今の年齢のよいところを一つ挙げるとしたら何ですか？", "f": ["Why is that good thing easy to overlook?", "What's easier for you now than when you were younger?"]}, {"n": "QUESTION 3", "t": "What is one experience you hope to have when you're older?", "ja": "年を重ねたときに、どんな経験をしてみたいですか？", "f": ["Why would that experience matter?", "Would you rather see the future or relive the past?"]}, {"n": "QUESTION 4", "t": "How do health or money change which age seems best?", "ja": "健康やお金によって、どの年齢が最高に見えるかはどう変わりますか？", "f": ["Which matters more for your answer: health or money?", "Would good health make almost any age feel better?"]}, {"n": "QUESTION 5", "t": "Why can the same age feel freeing for one person and limiting for another?", "ja": "同じ年齢でも、一人には自由に、別の人には制約が多く感じられるのはなぜですか？", "f": ["Which life detail creates that difference?", "Could age thirty feel different with and without children?"]}, {"n": "QUESTION 6", "t": "What's underrated about getting older?", "ja": "年を重ねることの、もっと評価されるべき点は何ですか？", "f": ["What has become clearer with age?", "Which improves more: confidence or patience?"]}]}, {"n": 5, "title": "약속을 취소해도 괜찮을 때", "sub": "予定をキャンセルしてもよいとき", "titles": {"ko": "약속을 취소해도 괜찮을 때", "en": "When it's okay to cancel plans", "ja": "予定をキャンセルしてもよいとき"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-worth-thinking-about-full/105-a-decision-worth-revisiting/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-worth-thinking-about-full/105-a-decision-worth-revisiting/lecture/index.html", "source": "courses/en/talk-worth-thinking-about-full/lessons/105-a-decision-worth-revisiting/lecture/index.html"}, {"href": "view/talk-worth-thinking-about-full/105-a-decision-worth-revisiting/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-worth-thinking-about-full/105-a-decision-worth-revisiting/prestudy/index.html", "source": "courses/en/talk-worth-thinking-about-full/lessons/105-a-decision-worth-revisiting/prestudy/index.html"}], "goal": {"t": "Let's discuss fair reasons, considerate messages, and how cancelling affects trust. Please read the title aloud.", "ja": "公平な理由や思いやりのある伝え方、キャンセルが信頼に与える影響について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What is a good reason to cancel plans at the last minute?", "ja": "直前に予定をキャンセルしてもよい理由は何ですか？", "f": ["Would illness or bad weather count?", "Which reasons would not feel fair?"]}, {"n": "WARM-UP 2", "t": "How much notice feels fair when someone cancels?", "ja": "キャンセルするとき、どのくらい前に知らせるのが公平ですか？", "f": ["Does the type of plan matter?", "What if they only know an hour before?"]}, {"n": "QUESTION 1", "t": "Is a text message enough, or should the person call?", "ja": "メッセージだけで十分ですか、それとも電話するべきですか？", "f": ["When would a call matter?", "Which would you prefer to receive?"]}, {"n": "QUESTION 2", "t": "When should someone offer to pay for a cost caused by cancelling?", "ja": "キャンセルで費用が発生した場合、どんなときに支払いを申し出るべきですか？", "f": ["What if a ticket cannot be refunded?", "Should friends split the cost?"]}, {"n": "QUESTION 3", "t": "How many cancellations would make you stop inviting someone?", "ja": "何回キャンセルされたら、その人を誘わなくなりますか？", "f": ["Does the reason matter?", "What could rebuild trust?"]}, {"n": "QUESTION 4", "t": "Can being exhausted be a good enough reason to cancel?", "ja": "疲れ切っていることは、キャンセルする十分な理由になりますか？", "f": ["Does it depend on the plan?", "What could they suggest instead?"]}, {"n": "QUESTION 5", "t": "What makes an apology for cancelling feel sincere?", "ja": "キャンセルへの謝罪が誠実に感じられるのは、どんなときですか？", "f": ["Are words enough?", "Should the person suggest a new date?"]}, {"n": "QUESTION 6", "t": "Which plan would you almost never cancel?", "ja": "ほとんど絶対にキャンセルしない予定は何ですか？", "f": ["Why is it important?", "What emergency could still change your mind?"]}]}, {"n": 6, "title": "영어로 말하며 알게 된 점", "sub": "英語を話して気づいたこと", "titles": {"ko": "영어로 말하며 알게 된 점", "en": "What speaking English has made you notice", "ja": "英語を話して気づいたこと"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-worth-thinking-about-full/106-what-speaking-english-has-made-you-notice/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-worth-thinking-about-full/106-what-speaking-english-has-made-you-notice/lecture/index.html", "source": "courses/en/talk-worth-thinking-about-full/lessons/106-what-speaking-english-has-made-you-notice/lecture/index.html"}, {"href": "view/talk-worth-thinking-about-full/106-what-speaking-english-has-made-you-notice/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-worth-thinking-about-full/106-what-speaking-english-has-made-you-notice/prestudy/index.html", "source": "courses/en/talk-worth-thinking-about-full/lessons/106-what-speaking-english-has-made-you-notice/prestudy/index.html"}], "goal": {"t": "Let's reflect on what speaking English makes us notice about language. Please read the title aloud.", "ja": "英語を話すことで言語について何に気づくか振り返りましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one difference between English and Japanese you've noticed while speaking?", "ja": "英語を話す中で気づいた、英語と日本語の違いを一つ挙げるとしたら何ですか？", "f": ["Which conversation made it clear?", "Which language feels more direct?"]}, {"n": "WARM-UP 2", "t": "Which is harder to translate naturally: an English joke or an apology?", "ja": "自然に訳すのが難しいのは、英語の冗談と謝罪のどちらですか？", "f": ["Does the tone change in Japanese?", "Which matters more in translation: the exact words or the feeling?"]}, {"n": "QUESTION 1", "t": "Which is easier to say directly in English: a request, an opinion, or a refusal?", "ja": "英語で直接言いやすいのは、お願い、意見、断りのどれですか？", "f": ["How would you say it differently in Japanese?", "Can a direct answer sound rude?"]}, {"n": "QUESTION 2", "t": "What kind of conversation becomes possible because of English?", "ja": "英語があることで、どんな会話ができるようになりますか？", "f": ["Who might have that conversation?", "Would English help more while travelling or working online?"]}, {"n": "QUESTION 3", "t": "Which part of speaking English still takes the most effort?", "ja": "英語を話すとき、今も最も努力が必要な部分は何ですか？", "f": ["What support actually helps?", "Which is harder: speaking quickly or finding the right word?"]}, {"n": "QUESTION 4", "t": "What has surprised you most about speaking English?", "ja": "英語を話してみて、最も驚いたことは何ですか？", "f": ["Was it easier or harder than expected?", "What happened in one real conversation or lesson?"]}, {"n": "QUESTION 5", "t": "Do you feel different when you speak English?", "ja": "英語を話すとき、いつもと違う自分を感じますか？", "f": ["Are you more direct, friendly, or quiet?", "Which is easier in English: making jokes or sharing opinions?"]}, {"n": "QUESTION 6", "t": "What would you practise first if you started learning English again?", "ja": "もう一度英語学習を始めるなら、最初に何を練習しますか？", "f": ["Why would you start there?", "Would you start with listening or speaking?"]}]}]}, {"no": 21, "label": "21코스", "title": "밸런스 게임", "titles": {"ko": "밸런스 게임", "en": "Balance games", "ja": "究極の二択"}, "subtitle": "(中級) 究極の二択", "desc": {"ko": "두 선택 중 하나를 빠르게 고르고, 구체적인 생활 장면과 조건 변화로 선택의 이유를 길게 설명한다.", "en": "Choose one of two fast, then justify it at length through concrete scenes and shifting conditions.", "ja": "二つのうち一つを素早く選び、具体的な生活の場面と条件の変化で、その理由を長く説明する。"}, "cover": "covers/talk-balance-games-accessible.webp", "levels": ["B1"], "level": "B1", "slug": "talk-balance-games-accessible", "lessons": [{"n": 1, "title": "직접 하기, 돈 내고 맡기기?", "sub": "自分でやる？お金を払って頼む？", "titles": {"ko": "직접 하기, 돈 내고 맡기기?", "en": "Do it yourself or pay someone?", "ja": "自分でやる？お金を払って頼む？"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-balance-games-accessible/107-more-money-or-more-time/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-accessible/107-more-money-or-more-time/lecture/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/107-more-money-or-more-time/lecture/index.html"}, {"href": "view/talk-balance-games-accessible/107-more-money-or-more-time/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-accessible/107-more-money-or-more-time/prestudy/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/107-more-money-or-more-time/prestudy/index.html"}], "goal": {"t": "Let’s compare doing a job yourself with paying someone to do it, then find the point where the better choice changes. Please read the title aloud.", "ja": "自分でする場合と、お金を払って人に頼む場合を比べ、どんな条件で選択が変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What’s one job at home you usually do yourself?", "ja": "家で普段、自分でする作業は何ですか？", "f": ["How did you learn to do it?", "Do you enjoy it?"]}, {"n": "WARM-UP 2", "t": "What’s one job you’d happily pay someone else to do?", "ja": "お金を払ってでも人に頼みたい作業は何ですか？", "f": ["What makes it difficult or annoying?", "How often does it need doing?"]}, {"n": "QUESTION 1", "t": "If some furniture arrived in a box, would you build it yourself or pay for help?", "ja": "組み立て式の家具が届いたら、自分で作りますか、それともお金を払って頼みますか？", "f": ["What tools or skills would you need?", "How much would you pay?"]}, {"n": "QUESTION 2", "t": "When is paying someone worth the time it saves?", "ja": "どんなときなら、時間を節約するために人へお金を払う価値がありますか？", "f": ["Would saving one hour be enough?", "What would you do with that time?"]}, {"n": "QUESTION 3", "t": "What’s something you learned because you didn’t want to pay for help?", "ja": "人に頼むお金を節約したくて、自分で覚えたことは何ですか？", "f": ["How long did it take to learn?", "Would you use that skill again?"]}, {"n": "QUESTION 4", "t": "Which job would you never try without a professional?", "ja": "専門家なしでは絶対にやらない作業は何ですか？", "f": ["Is safety or quality the bigger reason?", "Would you want to watch and learn?"]}, {"n": "QUESTION 5", "t": "If a friend offered free help, what would you still prefer to do yourself?", "ja": "友達が無料で手伝うと言っても、自分でやりたいことは何ですか？", "f": ["Why would you want control of it?", "What help would you accept?"]}, {"n": "QUESTION 6", "t": "If you suddenly earned more, what would you stop doing yourself first?", "ja": "収入が急に増えたら、最初に自分でやめる作業は何ですか？", "f": ["How often would you pay for it?", "What would you continue doing yourself?"]}]}, {"n": 2, "title": "친구 백 명, 가까운 친구 세 명?", "sub": "友人百人、それとも親しい友人三人？", "titles": {"ko": "친구 백 명, 가까운 친구 세 명?", "en": "A hundred friends or three close ones?", "ja": "友人百人、それとも親しい友人三人？"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-balance-games-accessible/108-a-hundred-friends-or-three-close-ones/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-accessible/108-a-hundred-friends-or-three-close-ones/lecture/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/108-a-hundred-friends-or-three-close-ones/lecture/index.html"}, {"href": "view/talk-balance-games-accessible/108-a-hundred-friends-or-three-close-ones/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-accessible/108-a-hundred-friends-or-three-close-ones/prestudy/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/108-a-hundred-friends-or-three-close-ones/prestudy/index.html"}], "goal": {"t": "Let's compare a hundred friends and three close friends, then explain what could change your choice. Please read the title aloud.", "ja": "百人の友人と三人の親しい友人を比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Who, if anyone, is easy for you to talk to for hours?", "ja": "何時間でも話しやすい相手がいるとしたら、誰ですか？", "f": ["What makes the conversation easy?", "Is it easier in person or on the phone?"]}, {"n": "WARM-UP 2", "t": "What makes it easy to meet new people?", "ja": "新しい人と知り合いやすくするものは何ですか？", "f": ["What opening question works well?", "Where is it easier to meet people: a class, a party, or online?"]}, {"n": "QUESTION 1", "t": "In a difficult week, would you rather have a hundred friendly contacts or three close friends?", "ja": "大変な一週間なら、顔見知りの友人百人と親しい友人三人のどちらがよいですか？", "f": ["What support would your choice give you?", "Who would help more in a crisis?"]}, {"n": "QUESTION 2", "t": "What would be missing if you knew many people but had no close friends?", "ja": "知り合いは多くても親しい友人がいないとしたら、何が足りませんか？", "f": ["Who would you call after a bad day?", "Would you rather share good news with one person or a large group?"]}, {"n": "QUESTION 3", "t": "When is a wide circle more useful than a few close friends?", "ja": "少数の親友より、広い人間関係のほうが役立つのはどんなときですか？", "f": ["What kind of support would a wide circle provide?", "Which helps more when job hunting: close friends or many contacts?"]}, {"n": "QUESTION 4", "t": "In a new city, would you build a wide circle or one close friendship first?", "ja": "新しい町へ移ったら、広い人間関係と一つの親しい友情のどちらを先に作りますか？", "f": ["How would you meet people?", "Where would you start: work, a class, or a hobby group?"]}, {"n": "QUESTION 5", "t": "Has a casual contact ever helped you find a job, a place, or useful information?", "ja": "それほど親しくない知り合いに、仕事や場所、役立つ情報を教えてもらったことはありますか？", "f": ["How did you know them?", "If not, which kind of contact might help?"]}, {"n": "QUESTION 6", "t": "Which kind of friendship is harder to maintain?", "ja": "どちらの友人関係を保つほうが難しいですか？", "f": ["What takes more time?", "Which one is easier to lose?"]}]}, {"n": 3, "title": "끝없는 여름, 끝없는 겨울?", "sub": "終わらない夏、それとも冬？", "titles": {"ko": "끝없는 여름, 끝없는 겨울?", "en": "Endless summer or endless winter?", "ja": "終わらない夏、それとも冬？"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-balance-games-accessible/109-endless-summer-or-endless-winter/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-accessible/109-endless-summer-or-endless-winter/lecture/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/109-endless-summer-or-endless-winter/lecture/index.html"}, {"href": "view/talk-balance-games-accessible/109-endless-summer-or-endless-winter/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-accessible/109-endless-summer-or-endless-winter/prestudy/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/109-endless-summer-or-endless-winter/prestudy/index.html"}], "goal": {"t": "Let's compare endless summer and endless winter, then explain what could change your choice. Please read the title aloud.", "ja": "終わらない夏と終わらない冬を比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which is harder for you: a very hot day or a very cold day?", "ja": "とても暑い日ととても寒い日のどちらが大変ですか？", "f": ["Does travel make that weather harder?", "Which bothers you more: strong sun or cold wind?"]}, {"n": "WARM-UP 2", "t": "How would you spend a full day outside in perfect weather?", "ja": "完璧な天気の日を丸一日外で過ごすなら、何をしますか？", "f": ["Which outdoor place would you visit?", "Would you choose a park, a beach, or a city walk?"]}, {"n": "QUESTION 1", "t": "If the same season continued all year, would you prefer permanent summer or permanent winter?", "ja": "同じ季節が一年中続くなら、終わらない夏と終わらない冬のどちらがよいですか？", "f": ["Which activity shapes your answer?", "Which would be harder all year: heat or short winter days?"]}, {"n": "QUESTION 2", "t": "Which daily habit would change most if summer never ended?", "ja": "夏が終わらなければ、どの日課が最も変わりますか？", "f": ["How would outdoor plans change?", "Which changes more with summer: sleep or clothing?"]}, {"n": "QUESTION 3", "t": "If every indoor space were comfortable, which season would you choose?", "ja": "すべての室内が快適なら、どの季節を選びますか？", "f": ["Would daylight still matter?", "Would you rather go outside in rain or snow?"]}, {"n": "QUESTION 4", "t": "Would you rather have a warm dark day or a cold sunny day?", "ja": "暖かく暗い日と、寒く晴れた日のどちらがよいですか？", "f": ["Does light affect your mood?", "Which helps your mood more: warmth or sunlight?"]}, {"n": "QUESTION 5", "t": "What's one weather condition you could not accept all year?", "ja": "一年中は受け入れられない天候を一つ挙げるとしたら何ですか？", "f": ["How long could you accept that weather?", "Which is harder to live with: humidity or ice?"]}, {"n": "QUESTION 6", "t": "Now the opposite: which season would you miss after a year without it?", "ja": "では反対に、一年間なかったら恋しくなる季節はどちらですか？", "f": ["What activity would you miss most?", "Would one short holiday in that season be enough?"]}]}, {"n": 4, "title": "아침형 인간, 올빼미형 인간?", "sub": "朝型、それとも夜型？", "titles": {"ko": "아침형 인간, 올빼미형 인간?", "en": "Morning person or night owl?", "ja": "朝型、それとも夜型？"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-balance-games-accessible/110-morning-person-or-night-owl/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-accessible/110-morning-person-or-night-owl/lecture/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/110-morning-person-or-night-owl/lecture/index.html"}, {"href": "view/talk-balance-games-accessible/110-morning-person-or-night-owl/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-accessible/110-morning-person-or-night-owl/prestudy/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/110-morning-person-or-night-owl/prestudy/index.html"}], "goal": {"t": "Let's compare a morning schedule and a night schedule, then explain what could change your choice. Please read the title aloud.", "ja": "朝型の生活と夜型の生活を比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What helps you feel awake in the morning?", "ja": "朝、目を覚ますのに何が役立ちますか？", "f": ["Light, coffee, food, or movement?", "How long does it take you to feel ready?"]}, {"n": "WARM-UP 2", "t": "When would you sleep and wake if tomorrow had no schedule?", "ja": "明日何も予定がなければ、何時に寝て起きますか？", "f": ["How much sleep would that give you?", "Would you sleep later on a completely free day?"]}, {"n": "QUESTION 1", "t": "For your most important tasks, would you rather start early or work late?", "ja": "大切な作業なら、朝早く始めるのと夜遅く取り組むのと、どちらがよいですか？", "f": ["When would you do your hardest work?", "Which time is quieter for you?"]}, {"n": "QUESTION 2", "t": "Which part of your routine is hardest to move earlier or later?", "ja": "日課の中で、時間を早めたり遅らせたりするのが最も難しいものは何ですか？", "f": ["Sleep, meals, or plans with other people?", "Why is it hard to move?"]}, {"n": "QUESTION 3", "t": "What rule helps two people with opposite sleep schedules share a home?", "ja": "睡眠時間が反対の二人が一緒に暮らすには、どんなルールが役立ちますか？", "f": ["When would the home need to be quiet?", "Would you set quiet hours at night or in the morning?"]}, {"n": "QUESTION 4", "t": "Would you stay up later if nothing required you to wake early?", "ja": "早起きする必要が何もなければ、もっと夜更かししますか？", "f": ["Could staying up late affect your health?", "Would you still wake early on weekends?"]}, {"n": "QUESTION 5", "t": "What has actually made you change your sleep schedule before?", "ja": "これまで実際に、何がきっかけで睡眠時間を変えましたか？", "f": ["A job, travel, or family responsibilities?", "Did the change last?"]}, {"n": "QUESTION 6", "t": "What do you enjoy about the time of day when you are usually less productive?", "ja": "普段あまり集中できない時間帯にも、好きなところはありますか？", "f": ["Is it quieter or more social?", "Would you want more of that time?"]}]}, {"n": 5, "title": "계획 여행, 즉흥 여행?", "sub": "計画的な旅、それとも気ままな旅？", "titles": {"ko": "계획 여행, 즉흥 여행?", "en": "A planned trip or a spontaneous one?", "ja": "計画的な旅、それとも気ままな旅？"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-balance-games-accessible/111-a-planned-trip-or-a-spontaneous-one/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-accessible/111-a-planned-trip-or-a-spontaneous-one/lecture/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/111-a-planned-trip-or-a-spontaneous-one/lecture/index.html"}, {"href": "view/talk-balance-games-accessible/111-a-planned-trip-or-a-spontaneous-one/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-accessible/111-a-planned-trip-or-a-spontaneous-one/prestudy/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/111-a-planned-trip-or-a-spontaneous-one/prestudy/index.html"}], "goal": {"t": "Let's compare a planned trip and a spontaneous trip, then explain what could change your choice. Please read the title aloud.", "ja": "計画的な旅行と行き当たりばったりの旅行を比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What kind of surprise can improve a trip?", "ja": "どんな予想外の出来事が、旅行をよくすることがありますか？", "f": ["When would the same surprise be stressful?", "Would unexpected rain ruin a trip or make it memorable?"]}, {"n": "WARM-UP 2", "t": "What would you decide first for a short trip tomorrow?", "ja": "明日短い旅行へ行くなら、最初に何を決めますか？", "f": ["What could stay open?", "Which would you book first: transport or a place to stay?"]}, {"n": "QUESTION 1", "t": "For a short trip, would you rather follow a plan or make decisions as you go?", "ja": "短い旅行なら、計画に従うのと、その場で決めるのと、どちらがよいですか？", "f": ["What would you leave undecided?", "Which is worse: missing a booking or missing a surprise?"]}, {"n": "QUESTION 2", "t": "What can go wrong when every minute of a trip is planned?", "ja": "旅行の一分一分まで計画すると、何がうまくいかなくなることがありますか？", "f": ["Which part of the plan would feel restrictive?", "Would you enjoy a trip with every meal booked?"]}, {"n": "QUESTION 3", "t": "Would one hotel booking make you feel prepared for a week-long trip?", "ja": "一週間の旅行で宿だけ予約してあれば、準備できたと感じますか？", "f": ["What would you do on the first day?", "Would you feel calmer with transport booked too?"]}, {"n": "QUESTION 4", "t": "What should people agree on before travelling together?", "ja": "一緒に旅行する前に、何について合意しておくべきですか？", "f": ["Money, timing, or accommodation?", "Where could people compromise?"]}, {"n": "QUESTION 5", "t": "What kind of trip needs a detailed plan?", "ja": "どんな旅行には詳しい計画が必要ですか？", "f": ["What could go wrong without a plan?", "Which needs more planning: a beach weekend or an international trip?"]}, {"n": "QUESTION 6", "t": "Now the opposite: what’s one part of a trip you would never plan?", "ja": "では反対に、旅行で絶対に計画を立てない部分は何ですか？", "f": ["Why is it better left open?", "Would a meal or an afternoon be easy to leave unplanned?"]}]}, {"n": 6, "title": "혼자 여행, 함께 여행?", "sub": "一人旅、それとも誰かと一緒？", "titles": {"ko": "혼자 여행, 함께 여행?", "en": "Travelling alone or with other people?", "ja": "一人旅、それとも誰かと一緒？"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-balance-games-accessible/112-travelling-alone-or-with-other-people/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-accessible/112-travelling-alone-or-with-other-people/lecture/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/112-travelling-alone-or-with-other-people/lecture/index.html"}, {"href": "view/talk-balance-games-accessible/112-travelling-alone-or-with-other-people/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-accessible/112-travelling-alone-or-with-other-people/prestudy/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/112-travelling-alone-or-with-other-people/prestudy/index.html"}], "goal": {"t": "Let's compare travelling alone and travelling with other people, then explain what could change your choice. Please read the title aloud.", "ja": "一人で旅行することとほかの人と旅行することを比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's the best part of travelling alone?", "ja": "一人旅の最もよいところは何ですか？", "f": ["Which freedom matters most?", "Would you enjoy one day alone in a new city?"]}, {"n": "WARM-UP 2", "t": "Would a beautiful view feel better alone or shared with someone?", "ja": "すてきな景色は、一人で見るのと誰かと共有するのと、どちらがよく感じられますか？", "f": ["What is good about your choice?", "Would you send someone a photo right away?"]}, {"n": "QUESTION 1", "t": "When visiting somewhere new, would you rather travel alone or with someone?", "ja": "初めての場所を訪れるなら、一人で行くのと誰かと行くのと、どちらがよいですか？", "f": ["What would be easier alone?", "When would company help?"]}, {"n": "QUESTION 2", "t": "What's the hardest part of travelling with other people?", "ja": "ほかの人と旅行する一番難しいところは何ですか？", "f": ["What could companions agree on before leaving?", "Which causes more conflict: money, food, or timing?"]}, {"n": "QUESTION 3", "t": "What would make three days alone somewhere new enjoyable?", "ja": "初めての場所で一人で過ごす三日間を、楽しくするものは何ですか？", "f": ["When might company still help?", "Would knowing the local language make solo travel easier?"]}, {"n": "QUESTION 4", "t": "How would a companion who planned everything change a trip?", "ja": "すべてを計画する同行者がいると、旅行はどう変わりますか？", "f": ["What would you still decide yourself?", "Would you let a close friend plan the whole weekend?"]}, {"n": "QUESTION 5", "t": "What kind of destination is better with company?", "ja": "どんな旅先なら、誰かと一緒のほうがよいですか？", "f": ["What makes company useful there?", "Which feels safer with company: a city or a remote area?"]}, {"n": "QUESTION 6", "t": "Now the opposite: what part of a trip would you rather not share with anyone?", "ja": "では反対に、旅行のどんな時間は誰とも共有せずに過ごしたいですか？", "f": ["One meal or one afternoon?", "Why would that time alone help?"]}]}, {"n": 7, "title": "도시 생활, 시골 생활?", "sub": "都会暮らし、それとも田舎暮らし？", "titles": {"ko": "도시 생활, 시골 생활?", "en": "Life in the city or the countryside?", "ja": "都会暮らし、それとも田舎暮らし？"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-balance-games-accessible/113-life-in-the-city-or-the-countryside/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-accessible/113-life-in-the-city-or-the-countryside/lecture/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/113-life-in-the-city-or-the-countryside/lecture/index.html"}, {"href": "view/talk-balance-games-accessible/113-life-in-the-city-or-the-countryside/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-accessible/113-life-in-the-city-or-the-countryside/prestudy/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/113-life-in-the-city-or-the-countryside/prestudy/index.html"}], "goal": {"t": "Let's compare city life and country life, then explain what could change your choice. Please read the title aloud.", "ja": "都会の生活と田舎の生活を比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What is the most important thing to have within walking distance of your home?", "ja": "家から歩いて行ける範囲にあると最も大切なものは何ですか？", "f": ["How often would you use it?", "Would a ten-minute walk feel close enough?"]}, {"n": "WARM-UP 2", "t": "What would be the perfect view from your window?", "ja": "窓からどんな景色が見えたら理想的ですか？", "f": ["Would you accept a longer commute for that view?", "Would you rather see trees or city lights?"]}, {"n": "QUESTION 1", "t": "For daily life, would you rather live in a busy city or a quiet town?", "ja": "日常生活なら、にぎやかな都会と静かな町のどちらに住みたいですか？", "f": ["What would you use most in your chosen place?", "Which would you miss more: quiet or convenience?"]}, {"n": "QUESTION 2", "t": "What would you miss first after moving from a city to a quiet town?", "ja": "都会から静かな町へ移ったら、最初に何が恋しくなりますか？", "f": ["Which daily routine would become harder?", "Shopping, transport, or seeing friends?"]}, {"n": "QUESTION 3", "t": "What advantages does living in the countryside have over living in a city?", "ja": "都会で暮らす場合と比べて、田舎暮らしにはどんなよさがありますか？", "f": ["Would you live in the countryside if you had your dream job there?", "Do you think most people prefer living in big cities or small towns?"]}, {"n": "QUESTION 4", "t": "How far would you be willing to travel to a hospital, supermarket, or station?", "ja": "病院、スーパー、駅までなら、どのくらい遠くても受け入れられますか？", "f": ["Which one must be closest?", "Would a beautiful home change your limit?"]}, {"n": "QUESTION 5", "t": "For everyday life, which matters more: nearby services or a quiet home?", "ja": "日常生活では、近くの便利なサービスと静かな家のどちらが大切ですか？", "f": ["Which service would you want nearby?", "Would you accept more noise to live near a station?"]}, {"n": "QUESTION 6", "t": "If you had enough money to live anywhere in the world, where would you choose to live, and why?", "ja": "世界のどこにでも住めるだけのお金があるとしたら、どこを選び、その理由は何ですか？", "f": ["Would you want to live there forever, or just for a few years?", "What would you miss about your current home?"]}]}, {"n": 8, "title": "인터넷 없는 여름, 에어컨 없는 여름?", "sub": "ネットなしの夏、それともエアコンなし？", "titles": {"ko": "인터넷 없는 여름, 에어컨 없는 여름?", "en": "A summer without internet or air conditioning?", "ja": "ネットなしの夏、それともエアコンなし？"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-balance-games-accessible/114-a-summer-without-internet-or-air-conditioning/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-accessible/114-a-summer-without-internet-or-air-conditioning/lecture/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/114-a-summer-without-internet-or-air-conditioning/lecture/index.html"}, {"href": "view/talk-balance-games-accessible/114-a-summer-without-internet-or-air-conditioning/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-accessible/114-a-summer-without-internet-or-air-conditioning/prestudy/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/114-a-summer-without-internet-or-air-conditioning/prestudy/index.html"}], "goal": {"t": "Let's compare a summer without internet and a summer without air conditioning, then explain what could change your choice. Please read the title aloud.", "ja": "インターネットなしの夏とエアコンなしの夏を比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What becomes difficult after one hour without internet?", "ja": "インターネットが一時間使えないと、最初に何が困りますか？", "f": ["What could still be done offline?", "Which would you miss first: messages, maps, or payments?"]}, {"n": "WARM-UP 2", "t": "How would you spend half a cool day without internet?", "ja": "涼しい日にインターネットなしで半日過ごすなら、何をしますか？", "f": ["A walk, a book, or a film?", "Who might you spend it with?"]}, {"n": "QUESTION 1", "t": "If you had to lose one for a summer, would you choose internet or air conditioning?", "ja": "一夏の間どちらかを失うなら、インターネットとエアコンのどちらにしますか？", "f": ["Would work, health, or family needs matter most?", "Which is more essential in hot weather: cooling or online access?"]}, {"n": "QUESTION 2", "t": "What would be the first problem during one day without air conditioning?", "ja": "エアコンなしで一日過ごすと、最初に何が問題になりますか？", "f": ["What could make the day easier?", "Which suffers first in heat: sleep or concentration?"]}, {"n": "QUESTION 3", "t": "If you could keep internet only for work and emergencies, would that change your summer choice?", "ja": "仕事と緊急時だけインターネットを使えるなら、夏の選択は変わりますか？", "f": ["Which online activity would you miss for fun?", "Would limited access feel easier than no access?"]}, {"n": "QUESTION 4", "t": "Would a safe, cool place nearby make a summer without air conditioning possible?", "ja": "近くに安全で涼しい場所があれば、エアコンなしの夏を過ごせますか？", "f": ["Would the safe place need to open at night?", "Would a nearby library make the summer easier?"]}, {"n": "QUESTION 5", "t": "Which part of a summer day is hardest without air conditioning?", "ja": "エアコンなしでは、夏の一日のどの時間が最も大変ですか？", "f": ["Sleeping or working?", "Where could you go to cool down?"]}, {"n": "QUESTION 6", "t": "What one change would make you switch to the other choice?", "ja": "どんな条件が一つ変われば、もう一方を選びますか？", "f": ["Would cooler weather change it?", "Would offline work or school change it?"]}]}, {"n": 9, "title": "더 나은 워라밸, 더 높은 급여?", "sub": "よりよい生活との両立、それとも高い給料？", "titles": {"ko": "더 나은 워라밸, 더 높은 급여?", "en": "Better work-life balance or a higher salary?", "ja": "よりよい生活との両立、それとも高い給料？"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-balance-games-accessible/115-better-work-life-balance-or-a-higher-salary/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-accessible/115-better-work-life-balance-or-a-higher-salary/lecture/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/115-better-work-life-balance-or-a-higher-salary/lecture/index.html"}, {"href": "view/talk-balance-games-accessible/115-better-work-life-balance-or-a-higher-salary/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-accessible/115-better-work-life-balance-or-a-higher-salary/prestudy/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/115-better-work-life-balance-or-a-higher-salary/prestudy/index.html"}], "goal": {"t": "Let's compare better work-life balance and a higher salary, then explain what could change your choice. Please read the title aloud.", "ja": "よりよい仕事と生活の両立とより高い給料を比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What makes a day off feel genuinely restful?", "ja": "しっかり休めたと感じるには、何が必要ですか？", "f": ["What would you stop doing on a restful day?", "Would you rather rest alone or spend time with people?"]}, {"n": "WARM-UP 2", "t": "Which part of the day would you refuse to give up?", "ja": "一日の中で、必ず守りたい自分の時間はいつですか？", "f": ["How could you protect that time?", "Which would you protect first: sleep or social time?"]}, {"n": "QUESTION 1", "t": "For the next year, would you choose more free time or a higher income?", "ja": "これから一年、自由な時間と高い収入のどちらを選びますか？", "f": ["Which need feels more urgent?", "What makes a week feel too busy?"]}, {"n": "QUESTION 2", "t": "What would improve first with one extra free hour every day?", "ja": "毎日自由な時間が一時間増えたら、最初に何がよくなりますか？", "f": ["How would the extra hour help?", "Would you use the extra hour for sleep, exercise, or family?"]}, {"n": "QUESTION 3", "t": "Would high pay be worth often losing evenings and weekends?", "ja": "高い給料でも、夜や週末をよく失うなら受け入れますか？", "f": ["Which commitment could not be sacrificed?", "Would losing every weekend be too much?"]}, {"n": "QUESTION 4", "t": "Would a clear one-year limit make a demanding high-paid job easier to accept?", "ja": "大変でも高収入の仕事が一年だけなら、受け入れやすくなりますか？", "f": ["What would the year need to achieve?", "Would you accept the job for three months instead of a year?"]}, {"n": "QUESTION 5", "t": "Would caring for someone or facing a large bill make higher pay more important?", "ja": "誰かのケアや大きな支払いが必要になったら、より高い給料が重要になりますか？", "f": ["Would you need the higher pay for long?", "Rent, health care, or family care?"]}, {"n": "QUESTION 6", "t": "What exact salary or amount of free time would make you switch?", "ja": "どのくらいの給料や自由時間なら、反対の選択に変わりますか？", "f": ["Would one extra day off be enough?", "Would a temporary offer change your answer?"]}]}, {"n": 10, "title": "재택근무, 사무실 출근?", "sub": "在宅勤務、それとも出社？", "titles": {"ko": "재택근무, 사무실 출근?", "en": "Working from home or going into the office?", "ja": "在宅勤務、それとも出社？"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-balance-games-accessible/116-working-from-home-or-going-into-the-office/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-accessible/116-working-from-home-or-going-into-the-office/lecture/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/116-working-from-home-or-going-into-the-office/lecture/index.html"}, {"href": "view/talk-balance-games-accessible/116-working-from-home-or-going-into-the-office/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-accessible/116-working-from-home-or-going-into-the-office/prestudy/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/116-working-from-home-or-going-into-the-office/prestudy/index.html"}], "goal": {"t": "Let's compare working from home and going into the office, then explain what could change your choice. Please read the title aloud.", "ja": "在宅で働くことと職場へ行くことを比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's the biggest distraction when working or studying at home?", "ja": "家で仕事や勉強をするとき、いちばん邪魔になるものは何ですか？", "f": ["How could the space be changed?", "Which distracts more at home: noise, chores, or your phone?"]}, {"n": "WARM-UP 2", "t": "How would you use the time saved by removing a commute?", "ja": "通勤時間がなくなったら、その時間をどう使いますか？", "f": ["Would you use the time the same way every day?", "Would you use the saved commute time for rest, exercise, or something social?"]}, {"n": "QUESTION 1", "t": "For focused work, would you choose home or a shared workplace?", "ja": "集中して作業するなら、家と共有の職場のどちらを選びますか？", "f": ["What kind of work are you imagining?", "Which place is quieter for you?"]}, {"n": "QUESTION 2", "t": "What changes most in your day when you work at home instead of an office?", "ja": "職場ではなく家で働くと、一日の中で何が最も変わりますか？", "f": ["Does it become easier or harder?", "Focus, communication, or breaks?"]}, {"n": "QUESTION 3", "t": "Would a quiet office fifteen minutes away be better than working at home?", "ja": "十五分の場所にある静かな職場は、在宅勤務よりよいですか？", "f": ["Which part of the office would help most?", "Would a short commute make the office more attractive?"]}, {"n": "QUESTION 4", "t": "Which task is worth meeting a team in person for?", "ja": "どんな作業なら、チームが直接会う価値がありますか？", "f": ["What would the team need to do together?", "Which is easier in person: planning or solving a disagreement?"]}, {"n": "QUESTION 5", "t": "What can make a workday at home feel less lonely?", "ja": "在宅勤務の日に孤独を感じにくくするには、何が役立ちますか？", "f": ["Would a short call with a coworker help?", "Which would help more: lunch outside or an online chat?"]}, {"n": "QUESTION 6", "t": "What would make you switch to the other workplace?", "ja": "どんな条件なら、もう一方の働く場所に変えますか？", "f": ["A shorter commute or a private room?", "Which problem would need to disappear?"]}]}, {"n": 11, "title": "독학하기, 수업 듣기?", "sub": "独学する？教室で学ぶ？", "titles": {"ko": "독학하기, 수업 듣기?", "en": "Learn on your own or take a class?", "ja": "独学する？教室で学ぶ？"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-balance-games-accessible/117-studying-in-a-cafe-or-at-home/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-accessible/117-studying-in-a-cafe-or-at-home/lecture/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/117-studying-in-a-cafe-or-at-home/lecture/index.html"}, {"href": "view/talk-balance-games-accessible/117-studying-in-a-cafe-or-at-home/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-accessible/117-studying-in-a-cafe-or-at-home/prestudy/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/117-studying-in-a-cafe-or-at-home/prestudy/index.html"}], "goal": {"t": "Let’s compare learning independently with taking a class, then explain when feedback, structure, or freedom matters most. Please read the title aloud.", "ja": "独学と授業で学ぶ場合を比べ、フィードバック、決まった進め方、自由さのどれが重要になるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What’s one skill you taught yourself?", "ja": "独学で身につけた技能は何ですか？", "f": ["How did you learn it?", "If none, what would you like to learn alone?"]}, {"n": "WARM-UP 2", "t": "What’s one class that was worth your time?", "ja": "受けてよかったと思う授業や講座は何ですか？", "f": ["What made the teacher or group useful?", "If none, what class would you try?"]}, {"n": "QUESTION 1", "t": "If you started a new language or instrument, would you learn alone or take a class?", "ja": "新しい言語や楽器を始めるなら、独学しますか、それとも授業を受けますか？", "f": ["Which one are you imagining?", "What would you do in the first week?"]}, {"n": "QUESTION 2", "t": "Which part of learning is easier to do alone?", "ja": "学ぶ過程のどんな部分は、一人でするほうが簡単ですか？", "f": ["Does learning at your own speed help?", "Would you use a book or a video?"]}, {"n": "QUESTION 3", "t": "What skill needs feedback from another person?", "ja": "どんな技能には、ほかの人からのフィードバックが必要ですか？", "f": ["Pronunciation, sport, or something else?", "What might be hard to notice alone?"]}, {"n": "QUESTION 4", "t": "Would a free online course keep you motivated for three months?", "ja": "無料のオンライン講座だけで、三か月間やる気を保てますか？", "f": ["What routine would help?", "What might make you quit?"]}, {"n": "QUESTION 5", "t": "When is a class worth paying for?", "ja": "どんなときなら、授業にお金を払う価値がありますか？", "f": ["Is feedback or a fixed schedule more valuable?", "How much would feel reasonable?"]}, {"n": "QUESTION 6", "t": "What would make you switch from one learning method to the other?", "ja": "どんなことがあれば、もう一方の学び方に変えますか？", "f": ["Would slow progress make you switch?", "Would one excellent teacher change your mind?"]}]}, {"n": 12, "title": "온라인 쇼핑, 매장 쇼핑?", "sub": "オンライン、それとも店で買い物？", "titles": {"ko": "온라인 쇼핑, 매장 쇼핑?", "en": "Shopping online or in a shop?", "ja": "オンライン、それとも店で買い物？"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-balance-games-accessible/118-shopping-online-or-in-a-shop/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-accessible/118-shopping-online-or-in-a-shop/lecture/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/118-shopping-online-or-in-a-shop/lecture/index.html"}, {"href": "view/talk-balance-games-accessible/118-shopping-online-or-in-a-shop/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-accessible/118-shopping-online-or-in-a-shop/prestudy/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/118-shopping-online-or-in-a-shop/prestudy/index.html"}], "goal": {"t": "Let's compare shopping online and shopping in a shop, then explain what could change your choice. Please read the title aloud.", "ja": "オンラインで買うことと店舗で買うことを比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What makes you trust a product you see online?", "ja": "オンラインで見た商品を信頼できるのは、どんなときですか？", "f": ["Does a clear return policy matter?", "Which do you trust more: customer photos or star ratings?"]}, {"n": "WARM-UP 2", "t": "If you needed a phone charger today, would you check online or visit a shop first?", "ja": "今日スマートフォンの充電器が必要なら、まずオンラインで確認しますか、それとも店へ行きますか？", "f": ["Would price or certainty matter more?", "Would you pay more for the charger today?"]}, {"n": "QUESTION 1", "t": "For an important purchase, would you trust an online order or a shop more?", "ja": "大切な買い物なら、オンライン注文と店のどちらをより信頼しますか？", "f": ["Which product are you imagining?", "Which would you inspect first: shoes or a phone?"]}, {"n": "QUESTION 2", "t": "What would you miss most if physical shops disappeared?", "ja": "実際の店がなくなったら、何が最も恋しくなりますか？", "f": ["Why would you miss that part?", "Which would you miss more: trying things on or asking staff?"]}, {"n": "QUESTION 3", "t": "Would you buy online if it were cheaper but hard to return?", "ja": "ネットのほうが安くても返品が難しいなら、買いますか？", "f": ["What would you check first?", "Would you take the risk for a very cheap item?"]}, {"n": "QUESTION 4", "t": "When would advice from shop staff be worth the trip?", "ja": "どんな買い物なら、店員のアドバイスを聞くために店へ行く価値がありますか？", "f": ["What would you ask them?", "Would advice matter more for clothes or electronics?"]}, {"n": "QUESTION 5", "t": "Which product would you never buy without seeing it in person?", "ja": "実物を見ずには絶対に買わない商品は何ですか？", "f": ["What do you need to check in person?", "Which is riskier online: clothes or electronics?"]}, {"n": "QUESTION 6", "t": "What would make you switch to the other way of shopping?", "ja": "どんな条件なら、もう一方の買い方に変えますか？", "f": ["Would free returns change it?", "Would needing the item today change it?"]}]}, {"n": 13, "title": "모두 기억하기, 나쁜 기억 잊기?", "sub": "すべて覚える、それとも嫌な記憶を忘れる？", "titles": {"ko": "모두 기억하기, 나쁜 기억 잊기?", "en": "Remembering everything or forgetting bad memories?", "ja": "すべて覚える、それとも嫌な記憶を忘れる？"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-balance-games-accessible/119-remembering-everything-or-forgetting-bad-memories/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-accessible/119-remembering-everything-or-forgetting-bad-memories/lecture/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/119-remembering-everything-or-forgetting-bad-memories/lecture/index.html"}, {"href": "view/talk-balance-games-accessible/119-remembering-everything-or-forgetting-bad-memories/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-accessible/119-remembering-everything-or-forgetting-bad-memories/prestudy/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/119-remembering-everything-or-forgetting-bad-memories/prestudy/index.html"}], "goal": {"t": "Let's compare remembering everything and forgetting bad memories, then explain what could change your choice. Please read the title aloud.", "ja": "すべてを覚えていることとつらい記憶を忘れることを比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What kind of happy memory can a photograph bring back?", "ja": "写真を見ると、どんな楽しい記憶が戻ることがありますか？", "f": ["Which detail returns first?", "Which brings back more: a photo or a song?"]}, {"n": "WARM-UP 2", "t": "Which small ordinary moment is worth remembering for years?", "ja": "長く覚えていたい小さな出来事は何ですか？", "f": ["Why could that ordinary moment matter later?", "Would you record an ordinary day in a diary?"]}, {"n": "QUESTION 1", "t": "Would you rather remember every ordinary detail or be able to forget painful memories?", "ja": "日常の細かいことをすべて覚えるのと、つらい記憶を忘れられるのと、どちらを選びますか？", "f": ["How would your choice help in daily life?", "Which side could also cause problems?"]}, {"n": "QUESTION 2", "t": "What would perfect memory make easier?", "ja": "完全な記憶があれば、何が楽になりますか？", "f": ["Could too much detail become distracting?", "Would perfect memory help more at work or while studying?"]}, {"n": "QUESTION 3", "t": "Would you want perfect memory if every embarrassment stayed vivid too?", "ja": "恥ずかしいことも鮮明に残るなら、完全な記憶がほしいですか？", "f": ["Would embarrassing memories get easier with time?", "Which would bother you more: old mistakes or useless details?"]}, {"n": "QUESTION 4", "t": "Would perfect memory make arguments easier or harder?", "ja": "何でも覚えていたら、口論は解決しやすくなりますか、それとも難しくなりますか？", "f": ["Would remembering the exact words help?", "Is it sometimes better to forget a small mistake?"]}, {"n": "QUESTION 5", "t": "What kind of small mistake is better to forget?", "ja": "どんな小さな失敗なら、忘れたほうがよいですか？", "f": ["Would forgetting help someone move on?", "Is there still a lesson worth keeping?"]}, {"n": "QUESTION 6", "t": "Would you trust yourself to choose which memories to forget?", "ja": "どの記憶を忘れるか、自分で決めることを信頼できますか？", "f": ["What could go wrong?", "Would you wait a month before deciding?"]}]}, {"n": 14, "title": "한 사람의 칭찬, 많은 사람의 인정?", "sub": "一人からの言葉？多くの人からの評価？", "titles": {"ko": "한 사람의 칭찬, 많은 사람의 인정?", "en": "Praise from one person or recognition from many?", "ja": "一人からの言葉？多くの人からの評価？"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-balance-games-accessible/120-being-rich-and-anonymous-or-respected-on-an-ordinary-income/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-accessible/120-being-rich-and-anonymous-or-respected-on-an-ordinary-income/lecture/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/120-being-rich-and-anonymous-or-respected-on-an-ordinary-income/lecture/index.html"}, {"href": "view/talk-balance-games-accessible/120-being-rich-and-anonymous-or-respected-on-an-ordinary-income/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-accessible/120-being-rich-and-anonymous-or-respected-on-an-ordinary-income/prestudy/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/120-being-rich-and-anonymous-or-respected-on-an-ordinary-income/prestudy/index.html"}], "goal": {"t": "Let’s compare personal praise with public recognition, then explain how the person, audience, and consequences could change the choice. Please read the title aloud.", "ja": "個人的な褒め言葉と公の評価を比べ、誰から、どんな人の前で、何が起こるかによって選択がどう変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Whose praise means the most to you?", "ja": "誰から褒められるのが、あなたにとって最もうれしいですか？", "f": ["A friend, family member, teacher, or manager?", "What would you want them to notice?"]}, {"n": "WARM-UP 2", "t": "Would you enjoy being praised in front of a large group?", "ja": "大勢の前で褒められたら、うれしいですか？", "f": ["Would a smaller group feel better?", "What might make it uncomfortable?"]}, {"n": "QUESTION 1", "t": "Would you rather receive a thoughtful message from one person or a public award?", "ja": "一人から心のこもったメッセージをもらうのと、公の場で賞をもらうのと、どちらがよいですか？", "f": ["Which would you remember longer?", "Who would you want the message to come from?"]}, {"n": "QUESTION 2", "t": "What could public recognition help you do next?", "ja": "多くの人から評価されると、次にどんなことができそうですか？", "f": ["Could it open a new opportunity?", "Would it motivate you?"]}, {"n": "QUESTION 3", "t": "When can public praise feel uncomfortable?", "ja": "人前で褒められることが、居心地悪く感じられるのはどんなときですか？", "f": ["Is the attention or the expectation harder?", "Would private thanks feel better?"]}, {"n": "QUESTION 4", "t": "What kind of achievement deserves public recognition?", "ja": "どんな成果なら、公に評価されるべきだと思いますか？", "f": ["An individual success or a team success?", "Who should share the credit?"]}, {"n": "QUESTION 5", "t": "If recognition brought criticism too, would you still want it?", "ja": "評価と一緒に批判も集まるなら、それでも人に知られたいですか？", "f": ["How much criticism would be too much?", "Would it matter who criticized you?"]}, {"n": "QUESTION 6", "t": "What would make you switch to the other kind of praise?", "ja": "どんな条件なら、もう一方の褒められ方を選びますか？", "f": ["Would the size of the audience matter?", "Would the person giving the praise change your answer?"]}]}, {"n": 15, "title": "한 가지에 뛰어나기, 여러 가지를 잘하기?", "sub": "一つに秀でる、それとも多くをこなす？", "titles": {"ko": "한 가지에 뛰어나기, 여러 가지를 잘하기?", "en": "Being great at one thing or good at many?", "ja": "一つに秀でる、それとも多くをこなす？"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-balance-games-accessible/121-being-great-at-one-thing-or-good-at-many/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-accessible/121-being-great-at-one-thing-or-good-at-many/lecture/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/121-being-great-at-one-thing-or-good-at-many/lecture/index.html"}, {"href": "view/talk-balance-games-accessible/121-being-great-at-one-thing-or-good-at-many/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-accessible/121-being-great-at-one-thing-or-good-at-many/prestudy/index.html", "source": "courses/en/talk-balance-games-accessible/lessons/121-being-great-at-one-thing-or-good-at-many/prestudy/index.html"}], "goal": {"t": "Let's compare deep expertise in one skill and broad ability across many skills, then explain what could change your choice. Please read the title aloud.", "ja": "一つの技能の深い専門性と多くの技能にわたる幅広い能力を比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which skill, if any, have you improved recently?", "ja": "最近、上達した技能があるとしたら何ですか？", "f": ["What helped you improve?", "Which is easier to improve: cooking, exercise, or language?"]}, {"n": "WARM-UP 2", "t": "What’s one skill you would love to be great at?", "ja": "とても上手になりたい技能を一つ挙げるとしたら何ですか？", "f": ["Why that one?", "How often would you practise it?"]}, {"n": "QUESTION 1", "t": "Would you rather become excellent at one skill or good at many?", "ja": "一つの技能の深い専門性と、多くの技能にわたる幅広い能力のどちらを伸ばしたいですか？", "f": ["Which skill or group of skills do you imagine?", "What skill would you happily practise every week for a year?"]}, {"n": "QUESTION 2", "t": "With one year to learn, would you study one skill deeply or try five?", "ja": "学ぶ時間が一年あるなら、一つを深く学ぶのと五つを試すのと、どちらがよいですか？", "f": ["How would you measure progress?", "Would you rather practise daily or try something new each week?"]}, {"n": "QUESTION 3", "t": "On a small team, who helps more: a specialist or someone who can do several jobs?", "ja": "小さなチームでは、一人の専門家と、いくつもの仕事ができる人のどちらが役立ちますか？", "f": ["Why would that person help the team?", "Can a flexible worker help when a teammate is absent?"]}, {"n": "QUESTION 4", "t": "Which new skill would you rather learn: cooking, photography, or first aid?", "ja": "新しく学ぶなら、料理、写真、応急手当のどれがよいですか？", "f": ["Why would that skill be useful?", "Which is easiest to practise at home: cooking, photography, or first aid?"]}, {"n": "QUESTION 5", "t": "When would several good skills help more than being excellent at that one?", "ja": "その一つを極めるより、いくつかの技能が得意なほうが役立つのはどんなときですか？", "f": ["At home or at work?", "Where would a specialist still be better?"]}, {"n": "QUESTION 6", "t": "Which skill would you be happy to stay only average at?", "ja": "平均くらいのままでも構わない技能は何ですか？", "f": ["Why is “good enough” enough?", "Would you still enjoy learning it?"]}]}]}, {"no": 22, "label": "22코스", "title": "밸런스 게임", "titles": {"ko": "밸런스 게임", "en": "Balance games", "ja": "究極の二択"}, "subtitle": "(上級) 究極の二択", "desc": {"ko": "두 선택 중 하나를 빠르게 고르고, 구체적인 생활 장면과 조건 변화로 선택의 이유를 길게 설명한다.", "en": "Choose one of two fast, then justify it at length through concrete scenes and shifting conditions.", "ja": "二つのうち一つを素早く選び、具体的な生活の場面と条件の変化で、その理由を長く説明する。"}, "cover": "covers/talk-balance-games-full.webp", "levels": ["C1"], "level": "C1", "slug": "talk-balance-games-full", "lessons": [{"n": 1, "title": "직접 하기, 돈 내고 맡기기?", "sub": "自分でやる？お金を払って頼む？", "titles": {"ko": "직접 하기, 돈 내고 맡기기?", "en": "Do it yourself or pay someone?", "ja": "自分でやる？お金を払って頼む？"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-balance-games-full/107-more-money-or-more-time/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-full/107-more-money-or-more-time/lecture/index.html", "source": "courses/en/talk-balance-games-full/lessons/107-more-money-or-more-time/lecture/index.html"}, {"href": "view/talk-balance-games-full/107-more-money-or-more-time/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-full/107-more-money-or-more-time/prestudy/index.html", "source": "courses/en/talk-balance-games-full/lessons/107-more-money-or-more-time/prestudy/index.html"}], "goal": {"t": "Let’s compare doing a job yourself with paying someone to do it, then find the point where the better choice changes. Please read the title aloud.", "ja": "自分でする場合と、お金を払って人に頼む場合を比べ、どんな条件で選択が変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What’s one job at home you usually do yourself?", "ja": "家で普段、自分でする作業は何ですか？", "f": ["How did you learn to do it?", "Do you enjoy it?"]}, {"n": "WARM-UP 2", "t": "What’s one job you’d happily pay someone else to do?", "ja": "お金を払ってでも人に頼みたい作業は何ですか？", "f": ["What makes it difficult or annoying?", "How often does it need doing?"]}, {"n": "QUESTION 1", "t": "If some furniture arrived in a box, would you build it yourself or pay for help?", "ja": "組み立て式の家具が届いたら、自分で作りますか、それともお金を払って頼みますか？", "f": ["What tools or skills would you need?", "How much would you pay?"]}, {"n": "QUESTION 2", "t": "When is paying someone worth the time it saves?", "ja": "どんなときなら、時間を節約するために人へお金を払う価値がありますか？", "f": ["Would saving one hour be enough?", "What would you do with that time?"]}, {"n": "QUESTION 3", "t": "What’s something you learned because you didn’t want to pay for help?", "ja": "人に頼むお金を節約したくて、自分で覚えたことは何ですか？", "f": ["How long did it take to learn?", "Would you use that skill again?"]}, {"n": "QUESTION 4", "t": "Which job would you never try without a professional?", "ja": "専門家なしでは絶対にやらない作業は何ですか？", "f": ["Is safety or quality the bigger reason?", "Would you want to watch and learn?"]}, {"n": "QUESTION 5", "t": "If a friend offered free help, what would you still prefer to do yourself?", "ja": "友達が無料で手伝うと言っても、自分でやりたいことは何ですか？", "f": ["Why would you want control of it?", "What help would you accept?"]}, {"n": "QUESTION 6", "t": "If you suddenly earned more, what would you stop doing yourself first?", "ja": "収入が急に増えたら、最初に自分でやめる作業は何ですか？", "f": ["How often would you pay for it?", "What would you continue doing yourself?"]}]}, {"n": 2, "title": "친구 백 명, 가까운 친구 세 명?", "sub": "友人百人、それとも親しい友人三人？", "titles": {"ko": "친구 백 명, 가까운 친구 세 명?", "en": "A hundred friends or three close ones?", "ja": "友人百人、それとも親しい友人三人？"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-balance-games-full/108-a-hundred-friends-or-three-close-ones/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-full/108-a-hundred-friends-or-three-close-ones/lecture/index.html", "source": "courses/en/talk-balance-games-full/lessons/108-a-hundred-friends-or-three-close-ones/lecture/index.html"}, {"href": "view/talk-balance-games-full/108-a-hundred-friends-or-three-close-ones/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-full/108-a-hundred-friends-or-three-close-ones/prestudy/index.html", "source": "courses/en/talk-balance-games-full/lessons/108-a-hundred-friends-or-three-close-ones/prestudy/index.html"}], "goal": {"t": "Let's compare a hundred friends and three close friends, then explain what could change your choice. Please read the title aloud.", "ja": "百人の友人と三人の親しい友人を比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Who, if anyone, is easy for you to talk to for hours?", "ja": "何時間でも話しやすい相手がいるとしたら、誰ですか？", "f": ["What makes the conversation easy?", "Is it easier in person or on the phone?"]}, {"n": "WARM-UP 2", "t": "What makes it easy to meet new people?", "ja": "新しい人と知り合いやすくするものは何ですか？", "f": ["What opening question works well?", "Where is it easier to meet people: a class, a party, or online?"]}, {"n": "QUESTION 1", "t": "In a difficult week, would you rather have a hundred friendly contacts or three close friends?", "ja": "大変な一週間なら、顔見知りの友人百人と親しい友人三人のどちらがよいですか？", "f": ["What support would your choice give you?", "Who would help more in a crisis?"]}, {"n": "QUESTION 2", "t": "What would be missing if you knew many people but had no close friends?", "ja": "知り合いは多くても親しい友人がいないとしたら、何が足りませんか？", "f": ["Who would you call after a bad day?", "Would you rather share good news with one person or a large group?"]}, {"n": "QUESTION 3", "t": "When is a wide circle more useful than a few close friends?", "ja": "少数の親友より、広い人間関係のほうが役立つのはどんなときですか？", "f": ["What kind of support would a wide circle provide?", "Which helps more when job hunting: close friends or many contacts?"]}, {"n": "QUESTION 4", "t": "In a new city, would you build a wide circle or one close friendship first?", "ja": "新しい町へ移ったら、広い人間関係と一つの親しい友情のどちらを先に作りますか？", "f": ["How would you meet people?", "Where would you start: work, a class, or a hobby group?"]}, {"n": "QUESTION 5", "t": "Has a casual contact ever helped you find a job, a place, or useful information?", "ja": "それほど親しくない知り合いに、仕事や場所、役立つ情報を教えてもらったことはありますか？", "f": ["How did you know them?", "If not, which kind of contact might help?"]}, {"n": "QUESTION 6", "t": "Which kind of friendship is harder to maintain?", "ja": "どちらの友人関係を保つほうが難しいですか？", "f": ["What takes more time?", "Which one is easier to lose?"]}]}, {"n": 3, "title": "끝없는 여름, 끝없는 겨울?", "sub": "終わらない夏、それとも冬？", "titles": {"ko": "끝없는 여름, 끝없는 겨울?", "en": "Endless summer or endless winter?", "ja": "終わらない夏、それとも冬？"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-balance-games-full/109-endless-summer-or-endless-winter/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-full/109-endless-summer-or-endless-winter/lecture/index.html", "source": "courses/en/talk-balance-games-full/lessons/109-endless-summer-or-endless-winter/lecture/index.html"}, {"href": "view/talk-balance-games-full/109-endless-summer-or-endless-winter/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-full/109-endless-summer-or-endless-winter/prestudy/index.html", "source": "courses/en/talk-balance-games-full/lessons/109-endless-summer-or-endless-winter/prestudy/index.html"}], "goal": {"t": "Let's compare endless summer and endless winter, then explain what could change your choice. Please read the title aloud.", "ja": "終わらない夏と終わらない冬を比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which is harder for you: a very hot day or a very cold day?", "ja": "とても暑い日ととても寒い日のどちらが大変ですか？", "f": ["Does travel make that weather harder?", "Which bothers you more: strong sun or cold wind?"]}, {"n": "WARM-UP 2", "t": "How would you spend a full day outside in perfect weather?", "ja": "完璧な天気の日を丸一日外で過ごすなら、何をしますか？", "f": ["Which outdoor place would you visit?", "Would you choose a park, a beach, or a city walk?"]}, {"n": "QUESTION 1", "t": "If the same season continued all year, would you prefer permanent summer or permanent winter?", "ja": "同じ季節が一年中続くなら、終わらない夏と終わらない冬のどちらがよいですか？", "f": ["Which activity shapes your answer?", "Which would be harder all year: heat or short winter days?"]}, {"n": "QUESTION 2", "t": "Which daily habit would change most if summer never ended?", "ja": "夏が終わらなければ、どの日課が最も変わりますか？", "f": ["How would outdoor plans change?", "Which changes more with summer: sleep or clothing?"]}, {"n": "QUESTION 3", "t": "If every indoor space were comfortable, which season would you choose?", "ja": "すべての室内が快適なら、どの季節を選びますか？", "f": ["Would daylight still matter?", "Would you rather go outside in rain or snow?"]}, {"n": "QUESTION 4", "t": "Would you rather have a warm dark day or a cold sunny day?", "ja": "暖かく暗い日と、寒く晴れた日のどちらがよいですか？", "f": ["Does light affect your mood?", "Which helps your mood more: warmth or sunlight?"]}, {"n": "QUESTION 5", "t": "What's one weather condition you could not accept all year?", "ja": "一年中は受け入れられない天候を一つ挙げるとしたら何ですか？", "f": ["How long could you accept that weather?", "Which is harder to live with: humidity or ice?"]}, {"n": "QUESTION 6", "t": "Now the opposite: which season would you miss after a year without it?", "ja": "では反対に、一年間なかったら恋しくなる季節はどちらですか？", "f": ["What activity would you miss most?", "Would one short holiday in that season be enough?"]}]}, {"n": 4, "title": "아침형 인간, 올빼미형 인간?", "sub": "朝型、それとも夜型？", "titles": {"ko": "아침형 인간, 올빼미형 인간?", "en": "Morning person or night owl?", "ja": "朝型、それとも夜型？"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-balance-games-full/110-morning-person-or-night-owl/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-full/110-morning-person-or-night-owl/lecture/index.html", "source": "courses/en/talk-balance-games-full/lessons/110-morning-person-or-night-owl/lecture/index.html"}, {"href": "view/talk-balance-games-full/110-morning-person-or-night-owl/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-full/110-morning-person-or-night-owl/prestudy/index.html", "source": "courses/en/talk-balance-games-full/lessons/110-morning-person-or-night-owl/prestudy/index.html"}], "goal": {"t": "Let's compare a morning schedule and a night schedule, then explain what could change your choice. Please read the title aloud.", "ja": "朝型の生活と夜型の生活を比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What helps you feel awake in the morning?", "ja": "朝、目を覚ますのに何が役立ちますか？", "f": ["Light, coffee, food, or movement?", "How long does it take you to feel ready?"]}, {"n": "WARM-UP 2", "t": "When would you sleep and wake if tomorrow had no schedule?", "ja": "明日何も予定がなければ、何時に寝て起きますか？", "f": ["How much sleep would that give you?", "Would you sleep later on a completely free day?"]}, {"n": "QUESTION 1", "t": "For your most important tasks, would you rather start early or work late?", "ja": "大切な作業なら、朝早く始めるのと夜遅く取り組むのと、どちらがよいですか？", "f": ["When would you do your hardest work?", "Which time is quieter for you?"]}, {"n": "QUESTION 2", "t": "Which part of your routine is hardest to move earlier or later?", "ja": "日課の中で、時間を早めたり遅らせたりするのが最も難しいものは何ですか？", "f": ["Sleep, meals, or plans with other people?", "Why is it hard to move?"]}, {"n": "QUESTION 3", "t": "What rule helps two people with opposite sleep schedules share a home?", "ja": "睡眠時間が反対の二人が一緒に暮らすには、どんなルールが役立ちますか？", "f": ["When would the home need to be quiet?", "Would you set quiet hours at night or in the morning?"]}, {"n": "QUESTION 4", "t": "Would you stay up later if nothing required you to wake early?", "ja": "早起きする必要が何もなければ、もっと夜更かししますか？", "f": ["Could staying up late affect your health?", "Would you still wake early on weekends?"]}, {"n": "QUESTION 5", "t": "What has actually made you change your sleep schedule before?", "ja": "これまで実際に、何がきっかけで睡眠時間を変えましたか？", "f": ["A job, travel, or family responsibilities?", "Did the change last?"]}, {"n": "QUESTION 6", "t": "What do you enjoy about the time of day when you are usually less productive?", "ja": "普段あまり集中できない時間帯にも、好きなところはありますか？", "f": ["Is it quieter or more social?", "Would you want more of that time?"]}]}, {"n": 5, "title": "계획 여행, 즉흥 여행?", "sub": "計画的な旅、それとも気ままな旅？", "titles": {"ko": "계획 여행, 즉흥 여행?", "en": "A planned trip or a spontaneous one?", "ja": "計画的な旅、それとも気ままな旅？"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-balance-games-full/111-a-planned-trip-or-a-spontaneous-one/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-full/111-a-planned-trip-or-a-spontaneous-one/lecture/index.html", "source": "courses/en/talk-balance-games-full/lessons/111-a-planned-trip-or-a-spontaneous-one/lecture/index.html"}, {"href": "view/talk-balance-games-full/111-a-planned-trip-or-a-spontaneous-one/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-full/111-a-planned-trip-or-a-spontaneous-one/prestudy/index.html", "source": "courses/en/talk-balance-games-full/lessons/111-a-planned-trip-or-a-spontaneous-one/prestudy/index.html"}], "goal": {"t": "Let's compare a planned trip and a spontaneous trip, then explain what could change your choice. Please read the title aloud.", "ja": "計画的な旅行と行き当たりばったりの旅行を比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What kind of surprise can improve a trip?", "ja": "どんな予想外の出来事が、旅行をよくすることがありますか？", "f": ["When would the same surprise be stressful?", "Would unexpected rain ruin a trip or make it memorable?"]}, {"n": "WARM-UP 2", "t": "What would you decide first for a short trip tomorrow?", "ja": "明日短い旅行へ行くなら、最初に何を決めますか？", "f": ["What could stay open?", "Which would you book first: transport or a place to stay?"]}, {"n": "QUESTION 1", "t": "For a short trip, would you rather follow a plan or make decisions as you go?", "ja": "短い旅行なら、計画に従うのと、その場で決めるのと、どちらがよいですか？", "f": ["What would you leave undecided?", "Which is worse: missing a booking or missing a surprise?"]}, {"n": "QUESTION 2", "t": "What can go wrong when every minute of a trip is planned?", "ja": "旅行の一分一分まで計画すると、何がうまくいかなくなることがありますか？", "f": ["Which part of the plan would feel restrictive?", "Would you enjoy a trip with every meal booked?"]}, {"n": "QUESTION 3", "t": "Would one hotel booking make you feel prepared for a week-long trip?", "ja": "一週間の旅行で宿だけ予約してあれば、準備できたと感じますか？", "f": ["What would you do on the first day?", "Would you feel calmer with transport booked too?"]}, {"n": "QUESTION 4", "t": "What should people agree on before travelling together?", "ja": "一緒に旅行する前に、何について合意しておくべきですか？", "f": ["Money, timing, or accommodation?", "Where could people compromise?"]}, {"n": "QUESTION 5", "t": "What kind of trip needs a detailed plan?", "ja": "どんな旅行には詳しい計画が必要ですか？", "f": ["What could go wrong without a plan?", "Which needs more planning: a beach weekend or an international trip?"]}, {"n": "QUESTION 6", "t": "Now the opposite: what’s one part of a trip you would never plan?", "ja": "では反対に、旅行で絶対に計画を立てない部分は何ですか？", "f": ["Why is it better left open?", "Would a meal or an afternoon be easy to leave unplanned?"]}]}, {"n": 6, "title": "혼자 여행, 함께 여행?", "sub": "一人旅、それとも誰かと一緒？", "titles": {"ko": "혼자 여행, 함께 여행?", "en": "Travelling alone or with other people?", "ja": "一人旅、それとも誰かと一緒？"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-balance-games-full/112-travelling-alone-or-with-other-people/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-full/112-travelling-alone-or-with-other-people/lecture/index.html", "source": "courses/en/talk-balance-games-full/lessons/112-travelling-alone-or-with-other-people/lecture/index.html"}, {"href": "view/talk-balance-games-full/112-travelling-alone-or-with-other-people/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-full/112-travelling-alone-or-with-other-people/prestudy/index.html", "source": "courses/en/talk-balance-games-full/lessons/112-travelling-alone-or-with-other-people/prestudy/index.html"}], "goal": {"t": "Let's compare travelling alone and travelling with other people, then explain what could change your choice. Please read the title aloud.", "ja": "一人で旅行することとほかの人と旅行することを比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's the best part of travelling alone?", "ja": "一人旅の最もよいところは何ですか？", "f": ["Which freedom matters most?", "Would you enjoy one day alone in a new city?"]}, {"n": "WARM-UP 2", "t": "Would a beautiful view feel better alone or shared with someone?", "ja": "すてきな景色は、一人で見るのと誰かと共有するのと、どちらがよく感じられますか？", "f": ["What is good about your choice?", "Would you send someone a photo right away?"]}, {"n": "QUESTION 1", "t": "When visiting somewhere new, would you rather travel alone or with someone?", "ja": "初めての場所を訪れるなら、一人で行くのと誰かと行くのと、どちらがよいですか？", "f": ["What would be easier alone?", "When would company help?"]}, {"n": "QUESTION 2", "t": "What's the hardest part of travelling with other people?", "ja": "ほかの人と旅行する一番難しいところは何ですか？", "f": ["What could companions agree on before leaving?", "Which causes more conflict: money, food, or timing?"]}, {"n": "QUESTION 3", "t": "What would make three days alone somewhere new enjoyable?", "ja": "初めての場所で一人で過ごす三日間を、楽しくするものは何ですか？", "f": ["When might company still help?", "Would knowing the local language make solo travel easier?"]}, {"n": "QUESTION 4", "t": "How would a companion who planned everything change a trip?", "ja": "すべてを計画する同行者がいると、旅行はどう変わりますか？", "f": ["What would you still decide yourself?", "Would you let a close friend plan the whole weekend?"]}, {"n": "QUESTION 5", "t": "What kind of destination is better with company?", "ja": "どんな旅先なら、誰かと一緒のほうがよいですか？", "f": ["What makes company useful there?", "Which feels safer with company: a city or a remote area?"]}, {"n": "QUESTION 6", "t": "Now the opposite: what part of a trip would you rather not share with anyone?", "ja": "では反対に、旅行のどんな時間は誰とも共有せずに過ごしたいですか？", "f": ["One meal or one afternoon?", "Why would that time alone help?"]}]}, {"n": 7, "title": "도시 생활, 시골 생활?", "sub": "都会暮らし、それとも田舎暮らし？", "titles": {"ko": "도시 생활, 시골 생활?", "en": "Life in the city or the countryside?", "ja": "都会暮らし、それとも田舎暮らし？"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-balance-games-full/113-life-in-the-city-or-the-countryside/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-full/113-life-in-the-city-or-the-countryside/lecture/index.html", "source": "courses/en/talk-balance-games-full/lessons/113-life-in-the-city-or-the-countryside/lecture/index.html"}, {"href": "view/talk-balance-games-full/113-life-in-the-city-or-the-countryside/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-full/113-life-in-the-city-or-the-countryside/prestudy/index.html", "source": "courses/en/talk-balance-games-full/lessons/113-life-in-the-city-or-the-countryside/prestudy/index.html"}], "goal": {"t": "Let's compare city life and country life, then explain what could change your choice. Please read the title aloud.", "ja": "都会の生活と田舎の生活を比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What is the most important thing to have within walking distance of your home?", "ja": "家から歩いて行ける範囲にあると最も大切なものは何ですか？", "f": ["How often would you use it?", "Would a ten-minute walk feel close enough?"]}, {"n": "WARM-UP 2", "t": "What would be the perfect view from your window?", "ja": "窓からどんな景色が見えたら理想的ですか？", "f": ["Would you accept a longer commute for that view?", "Would you rather see trees or city lights?"]}, {"n": "QUESTION 1", "t": "For daily life, would you rather live in a busy city or a quiet town?", "ja": "日常生活なら、にぎやかな都会と静かな町のどちらに住みたいですか？", "f": ["What would you use most in your chosen place?", "Which would you miss more: quiet or convenience?"]}, {"n": "QUESTION 2", "t": "What would you miss first after moving from a city to a quiet town?", "ja": "都会から静かな町へ移ったら、最初に何が恋しくなりますか？", "f": ["Which daily routine would become harder?", "Shopping, transport, or seeing friends?"]}, {"n": "QUESTION 3", "t": "What advantages does living in the countryside have over living in a city?", "ja": "都会で暮らす場合と比べて、田舎暮らしにはどんなよさがありますか？", "f": ["Would you live in the countryside if you had your dream job there?", "Do you think most people prefer living in big cities or small towns?"]}, {"n": "QUESTION 4", "t": "How far would you be willing to travel to a hospital, supermarket, or station?", "ja": "病院、スーパー、駅までなら、どのくらい遠くても受け入れられますか？", "f": ["Which one must be closest?", "Would a beautiful home change your limit?"]}, {"n": "QUESTION 5", "t": "For everyday life, which matters more: nearby services or a quiet home?", "ja": "日常生活では、近くの便利なサービスと静かな家のどちらが大切ですか？", "f": ["Which service would you want nearby?", "Would you accept more noise to live near a station?"]}, {"n": "QUESTION 6", "t": "If you had enough money to live anywhere in the world, where would you choose to live, and why?", "ja": "世界のどこにでも住めるだけのお金があるとしたら、どこを選び、その理由は何ですか？", "f": ["Would you want to live there forever, or just for a few years?", "What would you miss about your current home?"]}]}, {"n": 8, "title": "인터넷 없는 여름, 에어컨 없는 여름?", "sub": "ネットなしの夏、それともエアコンなし？", "titles": {"ko": "인터넷 없는 여름, 에어컨 없는 여름?", "en": "A summer without internet or air conditioning?", "ja": "ネットなしの夏、それともエアコンなし？"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-balance-games-full/114-a-summer-without-internet-or-air-conditioning/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-full/114-a-summer-without-internet-or-air-conditioning/lecture/index.html", "
