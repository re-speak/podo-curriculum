owing or taking off your shoes?"]}, {"n": "QUESTION 4", "t": "Which custom from another culture would fit easily into your life?", "ja": "ほかの文化の習慣で、自分の生活に無理なく取り入れられそうなものは何ですか？", "f": ["What would make it easy to keep doing?", "Would you rather try another culture's food, celebration, or daily habit?"]}, {"n": "QUESTION 5", "t": "Which cultural difference would take you the longest to get used to?", "ja": "あなたにとって、慣れるまでに最も時間がかかりそうな文化の違いは何ですか？", "f": ["Which part would challenge your normal routine?", "Which adjustment is usually hardest: food, language, or daily routines?"]}, {"n": "QUESTION 6", "t": "What everyday Japanese habit would you miss if you lived abroad?", "ja": "海外で暮らしたら恋しくなりそうな、日本の日常の習慣は何ですか？", "f": ["When would you notice its absence?", "Could you recreate it there?"]}]}, {"n": 2, "title": "새로운 나라에 도착한 첫 한 시간", "sub": "初めての国に着いた最初の1時間", "titles": {"ko": "새로운 나라에 도착한 첫 한 시간", "en": "The first hour in a new country", "ja": "初めての国に着いた最初の1時間"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-between-two-countries-accessible/02-what-people-get-wrong-about-japan/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-between-two-countries-accessible/02-what-people-get-wrong-about-japan/lecture/index.html", "source": "courses/en/talk-between-two-countries-accessible/lessons/02-what-people-get-wrong-about-japan/lecture/index.html"}, {"href": "view/talk-between-two-countries-accessible/02-what-people-get-wrong-about-japan/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-between-two-countries-accessible/02-what-people-get-wrong-about-japan/prestudy/index.html", "source": "courses/en/talk-between-two-countries-accessible/lessons/02-what-people-get-wrong-about-japan/prestudy/index.html"}], "goal": {"t": "Let's talk about the choices and surprises in the first hour after arriving somewhere new. Please read the title aloud.", "ja": "初めての場所に着いたあとの1時間にある選択や驚きについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "When you arrive in a new country, what do you notice first?", "ja": "初めての国に着いたとき、最初に何に気づきますか？", "f": ["Do you notice people, sounds, or signs first?", "What did you notice on your last trip?"]}, {"n": "WARM-UP 2", "t": "What's the first thing you want to eat or drink after a long trip?", "ja": "長旅のあと、最初に何を食べたり飲んだりしたいですか？", "f": ["Do you want something familiar or local?", "Where would you look for it?"]}, {"n": "QUESTION 1", "t": "What's the first local phrase you try to learn?", "ja": "現地の言葉で最初に覚えたいひと言は何ですか？", "f": ["When would you use it?", "Would you practice it before arriving?"]}, {"n": "QUESTION 2", "t": "Which part of arriving feels most confusing: signs, transport, or money?", "ja": "到着したとき、標識、交通、お金のどれがいちばん分かりにくいですか？", "f": ["What information would help?", "Who would you ask?"]}, {"n": "QUESTION 3", "t": "What small thing helps you relax after arriving?", "ja": "到着後、どんな小さなことでほっとできますか？", "f": ["Does contacting someone help?", "Do you unpack or go out first?"]}, {"n": "QUESTION 4", "t": "Who would you ask first if you needed help?", "ja": "助けが必要なら、最初に誰に聞きますか？", "f": ["What would make someone approachable?", "Would you use a translation app first?"]}, {"n": "QUESTION 5", "t": "What might surprise a visitor during their first hour in Japan?", "ja": "日本に着いて最初の1時間で、外国人が驚きそうなことは何ですか？", "f": ["Where would they notice it?", "What would you explain?"]}, {"n": "QUESTION 6", "t": "If I arrived in your town tonight, what should I do first?", "ja": "今夜私があなたの町に着いたら、最初に何をするといいですか？", "f": ["Where should I go?", "What should I avoid doing?"]}]}, {"n": 3, "title": "모두가 먹어 봐야 할 일본 음식", "sub": "みんなに食べてほしい日本の料理", "titles": {"ko": "모두가 먹어 봐야 할 일본 음식", "en": "A Japanese food everyone should try", "ja": "みんなに食べてほしい日本の料理"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-between-two-countries-accessible/03-a-japanese-food-everyone-should-try/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-between-two-countries-accessible/03-a-japanese-food-everyone-should-try/lecture/index.html", "source": "courses/en/talk-between-two-countries-accessible/lessons/03-a-japanese-food-everyone-should-try/lecture/index.html"}, {"href": "view/talk-between-two-countries-accessible/03-a-japanese-food-everyone-should-try/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-between-two-countries-accessible/03-a-japanese-food-everyone-should-try/prestudy/index.html", "source": "courses/en/talk-between-two-countries-accessible/lessons/03-a-japanese-food-everyone-should-try/prestudy/index.html"}], "goal": {"t": "Let's choose one Japanese food and make me want to try it. Please read the title aloud.", "ja": "日本の料理を一つ選び、食べてみたくなるように話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's the best thing you've eaten recently?", "ja": "最近食べた中で、いちばんおいしかったものは何ですか？", "f": ["Where did you eat it?", "Would you order it again?"]}, {"n": "WARM-UP 2", "t": "Think of a Japanese dish you love. How would you describe the taste?", "ja": "好きな日本料理を一つ思い浮かべてください。味をどう説明しますか？", "f": ["Which flavor do you notice first?", "Who might not enjoy it?"]}, {"n": "QUESTION 1", "t": "If I came to Japan, what food would you recommend I try first?", "ja": "私が日本に来たら、まずどんな食べ物をすすめますか？", "f": ["Why that food?", "Is there a particular restaurant or place where I should try it?"]}, {"n": "QUESTION 2", "t": "Are there any Japanese foods people usually eat in certain seasons?", "ja": "特定の季節によく食べる日本の食べ物はありますか？", "f": ["Are certain foods connected with certain kinds of weather? Why?", "What memories do you have of that food?"]}, {"n": "QUESTION 3", "t": "Which Japanese food do you most enjoy sharing with other people?", "ja": "人と一緒に食べるのがいちばん楽しい日本食は何ですか？", "f": ["Who do you usually share it with?", "What occasion suits it?"]}, {"n": "QUESTION 4", "t": "If you opened your own restaurant, what kind of food would you serve?", "ja": "自分のレストランを開くなら、どんな料理を出しますか？", "f": ["Why that kind of food?", "Are there any drinks or side dishes that would go well with it?"]}, {"n": "QUESTION 5", "t": "Is there a food from another country that you haven't tried but would like to?", "ja": "まだ食べたことはないけれど、食べてみたい外国の料理はありますか？", "f": ["Where did you hear about it?", "Have you seen it anywhere in Japan?"]}, {"n": "QUESTION 6", "t": "Are there any foods you don't like?", "ja": "苦手な食べ物はありますか？", "f": ["What don't you like about it?", "Do your friends agree with you?"]}]}, {"n": 4, "title": "나라마다 다른 식사 예절", "sub": "国によって違う食事のマナー", "titles": {"ko": "나라마다 다른 식사 예절", "en": "A table manner that differs between countries", "ja": "国によって違う食事のマナー"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-between-two-countries-accessible/04-a-table-manner-that-differs/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-between-two-countries-accessible/04-a-table-manner-that-differs/lecture/index.html", "source": "courses/en/talk-between-two-countries-accessible/lessons/04-a-table-manner-that-differs/lecture/index.html"}, {"href": "view/talk-between-two-countries-accessible/04-a-table-manner-that-differs/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-between-two-countries-accessible/04-a-table-manner-that-differs/prestudy/index.html", "source": "courses/en/talk-between-two-countries-accessible/lessons/04-a-table-manner-that-differs/prestudy/index.html"}], "goal": {"t": "Let's compare one table habit and the meaning people give it. Please read the title aloud.", "ja": "食卓での習慣を一つ比べ、その意味について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Who did you last eat a meal with?", "ja": "最近、誰と食事をしましたか？", "f": ["Where were you?", "What did you eat?"]}, {"n": "WARM-UP 2", "t": "What do you always do at the table without thinking about it?", "ja": "食卓で、何も考えずにいつもしていることは何ですか？", "f": ["Do you say anything before you start?", "What do you do with your bowl or your hands?"]}, {"n": "QUESTION 1", "t": "What do you do at the table that feels completely normal to you?", "ja": "食卓で、自分にとってはまったく普通だと感じることは何ですか？", "f": ["Who taught you that?", "Do your friends do it too?"]}, {"n": "QUESTION 2", "t": "In your family, who starts eating first?", "ja": "あなたの家では、誰が最初に食べ始めますか？", "f": ["What do you say before eating?", "Is it different in a restaurant?"]}, {"n": "QUESTION 3", "t": "What's one table habit you've noticed in another country?", "ja": "ほかの国の食事で、気づいた習慣を一つ挙げるとしたら何ですか？", "f": ["Did you notice it in person or online?", "Would it feel natural in Japan?"]}, {"n": "QUESTION 4", "t": "Do you eat differently at home and in a restaurant?", "ja": "家と店では、食べ方が変わりますか？", "f": ["Which one is more relaxed?", "What exactly changes?"]}, {"n": "QUESTION 5", "t": "Who taught you your table manners?", "ja": "食事のマナーは、誰に教わりましたか？", "f": ["Were they strict about it?", "Do you still follow all of it?"]}, {"n": "QUESTION 6", "t": "Now the opposite — is there a table rule you were taught but don't follow?", "ja": "逆に、教わったけれど守っていない食事のルールはありますか？", "f": ["When did you stop?", "Would you follow it in front of your family?"]}]}, {"n": 5, "title": "여행자에게 보여 주고 싶은 장소", "sub": "旅行者に案内したい場所", "titles": {"ko": "여행자에게 보여 주고 싶은 장소", "en": "A place you would show a visitor", "ja": "旅行者に案内したい場所"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-between-two-countries-accessible/05-a-place-you-would-show-a-visitor/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-between-two-countries-accessible/05-a-place-you-would-show-a-visitor/lecture/index.html", "source": "courses/en/talk-between-two-countries-accessible/lessons/05-a-place-you-would-show-a-visitor/lecture/index.html"}, {"href": "view/talk-between-two-countries-accessible/05-a-place-you-would-show-a-visitor/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-between-two-countries-accessible/05-a-place-you-would-show-a-visitor/prestudy/index.html", "source": "courses/en/talk-between-two-countries-accessible/lessons/05-a-place-you-would-show-a-visitor/prestudy/index.html"}], "goal": {"t": "Let's plan one day somewhere meaningful, away from the famous sights. Please read the title aloud.", "ja": "有名な観光地ではない、大切な場所での一日を考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "If I visited Japan for one day, where would you take me besides the famous places?", "ja": "私が一日だけ日本を訪れたら、有名な場所以外のどこへ連れて行きますか？", "f": ["What side of Japan would the place show?", "Would you plan food, nature, or shopping first?"]}, {"n": "WARM-UP 2", "t": "What makes a local place better than a famous tourist spot?", "ja": "地元の場所が有名な観光地よりよいのは、どんなところですか？", "f": ["Which ordinary detail makes it meaningful?", "When is the famous place still worth choosing?"]}, {"n": "QUESTION 1", "t": "Where would you take a visitor who likes quiet places?", "ja": "静かな場所が好きな旅行者を、どこへ連れて行きますか？", "f": ["What would make the place memorable?", "Would they enjoy a park, a café, or a temple most?"]}, {"n": "QUESTION 2", "t": "What place shows everyday life in your area?", "ja": "あなたの地域の日常生活が見える場所はどこですか？", "f": ["Which routine would be easiest to see?", "Where is daily life easiest to see: a station, a market, or a park?"]}, {"n": "QUESTION 3", "t": "When is the best time to see a familiar place?", "ja": "身近な場所を見るのにいちばんよい時間はいつですか？", "f": ["How do the people, sounds, or light change?", "Do you prefer familiar places in the morning or at night?"]}, {"n": "QUESTION 4", "t": "Which local place would you show a food lover?", "ja": "食べ物が好きな人に、地元のどこを案内しますか？", "f": ["What does the place show about local food?", "Would a food lover prefer a market or a restaurant?"]}, {"n": "QUESTION 5", "t": "What do guidebooks often fail to explain about local places?", "ja": "ガイドブックは、地元の場所について何を説明できていないことが多いですか？", "f": ["Why is that hard to explain?", "Do guidebooks miss local routines or local stories more often?"]}, {"n": "QUESTION 6", "t": "What kind of place would you want me to show you in my country?", "ja": "私の国では、どんな場所を案内してほしいですか？", "f": ["Would you prefer daily life or a special place?", "Would you rather explore one area or move around?"]}]}, {"n": 6, "title": "깔끔하게 번역되지 않는 말", "sub": "ぴったり訳せない言葉", "titles": {"ko": "깔끔하게 번역되지 않는 말", "en": "A word that doesn't translate neatly", "ja": "ぴったり訳せない言葉"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-between-two-countries-accessible/06-a-word-that-doesnt-translate-neatly/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-between-two-countries-accessible/06-a-word-that-doesnt-translate-neatly/lecture/index.html", "source": "courses/en/talk-between-two-countries-accessible/lessons/06-a-word-that-doesnt-translate-neatly/lecture/index.html"}, {"href": "view/talk-between-two-countries-accessible/06-a-word-that-doesnt-translate-neatly/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-between-two-countries-accessible/06-a-word-that-doesnt-translate-neatly/prestudy/index.html", "source": "courses/en/talk-between-two-countries-accessible/lessons/06-a-word-that-doesnt-translate-neatly/prestudy/index.html"}], "goal": {"t": "Let's explore a word whose meaning or feeling changes in translation. Please read the title aloud.", "ja": "訳すと意味や感覚が変わる言葉について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which English word would you like to understand better?", "ja": "もっとよく理解したい英単語は何ですか？", "f": ["Which use of the word confuses you?", "Do new words stick better from songs, shows, or conversations?"]}, {"n": "WARM-UP 2", "t": "Which is harder to translate: a joke, a feeling, or a polite phrase?", "ja": "冗談、気持ち、丁寧な表現の中で、いちばん訳しにくいのはどれですか？", "f": ["Which part depends on the situation?", "Which is easier to translate: facts or feelings?"]}, {"n": "QUESTION 1", "t": "What's a useful Japanese expression that's hard to say in English?", "ja": "英語では言いにくい、便利な日本語の表現は何ですか？", "f": ["When do you use it?", "What does a direct translation miss?"]}, {"n": "QUESTION 2", "t": "Which Japanese word needs a full English sentence to explain?", "ja": "英語では一文使わないと説明しにくい日本語は何ですか？", "f": ["When does the word feel natural?", "Which is harder to explain in English: a food name or a feeling?"]}, {"n": "QUESTION 3", "t": "What's a translation that sounded funny or wrong to you?", "ja": "面白く聞こえたり、不自然に聞こえたりした翻訳は何ですか？", "f": ["Where did you see or hear it?", "What do you think it was meant to say?"]}, {"n": "QUESTION 4", "t": "What's a word you use differently with friends and at work?", "ja": "友人に対してと職場で、使い方が変わる言葉は何ですか？", "f": ["How does it change?", "Which version feels more natural to you?"]}, {"n": "QUESTION 5", "t": "What kind of translation mistake can make a serious scene funny?", "ja": "どんな翻訳ミスで、真面目な場面が面白くなってしまいますか？", "f": ["Can a word-for-word translation cause it?", "Have subtitles ever made you laugh?"]}, {"n": "QUESTION 6", "t": "Which matters more in translation: exact meaning or the same feeling?", "ja": "翻訳では、正確な意味と同じ感覚のどちらが大切ですか？", "f": ["What should a translator never lose?", "How could they keep both?"]}]}, {"n": 7, "title": "일본이 특히 잘하는 것", "sub": "日本がとくに得意なこと", "titles": {"ko": "일본이 특히 잘하는 것", "en": "Something Japan does especially well", "ja": "日本がとくに得意なこと"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-between-two-countries-accessible/07-japan-does-especially-well/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-between-two-countries-accessible/07-japan-does-especially-well/lecture/index.html", "source": "courses/en/talk-between-two-countries-accessible/lessons/07-japan-does-especially-well/lecture/index.html"}, {"href": "view/talk-between-two-countries-accessible/07-japan-does-especially-well/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-between-two-countries-accessible/07-japan-does-especially-well/prestudy/index.html", "source": "courses/en/talk-between-two-countries-accessible/lessons/07-japan-does-especially-well/prestudy/index.html"}], "goal": {"t": "Today, we'll choose one everyday service Japan does especially well and explain why. Please read the title aloud.", "ja": "今日は、日本が特に得意な日常サービスを一つ選び、その理由を話します。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Convenience stores, trains, taxis, or delivery—pick the one Japan does best.", "ja": "コンビニ、電車、タクシー、宅配の中で、日本が一番得意だと思うものを選んでください。", "f": ["Which strength makes it stand out?", "What weakness could change your choice?"]}, {"n": "WARM-UP 2", "t": "On a busy day, which Japanese service is most useful?", "ja": "忙しい日に、どの日本のサービスがいちばん役立ちますか？", "f": ["Which problem does it solve first?", "What detail makes the biggest difference?"]}, {"n": "QUESTION 1", "t": "When did a Japanese service last make your day easier?", "ja": "日本のサービスのおかげで最後に一日が楽になったのは、どんなときですか？", "f": ["What happened?", "Which small detail made it go smoothly?"]}, {"n": "QUESTION 2", "t": "Which Japanese service helps visitors the most?", "ja": "旅行者にいちばん役立つ日本のサービスは何ですか？", "f": ["Which situation makes it especially valuable?", "What might still confuse a first-time user?"]}, {"n": "QUESTION 3", "t": "What everyday service does another country do better than Japan?", "ja": "日常のサービスで、ほかの国のほうが日本より上手にしているものは何ですか？", "f": ["What do they do differently?", "Which matters more in a service: speed or friendliness?"]}, {"n": "QUESTION 4", "t": "What everyday service would you miss most while living abroad?", "ja": "海外で暮らすなら、どんな日常のサービスがいちばん恋しくなりそうですか？", "f": ["Which routine would change first?", "Which is harder to replace: trains or convenience stores?"]}, {"n": "QUESTION 5", "t": "Which Japanese service may get a little too much praise?", "ja": "日本のサービスの中で、少しほめられすぎているものはどれですか？", "f": ["What problem do people overlook?", "Which matters more: good reviews or your own experience?"]}, {"n": "QUESTION 6", "t": "What one change would improve trains, taxis, convenience stores, or delivery?", "ja": "電車、タクシー、コンビニ、宅配のどれかをよくするなら、何を一つ変えますか？", "f": ["Who would gain the most from the change?", "Which new cost or difficulty might appear?"]}]}, {"n": 8, "title": "새해 첫날을 보내는 방법", "sub": "元日の過ごし方", "titles": {"ko": "새해 첫날을 보내는 방법", "en": "How you spend New Year's Day", "ja": "元日の過ごし方"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-between-two-countries-accessible/08-how-you-spend-new-years-day/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-between-two-countries-accessible/08-how-you-spend-new-years-day/lecture/index.html", "source": "courses/en/talk-between-two-countries-accessible/lessons/08-how-you-spend-new-years-day/lecture/index.html"}, {"href": "view/talk-between-two-countries-accessible/08-how-you-spend-new-years-day/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-between-two-countries-accessible/08-how-you-spend-new-years-day/prestudy/index.html", "source": "courses/en/talk-between-two-countries-accessible/lessons/08-how-you-spend-new-years-day/prestudy/index.html"}], "goal": {"t": "Let's compare what New Year's Day really looks like in our lives. Please read the title aloud.", "ja": "実際の元日の過ごし方を比べましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What do you actually do on New Year's Day?", "ja": "元日は実際に何をしますか？", "f": ["Which part feels most different from a normal day?", "Would you rather rest at home or go out on New Year's Day?"]}, {"n": "WARM-UP 2", "t": "Which part of New Year's Day do you look forward to most?", "ja": "元日のどの時間をいちばん楽しみにしていますか？", "f": ["Which feeling or person makes it important?", "Has that favorite part changed over time?"]}, {"n": "QUESTION 1", "t": "What do you most like eating on New Year's Day?", "ja": "元日にいちばん食べたいものは何ですか？", "f": ["Who do you usually eat it with?", "Do you eat it at any other time?"]}, {"n": "QUESTION 2", "t": "What's the first thing you usually do on New Year's morning?", "ja": "元日の朝、ふつう最初に何をしますか？", "f": ["Has that changed over time?", "What happens if you sleep late?"]}, {"n": "QUESTION 3", "t": "What's one New Year's tradition your family does differently now?", "ja": "家族の新年の習慣で、以前とやり方が変わったものは何ですか？", "f": ["What caused the change?", "Do you miss the old way?"]}, {"n": "QUESTION 4", "t": "Would you rather spend New Year's Day at home or away?", "ja": "元日は家で過ごしたいですか、それとも出かけたいですか？", "f": ["What would the ideal day look like?", "What could make you choose the other option?"]}, {"n": "QUESTION 5", "t": "Which New Year's custom takes too much time?", "ja": "時間がかかりすぎる新年の習慣は何ですか？", "f": ["Which part should remain?", "Which takes more time: cooking, visiting family, or traveling?"]}, {"n": "QUESTION 6", "t": "What would you most like to ask someone from another country about New Year's Day?", "ja": "ほかの国の人に、その国の元日について何をいちばん聞きたいですか？", "f": ["Which answer might surprise you?", "What would you tell them about Japan in return?"]}]}]}, {"no": 2, "label": "2코스", "title": "두 나라 사이", "titles": {"ko": "두 나라 사이", "en": "Two countries", "ja": "ふたつの国"}, "subtitle": "(上級) ふたつの国", "desc": {"ko": "다른 나라에서 놀란 점을 설명하고, 일본에 온 사람은 무엇에 놀랄지 말한다.", "en": "Explain what surprised you about another country, and what would surprise a visitor to Japan.", "ja": "他の国について驚いたことを説明し、日本に来た人が何に驚くかを話す。"}, "cover": "covers/talk-between-two-countries-full.webp", "levels": ["C1"], "level": "C1", "slug": "talk-between-two-countries-full", "lessons": [{"n": 1, "title": "다른 나라 문화에서 놀란 것", "sub": "他の国の文化で驚いたこと", "titles": {"ko": "다른 나라 문화에서 놀란 것", "en": "Something that surprised you about another culture", "ja": "他の国の文化で驚いたこと"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-between-two-countries-full/01-this-surprised-me/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-between-two-countries-full/01-this-surprised-me/lecture/index.html", "source": "courses/en/talk-between-two-countries-full/lessons/01-this-surprised-me/lecture/index.html"}, {"href": "view/talk-between-two-countries-full/01-this-surprised-me/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-between-two-countries-full/01-this-surprised-me/prestudy/index.html", "source": "courses/en/talk-between-two-countries-full/lessons/01-this-surprised-me/prestudy/index.html"}], "goal": {"t": "Today, we'll talk about something that surprised you about another culture. Please read the title aloud.", "ja": "今日は、異文化について驚いたことを話します。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one thing about another country that genuinely surprised you?", "ja": "ほかの国について、本当に驚いたことを一つ挙げるとしたら何ですか？", "f": ["Did you notice it in person, online, or somewhere else?", "Which kinds of cultural differences are easiest to notice?"]}, {"n": "WARM-UP 2", "t": "What's one small everyday difference between cultures that you find interesting?", "ja": "文化による日常の小さな違いで、面白いと感じるものは何ですか？", "f": ["Why does it stand out to you?", "Where do you notice cultural differences most: food, manners, or daily life?"]}, {"n": "QUESTION 1", "t": "What do visitors often photograph in Japan that locals barely notice?", "ja": "日本を訪れた人がよく写真を撮る一方で、日本人はあまり気に留めないものは何ですか？", "f": ["Where do they usually see it?", "Why does it stand out to visitors?"]}, {"n": "QUESTION 2", "t": "Which country would you most like to visit to see what everyday life is really like?", "ja": "実際の日常生活を見るために、最も訪れてみたい国はどこですか？", "f": ["Which part of ordinary life would you want to see?", "Would you rather learn about a place through a local person, a documentary, or a book?"]}, {"n": "QUESTION 3", "t": "Which Japanese custom would be easiest for a visitor to misunderstand?", "ja": "日本の習慣の中で、訪れた人が最も誤解しやすそうなものは何ですか？", "f": ["What might they assume?", "Which is easier to explain: bowing or taking off your shoes?"]}, {"n": "QUESTION 4", "t": "Which custom from another culture would fit easily into your life?", "ja": "ほかの文化の習慣で、自分の生活に無理なく取り入れられそうなものは何ですか？", "f": ["What would make it easy to keep doing?", "Would you rather try another culture's food, celebration, or daily habit?"]}, {"n": "QUESTION 5", "t": "Which cultural difference would take you the longest to get used to?", "ja": "あなたにとって、慣れるまでに最も時間がかかりそうな文化の違いは何ですか？", "f": ["Which part would challenge your normal routine?", "Which adjustment is usually hardest: food, language, or daily routines?"]}, {"n": "QUESTION 6", "t": "What everyday Japanese habit would you miss if you lived abroad?", "ja": "海外で暮らしたら恋しくなりそうな、日本の日常の習慣は何ですか？", "f": ["When would you notice its absence?", "Could you recreate it there?"]}]}, {"n": 2, "title": "새로운 나라에 도착한 첫 한 시간", "sub": "初めての国に着いた最初の1時間", "titles": {"ko": "새로운 나라에 도착한 첫 한 시간", "en": "The first hour in a new country", "ja": "初めての国に着いた最初の1時間"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-between-two-countries-full/02-what-people-get-wrong-about-japan/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-between-two-countries-full/02-what-people-get-wrong-about-japan/lecture/index.html", "source": "courses/en/talk-between-two-countries-full/lessons/02-what-people-get-wrong-about-japan/lecture/index.html"}, {"href": "view/talk-between-two-countries-full/02-what-people-get-wrong-about-japan/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-between-two-countries-full/02-what-people-get-wrong-about-japan/prestudy/index.html", "source": "courses/en/talk-between-two-countries-full/lessons/02-what-people-get-wrong-about-japan/prestudy/index.html"}], "goal": {"t": "Let's talk about the choices and surprises in the first hour after arriving somewhere new. Please read the title aloud.", "ja": "初めての場所に着いたあとの1時間にある選択や驚きについて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "When you arrive in a new country, what do you notice first?", "ja": "初めての国に着いたとき、最初に何に気づきますか？", "f": ["Do you notice people, sounds, or signs first?", "What did you notice on your last trip?"]}, {"n": "WARM-UP 2", "t": "What's the first thing you want to eat or drink after a long trip?", "ja": "長旅のあと、最初に何を食べたり飲んだりしたいですか？", "f": ["Do you want something familiar or local?", "Where would you look for it?"]}, {"n": "QUESTION 1", "t": "What's the first local phrase you try to learn?", "ja": "現地の言葉で最初に覚えたいひと言は何ですか？", "f": ["When would you use it?", "Would you practice it before arriving?"]}, {"n": "QUESTION 2", "t": "Which part of arriving feels most confusing: signs, transport, or money?", "ja": "到着したとき、標識、交通、お金のどれがいちばん分かりにくいですか？", "f": ["What information would help?", "Who would you ask?"]}, {"n": "QUESTION 3", "t": "What small thing helps you relax after arriving?", "ja": "到着後、どんな小さなことでほっとできますか？", "f": ["Does contacting someone help?", "Do you unpack or go out first?"]}, {"n": "QUESTION 4", "t": "Who would you ask first if you needed help?", "ja": "助けが必要なら、最初に誰に聞きますか？", "f": ["What would make someone approachable?", "Would you use a translation app first?"]}, {"n": "QUESTION 5", "t": "What might surprise a visitor during their first hour in Japan?", "ja": "日本に着いて最初の1時間で、外国人が驚きそうなことは何ですか？", "f": ["Where would they notice it?", "What would you explain?"]}, {"n": "QUESTION 6", "t": "If I arrived in your town tonight, what should I do first?", "ja": "今夜私があなたの町に着いたら、最初に何をするといいですか？", "f": ["Where should I go?", "What should I avoid doing?"]}]}, {"n": 3, "title": "모두가 먹어 봐야 할 일본 음식", "sub": "みんなに食べてほしい日本の料理", "titles": {"ko": "모두가 먹어 봐야 할 일본 음식", "en": "A Japanese food everyone should try", "ja": "みんなに食べてほしい日本の料理"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-between-two-countries-full/03-a-japanese-food-everyone-should-try/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-between-two-countries-full/03-a-japanese-food-everyone-should-try/lecture/index.html", "source": "courses/en/talk-between-two-countries-full/lessons/03-a-japanese-food-everyone-should-try/lecture/index.html"}, {"href": "view/talk-between-two-countries-full/03-a-japanese-food-everyone-should-try/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-between-two-countries-full/03-a-japanese-food-everyone-should-try/prestudy/index.html", "source": "courses/en/talk-between-two-countries-full/lessons/03-a-japanese-food-everyone-should-try/prestudy/index.html"}], "goal": {"t": "Let's choose one Japanese food and make me want to try it. Please read the title aloud.", "ja": "日本の料理を一つ選び、食べてみたくなるように話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's the best thing you've eaten recently?", "ja": "最近食べた中で、いちばんおいしかったものは何ですか？", "f": ["Where did you eat it?", "Would you order it again?"]}, {"n": "WARM-UP 2", "t": "Think of a Japanese dish you love. How would you describe the taste?", "ja": "好きな日本料理を一つ思い浮かべてください。味をどう説明しますか？", "f": ["Which flavor do you notice first?", "Who might not enjoy it?"]}, {"n": "QUESTION 1", "t": "If I came to Japan, what food would you recommend I try first?", "ja": "私が日本に来たら、まずどんな食べ物をすすめますか？", "f": ["Why that food?", "Is there a particular restaurant or place where I should try it?"]}, {"n": "QUESTION 2", "t": "Are there any Japanese foods people usually eat in certain seasons?", "ja": "特定の季節によく食べる日本の食べ物はありますか？", "f": ["Are certain foods connected with certain kinds of weather? Why?", "What memories do you have of that food?"]}, {"n": "QUESTION 3", "t": "Which Japanese food do you most enjoy sharing with other people?", "ja": "人と一緒に食べるのがいちばん楽しい日本食は何ですか？", "f": ["Who do you usually share it with?", "What occasion suits it?"]}, {"n": "QUESTION 4", "t": "If you opened your own restaurant, what kind of food would you serve?", "ja": "自分のレストランを開くなら、どんな料理を出しますか？", "f": ["Why that kind of food?", "Are there any drinks or side dishes that would go well with it?"]}, {"n": "QUESTION 5", "t": "Is there a food from another country that you haven't tried but would like to?", "ja": "まだ食べたことはないけれど、食べてみたい外国の料理はありますか？", "f": ["Where did you hear about it?", "Have you seen it anywhere in Japan?"]}, {"n": "QUESTION 6", "t": "Are there any foods you don't like?", "ja": "苦手な食べ物はありますか？", "f": ["What don't you like about it?", "Do your friends agree with you?"]}]}, {"n": 4, "title": "나라마다 다른 식사 예절", "sub": "国によって違う食事のマナー", "titles": {"ko": "나라마다 다른 식사 예절", "en": "A table manner that differs between countries", "ja": "国によって違う食事のマナー"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-between-two-countries-full/04-a-table-manner-that-differs/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-between-two-countries-full/04-a-table-manner-that-differs/lecture/index.html", "source": "courses/en/talk-between-two-countries-full/lessons/04-a-table-manner-that-differs/lecture/index.html"}, {"href": "view/talk-between-two-countries-full/04-a-table-manner-that-differs/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-between-two-countries-full/04-a-table-manner-that-differs/prestudy/index.html", "source": "courses/en/talk-between-two-countries-full/lessons/04-a-table-manner-that-differs/prestudy/index.html"}], "goal": {"t": "Let's compare one table habit and the meaning people give it. Please read the title aloud.", "ja": "食卓での習慣を一つ比べ、その意味について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Who did you last eat a meal with?", "ja": "最近、誰と食事をしましたか？", "f": ["Where were you?", "What did you eat?"]}, {"n": "WARM-UP 2", "t": "What do you always do at the table without thinking about it?", "ja": "食卓で、何も考えずにいつもしていることは何ですか？", "f": ["Do you say anything before you start?", "What do you do with your bowl or your hands?"]}, {"n": "QUESTION 1", "t": "What do you do at the table that feels completely normal to you?", "ja": "食卓で、自分にとってはまったく普通だと感じることは何ですか？", "f": ["Who taught you that?", "Do your friends do it too?"]}, {"n": "QUESTION 2", "t": "In your family, who starts eating first?", "ja": "あなたの家では、誰が最初に食べ始めますか？", "f": ["What do you say before eating?", "Is it different in a restaurant?"]}, {"n": "QUESTION 3", "t": "What's one table habit you've noticed in another country?", "ja": "ほかの国の食事で、気づいた習慣を一つ挙げるとしたら何ですか？", "f": ["Did you notice it in person or online?", "Would it feel natural in Japan?"]}, {"n": "QUESTION 4", "t": "Do you eat differently at home and in a restaurant?", "ja": "家と店では、食べ方が変わりますか？", "f": ["Which one is more relaxed?", "What exactly changes?"]}, {"n": "QUESTION 5", "t": "Who taught you your table manners?", "ja": "食事のマナーは、誰に教わりましたか？", "f": ["Were they strict about it?", "Do you still follow all of it?"]}, {"n": "QUESTION 6", "t": "Now the opposite — is there a table rule you were taught but don't follow?", "ja": "逆に、教わったけれど守っていない食事のルールはありますか？", "f": ["When did you stop?", "Would you follow it in front of your family?"]}]}, {"n": 5, "title": "여행자에게 보여 주고 싶은 장소", "sub": "旅行者に案内したい場所", "titles": {"ko": "여행자에게 보여 주고 싶은 장소", "en": "A place you would show a visitor", "ja": "旅行者に案内したい場所"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-between-two-countries-full/05-a-place-you-would-show-a-visitor/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-between-two-countries-full/05-a-place-you-would-show-a-visitor/lecture/index.html", "source": "courses/en/talk-between-two-countries-full/lessons/05-a-place-you-would-show-a-visitor/lecture/index.html"}, {"href": "view/talk-between-two-countries-full/05-a-place-you-would-show-a-visitor/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-between-two-countries-full/05-a-place-you-would-show-a-visitor/prestudy/index.html", "source": "courses/en/talk-between-two-countries-full/lessons/05-a-place-you-would-show-a-visitor/prestudy/index.html"}], "goal": {"t": "Let's plan one day somewhere meaningful, away from the famous sights. Please read the title aloud.", "ja": "有名な観光地ではない、大切な場所での一日を考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "If I visited Japan, where would you recommend I go?", "ja": "私が日本を訪れるなら、どこへ行くのがおすすめですか？", "f": ["Why would you recommend that place?", "What side of Japan would that place show?", "What makes that place uniquely special?"]}, {"n": "WARM-UP 2", "t": "When you visit somewhere new, do you prefer famous tourist spots or more local places?", "ja": "初めての場所を訪れるとき、有名な観光地と地元らしい場所のどちらが好きですか？", "f": ["What is the most famous tourist spot in Japan?", "Is visiting tourist spots sometimes seen negatively? Why?"]}, {"n": "QUESTION 1", "t": "In your opinion, what's the difference between a ‘tourist experience’ and a ‘local experience’?", "ja": "あなたにとって、「観光客らしい体験」と「地元らしい体験」の違いは何ですか？", "f": ["What makes something a ‘hidden gem’?", "Why do tourists sometimes try to avoid tourist spots?"]}, {"n": "QUESTION 2", "t": "What place is typical of everyday life in your area?", "ja": "あなたの地域の日常らしさがよく表れている場所はどこですか？", "f": ["Which routine would be easiest to see?", "Where is daily life easiest to see: a station, a market, or a park?"]}, {"n": "QUESTION 3", "t": "When is the best time to see a familiar place?", "ja": "身近な場所を見るのにいちばんよい時間はいつですか？", "f": ["How do the people, sounds, or light change?", "Do you prefer familiar places in the morning or at night?"]}, {"n": "QUESTION 4", "t": "Which local place would you show a food lover?", "ja": "食べ物が好きな人に、地元のどこを案内しますか？", "f": ["What does the place show about local food?", "Would a food lover prefer a market or a restaurant?"]}, {"n": "QUESTION 5", "t": "What do guidebooks often fail to explain about local places?", "ja": "ガイドブックは、地元の場所について何を説明できていないことが多いですか？", "f": ["Why is that hard to explain?", "Do guidebooks miss local routines or local stories more often?"]}, {"n": "QUESTION 6", "t": "When you travel, do you prefer visiting quiet or busy places?", "ja": "旅行するとき、静かな場所とにぎやかな場所のどちらを訪れるのが好きですか？", "f": ["Why do you prefer that kind of place?", "What activities do you prefer when travelling—shopping, sightseeing, eating and drinking, events, or something else?", "Does your preference change depending on any other factors?"]}]}, {"n": 6, "title": "깔끔하게 번역되지 않는 말", "sub": "ぴったり訳せない言葉", "titles": {"ko": "깔끔하게 번역되지 않는 말", "en": "A word that doesn't translate neatly", "ja": "ぴったり訳せない言葉"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-between-two-countries-full/06-a-word-that-doesnt-translate-neatly/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-between-two-countries-full/06-a-word-that-doesnt-translate-neatly/lecture/index.html", "source": "courses/en/talk-between-two-countries-full/lessons/06-a-word-that-doesnt-translate-neatly/lecture/index.html"}, {"href": "view/talk-between-two-countries-full/06-a-word-that-doesnt-translate-neatly/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-between-two-countries-full/06-a-word-that-doesnt-translate-neatly/prestudy/index.html", "source": "courses/en/talk-between-two-countries-full/lessons/06-a-word-that-doesnt-translate-neatly/prestudy/index.html"}], "goal": {"t": "Let's explore a word whose meaning or feeling changes in translation. Please read the title aloud.", "ja": "訳すと意味や感覚が変わる言葉について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which English word would you like to understand better?", "ja": "もっとよく理解したい英単語は何ですか？", "f": ["Which use of the word confuses you?", "Do new words stick better from songs, shows, or conversations?"]}, {"n": "WARM-UP 2", "t": "Which is harder to translate: a joke, a feeling, or a polite phrase?", "ja": "冗談、気持ち、丁寧な表現の中で、いちばん訳しにくいのはどれですか？", "f": ["Which part depends on the situation?", "Which is easier to translate: facts or feelings?"]}, {"n": "QUESTION 1", "t": "What's a Japanese expression you wish English had?", "ja": "英語にもあればいいのにと思う日本語の表現は何ですか？", "f": ["When do you use it?", "What does a direct translation miss?"]}, {"n": "QUESTION 2", "t": "Which Japanese word needs a full English sentence to explain?", "ja": "英語では一文使わないと説明しにくい日本語は何ですか？", "f": ["When does the word feel natural?", "Which is harder to explain in English: a food name or a feeling?"]}, {"n": "QUESTION 3", "t": "What's a translation that sounded funny or wrong to you?", "ja": "面白く聞こえたり、不自然に聞こえたりした翻訳は何ですか？", "f": ["Where did you see or hear it?", "What do you think it was meant to say?"]}, {"n": "QUESTION 4", "t": "What's a word you use differently with friends and at work?", "ja": "友人に対してと職場で、使い方が変わる言葉は何ですか？", "f": ["How does it change?", "Which version feels more natural to you?"]}, {"n": "QUESTION 5", "t": "What kind of translation mistake can make a serious scene funny?", "ja": "どんな翻訳ミスで、真面目な場面が面白くなってしまいますか？", "f": ["Can a word-for-word translation cause it?", "Have subtitles ever made you laugh?"]}, {"n": "QUESTION 6", "t": "Which matters more in translation: exact meaning or the same feeling?", "ja": "翻訳では、正確な意味と同じ感覚のどちらが大切ですか？", "f": ["What should a translator never lose?", "How could they keep both?"]}]}, {"n": 7, "title": "일본이 특히 잘하는 것", "sub": "日本がとくに得意なこと", "titles": {"ko": "일본이 특히 잘하는 것", "en": "Something Japan does especially well", "ja": "日本がとくに得意なこと"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-between-two-countries-full/07-japan-does-especially-well/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-between-two-countries-full/07-japan-does-especially-well/lecture/index.html", "source": "courses/en/talk-between-two-countries-full/lessons/07-japan-does-especially-well/lecture/index.html"}, {"href": "view/talk-between-two-countries-full/07-japan-does-especially-well/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-between-two-countries-full/07-japan-does-especially-well/prestudy/index.html", "source": "courses/en/talk-between-two-countries-full/lessons/07-japan-does-especially-well/prestudy/index.html"}], "goal": {"t": "Today, we'll choose one everyday service Japan does especially well and explain why. Please read the title aloud.", "ja": "今日は、日本が特に得意な日常サービスを一つ選び、その理由を話します。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Convenience stores, trains, taxis, or delivery—pick the one Japan does best.", "ja": "コンビニ、電車、タクシー、宅配の中で、日本が一番得意だと思うものを選んでください。", "f": ["Which strength makes it stand out?", "What weakness could change your choice?"]}, {"n": "WARM-UP 2", "t": "On a busy day, which Japanese service is most useful?", "ja": "忙しい日に、どの日本のサービスがいちばん役立ちますか？", "f": ["Which problem does it solve first?", "What detail makes the biggest difference?"]}, {"n": "QUESTION 1", "t": "When did a Japanese service last make your day easier?", "ja": "日本のサービスのおかげで最後に一日が楽になったのは、どんなときですか？", "f": ["What happened?", "Which small detail made it go smoothly?"]}, {"n": "QUESTION 2", "t": "Which Japanese service helps visitors the most?", "ja": "旅行者にいちばん役立つ日本のサービスは何ですか？", "f": ["Which situation makes it especially valuable?", "What might still confuse a first-time user?"]}, {"n": "QUESTION 3", "t": "What everyday service does another country do better than Japan?", "ja": "日常のサービスで、ほかの国のほうが日本より上手にしているものは何ですか？", "f": ["What do they do differently?", "Which matters more in a service: speed or friendliness?"]}, {"n": "QUESTION 4", "t": "What everyday service would you miss most while living abroad?", "ja": "海外で暮らすなら、どんな日常のサービスがいちばん恋しくなりそうですか？", "f": ["Which routine would change first?", "Which is harder to replace: trains or convenience stores?"]}, {"n": "QUESTION 5", "t": "Which Japanese service may get a little too much praise?", "ja": "日本のサービスの中で、少しほめられすぎているものはどれですか？", "f": ["What problem do people overlook?", "Which matters more: good reviews or your own experience?"]}, {"n": "QUESTION 6", "t": "What one change would improve trains, taxis, convenience stores, or delivery?", "ja": "電車、タクシー、コンビニ、宅配のどれかをよくするなら、何を一つ変えますか？", "f": ["Who would gain the most from the change?", "Which new cost or difficulty might appear?"]}]}, {"n": 8, "title": "새해 첫날을 보내는 방법", "sub": "元日の過ごし方", "titles": {"ko": "새해 첫날을 보내는 방법", "en": "How you spend New Year's Day", "ja": "元日の過ごし方"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-between-two-countries-full/08-how-you-spend-new-years-day/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-between-two-countries-full/08-how-you-spend-new-years-day/lecture/index.html", "source": "courses/en/talk-between-two-countries-full/lessons/08-how-you-spend-new-years-day/lecture/index.html"}, {"href": "view/talk-between-two-countries-full/08-how-you-spend-new-years-day/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-between-two-countries-full/08-how-you-spend-new-years-day/prestudy/index.html", "source": "courses/en/talk-between-two-countries-full/lessons/08-how-you-spend-new-years-day/prestudy/index.html"}], "goal": {"t": "Let's compare what New Year's Day really looks like in our lives. Please read the title aloud.", "ja": "実際の元日の過ごし方を比べましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What do you actually do on New Year's Day?", "ja": "元日は実際に何をしますか？", "f": ["Which part feels most different from a normal day?", "Would you rather rest at home or go out on New Year's Day?"]}, {"n": "WARM-UP 2", "t": "Which part of New Year's Day do you look forward to most?", "ja": "元日のどの時間をいちばん楽しみにしていますか？", "f": ["Which feeling or person makes it important?", "Has that favorite part changed over time?"]}, {"n": "QUESTION 1", "t": "What do you most like eating on New Year's Day?", "ja": "元日にいちばん食べたいものは何ですか？", "f": ["Who do you usually eat it with?", "Do you eat it at any other time?"]}, {"n": "QUESTION 2", "t": "What's the first thing you usually do on New Year's morning?", "ja": "元日の朝、ふつう最初に何をしますか？", "f": ["Has that changed over time?", "What happens if you sleep late?"]}, {"n": "QUESTION 3", "t": "What's one New Year's tradition your family does differently now?", "ja": "家族の新年の習慣で、以前とやり方が変わったものは何ですか？", "f": ["What caused the change?", "Do you miss the old way?"]}, {"n": "QUESTION 4", "t": "Would you rather spend New Year's Day at home or away?", "ja": "元日は家で過ごしたいですか、それとも出かけたいですか？", "f": ["What would the ideal day look like?", "What could make you choose the other option?"]}, {"n": "QUESTION 5", "t": "Which New Year's custom takes too much time?", "ja": "時間がかかりすぎる新年の習慣は何ですか？", "f": ["Which part should remain?", "Which takes more time: cooking, visiting family, or traveling?"]}, {"n": "QUESTION 6", "t": "What would you most like to ask someone from another country about New Year's Day?", "ja": "ほかの国の人に、その国の元日について何をいちばん聞きたいですか？", "f": ["Which answer might surprise you?", "What would you tell them about Japan in return?"]}]}]}, {"no": 3, "label": "3코스", "title": "요즘의 나", "titles": {"ko": "요즘의 나", "en": "Me lately", "ja": "最近のわたし"}, "subtitle": "(中級) 最近のわたし", "desc": {"ko": "최근 경험을 구체적으로 꺼내 길게 말한다.", "en": "Pull a recent experience out in detail, and keep talking about it.", "ja": "最近の出来事を具体的に取り出して、長く話す。"}, "cover": "covers/talk-me-lately-accessible.webp", "levels": ["B1"], "level": "B1", "slug": "talk-me-lately-accessible", "lessons": [{"n": 1, "title": "돈값 한 물건", "sub": "買ってよかったもの", "titles": {"ko": "돈값 한 물건", "en": "A purchase that was worth it", "ja": "買ってよかったもの"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-me-lately-accessible/09-a-purchase-that-was-worth-it/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-accessible/09-a-purchase-that-was-worth-it/lecture/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/09-a-purchase-that-was-worth-it/lecture/index.html"}, {"href": "view/talk-me-lately-accessible/09-a-purchase-that-was-worth-it/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-accessible/09-a-purchase-that-was-worth-it/prestudy/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/09-a-purchase-that-was-worth-it/prestudy/index.html"}], "goal": {"t": "Let's talk about a purchase that was worth the money. Please read the title aloud.", "ja": "お金を出す価値があった買い物について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's the last thing you bought for yourself?", "ja": "最近、自分のために買ったものは何ですか？", "f": ["When did you buy it?", "Roughly how much was it?"]}, {"n": "WARM-UP 2", "t": "Think of something you bought recently. How long did you think about it before buying it?", "ja": "最近買ったものを思い浮かべてください。買うまでにどのくらい迷いましたか？", "f": ["What made you hesitate?", "Did you ask anyone about it?"]}, {"n": "QUESTION 1", "t": "What have you bought that was really worth the money?", "ja": "買ってよかったと本当に思うものは何ですか？", "f": ["How often do you use it?", "Would you buy it again?"]}, {"n": "QUESTION 2", "t": "What's something you use much more than you expected?", "ja": "思っていた以上によく使っているものは何ですか？", "f": ["When do you use it most?", "What did you use before?"]}, {"n": "QUESTION 3", "t": "Which purchase made one part of your day easier?", "ja": "毎日の一部を楽にしてくれた買い物は何ですか？", "f": ["What changed?", "Did anyone else notice?"]}, {"n": "QUESTION 4", "t": "What's something you nearly didn't buy because of the price?", "ja": "値段のせいで、もう少しで買わないところだったものは何ですか？", "f": ["What changed your mind?", "Does it feel worth the price now?"]}, {"n": "QUESTION 5", "t": "What do you want to buy next?", "ja": "次に買いたいものは何ですか？", "f": ["What's stopping you?", "Who would you ask about it?"]}, {"n": "QUESTION 6", "t": "Now the opposite — what did you buy and then regret?", "ja": "逆に、買ったあとで後悔したものは何ですか？", "f": ["What made you regret it?", "Where is it now?"]}]}, {"n": 2, "title": "요즘 하루 중 가장 좋은 시간", "sub": "最近、一日の中でいちばん好きな時間", "titles": {"ko": "요즘 하루 중 가장 좋은 시간", "en": "The best part of your day lately", "ja": "最近、一日の中でいちばん好きな時間"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-me-lately-accessible/10-something-youve-recently-got-into/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-accessible/10-something-youve-recently-got-into/lecture/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/10-something-youve-recently-got-into/lecture/index.html"}, {"href": "view/talk-me-lately-accessible/10-something-youve-recently-got-into/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-accessible/10-something-youve-recently-got-into/prestudy/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/10-something-youve-recently-got-into/prestudy/index.html"}], "goal": {"t": "Let's notice the people, places, and small routines that have made recent days feel good. Please read the title aloud.", "ja": "最近の日々を心地よくしてくれた人や場所、小さな習慣に目を向けて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What was the best part of yesterday?", "ja": "昨日のいちばんよかった時間は何ですか？", "f": ["What happened?", "Who was there?"]}, {"n": "WARM-UP 2", "t": "What part of today have you enjoyed most?", "ja": "今日、いちばん楽しめた時間はいつですか？", "f": ["What made it enjoyable?", "Is that usually a good part of your day?"]}, {"n": "QUESTION 1", "t": "What time of day do you look forward to lately?", "ja": "最近、一日の中で楽しみにしている時間はいつですか？", "f": ["What do you usually do then?", "What makes that time feel different?"]}, {"n": "QUESTION 2", "t": "What's a small routine that's making your days better?", "ja": "最近、毎日を少しよくしてくれている習慣は何ですか？", "f": ["When did you start it?", "Would you miss it if you stopped?"]}, {"n": "QUESTION 3", "t": "Who have you enjoyed spending time with lately?", "ja": "最近、誰と過ごす時間が楽しいですか？", "f": ["What do you usually do together?", "When will you see them next?"]}, {"n": "QUESTION 4", "t": "Where have you felt most relaxed lately?", "ja": "最近、どこでいちばんリラックスできましたか？", "f": ["What do you notice there?", "Do you prefer being alone or with someone?"]}, {"n": "QUESTION 5", "t": "What ordinary thing made you smile this week?", "ja": "今週、どんな何気ないことで笑顔になりましたか？", "f": ["Why did it affect you?", "Did you tell anyone about it?"]}, {"n": "QUESTION 6", "t": "What would make tomorrow a really good day?", "ja": "明日を本当によい一日にするには、何があるとよいですか？", "f": ["What could you do first?", "What would you like to avoid?"]}]}, {"n": 3, "title": "계속 보게 되는 프로그램", "sub": "見るのをやめられない作品", "titles": {"ko": "계속 보게 되는 프로그램", "en": "A show you can't stop watching", "ja": "見るのをやめられない作品"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-me-lately-accessible/11-a-show-you-cant-stop-watching/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-accessible/11-a-show-you-cant-stop-watching/lecture/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/11-a-show-you-cant-stop-watching/lecture/index.html"}, {"href": "view/talk-me-lately-accessible/11-a-show-you-cant-stop-watching/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-accessible/11-a-show-you-cant-stop-watching/prestudy/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/11-a-show-you-cant-stop-watching/prestudy/index.html"}], "goal": {"t": "Let's talk about what keeps you watching a show. Please read the title aloud.", "ja": "つい見続けてしまう作品について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Are you watching anything at the moment?", "ja": "今、何か見ている作品はありますか？", "f": ["What's it called?", "What was the last thing you finished?"]}, {"n": "WARM-UP 2", "t": "When you start a new series, how many episodes do you usually watch at once?", "ja": "新しいシリーズを見始めたら、ふつう一度に何話見ますか？", "f": ["Does that change when you love the show?", "What makes you stop?"]}, {"n": "QUESTION 1", "t": "What makes you keep watching a series after one episode?", "ja": "一話見たあともシリーズを見続けたくなるのは、どんな理由からですか？", "f": ["Is the story or a character more important?", "What makes you give up?"]}, {"n": "QUESTION 2", "t": "Who's a TV character you genuinely like?", "ja": "本当に好きなテレビ作品の登場人物は誰ですか？", "f": ["Which show are they in?", "What do they do that you like?"]}, {"n": "QUESTION 3", "t": "Do you prefer watching shows alone or with someone?", "ja": "番組は一人で見るほうが好きですか、それとも誰かと見るほうが好きですか？", "f": ["What changes when someone watches with you?", "Who makes a good viewing partner?"]}, {"n": "QUESTION 4", "t": "How late have you stayed up watching something?", "ja": "何かを見ていて、何時まで起きていたことがありますか？", "f": ["What happened the next day?", "Do you still do it?"]}, {"n": "QUESTION 5", "t": "What's one show you'd happily recommend?", "ja": "喜んで人におすすめしたい作品は何ですか？", "f": ["Who would enjoy it most?", "How would you describe it without spoilers?"]}, {"n": "QUESTION 6", "t": "Now the opposite — what did you finish but wouldn't recommend?", "ja": "逆に、最後まで見たけれど人には勧めない作品は何ですか？", "f": ["Why did you keep going?", "Where did it go wrong?"]}]}, {"n": 4, "title": "아직 기억나는 칭찬", "sub": "今も覚えている褒め言葉", "titles": {"ko": "아직 기억나는 칭찬", "en": "A compliment you still remember", "ja": "今も覚えている褒め言葉"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-me-lately-accessible/12-a-compliment-you-still-remember/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-accessible/12-a-compliment-you-still-remember/lecture/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/12-a-compliment-you-still-remember/lecture/index.html"}, {"href": "view/talk-me-lately-accessible/12-a-compliment-you-still-remember/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-accessible/12-a-compliment-you-still-remember/prestudy/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/12-a-compliment-you-still-remember/prestudy/index.html"}], "goal": {"t": "Let's talk about a compliment that stayed with you. Please read the title aloud.", "ja": "心に残っている褒め言葉について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's a compliment you still remember?", "ja": "今でも覚えている褒め言葉は何ですか？", "f": ["Who said it?", "Why did it stay with you?"]}, {"n": "WARM-UP 2", "t": "What kind of compliment can feel awkward instead of nice?", "ja": "うれしいより、気まずく感じる褒め言葉はどんなものですか？", "f": ["Does the speaker, timing, or wording matter most?", "Which is more awkward: praise from a stranger or praise in public?"]}, {"n": "QUESTION 1", "t": "Who gave you a compliment at exactly the right time?", "ja": "ちょうど必要なときに褒めてくれた人は誰ですか？", "f": ["What did they notice?", "Did it change what you did next?"]}, {"n": "QUESTION 2", "t": "What makes a compliment feel believable?", "ja": "どんな褒め言葉なら信じられますか？", "f": ["Which details show that the person truly noticed?", "Why can good praise still be hard to accept?"]}, {"n": "QUESTION 3", "t": "What's your natural reaction when someone praises you?", "ja": "褒められたとき、自然にどんな反応をしますか？", "f": ["Does your reaction change with the person?", "What response feels warm without rejecting the praise?"]}, {"n": "QUESTION 4", "t": "Which stays with you longer: a compliment or criticism?", "ja": "褒め言葉と批判では、どちらが長く心に残りますか？", "f": ["Why can one comment outweigh many others?", "How do you stop an unfair comment from taking over?"]}, {"n": "QUESTION 5", "t": "What do you notice that makes you want to compliment someone?", "ja": "人のどんなところに気づくと、褒めたくなりますか？", "f": ["Which quiet effort deserves more recognition?", "What makes a compliment useful rather than polite?"]}, {"n": "QUESTION 6", "t": "What everyday compliment should people give more often?", "ja": "日常で、もっと多く伝えるとよい褒め言葉は何ですか？", "f": ["What could that compliment help someone notice?", "Which feels better: 'Good job' or praise about one specific thing?"]}]}, {"n": 5, "title": "이번 주말 계획", "sub": "今週末の予定", "titles": {"ko": "이번 주말 계획", "en": "Your plans for this weekend", "ja": "今週末の予定"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-me-lately-accessible/13-your-plans-for-this-weekend/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-accessible/13-your-plans-for-this-weekend/lecture/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/13-your-plans-for-this-weekend/lecture/index.html"}, {"href": "view/talk-me-lately-accessible/13-your-plans-for-this-weekend/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-accessible/13-your-plans-for-this-weekend/prestudy/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/13-your-plans-for-this-weekend/prestudy/index.html"}], "goal": {"t": "Let's talk through your weekend plan and what could change it. Please read the title aloud.", "ja": "週末の予定と、それが変わる可能性について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "How are you feeling about this weekend?", "ja": "今週末について、今どんな気持ちですか？", "f": ["Are you hoping to rest or do something?", "What would make it feel different from a weekday?"]}, {"n": "WARM-UP 2", "t": "What would make this weekend feel well spent?", "ja": "今週末を有意義だったと感じるには、何があればよいですか？", "f": ["What would leave you feeling refreshed?", "What would make the weekend feel wasted?"]}, {"n": "QUESTION 1", "t": "Do you like weekends planned or open?", "ja": "週末は予定を決めたいですか、それとも空けておきたいですか？", "f": ["Which plans benefit from structure?", "When does an open day feel better?"]}, {"n": "QUESTION 2", "t": "Which sounds better this weekend: time alone or time with someone?", "ja": "今週末は、一人の時間と誰かと過ごす時間のどちらがよさそうですか？", "f": ["What kind of company would fit your mood?", "How much time alone would you still want?"]}, {"n": "QUESTION 3", "t": "What's one simple thing you would enjoy this weekend?", "ja": "今週末に楽しめそうな、簡単なことを一つ挙げるとしたら何ですか？", "f": ["Why does that sound good right now?", "Who, if anyone, would you invite?"]}, {"n": "QUESTION 4", "t": "What usually makes you change a weekend plan?", "ja": "週末の予定を変えるのは、ふつうどんな理由からですか？", "f": ["Which change is easy to accept?", "When does a change improve the weekend?"]}, {"n": "QUESTION 5", "t": "What part of a weekend is worth planning ahead?", "ja": "週末のどんなことは、前もって決める価値がありますか？", "f": ["Which decision becomes harder at the last minute?", "What is better left spontaneous?"]}, {"n": "QUESTION 6", "t": "If a plan gets canceled, what's your best backup?", "ja": "予定が中止になったら、いちばんよい代わりの過ごし方は何ですか？", "f": ["Could the backup be better than the original plan?", "How quickly would you decide what to do?"]}]}, {"n": 6, "title": "올해 안에 하고 싶은 한 가지", "sub": "今年中にまだやりたいこと", "titles": {"ko": "올해 안에 하고 싶은 한 가지", "en": "One thing you still want to do this year", "ja": "今年中にまだやりたいこと"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-me-lately-accessible/14-one-thing-you-still-want-to-do-this-year/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-accessible/14-one-thing-you-still-want-to-do-this-year/lecture/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/14-one-thing-you-still-want-to-do-this-year/lecture/index.html"}, {"href": "view/talk-me-lately-accessible/14-one-thing-you-still-want-to-do-this-year/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-accessible/14-one-thing-you-still-want-to-do-this-year/prestudy/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/14-one-thing-you-still-want-to-do-this-year/prestudy/index.html"}], "goal": {"t": "Let's choose one goal and find a realistic first step. Please read the title aloud.", "ja": "目標を一つ選び、現実的な最初の一歩を考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one thing you'd like to finish this year?", "ja": "今年中に終わらせたいことを一つ挙げるとしたら何ですか？", "f": ["What would completing it change?", "What might you need to put aside?"]}, {"n": "WARM-UP 2", "t": "If you could finish one unfinished thing this month, what would you choose?", "ja": "今月、やり残していることを一つ終えられるなら、何を選びますか？", "f": ["Why would you choose that first?", "How much time would it need?"]}, {"n": "QUESTION 1", "t": "Which goal would make the biggest difference to your everyday life this year?", "ja": "今年、日常生活にいちばん大きな変化をもたらしそうな目標は何ですか？", "f": ["What would change first?", "What makes the goal worth your time?"]}, {"n": "QUESTION 2", "t": "Which gets in the way more: time, money, or doubt?", "ja": "目標の邪魔になりやすいのは、時間、お金、自信のなさのどれですか？", "f": ["How does that problem usually appear?", "What small step could help?"]}, {"n": "QUESTION 3", "t": "When is dropping a goal a smart decision?", "ja": "目標をやめることが賢い判断になるのは、どんなときですか？", "f": ["How do you know it is time to stop trying?", "Is stopping always the same as failing?"]}, {"n": "QUESTION 4", "t": "How can sharing a goal make success feel different?", "ja": "目標を誰かに話すと、達成したときの気持ちはどう変わりますか？", "f": ["Who, if anyone, would understand the effort?", "Would you share it with one person or keep it private?"]}, {"n": "QUESTION 5", "t": "What kind of goal is okay to change as life changes?", "ja": "生活が変わったとき、どんな目標なら変えてもよいと思いますか？", "f": ["What should stay important?", "Is it okay to make a goal smaller when life gets busy?"]}, {"n": "QUESTION 6", "t": "What's one useful first step toward a difficult goal?", "ja": "難しい目標に向かう、役に立つ最初の一歩は何ですか？", "f": ["Why is that step small enough to start?", "What would show that it worked?"]}]}, {"n": 7, "title": "돈을 가장 많이 쓰는 것", "sub": "いちばんお金を使っているもの", "titles": {"ko": "돈을 가장 많이 쓰는 것", "en": "What you spend the most money on", "ja": "いちばんお金を使っているもの"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-me-lately-accessible/15-what-you-spend-the-most-money-on/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-accessible/15-what-you-spend-the-most-money-on/lecture/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/15-what-you-spend-the-most-money-on/lecture/index.html"}, {"href": "view/talk-me-lately-accessible/15-what-you-spend-the-most-money-on/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-accessible/15-what-you-spend-the-most-money-on/prestudy/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/15-what-you-spend-the-most-money-on/prestudy/index.html"}], "goal": {"t": "Let's talk about what your spending says about your priorities. Please read the title aloud.", "ja": "お金の使い方に表れる優先順位について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Do you ever spend money just for fun?", "ja": "楽しみのためだけにお金を使うことはありますか？", "f": ["What kind of fun feels worth paying for?", "What do you prefer to save for?"]}, {"n": "WARM-UP 2", "t": "What small purchase is hardest to resist?", "ja": "どんな小さな買い物がいちばん我慢しにくいですか？", "f": ["What makes it especially tempting?", "What feeling are you hoping to get?"]}, {"n": "QUESTION 1", "t": "Which do you spend more on: convenience, comfort, or fun?", "ja": "便利さ、快適さ、楽しさの中で、どれにいちばんお金を使いますか？", "f": ["Why do you spend more on that?", "Which one would you most like to spend less on?"]}, {"n": "QUESTION 2", "t": "When does spending extra feel worth it?", "ja": "少し多くお金を使ってもよいと思うのは、どんなときですか？", "f": ["What lasting benefit makes it worth the price?", "When is paying more no longer worth it?"]}, {"n": "QUESTION 3", "t": "What usually makes you decide not to buy something?", "ja": "物を買わないと決めるのは、ふつうどんな理由からですか？", "f": ["Which warning sign makes you pause?", "How long do you wait before deciding?"]}, {"n": "QUESTION 4", "t": "What kind of spending looks wasteful to you but useful to someone else?", "ja": "自分には無駄に見えても、ほかの人には役立ちそうな出費は何ですか？", "f": ["When could it be useful?", "Which is easier to understand: spending on hobbies or convenience?"]}, {"n": "QUESTION 5", "t": "What life change can completely change a budget?", "ja": "どんな生活の変化で、予算は大きく変わりますか？", "f": ["Which new responsibility would matter most?", "How quickly would spending habits need to change?"]}, {"n": "QUESTION 6", "t": "If money became tight, what small pleasure would be hard to give up?", "ja": "お金に余裕がなくなったら、どんな小さな楽しみを手放しにくいですか？", "f": ["What does that pleasure add to daily life?", "What limit would make you finally cut it?"]}]}, {"n": 8, "title": "처음 해 본 것", "sub": "初めてやってみたこと", "titles": {"ko": "처음 해 본 것", "en": "Something you tried for the first time", "ja": "初めてやってみたこと"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-me-lately-accessible/16-something-you-tried-for-the-first-time/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-accessible/16-something-you-tried-for-the-first-time/lecture/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/16-something-you-tried-for-the-first-time/lecture/index.html"}, {"href": "view/talk-me-lately-accessible/16-something-you-tried-for-the-first-time/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-accessible/16-something-you-tried-for-the-first-time/prestudy/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/16-something-you-tried-for-the-first-time/prestudy/index.html"}], "goal": {"t": "Let's tell the story of a recent first experience. Please read the title aloud.", "ja": "最近の初めての体験について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's something you tried for the first time this year?", "ja": "今年、初めてやってみたことは何ですか？", "f": ["When was that?", "What did you do last weekend that was new?"]}, {"n": "WARM-UP 2", "t": "What's something new you'd enjoy trying with another person?", "ja": "誰かと一緒に新しく試してみたいことは何ですか？", "f": ["Who would you invite?", "Why would company make it better?"]}, {"n": "QUESTION 1", "t": "Before trying something new, do you usually feel more nervous or excited?", "ja": "新しいことを始める前は、緊張とわくわくのどちらを強く感じますか？", "f": ["What makes that feeling stronger?", "When do you nearly cancel?"]}, {"n": "QUESTION 2", "t": "What's something that turned out very different from what you expected?", "ja": "想像していたものと大きく違った体験は何ですか？", "f": ["What surprised you most?", "Was it better or worse?"]}, {"n": "QUESTION 3", "t": "When was the last time you felt like a complete beginner?", "ja": "最後に、まったくの初心者だと感じたのはいつですか？", "f": ["What was hardest at first?", "Who or what helped?"]}, {"n": "QUESTION 4", "t": "What's something you tried once and would happily do again?", "ja": "一度試して、喜んでもう一度やりたいと思ったことは何ですか？", "f": ["What would you do differently next time?", "Who would you take?"]}, {"n": "QUESTION 5", "t": "What do you want to try next?", "ja": "次は何をやってみたいですか？", "f": ["What's stopping you?", "When could you actually do it?"]}, {"n": "QUESTION 6", "t": "Now the opposite — what did you try once and never again?", "ja": "逆に、一度やって二度とやらなかったことは何ですか？", "f": ["What put you off?", "Would you try it with a different person?"]}]}, {"n": 9, "title": "아무도 알아주지 않은 작은 성과", "sub": "誰にも気づかれなかった小さな成功", "titles": {"ko": "아무도 알아주지 않은 작은 성과", "en": "A small win nobody noticed", "ja": "誰にも気づかれなかった小さな成功"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-me-lately-accessible/17-a-small-win-nobody-noticed/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-accessible/17-a-small-win-nobody-noticed/lecture/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/17-a-small-win-nobody-noticed/lecture/index.html"}, {"href": "view/talk-me-lately-accessible/17-a-small-win-nobody-noticed/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-accessible/17-a-small-win-nobody-noticed/prestudy/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/17-a-small-win-nobody-noticed/prestudy/index.html"}], "goal": {"t": "Let's notice a small success and explain why it mattered. Please read the title aloud.", "ja": "小さな成功に目を向け、なぜ大切だったか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one small thing you did well this week?", "ja": "今週、自分でうまくできたと思う小さなことは何ですか？", "f": ["Why did it matter to you?", "Did anyone else notice?"]}, {"n": "WARM-UP 2", "t": "What effort do people often make without getting credit?", "ja": "人はどんな努力をしても、なかなか評価されないことがありますか？", "f": ["What makes the effort almost invisible?", "How could people recognize it better?"]}, {"n": "QUESTION 1", "t": "What progress have you made lately that someone else might miss?", "ja": "最近の進歩で、ほかの人には気づかれにくそうなものは何ですか？", "f": ["What small sign shows the change?", "When did you first notice it?"]}, {"n": "QUESTION 2", "t": "How can you tell when someone has been working hard quietly?", "ja": "人が人知れず頑張っていたことは、どうすれば分かりますか？", "f": ["What small changes can show the effort?", "How should someone respond when they notice?"]}, {"n": "QUESTION 3", "t": "How do you celebrate a small win?", "ja": "小さな成功を、どのように祝いますか？", "f": ["When is private satisfaction enough?", "How can celebrating help the next step?"]}, {"n": "QUESTION 4", "t": "When is keeping a small win private better than sharing it?", "ja": "小さな成功を人に話さず、自分だけにしておくほうがよいのはどんなときですか？", "f": ["Can sharing change the meaning of the win?", "When does telling someone make it more valuable?"]}, {"n": "QUESTION 5", "t": "Which helps more: praise from someone else or noticing your own progress?", "ja": "ほかの人に褒められることと、自分の進歩に気づくことでは、どちらがより役立ちますか？", "f": ["Which kind of motivation lasts longer?", "How can outside praise become less important?"]}, {"n": "QUESTION 6", "t": "What small sign can show that a month went well?", "ja": "一か月がうまくいったと分かる、小さなサインは何ですか？", "f": ["Why is that sign meaningful?", "Did you have more good days or bad days this month?"]}]}, {"n": 10, "title": "계속 듣게 되는 노래", "sub": "何度も聴いている曲", "titles": {"ko": "계속 듣게 되는 노래", "en": "A song you keep playing", "ja": "何度も聴いている曲"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-me-lately-accessible/18-a-song-you-keep-playing/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-accessible/18-a-song-you-keep-playing/lecture/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/18-a-song-you-keep-playing/lecture/index.html"}, {"href": "view/talk-me-lately-accessible/18-a-song-you-keep-playing/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-accessible/18-a-song-you-keep-playing/prestudy/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/18-a-song-you-keep-playing/prestudy/index.html"}], "goal": {"t": "Let's talk about a song that has become part of your life lately. Please read the title aloud.", "ja": "最近の生活の一部になっている曲について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Is there a song you've been playing a lot lately?", "ja": "最近よく聴いている曲はありますか？", "f": ["Which artist or sound fits your mood lately?", "When do you usually want to hear it?"]}, {"n": "WARM-UP 2", "t": "Which matters more in a song: lyrics, voice, or beat?", "ja": "曲では、歌詞、声、リズムのどれがいちばん大切ですか？", "f": ["Which element creates the first impression?", "Which one keeps the song interesting?"]}, {"n": "QUESTION 1", "t": "When do you get tired of a song you love?", "ja": "好きな曲に飽きるのは、どんなときですか？", "f": ["Does overplaying change the song or your mood?", "How long does a song need to feel fresh again?"]}, {"n": "QUESTION 2", "t": "What kind of memory can a song bring back instantly?", "ja": "曲を聴くと、どんな思い出がすぐによみがえりますか？", "f": ["Why does music hold that memory so strongly?", "Can the feeling change over time?"]}, {"n": "QUESTION 3", "t": "What activity is better with music?", "ja": "音楽があるともっとよくなる活動は何ですか？", "f": ["How does the music change your pace or mood?", "Which task needs silence instead?"]}, {"n": "QUESTION 4", "t": "What can make a favorite song hard to hear?", "ja": "好きな曲でも、聴くのがつらくなるのはどんな理由からですか？", "f": ["Can a song belong too strongly to one period?", "What might help someone enjoy it again?"]}, {"n": "QUESTION 5", "t": "What song would you send someone who needed energy?", "ja": "元気が必要な人に、どんな曲を送りますか？", "f": ["Would the lyrics or sound matter more?", "When you need energy, do you choose a fast song or a familiar one?"]}, {"n": "QUESTION 6", "t": "Which song belongs on a playlist about your year?", "ja": "今年を表すプレイリストに、どんな曲を入れますか？", "f": ["What story would the song tell?", "Would your year need a happy song or a calm one?"]}]}, {"n": 11, "title": "계속 미루고 있는 것", "sub": "ずっと先延ばしにしていること", "titles": {"ko": "계속 미루고 있는 것", "en": "Something you've been putting off", "ja": "ずっと先延ばしにしていること"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-me-lately-accessible/19-something-youve-been-putting-off/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-accessible/19-something-youve-been-putting-off/lecture/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/19-something-youve-been-putting-off/lecture/index.html"}, {"href": "view/talk-me-lately-accessible/19-something-youve-been-putting-off/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-accessible/19-something-youve-been-putting-off/prestudy/index.html", "source": "courses/en/talk-me-lately-accessible/lessons/19-something-youve-been-putting-off/prestudy/index.html"}], "goal": {"t": "Let's understand one delayed task and make the next action clear. Please read the title aloud.", "ja": "先延ばしにしていることを理解し、次の行動を明確にしましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1" tly. How long did you think about it before buying it?", "ja": "最近買ったものを思い浮かべてください。買うまでにどのくらい迷いましたか？", "f": ["What made you hesitate?", "Did you ask anyone about it?"]}, {"n": "QUESTION 1", "t": "What have you bought that was really worth the money?", "ja": "買ってよかったと本当に思うものは何ですか？", "f": ["How often do you use it?", "Would you buy it again?"]}, {"n": "QUESTION 2", "t": "What's something you use much more than you expected?", "ja": "思っていた以上によく使っているものは何ですか？", "f": ["When do you use it most?", "What did you use before?"]}, {"n": "QUESTION 3", "t": "Which purchase made one part of your day easier?", "ja": "毎日の一部を楽にしてくれた買い物は何ですか？", "f": ["What changed?", "Did anyone else notice?"]}, {"n": "QUESTION 4", "t": "What's something you nearly didn't buy because of the price?", "ja": "値段のせいで、もう少しで買わないところだったものは何ですか？", "f": ["What changed your mind?", "Does it feel worth the price now?"]}, {"n": "QUESTION 5", "t": "What do you want to buy next?", "ja": "次に買いたいものは何ですか？", "f": ["What's stopping you?", "Who would you ask about it?"]}, {"n": "QUESTION 6", "t": "Now the opposite — what did you buy and then regret?", "ja": "逆に、買ったあとで後悔したものは何ですか？", "f": ["What made you regret it?", "Where is it now?"]}]}, {"n": 2, "title": "요즘 하루 중 가장 좋은 시간", "sub": "最近、一日の中でいちばん好きな時間", "titles": {"ko": "요즘 하루 중 가장 좋은 시간", "en": "The best part of your day lately", "ja": "最近、一日の中でいちばん好きな時間"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-me-lately-full/10-something-youve-recently-got-into/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-full/10-something-youve-recently-got-into/lecture/index.html", "source": "courses/en/talk-me-lately-full/lessons/10-something-youve-recently-got-into/lecture/index.html"}, {"href": "view/talk-me-lately-full/10-something-youve-recently-got-into/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-full/10-something-youve-recently-got-into/prestudy/index.html", "source": "courses/en/talk-me-lately-full/lessons/10-something-youve-recently-got-into/prestudy/index.html"}], "goal": {"t": "Let's notice the people, places, and small routines that have made recent days feel good. Please read the title aloud.", "ja": "最近の日々を心地よくしてくれた人や場所、小さな習慣に目を向けて話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What was the best part of yesterday?", "ja": "昨日のいちばんよかった時間は何ですか？", "f": ["What happened?", "Who was there?"]}, {"n": "WARM-UP 2", "t": "What part of today have you enjoyed most?", "ja": "今日、いちばん楽しめた時間はいつですか？", "f": ["What made it enjoyable?", "Is that usually a good part of your day?"]}, {"n": "QUESTION 1", "t": "What time of day do you look forward to lately?", "ja": "最近、一日の中で楽しみにしている時間はいつですか？", "f": ["What do you usually do then?", "What makes that time feel different?"]}, {"n": "QUESTION 2", "t": "What's a small routine that's making your days better?", "ja": "最近、毎日を少しよくしてくれている習慣は何ですか？", "f": ["When did you start it?", "Would you miss it if you stopped?"]}, {"n": "QUESTION 3", "t": "Who have you enjoyed spending time with lately?", "ja": "最近、誰と過ごす時間が楽しいですか？", "f": ["What do you usually do together?", "When will you see them next?"]}, {"n": "QUESTION 4", "t": "Where have you felt most relaxed lately?", "ja": "最近、どこでいちばんリラックスできましたか？", "f": ["What do you notice there?", "Do you prefer being alone or with someone?"]}, {"n": "QUESTION 5", "t": "What ordinary thing made you smile this week?", "ja": "今週、どんな何気ないことで笑顔になりましたか？", "f": ["Why did it affect you?", "Did you tell anyone about it?"]}, {"n": "QUESTION 6", "t": "What would make tomorrow a really good day?", "ja": "明日を本当によい一日にするには、何があるとよいですか？", "f": ["What could you do first?", "What would you like to avoid?"]}]}, {"n": 3, "title": "계속 보게 되는 프로그램", "sub": "見るのをやめられない作品", "titles": {"ko": "계속 보게 되는 프로그램", "en": "A show you can't stop watching", "ja": "見るのをやめられない作品"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-me-lately-full/11-a-show-you-cant-stop-watching/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-full/11-a-show-you-cant-stop-watching/lecture/index.html", "source": "courses/en/talk-me-lately-full/lessons/11-a-show-you-cant-stop-watching/lecture/index.html"}, {"href": "view/talk-me-lately-full/11-a-show-you-cant-stop-watching/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-full/11-a-show-you-cant-stop-watching/prestudy/index.html", "source": "courses/en/talk-me-lately-full/lessons/11-a-show-you-cant-stop-watching/prestudy/index.html"}], "goal": {"t": "Let's talk about what keeps you watching a show. Please read the title aloud.", "ja": "つい見続けてしまう作品について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Are you watching anything at the moment?", "ja": "今、何か見ている作品はありますか？", "f": ["What's it called?", "What was the last thing you finished?"]}, {"n": "WARM-UP 2", "t": "When you start a new series, how many episodes do you usually watch at once?", "ja": "新しいシリーズを見始めたら、ふつう一度に何話見ますか？", "f": ["Does that change when you love the show?", "What makes you stop?"]}, {"n": "QUESTION 1", "t": "What makes you keep watching a series after one episode?", "ja": "一話見たあともシリーズを見続けたくなるのは、どんな理由からですか？", "f": ["Is the story or a character more important?", "What makes you give up?"]}, {"n": "QUESTION 2", "t": "Who's a TV character you genuinely like?", "ja": "本当に好きなテレビ作品の登場人物は誰ですか？", "f": ["Which show are they in?", "What do they do that you like?"]}, {"n": "QUESTION 3", "t": "Do you prefer watching shows alone or with someone?", "ja": "番組は一人で見るほうが好きですか、それとも誰かと見るほうが好きですか？", "f": ["What changes when someone watches with you?", "Who makes a good viewing partner?"]}, {"n": "QUESTION 4", "t": "How late have you stayed up watching something?", "ja": "何かを見ていて、何時まで起きていたことがありますか？", "f": ["What happened the next day?", "Do you still do it?"]}, {"n": "QUESTION 5", "t": "What's one show you'd happily recommend?", "ja": "喜んで人におすすめしたい作品は何ですか？", "f": ["Who would enjoy it most?", "How would you describe it without spoilers?"]}, {"n": "QUESTION 6", "t": "Now the opposite — what did you finish but wouldn't recommend?", "ja": "逆に、最後まで見たけれど人には勧めない作品は何ですか？", "f": ["Why did you keep going?", "Where did it go wrong?"]}]}, {"n": 4, "title": "아직 기억나는 칭찬", "sub": "今も覚えている褒め言葉", "titles": {"ko": "아직 기억나는 칭찬", "en": "A compliment you still remember", "ja": "今も覚えている褒め言葉"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-me-lately-full/12-a-compliment-you-still-remember/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-full/12-a-compliment-you-still-remember/lecture/index.html", "source": "courses/en/talk-me-lately-full/lessons/12-a-compliment-you-still-remember/lecture/index.html"}, {"href": "view/talk-me-lately-full/12-a-compliment-you-still-remember/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-full/12-a-compliment-you-still-remember/prestudy/index.html", "source": "courses/en/talk-me-lately-full/lessons/12-a-compliment-you-still-remember/prestudy/index.html"}], "goal": {"t": "Let's talk about a compliment that stayed with you. Please read the title aloud.", "ja": "心に残っている褒め言葉について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's a compliment you still remember?", "ja": "今でも覚えている褒め言葉は何ですか？", "f": ["Who said it?", "Why did it stay with you?"]}, {"n": "WARM-UP 2", "t": "What kind of compliment can feel awkward instead of nice?", "ja": "うれしいより、気まずく感じる褒め言葉はどんなものですか？", "f": ["Does the speaker, timing, or wording matter most?", "Which is more awkward: praise from a stranger or praise in public?"]}, {"n": "QUESTION 1", "t": "Who gave you a compliment at exactly the right time?", "ja": "ちょうど必要なときに褒めてくれた人は誰ですか？", "f": ["What did they notice?", "Did it change what you did next?"]}, {"n": "QUESTION 2", "t": "What makes a compliment feel believable?", "ja": "どんな褒め言葉なら信じられますか？", "f": ["Which details show that the person truly noticed?", "Why can good praise still be hard to accept?"]}, {"n": "QUESTION
