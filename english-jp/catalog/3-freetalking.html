source": "courses/en/talk-balance-games-full/lessons/114-a-summer-without-internet-or-air-conditioning/lecture/index.html"}, {"href": "view/talk-balance-games-full/114-a-summer-without-internet-or-air-conditioning/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-full/114-a-summer-without-internet-or-air-conditioning/prestudy/index.html", "source": "courses/en/talk-balance-games-full/lessons/114-a-summer-without-internet-or-air-conditioning/prestudy/index.html"}], "goal": {"t": "Let's compare a summer without internet and a summer without air conditioning, then explain what could change your choice. Please read the title aloud.", "ja": "インターネットなしの夏とエアコンなしの夏を比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What becomes difficult after one hour without internet?", "ja": "インターネットが一時間使えないと、最初に何が困りますか？", "f": ["What could still be done offline?", "Which would you miss first: messages, maps, or payments?"]}, {"n": "WARM-UP 2", "t": "How would you spend half a cool day without internet?", "ja": "涼しい日にインターネットなしで半日過ごすなら、何をしますか？", "f": ["A walk, a book, or a film?", "Who might you spend it with?"]}, {"n": "QUESTION 1", "t": "If you had to lose one for a summer, would you choose internet or air conditioning?", "ja": "一夏の間どちらかを失うなら、インターネットとエアコンのどちらにしますか？", "f": ["Would work, health, or family needs matter most?", "Which is more essential in hot weather: cooling or online access?"]}, {"n": "QUESTION 2", "t": "What would be the first problem during one day without air conditioning?", "ja": "エアコンなしで一日過ごすと、最初に何が問題になりますか？", "f": ["What could make the day easier?", "Which suffers first in heat: sleep or concentration?"]}, {"n": "QUESTION 3", "t": "If you could keep internet only for work and emergencies, would that change your summer choice?", "ja": "仕事と緊急時だけインターネットを使えるなら、夏の選択は変わりますか？", "f": ["Which online activity would you miss for fun?", "Would limited access feel easier than no access?"]}, {"n": "QUESTION 4", "t": "Would a safe, cool place nearby make a summer without air conditioning possible?", "ja": "近くに安全で涼しい場所があれば、エアコンなしの夏を過ごせますか？", "f": ["Would the safe place need to open at night?", "Would a nearby library make the summer easier?"]}, {"n": "QUESTION 5", "t": "Which part of a summer day is hardest without air conditioning?", "ja": "エアコンなしでは、夏の一日のどの時間が最も大変ですか？", "f": ["Sleeping or working?", "Where could you go to cool down?"]}, {"n": "QUESTION 6", "t": "What one change would make you switch to the other choice?", "ja": "どんな条件が一つ変われば、もう一方を選びますか？", "f": ["Would cooler weather change it?", "Would offline work or school change it?"]}]}, {"n": 9, "title": "더 나은 워라밸, 더 높은 급여?", "sub": "よりよい生活との両立、それとも高い給料？", "titles": {"ko": "더 나은 워라밸, 더 높은 급여?", "en": "Better work-life balance or a higher salary?", "ja": "よりよい生活との両立、それとも高い給料？"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-balance-games-full/115-better-work-life-balance-or-a-higher-salary/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-full/115-better-work-life-balance-or-a-higher-salary/lecture/index.html", "source": "courses/en/talk-balance-games-full/lessons/115-better-work-life-balance-or-a-higher-salary/lecture/index.html"}, {"href": "view/talk-balance-games-full/115-better-work-life-balance-or-a-higher-salary/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-full/115-better-work-life-balance-or-a-higher-salary/prestudy/index.html", "source": "courses/en/talk-balance-games-full/lessons/115-better-work-life-balance-or-a-higher-salary/prestudy/index.html"}], "goal": {"t": "Let's compare better work-life balance and a higher salary, then explain what could change your choice. Please read the title aloud.", "ja": "よりよい仕事と生活の両立とより高い給料を比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What makes a day off feel genuinely restful?", "ja": "しっかり休めたと感じるには、何が必要ですか？", "f": ["What would you stop doing on a restful day?", "Would you rather rest alone or spend time with people?"]}, {"n": "WARM-UP 2", "t": "Which part of the day would you refuse to give up?", "ja": "一日の中で、必ず守りたい自分の時間はいつですか？", "f": ["How could you protect that time?", "Which would you protect first: sleep or social time?"]}, {"n": "QUESTION 1", "t": "For the next year, would you choose more free time or a higher income?", "ja": "これから一年、自由な時間と高い収入のどちらを選びますか？", "f": ["Which need feels more urgent?", "What makes a week feel too busy?"]}, {"n": "QUESTION 2", "t": "What would improve first with one extra free hour every day?", "ja": "毎日自由な時間が一時間増えたら、最初に何がよくなりますか？", "f": ["How would the extra hour help?", "Would you use the extra hour for sleep, exercise, or family?"]}, {"n": "QUESTION 3", "t": "Would high pay be worth often losing evenings and weekends?", "ja": "高い給料でも、夜や週末をよく失うなら受け入れますか？", "f": ["Which commitment could not be sacrificed?", "Would losing every weekend be too much?"]}, {"n": "QUESTION 4", "t": "Would a clear one-year limit make a demanding high-paid job easier to accept?", "ja": "大変でも高収入の仕事が一年だけなら、受け入れやすくなりますか？", "f": ["What would the year need to achieve?", "Would you accept the job for three months instead of a year?"]}, {"n": "QUESTION 5", "t": "Would caring for someone or facing a large bill make higher pay more important?", "ja": "誰かのケアや大きな支払いが必要になったら、より高い給料が重要になりますか？", "f": ["Would you need the higher pay for long?", "Rent, health care, or family care?"]}, {"n": "QUESTION 6", "t": "What exact salary or amount of free time would make you switch?", "ja": "どのくらいの給料や自由時間なら、反対の選択に変わりますか？", "f": ["Would one extra day off be enough?", "Would a temporary offer change your answer?"]}]}, {"n": 10, "title": "재택근무, 사무실 출근?", "sub": "在宅勤務、それとも出社？", "titles": {"ko": "재택근무, 사무실 출근?", "en": "Working from home or going into the office?", "ja": "在宅勤務、それとも出社？"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-balance-games-full/116-working-from-home-or-going-into-the-office/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-full/116-working-from-home-or-going-into-the-office/lecture/index.html", "source": "courses/en/talk-balance-games-full/lessons/116-working-from-home-or-going-into-the-office/lecture/index.html"}, {"href": "view/talk-balance-games-full/116-working-from-home-or-going-into-the-office/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-full/116-working-from-home-or-going-into-the-office/prestudy/index.html", "source": "courses/en/talk-balance-games-full/lessons/116-working-from-home-or-going-into-the-office/prestudy/index.html"}], "goal": {"t": "Let's compare working from home and going into the office, then explain what could change your choice. Please read the title aloud.", "ja": "在宅で働くことと職場へ行くことを比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's the biggest distraction when working or studying at home?", "ja": "家で仕事や勉強をするとき、いちばん邪魔になるものは何ですか？", "f": ["How could the space be changed?", "Which distracts more at home: noise, chores, or your phone?"]}, {"n": "WARM-UP 2", "t": "How would you use the time saved by removing a commute?", "ja": "通勤時間がなくなったら、その時間をどう使いますか？", "f": ["Would you use the time the same way every day?", "Would you use the saved commute time for rest, exercise, or something social?"]}, {"n": "QUESTION 1", "t": "For focused work, would you choose home or a shared workplace?", "ja": "集中して作業するなら、家と共有の職場のどちらを選びますか？", "f": ["What kind of work are you imagining?", "Which place is quieter for you?"]}, {"n": "QUESTION 2", "t": "What changes most in your day when you work at home instead of an office?", "ja": "職場ではなく家で働くと、一日の中で何が最も変わりますか？", "f": ["Does it become easier or harder?", "Focus, communication, or breaks?"]}, {"n": "QUESTION 3", "t": "Would a quiet office fifteen minutes away be better than working at home?", "ja": "十五分の場所にある静かな職場は、在宅勤務よりよいですか？", "f": ["Which part of the office would help most?", "Would a short commute make the office more attractive?"]}, {"n": "QUESTION 4", "t": "Which task is worth meeting a team in person for?", "ja": "どんな作業なら、チームが直接会う価値がありますか？", "f": ["What would the team need to do together?", "Which is easier in person: planning or solving a disagreement?"]}, {"n": "QUESTION 5", "t": "What can make a workday at home feel less lonely?", "ja": "在宅勤務の日に孤独を感じにくくするには、何が役立ちますか？", "f": ["Would a short call with a coworker help?", "Which would help more: lunch outside or an online chat?"]}, {"n": "QUESTION 6", "t": "What would make you switch to the other workplace?", "ja": "どんな条件なら、もう一方の働く場所に変えますか？", "f": ["A shorter commute or a private room?", "Which problem would need to disappear?"]}]}, {"n": 11, "title": "독학하기, 수업 듣기?", "sub": "独学する？教室で学ぶ？", "titles": {"ko": "독학하기, 수업 듣기?", "en": "Learn on your own or take a class?", "ja": "独学する？教室で学ぶ？"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-balance-games-full/117-studying-in-a-cafe-or-at-home/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-full/117-studying-in-a-cafe-or-at-home/lecture/index.html", "source": "courses/en/talk-balance-games-full/lessons/117-studying-in-a-cafe-or-at-home/lecture/index.html"}, {"href": "view/talk-balance-games-full/117-studying-in-a-cafe-or-at-home/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-full/117-studying-in-a-cafe-or-at-home/prestudy/index.html", "source": "courses/en/talk-balance-games-full/lessons/117-studying-in-a-cafe-or-at-home/prestudy/index.html"}], "goal": {"t": "Let’s compare learning independently with taking a class, then explain when feedback, structure, or freedom matters most. Please read the title aloud.", "ja": "独学と授業で学ぶ場合を比べ、フィードバック、決まった進め方、自由さのどれが重要になるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What’s one skill you taught yourself?", "ja": "独学で身につけた技能は何ですか？", "f": ["How did you learn it?", "If none, what would you like to learn alone?"]}, {"n": "WARM-UP 2", "t": "What’s one class that was worth your time?", "ja": "受けてよかったと思う授業や講座は何ですか？", "f": ["What made the teacher or group useful?", "If none, what class would you try?"]}, {"n": "QUESTION 1", "t": "If you started a new language or instrument, would you learn alone or take a class?", "ja": "新しい言語や楽器を始めるなら、独学しますか、それとも授業を受けますか？", "f": ["Which one are you imagining?", "What would you do in the first week?"]}, {"n": "QUESTION 2", "t": "Which part of learning is easier to do alone?", "ja": "学ぶ過程のどんな部分は、一人でするほうが簡単ですか？", "f": ["Does learning at your own speed help?", "Would you use a book or a video?"]}, {"n": "QUESTION 3", "t": "What skill needs feedback from another person?", "ja": "どんな技能には、ほかの人からのフィードバックが必要ですか？", "f": ["Pronunciation, sport, or something else?", "What might be hard to notice alone?"]}, {"n": "QUESTION 4", "t": "Would a free online course keep you motivated for three months?", "ja": "無料のオンライン講座だけで、三か月間やる気を保てますか？", "f": ["What routine would help?", "What might make you quit?"]}, {"n": "QUESTION 5", "t": "When is a class worth paying for?", "ja": "どんなときなら、授業にお金を払う価値がありますか？", "f": ["Is feedback or a fixed schedule more valuable?", "How much would feel reasonable?"]}, {"n": "QUESTION 6", "t": "What would make you switch from one learning method to the other?", "ja": "どんなことがあれば、もう一方の学び方に変えますか？", "f": ["Would slow progress make you switch?", "Would one excellent teacher change your mind?"]}]}, {"n": 12, "title": "온라인 쇼핑, 매장 쇼핑?", "sub": "オンライン、それとも店で買い物？", "titles": {"ko": "온라인 쇼핑, 매장 쇼핑?", "en": "Shopping online or in a shop?", "ja": "オンライン、それとも店で買い物？"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-balance-games-full/118-shopping-online-or-in-a-shop/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-full/118-shopping-online-or-in-a-shop/lecture/index.html", "source": "courses/en/talk-balance-games-full/lessons/118-shopping-online-or-in-a-shop/lecture/index.html"}, {"href": "view/talk-balance-games-full/118-shopping-online-or-in-a-shop/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-full/118-shopping-online-or-in-a-shop/prestudy/index.html", "source": "courses/en/talk-balance-games-full/lessons/118-shopping-online-or-in-a-shop/prestudy/index.html"}], "goal": {"t": "Let's compare shopping online and shopping in a shop, then explain what could change your choice. Please read the title aloud.", "ja": "オンラインで買うことと店舗で買うことを比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What makes you trust a product you see online?", "ja": "オンラインで見た商品を信頼できるのは、どんなときですか？", "f": ["Does a clear return policy matter?", "Which do you trust more: customer photos or star ratings?"]}, {"n": "WARM-UP 2", "t": "If you needed a phone charger today, would you check online or visit a shop first?", "ja": "今日スマートフォンの充電器が必要なら、まずオンラインで確認しますか、それとも店へ行きますか？", "f": ["Would price or certainty matter more?", "Would you pay more for the charger today?"]}, {"n": "QUESTION 1", "t": "For an important purchase, would you trust an online order or a shop more?", "ja": "大切な買い物なら、オンライン注文と店のどちらをより信頼しますか？", "f": ["Which product are you imagining?", "Which would you inspect first: shoes or a phone?"]}, {"n": "QUESTION 2", "t": "What would you miss most if physical shops disappeared?", "ja": "実際の店がなくなったら、何が最も恋しくなりますか？", "f": ["Why would you miss that part?", "Which would you miss more: trying things on or asking staff?"]}, {"n": "QUESTION 3", "t": "Would you buy online if it were cheaper but hard to return?", "ja": "ネットのほうが安くても返品が難しいなら、買いますか？", "f": ["What would you check first?", "Would you take the risk for a very cheap item?"]}, {"n": "QUESTION 4", "t": "When would advice from shop staff be worth the trip?", "ja": "どんな買い物なら、店員のアドバイスを聞くために店へ行く価値がありますか？", "f": ["What would you ask them?", "Would advice matter more for clothes or electronics?"]}, {"n": "QUESTION 5", "t": "Which product would you never buy without seeing it in person?", "ja": "実物を見ずには絶対に買わない商品は何ですか？", "f": ["What do you need to check in person?", "Which is riskier online: clothes or electronics?"]}, {"n": "QUESTION 6", "t": "What would make you switch to the other way of shopping?", "ja": "どんな条件なら、もう一方の買い方に変えますか？", "f": ["Would free returns change it?", "Would needing the item today change it?"]}]}, {"n": 13, "title": "모두 기억하기, 나쁜 기억 잊기?", "sub": "すべて覚える、それとも嫌な記憶を忘れる？", "titles": {"ko": "모두 기억하기, 나쁜 기억 잊기?", "en": "Remembering everything or forgetting bad memories?", "ja": "すべて覚える、それとも嫌な記憶を忘れる？"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-balance-games-full/119-remembering-everything-or-forgetting-bad-memories/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-full/119-remembering-everything-or-forgetting-bad-memories/lecture/index.html", "source": "courses/en/talk-balance-games-full/lessons/119-remembering-everything-or-forgetting-bad-memories/lecture/index.html"}, {"href": "view/talk-balance-games-full/119-remembering-everything-or-forgetting-bad-memories/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-full/119-remembering-everything-or-forgetting-bad-memories/prestudy/index.html", "source": "courses/en/talk-balance-games-full/lessons/119-remembering-everything-or-forgetting-bad-memories/prestudy/index.html"}], "goal": {"t": "Let's compare remembering everything and forgetting bad memories, then explain what could change your choice. Please read the title aloud.", "ja": "すべてを覚えていることとつらい記憶を忘れることを比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What kind of happy memory can a photograph bring back?", "ja": "写真を見ると、どんな楽しい記憶が戻ることがありますか？", "f": ["Which detail returns first?", "Which brings back more: a photo or a song?"]}, {"n": "WARM-UP 2", "t": "Which small ordinary moment is worth remembering for years?", "ja": "長く覚えていたい小さな出来事は何ですか？", "f": ["Why could that ordinary moment matter later?", "Would you record an ordinary day in a diary?"]}, {"n": "QUESTION 1", "t": "Would you rather remember every ordinary detail or be able to forget painful memories?", "ja": "日常の細かいことをすべて覚えるのと、つらい記憶を忘れられるのと、どちらを選びますか？", "f": ["How would your choice help in daily life?", "Which side could also cause problems?"]}, {"n": "QUESTION 2", "t": "What would perfect memory make easier?", "ja": "完全な記憶があれば、何が楽になりますか？", "f": ["Could too much detail become distracting?", "Would perfect memory help more at work or while studying?"]}, {"n": "QUESTION 3", "t": "Would you want perfect memory if every embarrassment stayed vivid too?", "ja": "恥ずかしいことも鮮明に残るなら、完全な記憶がほしいですか？", "f": ["Would embarrassing memories get easier with time?", "Which would bother you more: old mistakes or useless details?"]}, {"n": "QUESTION 4", "t": "Would perfect memory make arguments easier or harder?", "ja": "何でも覚えていたら、口論は解決しやすくなりますか、それとも難しくなりますか？", "f": ["Would remembering the exact words help?", "Is it sometimes better to forget a small mistake?"]}, {"n": "QUESTION 5", "t": "What kind of small mistake is better to forget?", "ja": "どんな小さな失敗なら、忘れたほうがよいですか？", "f": ["Would forgetting help someone move on?", "Is there still a lesson worth keeping?"]}, {"n": "QUESTION 6", "t": "Would you trust yourself to choose which memories to forget?", "ja": "どの記憶を忘れるか、自分で決めることを信頼できますか？", "f": ["What could go wrong?", "Would you wait a month before deciding?"]}]}, {"n": 14, "title": "한 사람의 칭찬, 많은 사람의 인정?", "sub": "一人からの言葉？多くの人からの評価？", "titles": {"ko": "한 사람의 칭찬, 많은 사람의 인정?", "en": "Praise from one person or recognition from many?", "ja": "一人からの言葉？多くの人からの評価？"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-balance-games-full/120-being-rich-and-anonymous-or-respected-on-an-ordinary-income/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-full/120-being-rich-and-anonymous-or-respected-on-an-ordinary-income/lecture/index.html", "source": "courses/en/talk-balance-games-full/lessons/120-being-rich-and-anonymous-or-respected-on-an-ordinary-income/lecture/index.html"}, {"href": "view/talk-balance-games-full/120-being-rich-and-anonymous-or-respected-on-an-ordinary-income/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-full/120-being-rich-and-anonymous-or-respected-on-an-ordinary-income/prestudy/index.html", "source": "courses/en/talk-balance-games-full/lessons/120-being-rich-and-anonymous-or-respected-on-an-ordinary-income/prestudy/index.html"}], "goal": {"t": "Let’s compare personal praise with public recognition, then explain how the person, audience, and consequences could change the choice. Please read the title aloud.", "ja": "個人的な褒め言葉と公の評価を比べ、誰から、どんな人の前で、何が起こるかによって選択がどう変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Whose praise means the most to you?", "ja": "誰から褒められるのが、あなたにとって最もうれしいですか？", "f": ["A friend, family member, teacher, or manager?", "What would you want them to notice?"]}, {"n": "WARM-UP 2", "t": "Would you enjoy being praised in front of a large group?", "ja": "大勢の前で褒められたら、うれしいですか？", "f": ["Would a smaller group feel better?", "What might make it uncomfortable?"]}, {"n": "QUESTION 1", "t": "Would you rather receive a thoughtful message from one person or a public award?", "ja": "一人から心のこもったメッセージをもらうのと、公の場で賞をもらうのと、どちらがよいですか？", "f": ["Which would you remember longer?", "Who would you want the message to come from?"]}, {"n": "QUESTION 2", "t": "What could public recognition help you do next?", "ja": "多くの人から評価されると、次にどんなことができそうですか？", "f": ["Could it open a new opportunity?", "Would it motivate you?"]}, {"n": "QUESTION 3", "t": "When can public praise feel uncomfortable?", "ja": "人前で褒められることが、居心地悪く感じられるのはどんなときですか？", "f": ["Is the attention or the expectation harder?", "Would private thanks feel better?"]}, {"n": "QUESTION 4", "t": "What kind of achievement deserves public recognition?", "ja": "どんな成果なら、公に評価されるべきだと思いますか？", "f": ["An individual success or a team success?", "Who should share the credit?"]}, {"n": "QUESTION 5", "t": "If recognition brought criticism too, would you still want it?", "ja": "評価と一緒に批判も集まるなら、それでも人に知られたいですか？", "f": ["How much criticism would be too much?", "Would it matter who criticized you?"]}, {"n": "QUESTION 6", "t": "What would make you switch to the other kind of praise?", "ja": "どんな条件なら、もう一方の褒められ方を選びますか？", "f": ["Would the size of the audience matter?", "Would the person giving the praise change your answer?"]}]}, {"n": 15, "title": "한 가지에 뛰어나기, 여러 가지를 잘하기?", "sub": "一つに秀でる、それとも多くをこなす？", "titles": {"ko": "한 가지에 뛰어나기, 여러 가지를 잘하기?", "en": "Being great at one thing or good at many?", "ja": "一つに秀でる、それとも多くをこなす？"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-balance-games-full/121-being-great-at-one-thing-or-good-at-many/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-balance-games-full/121-being-great-at-one-thing-or-good-at-many/lecture/index.html", "source": "courses/en/talk-balance-games-full/lessons/121-being-great-at-one-thing-or-good-at-many/lecture/index.html"}, {"href": "view/talk-balance-games-full/121-being-great-at-one-thing-or-good-at-many/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-balance-games-full/121-being-great-at-one-thing-or-good-at-many/prestudy/index.html", "source": "courses/en/talk-balance-games-full/lessons/121-being-great-at-one-thing-or-good-at-many/prestudy/index.html"}], "goal": {"t": "Let's compare deep expertise in one skill and broad ability across many skills, then explain what could change your choice. Please read the title aloud.", "ja": "一つの技能の深い専門性と多くの技能にわたる幅広い能力を比べ、何が変われば選択も変わるか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which skill, if any, have you improved recently?", "ja": "最近、上達した技能があるとしたら何ですか？", "f": ["What helped you improve?", "Which is easier to improve: cooking, exercise, or language?"]}, {"n": "WARM-UP 2", "t": "What’s one skill you would love to be great at?", "ja": "とても上手になりたい技能を一つ挙げるとしたら何ですか？", "f": ["Why that one?", "How often would you practise it?"]}, {"n": "QUESTION 1", "t": "Would you rather become excellent at one skill or good at many?", "ja": "一つの技能の深い専門性と、多くの技能にわたる幅広い能力のどちらを伸ばしたいですか？", "f": ["Which skill or group of skills do you imagine?", "What skill would you happily practise every week for a year?"]}, {"n": "QUESTION 2", "t": "With one year to learn, would you study one skill deeply or try five?", "ja": "学ぶ時間が一年あるなら、一つを深く学ぶのと五つを試すのと、どちらがよいですか？", "f": ["How would you measure progress?", "Would you rather practise daily or try something new each week?"]}, {"n": "QUESTION 3", "t": "On a small team, who helps more: a specialist or someone who can do several jobs?", "ja": "小さなチームでは、一人の専門家と、いくつもの仕事ができる人のどちらが役立ちますか？", "f": ["Why would that person help the team?", "Can a flexible worker help when a teammate is absent?"]}, {"n": "QUESTION 4", "t": "Which new skill would you rather learn: cooking, photography, or first aid?", "ja": "新しく学ぶなら、料理、写真、応急手当のどれがよいですか？", "f": ["Why would that skill be useful?", "Which is easiest to practise at home: cooking, photography, or first aid?"]}, {"n": "QUESTION 5", "t": "When would several good skills help more than being excellent at that one?", "ja": "その一つを極めるより、いくつかの技能が得意なほうが役立つのはどんなときですか？", "f": ["At home or at work?", "Where would a specialist still be better?"]}, {"n": "QUESTION 6", "t": "Which skill would you be happy to stay only average at?", "ja": "平均くらいのままでも構わない技能は何ですか？", "f": ["Why is “good enough” enough?", "Would you still enjoy learning it?"]}]}]}], "covers": ["covers/talk-between-two-countries-accessible.webp", "covers/talk-between-two-countries-full.webp", "covers/talk-me-lately-accessible.webp"], "dist": {"B1": 121, "C1": 121}, "span": ["B1", "C1"], "total": 242, "unitCount": 22, "decks": [{"n": 1, "title": "다른 나라 문화에서 놀란 것", "titles": {"ko": "다른 나라 문화에서 놀란 것", "en": "Something that surprised you about another culture", "ja": "他の国の文化で驚いたこと"}, "href": "view/talk-between-two-countries-accessible/01-this-surprised-me/lecture", "level": "수업용", "slot" /* ---------- 3·4·5단 ---------- */
function chips(l) {
  const p = chipList(l).slice(0, 2).map(c =>
    `<span class="pat" title="${esc(c)}">${esc(c.replace(/\s+\(.*$/, "").trim() || c)}</span>`);
  if (l.refs && l.refs.length) p.push(`<span class="pat ref">${esc(t("ui","coreRef"))} ${l.refs[0]}</span>`);
  return p.join(`<span class="sep">·</span>`);
}

/** 문장을 그대로 쓰되, 배우는 조각에만 mark 를 씌운다. spans 는 빌드 때 계산된다. */
function marked(sentence, spans) {
  if (!spans || !spans.length) return esc(sentence);
  let out = "", last = 0;
  for (const [a, b] of spans) {
    out += esc(sentence.slice(last, a)) + "<mark>" + esc(sentence.slice(a, b)) + "</mark>";
    last = b;
  }
  return out + esc(sentence.slice(last));
}

/** 한글 학습 항목 안의 낱자 묶음만 크게 보여 준다. 설명은 그대로 두어 규칙의 맥락을 잃지 않는다. */
function markedJamo(text) {
  return esc(text).replace(/[ㄱ-ㅎㅏ-ㅣ](?:[\s＋/·–→]*[ㄱ-ㅎㅏ-ㅣ])*/g,
    chars => `<strong class="jamo">${chars}</strong>`);
}

/** 펼친 과는 라벨 붙은 칸 셋으로 이루어진다 — 무엇을 할 수 있게 되는가,
    무엇을 배우는가, 그리고 그것을 받쳐 주는 말. 트랙마다 칸의 이름만 달라진다. */
/** 목표 문장을 지금 표시 언어로. canDo 는 학습자가 말하는 한국어가 아니라 "무엇을 할
    수 있게 되는가" 의 설명이라, 일본어로 보는 사람에게는 일본어여야 한다. 일본어가
    아직 없는 줄만 한국어 원문으로 남는다. */
/** 배울 거리 칩. 패턴 자체는 한국어 그대로지만, 몇몇 줄에 붙은 설명은 일본어를 갖는다. */
function chipList(l) {
  const alt = l.chipsL10n && l.chipsL10n[L];
  return (alt && alt.length) ? alt : (l.chips || []);
}

function canText(l, fallback) {
  return (l.cans && l.cans[L]) || fallback || "";
}

function detail(l) {
  const fields = [];
  const isHangul = T.id === "1-hangul";

  // 한글에서는 배울 글자·규칙이 본문이고, 읽을 수 있는 단어는 그 결과를 확인하는 예시다.
  if (isHangul && l.chips && l.chips.length) {
    fields.push({kind: "hangul-core", label: t("detail","learnThis"),
      body: `<div class="hangul-focus">${chipList(l).map(c =>
        `<div class="hangul-focus-item"><span>${markedJamo(c)}</span></div>`).join("")}</div>`});
  }
  if (isHangul && l.can) {
    // "낱말 · 낱말 · 낱말 — 지시문" 한 줄이다. 낱말은 읽을 대상이라 한국어 그대로 칩이
    // 되고, 지시문만 일본어를 갖는다. 낱말 목록이 아니면 통째로 목표 문장으로 다룬다.
    const [head, ...rest] = l.can.split(/\s+—\s+/);
    const tail = rest.join(" — ");
    const words = head.split(" · ").map(w => w.trim()).filter(Boolean);
    const note = canText(l, tail);
    if (words.length >= 2) {
      fields.push({kind: "hangul-practice", label: t("detail","readPractice"),
        body: `<div class="hangul-practice">${words.map(w => `<span>${esc(w)}</span>`).join("")}</div>`
          + (note ? `<p class="goal">${esc(note)}</p>` : "")});
    } else {
      fields.push({kind: "goal", label: t("detail","readGoal"),
        body: `<p class="goal">${esc(canText(l, l.can))}</p>`});
    }
  }

  // ① 이 과의 약속
  if (l.can && !isHangul) {
    const canNow = canText(l, l.can);
    const words = canNow.split(" · ").map(w => w.trim()).filter(Boolean);
    const listy = words.length >= 3 && words.every(w => w.length <= 7);
    const goalLabel = l.canLabel === "읽을 수 있다" ? t("detail","readGoal")
      : l.canLabel === "이야기한다" ? t("detail","talkGoal")
      : l.canLabel === "일본어의 습관" ? t("detail","fixPoint") : t("detail","lessonGoal");
    fields.push({kind: "goal", label: goalLabel, body: listy
      ? `<div class="words">${words.map(w => `<span>${esc(w)}</span>`).join("")}</div>`
      : `<p class="goal">${esc(canNow)}</p>`});
  }

  // ② 배우는 것 — 패턴이 있으면 예문 안에서 짚어 주고, 없으면 이름만 늘어놓는다
  const ps = (l.pats || []).filter(p => p.ex || p.pat);
  if (ps.length) {
    fields.push({kind: "patterns", label: t("detail","corePatterns"), body: `<div class="pats">` + ps.map(p => `<div class="pcard">
      ${p.ex ? `<p class="sent">${marked(p.ex, p.spans)}</p>` : ""}
      ${p.reply ? `<p class="reply">${esc(p.reply)}</p>` : ""}
      <div class="pmeta"><span class="pname">${esc(p.pat)}</span>
        ${p.gloss ? `<span class="pgloss">${esc(p.gloss)}</span>` : ""}</div></div>`).join("") + `</div>`});
  } else if (l.fix) {
    fields.push({kind: "goal", label: t("detail","howToFix"), body: `<p class="goal">${esc(l.fix)}</p>`});
  }
  if (l.chips && l.chips.length && !ps.length && !isHangul) {
    fields.push({kind: "items", label: l.fix ? t("detail","minPairs") : t("detail","learning"),
      body: `<div class="said">${chipList(l).map(c => `<span>${esc(c)}</span>`).join("")}</div>`});
  }

  // ③ 받쳐 주는 말 — 통째로 외워 쓰는 표현과, 딱 한 줄짜리 규칙
  const said = (l.notes || []).find(n => n.k === "표현");
  const rule = (l.notes || []).find(n => n.k === "문법");
  if (said || rule) {
    // 트랙마다 구분자가 다르다: 핵심은 ·, 상황별은 쉼표. 쉼표로도 나누되 · 로 갈린
    // 뒤에는 건드리지 않는다 — "아, 그래요?" 처럼 쉼표를 품은 한 덩어리가 있다.
    let ws = [];
    if (said) {
      ws = said.v.split(/\s*·\s*/).filter(Boolean);
      if (ws.length === 1) ws = ws[0].split(/\s*,\s*/).filter(Boolean);
    }
    fields.push({kind: "support", label: said && rule ? t("detail","saidAndRule") : said ? t("detail","saidNow") : t("detail","rule"),
      body: (ws.length ? `<div class="said">${ws.map(w => `<span>${esc(w)}</span>`).join("")}</div>` : "")
      + (rule ? `<p class="rule">${esc(rule.v)}</p>` : "")});
  }

  // ④ 덱이 스스로 말하는 오늘의 목표. canDo 를 대신하지 않고 옆에 선다 —
  //    canDo 는 커리큘럼이 적은 목표, 이쪽은 학습자가 덱에서 실제로 읽는 문장이다.
  if (l.goal && (l.goal.t || l.goal.ja)) {
    fields.push({kind: "deckgoal", label: t("detail","deckGoal"), body:
      (l.goal.t ? `<p class="goal">${esc(l.goal.t)}</p>` : "")
      + (showJa() && l.goal.ja ? `<p class="goal-ja">${esc(l.goal.ja)}</p>` : "")});
  }

  // ⑤ 프리토킹 과가 그날 실제로 묻는 것 전부. 덱을 열지 않고도 주제가 맞는지
  //    판단할 수 있어야 이 트랙의 목차가 의미를 갖는다 — 문법이 아니라 질문이
  //    그 과의 내용이기 때문이다.
  if (l.qs && l.qs.length) {
    fields.push({kind: "questions",
      label: `${t("detail","questions")} · ${t("detail","questionsN").replace("{n}", l.qs.length)}`,
      body: `<ol class="qs">` + l.qs.map(q => `<li class="qitem">
        ${q.n ? `<span class="qn">${esc(qLabel(q.n))}</span>` : ""}
        ${q.t ? `<p class="qt">${esc(q.t)}</p>` : ""}
        ${showJa() && q.ja ? `<p class="qja">${esc(q.ja)}</p>` : ""}
        ${(q.f && q.f.length) ? `<ul class="qf" aria-label="${esc(t("detail","followUps"))}">`
            + q.f.map(x => `<li>${esc(x)}</li>`).join("") + `</ul>` : ""}
      </li>`).join("") + `</ol>`});
  }

  if (!fields.length) return `<p class="scene">${esc(t("detail","noDetail"))}</p>`;
  return (l.scene ? `<p class="scene">${esc(l.scene)}</p>` : "")
    + fields.map(f => `<section class="field field-${f.kind}"><span class="lbl">${esc(f.label)}</span>${f.body}</section>`).join("");
}

/** 덱 슬롯의 이름. 빌드가 넘긴 한국어 라벨 대신 표시 언어로 부른다. */
function slotLabel(d) {
  return d.slot ? t("ui", d.slot === "prestudy" ? "slotPrestudy" : "slotLecture") : (d.level || "");
}

/** 덱이 한국어로만 들고 있는 질문 번호표("몸풀기 1", "질문 3")를 표시 언어로 옮긴다.
    종류만 갈아 끼우고 번호는 그대로 둔다 — 모르는 모양이면 원문을 그대로 쓴다. */
const QN_KIND = {"몸풀기": "qWarmup", "질문": "qQuestion"};
function qLabel(n) {
  const m = /^(\S+)\s*(\d+)$/.exec(String(n || "").trim());
  const key = m && QN_KIND[m[1]];
  return key ? `${t("ui", key)} ${m[2]}` : (n || "");
}

function lessonRow(l, groupIndex, lessonIndex) {
  const c = chips(l);
  const firstLabel = `${t("ui","lessonWord")} 1`;
  const name = loc(l.titles) || l.title;
  // l.sub 는 일본어 제목이다 — 일본어로 볼 때는 제목 그 자체라 두 번 적을 이유가 없다.
  const sub = (l.sub === firstLabel || l.sub === name) ? "" : l.sub || (c ? "" : l.can);
  const firstTag = l.first ? `<span class="first-tag">${esc(firstLabel)}</span>` : "";
  const no = String(l.n).padStart(2, "0");
  // 덱이 있으면 그 과에서 곧장 수업 화면으로 나간다 — 카탈로그를 잃지 않도록 새 탭에서.
  const variants = l.decks || (l.deck ? [{href:l.deck, level:""}] : []);
  const showLevels = (l.levels || []).length > 1 || variants.length > 1;
  const deck = variants.length ? `<div class="deck-links">${variants.map(d =>
    `<a class="deck" href="../${esc(d.href)}" target="_blank" rel="noopener"
       title="${esc(t("ui","openInNewTab").replace("{title}", name))}">${showLevels ? esc(slotLabel(d)) : esc(t("ui","openDeck"))} <span class="ext">↗</span></a>`
  ).join("")}</div>` : "";
  const detailId = `group-${groupIndex + 1}-lesson-${lessonIndex + 1}-detail`;
  return `<div class="lesson" data-text="${esc([l.title, l.sub, l.can, l.scene, (l.chips||[]).join(" "), (l.notes||[]).map(n=>n.v).join(" ")].join(" ").toLowerCase())}">
    <div class="lrow">
      <button class="lrow-btn" type="button" aria-expanded="false" aria-controls="${detailId}">
        <span class="lno">${esc(t("ui","lessonWord"))} ${no}</span>
        <span class="ltitle">${esc(name)}${sub ? ` <em>— ${esc(sub)}</em>` : ""}${firstTag}</span>
        <span class="lchips">${c}</span>
      </button>
      ${deck}
    </div>
    <div class="ldetail" id="${detailId}">${detail(l)}</div>
  </div>`;
}

function group(g, index) {
  // 단원 머리에는 "이 단원이 무엇인가"만 둔다.
  //   · 패턴 목록은 바로 아래 과 목록이 이미 한 줄씩 들고 있다 — 같은 것을 두 번 적는 셈이었다
  //   · 단원 설명문은 이 커리큘럼을 왜 이렇게 짰는지에 대한 메모라, 훑어보는 자리에 놓일 글이 아니다
  // 둘 다 지우면 남는 것은 이야기와 성과, 그리고 과 목록뿐이다.
  let head = "";
  // 이 코스가 무엇을 하는 코스인지 한 줄. 펼쳤을 때 제일 먼저 읽히는 자리이고,
  // 목록이 시작되기 전에 "여기가 맞는 코스인가" 를 판단할 수 있는 유일한 문장이다.
  if (g.desc && loc(g.desc)) {
    head += `<p class="story">${esc(loc(g.desc))}</p>`;
  }
  if (g.work) {
    head += `<p class="story"><b>《${esc(g.work)}》</b> ${esc(g.story)}
      ${g.cast ? `<span class="cast">${esc(t("ui","cast"))} — ${esc(g.cast)}</span>` : ""}</p>`;
  }
  if (g.blurb && (g.work || T.id === "3-contextual-korean")) {
    head += `<p class="gcan"><b class="lbl">${esc(t("ui","groupCan"))}</b>${esc(g.blurb)}</p>`;
  }

  const bodyId = `group-${index + 1}-body`;
  // 코스 제목도 세 언어가 있다. 부제의 일이란 "일본어로는 이렇게 부른다" 였으니,
  // 제목이 이미 일본어인 화면에서는 같은 말을 두 번 적는 것이 된다.
  const gTitle = loc(g.titles) || g.title;
  const gSub = L === "ja" ? "" : ((g.titles && g.titles.ja) || g.subtitle);
  const groupLevels = g.levels || (g.level ? [g.level] : []);
  const levelTags = groupLevels.map(lv =>
    `<span class="lv-tag"><i style="background:${lvColor(lv)}"></i>${esc(lvName(lv))}</span>`).join("");
  return `<div class="group" data-lv="${esc(groupLevels.join(" "))}">
    <button class="ghead" type="button" aria-expanded="false" aria-controls="${bodyId}">
      <span class="gmark">${g.cover ? `<i class="cov" style="background-image:url(../${esc(g.cover)})"></i>` : ""}</span>
      <span class="gnum">${g.no ? `${g.no}${esc(t("ui","unitWord"))}` : esc(g.label)}</span>
      <span class="gtitle">${esc(gTitle)}${gSub ? `<em>${esc(gSub)}</em>` : ""}</span>
      <span class="gmeta">${g.peak ? `<span>${esc(t("ui","peakUpTo").replace("{n}", g.peak))}</span>` : ""}${g.form ? `<span>${esc(g.form)}</span>` : ""}
        ${levelTags}
        <span>${g.lessons.length} ${esc(t("ui","lessonWord"))}</span><span class="caret"></span></span>
    </button>
    <div class="gbody" id="${bodyId}">
      <div class="plate">${g.cover ? `<span class="cov-slot"></span>` : ""}<div class="plate-copy">${head}</div></div>
      <div class="lessons">${g.lessons.map((l, lessonIndex) => lessonRow(l, index, lessonIndex)).join("")}</div>
    </div>
  </div>`;
}

const $groups = document.getElementById("groups");

/* ---------- 표지가 자라는 자리 ----------
   36px 표시와 118px 표지는 같은 요소다. 옮기고, 옮기기 전 자리에서 옮긴 뒤 자리로
   날린다. 나는 동안에는 흐름 밖의 복제가 대신 움직여서, 지나가는 자리가 다시 배치되는
   일이 없다 — 원본은 이미 목적지에 앉아 있고 잠깐 숨어 있을 뿐이다. */
const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const MOVE = {duration: 280, easing: "cubic-bezier(.2,.7,.3,1)"};

function flyCover(cover, from, to) {
  if (REDUCED_MOTION || !from || !to || !from.width || !to.width) return;
  const ghost = document.createElement("div");
  ghost.className = "cov cov-flying";
  ghost.style.backgroundImage = cover.style.backgroundImage;
  document.body.appendChild(ghost);
  cover.style.visibility = "hidden";
  const at = (r, radius) => ({left: r.left + "px", top: r.top + "px", width: r.width + "px",
                              height: r.height + "px", borderRadius: radius});
  ghost.animate([at(from, "2px"), at(to, "4px")], {...MOVE, fill: "both"})
    .finished.catch(() => {}).then(() => { ghost.remove(); cover.style.visibility = ""; });
}

/** 표지를 그 코스의 상태에 맞는 자리에 놓는다. 표시 언어가 바뀌면 목록이 통째로 다시
    그려지는데(`redraw`), 펼쳐 둔 자리는 그 뒤에 되살아난다 — 그때 표지도 따라가야 한다. */
function placeCovers() {
  $groups.querySelectorAll(".group").forEach(group => {
    const cover = group.querySelector(".cov");
    if (!cover) return;
    const home = group.classList.contains("open")
      ? group.querySelector(".cov-slot") : group.querySelector(".gmark");
    if (home && cover.parentElement !== home) home.appendChild(cover);
  });
}

/** 언어가 바뀌면 목록을 다시 그린다. 펼쳐 둔 자리를 자리 번호로 기억했다가 되돌려
    준다 — 언어를 바꿨다고 보던 곳을 잃으면 전환이 벌처럼 느껴진다. */
function redraw() {
  const openG = [...$groups.querySelectorAll(".group")].map(el => el.classList.contains("open"));
  const openL = [...$groups.querySelectorAll(".lesson")].map(el => el.classList.contains("open"));
  $groups.innerHTML = T.groups.map(group).join("");
  $groups.querySelectorAll(".group").forEach((el, i) => {
    if (openG[i]) { el.classList.add("open"); el.querySelector(".ghead").setAttribute("aria-expanded", "true"); }
  });
  $groups.querySelectorAll(".lesson").forEach((el, i) => {
    if (openL[i]) { el.classList.add("open"); el.querySelector(".lrow-btn").setAttribute("aria-expanded", "true"); }
  });
  placeCovers();                                // 펼친 코스의 표지는 본문에 있어야 한다
  if (typeof apply === "function") apply();     // 검색·레벨 필터를 다시 먹인다 (표지를 다시 놓는다)
}

$groups.innerHTML = T.groups.map(group).join("");

/* ---------- 이전 · 다음 트랙 ---------- */
{
  const i = DATA.nav.findIndex(n => n.id === T.id);
  const prev = DATA.nav[i - 1], next = DATA.nav[i + 1];
  document.getElementById("nextrack").innerHTML =
    (prev ? `<a href="${esc(prev.id)}">← ${esc(loc({ko:prev.ko, ja:prev.ja, en:prev.en}) || prev.ko)}</a>` : `<a href="../">← ${esc(t("ui","catalog"))}</a>`) +
    (next ? `<a href="${esc(next.id)}">${esc(loc({ko:next.ko, ja:next.ja, en:next.en}) || next.ko)} →</a>` : `<a href="../">${esc(t("ui","catalog"))} →</a>`);
}

/* ---------- behaviour ---------- */
$groups.addEventListener("click", e => {
  if (e.target.closest(".deck")) return;          // 덱 링크는 펼치기가 아니라 나가기다
  const head = e.target.closest(".ghead");
  if (head) {
    const group = head.parentElement;
    const cover = group.querySelector(".cov");
    const from = cover ? cover.getBoundingClientRect() : null;
    const mark = group.querySelector(".gmark");
    const was = mark ? mark.getBoundingClientRect().width : 0;
    const wasMargin = mark ? parseFloat(getComputedStyle(mark).marginLeft) || 0 : 0;

    // 미끄러짐을 잠시 끄고 새 배치를 확정한다 — 표지가 내려앉을 자리를 재려면
    // 자리 자체가 움직이는 중이면 안 된다.
    if (mark) mark.style.transition = "none";
    const open = group.classList.toggle("open");
    head.setAttribute("aria-expanded", open);
    if (cover) (open ? group.querySelector(".cov-slot") : mark).appendChild(cover);
    if (mark) {
      void mark.offsetWidth;
      const now = mark.getBoundingClientRect().width;
      const nowMargin = parseFloat(getComputedStyle(mark).marginLeft) || 0;
      mark.style.transition = "";
      if (cover) flyCover(cover, from, cover.getBoundingClientRect());
      if (!REDUCED_MOTION) {
        mark.animate([{width: was + "px", marginLeft: wasMargin + "px"},
                      {width: now + "px", marginLeft: nowMargin + "px"}], MOVE);
      }
    }
    return;
  }
  const row = e.target.closest(".lrow-btn");
  if (row) {
    const open = row.closest(".lesson").classList.toggle("open");
    row.setAttribute("aria-expanded", open);
  }
});

const $q = document.getElementById("q");
const $hits = document.getElementById("hits");
const $empty = document.getElementById("empty");
let activeLevels = new Set();

function apply() {
  const q = $q.value.trim().toLowerCase();
  let hits = 0, shown = 0;
  document.querySelectorAll(".group").forEach(g => {
    const groupLevels = new Set(g.dataset.lv.split(" ").filter(Boolean));
    const lvOk = !activeLevels.size || [...activeLevels].some(lv => groupLevels.has(lv));
    let inGroup = 0;
    g.querySelectorAll(".lesson").forEach(l => {
      const ok = lvOk && (!q || l.dataset.text.includes(q));
      l.classList.toggle("hide", !ok);
      if (ok) inGroup++;
    });
    g.classList.toggle("hide", inGroup === 0);
    if (inGroup) shown++;
    hits += inGroup;
    if (q) {
      g.classList.add("open");
      g.querySelector(".ghead")?.setAttribute("aria-expanded", "true");
    }
  });
  placeCovers();   // 검색이 코스를 펼치기도 한다 — 표지가 접힌 자리에 남으면 사라진다
  const filtering = q || activeLevels.size;
  $hits.textContent = filtering
    ? `${hits} ${t("ui","lessonWord")} · ${shown} ${t("ui","unitWord")}` : "";
  $empty.classList.toggle("hide", !(filtering && hits === 0));

  if (q) {
    document.querySelectorAll(".lesson:not(.hide) .ltitle").forEach(el => {
      const t = el.textContent, i = t.toLowerCase().indexOf(q);
      if (i < 0) return;
      el.innerHTML = esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length));
    });
  }
}

$q.addEventListener("input", () => {
  document.querySelectorAll(".ltitle mark").forEach(m => { const p = m.parentElement; p.innerHTML = p.textContent; });
  apply();
});

document.getElementById("levelbar").addEventListener("click", e => {
  const b = e.target.closest(".lv");
  if (!b) return;
  const lv = b.dataset.lv;
  activeLevels.has(lv) ? activeLevels.delete(lv) : activeLevels.add(lv);
  b.setAttribute("aria-pressed", activeLevels.has(lv));
  apply();
});

const $units = document.getElementById("expandUnits");
const $all = document.getElementById("expandAll");

function setOpen(units, lessons) {
  document.querySelectorAll(".group").forEach(g => {
    g.classList.toggle("open", units);
    g.querySelector(".ghead")?.setAttribute("aria-expanded", units);
  });
  document.querySelectorAll(".lesson").forEach(l => {
    l.classList.toggle("open", lessons);
    l.querySelector(".lrow-btn")?.setAttribute("aria-expanded", lessons);
  });
  placeCovers();   // 한꺼번에 여닫는 자리. 표지도 함께 옮겨야 자리를 잃지 않는다
  $units.classList.toggle("on", units && !lessons);
  $all.classList.toggle("on", lessons);
  $units.textContent = t("ui", units && !lessons ? "collapseUnits" : "expandUnits");
  $all.textContent = t("ui", lessons ? "collapseAll" : "expandAll");
}
$units.addEventListener("click", () => setOpen(!$units.classList.contains("on"), false));
$all.addEventListener("click", () => { const on = !$all.classList.contains("on"); setOpen(on, on); });

// 들어오자마자 첫 단원은 열어 둔다 — 이 페이지는 이미 한 트랙으로 좁혀진 자리라,
// 무엇이 들어 있는지 한 번은 보여 주는 편이 낫다.
/* ---- 표시 언어 ---------------------------------------------------------- */

/** data-i18n 이 붙은 자리를 지금 언어로 채운다. 마크업의 한국어는 기본값으로 남는다 —
    JS 가 죽어도 페이지는 읽히는 상태여야 한다. */
function paintStatic() {
  document.querySelectorAll("[data-i18n-label]").forEach(el => {
    const [sec, key] = el.getAttribute("data-i18n-label").split(".");
    const v = t(sec, key); if (v) el.setAttribute("aria-label", v);
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    const [sec, key] = el.getAttribute("data-i18n-ph").split(".");
    const v = t(sec, key); if (v) el.placeholder = v;
  });
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const [sec, key] = el.getAttribute("data-i18n").split(".");
    const v = t(sec, key);
    if (v) el.textContent = v;
  });
  document.documentElement.lang = L;
  paintLangNav();
}

function paintLocaleBar() {
  const bar = document.getElementById("loc");
  if (!bar) return;
  bar.setAttribute("aria-label", t("locale", "label"));
  bar.innerHTML = LOCALES.map(code =>
    `<button type="button" data-loc="${code}" aria-pressed="${code === L}">` +
    `${esc((I18N.locale[code] || {})[code] || code)}</button>`).join("");
}

function setLocale(next) {
  if (!LOCALES.includes(next) || next === L) return;
  L = next;
  try { localStorage.setItem(LS_KEY, L); } catch (e) {}
  paintStatic(); paintLocaleBar(); paintTrack(); redraw();
  // 펼침 버튼의 말은 지금 펼쳐진 상태에 달렸다 — 상태를 읽어 그대로 다시 적는다.
  setOpen($units.classList.contains("on"), $all.classList.contains("on"));
}

document.getElementById("loc").addEventListener("click", e => {
  const b = e.target.closest("button[data-loc]");
  if (b) setLocale(b.dataset.loc);
});

paintStatic();
paintLocaleBar();
paintTrack();

const firstGroup = document.querySelector(".group");
firstGroup?.classList.add("open");
firstGroup?.querySelector(".ghead")?.setAttribute("aria-expanded", "true");
placeCovers();   // 첫 코스는 열린 채로 그려진다 — 그 표지는 처음부터 본문에 있어야 한다
</script>
