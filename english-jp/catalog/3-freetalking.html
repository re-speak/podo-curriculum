ing to rest or do something?", "What would make it feel different from a weekday?"]}, {"n": "WARM-UP 2", "t": "What would make this weekend feel well spent?", "ja": "今週末を有意義だったと感じるには、何があればよいですか？", "f": ["What would leave you feeling refreshed?", "What would make the weekend feel wasted?"]}, {"n": "QUESTION 1", "t": "Do you like weekends planned or open?", "ja": "週末は予定を決めたいですか、それとも空けておきたいですか？", "f": ["Which plans benefit from structure?", "When does an open day feel better?"]}, {"n": "QUESTION 2", "t": "Which sounds better this weekend: time alone or time with someone?", "ja": "今週末は、一人の時間と誰かと過ごす時間のどちらがよさそうですか？", "f": ["What kind of company would fit your mood?", "How much time alone would you still want?"]}, {"n": "QUESTION 3", "t": "What's one simple thing you would enjoy this weekend?", "ja": "今週末に楽しめそうな、簡単なことを一つ挙げるとしたら何ですか？", "f": ["Why does that sound good right now?", "Who, if anyone, would you invite?"]}, {"n": "QUESTION 4", "t": "What usually makes you change a weekend plan?", "ja": "週末の予定を変えるのは、ふつうどんな理由からですか？", "f": ["Which change is easy to accept?", "When does a change improve the weekend?"]}, {"n": "QUESTION 5", "t": "What part of a weekend is worth planning ahead?", "ja": "週末のどんなことは、前もって決める価値がありますか？", "f": ["Which decision becomes harder at the last minute?", "What is better left spontaneous?"]}, {"n": "QUESTION 6", "t": "If a plan gets canceled, what's your best backup?", "ja": "予定が中止になったら、いちばんよい代わりの過ごし方は何ですか？", "f": ["Could the backup be better than the original plan?", "How quickly would you decide what to do?"]}]}, {"n": 6, "title": "올해 안에 하고 싶은 한 가지", "sub": "今年中にまだやりたいこと", "titles": {"ko": "올해 안에 하고 싶은 한 가지", "en": "One thing you still want to do this year", "ja": "今年中にまだやりたいこと"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-me-lately-full/14-one-thing-you-still-want-to-do-this-year/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-full/14-one-thing-you-still-want-to-do-this-year/lecture/index.html", "source": "courses/en/talk-me-lately-full/lessons/14-one-thing-you-still-want-to-do-this-year/lecture/index.html"}, {"href": "view/talk-me-lately-full/14-one-thing-you-still-want-to-do-this-year/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-full/14-one-thing-you-still-want-to-do-this-year/prestudy/index.html", "source": "courses/en/talk-me-lately-full/lessons/14-one-thing-you-still-want-to-do-this-year/prestudy/index.html"}], "goal": {"t": "Let's choose one goal and find a realistic first step. Please read the title aloud.", "ja": "目標を一つ選び、現実的な最初の一歩を考えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one thing you'd like to finish this year?", "ja": "今年中に終わらせたいことを一つ挙げるとしたら何ですか？", "f": ["What would completing it change?", "What might you need to put aside?"]}, {"n": "WARM-UP 2", "t": "If you could finish one unfinished thing this month, what would you choose?", "ja": "今月、やり残していることを一つ終えられるなら、何を選びますか？", "f": ["Why would you choose that first?", "How much time would it need?"]}, {"n": "QUESTION 1", "t": "Which goal would make the biggest difference to your everyday life this year?", "ja": "今年、日常生活にいちばん大きな変化をもたらしそうな目標は何ですか？", "f": ["What would change first?", "What makes the goal worth your time?"]}, {"n": "QUESTION 2", "t": "Which gets in the way more: time, money, or doubt?", "ja": "目標の邪魔になりやすいのは、時間、お金、自信のなさのどれですか？", "f": ["How does that problem usually appear?", "What small step could help?"]}, {"n": "QUESTION 3", "t": "When is dropping a goal a smart decision?", "ja": "目標をやめることが賢い判断になるのは、どんなときですか？", "f": ["How do you know it is time to stop trying?", "Is stopping always the same as failing?"]}, {"n": "QUESTION 4", "t": "How can sharing a goal make success feel different?", "ja": "目標を誰かに話すと、達成したときの気持ちはどう変わりますか？", "f": ["Who, if anyone, would understand the effort?", "Would you share it with one person or keep it private?"]}, {"n": "QUESTION 5", "t": "What kind of goal is okay to change as life changes?", "ja": "生活が変わったとき、どんな目標なら変えてもよいと思いますか？", "f": ["What should stay important?", "Is it okay to make a goal smaller when life gets busy?"]}, {"n": "QUESTION 6", "t": "What's one useful first step toward a difficult goal?", "ja": "難しい目標に向かう、役に立つ最初の一歩は何ですか？", "f": ["Why is that step small enough to start?", "What would show that it worked?"]}]}, {"n": 7, "title": "돈을 가장 많이 쓰는 것", "sub": "いちばんお金を使っているもの", "titles": {"ko": "돈을 가장 많이 쓰는 것", "en": "What you spend the most money on", "ja": "いちばんお金を使っているもの"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-me-lately-full/15-what-you-spend-the-most-money-on/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-full/15-what-you-spend-the-most-money-on/lecture/index.html", "source": "courses/en/talk-me-lately-full/lessons/15-what-you-spend-the-most-money-on/lecture/index.html"}, {"href": "view/talk-me-lately-full/15-what-you-spend-the-most-money-on/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-full/15-what-you-spend-the-most-money-on/prestudy/index.html", "source": "courses/en/talk-me-lately-full/lessons/15-what-you-spend-the-most-money-on/prestudy/index.html"}], "goal": {"t": "Let's talk about what your spending says about your priorities. Please read the title aloud.", "ja": "お金の使い方に表れる優先順位について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Do you ever spend money just for fun?", "ja": "楽しみのためだけにお金を使うことはありますか？", "f": ["What kind of fun feels worth paying for?", "What do you prefer to save for?"]}, {"n": "WARM-UP 2", "t": "What small purchase is hardest to resist?", "ja": "どんな小さな買い物がいちばん我慢しにくいですか？", "f": ["What makes it especially tempting?", "What feeling are you hoping to get?"]}, {"n": "QUESTION 1", "t": "Which do you spend more on: convenience, comfort, or fun?", "ja": "便利さ、快適さ、楽しさの中で、どれにいちばんお金を使いますか？", "f": ["Why do you spend more on that?", "Which one would you most like to spend less on?"]}, {"n": "QUESTION 2", "t": "When does spending extra feel worth it?", "ja": "少し多くお金を使ってもよいと思うのは、どんなときですか？", "f": ["What lasting benefit makes it worth the price?", "When is paying more no longer worth it?"]}, {"n": "QUESTION 3", "t": "What usually makes you decide not to buy something?", "ja": "物を買わないと決めるのは、ふつうどんな理由からですか？", "f": ["Which warning sign makes you pause?", "How long do you wait before deciding?"]}, {"n": "QUESTION 4", "t": "What kind of spending looks wasteful to you but useful to someone else?", "ja": "自分には無駄に見えても、ほかの人には役立ちそうな出費は何ですか？", "f": ["When could it be useful?", "Which is easier to understand: spending on hobbies or convenience?"]}, {"n": "QUESTION 5", "t": "What life change can completely change a budget?", "ja": "どんな生活の変化で、予算は大きく変わりますか？", "f": ["Which new responsibility would matter most?", "How quickly would spending habits need to change?"]}, {"n": "QUESTION 6", "t": "If money became tight, what small pleasure would be hard to give up?", "ja": "お金に余裕がなくなったら、どんな小さな楽しみを手放しにくいですか？", "f": ["What does that pleasure add to daily life?", "What limit would make you finally cut it?"]}]}, {"n": 8, "title": "처음 해 본 것", "sub": "初めてやってみたこと", "titles": {"ko": "처음 해 본 것", "en": "Something you tried for the first time", "ja": "初めてやってみたこと"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-me-lately-full/16-something-you-tried-for-the-first-time/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-full/16-something-you-tried-for-the-first-time/lecture/index.html", "source": "courses/en/talk-me-lately-full/lessons/16-something-you-tried-for-the-first-time/lecture/index.html"}, {"href": "view/talk-me-lately-full/16-something-you-tried-for-the-first-time/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-full/16-something-you-tried-for-the-first-time/prestudy/index.html", "source": "courses/en/talk-me-lately-full/lessons/16-something-you-tried-for-the-first-time/prestudy/index.html"}], "goal": {"t": "Let's tell the story of a recent first experience. Please read the title aloud.", "ja": "最近の初めての体験について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's something you tried for the first time this year?", "ja": "今年、初めてやってみたことは何ですか？", "f": ["When was that?", "What did you do last weekend that was new?"]}, {"n": "WARM-UP 2", "t": "What's something new you'd enjoy trying with another person?", "ja": "誰かと一緒に新しく試してみたいことは何ですか？", "f": ["Who would you invite?", "Why would company make it better?"]}, {"n": "QUESTION 1", "t": "Before trying something new, do you usually feel more nervous or excited?", "ja": "新しいことを始める前は、緊張とわくわくのどちらを強く感じますか？", "f": ["What makes that feeling stronger?", "When do you nearly cancel?"]}, {"n": "QUESTION 2", "t": "What's something that turned out very different from what you expected?", "ja": "想像していたものと大きく違った体験は何ですか？", "f": ["What surprised you most?", "Was it better or worse?"]}, {"n": "QUESTION 3", "t": "When was the last time you felt like a complete beginner?", "ja": "最後に、まったくの初心者だと感じたのはいつですか？", "f": ["What was hardest at first?", "Who or what helped?"]}, {"n": "QUESTION 4", "t": "What's something you tried once and would happily do again?", "ja": "一度試して、喜んでもう一度やりたいと思ったことは何ですか？", "f": ["What would you do differently next time?", "Who would you take?"]}, {"n": "QUESTION 5", "t": "What do you want to try next?", "ja": "次は何をやってみたいですか？", "f": ["What's stopping you?", "When could you actually do it?"]}, {"n": "QUESTION 6", "t": "Now the opposite — what did you try once and never again?", "ja": "逆に、一度やって二度とやらなかったことは何ですか？", "f": ["What put you off?", "Would you try it with a different person?"]}]}, {"n": 9, "title": "아무도 알아주지 않은 작은 성과", "sub": "誰にも気づかれなかった小さな成功", "titles": {"ko": "아무도 알아주지 않은 작은 성과", "en": "A small win nobody noticed", "ja": "誰にも気づかれなかった小さな成功"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-me-lately-full/17-a-small-win-nobody-noticed/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-full/17-a-small-win-nobody-noticed/lecture/index.html", "source": "courses/en/talk-me-lately-full/lessons/17-a-small-win-nobody-noticed/lecture/index.html"}, {"href": "view/talk-me-lately-full/17-a-small-win-nobody-noticed/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-full/17-a-small-win-nobody-noticed/prestudy/index.html", "source": "courses/en/talk-me-lately-full/lessons/17-a-small-win-nobody-noticed/prestudy/index.html"}], "goal": {"t": "Let's notice a small success and explain why it mattered. Please read the title aloud.", "ja": "小さな成功に目を向け、なぜ大切だったか話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one small thing you did well this week?", "ja": "今週、自分でうまくできたと思う小さなことは何ですか？", "f": ["Why did it matter to you?", "Did anyone else notice?"]}, {"n": "WARM-UP 2", "t": "What effort do people often make without getting credit?", "ja": "人はどんな努力をしても、なかなか評価されないことがありますか？", "f": ["What makes the effort almost invisible?", "How could people recognize it better?"]}, {"n": "QUESTION 1", "t": "What progress have you made lately that someone else might miss?", "ja": "最近の進歩で、ほかの人には気づかれにくそうなものは何ですか？", "f": ["What small sign shows the change?", "When did you first notice it?"]}, {"n": "QUESTION 2", "t": "How can you tell when someone has been working hard quietly?", "ja": "人が人知れず頑張っていたことは、どうすれば分かりますか？", "f": ["What small changes can show the effort?", "How should someone respond when they notice?"]}, {"n": "QUESTION 3", "t": "How do you celebrate a small win?", "ja": "小さな成功を、どのように祝いますか？", "f": ["When is private satisfaction enough?", "How can celebrating help the next step?"]}, {"n": "QUESTION 4", "t": "When is keeping a small win private better than sharing it?", "ja": "小さな成功を人に話さず、自分だけにしておくほうがよいのはどんなときですか？", "f": ["Can sharing change the meaning of the win?", "When does telling someone make it more valuable?"]}, {"n": "QUESTION 5", "t": "Which helps more: praise from someone else or noticing your own progress?", "ja": "ほかの人に褒められることと、自分の進歩に気づくことでは、どちらがより役立ちますか？", "f": ["Which kind of motivation lasts longer?", "How can outside praise become less important?"]}, {"n": "QUESTION 6", "t": "What small sign can show that a month went well?", "ja": "一か月がうまくいったと分かる、小さなサインは何ですか？", "f": ["Why is that sign meaningful?", "Did you have more good days or bad days this month?"]}]}, {"n": 10, "title": "계속 듣게 되는 노래", "sub": "何度も聴いている曲", "titles": {"ko": "계속 듣게 되는 노래", "en": "A song you keep playing", "ja": "何度も聴いている曲"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-me-lately-full/18-a-song-you-keep-playing/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-full/18-a-song-you-keep-playing/lecture/index.html", "source": "courses/en/talk-me-lately-full/lessons/18-a-song-you-keep-playing/lecture/index.html"}, {"href": "view/talk-me-lately-full/18-a-song-you-keep-playing/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-full/18-a-song-you-keep-playing/prestudy/index.html", "source": "courses/en/talk-me-lately-full/lessons/18-a-song-you-keep-playing/prestudy/index.html"}], "goal": {"t": "Let's talk about a song that has become part of your life lately. Please read the title aloud.", "ja": "最近の生活の一部になっている曲について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Is there a song you've been playing a lot lately?", "ja": "最近よく聴いている曲はありますか？", "f": ["Which artist or sound fits your mood lately?", "When do you usually want to hear it?"]}, {"n": "WARM-UP 2", "t": "Which matters more in a song: lyrics, voice, or beat?", "ja": "曲では、歌詞、声、リズムのどれがいちばん大切ですか？", "f": ["Which element creates the first impression?", "Which one keeps the song interesting?"]}, {"n": "QUESTION 1", "t": "When do you get tired of a song you love?", "ja": "好きな曲に飽きるのは、どんなときですか？", "f": ["Does overplaying change the song or your mood?", "How long does a song need to feel fresh again?"]}, {"n": "QUESTION 2", "t": "What kind of memory can a song bring back instantly?", "ja": "曲を聴くと、どんな思い出がすぐによみがえりますか？", "f": ["Why does music hold that memory so strongly?", "Can the feeling change over time?"]}, {"n": "QUESTION 3", "t": "What activity is better with music?", "ja": "音楽があるともっとよくなる活動は何ですか？", "f": ["How does the music change your pace or mood?", "Which task needs silence instead?"]}, {"n": "QUESTION 4", "t": "What can make a favorite song hard to hear?", "ja": "好きな曲でも、聴くのがつらくなるのはどんな理由からですか？", "f": ["Can a song belong too strongly to one period?", "What might help someone enjoy it again?"]}, {"n": "QUESTION 5", "t": "What song would you send someone who needed energy?", "ja": "元気が必要な人に、どんな曲を送りますか？", "f": ["Would the lyrics or sound matter more?", "When you need energy, do you choose a fast song or a familiar one?"]}, {"n": "QUESTION 6", "t": "Which song belongs on a playlist about your year?", "ja": "今年を表すプレイリストに、どんな曲を入れますか？", "f": ["What story would the song tell?", "Would your year need a happy song or a calm one?"]}]}, {"n": 11, "title": "계속 미루고 있는 것", "sub": "ずっと先延ばしにしていること", "titles": {"ko": "계속 미루고 있는 것", "en": "Something you've been putting off", "ja": "ずっと先延ばしにしていること"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-me-lately-full/19-something-youve-been-putting-off/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-full/19-something-youve-been-putting-off/lecture/index.html", "source": "courses/en/talk-me-lately-full/lessons/19-something-youve-been-putting-off/lecture/index.html"}, {"href": "view/talk-me-lately-full/19-something-youve-been-putting-off/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-full/19-something-youve-been-putting-off/prestudy/index.html", "source": "courses/en/talk-me-lately-full/lessons/19-something-youve-been-putting-off/prestudy/index.html"}], "goal": {"t": "Let's understand one delayed task and make the next action clear. Please read the title aloud.", "ja": "先延ばしにしていることを理解し、次の行動を明確にしましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one task you've been putting off lately?", "ja": "最近、先延ばしにしていることを一つ挙げるとしたら何ですか？", "f": ["What makes it easy to delay?", "When will it become urgent?"]}, {"n": "WARM-UP 2", "t": "What do you usually do instead of the task you're avoiding?", "ja": "やるべきことを避けているとき、代わりに何をしますか？", "f": ["What feeling are you trying to avoid?", "When does the distraction create more stress?"]}, {"n": "QUESTION 1", "t": "Which gets harder after a delay: starting or finishing?", "ja": "先延ばしにすると、始めることと終わらせることのどちらが難しくなりますか？", "f": ["How does the delay change the task in your mind?", "What breaks that pattern?"]}, {"n": "QUESTION 2", "t": "Which task is easiest to put off: boring, difficult, or unclear?", "ja": "退屈な仕事、難しい仕事、はっきりしない仕事の中で、いちばん先延ばしにしやすいのはどれですか？", "f": ["Which emotion comes with that kind of task?", "What first step reduces the resistance?"]}, {"n": "QUESTION 3", "t": "What's a tiny task you've delayed for far too long?", "ja": "小さいのに、長く先延ばしにしてしまった用事は何ですか？", "f": ["Why is it still unfinished?", "Could you finish it in ten minutes?"]}, {"n": "QUESTION 4", "t": "What can make you start an annoying task right away?", "ja": "面倒な用事でも、すぐに始められるのはどんなときですか？", "f": ["Which outside pressure is actually useful?", "How can you make the first step smaller?"]}, {"n": "QUESTION 5", "t": "How do you reward yourself after finishing something annoying?", "ja": "面倒なことを終えたあと、どのように自分にご褒美をあげますか？", "f": ["Does the reward improve motivation or only relief?", "When is finishing itself enough?"]}, {"n": "QUESTION 6", "t": "What's one trick that makes a delayed task easier to restart?", "ja": "先延ばしにしたことを再開しやすくするコツは何ですか？", "f": ["How could you make the task feel easier?", "How much would you try to finish on the first day back?"]}]}, {"n": 12, "title": "항상 가지고 다니는 것", "sub": "いつも持ち歩いているもの", "titles": {"ko": "항상 가지고 다니는 것", "en": "One thing you always carry", "ja": "いつも持ち歩いているもの"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-me-lately-full/20-one-thing-you-always-carry/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-me-lately-full/20-one-thing-you-always-carry/lecture/index.html", "source": "courses/en/talk-me-lately-full/lessons/20-one-thing-you-always-carry/lecture/index.html"}, {"href": "view/talk-me-lately-full/20-one-thing-you-always-carry/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-me-lately-full/20-one-thing-you-always-carry/prestudy/index.html", "source": "courses/en/talk-me-lately-full/lessons/20-one-thing-you-always-carry/prestudy/index.html"}], "goal": {"t": "Let's use what's in your bag to talk about your daily life. Please read the title aloud.", "ja": "かばんの中身から、日常生活について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Which everyday item would be most inconvenient to forget?", "ja": "日常の持ち物で、忘れるといちばん困る物は何ですか？", "f": ["What need does it meet?", "How easy would it be to replace?"]}, {"n": "WARM-UP 2", "t": "What are the three things you usually take when you go out?", "ja": "出かけるとき、ふつう持っていく三つの物は何ですか？", "f": ["Which item earns its place every day?", "What changes on a longer day out?"]}, {"n": "QUESTION 1", "t": "Which bulky everyday item is still worth carrying?", "ja": "かさばっても持ち歩く価値がある日用品は何ですか？", "f": ["When is it most useful?", "Would you carry an umbrella, a water bottle, or something else?"]}, {"n": "QUESTION 2", "t": "What do you reach for most when you're away from home?", "ja": "外出中に、いちばんよく手に取る物は何ですか？", "f": ["Which part of your day depends on it?", "Could another item replace it?"]}, {"n": "QUESTION 3", "t": "What emergency item do people carry but rarely use?", "ja": "人が持ち歩いていても、めったに使わない非常用の物は何ですか？", "f": ["How serious would the problem need to be?", "When does being prepared become too much?"]}, {"n": "QUESTION 4", "t": "What do people forget most often when they leave home?", "ja": "家を出るとき、人は何をいちばん忘れやすいですか？", "f": ["Why is that item easy to forget?", "How does forgetting it change the day?"]}, {"n": "QUESTION 5", "t": "Which things did phones replace in people's pockets?", "ja": "スマートフォンは、人が持ち歩いていたどんな物の代わりになりましたか？", "f": ["Which replacement made daily life easier?", "What was lost when the old item disappeared?"]}, {"n": "QUESTION 6", "t": "What can you guess about someone from what's in their bag?", "ja": "バッグの中身から、その人について何が分かると思いますか？", "f": ["Which item tells you the most?", "What could make you guess wrong?"]}]}]}, {"no": 5, "label": "5코스", "title": "좋아하는 것", "titles": {"ko": "좋아하는 것", "en": "Things I like", "ja": "好きなもの"}, "subtitle": "(中級) 好きなもの", "desc": {"ko": "좋아하는 대상과 이유를 구체적인 경험으로 설명한다.", "en": "Explain what you like and why, through experiences specific enough to picture.", "ja": "好きなものとその理由を、具体的な経験で説明する。"}, "cover": "covers/talk-things-i-like-accessible.webp", "levels": ["B1"], "level": "B1", "slug": "talk-things-i-like-accessible", "lessons": [{"n": 1, "title": "몇 번을 봐도 질리지 않는 영화", "sub": "何度見ても飽きない映画", "titles": {"ko": "몇 번을 봐도 질리지 않는 영화", "en": "A film you never get tired of", "ja": "何度見ても飽きない映画"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-things-i-like-accessible/21-a-film-you-never-get-tired-of/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-accessible/21-a-film-you-never-get-tired-of/lecture/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/21-a-film-you-never-get-tired-of/lecture/index.html"}, {"href": "view/talk-things-i-like-accessible/21-a-film-you-never-get-tired-of/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-accessible/21-a-film-you-never-get-tired-of/prestudy/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/21-a-film-you-never-get-tired-of/prestudy/index.html"}], "goal": {"t": "Let's talk about a film you can watch again and again. Please read the title aloud.", "ja": "何度でも見たくなる映画について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's a film you never get tired of watching?", "ja": "何度見ても飽きない映画は何ですか？", "f": ["How many times have you seen it?", "Which scene do you wait for?"]}, {"n": "WARM-UP 2", "t": "Which film scene can you picture clearly even now?", "ja": "今でもはっきり思い浮かべられる映画の場面はどれですか？", "f": ["Which visual or line makes it memorable?", "Has its meaning changed for you?"]}, {"n": "QUESTION 1", "t": "Which is more fun: watching a favorite again or trying a new film?", "ja": "好きな映画をもう一度見ることと、新しい映画を見ることでは、どちらが楽しいですか？", "f": ["What do you gain from that choice?", "What mood could reverse your answer?"]}, {"n": "QUESTION 2", "t": "What detail do people often miss the first time they watch a film?", "ja": "映画を初めて見るとき、人はどんな細部を見落としやすいですか？", "f": ["Does knowing the ending help?", "Do you notice acting, music, or background details first?"]}, {"n": "QUESTION 3", "t": "Who do you most enjoy watching films with?", "ja": "誰と映画を見るのがいちばん楽しいですか？", "f": ["What do they notice that you miss?", "Do you usually agree afterward?"]}, {"n": "QUESTION 4", "t": "What makes a popular film hard for some people to enjoy?", "ja": "人気の映画でも、人によって楽しみにくいのはどんな理由からですか？", "f": ["What were they expecting?", "Can too much hype make a film harder to enjoy?"]}, {"n": "QUESTION 5", "t": "How can watching a film again change your opinion of it?", "ja": "映画をもう一度見ると、その映画への意見はどう変わりますか？", "f": ["What might you notice the second time?", "Can a film seem better or worse as you get older?"]}, {"n": "QUESTION 6", "t": "Which Japanese film would you show someone first?", "ja": "日本映画を初めて見る人に、最初にどの作品を見せますか？", "f": ["Why is it a good introduction?", "Would comedy, drama, or animation be the easiest introduction?"]}]}, {"n": 2, "title": "진심으로 즐겼던 영어 콘텐츠", "sub": "心から楽しめた英語のもの", "titles": {"ko": "진심으로 즐겼던 영어 콘텐츠", "en": "Something in English you genuinely enjoyed", "ja": "心から楽しめた英語のもの"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-things-i-like-accessible/22-something-in-english-you-genuinely-enjoyed/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-accessible/22-something-in-english-you-genuinely-enjoyed/lecture/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/22-something-in-english-you-genuinely-enjoyed/lecture/index.html"}, {"href": "view/talk-things-i-like-accessible/22-something-in-english-you-genuinely-enjoyed/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-accessible/22-something-in-english-you-genuinely-enjoyed/prestudy/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/22-something-in-english-you-genuinely-enjoyed/prestudy/index.html"}], "goal": {"t": "Let's trace one enjoyable experience in English and what it led to. Please read the title aloud.", "ja": "英語で楽しめた一つの体験と、その後につながったことを話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one thing in English you enjoy—music, a show, a game, or something else?", "ja": "音楽、番組、ゲームなど、英語で楽しんでいるものを一つ挙げるとしたら何ですか？", "f": ["What keeps you coming back to it?", "What can you enjoy even when some English is unclear?"]}, {"n": "WARM-UP 2", "t": "Which lets you enjoy English most easily: music, shows, books, or games?", "ja": "音楽、番組、本、ゲームの中で、英語をいちばん楽しみやすいのはどれですか？", "f": ["Which kind of attention does it require?", "What would make another format easier?"]}, {"n": "QUESTION 1", "t": "Which helps an English line stay in your memory: sound, meaning, or repetition?", "ja": "英語の一言を覚えやすくするのは、音、意味、繰り返しのどれですか？", "f": ["Can sound make a line memorable before its meaning is clear?", "When does repetition become annoying?"]}, {"n": "QUESTION 2", "t": "How much of a story do you need to understand before you can enjoy it?", "ja": "物語を楽しむには、どのくらい理解する必要がありますか？", "f": ["Which clues carry the meaning without words?", "What kind of missing detail matters most?"]}, {"n": "QUESTION 3", "t": "Do subtitles help you enjoy English, or distract you from it?", "ja": "字幕は英語を楽しむ助けになりますか、それとも気が散りますか？", "f": ["What do subtitles help you notice?", "What can they stop you from hearing?"]}, {"n": "QUESTION 4", "t": "When you hear a new English expression, do you look it up or keep watching?", "ja": "新しい英語表現を聞いたとき、調べますか、それともそのまま見続けますか？", "f": ["When does looking it up improve the experience?", "When does it break the flow?"]}, {"n": "QUESTION 5", "t": "What makes English practice stop feeling like study?", "ja": "英語の練習が勉強のように感じなくなるのは、どんなときですか？", "f": ["When does repetition become enjoyable?", "What can make fun content feel like homework?"]}, {"n": "QUESTION 6", "t": "What would you recommend to someone who wants fun English?", "ja": "楽しく英語に触れたい人に、何をおすすめしますか？", "f": ["How much English do they need to understand?", "Would you recommend music, a show, or a game first?"]}]}, {"n": 3, "title": "하루의 장면마다 듣는 음악", "sub": "一日の場面ごとに聴く音楽", "titles": {"ko": "하루의 장면마다 듣는 음악", "en": "Music for different parts of your day", "ja": "一日の場面ごとに聴く音楽"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-things-i-like-accessible/23-music-for-different-parts-of-your-day/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-accessible/23-music-for-different-parts-of-your-day/lecture/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/23-music-for-different-parts-of-your-day/lecture/index.html"}, {"href": "view/talk-things-i-like-accessible/23-music-for-different-parts-of-your-day/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-accessible/23-music-for-different-parts-of-your-day/prestudy/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/23-music-for-different-parts-of-your-day/prestudy/index.html"}], "goal": {"t": "Let's build the soundtrack to different parts of your day. Please read the title aloud.", "ja": "一日のさまざまな場面に合う音楽について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What do you like to listen to while travelling somewhere?", "ja": "どこかへ移動するとき、何を聴くのが好きですか？", "f": ["How does it change the journey?", "When do you prefer silence?"]}, {"n": "WARM-UP 2", "t": "What was the last piece of music you played?", "ja": "最後に聴いた音楽は何ですか？", "f": ["Did you choose it or let an app choose?", "How well did it fit the moment?"]}, {"n": "QUESTION 1", "t": "Which fits a bad mood better: music that matches it or music that changes it?", "ja": "気分が悪いとき、その気分に合う音楽と気分を変える音楽のどちらがよいですか？", "f": ["What does matching the mood allow you to feel?", "When can changing the mood work better?"]}, {"n": "QUESTION 2", "t": "What kind of song works best in the morning?", "ja": "朝にはどんな曲がいちばん合いますか？", "f": ["Which sound sets the right pace?", "What would feel too intense early in the day?"]}, {"n": "QUESTION 3", "t": "What kind of music makes it harder to concentrate?", "ja": "どんな音楽だと集中しにくくなりますか？", "f": ["Which musical detail steals your attention?", "Can familiar music become easier to ignore?"]}, {"n": "QUESTION 4", "t": "What music makes a boring task go faster?", "ja": "退屈な作業を早く感じさせてくれる音楽は何ですか？", "f": ["Which task do you play it for?", "Does one song work, or do you need a playlist?"]}, {"n": "QUESTION 5", "t": "What song would surprise people if it played from your phone?", "ja": "あなたのスマートフォンから流れたら、人が驚きそうな曲は何ですか？", "f": ["Why would it surprise them?", "Do people usually guess your music taste correctly?"]}, {"n": "QUESTION 6", "t": "Which moment needs music most: morning, travel, or late night?", "ja": "朝、移動中、夜遅くの中で、音楽がいちばん必要なのはいつですか？", "f": ["What does music add at that time?", "Which of the other two could be quiet?"]}]}, {"n": 4, "title": "노래방에서 꼭 부르는 노래", "sub": "カラオケの定番曲", "titles": {"ko": "노래방에서 꼭 부르는 노래", "en": "Your go-to karaoke song", "ja": "カラオケの定番曲"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-things-i-like-accessible/24-your-go-to-karaoke-song/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-accessible/24-your-go-to-karaoke-song/lecture/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/24-your-go-to-karaoke-song/lecture/index.html"}, {"href": "view/talk-things-i-like-accessible/24-your-go-to-karaoke-song/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-accessible/24-your-go-to-karaoke-song/prestudy/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/24-your-go-to-karaoke-song/prestudy/index.html"}], "goal": {"t": "Let's talk about the songs that work—or fail—at karaoke. Please read the title aloud.", "ja": "カラオケでうまくいく曲、うまくいかない曲について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What kind of song is a safe first choice at karaoke?", "ja": "カラオケの最初の一曲には、どんな曲が無難ですか？", "f": ["What makes that kind reliable?", "Would you choose a slow song or an upbeat one?"]}, {"n": "WARM-UP 2", "t": "What kind of karaoke night would you enjoy most?", "ja": "どんなカラオケの夜がいちばん楽しそうですか？", "f": ["Would the group be serious singers or casual ones?", "What could ruin the atmosphere?"]}, {"n": "QUESTION 1", "t": "What makes a karaoke song easier than it sounds?", "ja": "聞いた感じより歌いやすいカラオケ曲には、どんな特徴がありますか？", "f": ["Is an easy chorus or a comfortable key more important?", "Would a slow song or a fast song be easier?"]}, {"n": "QUESTION 2", "t": "What's the easiest way to learn a karaoke song?", "ja": "カラオケの曲を覚えるいちばん簡単な方法は何ですか？", "f": ["Does singing along or listening first work better?", "Which mistake is hardest to notice?"]}, {"n": "QUESTION 3", "t": "What's a good backup song when your first choice feels wrong?", "ja": "最初に選んだ曲が合わないとき、どんな曲がよい予備になりますか？", "f": ["What makes a backup song safe?", "Would you choose a slow song or a group song as a backup?"]}, {"n": "QUESTION 4", "t": "What would you never sing at karaoke?", "ja": "カラオケで絶対に歌わない曲は何ですか？", "f": ["Is the limit about the song or the situation?", "Could a private room change the answer?"]}, {"n": "QUESTION 5", "t": "What makes a song good for a whole group?", "ja": "どんな曲なら、グループ全員で楽しめますか？", "f": ["How important is a familiar chorus?", "When can a group song exclude someone?"]}, {"n": "QUESTION 6", "t": "Ask me what I enjoy singing, then recommend one karaoke song.", "ja": "私に歌うのが好きな曲を聞いてから、カラオケ曲を一つおすすめしてください。", "f": ["Which detail in my answer guided you?", "What warning would you give me before I try it?"]}]}, {"n": 5, "title": "밤늦게 찾게 되는 음식", "sub": "夜遅くについ選ぶ食べ物", "titles": {"ko": "밤늦게 찾게 되는 음식", "en": "Your go-to late-night food", "ja": "夜遅くについ選ぶ食べ物"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-things-i-like-accessible/25-your-go-to-late-night-food/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-accessible/25-your-go-to-late-night-food/lecture/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/25-your-go-to-late-night-food/lecture/index.html"}, {"href": "view/talk-things-i-like-accessible/25-your-go-to-late-night-food/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-accessible/25-your-go-to-late-night-food/prestudy/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/25-your-go-to-late-night-food/prestudy/index.html"}], "goal": {"t": "Let's talk about what you choose when hunger arrives late. Please read the title aloud.", "ja": "夜遅くにお腹がすいたときの選択について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "It's 11pm and you're hungry. What do you order?", "ja": "夜11時にお腹がすきました。何を注文しますか？", "f": ["What makes that your first choice?", "Where would you order it from?"]}, {"n": "WARM-UP 2", "t": "What kind of night makes late-night food especially appealing?", "ja": "どんな夜だと、夜食が特に魅力的に感じますか？", "f": ["Which need matters most then: comfort, speed, or hunger?", "What makes the meal memorable?"]}, {"n": "QUESTION 1", "t": "Which is better late at night: a hot meal or a quick snack?", "ja": "夜遅くには、温かい食事と手軽な軽食のどちらがよいですか？", "f": ["How does the next morning affect your choice?", "Which situation reverses your answer?"]}, {"n": "QUESTION 2", "t": "What decides whether you eat after 10 p.m.?", "ja": "夜10時を過ぎて食べるかどうかは、何で決まりますか？", "f": ["How much does the next day's schedule matter?", "Which feeling can be mistaken for hunger?"]}, {"n": "QUESTION 3", "t": "Who makes a late-night meal more fun to share?", "ja": "夜食を一緒に食べると楽しくなるのは、どんな人ですか？", "f": ["What kind of conversation fits that meal?", "Could company change what you order?"]}, {"n": "QUESTION 4", "t": "What late-night food might you regret in the morning?", "ja": "朝になって後悔しそうな夜食は何ですか？", "f": ["Which part creates the regret: amount, spice, or timing?", "When might it still be worth it?"]}, {"n": "QUESTION 5", "t": "What is the best late-night food in Japan?", "ja": "日本でいちばんよい夜食は何ですか？", "f": ["Why is it better at night?", "Would a visitor understand why people like it?"]}, {"n": "QUESTION 6", "t": "What food tastes better late at night than during the day?", "ja": "昼より夜遅くに食べるほうがおいしく感じるものは何ですか？", "f": ["What changes at that hour?", "What would you drink with it?"]}]}, {"n": 6, "title": "도무지 이해할 수 없는 음식 조합", "sub": "どうしても理解できない食べ合わせ", "titles": {"ko": "도무지 이해할 수 없는 음식 조합", "en": "A food combination you just don't understand", "ja": "どうしても理解できない食べ合わせ"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-things-i-like-accessible/26-a-food-combination-you-just-dont-understand/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-accessible/26-a-food-combination-you-just-dont-understand/lecture/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/26-a-food-combination-you-just-dont-understand/lecture/index.html"}, {"href": "view/talk-things-i-like-accessible/26-a-food-combination-you-just-dont-understand/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-accessible/26-a-food-combination-you-just-dont-understand/prestudy/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/26-a-food-combination-you-just-dont-understand/prestudy/index.html"}], "goal": {"t": "Let's explore where your taste says yes, no, or maybe. Please read the title aloud.", "ja": "食べ合わせについて、自分の「あり・なし・場合による」を話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Pineapple on pizza — yes or no?", "ja": "パイナップルのピザは、ありですか、なしですか？", "f": ["Would you eat one slice right now?", "Would your answer change if someone else ordered it?"]}, {"n": "WARM-UP 2", "t": "Which would you rather try: sweet-and-salty popcorn or meat with fruit?", "ja": "甘じょっぱいポップコーンと果物を使った肉料理なら、どちらを試したいですか？", "f": ["What sounds good about it?", "What could make the other one work?"]}, {"n": "QUESTION 1", "t": "What's the strangest food combination you've actually tried?", "ja": "実際に食べた中で、いちばん変わった食べ合わせは何ですか？", "f": ["Who suggested it?", "Was it better or worse than expected?"]}, {"n": "QUESTION 2", "t": "What two foods do you combine that other people might find strange?", "ja": "ほかの人には変わって見えそうでも、自分では一緒に食べる二つの食べ物は何ですか？", "f": ["When did you first try them together?", "Who else likes the combination?"]}, {"n": "QUESTION 3", "t": "Which popular food pairing is hardest for you to understand?", "ja": "人気があっても、いちばん理解しにくい食べ合わせは何ですか？", "f": ["Is the problem flavor, texture, or the idea?", "What do fans probably enjoy?"]}, {"n": "QUESTION 4", "t": "Which strange food combination surprised you by being good?", "ja": "意外においしくて驚いた、変わった食べ合わせは何ですか？", "f": ["What made the flavors work?", "Would you order it again?"]}, {"n": "QUESTION 5", "t": "What food combination would you refuse to try?", "ja": "絶対に試したくない食べ合わせは何ですか？", "f": ["Where does curiosity stop for you?", "Is the limit about safety or simply how it feels?"]}, {"n": "QUESTION 6", "t": "Who would you trust to choose one strange bite for you?", "ja": "変わった食べ物を一口だけ選んでもらうなら、誰を信頼しますか？", "f": ["Would you want a safe surprise or a real challenge?", "Would liking one bite be enough?"]}]}, {"n": 7, "title": "나만 알고 싶은 식당", "sub": "人に教えたくないお気に入りの店", "titles": {"ko": "나만 알고 싶은 식당", "en": "A restaurant you want to keep to yourself", "ja": "人に教えたくないお気に入りの店"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-things-i-like-accessible/27-a-restaurant-you-want-to-keep-to-yourself/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-accessible/27-a-restaurant-you-want-to-keep-to-yourself/lecture/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/27-a-restaurant-you-want-to-keep-to-yourself/lecture/index.html"}, {"href": "view/talk-things-i-like-accessible/27-a-restaurant-you-want-to-keep-to-yourself/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-accessible/27-a-restaurant-you-want-to-keep-to-yourself/prestudy/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/27-a-restaurant-you-want-to-keep-to-yourself/prestudy/index.html"}], "goal": {"t": "Let's introduce a favorite restaurant without losing what makes it special. Please read the title aloud.", "ja": "特別さを守りながら、お気に入りの店について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Would you tell everyone about a great small restaurant, or keep it quiet?", "ja": "すてきな小さなレストランを見つけたら、みんなに教えますか、それとも秘密にしますか？", "f": ["What would you want to protect about the place?", "When would sharing it help the restaurant?"]}, {"n": "WARM-UP 2", "t": "What makes a small restaurant feel special?", "ja": "小さなレストランが特別に感じられるのは、どんなところですか？", "f": ["Which detail cannot be copied easily?", "How much does the owner matter?"]}, {"n": "QUESTION 1", "t": "Where do the best hidden restaurants usually appear?", "ja": "よい穴場のレストランは、どんな場所にあることが多いですか？", "f": ["What makes the location part of the experience?", "Would a central location change the feeling?"]}, {"n": "QUESTION 2", "t": "What's one dish that can make a restaurant worth returning to?", "ja": "その一品のためにまた行きたくなる料理は何ですか？", "f": ["Which detail keeps it memorable?", "Can one great dish carry an average menu?"]}, {"n": "QUESTION 3", "t": "Which recommendation do you trust most: a friend, reviews, or walking past?", "ja": "友人、口コミ、店の前を通った印象の中で、どれをいちばん信頼しますか？", "f": ["What information does that source give you?", "Which source is easiest to fake?"]}, {"n": "QUESTION 4", "t": "Who is the best person to take to a tiny favorite restaurant?", "ja": "お気に入りの小さなレストランに連れて行くなら、どんな人がいちばんよいですか？", "f": ["What kind of guest would understand the place?", "Who might accidentally spoil the experience?"]}, {"n": "QUESTION 5", "t": "What changes when a small restaurant becomes popular?", "ja": "小さなレストランが人気になると、何が変わりますか？", "f": ["Can the place grow without losing its character?", "Which disadvantage would be fair to accept?"]}, {"n": "QUESTION 6", "t": "When does keeping a great restaurant secret become unfair to the owner?", "ja": "すてきなレストランを秘密にすることが、店主に不公平になるのはどんなときですか？", "f": ["When does secrecy stop helping the owner?", "Would you tell one friend or post online?"]}]}, {"n": 8, "title": "정말 딱 맞았던 선물", "sub": "ぴったりだったプレゼント", "titles": {"ko": "정말 딱 맞았던 선물", "en": "A gift that was exactly right", "ja": "ぴったりだったプレゼント"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-things-i-like-accessible/28-a-book-you-chose-for-someone-else/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-accessible/28-a-book-you-chose-for-someone-else/lecture/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/28-a-book-you-chose-for-someone-else/lecture/index.html"}, {"href": "view/talk-things-i-like-accessible/28-a-book-you-chose-for-someone-else/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-accessible/28-a-book-you-chose-for-someone-else/prestudy/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/28-a-book-you-chose-for-someone-else/prestudy/index.html"}], "goal": {"t": "Let's explore what makes a gift feel exactly right for one person. Please read the title aloud.", "ja": "ある人にとってプレゼントがぴったりに感じられる理由を話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's the last gift you received?", "ja": "最後にもらったプレゼントは何ですか？", "f": ["Who gave it to you?", "What was the occasion?"]}, {"n": "WARM-UP 2", "t": "What's a gift you still use?", "ja": "今も使っているプレゼントは何ですか？", "f": ["How often do you use it?", "Did you expect it to be so useful?"]}, {"n": "QUESTION 1", "t": "Who is easiest for you to choose a gift for?", "ja": "あなたにとって、プレゼントを選びやすいのは誰ですか？", "f": ["Why do you know their taste well?", "What would you choose today?"]}, {"n": "QUESTION 2", "t": "What's a gift that showed someone really knew you?", "ja": "相手が自分をよく分かっていると感じたプレゼントは何ですか？", "f": ["Which detail made it feel personal?", "Were you surprised?"]}, {"n": "QUESTION 3", "t": "Would you rather receive something useful or something surprising?", "ja": "実用的な物と意外な物なら、どちらをもらいたいですか？", "f": ["What is a good example?", "When would you choose the other kind?"]}, {"n": "QUESTION 4", "t": "What's a good gift that doesn't cost much?", "ja": "あまりお金をかけなくても喜ばれるプレゼントは何ですか？", "f": ["What makes it thoughtful?", "Who would appreciate it?"]}, {"n": "QUESTION 5", "t": "When is it better to ask what someone wants?", "ja": "相手の欲しい物を聞いたほうがよいのは、どんなときですか？", "f": ["Does asking remove the surprise?", "When is guessing more fun?"]}, {"n": "QUESTION 6", "t": "What small gift would you choose for me?", "ja": "私に小さなプレゼントを選ぶなら、何にしますか？", "f": ["What in our conversation guided you?", "When would you give it?"]}]}, {"n": 9, "title": "사람들이 얕보는 취미", "sub": "人に価値を分かってもらいにくい趣味", "titles": {"ko": "사람들이 얕보는 취미", "en": "A hobby other people underestimate", "ja": "人に価値を分かってもらいにくい趣味"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-things-i-like-accessible/29-a-hobby-other-people-underestimate/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-accessible/29-a-hobby-other-people-underestimate/lecture/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/29-a-hobby-other-people-underestimate/lecture/index.html"}, {"href": "view/talk-things-i-like-accessible/29-a-hobby-other-people-underestimate/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-accessible/29-a-hobby-other-people-underestimate/prestudy/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/29-a-hobby-other-people-underestimate/prestudy/index.html"}], "goal": {"t": "Let's show what outsiders miss about a hobby. Please read the title aloud.", "ja": "趣味について、外からは見えない魅力を伝えましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's a hobby that is more interesting than it looks?", "ja": "見た目より面白い趣味は何ですか？", "f": ["Which hidden skill makes it interesting?", "Which looks least interesting from outside: gardening, collecting, or puzzles?"]}, {"n": "WARM-UP 2", "t": "Which hobby looks easy but takes real skill?", "ja": "簡単そうに見えて、実は技術が必要な趣味は何ですか？", "f": ["Why do outsiders miss the difficulty?", "Which looks easier than it is: cooking, photography, or gaming?"]}, {"n": "QUESTION 1", "t": "What part of a quiet hobby can be exciting?", "ja": "静かな趣味でも、どんなところがわくわくしますか？", "f": ["Which small decision creates excitement?", "Can a quiet hobby still feel competitive?"]}, {"n": "QUESTION 2", "t": "What can a beginner do in the first hour of a new hobby?", "ja": "新しい趣味を始めた最初の一時間に、初心者は何ができますか？", "f": ["Which early result would encourage them?", "What should they not worry about yet?"]}, {"n": "QUESTION 3", "t": "How long should someone try a hobby before deciding it's not for them?", "ja": "趣味が自分に合わないと決める前に、どのくらい試すべきですか？", "f": ["Which difficulty is only temporary?", "What sign shows a real mismatch?"]}, {"n": "QUESTION 4", "t": "What moment makes a hobby feel rewarding?", "ja": "趣味をやっていてよかったと感じるのは、どんな瞬間ですか？", "f": ["Is progress or enjoyment more important then?", "Can a frustrating hobby still be rewarding?"]}, {"n": "QUESTION 5", "t": "Why do people judge hobbies from the outside?", "ja": "なぜ人は、趣味を外から見ただけで判断するのでしょうか？", "f": ["What is impossible to see without trying it?", "How can fans explain it without overselling?"]}, {"n": "QUESTION 6", "t": "Which hobby would you try once if it were completely free?", "ja": "すべて無料なら、一度試してみたい趣味は何ですか？", "f": ["Would free equipment be enough to start?", "What might make you continue after one try?"]}]}, {"n": 10, "title": "집에서 가장 좋아하는 한구석", "sub": "家の中のお気に入りの場所", "titles": {"ko": "집에서 가장 좋아하는 한구석", "en": "Your favorite corner at home", "ja": "家の中のお気に入りの場所"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-things-i-like-accessible/30-something-in-your-room-you-would-never-throw-away/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-accessible/30-something-in-your-room-you-would-never-throw-away/lecture/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/30-something-in-your-room-you-would-never-throw-away/lecture/index.html"}, {"href": "view/talk-things-i-like-accessible/30-something-in-your-room-you-would-never-throw-away/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-accessible/30-something-in-your-room-you-would-never-throw-away/prestudy/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/30-something-in-your-room-you-would-never-throw-away/prestudy/index.html"}], "goal": {"t": "Let's describe the place at home where you feel most comfortable and why. Please read the title aloud.", "ja": "家でいちばん居心地よく感じる場所と、その理由について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "Where do you sit most often at home?", "ja": "家では、どこに座っていることがいちばん多いですか？", "f": ["What do you usually do there?", "How comfortable is it?"]}, {"n": "WARM-UP 2", "t": "What makes one corner of a home feel comfortable?", "ja": "家の一角が居心地よく感じられるのは、どんなものがあるからですか？", "f": ["Does light or furniture matter more?", "What sound fits the space?"]}, {"n": "QUESTION 1", "t": "What can you see from your favorite spot at home?", "ja": "家のお気に入りの場所から、何が見えますか？", "f": ["Does the view change during the day?", "What do you enjoy noticing?"]}, {"n": "QUESTION 2", "t": "Where do you go at home when you need a break?", "ja": "家で休みたいとき、どこへ行きますか？", "f": ["What do you do there?", "How long do you usually stay?"]}, {"n": "QUESTION 3", "t": "What object makes your room feel like yours?", "ja": "どんな物があると、自分の部屋らしいと感じますか？", "f": ["Where did it come from?", "Would the room feel different without it?"]}, {"n": "QUESTION 4", "t": "What's one thing you would change about your room?", "ja": "自分の部屋で一つ変えるなら、何を変えますか？", "f": ["Why that change first?", "Could you do it easily?"]}, {"n": "QUESTION 5", "t": "Which room feels most different in the morning and at night?", "ja": "朝と夜でいちばん雰囲気が変わる部屋はどこですか？", "f": ["What creates the difference?", "Which time do you prefer there?"]}, {"n": "QUESTION 6", "t": "If you described your room to me, what would you mention first?", "ja": "私に自分の部屋を説明するなら、最初に何を話しますか？", "f": ["Why does that detail represent the room?", "What might surprise me?"]}]}, {"n": 11, "title": "실제로 자주 입는 옷", "sub": "実際によく着る服", "titles": {"ko": "실제로 자주 입는 옷", "en": "What you actually wear", "ja": "実際によく着る服"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-things-i-like-accessible/31-what-you-actually-wear/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-accessible/31-what-you-actually-wear/lecture/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/31-what-you-actually-wear/lecture/index.html"}, {"href": "view/talk-things-i-like-accessible/31-what-you-actually-wear/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-accessible/31-what-you-actually-wear/prestudy/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/31-what-you-actually-wear/prestudy/index.html"}], "goal": {"t": "Let's compare the clothes you own with the clothes you actually wear. Please read the title aloud.", "ja": "持っている服と、実際に着る服を比べましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What colour is most of your wardrobe?", "ja": "手持ちの服でいちばん多い色は何ですか？", "f": ["Why does that colour work for you?", "Which colour do you avoid?"]}, {"n": "WARM-UP 2", "t": "What made you choose what you're wearing today?", "ja": "今日の服を選んだ理由は何ですか？", "f": ["Did comfort, weather, or appearance matter most?", "What does the choice say about your day?"]}, {"n": "QUESTION 1", "t": "What do you actually wear most often?", "ja": "実際にいちばんよく着るものは何ですか？", "f": ["What makes it your usual choice?", "When would you choose something else?"]}, {"n": "QUESTION 2", "t": "Which has changed how you dress most: work, weather, or comfort?", "ja": "仕事、天気、着心地の中で、服装をいちばん変えたのはどれですか？", "f": ["How did daily life drive the change?", "Would you dress differently somewhere else?"]}, {"n": "QUESTION 3", "t": "Why do people keep clothes they rarely wear?", "ja": "人はなぜ、ほとんど着ない服を持ち続けるのでしょうか？", "f": ["Which reason is most common?", "When should they finally let the clothes go?"]}, {"n": "QUESTION 4", "t": "What would you never wear?", "ja": "絶対に着ないものは何ですか？", "f": ["Which limit is strongest for you?", "Could the right event change your answer?"]}, {"n": "QUESTION 5", "t": "What kind of personal style do you enjoy looking at?", "ja": "どんなファッションを見るのが好きですか？", "f": ["What makes that style interesting?", "Do you admire the clothes or the confidence?"]}, {"n": "QUESTION 6", "t": "What would you buy if your clothing budget had no limit?", "ja": "服に使えるお金に制限がなければ、何を買いますか？", "f": ["Would quality or variety matter more?", "What would you still refuse to buy?"]}]}, {"n": 12, "title": "아직도 쓰는 가장 오래된 물건", "sub": "今も使っているいちばん古いもの", "titles": {"ko": "아직도 쓰는 가장 오래된 물건", "en": "The oldest thing you still use", "ja": "今も使っているいちばん古いもの"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-things-i-like-accessible/32-the-oldest-thing-you-still-use/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-accessible/32-the-oldest-thing-you-still-use/lecture/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/32-the-oldest-thing-you-still-use/lecture/index.html"}, {"href": "view/talk-things-i-like-accessible/32-the-oldest-thing-you-still-use/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-accessible/32-the-oldest-thing-you-still-use/prestudy/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/32-the-oldest-thing-you-still-use/prestudy/index.html"}], "goal": {"t": "Let's tell the life story of something that still works. Please read the title aloud.", "ja": "今も使える古い物の歩みを話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's the oldest thing you still use?", "ja": "今も使っているいちばん古い物は何ですか？", "f": ["Where do you keep it?", "What does it look like now?"]}, {"n": "WARM-UP 2", "t": "What old item works better than its newer version?", "ja": "新しい物よりよく使える古い物は何ですか？", "f": ["Which design choice makes it better?", "What advantage does the newer version have?"]}, {"n": "QUESTION 1", "t": "How can you guess an object's age just by looking at it?", "ja": "物を見ただけで、その古さはどう分かりますか？", "f": ["Does wear make the object better or worse?", "Which materials age well?"]}, {"n": "QUESTION 2", "t": "What old object becomes more beautiful after years of use?", "ja": "何年も使うことで、より美しくなる古い物は何ですか？", "f": ["Which signs of age add character?", "When does wear stop being attractive?"]}, {"n": "QUESTION 3", "t": "Why do some things last while others break quickly?", "ja": "長く使える物と、すぐ壊れる物があるのはなぜですか？", "f": ["How much does repairable design matter?", "Can a cheap object still be built to last?"]}, {"n": "QUESTION 4", "t": "Do you usually keep things or get rid of them quickly?", "ja": "物を取っておくほうですか、それともすぐに手放すほうですか？", "f": ["What rule guides your decision?", "When has your habit caused a problem?"]}, {"n": "QUESTION 5", "t": "When do you repair something instead of replacing it?", "ja": "物を買い替えず、修理するのはどんなときですか？", "f": ["Which matters more: the cost or your feelings about the item?", "What should companies make easier to repair?"]}, {"n": "QUESTION 6", "t": "Which objects made today could still be useful in ten years?", "ja": "今作られている物の中で、十年後も役立ちそうなのは何ですか？", "f": ["What would help them last?", "Which could last longer: a tool, furniture, or clothing?"]}]}, {"n": 13, "title": "예의상 먹는 음식", "sub": "礼儀のためだけに食べるもの", "titles": {"ko": "예의상 먹는 음식", "en": "A food you only eat to be polite", "ja": "礼儀のためだけに食べるもの"}, "chips": [], "jamo": false, "level": "B1", "decks": [{"href": "view/talk-things-i-like-accessible/33-a-food-you-only-eat-to-be-polite/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-accessible/33-a-food-you-only-eat-to-be-polite/lecture/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/33-a-food-you-only-eat-to-be-polite/lecture/index.html"}, {"href": "view/talk-things-i-like-accessible/33-a-food-you-only-eat-to-be-polite/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-accessible/33-a-food-you-only-eat-to-be-polite/prestudy/index.html", "source": "courses/en/talk-things-i-like-accessible/lessons/33-a-food-you-only-eat-to-be-polite/prestudy/index.html"}], "goal": {"t": "Let's talk about food, honesty, and politeness at the table. Please read the title aloud.", "ja": "食卓での好み、正直さ、礼儀について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "When might someone eat a food just to be polite?", "ja": "礼儀のために、食べ物を食べることがあるのはどんなときですか？", "f": ["Which situation creates the most pressure?", "When is it still reasonable to refuse?"]}, {"n": "WARM-UP 2", "t": "Which is harder to refuse: a friend's homemade dish or an expensive restaurant dish?", "ja": "友人の手料理とレストランの高価な料理では、どちらが断りにくいですか？", "f": ["Why does that one create pressure?", "When would refusal be easier?"]}, {"n": "QUESTION 1", "t": "What taste or texture is hardest to hide your reaction to?", "ja": "反応を隠すのがいちばん難しい味や食感は何ですか？", "f": ["Why does the reaction happen so quickly?", "How could a host notice without words?"]}, {"n": "QUESTION 2", "t": "Where is it hardest to refuse food: someone's home, work, or a restaurant?", "ja": "食べ物を断りにくいのは、誰かの家、職場、レストランのどこですか？", "f": ["What kind of pressure appears there?", "When is refusing still reasonable?"]}, {"n": "QUESTION 3", "t": "How can a host tell that a guest doesn't like a dish?", "ja": "客が料理を好きではないと、ホストはどうすれば分かりますか？", "f": ["What might the host misunderstand?", "How can they make refusal feel safe?"]}, {"n": "QUESTION 4", "t": "How would you kindly say that you didn't like a dish?", "ja": "料理が好みではなかったと、どのように優しく伝えますか？", "f": ["How can you be honest without judging the cooking?", "What useful detail could you add?"]}, {"n": "QUESTION 5", "t": "Why do some popular foods divide opinion?", "ja": "人気があっても好き嫌いが分かれる食べ物があるのはなぜですか？", "f": ["Is taste, texture, or expectation usually the reason?", "Which food is a good example?"]}, {"n": "QUESTION 6", "t": "Which matters more at dinner: honesty or protecting the host's feelings?", "ja": "食事の場では、正直さとホストの気持ちを守ることのどちらが大切ですか？", "f": ["What harm can polite dishonesty cause?", "When does being polite become dishonest?"]}]}]}, {"no": 6, "label": "6코스", "title": "좋아하는 것", "titles": {"ko": "좋아하는 것", "en": "Things I like", "ja": "好きなもの"}, "subtitle": "(上級) 好きなもの", "desc": {"ko": "좋아하는 대상과 이유를 구체적인 경험으로 설명한다.", "en": "Explain what you like and why, through experiences specific enough to picture.", "ja": "好きなものとその理由を、具体的な経験で説明する。"}, "cover": "covers/talk-things-i-like-full.webp", "levels": ["C1"], "level": "C1", "slug": "talk-things-i-like-full", "lessons": [{"n": 1, "title": "몇 번을 봐도 질리지 않는 영화", "sub": "何度見ても飽きない映画", "titles": {"ko": "몇 번을 봐도 질리지 않는 영화", "en": "A film you never get tired of", "ja": "何度見ても飽きない映画"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-things-i-like-full/21-a-film-you-never-get-tired-of/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-full/21-a-film-you-never-get-tired-of/lecture/index.html", "source": "courses/en/talk-things-i-like-full/lessons/21-a-film-you-never-get-tired-of/lecture/index.html"}, {"href": "view/talk-things-i-like-full/21-a-film-you-never-get-tired-of/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-full/21-a-film-you-never-get-tired-of/prestudy/index.html", "source": "courses/en/talk-things-i-like-full/lessons/21-a-film-you-never-get-tired-of/prestudy/index.html"}], "goal": {"t": "Let's talk about a film you can watch again and again. Please read the title aloud.", "ja": "何度でも見たくなる映画について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's a film you never get tired of watching?", "ja": "何度見ても飽きない映画は何ですか？", "f": ["How many times have you seen it?", "Which scene do you wait for?"]}, {"n": "WARM-UP 2", "t": "Which film scene can you picture clearly even now?", "ja": "今でもはっきり思い浮かべられる映画の場面はどれですか？", "f": ["Which visual or line makes it memorable?", "Has its meaning changed for you?"]}, {"n": "QUESTION 1", "t": "Which is more fun: watching a favorite again or trying a new film?", "ja": "好きな映画をもう一度見ることと、新しい映画を見ることでは、どちらが楽しいですか？", "f": ["What do you gain from that choice?", "What mood could reverse your answer?"]}, {"n": "QUESTION 2", "t": "What detail do people often miss the first time they watch a film?", "ja": "映画を初めて見るとき、人はどんな細部を見落としやすいですか？", "f": ["Does knowing the ending help?", "Do you notice acting, music, or background details first?"]}, {"n": "QUESTION 3", "t": "Who do you most enjoy watching films with?", "ja": "誰と映画を見るのがいちばん楽しいですか？", "f": ["What do they notice that you miss?", "Do you usually agree afterward?"]}, {"n": "QUESTION 4", "t": "What makes a popular film hard for some people to enjoy?", "ja": "人気の映画でも、人によって楽しみにくいのはどんな理由からですか？", "f": ["What were they expecting?", "Can too much hype make a film harder to enjoy?"]}, {"n": "QUESTION 5", "t": "How can watching a film again change your opinion of it?", "ja": "映画をもう一度見ると、その映画への意見はどう変わりますか？", "f": ["What might you notice the second time?", "Can a film seem better or worse as you get older?"]}, {"n": "QUESTION 6", "t": "Which Japanese film would you show someone first?", "ja": "日本映画を初めて見る人に、最初にどの作品を見せますか？", "f": ["Why is it a good introduction?", "Would comedy, drama, or animation be the easiest introduction?"]}]}, {"n": 2, "title": "진심으로 즐겼던 영어 콘텐츠", "sub": "心から楽しめた英語のもの", "titles": {"ko": "진심으로 즐겼던 영어 콘텐츠", "en": "Something in English you genuinely enjoyed", "ja": "心から楽しめた英語のもの"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-things-i-like-full/22-something-in-english-you-genuinely-enjoyed/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-full/22-something-in-english-you-genuinely-enjoyed/lecture/index.html", "source": "courses/en/talk-things-i-like-full/lessons/22-something-in-english-you-genuinely-enjoyed/lecture/index.html"}, {"href": "view/talk-things-i-like-full/22-something-in-english-you-genuinely-enjoyed/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-full/22-something-in-english-you-genuinely-enjoyed/prestudy/index.html", "source": "courses/en/talk-things-i-like-full/lessons/22-something-in-english-you-genuinely-enjoyed/prestudy/index.html"}], "goal": {"t": "Let's trace one enjoyable experience in English and what it led to. Please read the title aloud.", "ja": "英語で楽しめた一つの体験と、その後につながったことを話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What's one thing in English you enjoy—music, a show, a game, or something else?", "ja": "音楽、番組、ゲームなど、英語で楽しんでいるものを一つ挙げるとしたら何ですか？", "f": ["What keeps you coming back to it?", "What can you enjoy even when some English is unclear?"]}, {"n": "WARM-UP 2", "t": "Which lets you enjoy English most easily: music, shows, books, or games?", "ja": "音楽、番組、本、ゲームの中で、英語をいちばん楽しみやすいのはどれですか？", "f": ["Which kind of attention does it require?", "What would make another format easier?"]}, {"n": "QUESTION 1", "t": "Which helps an English line stay in your memory: sound, meaning, or repetition?", "ja": "英語の一言を覚えやすくするのは、音、意味、繰り返しのどれですか？", "f": ["Can sound make a line memorable before its meaning is clear?", "When does repetition become annoying?"]}, {"n": "QUESTION 2", "t": "How much of a story do you need to understand before you can enjoy it?", "ja": "物語を楽しむには、どのくらい理解する必要がありますか？", "f": ["Which clues carry the meaning without words?", "What kind of missing detail matters most?"]}, {"n": "QUESTION 3", "t": "Do subtitles help you enjoy English, or distract you from it?", "ja": "字幕は英語を楽しむ助けになりますか、それとも気が散りますか？", "f": ["What do subtitles help you notice?", "What can they stop you from hearing?"]}, {"n": "QUESTION 4", "t": "When you hear a new English expression, do you look it up or keep watching?", "ja": "新しい英語表現を聞いたとき、調べますか、それともそのまま見続けますか？", "f": ["When does looking it up improve the experience?", "When does it break the flow?"]}, {"n": "QUESTION 5", "t": "What makes English practice stop feeling like study?", "ja": "英語の練習が勉強のように感じなくなるのは、どんなときですか？", "f": ["When does repetition become enjoyable?", "What can make fun content feel like homework?"]}, {"n": "QUESTION 6", "t": "What would you recommend to someone who wants fun English?", "ja": "楽しく英語に触れたい人に、何をおすすめしますか？", "f": ["How much English do they need to understand?", "Would you recommend music, a show, or a game first?"]}]}, {"n": 3, "title": "하루의 장면마다 듣는 음악", "sub": "一日の場面ごとに聴く音楽", "titles": {"ko": "하루의 장면마다 듣는 음악", "en": "Music for different parts of your day", "ja": "一日の場面ごとに聴く音楽"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-things-i-like-full/23-music-for-different-parts-of-your-day/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-full/23-music-for-different-parts-of-your-day/lecture/index.html", "source": "courses/en/talk-things-i-like-full/lessons/23-music-for-different-parts-of-your-day/lecture/index.html"}, {"href": "view/talk-things-i-like-full/23-music-for-different-parts-of-your-day/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-full/23-music-for-different-parts-of-your-day/prestudy/index.html", "source": "courses/en/talk-things-i-like-full/lessons/23-music-for-different-parts-of-your-day/prestudy/index.html"}], "goal": {"t": "Let's build the soundtrack to different parts of your day. Please read the title aloud.", "ja": "一日のさまざまな場面に合う音楽について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What do you like to listen to while travelling somewhere?", "ja": "どこかへ移動するとき、何を聴くのが好きですか？", "f": ["How does it change the journey?", "When do you prefer silence?"]}, {"n": "WARM-UP 2", "t": "What was the last piece of music you played?", "ja": "最後に聴いた音楽は何ですか？", "f": ["Did you choose it or let an app choose?", "How well did it fit the moment?"]}, {"n": "QUESTION 1", "t": "Which fits a bad mood better: music that matches it or music that changes it?", "ja": "気分が悪いとき、その気分に合う音楽と気分を変える音楽のどちらがよいですか？", "f": ["What does matching the mood allow you to feel?", "When can changing the mood work better?"]}, {"n": "QUESTION 2", "t": "What kind of song works best in the morning?", "ja": "朝にはどんな曲がいちばん合いますか？", "f": ["Which sound sets the right pace?", "What would feel too intense early in the day?"]}, {"n": "QUESTION 3", "t": "What kind of music makes it harder to concentrate?", "ja": "どんな音楽だと集中しにくくなりますか？", "f": ["Which musical detail steals your attention?", "Can familiar music become easier to ignore?"]}, {"n": "QUESTION 4", "t": "What music makes a boring task go faster?", "ja": "退屈な作業を早く感じさせてくれる音楽は何ですか？", "f": ["Which task do you play it for?", "Does one song work, or do you need a playlist?"]}, {"n": "QUESTION 5", "t": "What song would surprise people if it played from your phone?", "ja": "あなたのスマートフォンから流れたら、人が驚きそうな曲は何ですか？", "f": ["Why would it surprise them?", "Do people usually guess your music taste correctly?"]}, {"n": "QUESTION 6", "t": "Which moment needs music most: morning, travel, or late night?", "ja": "朝、移動中、夜遅くの中で、音楽がいちばん必要なのはいつですか？", "f": ["What does music add at that time?", "Which of the other two could be quiet?"]}]}, {"n": 4, "title": "노래방에서 꼭 부르는 노래", "sub": "カラオケの定番曲", "titles": {"ko": "노래방에서 꼭 부르는 노래", "en": "Your go-to karaoke song", "ja": "カラオケの定番曲"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-things-i-like-full/24-your-go-to-karaoke-song/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-full/24-your-go-to-karaoke-song/lecture/index.html", "source": "courses/en/talk-things-i-like-full/lessons/24-your-go-to-karaoke-song/lecture/index.html"}, {"href": "view/talk-things-i-like-full/24-your-go-to-karaoke-song/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-full/24-your-go-to-karaoke-song/prestudy/index.html", "source": "courses/en/talk-things-i-like-full/lessons/24-your-go-to-karaoke-song/prestudy/index.html"}], "goal": {"t": "Let's talk about the songs that work—or fail—at karaoke. Please read the title aloud.", "ja": "カラオケでうまくいく曲、うまくいかない曲について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "What kind of song is a safe first choice at karaoke?", "ja": "カラオケの最初の一曲には、どんな曲が無難ですか？", "f": ["What makes that kind reliable?", "Would you choose a slow song or an upbeat one?"]}, {"n": "WARM-UP 2", "t": "What kind of karaoke night would you enjoy most?", "ja": "どんなカラオケの夜がいちばん楽しそうですか？", "f": ["Would the group be serious singers or casual ones?", "What could ruin the atmosphere?"]}, {"n": "QUESTION 1", "t": "What makes a karaoke song easier than it sounds?", "ja": "聞いた感じより歌いやすいカラオケ曲には、どんな特徴がありますか？", "f": ["Is an easy chorus or a comfortable key more important?", "Would a slow song or a fast song be easier?"]}, {"n": "QUESTION 2", "t": "What's the easiest way to learn a karaoke song?", "ja": "カラオケの曲を覚えるいちばん簡単な方法は何ですか？", "f": ["Does singing along or listening first work better?", "Which mistake is hardest to notice?"]}, {"n": "QUESTION 3", "t": "What's a good backup song when your first choice feels wrong?", "ja": "最初に選んだ曲が合わないとき、どんな曲がよい予備になりますか？", "f": ["What makes a backup song safe?", "Would you choose a slow song or a group song as a backup?"]}, {"n": "QUESTION 4", "t": "What would you never sing at karaoke?", "ja": "カラオケで絶対に歌わない曲は何ですか？", "f": ["Is the limit about the song or the situation?", "Could a private room change the answer?"]}, {"n": "QUESTION 5", "t": "What makes a song good for a whole group?", "ja": "どんな曲なら、グループ全員で楽しめますか？", "f": ["How important is a familiar chorus?", "When can a group song exclude someone?"]}, {"n": "QUESTION 6", "t": "Ask me what I enjoy singing, then recommend one karaoke song.", "ja": "私に歌うのが好きな曲を聞いてから、カラオケ曲を一つおすすめしてください。", "f": ["Which detail in my answer guided you?", "What warning would you give me before I try it?"]}]}, {"n": 5, "title": "밤늦게 찾게 되는 음식", "sub": "夜遅くについ選ぶ食べ物", "titles": {"ko": "밤늦게 찾게 되는 음식", "en": "Your go-to late-night food", "ja": "夜遅くについ選ぶ食べ物"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-things-i-like-full/25-your-go-to-late-night-food/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-full/25-your-go-to-late-night-food/lecture/index.html", "source": "courses/en/talk-things-i-like-full/lessons/25-your-go-to-late-night-food/lecture/index.html"}, {"href": "view/talk-things-i-like-full/25-your-go-to-late-night-food/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-full/25-your-go-to-late-night-food/prestudy/index.html", "source": "courses/en/talk-things-i-like-full/lessons/25-your-go-to-late-night-food/prestudy/index.html"}], "goal": {"t": "Let's talk about what you choose when hunger arrives late. Please read the title aloud.", "ja": "夜遅くにお腹がすいたときの選択について話しましょう。タイトルを声に出して読んでください。"}, "qs": [{"n": "WARM-UP 1", "t": "It's 11pm and you're hungry. What do you order?", "ja": "夜11時にお腹がすきました。何を注文しますか？", "f": ["What makes that your first choice?", "Where would you order it from?"]}, {"n": "WARM-UP 2", "t": "What kind of night makes late-night food especially appealing?", "ja": "どんな夜だと、夜食が特に魅力的に感じますか？", "f": ["Which need matters most then: comfort, speed, or hunger?", "What makes the meal memorable?"]}, {"n": "QUESTION 1", "t": "Which is better late at night: a hot meal or a quick snack?", "ja": "夜遅くには、温かい食事と手軽な軽食のどちらがよいですか？", "f": ["How does the next morning affect your choice?", "Which situation reverses your answer?"]}, {"n": "QUESTION 2", "t": "What decides whether you eat after 10 p.m.?", "ja": "夜10時を過ぎて食べるかどうかは、何で決まりますか？", "f": ["How much does the next day's schedule matter?", "Which feeling can be mistaken for hunger?"]}, {"n": "QUESTION 3", "t": "Who makes a late-night meal more fun to share?", "ja": "夜食を一緒に食べると楽しくなるのは、どんな人ですか？", "f": ["What kind of conversation fits that meal?", "Could company change what you order?"]}, {"n": "QUESTION 4", "t": "What late-night food might you regret in the morning?", "ja": "朝になって後悔しそうな夜食は何ですか？", "f": ["Which part creates the regret: amount, spice, or timing?", "When might it still be worth it?"]}, {"n": "QUESTION 5", "t": "What is the best late-night food in Japan?", "ja": "日本でいちばんよい夜食は何ですか？", "f": ["Why is it better at night?", "Would a visitor understand why people like it?"]}, {"n": "QUESTION 6", "t": "What food tastes better late at night than during the day?", "ja": "昼より夜遅くに食べるほうがおいしく感じるものは何ですか？", "f": ["What changes at that hour?", "What would you drink with it?"]}]}, {"n": 6, "title": "도무지 이해할 수 없는 음식 조합", "sub": "どうしても理解できない食べ合わせ", "titles": {"ko": "도무지 이해할 수 없는 음식 조합", "en": "A food combination you just don't understand", "ja": "どうしても理解できない食べ合わせ"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-things-i-like-full/26-a-food-combination-you-just-dont-understand/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-full/26-a-food-combination-you-just-dont-understand/lecture/index.html", "source": "courses/en/talk-things-i-like-full/lessons/26-a-food-combination-you-just-dont-understand/lecture/index.html"}, {"href": "view/talk-things-i-like-full/26-a-food-combination-you-just-dont-understand/prestudy", "level": "예습용", "slot": "prestudy", "entry": "decks/talk-things-i-like-full/26-a-food-combination-you-just-dont-understand/prestudy/index.html", "source": "courses/en/talk-things-i-like-full/l ft you received?", "ja": "最後にもらったプレゼントは何ですか？", "f": ["Who gave it to you?", "What was the occasion?"]}, {"n": "WARM-UP 2", "t": "What's a gift you still use?", "ja": "今も使っているプレゼントは何ですか？", "f": ["How often do you use it?", "Did you expect it to be so useful?"]}, {"n": "QUESTION 1", "t": "Who is easiest for you to choose a gift for?", "ja": "あなたにとって、プレゼントを選びやすいのは誰ですか？", "f": ["Why do you know their taste well?", "What would you choose today?"]}, {"n": "QUESTION 2", "t": "What's a gift that showed someone really knew you?", "ja": "相手が自分をよく分かっていると感じたプレゼントは何ですか？", "f": ["Which detail made it feel personal?", "Were you surprised?"]}, {"n": "QUESTION 3", "t": "Would you rather receive something useful or something surprising?", "ja": "実用的な物と意外な物なら、どちらをもらいたいですか？", "f": ["What is a good example?", "When would you choose the other kind?"]}, {"n": "QUESTION 4", "t": "What's a good gift that doesn't cost much?", "ja": "あまりお金をかけなくても喜ばれるプレゼントは何ですか？", "f": ["What makes it thoughtful?", "Who would appreciate it?"]}, {"n": "QUESTION 5", "t": "When is it better to ask what someone wants?", "ja": "相手の欲しい物を聞いたほうがよいのは、どんなときですか？", "f": ["Does asking remove the surprise?", "When is guessing more fun?"]}, {"n": "QUESTION 6", "t": "What small gift would you choose for me?", "ja": "私に小さなプレゼントを選ぶなら、何にしますか？", "f": ["What in our conversation guided you?", "When would you give it?"]}]}, {"n": 9, "title": "사람들이 얕보는 취미", "sub": "人に価値を分かってもらいにくい趣味", "titles": {"ko": "사람들이 얕보는 취미", "en": "A hobby other people underestimate", "ja": "人に価値を分かってもらいにくい趣味"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-things-i-like-full/29-a-hobby-other-people-underestimate/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-full/29-a-hobby-other-people-underestimate/lecture/index.html", "source": "courses/en/talk-things-i-like-full/lessons/29-a-hobby-other-people-underestimate/lecture/index.html"}, {"href": "view/talk-things-i-like-full/29-a-hobby-other-people-unde ade you choose what you're wearing today?", "ja": "今日の服を選んだ理由は何ですか？", "f": ["Did comfort, weather, or appearance matter most?", "What does the choice say about your day?"]}, {"n": "QUESTION 1", "t": "What do you actually wear most often?", "ja": "実際にいちばんよく着るものは何ですか？", "f": ["What makes it your usual choice?", "When would you choose something else?"]}, {"n": "QUESTION 2", "t": "Which has changed how you dress most: work, weather, or comfort?", "ja": "仕事、天気、着心地の中で、服装をいちばん変えたのはどれですか？", "f": ["How did daily life drive the change?", "Would you dress differently somewhere else?"]}, {"n": "QUESTION 3", "t": "Why do people keep clothes they rarely wear?", "ja": "人はなぜ、ほとんど着ない服を持ち続けるのでしょうか？", "f": ["Which reason is most common?", "When should they finally let the clothes go?"]}, {"n": "QUESTION 4", "t": "What would you never wear?", "ja": "絶対に着ないものは何ですか？", "f": ["Which limit is strongest for you?", "Could the right event change your answer?"]}, {"n": "QUESTION 5", "t": "What kind of personal style do you enjoy looking at?", "ja": "どんなファッションを見るのが好きですか？", "f": ["What makes that style interesting?", "Do you admire the clothes or the confidence?"]}, {"n": "QUESTION 6", "t": "What would you buy if your clothing budget had no limit?", "ja": "服に使えるお金に制限がなければ、何を買いますか？", "f": ["Would quality or variety matter more?", "What would you still refuse to buy?"]}]}, {"n": 12, "title": "아직도 쓰는 가장 오래된 물건", "sub": "今も使っているいちばん古いもの", "titles": {"ko": "아직도 쓰는 가장 오래된 물건", "en": "The oldest thing you still use", "ja": "今も使っているいちばん古いもの"}, "chips": [], "jamo": false, "level": "C1", "decks": [{"href": "view/talk-things-i-like-full/32-the-oldest-thing-you-still-use/lecture", "level": "수업용", "slot": "lecture", "entry": "decks/talk-things-i-like-full/32-the-oldest-thing-you-still-use/lecture/index.html", "source": "courses/en/talk-things-i-like-full/lessons/32-the-oldest-thing-you-still-use/lecture/index.html"}, {"href": "view/talk-things-i-like-full/32-the-oldest-thing-you-still-use/prestudy", "level":
