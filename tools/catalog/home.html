<!DOCTYPE html>
<!-- VENDORED from podo-curriculum-public's root index.html — the language chooser
     that has been the front door for the curriculum. Byte-identical to it except
     for the edits listed here.

     Edits:
       1. The two language cards were written into the markup upstream, with their
          counts and track chips typed by hand. Here they are rendered from DATA,
          so the page cannot claim a track or a count that courses/ does not have.
       2. The retired-Japanese-archive footer link is dropped — this repo has no
          such archive.

     Filled by tools/build-catalog.py — do not edit the built file by hand. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="PODO speaking curricula for Japanese learners of Korean and English.">
<meta name="theme-color" content="#ffffff">
<title>PODO Curriculum</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="site.css">
<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

  * { box-sizing: border-box; }
  html { min-width: 320px; }
  body {
    margin: 0;
    color: var(--site-ink);
    background: #fff;
    font-family: "Pretendard", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .home {
    width: min(1040px, calc(100% - 40px));
    margin: 0 auto;
    padding: clamp(54px, 8vw, 88px) 0 56px;
  }

  .intro {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    display: block;
    max-width: none;
    padding: clamp(38px, 6vw, 58px) clamp(24px, 5vw, 48px);
    border: 1px solid #e6e8ea;
    border-radius: 8px;
    background:
      radial-gradient(circle at 3% 12%, rgba(112,174,43,.12), transparent 28%),
      radial-gradient(circle at 98% 8%, rgba(45,100,224,.11), transparent 29%),
      radial-gradient(circle at 88% 100%, rgba(210,58,111,.09), transparent 30%),
      #fbfcfd;
  }
  .intro::after { content: ""; position: absolute; z-index: -1; width: 250px; height: 250px; right: -105px; top: -145px; border: 46px solid rgba(45,100,224,.055); border-radius: 50%; }
  .spectrum { display: none; }
  .intro__copy { max-width: 780px; }
  .eyebrow {
    margin: 0 0 18px;
    color: #526842;
    font: 750 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    max-width: 760px;
    font-size: clamp(42px, 7vw, 68px);
    font-weight: 820;
    line-height: 1.02;
    letter-spacing: -.052em;
    text-wrap: balance;
  }
  .lede {
    max-width: 610px;
    margin: 24px 0 0;
    color: var(--site-muted);
    font-size: clamp(17px, 2vw, 20px);
    line-height: 1.65;
    text-wrap: pretty;
  }

  .section-label { margin: 42px 0 14px; color: var(--site-muted); font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  .curricula { display: grid; gap: 14px; }
  .curriculum {
    --accent: #4f7d10;
    --tint: #f2f7e8;
    display: grid;
    grid-template-columns: minmax(180px, .7fr) minmax(280px, 1.4fr) auto;
    gap: 36px;
    align-items: center;
    min-height: 230px;
    padding: 34px 32px;
    border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--site-line));
    border-top: 6px solid var(--accent);
    border-radius: 4px;
    background: linear-gradient(145deg, color-mix(in srgb, var(--tint) 80%, white), #fff 58%);
  }
  .curriculum.english { --accent: #2b5fd9; --tint: #eef2fd; }
  .curriculum__title { margin: 0; font-size: clamp(30px, 4vw, 42px); line-height: 1.08; letter-spacing: -.04em; }
  .curriculum__title span { display: block; margin-top: 7px; color: var(--site-muted); font-size: 14px; font-weight: 600; letter-spacing: 0; }
  .curriculum__copy p { max-width: 47ch; margin: 0; color: #454a44; font-size: 16px; line-height: 1.7; text-wrap: pretty; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 16px; color: var(--site-muted); font-size: 12.5px; font-weight: 650; }
  .meta .state { color: var(--site-ink); }
  .meta .state::before { content: ""; width: 7px; height: 7px; display: inline-block; margin-right: 7px; background: var(--accent); }
  .track-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 17px; }
  .track-list span { padding: 3px 7px; border-left: 3px solid var(--track); background: color-mix(in srgb, var(--track) 9%, white); color: #525852; font-size: 10.5px; font-weight: 700; }
  .actions { display: flex; flex-direction: column; align-items: stretch; gap: 8px; min-width: 142px; }
  .action {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 14px;
    border: 1px solid var(--site-ink);
    border-radius: 3px;
    color: var(--site-ink);
    background: #fff;
    font-size: 13px;
    font-weight: 750;
    text-decoration: none;
  }
  .action:hover { border-color: var(--accent); background: var(--accent); color: #fff; }
  .action.secondary { border-color: var(--site-line); color: var(--site-muted); }
  .action.secondary:hover { border-color: var(--site-line); color: var(--site-ink); background: var(--site-soft); }

  .home-footer {
    display: flex;
    justify-content: space-between;
    gap: 32px;
    padding-top: 30px;
    color: var(--site-muted);
    font-size: 12.5px;
  }
  .home-footer p { margin: 0; }
  .home-footer a { color: inherit; text-underline-offset: 3px; }

  @media (max-width: 760px) {
    .home { width: min(100% - 28px, 600px); padding-top: 64px; }
    .intro { padding: 34px 22px; border-radius: 6px; }
    .curriculum { grid-template-columns: 1fr; gap: 22px; padding: 27px 22px; }
    .actions { flex-direction: row; flex-wrap: wrap; min-width: 0; }
    .action { flex: 1 1 150px; }
    .home-footer { flex-direction: column; gap: 12px; }
  }
  .loc { display: flex; gap: 2px; margin-left: auto; padding: 2px; border: 1px solid #e3e7ea;
    border-radius: 4px; background: #fff; }
  .loc button { padding: 4px 9px; border: 0; border-radius: 2px; background: transparent;
    color: #62686e; font: inherit; font-size: 12px; font-weight: 650; cursor: pointer; }
  .loc button:hover { color: #16181a; }
  .loc button[aria-pressed="true"] { background: #16181a; color: #fff; }
</style>
</head>
<body>
<a class="podo-skip" href="#main" data-i18n="ui.skip">Skip to content</a>
<header class="podo-bar">
  <div class="podo-bar__inner">
    <a class="podo-brand" href="index.html" aria-current="page">
      <img src="favicon.svg" width="28" height="28" alt="">PODO Curriculum
    </a>
    <nav class="podo-nav" id="nav" aria-label="Curriculum navigation"></nav>
    <div class="loc" id="loc" role="group"></div>
  </div>
</header>

<main class="home" id="main">
  <header class="intro">
    <div class="spectrum" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="intro__copy">
      <p class="eyebrow" data-i18n="ui.homeKicker">Curriculum library</p>
      <h1 data-i18n="ui.homeH1">Speaking curricula for Japanese learners.</h1>
      <p class="lede" data-i18n="ui.homeLead">Choose a language to inspect its learning sequence, curriculum tracks, and available lesson decks.</p>
    </div>
  </header>

  <p class="section-label" data-i18n="ui.chooseLang">Choose a target language</p>
  <section class="curricula" id="curricula" aria-label="Available curricula">
  </section>

  <footer class="home-footer">
    <p id="foot"></p>
  </footer>
</main>

<script>
const DATA = /*__DATA__*/null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const I18N = DATA.i18n, LOCALES = ["ko", "ja", "en"], LS_KEY = "podo-catalog-locale";
const DEFAULT_LOCALE = "ja";   /* 지금 학습자는 전부 일본어 화자다 — 기기 설정을 묻지 않는다 */
function initialLocale() {
  try { const v = localStorage.getItem(LS_KEY); if (LOCALES.includes(v)) return v; } catch (e) {}
  return DEFAULT_LOCALE;
}
let L = initialLocale();
const tr = (sec, key) => ((I18N[sec] || {})[key] || {})[L] || ((I18N[sec] || {})[key] || {}).ko || "";
const loc = o => !o ? "" : (typeof o === "string" ? o : (o[L] || o.ko || o.en || o.ja || ""));

function paintI18n() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const [sec, key] = el.getAttribute("data-i18n").split(".");
    const v = tr(sec, key); if (v) el.textContent = v;
  });
  document.documentElement.lang = L;
}
function paintLocaleBar() {
  const bar = document.getElementById("loc");
  bar.setAttribute("aria-label", tr("locale", "label"));
  bar.innerHTML = LOCALES.map(c =>
    `<button type="button" data-loc="${c}" aria-pressed="${c === L}">` +
    `${esc((I18N.locale[c] || {})[c] || c)}</button>`).join("");
}

document.getElementById("nav").innerHTML = DATA.nav.map(n =>
  `<a${n.optional ? ` class="podo-nav__optional"` : ""} href="${esc(n.href)}">${esc(n.label)}</a>`).join("");

/* 카드는 courses/ 에서 센 값으로만 그린다 — 숫자와 말을 떼어 두어, 코스가 늘어도
   세 언어의 문장을 각각 고칠 일이 없다. */
function paintCards() {
  document.getElementById("curricula").innerHTML = DATA.languages.map(l => {
    const c = l.counts;
    const counts = `${c.tracks} ${tr("ui","countTracks")} · ${c.courses} ${tr("ui","countCourses")} · ${c.lessons} ${tr("ui","countLessons")}`;
    return `
  <article class="curriculum${l.modifier ? ` ${esc(l.modifier)}` : ""}">
    <h2 class="curriculum__title">${esc(l.name)}<span lang="${esc(l.nativeLang)}">${esc(l.native)}</span></h2>
    <div class="curriculum__copy">
      <p>${esc(loc(l.desc))}</p>
      <div class="meta"><span class="state">${esc(tr("ui", l.state))}</span><span>${esc(counts)}</span></div>
      <div class="track-list" aria-label="${esc(l.name)} tracks">${
        l.tracks.map(t => `<span style="--track:${esc(t.accent)}">${esc(t.label)}</span>`).join("")}</div>
    </div>
    <div class="actions">
      <a class="action" href="${esc(l.href)}">${esc(tr("ui","openCatalog"))} <span aria-hidden="true">→</span></a>
    </div>
  </article>`; }).join("");
}

document.getElementById("loc").addEventListener("click", e => {
  const b = e.target.closest("button[data-loc]");
  if (!b || b.dataset.loc === L) return;
  L = b.dataset.loc;
  try { localStorage.setItem(LS_KEY, L); } catch (err) {}
  paintI18n(); paintLocaleBar(); paintCards();
});

paintI18n(); paintLocaleBar(); paintCards();
</script>
</body>
</html>
