# Written by CI. Do not hand-edit.
#
# GT_CLASS_COURSE.ID is a DB-side autoincrement and it is also the S3 prefix
# (lemonboard-html/{ID}/), so YAML cannot know it. This file is what binds a
# repo slug to the row the last apply created — the same job a Terraform state
# file does. Lose it and the next apply creates duplicate courses rather than
# updating the live ones.
#
# digest is sha256 over the packaged zip's manifest. Unchanged digest → the
# upload is skipped, so an unrelated commit does not touch a live lesson.
apiVersion: podo.curriculum/v1
kind: State
environment: prod
courses: {}
