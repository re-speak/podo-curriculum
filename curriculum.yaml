apiVersion: podo.curriculum/v1
kind: Curriculum
metadata:
  name: podo-curriculum
  owners: [content-team]

spec:
  # Every course row this repo writes is CLASS_TYPE='PODO'. Nothing else is supported.
  classType: PODO

  # HTML 교재 only. The PDF path (podo-pdf-tool → page images → room pages) is
  # deliberately out of scope; grape still owns it for legacy courses.
  bookFormat: HTML

  # Which languages live under courses/. The directory name IS the LANG_TYPE.
  languages:
    kr:
      langType: KR
      # Support text inside a deck is written in this language, not English.
      audience: ja
      displayName: 한국어
    en:
      langType: EN
      # Same Japanese-speaking audience as kr — the subject taught is what
      # differs, so support text here is Japanese too, never Korean.
      #
      # PODO/EN already exists in grape, but as the Korea-market product: every
      # one of those rows is COUNTRY_CODE='KR'. COUNTRY_CODE is part of the
      # natural key, and these courses are 'JP', so they land in an empty corner
      # of it rather than upserting over the Korean market's English catalogue.
      audience: ja
      displayName: English

  # 교재 오브젝트는 GCS(podo-assets)에 있다. AWS S3(respeak-lemonade)에서 이관했다 —
  # grape 의 공개 자산을 podo-assets 로 모으는 방향에 맞춘 것이고, 교재 HTML/CSS/이미지는
  # lemonboard 룸이 입장 시 공개 fetch 하는 자산이라 공개 버킷이 맞다.
  #
  # 경로에 .php 가 붙는 것에 주의 — grape 는 라우터가 없는 평범한 PHP 파일 서빙이라
  # 확장자 없는 /api/curriculum/sync 는 404 다.
  #
  # grapeSyncApi 는 공개 호스트를 쓴다. *.podo.internal 로 두면 Cloud Build 기본 풀에서
  # 닿지 않아 전용 워커풀(VPC 접근)이 필요해진다 — 인증이 OIDC 라 공개 경로여도 무방하다.
  #
  # 여기 적힌 bucket/prefix 는 참조용이다 — apply.py 는 grape sync 엔드포인트에 POST 만 하고
  # 오브젝트를 직접 올리지 않는다. 업로드 주체는 grape(uploadLessonHtmlZip)다.
  #
  # prefix 가 환경마다 다른 것에 주의: 전 환경의 grape 가 같은 SA 로 같은 버킷에 쓰고
  # stage DB 는 prod 클론이라 교재 ID 공간이 겹친다. 그래서 비프로덕션만 -{env} 접미사를
  # 붙여 가른다(prod 는 이미 이관된 경로라 그대로 둔다). 이 값은 grape 가 스스로
  # 계산하는 것과 같아야 한다 — lemonboardHtmlPrefix() 가 getPodoEnv() 로 같은 규칙을 쓴다.
  #
  # lemonboardApi 가 qa·dev 에서 stage 를 가리키는 것은 오타가 아니다. 레몬보드 자체가
  # prod·stage 두 벌뿐이고 podo 의 dev·stage·qa 세 환경이 모두 stage 레몬보드에 붙는다.
  # grape 도 같은 가정 위에 있다 — new Lemonboard(getPodoEnv() == "prod") 이므로
  # 비프로덕션은 전부 stage 레몬보드로 간다. 그래서 룸은 한 레몬보드에 세 벌 생기고,
  # 서로를 가르는 것은 룸 이름이 아니라 contentUrl 의 -{env} prefix 다.
  environments:
    dev:
      lemonboardApi: https://stage-lemonboard-api.re-speak.com
      grapeSyncApi: https://dev-grape.re-speak.com/api/curriculum/sync.php
      gcsBucket: podo-assets
      gcsPrefix: lemonboard-html-dev
      publicBaseUrl: https://storage.googleapis.com/podo-assets/
    qa:
      lemonboardApi: https://stage-lemonboard-api.re-speak.com
      grapeSyncApi: https://qa-grape.re-speak.com/api/curriculum/sync.php
      gcsBucket: podo-assets
      gcsPrefix: lemonboard-html-qa
      publicBaseUrl: https://storage.googleapis.com/podo-assets/
    stage:
      lemonboardApi: https://stage-lemonboard-api.re-speak.com
      grapeSyncApi: https://stage-grape.re-speak.com/api/curriculum/sync.php
      gcsBucket: podo-assets
      gcsPrefix: lemonboard-html-stage
      publicBaseUrl: https://storage.googleapis.com/podo-assets/
    prod:
      lemonboardApi: https://lemonboard-api.re-speak.com
      grapeSyncApi: https://grape.re-speak.com/api/curriculum/sync.php
      gcsBucket: podo-assets
      gcsPrefix: lemonboard-html
      publicBaseUrl: https://storage.googleapis.com/podo-assets/

  # 공유 런타임(shared/css, shared/js)은 덱마다 복사해 싣지 않고 CDN 에서 받는다.
  # 런타임 원본은 이 저장소의 shared/{css,js} 다. 거기를 고치고, 여기 version 을 올린
  # 다음 tools/publish-shared.py 로 공개 미러에 불변 태그를 끊는다. 발행이 먼저다 —
  # 아직 없는 태그를 가리키는 덱은 수업 중에 조용히 404 가 된다.
  #
  # version 은 반드시 태그다. jsDelivr 는 태그를 박은 URL 만 영구 캐시하고(immutable),
  # @main 같은 브랜치 ref 는 12 시간마다 다시 확인한다 — 그 12 시간 동안 엣지마다
  # 서로 다른 버전을 내려주므로, 수업 중 일부 학습자에게만 활동이 죽는 형태로 터진다.
  #
  # 레포 전체가 이 한 값을 공유한다. 덱이 다른 버전을 가리키면 validate 가 막는다.
  # 올리는 순서가 중요하다 — 먼저 publish 해서 태그를 살려두고, 그 다음에 덱을 옮긴다.
  # 반대로 하면 아직 없는 태그를 가리키는 덱이 배포되고, 수업에서 404 로 조용히 죽는다.
  sharedRuntime:
    baseUrl: https://cdn.jsdelivr.net/gh/re-speak/podo-curriculum-shared
    repo: re-speak/podo-curriculum-shared
    version: v1.49.0
    join: "@"
    # jsDelivr intentionally serves repository HTML as text/plain with nosniff.
    # The full runtime is therefore mirrored to this versioned GCS path as well;
    # report.html and all of its relative css/js/assets remain one immutable unit.
    gcsMirror:
      bucket: podo-assets
      prefix: podo-curriculum-shared
      publicBaseUrl: https://podo-assets.storage.googleapis.com/podo-curriculum-shared

  # Directories the sync tool will never walk, no matter what is inside them.
  # sandbox/ is committed on purpose — experiments should be reviewable — but it
  # is structurally undeployable, not merely conventionally so. See tools/model.py.
  neverDeploy:
    - sandbox
    - references
    - docs
