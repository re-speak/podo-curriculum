<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>できる韓国語 初級Ⅰ · 페이지 스캔 — 한국어 커리큘럼</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

  :root {
    --ink: #1c1c1c;
    --green: #6abe36;
    --green-text: #3f7a1c;
    --green-100: #f2fcec;
    --gray-100: #f5f5f5;
    --gray-200: #e8e8e8;
    --gray-400: #a5a5a5;
    --gray-500: #757575;
    --line: #e7e7e7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fafafa;
    color: var(--ink);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px 100px; }
  @media (max-width: 600px) { .wrap { padding: 0 18px 70px; } }

  .bar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 22px 0 16px; border-bottom: 1px solid var(--line);
  }
  .bar a.back { color: var(--gray-500); font-size: 13px; font-weight: 700; text-decoration: none; }
  .bar a.back:hover { color: var(--green-text); }
  .bar .pathchip {
    margin-left: auto; padding: 4px 10px; background: var(--gray-100); border-radius: 6px;
    color: var(--gray-500); font-size: 12px; font-weight: 600;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  header { padding: 34px 0 8px; }
  .kicker { display: block; color: var(--green-text); font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
  h1 { margin: 10px 0 16px; padding-bottom: 14px; font-size: 28px; font-weight: 850; letter-spacing: -.02em; border-bottom: 3px solid var(--ink); word-break: keep-all; }
  .lead { max-width: 60ch; margin: 0; color: #3f3f3f; font-size: 15px; line-height: 1.7; }
  .lead a { color: var(--green-text); font-weight: 700; text-decoration: none; border-bottom: 1.5px solid var(--green-100); }
  .lead a:hover { border-bottom-color: var(--green); }

  .grid {
    display: grid; gap: 18px; margin-top: 28px;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  }
  .card {
    display: block; background: #fff; border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; text-decoration: none; color: var(--ink);
  }
  .card:hover { border-color: var(--green); box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .card img { display: block; width: 100%; height: auto; background: var(--gray-100); }
  .card .meta { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-top: 1px solid var(--line); }
  .card .no { font-size: 13px; font-weight: 800; }
  .card .md {
    margin-left: auto; padding: 3px 8px; background: var(--green-100); border-radius: 999px;
    color: var(--green-text); font-size: 11px; font-weight: 800;
  }
  .card .md:hover { background: var(--green-text); color: #fff; }
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <a class="back" href="../../../index.html">← 한국어 홈</a>
    <span class="pathchip">references/curricula/dekiru-kankokugo/</span>
  </div>

  <header>
    <span class="kicker">레퍼런스 · 교재 스캔</span>
    <h1>できる韓国語 初級Ⅰ · 페이지 스캔</h1>
    <p class="lead">
      137페이지 전체 스캔. 페이지를 누르면 원본 이미지가, <strong>텍스트</strong> 배지를 누르면
      해당 페이지를 옮겨 적은 와이어프레임 문서가 열립니다.
      전체를 이어 붙인 정리본은 <a href="../../../viewer.html?doc=references/curricula/dekiru-kankokugo/dekiru-kankokugo-1-clean.md">교재 전문</a>,
      패턴 순서만 뽑은 요약은 <a href="../../../viewer.html?doc=references/curricula/dekiru-kankokugo/dekiru-kankokugo-1-pattern-map.md">패턴 지도</a>에 있습니다.
    </p>
  </header>

  <div class="grid" id="grid"></div>

</div>

<script>
  (function () {
    var TOTAL = 137;
    var html = '';
    for (var i = 1; i <= TOTAL; i++) {
      var n = String(i).padStart(3, '0');
      html +=
        '<div class="card">' +
          '<a href="page-images/page-' + n + '.png">' +
            '<img loading="lazy" src="page-images/page-' + n + '.png" alt="' + i + '페이지 스캔">' +
          '</a>' +
          '<div class="meta">' +
            '<span class="no">p.' + i + '</span>' +
            '<a class="md" href="../../../viewer.html?doc=references/curricula/dekiru-kankokugo/page-wireframes-md/page_' + n + '.md">텍스트</a>' +
          '</div>' +
        '</div>';
    }
    document.getElementById('grid').innerHTML = html;
  })();
</script>
</body>
</html>
