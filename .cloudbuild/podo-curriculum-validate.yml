# 커리큘럼 검증 빌드 (트리거: podo-curriculum-validate, PR)
#
# GitHub Actions `.github/workflows/validate.yml` 을 대체한다. 옮긴 이유는 두 가지다.
#   1) 이 조직의 GitHub Actions 는 self-hosted day1-runner-respeak 을 써야 한다(IP allowlist).
#      러너 가용성이 곧 PR 체크 가용성이 되는데, 커리큘럼은 콘텐츠 작업자가 PR 을 올리는 곳이라
#      "러너가 안 붙어서 체크가 안 돈다"가 그대로 저작 정체로 이어진다.
#   2) --contract 와 PR 코멘트가 GitHub secret 을 요구했다. Cloud Build 는 같은 토큰을
#      Secret Manager 에서 빌드 SA 권한으로 읽으므로 GitHub 쪽에 secret 을 두지 않는다.
#
# 소스 = PR head 자동 체크아웃(repository_event_config). base 는 stage 와 main 둘 다 받는다 —
# 작업 PR 은 stage 로, 승격 PR(stage → main)은 main 으로 들어오고, 후자가 머지되면 prod 배포다.
timeout: 900s

options:
  logging: CLOUD_LOGGING_ONLY

# 코멘트용 토큰. cloud-build JSON 안의 GITHUB_PAT(fine-grained)을 쓴다.
#
# 이 토큰은 처음에 PR 코멘트에서 403 이었다. 원인은 레포 허용 목록이 아니라 권한이다 —
# 토큰은 조직 전체 레포에 접근하고 Issues 도 write 였지만 Pull requests 권한이 없었다.
# 코멘트는 issues/{n}/comments 경로로 달지만 대상이 PR 이면 pull_requests 권한이 지배한다
# (그래서 이슈 생성은 되는데 PR 코멘트만 막혔다). 토큰에 Pull requests: Read and write 를
# 추가해 해결했다.
#
# classic PAT(cloud-build-github-prod)은 쓰지 않는다 — 그 시크릿은 빌드 SA cloud-build@ 가
# 읽을 수 없고, 읽게 하려면 모든 배포 트리거가 공유하는 SA 에 조직 전체 권한 PAT 을 붙이게 된다.
availableSecrets:
  secretManager:
    - versionName: projects/904677155509/secrets/cloud-build/versions/latest
      env: CB_SECRET
    # data-sync 계약 검증기(lemonboard) 호출용. grape-admin 번들(152개 키: DB 비번·결제·
    # Slack 토큰…)에도 같은 값이 있지만 그걸 쓰지 않는다 — PR 을 여는 누구나 트리거하는
    # 빌드에 프로덕션 자격증명 전부를 노출하게 된다. 값만 복제한 전용 시크릿을 쓴다.
    - versionName: projects/904677155509/secrets/curriculum-lemonboard-key-stage/versions/latest
      env: PODO_LEMONBOARD_API_KEY
    # Slack 알림용. podo-common 은 키가 5개뿐이라 좁고, cloud-build@ 가 이미 읽을 수 있다
    # (db-issue·reclaim-reaper 와 같은 토큰).
    - versionName: projects/904677155509/secrets/podo-common/versions/latest
      env: PODO_COMMON

steps:
  # 검증과 계획. 여기서 실패하면 PR 체크가 빨개진다 — 그게 이 빌드의 본체다.
  - id: validate-and-plan
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    secretEnv: [PODO_LEMONBOARD_API_KEY]
    args:
      - -ceu
      - |
        # cloud-sdk:slim 의 python 은 PEP 668(externally-managed) 이라 시스템 설치를 막는다.
        # 빌드 컨테이너는 일회용이라 venv 를 만들 이유가 없으므로 그 보호를 끈다.
        pip install --break-system-packages --quiet -r tools/requirements.txt

        # 은퇴 검사(layer 6)의 기준점. 이 PR 이 들어갈 브랜치의 현재 상태와 비교해
        # "살아 있던 코스가 말없이 사라졌는가"를 본다. PR 체크아웃은 얕을 수 있어
        # 기준 브랜치를 따로 받아 둔다 — 못 받으면 layer 6 은 실패가 아니라 건너뛴다.
        BASE="origin/$${_BASE_BRANCH:-stage}"
        git fetch origin "$${_BASE_BRANCH:-stage}" --depth=1 --quiet || true
        echo "은퇴 검사 기준: $$BASE"

        # 이 PR 이 머지되면 어디로 나가는지에 따라 plan 을 다르게 보여준다. base 가 main 이면
        # 다음 머지는 prod 배포다 — 거기서 stage plan 을 보여주면 리뷰어가 자기가 무엇을
        # 승인하는지 오해한다.
        case "$${_BASE_BRANCH:-}" in
          main) PLAN_ENV=prod ;;
          *)    PLAN_ENV=stage ;;
        esac

        # validate.py 는 키 없이 --contract 를 요구하면 거부한다 — 인증 거절이 "깨끗한 통과"로
        # 읽히지 않게 하려는 것이다. 그래서 키 유무로 여기서 갈라준다. 나머지 검증층은 어느 쪽이든 돈다.
        # (--contract 는 lemonboard 자체 검증기를 부르며 네트워크 장애·5xx 에는 fail-open 이다.
        #  lemonboard 가 죽었다고 PR 이 막히면 안 되고, 진짜 data-sync 위반만 막아야 한다.)
        #
        # 검증은 base 가 main 이어도 stage 검증기로 돈다. plan 과 달리 여기서 환경을 따라가지
        # 않는 건, 그러려면 prod 검증기 키를 "PR 을 여는 누구나 트리거하는 빌드"에 넣어야 하기
        # 때문이다(아래 availableSecrets 주석). 두 검증기는 같은 계약을 보므로 판정이 갈릴
        # 이유가 없고, prod 키로 하는 검증은 배포 빌드가 apply 직전에 다시 한다.
        # 실패해도 여기서 죽이지 않는다. Slack 알림 스텝이 돌아야 하기 때문이다.
        # 최종 판정은 마지막 verdict 스텝이 한다.
        set +e
        if [ -n "$${PODO_LEMONBOARD_API_KEY:-}" ]; then
          python3 tools/validate.py --contract --env stage --base "$$BASE" 2>&1 | tee /workspace/validate.log
        else
          echo "PODO_LEMONBOARD_API_KEY 미설정 — data-sync 계약 검사 없이 진행한다" | tee /workspace/validate.log
          python3 tools/validate.py --env stage --base "$$BASE" 2>&1 | tee -a /workspace/validate.log
        fi
        echo "$${PIPESTATUS[0]}" > /workspace/validate.rc
        set -e

        if [ "$(cat /workspace/validate.rc)" != "0" ]; then
          echo "검증 실패 — plan 을 건너뛴다"
          exit 0
        fi

        {
          echo "### Curriculum plan — \`$$PLAN_ENV\`"
          echo
          echo '```'
          python3 tools/plan.py --env "$$PLAN_ENV"
          echo '```'
          echo
          if [ "$$PLAN_ENV" = "prod" ]; then
            echo '_머지하면 `podo-curriculum-deploy-prod` 가 돌아 **prod 에 그대로 적용된다.** 수업 중인 학습자가 보는 것이 바뀐다._'
          else
            echo '_머지하면 `podo-curriculum-deploy-stage` 가 돌아 stage 에 적용된다._'
          fi
        } | tee /workspace/plan.md
    env:
      - "_BASE_BRANCH=$_BASE_BRANCH"

  # 코멘트는 부가 기능이다. 토큰·API 문제로 코멘트를 못 달았다고 검증 결과를 뒤집지 않는다 —
  # plan 은 앞 단계의 빌드 로그에 이미 남아 있다. (allowFailure 를 지우지 말 것)
  - id: comment-plan
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    secretEnv: [CB_SECRET]
    allowFailure: true
    args:
      - -ceu
      - |
        if [ -z "$${_PR_NUMBER:-}" ]; then
          echo "PR 번호가 없다 — 코멘트를 건너뛴다"; exit 0
        fi
        # 검증이 실패하면 plan 을 만들지 않았다. 붙일 게 없으니 조용히 넘어간다.
        [ -f /workspace/plan.md ] || { echo "plan 없음(검증 실패) — 코멘트를 건너뛴다"; exit 0; }
        export GH_TOKEN="$$(printf '%s' "$$CB_SECRET" | python3 -c 'import sys,json;print(json.load(sys.stdin)["GITHUB_PAT"])')"
        export PR_NUMBER="$_PR_NUMBER"
        python3 - <<'PY'
        import json, os, urllib.request

        repo = "re-speak/podo-curriculum"
        pr = os.environ["PR_NUMBER"]
        body = open("/workspace/plan.md", encoding="utf-8").read()
        marker = "### Curriculum plan"
        token = os.environ["GH_TOKEN"]

        def api(path, method="GET", payload=None):
            req = urllib.request.Request(
                f"https://api.github.com/repos/{repo}/{path}", method=method,
                data=json.dumps(payload).encode() if payload else None,
                headers={"Authorization": f"Bearer {token}",
                         "Accept": "application/vnd.github+json",
                         "Content-Type": "application/json"})
            with urllib.request.urlopen(req) as r:
                return json.loads(r.read() or "null")

        # 푸시마다 새 코멘트를 쌓지 않고 자기 코멘트를 덮어쓴다.
        mine = next((c for c in api(f"issues/{pr}/comments")
                     if c["body"].startswith(marker)), None)
        if mine:
            api(f"issues/comments/{mine['id']}", "PATCH", {"body": body})
            print(f"코멘트 갱신: {mine['id']}")
        else:
            api(f"issues/{pr}/comments", "POST", {"body": body})
            print("코멘트 생성")
        PY
    env:
      - "_PR_NUMBER=$_PR_NUMBER"

  # data-sync 계약 위반을 Slack 으로 알린다.
  #
  # 왜 굳이 알리나 — 이 위반은 조용히 실패한다. 배포돼도 에러가 없고, 수업 중에 두 화면이
  # 어긋날 뿐이라 아무도 신고하지 않는다. PR 체크가 빨개지는 것만으로는 덱을 올린 사람이
  # 알아채지 못할 수 있어서, 채널로 밀어 넣는다.
  #
  # 알림 실패가 검증 결과를 뒤집으면 안 되므로 allowFailure 다.
  - id: notify-contract-violation
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    secretEnv: [PODO_COMMON]
    allowFailure: true
    args:
      - -ceu
      - |
        [ "$(cat /workspace/validate.rc)" = "0" ] && { echo "검증 통과 — 알리지 않는다"; exit 0; }

        export SLACK_TOKEN="$$(printf '%s' "$$PODO_COMMON" | python3 -c 'import sys,json;print(json.load(sys.stdin)["PODO_NOTIFICATOR_SLACK_TOKEN"])')"
        export PR_NUMBER="$_PR_NUMBER"
        export COMMIT_SHA="$COMMIT_SHA"
        python3 - <<'PY'
        import json, os, re, urllib.request

        CHANNEL = 'C0AM7GN9J0Y'
        SLACK_TEXT_LIMIT = 3500          # 한 메시지 4000자 제한에 여유를 둔다
        log = open('/workspace/validate.log', encoding='utf-8', errors='replace').read()

        # 계약 위반만 추린다. 다른 검증 실패(스키마·구조·패키징)는 이 채널의 관심사가 아니다.
        # warning 줄('  ~ …: warning — …')은 제외한다 — register() 로 오는 런타임 kind 처럼
        # 정적으로는 확정할 수 없을 뿐 막을 일이 아닌데, 세면 건수가 부풀고 덱 목록에
        # '~ 덱이름' 이라는 가짜 항목이 생긴다.
        violations = [l.strip(' •\t') for l in log.splitlines()
                      if 'data-sync-id=' in l and not l.lstrip().startswith('~')]
        if not violations:
            print('계약 위반은 없다(다른 사유의 실패) — 알리지 않는다')
            raise SystemExit(0)

        by_deck = {}
        for v in violations:
            deck = v.split(':', 1)[0] if ':' in v else '(unknown)'
            by_deck.setdefault(deck, []).append(v)

        pr = os.environ.get('PR_NUMBER') or ''
        sha = (os.environ.get('COMMIT_SHA') or '')[:7]
        link = f'https://github.com/re-speak/podo-curriculum/pull/{pr}' if pr else ''

        def post(text, thread_ts=None):
            payload = {'channel': CHANNEL, 'text': text}
            if thread_ts:
                payload['thread_ts'] = thread_ts
            req = urllib.request.Request(
                'https://slack.com/api/chat.postMessage',
                data=json.dumps(payload).encode(),
                headers={'Authorization': f"Bearer {os.environ['SLACK_TOKEN']}",
                         'Content-Type': 'application/json; charset=utf-8'})
            return json.loads(urllib.request.urlopen(req, timeout=15).read())

        # 채널에는 제목만 뜬다. 어느 덱의 어느 id 가 문제인지는 스레드에서 본다 —
        # 한 덱이 수십 줄을 내므로 본문까지 채널에 밀어 넣으면 다른 알림이 묻힌다.
        head = '\n'.join([
            '*커리큘럼 덱이 data-sync 규약을 어겼습니다*',
            f'PR <{link}|#{pr}> · `{sha}` · 위반 {len(violations)}건 / 덱 {len(by_deck)}개' if pr
            else f'`{sha}` · 위반 {len(violations)}건 / 덱 {len(by_deck)}개',
            '',
            '_이 덱은 배포돼도 수업 중 두 화면이 어긋납니다. 자세한 내용은 스레드, 규약은 레포 CLAUDE.md 참고._',
        ])
        res = post(head)
        if not res.get('ok'):
            print(f"slack 실패(제목): {res.get('error')}")
            raise SystemExit(0)
        thread_ts = res['ts']

        # 스레드에서는 id 를 자르지 않는다. 고치려면 전부 필요하다. 한 덱만으로 한도를
        # 넘기는 경우에만 잘라내고, 잘랐다는 사실을 그 자리에 적는다 — 조용히 줄이면
        # 목록이 전부인 줄 알고 나머지를 놓친다.
        blocks = []
        for deck, vs in sorted(by_deck.items()):
            ids = [m.group(1) for v in vs
                   for m in [re.search(r'data-sync-id="([^"]+)"', v)] if m]
            head_line = f'• `{deck}` — {len(vs)}건'
            shown = list(ids)
            while shown and len(head_line) + len(', '.join(shown)) + 80 > SLACK_TEXT_LIMIT:
                shown.pop()
            tail = ('' if len(shown) == len(ids)
                    else f'\n   _외 {len(ids) - len(shown)}건은 빌드 로그 참고_')
            blocks.append(head_line + '\n   ' + ', '.join(f'`{i}`' for i in shown) + tail)

        # 덱 하나가 한도를 넘길 수도 있으므로, 블록을 붙여 가다 넘치면 끊어 보낸다.
        chunk = ''
        for block in blocks:
            if chunk and len(chunk) + len(block) + 1 > SLACK_TEXT_LIMIT:
                post(chunk, thread_ts)
                chunk = ''
            chunk = f'{chunk}\n{block}' if chunk else block
        if chunk:
            post(chunk, thread_ts)
        print('slack ok')
        PY

  # 저작 게이트. validate.py 는 배포 가능성(스키마·패키징·계약·핀·은퇴)을 보고,
  # 이 스텝은 내용을 본다 — 두 커리큘럼이 공유하는 규칙과 한국어 전용 규칙.
  #
  # 왜 이제야 게이트가 되나: 이 검사들은 지금까지 사람이 기억해서 손으로 돌리는
  # 것이었고, 배포 빌드 주석이 그 사실을 이렇게 적어 두었다 — "커리큘럼은 나쁜 덱이
  # 수업 중인 학습자에게 그대로 보이고, 그걸 잡아줄 lint 가 없다". 규칙이 언어를
  # 넘지 못한 이유도 절반은 이것이었다. 검사가 머지를 막지 않으면 규칙의 사정거리는
  # 그때 그 사람이 기억한 만큼이다.
  #
  # 대상은 sandbox/drafts 다. courses/ 는 promote.py 가 만든 산출물이고 이미
  # validate.py 가 본다. 저작 규칙은 저작하는 자리에서 걸려야 고칠 수 있다.
  - id: authoring-gate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    waitFor: ['-']
    args:
      - -ceu
      - |
        pip install --break-system-packages --quiet -r tools/requirements.txt

        rc=0
        run() {
          echo "────────── $$1 ──────────"
          shift
          "$$@" || rc=1
        }

        # 두 언어 공용. --all 이 아니라 초안만 본다.
        run "덱 정적 검사(두 언어)" python3 tools/authoring/check_deck.py sandbox/drafts
        run "영어 코퍼스 무결성"    python3 tools/authoring/en/corpus_integrity.py

        # 한국어 전용. 판정을 내리는 검사만 게이트에 넣는다 —
        # check_distractors 는 설계상 후보만 내놓으므로 --strict 없이는 판정이 아니다.
        for check in check_structure check_teaching check_reorder check_freetalk check_syllabus check_chips; do
          run "kr/$$check" python3 "tools/authoring/kr/$$check.py"
        done

        # 인용 부호는 아직 게이트가 아니다. 규약을 영어로 넓힌 직후라 한국어 111줄 ·
        # 영어 277줄이 규약 이전에 쓰인 채로 남아 있고, 지금 막으면 모든 PR 이 막힌다.
        # 쓸어낸 뒤 위 목록으로 올린다. 그때까지는 숫자를 보이게만 둔다.
        echo "────────── 인용 부호(조언, 게이트 아님) ──────────"
        python3 tools/authoring/check_quotes.py --all || true

        echo "$$rc" > /workspace/authoring.rc
        exit 0

  # 최종 판정. 검증이 실패했으면 여기서 빌드를 빨갛게 만든다.
  - id: verdict
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    # 두 게이트를 모두 기다린다. 기본값(바로 앞 스텝)에 맡기면 authoring-gate 가
    # waitFor: ['-'] 로 먼저 시작하는 탓에 validate-and-plan 이 끝나기 전에
    # 판정이 날 수 있다.
    waitFor: [validate-and-plan, authoring-gate]
    args:
      - -ceu
      - |
        rc="$(cat /workspace/validate.rc)"
        arc="$(cat /workspace/authoring.rc 2>/dev/null || echo 0)"
        [ "$$rc" = "0" ]  || { echo "검증 실패(rc=$$rc)"; fail=1; }
        [ "$$arc" = "0" ] || { echo "저작 게이트 실패(rc=$$arc)"; fail=1; }
        [ -z "$${fail:-}" ] || exit 1
        echo "검증 통과"
