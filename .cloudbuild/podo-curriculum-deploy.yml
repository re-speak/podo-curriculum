# 커리큘럼 배포 빌드 (환경 = 브랜치)
#
#   stage 브랜치 push → podo-curriculum-deploy-stage (_DEPLOY_ENV=stage,qa,dev)
#   main  브랜치 push → podo-curriculum-deploy-prod  (_DEPLOY_ENV=prod)
#
# 두 트리거가 이 파일 하나를 공유한다. GitHub Actions 의 deploy-stage.yml / deploy-prod.yml 을
# 합친 것이고, grape·podo-backend 와 같은 규약이다 — 환경 분기는 case 가드가 한다.
#
# _DEPLOY_ENV 는 콤마로 여러 환경을 받는다. 비프로덕션이 셋(stage·qa·dev)인데 브랜치는
# stage 하나뿐이라, 브랜치를 늘리는 대신 한 브랜치가 세 환경을 채우게 했다. 환경마다
# 브랜치를 두면 그 브랜치들 사이의 머지가 또 하나의 릴리스 절차가 되고, 그때부터
# "어느 환경이 무엇을 보고 있는가"를 사람이 추적해야 한다.
#
# 순서는 stage → qa → dev 이고 한 환경이 실패하면 거기서 멈춘다. 뒤 환경을 계속 밀어
# 실패를 반쯤 가린 초록 빌드를 만드는 것보다, 어디서 멈췄는지가 로그에 남는 편이 낫다.
# apply 는 자연키 upsert + GCS 덮어쓰기라 재실행이 안전하므로 재시도 비용도 낮다.
#
# 둘 다 자동인 이유: 사람이 기억해서 눌러야 하는 배포는 반드시 언젠가 안 눌린다. 그러면
# 브랜치가 가리키는 것과 학습자가 보는 것이 어긋나고, 그걸 알려 줄 신호가 없다. 머지가 곧
# 반영이어야 그 간격이 생기지 않는다 — stage 든 prod 든 마찬가지다.
#
# 환경을 브랜치로 가른 이유: 게이트가 "누가 무엇을 실행했는가"가 아니라 "무엇이 머지됐는가"에
# 놓인다. prod 로 나갈 것은 stage → main PR 로 리뷰되고, 그 리뷰 기록이 곧 배포 기록이다.
# 태그(prod-*)를 쓰지 않는 이유는 그대로다 — 태그 push 는 GitHub 이벤트라 Actions 를 다시
# 부르게 되고, 이 조직의 Actions 는 self-hosted 러너에 묶여 있다.
#
# 임의 브랜치 × 임의 환경의 수동 재배포(롤백·핫픽스 확인)는 podo-curriculum-deploy 가 남아 있다:
#   gcloud builds triggers run podo-curriculum-deploy --region=asia-northeast3 \
#     --branch=<브랜치> --substitutions=_DEPLOY_ENV=<dev|qa|stage|prod[,...]>
# 30분이었다. stage 트리거는 _DEPLOY_ENV=stage,qa,dev 로 세 환경을 순서대로 도는데,
# 한국어 카탈로그 49코스 480과가 들어오면서 한 환경이 12분쯤 걸리게 됐다 — 세 환경이면
# 36분이라 예산을 넘는다. 실제로 넘겼다: stage·qa 는 529행을 다 받고 dev 가 297행에서
# 잘린 채 빌드가 TIMEOUT 으로 끝났다.
#
# 타임아웃으로 끊긴 배포는 실패 중에서도 고약한 쪽이다. 앞선 환경은 성공했고 뒤의 환경만
# 반쯤 반영된 상태로 남는데, apply.py 가 순수 upsert 라 어디까지 갔는지 아무 데도 적히지
# 않는다. 남는 것은 환경마다 다른 코스 목록뿐이다.
#
# 90분은 지금 필요한 40분의 두 배가 조금 넘는다. 카탈로그가 자라도 한동안 버틴다.
# 이 값이 다시 모자라면 늘리기 전에 환경을 병렬로 도는 것을 먼저 보라 — 세 환경은
# 서로를 기다릴 이유가 없고, 그러면 벽시계는 가장 느린 환경 하나로 줄어든다.
timeout: 5400s

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _DEPLOY_ENV: stage

availableSecrets:
  secretManager:
    - versionName: projects/904677155509/secrets/cloud-build/versions/latest
      env: CB_SECRET
    # 계약 검증기 키. 환경별로 갈린다 — stage 는 stage 검증기, prod 는 prod 검증기.
    - versionName: projects/904677155509/secrets/curriculum-lemonboard-key-stage/versions/latest
      env: LB_KEY_STAGE
    - versionName: projects/904677155509/secrets/curriculum-lemonboard-key-prod/versions/latest
      env: LB_KEY_PROD

steps:
  - id: guard
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        # 콤마를 공백으로 바꿔 목록으로 다룬다. 값 하나짜리도 원소 하나인 목록이라 분기가 없다.
        TARGETS="$$(echo "$_DEPLOY_ENV" | tr ',' ' ')"
        [ -n "$${TARGETS// /}" ] || { echo "_DEPLOY_ENV 가 비어 있다"; exit 1; }

        for env in $$TARGETS; do
          case "$$env" in
            dev|qa|stage|prod) ;;
            *) echo "_DEPLOY_ENV 는 dev|qa|stage|prod 만 허용한다 (받은 값: $$env)"; exit 1 ;;
          esac
        done

        # prod 는 main 에 올라간 것만 나간다. 커리큘럼은 나쁜 덱이 수업 중인 학습자에게 그대로
        # 보이고, 그걸 잡아줄 lint 가 없다 — 리뷰가 유일한 게이트라서 우회를 막는다.
        #
        # main push 트리거에서는 이 검사가 늘 통과한다(자기 자신이 main 이니까). 남겨 두는 건
        # 수동 트리거 때문이다 — podo-curriculum-deploy 는 --branch 를 자유롭게 받으므로,
        # 리뷰를 거치지 않은 브랜치를 prod 로 미는 경로가 그쪽에는 여전히 열려 있다.
        #
        # 목록 어딘가에 prod 가 섞여 있어도 같은 검사를 받는다 — "stage,prod" 로 부르면
        # 가드를 건너뛸 수 있게 두면 가드가 아니다.
        case " $$TARGETS " in
          *" prod "*)
            git fetch origin main --depth=200 --quiet
            if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
              echo "$COMMIT_SHA 는 main 의 조상이 아니다 — prod 는 리뷰된 것만 배포한다"
              exit 1
            fi
            ;;
        esac

  - id: apply
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    secretEnv: [CB_SECRET, LB_KEY_STAGE, LB_KEY_PROD]
    args:
      - -ceu
      - |
        # cloud-sdk:slim 의 python 은 PEP 668(externally-managed) 이라 시스템 설치를 막는다.
        # 빌드 컨테이너는 일회용이라 venv 를 만들 이유가 없으므로 그 보호를 끈다.
        pip install --break-system-packages --quiet -r tools/requirements.txt

        for DEPLOY_ENV in $$(echo "$_DEPLOY_ENV" | tr ',' ' '); do
        echo "══════════ $$DEPLOY_ENV ══════════"

        # 환경에 맞는 검증기 키를 고른다. 비프로덕션 셋(stage·qa·dev)은 모두 stage
        # 레몬보드에 붙으므로 검증기도 stage 것 하나를 공유한다 — 애초에 prod 말고는
        # 레몬보드가 stage 한 벌뿐이다.
        if [ "$$DEPLOY_ENV" = "prod" ]; then
          export PODO_LEMONBOARD_API_KEY="$$LB_KEY_PROD"
        else
          export PODO_LEMONBOARD_API_KEY="$$LB_KEY_STAGE"
        fi

        # 키가 없으면 --contract 를 빼고 돈다. validate.py 는 키 없는 --contract 를 거부하는데,
        # 그건 인증 거절이 통과로 읽히지 않게 하려는 것이다.
        if [ -n "$${PODO_LEMONBOARD_API_KEY:-}" ]; then
          python3 tools/validate.py --contract --env "$$DEPLOY_ENV"
        else
          echo "PODO_LEMONBOARD_API_KEY 미설정 — data-sync 계약 검사 없이 진행한다"
          python3 tools/validate.py --env "$$DEPLOY_ENV"
        fi

        echo "── plan ($$DEPLOY_ENV) ──"
        python3 tools/plan.py --env "$$DEPLOY_ENV"

        # 인증은 Google OIDC ID 토큰이다. 저장하고 회전시킬 자격증명이 없다 — 메타데이터
        # 서버에서 이 빌드 SA 의 토큰을 그때그때 받아 붙이고, grape 가 구글 공개키로 서명을
        # 검증한다(수명 1시간). audience 는 호출할 바로 그 URL 이어야 한다 — 다른 서비스용으로
        # 발급된 토큰의 재사용을 막는 장치라, curriculum.yaml 의 grapeSyncApi 와 정확히 같아야 한다.
        # 환경마다 URL 이 다르므로 토큰도 환경마다 새로 받는다.
        SYNC_URL="$$(python3 - "$$DEPLOY_ENV" <<'PY'
        import sys, yaml
        env = sys.argv[1]
        print(yaml.safe_load(open('curriculum.yaml'))['spec']['environments'][env]['grapeSyncApi'])
        PY
        )"
        echo "sync 대상: $$SYNC_URL"

        export PODO_CURRICULUM_SYNC_TOKEN="$$(curl -sf -H 'Metadata-Flavor: Google' \
          "http://metadata/computeMetadata/v1/instance/service-accounts/default/identity?audience=$$SYNC_URL" || true)"

        if [ -z "$${PODO_CURRICULUM_SYNC_TOKEN}" ]; then
          echo "OIDC 토큰을 받지 못했다 — 메타데이터 서버 접근 실패."
          # 여기서 성공으로 끝내면 아무것도 배포하지 않은 채 빌드가 초록으로 남는다. 그러면
          # main 은 새 덱을, 학습자는 옛 덱을 보는 상태가 되고 그걸 알려 줄 신호가 없다.
          # 배포 파이프라인의 초록은 "main 이 실제로 반영됐다"는 뜻이어야 한다.
          exit 1
        fi
        python3 tools/apply.py --env "$$DEPLOY_ENV"

        done

  # 공개 카탈로그. prod 배포 뒤에만, prod 를 배포했을 때만 돈다 — 페이지가 말하는 것과
  # 수업이 보여주는 것이 어긋나지 않게.
  #
  # GitHub Actions 가 아니라 여기서 도는 이유: 이 조직의 Actions 는 self-hosted
  # day1-runner-respeak 에 묶여 있고, 그 러너는 이 레포의 잡을 집어가지 않는다(2026-08-19
  # 확인 — 15분간 runner 배정 없이 queued). ubuntu-latest 로 두면 IP 허용 목록이 체크아웃을
  # 막는다. 둘 다 안 되는 것을 워크플로 파일로 남겨 두는 것보다, 이미 도는 빌드에 스텝
  # 하나를 붙이는 편이 낫다. 새 트리거도 러너도 필요 없다.
  #
  # gh-pages 브랜치로 밀고 Pages 가 그 브랜치를 서빙한다. Pages 배포 액션(OIDC)을 쓰지
  # 않으므로 Actions 의존이 완전히 사라진다.
  #
  # allowFailure 는 지우지 말 것. 카탈로그는 배포 게이트가 아니다 — 사이트 빌드가 깨졌다고
  # 교재 배포를 빨갛게 만들면, 학습자에게 아무 영향도 없는 일 때문에 릴리스를 멈추게 된다.
  # 실패하면 직전 사이트가 그대로 남는다.
  - id: catalog
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    secretEnv: [CB_SECRET]
    allowFailure: true
    args:
      - -ceu
      - |
        case " $$(echo "$_DEPLOY_ENV" | tr ',' ' ') " in
          *" prod "*) ;;
          *) echo "prod 배포가 아니다 — 카탈로그를 건너뛴다"; exit 0 ;;
        esac

        pip install --break-system-packages --quiet -r tools/requirements.txt
        python3 tools/build-catalog.py --out /workspace/site
        touch /workspace/site/.nojekyll

        GH_TOKEN="$$(printf '%s' "$$CB_SECRET" | python3 -c 'import sys,json;print(json.load(sys.stdin)["GITHUB_PAT"])')"
        cd /workspace/site
        git init -q
        git config user.name  "podo-curriculum"
        git config user.email "podo-curriculum@users.noreply.github.com"
        git add -A
        git commit -q -m "catalog: $COMMIT_SHA"
        # 히스토리를 쌓지 않는다. 이 브랜치는 생성물이라 diff 를 볼 이유가 없고,
        # 매번 사이트 전체를 커밋하면 레포가 계속 커진다.
        git push -q --force           "https://x-access-token:$$GH_TOKEN@github.com/re-speak/podo-curriculum.git"           HEAD:gh-pages
        echo "카탈로그를 gh-pages 로 올렸다"
